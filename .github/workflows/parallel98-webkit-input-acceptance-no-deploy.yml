name: P98 exact-head native WebKit input and owner-source acceptance NO DEPLOY
on:
  push:
    branches: [fix/parallel98-webkit-input-reentry-HOLD]
  pull_request:
    branches: [fix/parallel95-webkit-source-restore-reentry-HOLD]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  inherited-full-node-and-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: P98 pinned native source, no protected application edits
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=851b83390a3d933e43a0685e592f882d9009e332
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse HEAD:public/outfit-board.js)" = 5668a4bc6da2e94fc13d23392cd7fb4981d0bc2d
          test "$(git rev-parse HEAD:research/main-thread-integration-1054/native-2d-preview.mjs)" = 0af20d49d87436683630d587ec0284c611cd3414
          test "$(git rev-parse HEAD:scripts/test-parallel95-native-source-restore-reentry.mjs)" = 51ca53e77573f916bfe06539f1be9687f2eded09
          test "$(git rev-parse HEAD:scripts/test-main51-real-app-owner-original-2d.mjs)" = 63cc9da00eaecbeb2576482dcae1528b44ea8189
          git diff --exit-code "$BASE" HEAD -- public/ supabase/ research/ tests/
          git diff --name-only "$BASE" HEAD | while IFS= read -r path; do
           case "$path" in
            scripts/test-parallel98-webkit-input-reentry.mjs|.github/workflows/parallel98-webkit-input-acceptance-no-deploy.yml|.github/workflows/parallel98-webkit-independent-confirmation-no-deploy.yml) ;;
            *) echo "P98 unauthorized changed path: $path"; exit 1;;
           esac
          done
          node --check scripts/test-parallel98-webkit-input-reentry.mjs
      - name: Install exact research dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Build native no-deploy application
        run: node scripts/build.mjs
      - name: Independent owner-click/selected-JPEG/lease security negatives
        run: node --test tests/main1054-m148-preview-click-ownership.test.mjs tests/main1054-m132-photo119-large-display-preview.test.mjs tests/native-original-jpeg-byte-attestation-92.test.mjs
      - name: Full inherited Node suite, strict serial, no skipped security checks
        run: node --test --test-concurrency=1 tests/*.cjs tests/*.mjs

  native-old-engine-process-soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: webkit
            processes: 12
          - engine: chromium
            processes: 6
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M51_ENGINE: ${{ matrix.engine }}
      P98_PROCESSES: ${{ matrix.processes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect exact native application and test source
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=851b83390a3d933e43a0685e592f882d9009e332
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse HEAD:public/outfit-board.js)" = 5668a4bc6da2e94fc13d23392cd7fb4981d0bc2d
          test "$(git rev-parse HEAD:research/main-thread-integration-1054/native-2d-preview.mjs)" = 0af20d49d87436683630d587ec0284c611cd3414
          test "$(git rev-parse HEAD:scripts/test-parallel95-native-source-restore-reentry.mjs)" = 51ca53e77573f916bfe06539f1be9687f2eded09
          test "$(git rev-parse HEAD:scripts/test-main51-real-app-owner-original-2d.mjs)" = 63cc9da00eaecbeb2576482dcae1528b44ea8189
          git diff --exit-code "$BASE" HEAD -- public/ supabase/ research/ tests/
          git diff --name-only "$BASE" HEAD | while IFS= read -r path; do
           case "$path" in
            scripts/test-parallel98-webkit-input-reentry.mjs|.github/workflows/parallel98-webkit-input-acceptance-no-deploy.yml|.github/workflows/parallel98-webkit-independent-confirmation-no-deploy.yml) ;;
            *) echo "P98 unauthorized changed path: $path"; exit 1;;
           esac
          done
          node --check scripts/test-parallel98-webkit-input-reentry.mjs
      - name: Install pinned v1.56.1 browser dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Build required PWA artifacts without deploying
        run: node scripts/build.mjs
      - name: Record installed browser version
        shell: bash
        run: |
          node --input-type=module - <<'JS'
          import {chromium,webkit} from 'playwright';
          const e=process.env.M51_ENGINE==='webkit'?webkit:chromium;
          const b=await e.launch({headless:true});
          console.log('P98_BROWSER_VERSION',JSON.stringify({engine:e.name(),version:b.version(),playwright:'1.56.1'}));
          await b.close();
          JS
      - name: Strict native no-retry original-JPEG click/tap/keyboard owner-source 320 390 430
        shell: bash
        run: |
          set -euo pipefail
          for trial in $(seq 1 "$P98_PROCESSES"); do
            echo "P98_NATIVE_TRIAL_BEGIN engine=$M51_ENGINE trial=$trial sha=$(git rev-parse HEAD)"
            node scripts/test-parallel98-webkit-input-reentry.mjs
            echo "P98_NATIVE_TRIAL_PASS engine=$M51_ENGINE trial=$trial widths=320,390,430"
          done
          echo "P98_NATIVE_FULL_PASS engine=$M51_ENGINE processes=$P98_PROCESSES noRetries=true"

  independent-modern-webkit-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      M51_ENGINE: webkit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect native source and test-only scope
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=851b83390a3d933e43a0685e592f882d9009e332
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse HEAD:public/outfit-board.js)" = 5668a4bc6da2e94fc13d23392cd7fb4981d0bc2d
          test "$(git rev-parse HEAD:research/main-thread-integration-1054/native-2d-preview.mjs)" = 0af20d49d87436683630d587ec0284c611cd3414
          test "$(git rev-parse HEAD:scripts/test-parallel95-native-source-restore-reentry.mjs)" = 51ca53e77573f916bfe06539f1be9687f2eded09
          test "$(git rev-parse HEAD:scripts/test-main51-real-app-owner-original-2d.mjs)" = 63cc9da00eaecbeb2576482dcae1528b44ea8189
          git diff --exit-code "$BASE" HEAD -- public/ supabase/ research/ tests/
          git diff --name-only "$BASE" HEAD | while IFS= read -r path; do
           case "$path" in
            scripts/test-parallel98-webkit-input-reentry.mjs|.github/workflows/parallel98-webkit-input-acceptance-no-deploy.yml|.github/workflows/parallel98-webkit-independent-confirmation-no-deploy.yml) ;;
            *) echo "P98 unauthorized changed path: $path"; exit 1;;
           esac
          done
          node --check scripts/test-parallel98-webkit-input-reentry.mjs
      - name: Install independent modern WebKit and native dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.65.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Install version-matched disposable WebKit binary
        run: npx playwright install --with-deps webkit
      - name: Modern engine version and native application build
        shell: bash
        run: |
          node scripts/build.mjs
          node --input-type=module - <<'JS'
          import {webkit} from 'playwright';
          const b=await webkit.launch({headless:true});
          console.log('P98_MODERN_WEBKIT_VERSION',JSON.stringify({playwright:'1.65.1',engine:webkit.name(),version:b.version()}));
          await b.close();
          JS
      - name: Six fresh modern WebKit processes at 320 390 430, strict event delivery
        shell: bash
        run: |
          set -euo pipefail
          for trial in $(seq 1 6); do
            echo "P98_MODERN_BEGIN trial=$trial sha=$(git rev-parse HEAD)"
            node scripts/test-parallel98-webkit-input-reentry.mjs
            echo "P98_MODERN_PASS trial=$trial widths=320,390,430"
          done
          echo "P98_MODERN_6_OF_6_PASS noRetries=true"
