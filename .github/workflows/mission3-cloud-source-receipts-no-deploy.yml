name: Mission 3 original photo and reviewed cutout cloud SHA receipts — NO DEPLOY
on:
  push:
    branches: [research/mission3-cloud-source-receipt-integrity-20261110-HOLD]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-source-receipt-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce exact verified Mission 3 parent and no deployment or auth changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=103b4be39655fa2fb2ef182a412222d769fe5eee
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --exit-code "$BASE" HEAD -- public/auth.js public/app.js public/photo-import.js public/cloud-backup-engine.js supabase public/local-worker.mjs public/recognition-engine.mjs
          git diff --name-only "$BASE" HEAD | while read -r p; do
            case "$p" in
              public/cloud-backup.js|tests/mission3-cloud-source-receipts.test.cjs|research/mission3-cloud-source-receipts/REPORT.md|.github/workflows/mission3-cloud-source-receipts-no-deploy.yml) ;;
              *) echo "Unexpected Mission 3 source receipt path: $p"; exit 1 ;;
            esac
          done
      - name: Install pinned synthetic storage and real browser engines
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Exact-parent reproduction of wrong original/cutout SHA cloud acceptance
        run: |
          git worktree add --detach /tmp/closet-mission3-source-parent 103b4be39655fa2fb2ef182a412222d769fe5eee
          CLOUD_SOURCE_ROOT=/tmp/closet-mission3-source-parent EXPECT_BASELINE=1 node --test tests/mission3-cloud-source-receipts.test.cjs
      - name: Verify repaired owner-private SHA receipts fail closed
        run: node --test tests/mission3-cloud-source-receipts.test.cjs
      - name: Build and run all application regressions in serial
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Real Chromium native private cutout backup and second browser restore
        run: |
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos commons-0002
          node scripts/test-outfit-backup-compatibility-browser.mjs benchmark/mission3-source-receipts-backup
      - name: Chromium and WebKit native original photo to private closet and styling 320 390 430
        run: node scripts/test-native-canonical-original-167-browser.mjs
      - name: Chromium and WebKit mobile recovery and accessibility
        run: node scripts/test-family-reliability-mobile.mjs
      - name: Persist synthetic-owner screenshots and app receipts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission3-source-receipt-integrity-evidence-HOLD
          path: |
            benchmark/mission3-source-receipts-backup/
            benchmark/native-canonical-closet-style-167/
            benchmark/family-reliability-mobile/
          retention-days: 14
