name: M4 P1 closet layer-count save rollback HOLD no deploy
on:
  push:
    branches: [research/main1054-p1-closet-layer-save-rollback-HOLD]
permissions:
  contents: read
jobs:
  closet-layers:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Freeze exact parent and focused change surface
        shell: bash
        run: |
          set -euo pipefail
          BASE=7daf216df7c8038bf405ed0352757125dfd533ad
          test "${{ github.run_attempt }}" = 1
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --check "$BASE" HEAD
          while IFS= read -r file; do
            case "$file" in
              public/closet-browser.js|tests/main1054-closet-layer-count-rollback.test.cjs|scripts/main1054-closet-layer-browser.cjs|.github/workflows/main1054-closet-layer-save-no-deploy.yml) ;;
              *) echo "OUT OF SCOPE $file"; exit 1 ;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
          node --check public/closet-browser.js
      - name: Layer rejection regression on actual original application handler
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/main1054-closet-layer-count-rollback.test.cjs | tee "$RUNNER_TEMP/layer-focused.tap"
          grep -Eq '^# fail 0$' "$RUNNER_TEMP/layer-focused.tap"
      - name: Build production app and run complete Node suite
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs | tee "$RUNNER_TEMP/layer-full.tap"
          grep -Eq '^# fail 0$' "$RUNNER_TEMP/layer-full.tap"
          grep -Eq '^# skipped 0$' "$RUNNER_TEMP/layer-full.tap"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m4-closet-layer-save-HOLD
          path: |
            ${{ runner.temp }}/layer-focused.tap
            ${{ runner.temp }}/layer-full.tap
            ${{ runner.temp }}/layer-browser.json
          if-no-files-found: ignore
