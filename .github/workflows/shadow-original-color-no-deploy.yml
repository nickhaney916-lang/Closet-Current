name: Original shadow-color independent synthetic QA - NO DEPLOY
on:
  push:
    branches: [qa/shadow-resistant-original-color-20261023]
permissions:
  contents: read
jobs:
  node-source-locked:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Guard production, model, benchmark and cloud source trees
        run: |
          git diff --exit-code 54c9e29ede069a05d1268e003f80cbda043c7d6a HEAD -- public supabase benchmark
          if grep -nE '(fetch|XMLHttpRequest)[[:space:]]*\(|api[.]openai|replicate[.]com' research/original-color/shadow-corroborated-color.mjs; then exit 1; fi
      - name: Compile original app without modifications
        run: node scripts/build.mjs
      - name: All existing recognition, crop and offline indexing Node tests
        run: node --test tests/*.test.cjs tests/*.test.mjs
      - name: Exact synthetic before/after results by clothing category
        run: node scripts/benchmark-shadow-original-colors.mjs
      - name: Label research-only evidence
        if: always()
        run: |
          mkdir -p artifacts/original-shadow
          printf '%s\n' "$GITHUB_SHA" > artifacts/original-shadow/research-commit.txt
          echo 'SYNTHETIC RGB ONLY. NOT REAL PHOTO RECOGNITION ACCURACY. NO DEPLOY.' > artifacts/original-shadow/READ-ME-FIRST.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-shadow-synthetic-category-benchmark-NO-DEPLOY
          path: artifacts/original-shadow/
          retention-days: 7
  chromium-webkit-color:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Install test runner only
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - name: Verify generated JPEG original-source palette in mobile browsers
        run: node scripts/test-shadow-original-color-mobile.mjs
      - name: Flag synthetic emulation only
        if: always()
        run: |
          mkdir -p artifacts/original-shadow-browser
          printf '%s\n' "$GITHUB_SHA" > artifacts/original-shadow-browser/source-sha.txt
          echo 'NO CUSTOMER PHOTOS OR REAL AUTH. HEADLESS VIEWPORT TESTS ARE NOT PHYSICAL PHONES.' > artifacts/original-shadow-browser/NO-DEPLOY.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-shadow-chromium-webkit-QA-NO-DEPLOY
          path: artifacts/original-shadow-browser/
          retention-days: 7
