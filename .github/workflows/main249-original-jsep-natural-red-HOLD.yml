name: MAIN249 genuine natural WebKit JSEP failed-attempt native class HOLD
on:
  push:
    branches: [research/main249-original-jsep-red-taxonomy-capture-HOLD]
permissions:
  contents: read
jobs:
  exact-source-and-security:
    name: M249 genuine immutable original source and entire inherited privacy/security
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require exactly four added diagnosis paths and unchanged installed real model/owner
        shell: bash
        run: |
          set -euo pipefail
          BASE=c1edc0d53df7c003678f566d10cb40230b5836d8
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE" HEAD)" = "$(printf '%s\n' '.github/workflows/main249-original-jsep-natural-red-HOLD.yml' 'scripts/main249-original-jsep-natural-red-ledger.mjs' 'scripts/test-main249-original-jsep-natural-red-cohort.mjs' 'tests/main249-original-jsep-natural-red-ledger.test.mjs')"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          test "$(git rev-parse HEAD:scripts/test-main249-original-failed-jsep-browser.mjs)" = c6f4d42e9e0b26c7adb727b1d1ff1c5999565def
          node --check scripts/main249-original-jsep-natural-red-ledger.mjs
          node --check scripts/test-main249-original-jsep-natural-red-cohort.mjs
          node --test tests/main249-original-jsep-natural-red-ledger.test.mjs
          M249_STRESS_SOURCE_ONLY=1 node scripts/test-main249-original-jsep-natural-red-cohort.mjs
      - name: Pinned genuine no-deploy runtime and privacy dependencies
        run: npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Original full offline app/owner/photo/private-source/v4 backup and security
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm view onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 dist.integrity)" = "sha512-0uS76OPgH0hWCPrFKlL8kYVV7ckM7t/36HfbgoFw6Nd0CZVVbQC4PkrR8mBX8LtNUFZO25IQBqV2Hx2ho3FlbQ=="
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  original-native-browsers:
    name: M249 real source JSEP error taxonomy ${{ matrix.engine }} ${{ matrix.width }}px cohort ${{ matrix.batch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {engine: webkit, width: 320, batch: a, count: 4}
          - {engine: webkit, width: 320, batch: b, count: 4}
          - {engine: webkit, width: 320, batch: c, count: 4}
          - {engine: webkit, width: 320, batch: d, count: 4}
          - {engine: webkit, width: 320, batch: e, count: 4}
          - {engine: webkit, width: 320, batch: f, count: 4}
          - {engine: webkit, width: 430, batch: a, count: 4}
          - {engine: webkit, width: 430, batch: b, count: 4}
          - {engine: chromium, width: 320, batch: control, count: 2}
          - {engine: chromium, width: 430, batch: control, count: 2}
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M249_STRESS_ENGINE: ${{ matrix.engine }}
      M249_STRESS_WIDTH: ${{ matrix.width }}
      M249_STRESS_BATCH: ${{ matrix.batch }}
      M249_STRESS_COUNT: ${{ matrix.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original source and error taxonomy independent no-false-classification
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor c1edc0d53df7c003678f566d10cb40230b5836d8 HEAD
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          node --test tests/main249-original-jsep-natural-red-ledger.test.mjs
          M249_STRESS_SOURCE_ONLY=1 node scripts/test-main249-original-jsep-natural-red-cohort.mjs
      - name: Install pinned original Transformers JSEP and native browser dependencies
        run: npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: All genuine fresh source-verified JSEP processes, no retries and each RED retained
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-main249-original-jsep-natural-red-cohort.mjs
      - name: Preserve bounded original JSEP error taxonomy and per-process receipts on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M249-original-JSEP-${{ matrix.engine }}-${{ matrix.width }}-${{ matrix.batch }}-HOLD
          path: benchmark/main249-original-jsep-native-errors/*.json
          if-no-files-found: ignore
          retention-days: 14
