name: Mission 3 large-wardrobe clean cloud marker and stale status — NO DEPLOY
on:
  push:
    branches: [research/mission3-clean-sync-large-wardrobe-20261110-HOLD]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  large-wardrobe-clean-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin exact verified Mission 3 source receipt parent and no deploy scope
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=fd905910984c08647e26d212e071f85695ba4cc8
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --exit-code "$BASE" HEAD -- public/auth.js public/app.js public/photo-import.js public/cloud-backup-engine.js supabase public/local-worker.mjs public/recognition-engine.mjs
          git diff --name-only "$BASE" HEAD | while read -r p; do
            case "$p" in
              public/cloud-backup.js|tests/mission3-clean-cloud-marker.test.cjs|research/mission3-clean-sync-wardrobe/REPORT.md|.github/workflows/mission3-clean-sync-wardrobe-no-deploy.yml) ;;
              *) echo "Unexpected Mission 3 clean sync path: $p"; exit 1 ;;
            esac
          done
      - name: Install pinned tests and Chromium/WebKit
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Baseline proof 1,000 JPEG getAll clone and incorrect clean status
        run: |
          git worktree add --detach /tmp/closet-mission3-clean-parent fd905910984c08647e26d212e071f85695ba4cc8
          CLOUD_SOURCE_ROOT=/tmp/closet-mission3-clean-parent EXPECT_BASELINE=1 node --test tests/mission3-clean-cloud-marker.test.cjs
      - name: Verify revised cheap marker, full dirty snapshot, migration and safe restore
        run: node --test tests/mission3-clean-cloud-marker.test.cjs
      - name: Build and complete full serial Node regression
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Real Chromium private original/cutout backup and same-owner cross-browser restore
        run: |
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos commons-0002
          node scripts/test-outfit-backup-compatibility-browser.mjs benchmark/mission3-clean-sync-private-backup
      - name: Real Chromium/WebKit mobile canonical photo review and three owned looks
        run: node scripts/test-native-canonical-original-167-browser.mjs
      - name: Real Chromium/WebKit mobile wardrobe edit quota resilience and accessibility
        run: node scripts/test-family-reliability-mobile.mjs
      - name: Save synthetic-only acceptance receipts no deployment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission3-clean-cloud-large-wardrobe-evidence-HOLD
          path: |
            benchmark/mission3-clean-sync-private-backup/
            benchmark/native-canonical-closet-style-167/
            benchmark/family-reliability-mobile/
          retention-days: 14
