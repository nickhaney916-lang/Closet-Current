name: LABEL59 no automatic garment category or color preselection NO DEPLOY
on:
  push:
    branches:
      - research/model-label-no-prefill-59-main-20261105-HOLD
  pull_request:
    paths:
      - 'research/multi-garment-capture-01/scene-class-guard-32.mjs'
      - 'research/multi-garment-capture-01/review-ui.mjs'
      - 'tests/scene-class-guard-32.test.mjs'
      - 'tests/auto-detection-confirmed-crop-55.test.mjs'
      - 'tests/model-label-no-prefill-59.test.mjs'
      - 'scripts/test-multi-garment-capture-01-browser.mjs'
      - 'research/model-label-no-prefill-59/**'
      - '.github/workflows/model-label-no-prefill-59-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  enforce-owner-label-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Strict verified BOUNDS58 parent and research-only allowed path audit
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 3f0bb1b5fb0ccc90ad8f74c024dfbab8ea889d36 HEAD
          git diff --name-only 3f0bb1b5fb0ccc90ad8f74c024dfbab8ea889d36 HEAD > /tmp/label59-files
          while IFS= read -r path; do
            case "$path" in
              research/multi-garment-capture-01/scene-class-guard-32.mjs|research/multi-garment-capture-01/review-ui.mjs|tests/scene-class-guard-32.test.mjs|tests/auto-detection-confirmed-crop-55.test.mjs|tests/model-label-no-prefill-59.test.mjs|scripts/test-multi-garment-capture-01-browser.mjs|research/model-label-no-prefill-59/*|.github/workflows/model-label-no-prefill-59-no-deploy.yml) ;;
              *) echo "BLOCKED production/staging or unrelated edit: $path"; exit 1 ;;
            esac
          done < /tmp/label59-files
      - name: Install pinned test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Build full app and run entire inherited plus LABEL59 adversarial Node tests
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Six real licensed original-photo manual-private closet browser regressions
        run: node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Six native untrusted high-score detector label no-prefill and owner-private browser cases
        run: DETECTOR57=1 node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Six native 1000-proposal model flood no-prefill and owner-private browser cases
        run: DETECTOR58=1 node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Audit real native stress screenshots source and pixel SHA dimensions
        run: node scripts/audit-bounded-detection-58-browser.mjs
      - name: Archive sanitized browser evidence without licensed original photo copies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LABEL59-native-no-auto-prefill-private-evidence-HOLD
          path: |
            benchmark/multi-garment-capture-01/acceptance.json
            benchmark/detector-proposal-native-57/acceptance.json
            benchmark/bounded-detection-review-58/acceptance.json
            benchmark/detector-proposal-native-57/*.png
            benchmark/bounded-detection-review-58/*.png
          if-no-files-found: warn
          retention-days: 14
