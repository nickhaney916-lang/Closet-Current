name: MAIN1054 independent native correction research HOLD
on:
  pull_request:
    branches: [research/main1054-unified-autonomous-maintenance-HOLD]
permissions:
  contents: read
jobs:
  correction:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/main1054-native-correction-research-HOLD'
    strategy:
      fail-fast: false
      matrix:
        lane: [correction10, style11]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact accepted parent and only isolated test changes
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.base.sha }}" = 5f9eb92dc45185889c5bf8f7f7ad770a15f78656
          git merge-base --is-ancestor 5f9eb92dc45185889c5bf8f7f7ad770a15f78656 HEAD
          test "$(git rev-parse HEAD^)" = fd921db5366b0448c52fd113a8fb96c174ce5aad
          git diff --exit-code fd921db5366b0448c52fd113a8fb96c174ce5aad HEAD -- . ':(exclude)scripts/test-native-correction-10-browser.mjs' ':(exclude).github/workflows/main1054-native-correction-research-HOLD.yml'
          printf '%s\n' 'scripts/test-native-correction-10-browser.mjs' 'scripts/test-native-style-correction-11-browser.mjs' '.github/workflows/main1054-native-correction-research-HOLD.yml' | LC_ALL=C sort > /tmp/expected
          git diff --name-only 5f9eb92dc45185889c5bf8f7f7ad770a15f78656 HEAD | LC_ALL=C sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          test "$(git rev-parse fd921db5366b0448c52fd113a8fb96c174ce5aad:scripts/test-native-correction-10-browser.mjs)" = fdd13edc46c7f1fbb381242cfed51d2a4b47a785
          test "$(git rev-parse HEAD:scripts/test-native-correction-10-browser.mjs)" = fcdbd5402a5299c340e68c52d9707fa7f362d542
          test "$(git rev-parse HEAD:scripts/test-native-style-correction-11-browser.mjs)" = c253539a6916e3acc58f6ce343f180d2acb0d3f8
          test "$(git rev-parse HEAD:scripts/audit-native-correction-10.mjs)" = 51ab9e8f074ab0ed24706927ba39b7ff4738ca9a
          test "$(git rev-parse HEAD:scripts/audit-native-style-correction-11.mjs)" = 6658e7b127ba1200bbc53e81bf4c604294addfa0
          test "$(git rev-parse HEAD:.github/workflows/main1054-unified-autonomous-maintenance-HOLD.yml)" = 82e465f2ecb437674bf4dd2fe56dfe8df76c60d5
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Syntax and focused source correction unit regression
        run: |
          node --check scripts/test-native-correction-10-browser.mjs
          node --check scripts/test-native-style-correction-11-browser.mjs
          node --test tests/style-owned-live-03.test.mjs tests/native-correction-cas-10.test.mjs
      - run: node scripts/build.mjs
      - id: donor
        name: Pin exact untouched 163-bone human + original photo donor PR541
        run: |
          set -eu
          git fetch --no-tags origin df6885d6011cb33fb22dceb81a08f35a0ac4dd61 53f2ad344dc56a1477e343531c423aed0e66c17d dd6bac3fa9ff640d4f562cf925337440bdb5cf8f 3a572193987cb29389727426136c6eb3ac326783 dfb40889c4c1221fb1833b859e8a11ef38aeb76e
          git worktree add --detach .native05-donor-541 df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          git config --global --add safe.directory "$GITHUB_WORKSPACE/.native05-donor-541"
          test "$(git -C .native05-donor-541 rev-parse HEAD)" = df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          ln -s ../node_modules .native05-donor-541/node_modules
          cd .native05-donor-541
          # Acquire only the two pinned public originals; respect transient HTTP backoff.
          # Never replace with a thumbnail or accept a changed publisher response.
          fetch_original() {
            url="$1"; output="$2"; expected="$3"
            mkdir -p "$(dirname "$output")"
            if [ ! -f "$output" ]; then
              curl --fail --silent --show-error --location --retry 3 --retry-max-time 180 --max-time 40 \
                --user-agent 'ClosetCurrent-SourceTrue-IndependentGarmentQA/1.0' \
                --header 'Accept: image/jpeg' --output "$output.tmp" "$url"
              printf '%s  %s\n' "$expected" "$output.tmp" | sha256sum -c -
              mv "$output.tmp" "$output"
            fi
            printf '%s  %s\n' "$expected" "$output" | sha256sum -c -
          }
          fetch_original 'https://upload.wikimedia.org/wikipedia/commons/5/5a/Jeans.jpg' benchmark/three-d-31/original-jeans.jpg b316902ad85e8ff46b164ceb7f2c38d3c1424c9d789703e0267e3dfce68fbe1c
          fetch_original 'https://upload.wikimedia.org/wikipedia/commons/9/92/Denimjeans2.JPG' benchmark/three-d-37/original-denimjeans2.jpg aa7f288055874773b87cd38b5b4e473b532920f61c2d17cb0ccd7872466c444a
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
          test -f benchmark/work47/manifest.json
          node --test tests/outfit-3d-01.test.mjs
      - if: matrix.lane == 'correction10'
        name: Original correction, stale CAS, source-to-3D and backup integrity
        run: |
          node scripts/test-native-correction-10-browser.mjs
          node scripts/audit-native-correction-10.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const co=JSON.parse(readFileSync('benchmark/native-correction-10-audit/acceptance.json','utf8'));
          assert.equal(co.verifiedBrowserScreenshots,42);
          assert.equal(co.staleSecondTabCASRefusedAtomically,true);
          assert.equal(co.verifiedOriginalJPEGSourceImmutable,true);
          assert.equal(co.realSignedUsersVerified,false);
          assert.equal(co.releaseAuthorized,false);
          assert.equal(co.familyAlpha,'HOLD');
          NODE
      - if: matrix.lane == 'style11'
        name: Actual corrected garment to three owned looks and stale draft recovery
        run: |
          node scripts/test-native-style-correction-11-browser.mjs
          node scripts/audit-native-style-correction-11.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const ci=JSON.parse(readFileSync('benchmark/native-style-correction-11-audit/acceptance.json','utf8'));
          assert.equal(ci.priority,'NATIVE-STYLE-CORRECTION-INTEGRATION-11');
          assert.equal(ci.actualAppBrowserCases,6);
          assert.equal(ci.genuineMobileBrowserScreenshots,60);
          assert.equal(ci.originalPhotoCategoryCorrectionIntegrated,true);
          assert.equal(ci.staleThreeOwnedOutfitsBlockedWithoutLosingUnsavedBoard,true);
          assert.equal(ci.savedOriginalOwnerOutfitAndSourceSHAUnchanged,true);
          assert.equal(ci.integrationGalleries.length,3);
          assert.equal(ci.realSignedRLS,false);
          assert.equal(ci.arbitraryPhoto3DReady,false);
          assert.equal(ci.releaseAuthorized,false);
          assert.equal(ci.familyAlpha,'HOLD');
          NODE
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-correction-${{ matrix.lane }}-HOLD
          path: |
            benchmark/native-correction-10/
            benchmark/native-correction-10-audit/
            benchmark/native-style-correction-11/
            benchmark/native-style-correction-11-audit/
          if-no-files-found: warn
          retention-days: 14
