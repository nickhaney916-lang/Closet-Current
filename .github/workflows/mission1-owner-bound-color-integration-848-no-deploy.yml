name: Mission 1 P848 owner-bound color integrated with P847 learning — NO DEPLOY
on:
  push:
    branches: [research/mission1-owner-bound-color-integration-848-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mission1-p848-owner-color-HOLD
  cancel-in-progress: true
jobs:
  pinned-P847-native-no-deploy-HOLD:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact P847 parent, 10-path scope and prior owner/learning protection
        shell: bash
        run: |
          set -euo pipefail
          BASE=bb524ab4b52437f97db30ba9030c69fbcf0f4835
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD >/tmp/p848-files
          cat /tmp/p848-files
          test "$(wc -l </tmp/p848-files)" -eq 10
          while IFS= read -r path; do
            case "$path" in
              public/outfit-capture.js|public/outfit-worker.mjs|public/garment-color-76.mjs|tests/parallel76-garment-color.test.mjs|tests/mission1-color-owner-learning-integration-848.test.mjs|scripts/test-parallel76-color-browser.mjs|scripts/compare-parallel76-color.mjs|scripts/audit-parallel76-lawful-sources.mjs|research/mission1-owner-bound-color-integration-848/REPORT.md|.github/workflows/mission1-owner-bound-color-integration-848-no-deploy.yml) ;;
              *) echo "P848 UNSCOPED PATH $path"; exit 1 ;;
            esac
          done </tmp/p848-files
          test -z "$(git diff --name-only "$BASE" HEAD -- public/app.js public/clothing-memory.js public/photo-check.js public/photo-color.js public/local-worker.mjs public/auth.js public/outfit-segmentation.mjs benchmark supabase)"
          grep -Fqx 'const reviewFirst836=true;' <(grep '^const reviewFirst836=' public/app.js)
          grep -Fq 'let saveInFlight=false;' public/app.js
          grep -Fq 'function learningScope72()' public/app.js
          grep -Fq 'scope.ownerId===owner' public/app.js
          grep -Fq 'purgePhotoQualityHints845' public/app.js
          grep -Fq 'const outfitColor76=outfitUnits70' public/outfit-capture.js
          grep -Fq 'sourceProof===p.reconciliation70?.sourceSha256' public/outfit-capture.js
          grep -Fq 'FAMILY ALPHA HOLD #255' research/mission1-owner-bound-color-integration-848/REPORT.md
          echo M1_P848_EXACT_PARENT_10_PATH_OWNER_CONSENT_NO_DEPLOY_PASS
      - name: Ephemeral test dependencies only
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Actual source color/owner safety, synthetic numeric comparisons, builds and full native tests
        run: |
          set -euo pipefail
          node --check public/outfit-capture.js
          node --check public/outfit-worker.mjs
          node --check public/garment-color-76.mjs
          node --check tests/mission1-color-owner-learning-integration-848.test.mjs
          node --test tests/parallel76-garment-color.test.mjs tests/mission1-color-owner-learning-integration-848.test.mjs
          node scripts/compare-parallel76-color.mjs
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
          echo M1_P848_FULL_NATIVE_BUILDS_PASS
  actual-browser-source-review-HOLD:
    needs: [pinned-P847-native-no-deploy-HOLD]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install genuine desktop Chromium+WebKit, not real mobile devices
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Build local web assets, no deployment
        run: node scripts/build.mjs
      - name: Source-hash protected opt-in color inside #70 paired owner review (320/390/430)
        run: |
          set -euo pipefail
          node scripts/test-parallel76-color-browser.mjs
      - name: Inherited P847 explicit owner learning, P846 matched shoe unit and P844/P843 review
        run: |
          set -euo pipefail
          node scripts/test-m1-owner-learning-integration-847.mjs
          node scripts/test-m1-owner-pair-admission-846.mjs
          node scripts/test-m1-review-save-lifecycle-844.mjs parent
          node scripts/test-m1-review-save-lifecycle-844.mjs candidate
          node scripts/test-m1-review-first-default-843.mjs
          node scripts/test-m1-owner-review-editor-839.mjs
          node scripts/test-parallel73-photo-quality-browser.mjs
          echo M1_P848_CHROMIUM_WEBKIT_OWNER_COLOR_NO_DEPLOY_PASS
  licensed-original-sha-HOLD:
    needs: [pinned-P847-native-no-deploy-HOLD]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      P76_PHOTO_IDS: commons-0003,commons-0021,commons-0049,commons-0082
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch four properly licensed immutable public JPEGs, no upload
        run: |
          set -euo pipefail
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos "$P76_PHOTO_IDS"
          node scripts/audit-parallel76-lawful-sources.mjs
          echo M1_P848_LICENSED_REAL_ORIGINAL_BYTES_VERIFIED_COLOR_TRUTH_UNKNOWN
