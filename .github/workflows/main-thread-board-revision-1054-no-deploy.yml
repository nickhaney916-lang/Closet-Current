name: "MAIN1054 M13 native outfit board revision integrity — NO DEPLOY"
on:
  push:
    branches: [research/main-thread-board-revision-1054-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: main1054-m13-board-revision-hold
  cancel-in-progress: true
jobs:
  immutable-source-and-native-regression-NO-DEPLOY:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: M12 exact immutable parent and five isolated test or research files
        shell: bash
        run: |
          set -euo pipefail
          BASE=edc486c36fe6194fa30c89690c850306ceadfe92
          git merge-base --is-ancestor "$BASE" HEAD
          CHANGED="$(git diff --name-only "$BASE" HEAD)"
          test "$(printf '%s\n' "$CHANGED" | wc -l)" -eq 5
          while IFS= read -r path; do
            case "$path" in
              research/main-thread-integration-1054/source-to-outfit.mjs|\
              research/main-thread-integration-1054/source-to-outfit.test.mjs|\
              scripts/test-main1054-native-preview-browser.mjs|\
              research/main-thread-integration-1054/MILESTONE13.md|\
              .github/workflows/main-thread-board-revision-1054-no-deploy.yml) ;;
              *) echo "M13_SCOPE_VIOLATION $path" >&2; exit 1 ;;
            esac
          done <<< "$CHANGED"
          git diff --exit-code "$BASE" HEAD -- public/ supabase/ benchmark/ package.json package-lock.json
          test "$(git hash-object public/dual-panel-82.mjs)" = "1a6062877be41a831cb4724448d482405ce75727"
          node --check research/main-thread-integration-1054/source-to-outfit.mjs
          node --check research/main-thread-integration-1054/source-to-outfit.test.mjs
          grep -q "assertBoard" research/main-thread-integration-1054/source-to-outfit.mjs
          grep -q "outfit board changed during source verification" research/main-thread-integration-1054/source-to-outfit.mjs
          echo "M13 NATIVE BOARD REVISION ONLY; FAMILY ALPHA HOLD; NO DEPLOY"
      - name: Install native dependencies without package-lock mutation
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Build existing PWA and execute actual native source-to-outfit revision tests
        run: |
          node scripts/build.mjs
          node --test research/main-thread-integration-1054/source-to-outfit.test.mjs
      - name: Inherited serial native privacy and photographed wardrobe regression
        run: node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Retain Family Alpha release block
        run: |
          echo "Family Alpha #255 OPEN HOLD; NO MERGE / NO DEPLOY / NO HOSTED PRIVACY DATA"
  original-photo-2d-and-p880-desktop-browser-NO-DEPLOY:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Immutable parent, five research files, P880 review preserved
        shell: bash
        run: |
          set -euo pipefail
          BASE=edc486c36fe6194fa30c89690c850306ceadfe92
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE" HEAD | wc -l)" -eq 5
          git diff --exit-code "$BASE" HEAD -- public/ supabase/
          test "$(git hash-object public/dual-panel-82.mjs)" = "1a6062877be41a831cb4724448d482405ce75727"
      - name: Install only browser test runtime
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: npx playwright install --with-deps chromium webkit
      - name: Native real-code Photo Review optional P880 policy
        run: node scripts/test-main1054-dual-review-browser.mjs
      - name: Signed owner original-photo 2D fallback native browser
        run: node scripts/test-main1054-native-preview-browser.mjs
      - name: Board revision and exact owner native source acceptance
        run: node --test research/main-thread-integration-1054/source-to-outfit.test.mjs
      - name: Assert no fabricated model or real-phone/hosted claims
        run: |
          node -e "const r=require('./benchmark/main1054-dual-policy-browser/results.json'); if(r.status!=='PASS'||r.total!==54||r.genuineModelsRun!==false||r.physicalPhones!==false||r.hostedCloud!==false||r.autoSaved!==false||r.releaseAuthorized!==false||r.familyAlpha!=='HOLD')process.exit(1);console.log('M13_2D_AND_OWNER_REVIEW_POLICY',r.total)"
          echo "No real iPhone, cloud owner RLS, independently blind photo labels or 3D release permission"
