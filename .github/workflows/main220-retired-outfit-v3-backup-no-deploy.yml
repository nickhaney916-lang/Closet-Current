name: MAIN220 retired owner outfit v3 backup lifecycle source fence NO DEPLOY HOLD
on:
  push:
    branches: [research/main220-retired-outfit-board-backup-admission-HOLD]
  pull_request:
    branches: [research/main219-genuine-photo119-postcommit-browser-lease-HOLD]
permissions:
  contents: read
jobs:
  retired-source-outfit-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable M219 signed owner original and allowlist
        shell: bash
        run: |
          set -euo pipefail
          BASE=8265320886faf25c0bda8b336a6ab6ba81a387a1
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | while IFS= read -r file; do
            case "$file" in
              public/native-default-verified-backup-export-m3.mjs|public/native-default-atomic-import-m3.mjs|tests/main220-retired-outfit-backup-lifecycle.test.mjs|.github/workflows/main220-retired-outfit-v3-backup-no-deploy.yml) ;;
              *) echo "M220 unauthorized changed source path $file"; exit 1 ;;
            esac
          done
          test "$(git rev-parse 8265320886faf25c0bda8b336a6ab6ba81a387a1:public/native-default-verified-backup-export-m3.mjs)" = 741e736ca107169c9e9861d803a49c2e6166e20b
          test "$(git rev-parse HEAD:public/native-default-verified-backup-export-m3.mjs)" = af15a9c08a81aa4064d1e5d1c4f0af0d855582c9
          test "$(git rev-parse 8265320886faf25c0bda8b336a6ab6ba81a387a1:public/native-default-atomic-import-m3.mjs)" = 5a4b2f2e98a9c30a5fd0787ffbb8c9546aacc408
          test "$(git rev-parse HEAD:public/native-default-atomic-import-m3.mjs)" = 1a4cf649a3656f604c4f3e1d2b1efd7910179edc
          test "$(git rev-parse HEAD:public/native-reviewed-private-save-167.mjs)" = fa01c862444c05f8e307f4e7447a75a9ede1ab5e
          test "$(git rev-parse HEAD:public/native-reviewed-shared-original-157.mjs)" = 2108bdc2f0a67b8e356ea8c47d0042512ca618bf
          test "$(git rev-parse HEAD:public/native-2d-preview-p99.mjs)" = b2e26e8b0538b4d344b498bfb55fd74d7f65eb0e
          node --check tests/main220-retired-outfit-backup-lifecycle.test.mjs
      - name: Install pinned native test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund fake-indexeddb@6.2.4
      - name: True private IndexedDB source lifecycle v3 current and saved outfit export/import
        run: node --test tests/main220-retired-outfit-backup-lifecycle.test.mjs
      - name: Full inherited signed owner/photo backup Node dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Unmodified real original legacy v3 atomic backup and PHOTO119 tests
        run: |
          node --test tests/mission3-default-atomic-backup-source-guard.test.mjs
          node --test tests/main204-restore-source-revocation.test.mjs
          node --test tests/main211-retired-shared-original-import.test.mjs
          node --test tests/main217-photo119-postcommit-session-revoke.test.mjs
      - name: Full inherited original native PWA build and privacy/source/recognition Node suite
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  true-native-owner-restored-outfit:
    name: Original 2D/private restored outfit accepted in actual ${{ matrix.engine }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      P99_ENGINE: ${{ matrix.engine }}
      M51_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable M219 original/photo and only M220 two-function changes
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=8265320886faf25c0bda8b336a6ab6ba81a387a1
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | while IFS= read -r file; do
            case "$file" in
              public/native-default-verified-backup-export-m3.mjs|public/native-default-atomic-import-m3.mjs|tests/main220-retired-outfit-backup-lifecycle.test.mjs|.github/workflows/main220-retired-outfit-v3-backup-no-deploy.yml) ;;
              *) echo "M220 unrelated product source change $file"; exit 1 ;;
            esac
          done
          test "$(git rev-parse HEAD:public/native-default-verified-backup-export-m3.mjs)" = af15a9c08a81aa4064d1e5d1c4f0af0d855582c9
          test "$(git rev-parse HEAD:public/native-default-atomic-import-m3.mjs)" = 1a4cf649a3656f604c4f3e1d2b1efd7910179edc
          test "$(git rev-parse HEAD:public/native-reviewed-private-save-167.mjs)" = fa01c862444c05f8e307f4e7447a75a9ede1ab5e
          test "$(git rev-parse HEAD:public/native-2d-preview-p99.mjs)" = b2e26e8b0538b4d344b498bfb55fd74d7f65eb0e
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
      - name: Install pinned actual native original source browser dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Build full original native PWA, no deploy
        run: node scripts/build.mjs
      - name: Normal original owner-reviewed source to private closet 2D/v3 restoration at 320 390 430
        shell: bash
        run: |
          set -euo pipefail
          for width in 320 390 430; do
            P99_WIDTH="$width" node scripts/test-parallel99-normal-app-browser.mjs
          done
      - name: Full original native owner A-to-B private photo refusal and same-owner session reentry
        run: node scripts/test-main51-real-app-owner-original-2d.mjs
