name: Original WebKit ORT native trace (no deploy)
on:
  pull_request:
    branches: [fix/main1054-p0-webkit-original-segformer-graph-optimizer-ab-HOLD]
    paths: [research/main1054/original-ort-native-trace.mjs, .github/workflows/main1054-original-ort-native-trace-no-deploy.yml]
permissions:
  contents: read
jobs:
  trace:
    if: github.event.pull_request.head.ref == 'research/main1054-original-ort-native-trace-HOLD'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    strategy:
      fail-fast: false
      matrix:
        include:
          - {engine: webkit, width: 320, arm: baseline, count: 5}
          - {engine: webkit, width: 390, arm: baseline, count: 5}
          - {engine: webkit, width: 430, arm: baseline, count: 5}
          - {engine: webkit, width: 390, arm: graph_opt_disabled, count: 5}
          - {engine: chromium, width: 390, arm: baseline, count: 2}
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: ${{ matrix.engine }}
      P94_WIDTH: ${{ matrix.width }}
      M269_ARM: ${{ matrix.arm }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      COUNT: ${{ matrix.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source pins and disposable runner
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$GITHUB_RUN_ATTEMPT" = 1
          git merge-base --is-ancestor 019913a20ac6f2c63ff6a14140051b6961154815 HEAD
          git diff --exit-code 019913a20ac6f2c63ff6a14140051b6961154815 HEAD -- public/ scripts/ benchmark/ supabase/
          node --test tests/main1054-m269-webkit-original-graph-optimization-ab.test.mjs
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
          node research/main1054/original-ort-native-trace.mjs --prepare
          node --check scripts/.cc-native-ort-trace.mjs
      - name: Preserve first-attempt native operations and original outcome
        shell: bash
        run: |
          set -euo pipefail
          mkdir traces
          overall=0
          for ordinal in $(seq 1 "$COUNT"); do
            trace="traces/$ordinal.txt"
            exit_code=0
            timeout -k 5s 150s node scripts/.cc-native-ort-trace.mjs > original.log 2>&1 || exit_code=$?
            {
              printf 'checkout=%s run=%s attempt=%s engine=%s width=%s arm=%s exit=%s\n' "$EXPECTED_HEAD" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$M58_ENGINE" "$P94_WIDTH" "$M269_ARM" "$exit_code"
              grep -E '^CC_NATIVE_ORT_(TRACE|SETUP_FAILURE) ' original.log || true
              if grep -q '^P91_FULL_JOURNEY_PASS ' original.log; then echo ORIGINAL_JOURNEY_PASS; fi
              if grep -q '^M58_REAL_P88_WORKER_FAIL ' original.log; then echo ORIGINAL_JOURNEY_FAIL; fi
            } > "$trace"
            cat "$trace"
            if [ "$exit_code" != 0 ] || ! grep -q '^ORIGINAL_JOURNEY_PASS$' "$trace" ||
               ! grep -Eq '"operation":"OrtRun","phase":"return","value":0}' "$trace"; then
              overall=1
            fi
            rm -f original.log
          done
          exit "$overall"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-ort-${{ matrix.engine }}-${{ matrix.width }}-${{ matrix.arm }}
          path: traces/
          if-no-files-found: warn
          retention-days: 7
