name: "MAIN1054 M33 full sixteen-photo local HTTPS physical-device handoff — NO DEPLOY"
'on':
  push:
    branches:
      - research/main1054-https-sixteen-device-handoff-m33-HOLD
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  desktop-https-owner-acceptance-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact verified M31 source ancestor, research only, no app/hosted cloud/original corpus changes
        shell: bash
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 1428c362471cf5e88acc6e6f2d16de0afecaa5af HEAD
          git diff --exit-code 1428c362471cf5e88acc6e6f2d16de0afecaa5af HEAD -- public/ supabase/ benchmark/photos/ benchmark/locked-photo-sources.json
          node --check scripts/serve-physical-device-m32.mjs
          node --check scripts/test-main1054-local-https-16-m33-browser.mjs
          node --check research/master-consolidation-1054/physical-device-m32-client.mjs
          node --check research/master-consolidation-1054/physical-device-evidence-gate-m32.mjs
      - name: Reject fabricated physical device, automatic owner save and private receipt leaks
        run: node --test tests/master-physical-device-handoff-m32.test.mjs tests/master-native-cpu-active-cancel-gate-m28.test.mjs tests/master-native-cpu-endurance-gate-m26.test.mjs tests/master-real-model-memory-gate.test.mjs
      - name: Install exactly pinned public CPU runtime, genuine models and desktop WebKit/Chromium
        run: npm install --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 playwright@1.56.1 sharp@0.34.3
      - name: Verify four legally licensed original garment JPEGs, genuine pinned model and CPU WASM assets
        shell: bash
        run: |
          set -eu
          printf '%s  %s\n' \
            0cb5ac5be2c414d5b9e361f857108630c6d6e24a5ab9be3cf5f761de55289e94 node_modules/onnxruntime-web/dist/ort.wasm.min.mjs \
            f061472c6e77d6d50d079aacdc0ff9b63fee287ddd2cbf46cf62438d3891de2b node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.wasm \
            | sha256sum --check
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos commons-0035,commons-0062,commons-0078,commons-0059
          node scripts/p82-prepare-models.mjs --check
          git diff --exit-code -- public/
      - name: Actual local HTTPS 16 public CPU dual-model native owner photos plus ONNX cancel/lock on each desktop browser
        run: node scripts/test-main1054-local-https-16-m33-browser.mjs
      - name: Confirm no consumer source/app release or private/hosted changes
        shell: bash
        run: |
          set -eu
          git diff --exit-code be9016c1cdf92c9d974f3177cbc8551058a1892c HEAD -- public/ supabase/ benchmark/locked-photo-sources.json
          test -z "$(git status --porcelain -- public/)"
          echo 'MAIN1054_M33_16_PHOTO_DESKTOP_HTTPS_NOT_PHYSICAL_DEVICE_OR_RELEASE'
