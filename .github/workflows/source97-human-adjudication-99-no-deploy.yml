name: SOURCE99 real source-locked human review A B C intake and scientific non-promotion NO DEPLOY
on:
  push:
    branches:
      - research/source97-human-adjudication-intake-99-main-20261105-HOLD
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-human-review-intake-quarantine-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact verified P98 ancestor, only FIVE P99 research documents and scripts, no app/staging/production/deploy
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=afe42938dd5b385e1d4bae9423a60803f2bdd2e0
          git merge-base --is-ancestor "$BASE" HEAD
          FIRST=$(git rev-list --reverse "$BASE..HEAD" | head -n1)
          test "$(git rev-parse "$FIRST^")" = "$BASE"
          git diff --name-only "$BASE" HEAD >/tmp/p99-allowed
          while IFS= read -r path; do
            case "$path" in
              research/source97-human-adjudication-99/review-intake-gate.mjs|research/source97-human-adjudication-99/REPORT.md|scripts/audit-source97-human-review-99.mjs|tests/source97-human-adjudication-99.test.mjs|.github/workflows/source97-human-adjudication-99-no-deploy.yml) ;;
              *) echo "REFUSE unauthorized application/private-photo/model/cloud/production/staging change: $path"; exit 1 ;;
            esac
          done </tmp/p99-allowed
          test "$(wc -l </tmp/p99-allowed)" -eq 5
      - name: Install fixed local Node, JPEG and actual mobile browser research dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Full inherited app build, original-source security tests and independent SOURCE99 adversarial tests
        run: |
          node --check research/source97-human-adjudication-99/review-intake-gate.mjs
          node --check scripts/audit-source97-human-review-99.mjs
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Exercise empty independent human reviewer evidence CLI; no fabricated mask scoring
        run: |
          node scripts/audit-source97-human-review-99.mjs --empty >/tmp/source99-empty-scientific-hold.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const x=JSON.parse(readFileSync('/tmp/source99-empty-scientific-hold.json','utf8'));
          assert.equal(x.sourcePhotoCount,7);
          assert.equal(x.originalFrozenPhotoCount,59);
          assert.equal(x.oldModelExposedQuarantineCount,2);
          assert.equal(x.reviewerRolesProvided,0);
          assert.equal(x.unresolvedSources,7);
          assert.equal(x.selfAttestedAgreementOnly,0);
          assert.equal(x.newCandidatesScientificallyAccepted,0);
          assert.equal(x.actualHumanIdentityVerified,false);
          assert.equal(x.humanIndependentReviewVerified,false);
          assert.equal(x.candidateModelExposureAudited,false);
          assert.equal(x.perInstancePrecision,null);
          assert.equal(x.perInstanceRecall,null);
          assert.equal(x.realModelMaskIoU,null);
          assert.equal(x.categoryAccuracy,null);
          assert.equal(x.subtypeAccuracy,null);
          assert.equal(x.primaryColorAccuracy,null);
          assert.equal(x.secondaryColorAccuracy,null);
          assert.equal(x.familyAlpha,'HOLD');
          assert.equal(x.releaseAuthorized,false);
          console.log('SOURCE99 private genuine review human intake EMPTY: zero actual identities and scientific metrics; HOLD verified.');
          NODE
      - name: Strict re-download all P97 pinned Commons original JPEGs and frozen originals; independent source-byte evidence
        run: node scripts/verify-new-real-commons-candidates-97.mjs --strict
      - name: Preserve P94 source-SHA reviewer packet and real Chromium WebKit 320 390 430 browser acceptance
        run: |
          node scripts/build-independent-instance-packets-94.mjs
          node scripts/test-independent-instance-94-browser.mjs
          node scripts/audit-independent-instance-94-browser.mjs
      - name: Archive only research report and redacted zero-review source statuses, never reviewer exports or photos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SOURCE99-source-locked-AB-C-intake-science-HOLD-metadata-only
          path: |
            research/source97-human-adjudication-99/REPORT.md
            /tmp/source99-empty-scientific-hold.json
          if-no-files-found: warn
          retention-days: 14
