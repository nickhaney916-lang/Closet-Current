name: M1 P800 native original source garment rectangle — NO DEPLOY
on:
  push:
    branches: [research/mission1-native-owner-source-box-800-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m1-p800-native-source-owner-rectangle-HOLD-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-parent-complete-node-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact verified P799 original, strict six-file source-box native scope, NO DEPLOY
        run: |
          set -euo pipefail
          BASE=3b16be6f58f6def8f821ae603ef3054d6b1a1299
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD >/tmp/m1-p800-paths
          test "$(wc -l </tmp/m1-p800-paths)" -eq 6
          while read -r path; do
            case "$path" in
              public/app.js|public/owner-original-photo-point-798.mjs|scripts/test-mission1-real-segformer-to-closet-782-browser.mjs|tests/mission1-native-owner-original-box-800.test.mjs|research/mission1-native-owner-source-box-800/REPORT.md|.github/workflows/mission1-native-owner-original-box-800-no-deploy.yml) ;;
              *) echo "UNAPPROVED OWNER/RELEASE/MODEL/PRODUCTION CHANGE: $path"; exit 1 ;;
            esac
          done </tmp/m1-p800-paths
          test -z "$(git diff --name-only "$BASE" HEAD -- public/local-worker.mjs public/auth.js public/cloud-backup.js public/native-reviewed-private-save-167.mjs public/local-catalog.mjs public/photo-color.js supabase benchmark/locked-photo-sources.json)"
          echo M1_P800_PINNED_P799_SIX_SOURCE_BOX_ONLY_PATHS_NO_DEPLOY
      - name: Install ephemeral complete app Node test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Original source two-corner owner rectangle proof, build and complete app/cloud/3D regression
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check public/owner-original-photo-point-798.mjs
          node --check scripts/test-mission1-real-segformer-to-closet-782-browser.mjs
          node --test tests/mission1-native-owner-original-box-800.test.mjs
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  actual-original-to-native-two-browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      MULTI16_RELAY_MODEL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ephemeral true browser SegFormer source and native app runner
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3
      - name: Actual CC BY original through frozen SegFormer, owner source box pointer/keyboard, native private Adjust and saved closet
        run: node scripts/test-mission1-real-segformer-to-closet-782-browser.mjs
      - name: Require actual owner source rectangle only, no stored box, mask, model or auto-approved garment
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const result=JSON.parse(readFileSync('benchmark/mission1-real-model-native-closet-782/browser-results.json'));
          assert.equal(result.researchOnly,true);
          assert.equal(result.releaseAuthorized,false);
          assert.equal(result.familyAlpha,'HOLD');
          assert.equal(result.realAuthenticatedCloudUsers,false);
          assert.equal(result.actualModelSubtypeOrColorVerified,false);
          assert.deepEqual(new Set(result.scenarios.map(x=>x.browser)),new Set(['chromium','webkit']));
          for(const row of result.scenarios){
            assert.equal(row.actualOriginalSourceOwnerPoint798ReviewedInNativeAdjust,true);
            assert.equal(row.actualOriginalSourceOwnerBox800BrowserDrawn,true);
            assert.equal(row.actualOriginalSourceOwnerBox800KeyboardEntered,true);
            assert.equal(row.actualOriginalSourceOwnerBox800NotPersisted,true);
            assert.equal(row.actualOriginalSourceOwnerBox800NoMaskOrApproval,true);
            assert.equal(row.simulatedPlaywrightBoxEventsNotIndependentHumans,true);
            assert.equal(row.actualOriginalSourceOwnerPoint798NotPersisted,true);
            assert.equal(row.actualOriginalSourceOwnerPoint798NoMaskOrApproval,true);
            assert.equal(row.originalSourceOwnerPointBrowserGesturesSimulated,true);
            assert.equal(row.actualModelSourceMaskColorOriginalSHA256,row.realModelOriginalSHA256);
            assert.equal(row.actualModelSourceMaskColorLabelMapSHA256,row.exactSourceModelMapSHA256);
            assert.equal(row.actualModelColorNeverAutofilledOrHumanConfirmed,true);
            assert.equal(row.actualMyClosetSaved,true);
            assert.equal(row.simulatedManualUnknownSubtypeRefusedBeforeSave,true);
            assert.equal(row.actualHumanGroundTruthIndependentlyVerified,false);
            assert.equal(row.familyAlpha,'HOLD');
          }
          console.log('M1_P800_ACTUAL_SHA_VERIFIED_OWNER_RECTANGLE_IN_NATIVE_ADJUST_CHROMIUM_WEBKIT_NO_MASK_SAVE_OR_RELEASE');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission1-P800-genuine-original-owner-rectangle-native-Adjust-pointer-keyboard-SIMULATED-human-HOLD
          path: benchmark/mission1-real-model-native-closet-782/
          retention-days: 14
          if-no-files-found: warn
