name: P95 fresh-process WebKit 12x Chromium 6x source restore soak NO DEPLOY
on:
  push:
    branches: [fix/parallel95-webkit-source-restore-reentry-HOLD]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  p95-exact-source-process-soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: webkit
            processes: 12
          - engine: chromium
            processes: 6
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M51_ENGINE: ${{ matrix.engine }}
      P95_PROCESSES: ${{ matrix.processes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source-ancestry and protected read-only owner JPEG sources
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor bddcc4da68bee90fb2aad545cffc2aaa620c959e HEAD
          test "$(git rev-parse HEAD:scripts/test-main51-real-app-owner-original-2d.mjs)" = 63cc9da00eaecbeb2576482dcae1528b44ea8189
          test "$(git rev-parse HEAD:research/main-thread-integration-1054/native-2d-preview.mjs)" = 0af20d49d87436683630d587ec0284c611cd3414
          git diff --exit-code bddcc4da68bee90fb2aad545cffc2aaa620c959e HEAD -- public/ supabase/ research/main-thread-integration-1054/
          node --check scripts/test-parallel95-native-source-restore-reentry.mjs
      - name: Install pinned browser dependencies in disposable workspace
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Fresh no-retry full native browser processes, all three widths each
        shell: bash
        run: |
          set -euo pipefail
          for trial in $(seq 1 "$P95_PROCESSES"); do
            echo "P95_PROCESS_BEGIN engine=$M51_ENGINE trial=$trial exactHead=$(git rev-parse HEAD)"
            node scripts/test-parallel95-native-source-restore-reentry.mjs
            echo "P95_PROCESS_STRICT_PASS engine=$M51_ENGINE trial=$trial widths=320,390,430"
          done
          echo "P95_COMPLETE engine=$M51_ENGINE processes=$P95_PROCESSES allWidths=320,390,430 noRetries=true"
