name: 3D-54 natural shoulder sleeve geometry and actual mobile visual QA (DRAFT HOLD NO DEPLOY)
on:
  pull_request:
    paths:
      - 'research/three-d-54/**'
      - 'research/three-d-15/outfit-controller.mjs'
      - 'research/three-d-15/showroom.mjs'
      - 'research/three-d-31/photo-jeans-demo.mjs'
      - 'research/three-d-37/second-jeans-demo.mjs'
      - 'scripts/test-three-d-54-shoulder-browser.mjs'
      - 'tests/three-d-54-shoulder-transition.test.mjs'
      - '.github/workflows/three-d-54-shoulder-sleeve-no-deploy.yml'
permissions:
  contents: read
jobs:
  real-shoulder-sleeve-transition:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Exact 3D53 research parent; strict 3D54-only paths
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 38c689b83db0f86c9e769a3ffd80155814c4893b HEAD
          git diff --name-only 38c689b83db0f86c9e769a3ffd80155814c4893b HEAD | while IFS= read -r f; do
            case "$f" in
              research/three-d-54/*|research/three-d-15/outfit-controller.mjs|research/three-d-15/showroom.mjs|research/three-d-31/photo-jeans-demo.mjs|research/three-d-37/second-jeans-demo.mjs|scripts/test-three-d-54-shoulder-browser.mjs|tests/three-d-54-shoulder-transition.test.mjs|.github/workflows/three-d-54-shoulder-sleeve-no-deploy.yml) ;;
              *) echo "BLOCKED non-research scope: $f"; exit 1 ;;
            esac
          done
      - name: Install pinned local source verification dependencies, no inference
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 three@0.180.0 playwright@1.56.1 three-mesh-bvh@0.9.2
      - name: Recreate fixed-hash licensed original shirt and both original denim source crops
        run: |
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node --test tests/three-d-31-jeans-source.test.mjs tests/three-d-37-source-true.test.mjs
      - name: Original source 163-bone male/female rig models and unchanged shirt
        run: |
          git fetch --no-tags origin 53f2ad344dc56a1477e343531c423aed0e66c17d dd6bac3fa9ff640d4f562cf925337440bdb5cf8f 3a572193987cb29389727426136c6eb3ac326783 dfb40889c4c1221fb1833b859e8a11ef38aeb76e
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
      - name: Preserve green bilateral cap, seam, collar and real fabric geometry tests
        run: |
          node --test tests/three-d-47-upper-arm-volume.test.mjs
          node --test tests/three-d-48-cap-seam-witness.test.mjs
          node --test tests/three-d-48-collar-roll.test.mjs
      - name: 3D53 opt-in real source-neutral photographed shirt rear panel QA
        run: node --test tests/three-d-53-rear-fabric-relief.test.mjs
      - name: True source-integrity, left and right sewn seam normals and 28 actual posed triangle audits
        run: |
          node --test tests/three-d-54-shoulder-transition.test.mjs
          node --input-type=module <<'AUDIT'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const a=JSON.parse(readFileSync('benchmark/three-d-54/collision-seam-audit.json','utf8'));
          assert.equal(a.records.length,28);
          for(const r of a.records){
            for(const key of ['shirtBody','pantsBody','shirtJeans'])assert.equal(r[key].crossingTrianglePairs,0);
            assert.ok(Number.isFinite(r.maximumGap)&&r.maximumGap<=5e-5);
            assert.ok(r.seamWitnesses.L>=3&&r.seamWitnesses.R>=3);
          }
          assert.equal(a.continuousMotionCertified,false);
          assert.equal(a.releaseAuthorized,false);
          AUDIT
      - name: Genuine before after mobile Chromium 320 390 430 both figures both denim five poses three views and shoulder closeups
        run: node scripts/test-three-d-54-shoulder-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: THREE-D-54-ORIGINAL-PHOTO-SHOULDER-REAL-MOBILE-QA-HOLD
          path: |
            benchmark/three-d-54/
          if-no-files-found: warn
