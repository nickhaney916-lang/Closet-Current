name: MOBILE-CAMERA-LIFECYCLE-69 NO DEPLOY
on:
  pull_request:
    paths:
      - 'public/app.js'
      - 'public/index.html'
      - 'public/photo-import.js'
      - 'research/capture-proof-01/source-proof.mjs'
      - 'research/mobile-camera-lifecycle-69/**'
      - 'tests/capture-proof-01.test.mjs'
      - 'tests/photo-import.test.cjs'
      - 'scripts/test-capture-proof-01-browser.mjs'
      - 'benchmark/capture-proof-01/**'
      - '.github/workflows/mobile-camera-lifecycle-69-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-camera-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Pin Priority 68 baseline and enforce changed-file scope
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 143ff1294cabd531b8eb6ad23b5a2c9f62b3dc9a HEAD
          git diff --name-only 143ff1294cabd531b8eb6ad23b5a2c9f62b3dc9a HEAD | while IFS= read -r path; do
            case "$path" in
              public/app.js|public/index.html|public/photo-import.js|research/capture-proof-01/source-proof.mjs|research/mobile-camera-lifecycle-69/*|tests/capture-proof-01.test.mjs|tests/photo-import.test.cjs|scripts/test-capture-proof-01-browser.mjs|benchmark/capture-proof-01/*|.github/workflows/mobile-camera-lifecycle-69-no-deploy.yml) ;;
              *) echo "MOBILE-CAMERA-LIFECYCLE-69 unauthorized path: $path"; exit 1 ;;
            esac
          done
      - name: Install browser runner without packaging or deploy
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - name: Syntax and complete Node regression suite
        run: |
          node --check public/app.js
          node --check public/photo-import.js
          node --check research/capture-proof-01/source-proof.mjs
          node --check tests/capture-proof-01.test.mjs
          node --check scripts/test-capture-proof-01-browser.mjs
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Chromium and WebKit real-page mobile viewport capture workflow
        run: node scripts/test-capture-proof-01-browser.mjs
      - name: Assert evidence and no-deploy boundary
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('benchmark/capture-proof-01/results.json','utf8'));
          assert.equal(r.verdict,'PASS');
          assert.deepEqual(r.results.map(x=>x.engine+':'+x.width),
            ['chromium:320','chromium:390','chromium:430','webkit:320','webkit:390','webkit:430']);
          assert.equal(r.errors.length,0); assert.equal(r.outbound.length,0);
          assert.ok(r.results.every(x=>x.singleItemDeviceCameraFileHandoff&&x.nativePickerCancelKeepsReview&&
            x.originalFullResolution&&x.manualCorrectionSaved&&x.tamperedSourceRefused&&
            x.visibilityInterruptStopped&&x.logoutDuringPendingHashDiscarded&&x.logoutClearsPrivateIndex&&
            !x.actualPhysicalPhone&&!x.genuineOSCameraHandoffTested));
          assert.equal(r.physicalAndroidTested,false); assert.equal(r.physicalIphoneTested,false);
          assert.equal(r.productionDeployed,false); assert.equal(r.familyAlpha,'HOLD');
          console.log('6 Chromium/WebKit viewport runs pass; physical-device work remains unclaimed; NO DEPLOY');
          NODE
      - name: Upload screenshots and run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MOBILE-CAMERA-LIFECYCLE-69-NO-DEPLOY-HOLD
          path: benchmark/capture-proof-01/
          if-no-files-found: warn
