name: Mission 1 P810 offline human source lease and stale JPEG fail-closed — NO DEPLOY
on:
  push:
    branches: [research/mission1-review-source-lease-810-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mission1-P810-source-lease-HOLD
  cancel-in-progress: true
jobs:
  full-node-and-four-path-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict exact green P809 parent; only offline human source proof tooling changed
        run: |
          set -euo pipefail
          BASE=fd3d16d10a1083cd327365303130b8f5a06e9068
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD >/tmp/m1-p810-paths
          test "$(wc -l </tmp/m1-p810-paths)" -eq 4
          while read -r p; do
            case "$p" in
              research/mission1-reviewer-774/offline-photo-polygon-review.html|scripts/test-mission1-offline-reviewer-774-browser.mjs|research/mission1-review-source-lease-810/REPORT.md|.github/workflows/mission1-review-source-lease-810-no-deploy.yml) ;;
              *) echo "UNAUTHORIZED OWNER/MODEL/RELEASE CHANGE: $p"; exit 1 ;;
            esac
          done </tmp/m1-p810-paths
          test -z "$(git diff --name-only "$BASE" HEAD -- public supabase benchmark)"
          grep -Fq 'FAMILY ALPHA HOLD #255' research/mission1-review-source-lease-810/REPORT.md
          echo M1_P810_ONLY_OFFLINE_HUMAN_REVIEWER_FOUR_PATHS_NO_DEPLOY
      - name: Install ephemeral regression dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Full app test/build and human original-source regression
        run: |
          set -euo pipefail
          node --check scripts/test-mission1-offline-reviewer-774-browser.mjs
          node --test tests/mission1-offline-human-polygon-774.test.mjs
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  chromium-webkit-actual-async-image-race:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Force stale original photo async decoding while switching real selected JPEG
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3
          node scripts/test-mission1-offline-reviewer-774-browser.mjs
      - name: Check eight distinct original/abandoned-source screenshot PNG hashes
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const root='benchmark/m1-human-reviewer-ui-774/';
          const p=JSON.parse(readFileSync(root+'synthetic-only-screenshot-receipts.json','utf8'));
          assert.deepEqual(new Set(p.testedBrowserEngines),new Set(['chromium','webkit']));
          assert.deepEqual(p.widths,[320,390]);
          assert.equal(p.screenshotReceipts.length,8);
          assert.equal(p.actualIndependentHumanReviewers,0);
          assert.equal(p.realPhotoOwnerPermissionVerified,false);
          assert.equal(p.releaseAuthorized,false);
          assert.equal(p.familyAlpha,'HOLD');
          assert.equal(new Set(p.screenshotReceipts.map(x=>x.sha256)).size,8);
          const seen=new Set();
          for(const x of p.screenshotReceipts){
            assert.equal(x.syntheticOnly,true);
            const key=x.engine+':'+x.width+':'+(x.kind||'outer-hole');
            assert.equal(seen.has(key),false,key);seen.add(key);
            const name=x.kind==='stale-source-rejected'
              ?x.engine+'-'+x.width+'-source-race-stale-rejected.png'
              :x.engine+'-'+x.width+'-synthetic-human-annotation-ui.png';
            const bytes=readFileSync(root+name);
            assert.equal(createHash('sha256').update(bytes).digest('hex'),x.sha256);
          }
          console.log('M1_P810_EIGHT_GENUINE_BROWSER_SCREENSHOTS_STALE_SOURCE_REJECTED_HOLD');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission1-P810-blind-review-source-lease-stale-JPEG-8-synthetic-screens-HOLD
          path: benchmark/m1-human-reviewer-ui-774/
          retention-days: 14
          if-no-files-found: warn
