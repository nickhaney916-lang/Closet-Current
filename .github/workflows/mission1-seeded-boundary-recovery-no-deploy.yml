name: Mission 1 seeded boundary recovery experiment NO DEPLOY
on:
  pull_request:
    branches: [research/mission1-external-human-evidence-20261109-HOLD]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  source-and-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - run: node scripts/build.mjs
      - run: node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - run: python scripts/fetch-fashionpedia-66.py
  actual-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: python scripts/fetch-fashionpedia-66.py
      - run: node scripts/test-mission1-seeded-boundary-recovery-browser.mjs
        env:
          MISSION1_ENGINE: ${{ matrix.engine }}
          MULTI16_RELAY_MODEL: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: mission1-boundary-recovery-${{ matrix.engine }}
          path: benchmark/mission1-seeded-boundary-recovery/${{ matrix.engine }}/
