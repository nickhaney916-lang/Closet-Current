name: Mission 2 P86 source panel and outfit lease NO DEPLOY
on:
  push:
    branches: [research/mission2-p86-end-to-end-HOLD]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - run: node scripts/build.mjs
      - run: node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - run: git diff --exit-code -- public supabase benchmark/fixtures benchmark/locked-photo-sources.json
