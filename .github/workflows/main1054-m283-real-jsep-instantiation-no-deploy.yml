name: MAIN1054 M283 original JSEP native instantiation SHA identity HOLD
on:
  push:
    branches: [research/main1054-m283-real-jsep-instance-sha-HOLD]
permissions:
  contents: read
jobs:
  m283-original-source-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm original WebKit/Worker/JSEP and M279 ABI unchanged
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "${{ github.run_attempt }}" = 1
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse HEAD:research/main1054/m279-original-model-pointer-bounds.mjs)" = f2fd27553cc6854997480ee586cb8e191e9aca11
          test "$(git rev-parse HEAD:research/main1054/m280-original-jsep-function-map.mjs)" = c52b967bc80ce8ba4c2c69bc2ea09c70e50bb332
          node research/main1054/m283-real-jsep-instantiation.mjs prepare
          node --check scripts/.cc-m283-original-jsep-sha.mjs
      - name: Run M283 identity attribution, false-positive and inherited original native negatives
        run: |
          node --test tests/main1054-m283-real-jsep-instantiation.test.mjs
          node --test tests/main1054-m281-webkit-offset-capability.test.mjs tests/main1054-m280-original-jsep-function-map.test.mjs tests/main1054-m279-original-model-pointer-bounds.test.mjs
      - name: Install source-pinned no-deploy dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Inherited original owner/privacy/photo/backup Node and app build
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          test -s dist/index.html
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  m283-actual-original-webkit-process-instantiation:
    needs: m283-original-source-security
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - {engine: webkit, width: 430, count: 3}
          - {engine: chromium, width: 390, count: 1}
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: ${{ matrix.engine }}
      P94_WIDTH: ${{ matrix.width }}
      M283_COUNT: ${{ matrix.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare exact original worker observer with unchanged WASM native code
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "${{ github.run_attempt }}" = 1
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          node research/main1054/m283-real-jsep-instantiation.mjs prepare
      - name: Install pinned genuine browser test fixtures
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Run genuine original P94 SegFormer per-process, retain every RED and UNKNOWN
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m283-sanitized
          logfile="$(mktemp)"
          trap 'rm -f "$logfile"' EXIT
          bad=0
          for i in $(seq 1 "$M283_COUNT"); do
            export M283_ORDINAL="$i"
            result=0
            timeout -k 5s 180s node scripts/.cc-m283-original-jsep-sha.mjs > "$logfile" 2>&1 || result=$?
            receiptResult=0
            node research/main1054/m283-real-jsep-instantiation.mjs receipt "$logfile" "$result" > "m283-sanitized/$i.txt" || receiptResult=$?
            cat "m283-sanitized/$i.txt"
            if [ "$result" != 0 ] || [ "$receiptResult" != 0 ] || ! grep -q '^P91_FULL_JOURNEY_PASS ' "$logfile"; then
              bad=1
              echo "M283_GENUINE_ORIGINAL_RED_OR_PROVENANCE_BLOCKED ordinal=$i"
            fi
          done
          exit "$bad"
      - name: Archive sanitized SHA evidence (no model bytes/photos/tokens)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m283-original-native-jsep-instantiation-${{ matrix.engine }}-${{ matrix.width }}-HOLD
          path: m283-sanitized/*.txt
          retention-days: 7
          if-no-files-found: ignore
