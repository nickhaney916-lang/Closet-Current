name: 3D-15 unified real-photo shirt pants and dress on anatomical rig (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'research/three-d-15/**'
      - 'tests/three-d-15-unified-outfits.test.mjs'
      - 'scripts/test-three-d-15-browser.mjs'
      - '.github/workflows/three-d-15-unified-outfits-no-deploy.yml'
permissions:
  contents: read
jobs:
  unified-garment-research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Strict no-deploy new-file allowlist; predecessors byte-identical
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin d990703eb281d71153fe8f2c3467a0f0573cadeb
          git diff --name-only d990703eb281d71153fe8f2c3467a0f0573cadeb HEAD | while IFS= read -r f; do
            case "$f" in
              research/three-d-15/*|tests/three-d-15-unified-outfits.test.mjs|scripts/test-three-d-15-browser.mjs|.github/workflows/three-d-15-unified-outfits-no-deploy.yml) ;;
              *) echo "Unexpected shirt, pants, photo, auth, account, staging, production or Drive Duel edit: $f"; exit 1 ;;
            esac
          done
          test "$(git diff --name-only d990703eb281d71153fe8f2c3467a0f0573cadeb HEAD | wc -l)" -le 9
      - name: Install exact local research-only dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 three@0.180.0 playwright@1.56.1
      - name: Restore exact licensed original 15-photo benchmark and transparent masks
        run: |
          git fetch --no-tags origin 53f2ad344dc56a1477e343531c423aed0e66c17d dd6bac3fa9ff640d4f562cf925337440bdb5cf8f 3a572193987cb29389727426136c6eb3ac326783
          node scripts/build-work47-benchmark.mjs
      - name: Strict licensed real human model hashes and trusted publisher redirect
        run: node research/three-d-15/cc0-pinned-download.mjs
      - name: Preserve Work60 functional tests; apply the stronger exact-parent 3D15 diff guard above
        run: |
          node --test --test-name-pattern='real lower-body geometry|Pants source is hash-bound' tests/three-d-13-pants.test.mjs
          node --test tests/three-d-15-unified-outfits.test.mjs
          node --test --test-name-pattern='targeted geometry' tests/three-d-11-drape.test.mjs
          node --test --test-name-pattern='canonical Work56|Original stock source' tests/three-d-09-integration.test.mjs
      - name: Real 320 390 430 mobile WebGL integration on both anatomical figures
        run: node scripts/test-three-d-15-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: THREE-D-15-WORK60-PLUS-REAL-DRESS-ORIGINAL-PHOTOS-HOLD
          path: |
            benchmark/three-d-15/
            research/three-d-06/models/verified-assets.json
          if-no-files-found: warn
