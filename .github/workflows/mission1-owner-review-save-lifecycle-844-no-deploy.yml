name: Mission 1 P844 owner-review save lifecycle — NO DEPLOY
on:
  push:
    branches: [research/mission1-owner-review-save-lifecycle-844-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mission1-p844-owner-review-save-HOLD
  cancel-in-progress: true
jobs:
  source-native-research-HOLD:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact P843 parent, four-path scope, NO DEPLOY
        shell: bash
        run: |
          set -euo pipefail
          BASE=cc5c0640e8c2814a053807e7159a591ab3e96a3f
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD >/tmp/p844-files
          cat /tmp/p844-files
          test "$(wc -l </tmp/p844-files)" -eq 4
          while IFS= read -r path; do
            case "$path" in
              public/app.js|scripts/test-m1-review-save-lifecycle-844.mjs|research/mission1-owner-review-save-lifecycle-844/REPORT.md|.github/workflows/mission1-owner-review-save-lifecycle-844-no-deploy.yml) ;;
              *) echo "P844 UNSAFE OUT-OF-SCOPE PATH: $path"; exit 1 ;;
            esac
          done </tmp/p844-files
          grep -Fqx 'const reviewFirst836=true;' <(grep '^const reviewFirst836=' public/app.js)
          grep -Fq 'let saveInFlight=false;' public/app.js
          grep -Fq 'dialog.oncancel=event=>{if(saveInFlight)event.preventDefault();};' public/app.js
          echo M1_P844_REVIEW_FIRST_AND_PINNED_SCOPE_NO_DEPLOY_PASS
      - name: Install temporary research dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Full native source tests and research preview builds
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check scripts/test-m1-review-save-lifecycle-844.mjs
          node --test tests/mission1-review-first-default-843.test.cjs
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
          echo M1_P844_NATIVE_TESTS_AND_BUILDS_PASS
  actual-dom-owner-save-acceptance-HOLD:
    needs: [source-native-research-HOLD]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install actual Chromium and WebKit browser engines
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Verify true P843 source baseline exhibits repeat-submit defect
        run: node scripts/test-m1-review-save-lifecycle-844.mjs parent
      - name: Verify P844 source blocks races and permits failed-write retry
        run: node scripts/test-m1-review-save-lifecycle-844.mjs candidate
      - name: Inherited default scanner and manually approved owner save
        run: |
          set -euo pipefail
          node scripts/test-m1-review-first-default-843.mjs
          node scripts/test-m1-owner-review-editor-839.mjs
          echo M1_P844_FULL_BROWSER_RESEARCH_NO_DEPLOY_PASS
