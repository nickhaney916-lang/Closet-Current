name: Experimental clothing-only hybrid cutout
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'benchmark/hybrid-garment-mask.mjs'
      - 'tests/hybrid-garment-mask.test.mjs'
      - 'benchmark/clothing-only-comparison.mjs'
      - 'tests/clothing-only-comparison.test.mjs'
      - 'scripts/run-hybrid-garment-comparison.mjs'
      - '.github/workflows/hybrid-garment-comparison.yml'
permissions:
  contents: read
jobs:
  experimental-fusion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned experimental inference libraries
        run: npm install --no-save --no-package-lock @huggingface/transformers@3.8.1 sharp@0.34.4
      - name: Check class-specific hybrid mask and body exclusion tests
        run: |
          node --check scripts/run-hybrid-garment-comparison.mjs
          node --test tests/hybrid-garment-mask.test.mjs tests/clothing-only-comparison.test.mjs
      - name: Download checksum-verified independent photos
        run: node scripts/download-reviewed-photos.mjs benchmark/manifest-fresh-11.json benchmark/photos validation-0001,validation-0003,validation-0010,validation-0017,validation-0019
      - name: Compare original, object-only and clothing-aware hybrid
        run: node scripts/run-hybrid-garment-comparison.mjs benchmark/hybrid-garment-review
      - name: Reject incomplete results or claims of release readiness
        run: |
          node -e "const s=require('./benchmark/hybrid-garment-review/summary.json'); if(s.status!=='complete'||s.cases.length!==5||s.accuracyMeasured!==false||s.mobilePerformanceMeasured!==false||s.productionAuthorized!==false||s.cases.some(c=>c.independentlyApproved||c.garmentOnlyVerified))throw Error('Unsafe hybrid report')"
          for id in validation-0001 validation-0003 validation-0010 validation-0017 validation-0019; do
            test -s "benchmark/hybrid-garment-review/$id-hybrid-review.png"
            test -s "benchmark/hybrid-garment-review/$id-hybrid-alpha.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-hybrid-clothing-segmentation
          path: benchmark/hybrid-garment-review/
          retention-days: 14
