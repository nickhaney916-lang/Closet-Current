name: MAIN226 real WebKit430 terminal classification repeated original model NO DEPLOY HOLD
on:
  push:
    branches: [research/main226-real-webkit-430-terminal-causality-HOLD]
  pull_request:
    branches: [research/main225-m224-retired-crop-zero-protected-m58-HOLD]
    paths:
      - scripts/test-main226-native-p94-worker-terminal-browser.mjs
      - .github/workflows/main226-real-webkit430-terminal-repetition-no-deploy.yml
permissions:
  contents: read
jobs:
  source-and-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin M225 exact immutable source and allow ONLY M226 research/CI
        shell: bash
        run: |
          set -euo pipefail
          BASE=b52ff452b1e1f7efe846e29a87de555639db5a48
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:research/multi-garment-capture-01/review-ui.mjs)" = 1bd97b80b51fab1cb269ae565acb73a274b6e6d0
          test "$(git rev-parse HEAD:public/outfit-segmentation.mjs)" = d357955dd8fdab7c0cb727ea597c270edd9309ac
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          git diff --name-only "$BASE" HEAD | while IFS= read -r file; do
            case "$file" in
              scripts/test-main226-native-p94-worker-terminal-browser.mjs|.github/workflows/main226-real-webkit430-terminal-repetition-no-deploy.yml) ;;
              *) echo "Forbidden M226 change: $file"; exit 1 ;;
            esac
          done
          node --check scripts/test-main226-native-p94-worker-terminal-browser.mjs
          M226_SELF_CHECK=1 node scripts/test-main226-native-p94-worker-terminal-browser.mjs
      - name: Install inherited Node test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Source and owner private app build and full regression no deploy
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  actual-webkit-model:
    name: Genuine original WebKit 320 390 430 430 sequential (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        lane: [one, two]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: webkit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact M225 identity and real original positive-model assertions remain
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor b52ff452b1e1f7efe846e29a87de555639db5a48 HEAD
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:research/multi-garment-capture-01/review-ui.mjs)" = 1bd97b80b51fab1cb269ae565acb73a274b6e6d0
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          node --check scripts/test-main226-native-p94-worker-terminal-browser.mjs
          M226_SELF_CHECK=1 node scripts/test-main226-native-p94-worker-terminal-browser.mjs
      - name: Install pinned real SegFormer browser dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Real WebKit repeat 320 then 390 then 430 twice without retries or changed assertions
        shell: bash
        run: |
          set -euo pipefail
          n=0
          for width in 320 390 430 430; do
            n=$((n + 1))
            M226_ATTEMPT="${{ matrix.lane }}-$n-$width" P94_WIDTH="$width" node scripts/test-main226-native-p94-worker-terminal-browser.mjs
          done
      - name: Independently unmodified WebKit 430 full owner-original positive model (no instrumentation)
        shell: bash
        run: |
          set -euo pipefail
          P94_WIDTH=430 node scripts/test-parallel94-native-p88-browser.mjs
