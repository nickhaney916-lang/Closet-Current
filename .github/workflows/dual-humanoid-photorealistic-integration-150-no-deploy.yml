name: P150 dual humanoid source-safe app integration NO DEPLOY
on:
  push:
    branches:
      - research/dual-humanoid-photorealistic-integration-150-parallel57-HOLD
  pull_request:
    branches:
      - research/dual-humanoid-visual-evidence-149-main-20261107-HOLD
    paths:
      - 'research/dual-humanoid-face-definition-131/**'
      - 'research/dual-humanoid-photorealistic-integration-150/**'
      - 'scripts/install-dual-humanoid-face-131.mjs'
      - 'scripts/prepare-dual-humanoid-face-131-webgl-test.mjs'
      - 'scripts/install-dual-humanoid-photorealistic-integration-150.mjs'
      - 'scripts/test-native-3d-05-browser.mjs'
      - 'tests/dual-humanoid-face-definition-131.test.mjs'
      - 'tests/dual-humanoid-photorealistic-integration-150.test.mjs'
      - '.github/workflows/dual-humanoid-photorealistic-integration-150-no-deploy.yml'
      - 'research/dual-humanoid-photorealistic-integration-150/REPORT.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-head-source-safe-webgl-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact P149 parent, direct ancestry, and research-only file scope
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=240a9762720373607fb5c573d87e7cdbb86fc1b2
          git merge-base --is-ancestor "$BASE" HEAD
          FIRST=$(git rev-list --reverse "$BASE..HEAD" | head -n1)
          test "$(git rev-parse "$FIRST^")" = "$BASE"
          git diff --name-only "$BASE" HEAD >/tmp/p150-paths
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/dual-humanoid-photorealistic-integration-150-no-deploy.yml|research/dual-humanoid-face-definition-131/face-definition.mjs|research/dual-humanoid-photorealism-118/realism.mjs|research/dual-humanoid-photorealistic-integration-150/*|scripts/install-dual-humanoid-face-131.mjs|scripts/prepare-dual-humanoid-face-131-webgl-test.mjs|scripts/install-dual-humanoid-photorealistic-integration-150.mjs|scripts/test-native-3d-05-browser.mjs|tests/dual-humanoid-face-definition-131.test.mjs|tests/dual-humanoid-photorealistic-integration-150.test.mjs) ;;
              *) echo "Refusing app, production, staging, authentication, cloud, unrelated or parallel source change: $path"; exit 1 ;;
            esac
          done </tmp/p150-paths
          test "$(wc -l </tmp/p150-paths)" -eq 11
          git diff --exit-code "$BASE" HEAD -- public supabase package.json package-lock.json
      - name: Install pinned research-only dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Build and run complete inherited plus P131/P150 Node regression suites
        run: |
          node scripts/build.mjs
          node --check research/dual-humanoid-face-definition-131/face-definition.mjs
          node --check research/dual-humanoid-photorealistic-integration-150/apply-humanoid.mjs
          node --check scripts/install-dual-humanoid-photorealistic-integration-150.mjs
          node --check scripts/test-native-3d-05-browser.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Rebuild pinned CC0 donor and P118 P131 overlays in detached worktree
        run: |
          git fetch --no-tags origin df6885d6011cb33fb22dceb81a08f35a0ac4dd61 672247f7121e92bba32b81cec74efddb2b69c817
          git worktree add --detach .p150-donor-541 df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          ln -s ../node_modules .p150-donor-541/node_modules
          cd .p150-donor-541
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
          mkdir -p research/dual-humanoid-photorealism-118
          git -C .. show 672247f7121e92bba32b81cec74efddb2b69c817:scripts/install-dual-humanoid-realism-118.mjs > scripts/install-dual-humanoid-realism-118.mjs
          git -C .. show 672247f7121e92bba32b81cec74efddb2b69c817:scripts/test-dual-humanoid-realism-118.mjs > scripts/test-dual-humanoid-realism-118.mjs
          cd ..
          node .p150-donor-541/scripts/install-dual-humanoid-realism-118.mjs .p150-donor-541
          node scripts/install-dual-humanoid-face-131.mjs .p150-donor-541
          node scripts/install-dual-humanoid-photorealistic-integration-150.mjs .p150-donor-541
          node scripts/prepare-dual-humanoid-face-131-webgl-test.mjs .p150-donor-541
          cd .p150-donor-541
          node scripts/test-dual-humanoid-face-131.mjs
      - name: Exercise actual signed-in app-owned saved outfit and both P150 figures in Chromium at 320 390 430
        run: |
          ln -s .p150-donor-541 .native05-donor-541
          P150=1 NATIVE88=1 NATIVE89=1 NATIVE91=1 NATIVE92=1 NATIVE93=1 NATIVE102=1 node scripts/test-native-3d-05-browser.mjs
      - name: Exercise WebKit mobile widths with actual WebGL or source-photo fallback
        run: P150=1 P150_BROWSER=webkit node scripts/test-native-3d-05-browser.mjs
      - name: Verify P150 browser render receipts, SHA integrity, both figures, six views and no mutation
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,readdirSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const dir='benchmark/dual-humanoid-photorealistic-integration-150';
          for(const width of [320,390,430]){
            const rows=JSON.parse(readFileSync(`${dir}/screens-${width}.json`,'utf8'));
            assert.equal(rows.length,6);
            assert.deepEqual(rows.map(x=>x.figure).sort(),['female','female','female','male','male','male']);
            assert.deepEqual(rows.map(x=>x.view).sort(),['back','back','front','front','side','side']);
            assert.ok(rows.every(x=>x.actualWebGL&&x.width===width&&x.sha256.length===64));
            for(const row of rows)assert.equal(createHash('sha256').update(readFileSync(`${dir}/${row.file}`)).digest('hex'),row.sha256);
          }
          const files=readdirSync(dir).filter(x=>x.endsWith('.png'));
          assert.equal(files.length,18);
          console.log('P150 genuine P148 owner saved-outfit app render evidence: 18 Chromium screenshots; both 163-bone figures; 320/390/430; front/side/rear; JSON SHA receipts. Family Alpha HOLD; no photorealism score.');
          NODE
      - name: Archive report and original-browser evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P150-dual-humanoid-app-WebGL-HOLD-NO-DEPLOY
          path: |
            research/dual-humanoid-photorealistic-integration-150/REPORT.md
            benchmark/dual-humanoid-photorealistic-integration-150/
            benchmark/native-3d-05/results.json
            .p150-donor-541/benchmark/three-d-131/
          if-no-files-found: warn
          retention-days: 14
