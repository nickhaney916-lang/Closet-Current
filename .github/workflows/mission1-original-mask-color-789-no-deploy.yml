name: M1 P789 original source color and true model mask diagnostics — NO DEPLOY
on:
  push:
    branches: [research/mission1-original-mask-color-789-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m1-p789-real-source-color-HOLD-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-parent-full-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact P788 verified ancestor and only five research/test/CI changed paths
        run: |
          set -euo pipefail
          BASE=1c9b326428051161094ec8bed28f30a8985ebb18
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD > /tmp/m1-p789-paths
          test "$(wc -l < /tmp/m1-p789-paths)" -eq 5
          while read -r path; do
            case "$path" in
              research/mission1-original-mask-color-789/source-color-evidence.mjs|research/mission1-original-mask-color-789/REPORT.md|tests/mission1-original-mask-color-789.test.mjs|scripts/test-mission1-real-original-color-789-browser.mjs|.github/workflows/mission1-original-mask-color-789-no-deploy.yml) ;;
              *) echo "UNAPPROVED SHIPPING/PRIVATE CHANGE: $path"; exit 1 ;;
            esac
          done < /tmp/m1-p789-paths
          test -z "$(git diff --name-only "$BASE" HEAD -- public supabase benchmark/locked-photo-sources.json)"
          echo M1_P789_PINNED_PARENT_SOURCE_ONLY_FIVE_PATHS_NO_DEPLOY
      - name: Ephemeral full Node suite dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Geometry, SHA and full native/recognition regressions
        run: |
          set -euo pipefail
          node --check research/mission1-original-mask-color-789/source-color-evidence.mjs
          node --check scripts/test-mission1-real-original-color-789-browser.mjs
          node --test tests/mission1-original-mask-color-789.test.mjs
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  pinned-five-originals-and-real-browser-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ephemeral frozen B0 browser runtime only
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3
      - name: Verify five published source originals by original-byte SHA
        run: |
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/mission1-original-mask-color-789/originals commons-0002,commons-0003,commons-0023,commons-0033,validation-0017
      - name: Actual immutable B0 against 5 public original RGBs and 8 genuine browser inferences
        run: node scripts/test-mission1-real-original-color-789-browser.mjs
      - name: Validate measured evidence without optimizing post hoc toward published titles
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('benchmark/mission1-original-mask-color-789/research-color-results.json','utf8'));
          assert.equal(r.sourceCohort,'five previously exposed SHA-verified publisher originals');
          assert.equal(r.independentHumanPrimaryColorTruth,false);
          assert.equal(r.realPhotoSegformerOnOriginals,true);
          assert.equal(r.releaseAuthorized,false);
          assert.equal(r.modelPromotionAuthorized,false);
          assert.equal(r.familyAlpha,'HOLD');
          assert.equal(r.engines.chromium.sources,5);
          assert.equal(r.engines.webkit.sources,3);
          assert.equal(r.rows.length,8);
          for(const row of r.rows){
            assert.equal(row.actualFrozenB0Inference,true);
            assert.equal(row.modelMaskColorReview.modelLabelMapSHA256,row.modelMapSHA256);
            assert.equal(row.modelMaskColorReview.autoSaveAllowed,false);
            assert.equal(row.modelMaskColorReview.independentHumanColorVerified,false);
            assert.equal(row.modelMaskColorReview.sourcePixelOriginalPreserved,true);
          }
          console.log('M1_P789_ACTUAL_FROZEN_B0_EIGHT_REAL_SOURCE_MASK_COLOR_RECEIPTS_TITLE_PROXY_ONLY_NOT_RELEASE');
          NODE
      - name: Erase original photos and avoid uploading any photographic/model pixels
        if: always()
        run: |
          rm -rf benchmark/mission1-original-mask-color-789/originals
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission1-P789-eight-real-original-B0-mask-color-TITLE-PROXY-only-HOLD
          path: benchmark/mission1-original-mask-color-789/research-color-results.json
          retention-days: 14
          if-no-files-found: warn
