name: M1 P834 unchanged FashionCLIP 16 original category accuracy audit — NO DEPLOY
on:
  push:
    branches: [research/mission1-real-16-original-recognition-audit-834-HOLD]
  pull_request:
    branches: [research/mission1-bounded-worker-recovery-833-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m1-p834-historical-16-HOLD-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-P833-research-only-full-native-HOLD:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact P833 green parent, only four numeric-research files and historic source unchanged
        run: |
          set -euo pipefail
          BASE=3774940f13a3c1cdaba6a0d3947b6101abb1eec6
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD >/tmp/p834-paths
          cat /tmp/p834-paths
          test "$(wc -l </tmp/p834-paths)" -eq 5
          while IFS= read -r p; do
            case "$p" in
              scripts/run-m1-real-16-originals-834.mjs|scripts/aggregate-m1-real-16-834.mjs|tests/mission1-real-16-audit-834.test.mjs|research/mission1-real-16-original-recognition-audit-834/REPORT.md|.github/workflows/mission1-real-16-original-recognition-audit-834-no-deploy.yml) ;;
              *) echo "UNAUTHORIZED MODEL/CLOUD/PHOTO CHANGE $p"; exit 1 ;;
            esac
          done </tmp/p834-paths
          test -z "$(git diff --name-only "$BASE" HEAD -- public supabase benchmark)"
          grep -Fq 'FAMILY ALPHA HOLD #255' research/mission1-real-16-original-recognition-audit-834/REPORT.md
          echo M1_P834_NO_DEPLOY_OR_MODEL_CHANGE_16_HISTORICAL_ORIGINALS
      - name: Install ephemeral complete Node regression requirements
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Full original Closet Current node regressions, native build and adversarial cohort tests
        run: |
          set -euo pipefail
          node --check scripts/run-m1-real-16-originals-834.mjs
          node --check scripts/aggregate-m1-real-16-834.mjs
          node --test tests/mission1-real-16-audit-834.test.mjs
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          node --test scripts/test-m1-no-account-trial-831.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  real-original-16-model-browser-evidence-HOLD:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        half: [a, b]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Actual browser and 8 original content SHA-verified Commons photos in fixed half
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps ${{ matrix.browser }}
          IDS=$(node -e 'const rows=require("./benchmark/manifest-holdout-16.json");const h=process.argv[1];process.stdout.write(rows.filter((_,i)=>i%2===(h==="a"?0:1)).map(x=>x.id).join(","))' "${{ matrix.half }}")
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos "$IDS"
      - name: Real pinned unchanged FashionCLIP original worker on 8 actual original photos
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          node scripts/run-m1-real-16-originals-834.mjs ${{ matrix.browser }} ${{ matrix.half }} benchmark/m1-real16-partition
      - name: Upload ONLY source-ID, category/subtype/status numeric receipts — ZERO publisher JPGs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: m1-p834-${{ matrix.browser }}-${{ matrix.half }}
          path: |
            benchmark/m1-real16-partition/audit.json
            benchmark/m1-real16-partition/source-receipt.json
          retention-days: 14
          if-no-files-found: error
  fail-closed-original16-aggregate-HOLD:
    needs: [real-original-16-model-browser-evidence-HOLD]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download all 4 REAL original-worker numeric-only result sets (no source JPEGs)
        uses: actions/download-artifact@v4
        with:
          pattern: m1-p834-*
          merge-multiple: false
          path: benchmark/m1-real16-834
      - name: Validate exact 16 original IDs in both browsers with strict per-family accounting
        run: |
          set -euo pipefail
          node --test tests/mission1-real-16-audit-834.test.mjs
          node scripts/aggregate-m1-real-16-834.mjs benchmark/m1-real16-834
      - name: Preserve independent source-wise historical original model audit — NOT release accuracy
        uses: actions/upload-artifact@v4
        with:
          name: m1-p834-16-original-public-garments-both-browsers-AGGREGATED-NUMERIC-HOLD
          path: benchmark/m1-real16-834/aggregate.json
          retention-days: 14
          if-no-files-found: error
