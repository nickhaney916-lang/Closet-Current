name: Parallel 105 closeout evidence NO DEPLOY HOLD
on:
  pull_request:
    branches: [research/main1054-m58-real-p88-browser-worker-HOLD]
    paths: [.github/workflows/parallel105-closeout-no-deploy.yml, research/parallel105/**, tests/parallel105-closeout.test.mjs]
permissions:
  contents: read
jobs:
  receipt-guard:
    if: github.event.pull_request.head.ref == 'research/parallel105-m4-closeout-evidence-gates-HOLD' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test receipt decisions on the actual checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          node --test tests/parallel105-closeout.test.mjs
  original-owner-journey:
    if: github.event.pull_request.head.ref == 'research/parallel105-m4-closeout-evidence-gates-HOLD' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        width: [320, 390, 430]
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: ${{ matrix.engine }}
      P94_WIDTH: ${{ matrix.width }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact checkout and install inherited test dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Run unchanged first-attempt original browser journey
        shell: bash
        run: |
          set -o pipefail
          node scripts/test-parallel94-native-p88-browser.mjs 2>&1 | tee parallel105-browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parallel105-${{ matrix.engine }}-${{ matrix.width }}
          path: |
            parallel105-browser.log
            benchmark/parallel94-native-p88-browser/${{ matrix.engine }}/${{ matrix.width }}/*.json
