name: M1 P799 genuine SAM2 publisher source point vs box prompt — NO DEPLOY
on:
  push:
    branches: [research/mission1-sam2-source-box-prompt-799-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m1-p799-point-box-source-ONNX-HOLD-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-parent-app-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact verified P798 ancestor and exactly four research/test/CI-only paths
        run: |
          set -euo pipefail
          BASE=5fdf7c0eccbc01e468da2f9866038072ae872ce7
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD >/tmp/p799-diff
          test "$(wc -l </tmp/p799-diff)" -eq 4
          while read -r path; do
            case "$path" in
              scripts/test-mission1-sam2-box-prompt-799.py|tests/test_mission1_sam2_source_box_799.py|research/mission1-sam2-source-box-prompt-799/REPORT.md|.github/workflows/mission1-sam2-source-box-prompt-799-no-deploy.yml) ;;
              *) echo "UNAPPROVED APP/MODEL/PRIVATE/DEPLOY CHANGE: $path"; exit 1 ;;
            esac
          done </tmp/p799-diff
          test -z "$(git diff --name-only "$BASE" HEAD -- public supabase benchmark/locked-photo-sources.json)"
          echo M1_P799_EXACT_P798_4_RESEARCH_PATHS_NO_DEPLOY
      - name: Ephemeral build and full Node regression dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Native build, complete closet recognizer cloud and humanoid Node regression
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/test-mission1-sam2-box-prompt-799.py tests/test_mission1_sam2_source_box_799.py
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  actual-SAM2-original-source-CPU-onnx:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only ONNX runtime and image-original processing
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.1.3 pillow==11.1.0 onnxruntime==1.23.2
      - name: Test publisher original source and oracle mask scoring arithmetic
        run: |
          python -m unittest discover -s tests -p 'test_mission1_bounded_sam2_797.py' -v
          python -m unittest discover -s tests -p 'test_mission1_sam2_all_instances_796.py' -v
          python -m unittest discover -s tests -p 'test_mission1_sam2_source_box_799.py' -v
      - name: Register 73 earlier source SHA BEFORE reloading all ten already P792-exposed real photos
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync,readFileSync} from 'node:fs';
          import {P66_EXPOSED_DIGESTS} from './research/mission1-sealed-human-holdout-768/prospective-gate.mjs';
          import {P59_EXPOSED_DIGESTS_774,P772_EXPOSED_DIGESTS_774,P792_EXPOSED_DIGESTS_792} from './research/mission1-exposure-774/pinned-exposed-source-history.mjs';
          const locked=JSON.parse(readFileSync('benchmark/locked-photo-sources.json'));
          const old=[...new Set([...P59_EXPOSED_DIGESTS_774,...P66_EXPOSED_DIGESTS,...P772_EXPOSED_DIGESTS_774])];
          assertSet: {
           if(old.length!==73||P792_EXPOSED_DIGESTS_792.some(x=>old.includes(x)))
            throw Error('P799 immutable old 73 versus P792 ten source SHA cohort invalid');
          }
          writeFileSync('/tmp/p795-prior-exposed-sha.json',JSON.stringify(old));
          NODE
      - name: Download exact frozen publisher annotation manifest and ten original public JPEG sources
        run: |
          set -euo pipefail
          python scripts/intake-additional-publisher-originals-792.py /tmp/p795-prior-exposed-sha.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {P792_EXPOSED_DIGESTS_792} from './research/mission1-exposure-774/pinned-exposed-source-history.mjs';
          const x=JSON.parse(readFileSync('benchmark/mission1-additional-publisher-originals-792/manifest.json'));
          assert.equal(x.rows.length,10);
          assert.deepEqual(new Set(x.rows.map(x=>x.sha256)),new Set(P792_EXPOSED_DIGESTS_792));
          assert.equal(x.blindHumanReviewIndependentlyVerified,false);
          assert.equal(x.releaseAuthorized,false);
          console.log('M1_P799_ORIGINAL_10_SHA_23_PUBLISHER_POLYGON_ALL_ORACLE_ONLY');
          NODE
      - name: ACTUAL exact SHA-pinned SAM2 ONNX three genuine model decoder prompt arms for all 23 publisher polygons
        run: |
          python scripts/test-mission1-sam2-box-prompt-799.py
      - name: Verify all 23 point box and point+box actual original mask scores with no simulated owner approval
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('benchmark/mission1-sam2-box-prompt-799/source-prompt-comparison.json').read_text())
          assert x['schema']=='m1-p799-actual-sam2-source-publisher-ORACLE-point-box-arm-comparison/v1'
          assert x['selectedPhotoIds']==[15201,20490,13428,12197,15461,18553,19659,13585,17509,17401]
          assert x['publisherPhotoCount']==10 and x['realPublisherPolygonInstanceCount']==23
          assert len(x['rows'])==23
          assert len(set(z['publisherImageId'] for z in x['rows']))==10
          assert len(set((z['publisherImageId'],z['publisherInstanceId']) for z in x['rows']))==23
          assert x['actualSourceOriginalSHA256Verified'] is True
          assert x['allAlreadyExposedDevelopmentSources'] is True
          assert x['existingPublisherTruthUsedToProduceAllPrompts'] is True
          assert x['actualUserPromptCount']==0 and x['newIndependentBlindReviewerCount']==0
          assert x['actualPhysicalPhoneTests']==0
          assert x['automaticGarmentDetectionMeasured'] is False
          assert x['ownerMaskApprovedCount']==0 and x['autoSaveAllowed'] is False
          assert x['releaseAuthorized'] is False and x['familyAlpha']=='HOLD'
          assert x['promptArmNames']==['point','box','pointBox']
          for item in x['rows']:
            assert item['actualOwnerClickedOrDrewBox'] is False
            assert item['publisherTruthWasUsedToConstructPrompt'] is True
            assert item['autoSaveAllowed'] is False
            for arm,labels in [('point',[1]),('box',[2,3]),('pointBox',[1,2,3])]:
              d=item[arm]
              assert d['promptLabelCodes']==labels
              assert d['actualDecoderInvocation'] is True
              for choice in ['single','modelSelectedMultimask']:
                scored=d[choice]
                assert scored['truePositives']+scored['falseNegatives']==scored['publisherSourcePixelCount']
                assert scored['truePositives']+scored['falsePositives']==scored['predictedSourcePixelCount']
                assert 0<=scored['sourcePixelMaskIoU']<=1
          assert x['summary']['point']['modelSelectedMaskIoU50']==15
          assert abs(x['summary']['point']['sourcePixelMeanMaskIoU']-.600273)<.0005
          for arm in x['promptArmNames']:
            a=x['summary'][arm]
            assert a['sourcePublisherMasks']==23
            assert a['modelSelectedMaskIoU50']==sum(z[arm]['modelSelectedMultimask']['sourcePixelMaskIoU']>=.5 for z in x['rows'])
            assert 0<=a['modelSelectedMaskIoU50']<=23
            assert 0<=a['sourcePixelMeanMaskIoU']<=1
          assert x['boundedModelDownload'] is True and x['modelDownloadChunkBytes']==1048576
          assert x['originalJPEGDecodedOncePerPhoto'] is True
          assert len(x['processMemoryAfterEachSourceMiB'])==10
          assert x['measuredPeakProcessRSSMiB']<=4096
          print('M1_P799_REAL_23_SAM2_ORACLE_POINT_BOX_COMBINED_SOURCE_MASKS_NO_RELEASE',
                json.dumps(x['summary'],sort_keys=True))
          PY
      - name: Erase model weights and ALL original photographic bytes before evidence artifact upload
        if: always()
        run: |
          rm -rf /tmp/m1-sam2-796-weights benchmark/mission1-additional-publisher-originals-792/originals
          rm -rf benchmark/mission1-additional-publisher-originals-792/chromium benchmark/mission1-additional-publisher-originals-792/webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission1-P799-ten-genuine-originals-23-SAM2-point-box-oracle-publisher-mask-comparison-HOLD
          path: benchmark/mission1-sam2-box-prompt-799/source-prompt-comparison.json
          if-no-files-found: warn
          retention-days: 14
