name: MAIN1054 unified CAS test reconciliation HOLD
on:
  pull_request:
    branches: [research/main1054-owner-decision-recognition-HOLD]
    paths:
      - tests/mission3-auto-index-source-cas.test.cjs
      - .github/workflows/main1054-unified-cas-test-reconciliation-HOLD.yml
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/main1054-unified-cas-test-reconciliation-HOLD'
    strategy:
      fail-fast: false
      matrix:
        check: [regression, storage, chromium, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact parent and test-only reconciliation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor dd9a0a6acd8a1074d9ed7f9bbc09fe204c2d2927 HEAD
          git diff --exit-code dd9a0a6acd8a1074d9ed7f9bbc09fe204c2d2927 HEAD -- . ':(exclude)tests/mission3-auto-index-source-cas.test.cjs' ':(exclude).github/workflows/main1054-unified-cas-test-reconciliation-HOLD.yml'
          test "$(git rev-parse HEAD:tests/mission3-auto-index-source-cas.test.cjs)" = "6db6298fea150e61d582263c4e2292abc437b8c2"
          test "$(git rev-parse HEAD:public/app.js)" = "7676d18dcd23be764301fc246ff87a18dc21d8f4"
          git merge-base --is-ancestor 1c022c26dfe680135ad2e4b805ccad70a85e946c HEAD
          git diff --exit-code 1c022c26dfe680135ad2e4b805ccad70a85e946c HEAD -- . \
            ':(exclude)public/app.js' \
            ':(exclude)tests/main1054-owner-decision-recognition.test.mjs' \
            ':(exclude).github/workflows/main1054-owner-decision-recognition-HOLD.yml' \
            ':(exclude)tests/mission3-auto-index-source-cas.test.cjs' \
            ':(exclude).github/workflows/main1054-unified-cas-test-reconciliation-HOLD.yml'
          git show 1c022c26dfe680135ad2e4b805ccad70a85e946c:public/app.js > "$RUNNER_TEMP/recognition-parent-app.js"
          git log -1 --format='commit %H tree %T'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: node scripts/build.mjs
      - if: matrix.check == 'regression'
        name: Source-executed original RED and corrected owner decision tests
        run: |
          RECOGNITION_EXPECT_RED=1 RECOGNITION_SOURCE="$RUNNER_TEMP/recognition-parent-app.js" node --test tests/main1054-owner-decision-recognition.test.mjs
          node --test tests/main1054-owner-decision-recognition.test.mjs
          node --test tests/mission3-auto-index-source-cas.test.cjs
      - if: matrix.check == 'regression'
        run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
      - if: matrix.check == 'storage'
        run: npx playwright install --with-deps chromium webkit
      - if: matrix.check == 'storage'
        name: Inherited native reviewed save and wardrobe recovery checks
        run: |
          set -euo pipefail
          node scripts/test-main1054-reviewed-payload-native.mjs
          CONFLICT_OUT="$RUNNER_TEMP/review-concurrency" node scripts/test-outfit-draft-conflicts-browser.mjs
          node scripts/test-p1600-wardrobe-recovery-browser.mjs
          node scripts/test-mission3-lossless-v4-owner-acceptance-browser.mjs "$RUNNER_TEMP/review-backup"
      - if: matrix.check == 'chromium' || matrix.check == 'webkit'
        run: npx playwright install --with-deps "${{ matrix.check }}"
      - if: matrix.check == 'chromium' || matrix.check == 'webkit'
        name: Actual normal application photo containment and inference journey
        env:
          P99_ENGINE: ${{ matrix.check }}
          M58_ENGINE: ${{ matrix.check }}
        run: |
          set -euo pipefail
          P1607_AUDIT=1 P99_WIDTH=390 node scripts/test-parallel99-normal-app-browser.mjs
          node scripts/test-parallel94-native-p88-browser.mjs
          node scripts/check-1452-journey-receipts.mjs "$P99_ENGINE"
  acceptance:
    if: always()
    needs: [verify]
    runs-on: ubuntu-24.04
    env:
      RESULT: ${{ needs.verify.result }}
    steps:
      - run: test "$RESULT" = success
