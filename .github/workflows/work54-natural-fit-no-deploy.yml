name: Work54 natural starting fit HOLD (NO DEPLOY)
on:
  pull_request:
    paths: ['research/work54/**', 'scripts/*work54*', 'tests/work54*', '.github/workflows/work54-natural-fit-no-deploy.yml', 'research/work52/**', 'research/work47/editor.mjs', 'research/work47/portable-fit.mjs', 'tests/work47-portable-fit.test.mjs', 'scripts/test-family-alpha-67-portable-fit-browser.mjs', 'scripts/build-family-alpha-68-consolidated-hold.mjs', 'scripts/test-family-alpha-68-*.mjs', 'tests/family-alpha-68-*.test.mjs', '.github/workflows/family-alpha-68-consolidated-no-deploy.yml', 'research/work51/**', 'scripts/build-family-alpha-66-work51-review-lifecycle-hold.mjs', 'scripts/test-family-alpha-66-integrated-browser.mjs', 'tests/work51-proposal.test.mjs', 'tests/family-alpha-66-work51-lifecycle-integration.test.mjs', '.github/workflows/family-alpha-66-work51-lifecycle-no-deploy.yml']
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 fake-indexeddb@6.2.4
      - name: Fetch exact inherited source pins
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin 0fb6ab04ab79c36d449acee21aaaf4318871d647 879f1b92fb15f9bc9a7f0429c7ee178f7bbf1373 795ad6637f8d4f782bc99751211b25e8e72a3a7d 08ed6ac4a3fc921eae5d5d3df3bd3966429559d2 1ecac1079e75f1f25dc70a4c712b2448eb87dca8 d0ff131a4e5617e1a3f4fcfb40d00602fdce9833 68bed0c0f0f25538d0d5a00fbaf9aa34d80b8663 97397e80a7cf66e5e656c5b74c924a51e50f0f6f 44f288dfdcfa02ec5b2cf89a7c79c08cfcaa3584 e75cd4689356ae468a88504ddb25df4b4ff6cb70 c86f48f0119329e4001002304e2dfe480815b099 100ffc194793470c871f2b0c6092bc59f1c583b8 77d9f5b83eae475cd8d5d35593c1dc9c2e6bf02f
      - name: Verify exact Work50 automatic-isolation and gallery code was copied byte-for-byte
        run: |
          git fetch --no-tags origin 3c4034ca3b173f8886b374dd968594f8345edb84
          for file in research/work50/isolate.mjs research/work50/README.md research/work50/demo.mjs research/work50/index.html tests/work50-isolation.test.mjs tests/work50-benchmark.test.mjs scripts/build-work50-benchmark.mjs scripts/test-work50-browser.mjs; do
            git show 3c4034ca3b173f8886b374dd968594f8345edb84:"$file" | cmp - "$file"
          done
      - name: Verify imported Work51 algorithm and original safety regression are byte-identical to the tested Work51 head
        run: |
          git fetch --no-tags origin 043950847dcdaab98d82bdb07f8fe8c84341cc18
          for file in research/work51/propose.mjs tests/work51-proposal.test.mjs; do
            git show 043950847dcdaab98d82bdb07f8fe8c84341cc18:"$file" | cmp - "$file"
          done
      - name: Verify imported Work46 session safety files match exact successful PR355 head
        run: |
          git fetch --no-tags origin 8df9eebd12303c0e5ffae60ed27a5e0a14b8c5ec
          for file in scripts/build-work46-session-hold.mjs scripts/test-work46-navigation.mjs tests/work46-session-races.test.mjs; do
            git show 8df9eebd12303c0e5ffae60ed27a5e0a14b8c5ec:"$file" | cmp - "$file"
          done
      - name: Verify exact successful Work67 fit and Work52 pale source pins
        run: |
          git fetch --no-tags origin 8c0c077a23e4013ed6b51f9c6a99722b7251992f 214c1b497241e8b1b5002a83a0e88819db4a1fdd
          for file in scripts/build-work47-fit-hold.mjs research/work47/editor.mjs research/work47/portable-fit.mjs tests/work47-portable-fit.test.mjs tests/work47-alpha-background-safety.test.mjs tests/work47-atomic-preview.test.mjs tests/work47-edge-fringe.test.mjs tests/work47-foreground-occlusion.test.mjs scripts/test-family-alpha-67-portable-fit-browser.mjs; do
            git show 8c0c077a23e4013ed6b51f9c6a99722b7251992f:"$file" | cmp - "$file"
          done
          for file in research/work52/propose.mjs research/work52/fixtures.mjs tests/work52-proposal.test.mjs; do
            git show 214c1b497241e8b1b5002a83a0e88819db4a1fdd:"$file" | cmp - "$file"
          done
      - name: Build protected offline app and real licensed benchmark
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 playwright@1.56.1 fake-indexeddb@6.2.4
          git fetch origin research/work38-manual-outline
          node scripts/build-work47-parent.mjs
          node scripts/build-work47-benchmark.mjs
          node scripts/build-work49-cutout-hold.mjs
          node scripts/build-work49-benchmark.mjs
          node scripts/build-family-alpha-63-automatic-portable-hold.mjs
          node scripts/build-family-alpha-64-isolation-guidance-hold.mjs
          node scripts/build-family-alpha-65-review-lifecycle-hold.mjs
          node scripts/build-family-alpha-66-work51-review-lifecycle-hold.mjs
          node scripts/build-family-alpha-68-consolidated-hold.mjs
          node scripts/build-work50-benchmark.mjs
          node scripts/build-work54-fit-hold.mjs
          node scripts/build-work54-benchmark.mjs
      - name: Source, geometry and privacy regression tests
        run: |
          node --test tests/work54*.test.mjs tests/work47*.test.mjs tests/work48*.test.mjs tests/work49*.test.mjs tests/work50*.test.mjs tests/family-alpha-63*.test.mjs tests/family-alpha-64*.test.mjs tests/family-alpha-65*.test.mjs tests/family-alpha-66*.test.mjs tests/work51-proposal.test.mjs tests/work43/*.test.mjs tests/work46-session-races.test.mjs
          node --test tests/family-alpha-73-work54-mobile-layout.test.mjs
          node scripts/check-family-alpha-49-combined-visual-security-hold.mjs
      - name: Verify combined source-bound fit recovery, pale proposal, exact asset allowlist and protected stale-photo review
        run: |
          node --test tests/family-alpha-68-consolidated-hold.test.mjs tests/work47-portable-fit.test.mjs tests/work52-proposal.test.mjs
      - name: Full protected app with manual landmark editor
        run: node scripts/test-work54-integration-browser.mjs
      - name: Inherited licensed three-outfit and mobile navigation regression
        run: node scripts/test-family-alpha-51-mobile-nav-browser.mjs
      - name: Human-initiated visual review, evidence export and privacy safety (Chromium + WebKit)
        run: node scripts/test-work48-visual-review-browser.mjs
      - name: Private-free isolation review UI, retake and explicit confirmation in Chromium + WebKit
        run: node scripts/test-family-alpha-64-isolation-review-browser.mjs
      - name: Simulated Android and iPhone review supersession, listener cancellation, signed-in photo privacy
        run: node scripts/test-family-alpha-65-review-lifecycle-browser.mjs
      - name: Combined protected editor Work51 cleanup, local recovery and Work65 stale-photo cancellation
        run: node scripts/test-family-alpha-66-integrated-browser.mjs
      - name: Work68 reviewed Work52 clean-up + source recovery + stale photo review browser
        run: node scripts/test-family-alpha-68-editor-browser.mjs
      - name: Work68 exact-reviewed-PNG manual fit restoration browser (Chromium)
        run: node scripts/test-family-alpha-68-fit-browser.mjs
      - name: All fifteen photographs in both engines at all three widths
        run: |
          node scripts/test-work49-editor-browser.mjs
          node scripts/test-work49-browser.mjs
          node scripts/test-work50-browser.mjs
          node scripts/test-work54-browser.mjs
          node scripts/test-work54-editor-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: work54-natural-starting-fit-HOLD
          path: |
            benchmark/work47/
            benchmark/work48/
            benchmark/work49/
            benchmark/work50/
            benchmark/work54/
            benchmark/family-alpha-51-navigation/
            benchmark/family-alpha-64-review/
            benchmark/family-alpha-65-review/
            benchmark/family-alpha-66/
            benchmark/family-alpha-68/
