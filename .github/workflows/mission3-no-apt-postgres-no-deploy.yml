name: Mission 3 no-apt disposable PostgreSQL signed-owner full verification — NO DEPLOY
on:
  push:
    branches: [research/mission3-no-apt-disposable-pg-20261111-HOLD]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-owner-photo-capacity-revision:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable parent and no deployment scope without network dependencies
        run: |
          set -euo pipefail
          BASE=fa85a88947387df3740d4dd3171bcc1421898727
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --exit-code "$BASE" HEAD -- public/auth.js public/app.js public/photo-import.js public/cloud-backup-engine.js supabase package.json package-lock.json
          git diff --name-only "$BASE" HEAD | while read -r p; do
            case "$p" in
              scripts/bootstrap-mission3-disposable-postgres.mjs|research/mission3-no-apt-postgres/REPORT.md|.github/workflows/mission3-no-apt-postgres-no-deploy.yml) ;;
              *) echo "Offline owner capacity gate refuses changed path: $p"; exit 1 ;;
            esac
          done
      - name: Syntax check actual current controller and browser/tests without npm
        run: |
          node --version
          node --check public/cloud-backup.js
          node --check tests/mission3-stale-cloud-413-capacity.test.cjs
          node --check tests/mission3-stale-413-offline.test.cjs
          node --check scripts/test-mission3-stale-413-capacity-browser.mjs
          node --check scripts/bootstrap-mission3-disposable-postgres.mjs
      - name: Execute actual parent and fixed capacity transaction function in restricted Node VM
        run: |
          mkdir -p /tmp/closet-mission3-413-parent/public
          git show ab7a60754e403ecb3881f98b5695c4340c76c18c:public/cloud-backup.js > /tmp/closet-mission3-413-parent/public/cloud-backup.js
          CLOUD_SOURCE_ROOT=/tmp/closet-mission3-413-parent EXPECT_BASELINE=1 node --test tests/mission3-stale-413-offline.test.cjs
          node --test tests/mission3-stale-413-offline.test.cjs
  native-signed-two-owner-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mission3-temporary-only
          POSTGRES_DB: mission3_disposable
        options: >-
          --health-cmd "pg_isready -U postgres -d mission3_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: mission3-temporary-only
      PGDATABASE: mission3_disposable
      M3_EPHEMERAL_POSTGRES_URL: postgresql://postgres:mission3-temporary-only@postgres:5432/mission3_disposable
      P147_POSTGRES_URL: postgresql://postgres:mission3-temporary-only@postgres:5432/mission3_disposable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard exact Mission 3 P855 parent, restricted CI-only paths and no hosted changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=fa85a88947387df3740d4dd3171bcc1421898727
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --exit-code "$BASE" HEAD -- public/auth.js public/app.js public/photo-import.js public/cloud-backup-engine.js supabase research/signed-two-owner-transport-147 research/two-owner-cloud-rls-recovery-128 package.json package-lock.json
          git diff --name-only "$BASE" HEAD | while read -r p; do
            case "$p" in
              scripts/bootstrap-mission3-disposable-postgres.mjs|research/mission3-no-apt-postgres/REPORT.md|.github/workflows/mission3-no-apt-postgres-no-deploy.yml) ;;
              *) echo "Mission 3 refused unapproved changed path: $p"; exit 1 ;;
            esac
          done
      - name: Install pinned Node browser and PostgreSQL test dependencies (no apt package mirrors)
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
