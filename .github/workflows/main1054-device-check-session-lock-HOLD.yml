name: Main1054 device diagnostic session lock acceptance HOLD
on:
  pull_request:
    branches: [research/main1054-install-prompt-recovery-HOLD]
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'research/main1054-device-check-session-lock-HOLD' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lane: [chromium, webkit, regression]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact correction source, accepted base and isolated acceptance scope
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          base=b0ad2d85fe36ad764ceb1698c4be8d1823dcad3e
          candidate=a32cfa53d23679e646032d4a1f0370d8352072df
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$PR_BASE" = "$base"
          test "$(git rev-parse "$base^{tree}")" = 487e6fc47da511cc87652e6ec2219d4135da55fb
          git merge-base --is-ancestor "$base" "$candidate"
          git merge-base --is-ancestor "$candidate" HEAD
          printf '%s\n' '.github/workflows/main1054-device-check-session-lock-HOLD.yml' 'public/device-check.js' 'scripts/main1054-device-check-session-browser.mjs' 'tests/device-check-ui.test.cjs' 'tests/main1054-device-check-session-lock.cjs' > "$RUNNER_TEMP/expected-paths"
          git diff --name-only "$base" HEAD > "$RUNNER_TEMP/actual-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
          test "$(git rev-parse 'HEAD:public/device-check.js')" = '92b9536cf3d7d9a282197f7cf4265cc28024002d'
          test "$(git rev-parse 'HEAD:scripts/main1054-device-check-session-browser.mjs')" = '0312c2d4dc8e33fc1c2de81f15f1b1a3708c9cb2'
          test "$(git rev-parse 'HEAD:tests/main1054-device-check-session-lock.cjs')" = '7fb9abbb7a48d506d4455fe0cdb152f70742fb9c'
          test "$(git rev-parse 'HEAD:tests/device-check-ui.test.cjs')" = '84d1d97b5cd63b533f84cccecae9ed364b4b174b'
          git log -1 --format='tested commit %H tree %T'
          echo "Application correction source pinned to $candidate"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: node scripts/build.mjs
      - if: matrix.lane == 'regression'
        run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
      - if: matrix.lane != 'regression'
        env:
          A35_ENGINE: ${{ matrix.lane }}
          CC34_ENGINE: ${{ matrix.lane }}
          CC_AUTH_ENGINE: ${{ matrix.lane }}
          CC_INSTALL_ENGINE: ${{ matrix.lane }}
          CC_DEVICE_ENGINE: ${{ matrix.lane }}
        run: |
          npx playwright install --with-deps "$A35_ENGINE"
          node scripts/main1054-device-check-session-browser.mjs
          node scripts/main1054-install-prompt-browser.mjs
          node scripts/main1054-restored-session-browser.mjs
          node scripts/assignment-34/browser.mjs
          node scripts/assignment-35/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always() && matrix.lane != 'regression'
        with:
          name: assignment-35-${{ matrix.lane }}-HOLD
          path: benchmark/assignment-35/quality-*.json
          if-no-files-found: warn
