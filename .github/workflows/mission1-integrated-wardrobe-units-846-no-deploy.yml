name: Mission 1 P846 owner footwear and wardrobe-unit integration — NO DEPLOY
on:
  push:
    branches: [research/mission1-footwear-owner-reconciliation-integration-846-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mission1-p846-owner-units-HOLD
  cancel-in-progress: true
jobs:
  exact-parent-native-HOLD:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: P845 verified exact parent and 13-path NO DEPLOY research gate
        shell: bash
        run: |
          set -euo pipefail
          BASE=6aad19ae0705aa42e75b80583720210ce9d7e1ef
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD > /tmp/p846-paths
          cat /tmp/p846-paths
          test "$(wc -l < /tmp/p846-paths)" -eq 13
          while IFS= read -r path; do
            case "$path" in
              public/app.js|public/index.html|public/app-theme.css|public/outfit-capture.js|public/outfit-worker.mjs|public/outfit-unit-reconciliation-70.mjs|tests/outfit-unit-reconciliation-70.test.mjs|tests/outfit-unit-worker70.test.mjs|tests/mission1-integrated-owner-units-846.test.cjs|scripts/run-parallel70-browser.mjs|scripts/test-m1-owner-pair-admission-846.mjs|research/mission1-integrated-wardrobe-unit-846/REPORT.md|.github/workflows/mission1-integrated-wardrobe-units-846-no-deploy.yml) ;;
              *) echo "P846 OUT-OF-SCOPE CHANGE: $path"; exit 1 ;;
            esac
          done < /tmp/p846-paths
          test -z "$(git diff --name-only "$BASE" HEAD -- supabase public/auth.js public/local-worker.mjs public/outfit-segmentation.mjs public/recognition-engine.mjs benchmark public/recognition-vectors.bin public/recognition-vectors.json)"
          grep -Fqx 'const reviewFirst836=true;' <(grep '^const reviewFirst836=' public/app.js)
          grep -Fq 'let saveInFlight=false;' public/app.js
          grep -Fq 'purgePhotoQualityHints845' public/app.js
          grep -Fq 'const outfitUnits70=outfitInstances840' public/outfit-capture.js
          grep -Fq 'FAMILY ALPHA HOLD #255' research/mission1-integrated-wardrobe-unit-846/REPORT.md
          echo M1_P846_PINNED_13_PATHS_OWNER_REVIEW_NO_DEPLOY
      - name: Install temporary test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Actual source tests, worker receipt proofs and full native regression
        run: |
          set -euo pipefail
          node --check public/outfit-capture.js
          node --check public/outfit-worker.mjs
          node --check public/outfit-unit-reconciliation-70.mjs
          node --check public/app.js
          node --check scripts/test-m1-owner-pair-admission-846.mjs
          node --test tests/mission1-integrated-owner-units-846.test.cjs tests/outfit-unit-reconciliation-70.test.mjs tests/outfit-unit-worker70.test.mjs
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
          echo M1_P846_FULL_NATIVE_AND_BUILDS_PASS
  actual-chromium-webkit-owner-review-HOLD:
    needs: [exact-parent-native-HOLD]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real browser engines (desktop emulations, not physical phones)
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Build no-deploy research assets for owner-only shoe pairing
        run: node scripts/build.mjs
      - name: Actual P840/#70 P846 owner grouping and source mask review (320/390/430)
        run: |
          set -euo pipefail
          node scripts/run-parallel70-browser.mjs benchmark/parallel70-browser
          node scripts/test-m1-owner-pair-admission-846.mjs
      - name: Retain P845 photo safety, default owner review, P844 write lock and crop control
        run: |
          set -euo pipefail
          node scripts/test-parallel73-photo-quality-browser.mjs
          node scripts/test-m1-review-first-default-843.mjs
          node scripts/test-m1-review-save-lifecycle-844.mjs parent
          node scripts/test-m1-review-save-lifecycle-844.mjs candidate
          node scripts/test-m1-owner-review-editor-839.mjs
          echo M1_P846_ALL_BROWSER_INTEGRATION_ACCEPTANCE_PASS
  genuine-photo-nonaccuracy-audit-HOLD:
    needs: [exact-parent-native-HOLD]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      P73_PHOTO_IDS: commons-0003,commons-0014,commons-0021,commons-0033,commons-0049,commons-0060,commons-0077,commons-0082,commons-0094,validation-0001,validation-0019
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary lawful-photo decoder
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3
      - name: Verify legally permitted original source hashes for pixel diagnostics
        run: |
          set -euo pipefail
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos "$P73_PHOTO_IDS"
          node scripts/evaluate-parallel73-real-photo.mjs
          echo M1_P846_ORIGINAL_PHOTO_HASHES_PASS_NO_SHOE_PAIR_GROUND_TRUTH
