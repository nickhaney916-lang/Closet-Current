name: BOUNDS58 bounded mobile detector proposals and private native review NO DEPLOY
on:
  push:
    branches:
      - research/bounded-detection-review-58-main-20261105-HOLD
  pull_request:
    paths:
      - 'research/multi-garment-capture-01/detection-intake-58.mjs'
      - 'research/multi-garment-capture-01/review-ui.mjs'
      - 'research/detector-proposal-native-acceptance-57/injected-detector-worker.js'
      - 'scripts/test-multi-garment-capture-01-browser.mjs'
      - 'scripts/audit-bounded-detection-58-browser.mjs'
      - 'tests/bounded-detection-review-58.test.mjs'
      - 'tests/review-source-epoch-34.test.mjs'
      - 'tests/review-worker-finality-38.test.mjs'
      - 'research/bounded-detection-review-58/**'
      - '.github/workflows/bounded-detection-review-58-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-photo-bounded-native-detection:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Strict verified DETECTOR57 baseline and prohibited production/staging change audit
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor f2aaf736f19213c2dadc25ad0d12bcc575129ee0 HEAD
          git diff --name-only f2aaf736f19213c2dadc25ad0d12bcc575129ee0 HEAD > /tmp/bounds58-files
          while IFS= read -r path; do
            case "$path" in
              research/multi-garment-capture-01/detection-intake-58.mjs|research/multi-garment-capture-01/review-ui.mjs|research/detector-proposal-native-acceptance-57/injected-detector-worker.js|scripts/test-multi-garment-capture-01-browser.mjs|scripts/audit-bounded-detection-58-browser.mjs|tests/bounded-detection-review-58.test.mjs|tests/review-source-epoch-34.test.mjs|tests/review-worker-finality-38.test.mjs|research/bounded-detection-review-58/*|.github/workflows/bounded-detection-review-58-no-deploy.yml) ;;
              *) echo "BLOCKED unrelated app, staging or production edit: $path"; exit 1 ;;
            esac
          done < /tmp/bounds58-files
      - name: Install pinned dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Build app and run entire Node regression including adversarial 1000-region budget tests
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Six real manual original-photo to owner-private closet baseline browser regressions
        run: node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Six actual native original-photo synthetic single-detector proposal regressions
        run: DETECTOR57=1 node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Six actual native original-photo 1000-proposal worker flood review and private-closet acceptance
        run: DETECTOR58=1 node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Audit source and all 78 stress screenshots exact SHA and mobile sizes
        run: node scripts/audit-bounded-detection-58-browser.mjs
      - name: Upload sanitized accepted run manifests and native screenshots no original photographs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BOUNDS58-1000-proposal-real-native-mobile-private-review-HOLD
          path: |
            benchmark/multi-garment-capture-01/acceptance.json
            benchmark/detector-proposal-native-57/acceptance.json
            benchmark/bounded-detection-review-58/acceptance.json
            benchmark/bounded-detection-review-58/*.png
          if-no-files-found: warn
          retention-days: 14
