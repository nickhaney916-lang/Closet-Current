name: P1650 mobile wardrobe performance HOLD
on:
  pull_request:
    branches: [research/p1644-regression-closure-HOLD]
    paths:
      - scripts/p1650-mobile-performance.cjs
      - .github/workflows/p1650-mobile-performance-HOLD.yml
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/p1650-mobile-performance-HOLD'
    strategy:
      fail-fast: false
      matrix:
        check: [regression, chromium, webkit, storage]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm exact source and benchmark-only scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor 949adddc4c05538586cca5107abf03fd5246283c HEAD
          git diff --exit-code 949adddc4c05538586cca5107abf03fd5246283c HEAD -- . ':(exclude)scripts/p1650-mobile-performance.cjs' ':(exclude).github/workflows/p1650-mobile-performance-HOLD.yml'
          node --check scripts/p1650-mobile-performance.cjs
          git log -1 --format='commit %H tree %T'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: node scripts/build.mjs
      - if: matrix.check == 'regression'
        run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
      - if: matrix.check == 'storage'
        run: npx playwright install --with-deps chromium webkit
      - if: matrix.check == 'storage'
        run: |
          set -euo pipefail
          node scripts/test-main1054-reviewed-payload-native.mjs
          CONFLICT_OUT="$RUNNER_TEMP/review-concurrency" node scripts/test-outfit-draft-conflicts-browser.mjs
          node scripts/test-p1600-wardrobe-recovery-browser.mjs
          node scripts/test-mission3-lossless-v4-owner-acceptance-browser.mjs "$RUNNER_TEMP/review-backup"
      - if: matrix.check == 'chromium' || matrix.check == 'webkit'
        run: npx playwright install --with-deps "${{ matrix.check }}"
      - if: matrix.check == 'chromium' || matrix.check == 'webkit'
        name: Actual mobile viewport wardrobe performance baseline
        env:
          P99_ENGINE: ${{ matrix.check }}
          P1650_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          M58_ENGINE: ${{ matrix.check }}
        run: P99_WIDTH=390 node scripts/p1650-mobile-performance.cjs
      - if: always() && (matrix.check == 'chromium' || matrix.check == 'webkit')
        uses: actions/upload-artifact@v4
        with:
          name: p1650-performance-${{ matrix.check }}
          path: benchmark/parallel99-normal-journey/${{ matrix.check }}/390/P1650-PERFORMANCE.json
          if-no-files-found: warn
      - if: matrix.check == 'chromium' || matrix.check == 'webkit'
        name: Inherited ordinary app journeys
        env:
          P99_ENGINE: ${{ matrix.check }}
          M58_ENGINE: ${{ matrix.check }}
        run: |
          set -euo pipefail
          for width in 320 390 430; do
            P1607_AUDIT=1 P99_WIDTH="$width" node scripts/test-parallel99-normal-app-browser.mjs
          done
          node scripts/test-parallel94-native-p88-browser.mjs
          node scripts/check-1452-journey-receipts.mjs "$P99_ENGINE"
  acceptance:
    if: always()
    needs: [verify]
    runs-on: ubuntu-24.04
    env:
      RESULT: ${{ needs.verify.result }}
    steps:
      - run: test "$RESULT" = success
