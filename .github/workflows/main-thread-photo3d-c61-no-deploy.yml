name: "MAIN1054 M15 genuine M2 C61 3D NO-GO + signed original photo 2D — NO DEPLOY"
on:
  push:
    branches: [research/main-thread-photo3d-c61-evidence-gate-1054-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: main1054-m15-c61-original-photo-hold
  cancel-in-progress: true
jobs:
  pinned-evidence-and-node-NO-DEPLOY:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pinned M14 exact HEAD and five read-only research files only
        shell: bash
        run: |
          set -euo pipefail
          BASE=905de45c7a6bf0738080c56a51d602f6bb5deab1
          git merge-base --is-ancestor "$BASE" HEAD
          CHANGED="$(git diff --name-only "$BASE" HEAD)"
          test "$(printf '%s\n' "$CHANGED" | wc -l)" -eq 5
          while IFS= read -r p; do
            case "$p" in
              research/main-thread-integration-1054/photographed-3d-evidence-gate15.mjs|\
              research/main-thread-integration-1054/photographed-3d-evidence-gate15.test.mjs|\
              research/main-thread-integration-1054/native-2d-preview.mjs|\
              research/main-thread-integration-1054/MILESTONE15.md|\
              .github/workflows/main-thread-photo3d-c61-no-deploy.yml) ;;
              *) echo "MAIN1054_M15_SCOPE_ERROR $p" >&2; exit 1 ;;
            esac
          done <<< "$CHANGED"
          git diff --exit-code "$BASE" HEAD -- public/ supabase/ benchmark/ package.json package-lock.json
          test "$(git hash-object public/closet-stylist.js)" = "f2657fffb17a3b2cc606f32b4206a574ef5ddf88"
          test "$(git hash-object public/dual-panel-82.mjs)" = "1a6062877be41a831cb4724448d482405ce75727"
          node --check research/main-thread-integration-1054/photographed-3d-evidence-gate15.mjs
          node --check research/main-thread-integration-1054/photographed-3d-evidence-gate15.test.mjs
          node --check research/main-thread-integration-1054/native-2d-preview.mjs
          echo "M15 genuine C61 sampled geometry NO-GO; unchanged native auth and P880 review"
      - name: Test-only dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Existing PWA build and original 3D risk/2D source gates
        run: |
          node scripts/build.mjs
          node --test research/main-thread-integration-1054/photographed-3d-evidence-gate15.test.mjs
          node --test research/main-thread-integration-1054/source-to-outfit.test.mjs
          node --test research/main-thread-integration-1054/test-native-session-contract14.mjs
      - name: Full inherited Node privacy/recognition/wardrobe/backup/3D regressions
        run: node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Never promote 3D trial or release Family Alpha
        run: |
          echo "Measured 196 original crossings, candidate C61 strain 178 faces >5% and area 90 faces >10%; 3D NO-GO"
          echo "Family Alpha #255 OPEN HOLD. No staging, production, Supabase or owner photo changes"
  native-owner-original-2d-and-safe-review-NO-DEPLOY:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify immutable M14 native 2D contract and C61 research integration only
        shell: bash
        run: |
          set -euo pipefail
          BASE=905de45c7a6bf0738080c56a51d602f6bb5deab1
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE" HEAD | wc -l)" -eq 5
          git diff --exit-code "$BASE" HEAD -- public/ supabase/
          test "$(git hash-object public/closet-stylist.js)" = "f2657fffb17a3b2cc606f32b4206a574ef5ddf88"
      - name: Install native browser test runtime only
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: npx playwright install --with-deps chromium webkit
      - name: Native P880 source owner-review and no auto save at mobile widths
        run: node scripts/test-main1054-dual-review-browser.mjs
      - name: Actual native authenticated photo outfit previews must retain 2D and no 3D
        run: node scripts/test-main1054-native-preview-browser.mjs
      - name: Repeat photo safety and full source-evidence denial
        run: |
          node --test research/main-thread-integration-1054/photographed-3d-evidence-gate15.test.mjs
          node --test research/main-thread-integration-1054/source-to-outfit.test.mjs
      - name: Reject fake real-model, real-phone or hosted release claims
        run: |
          node -e "const r=require('./benchmark/main1054-dual-policy-browser/results.json'); if(r.status!=='PASS'||r.total!==54||r.genuineModelsRun!==false||r.physicalPhones!==false||r.hostedCloud!==false||r.autoSaved!==false||r.releaseAuthorized!==false||r.familyAlpha!=='HOLD')process.exit(1);console.log('M15_RESEARCH_ONLY_OWNER_POLICY',r.total)"
          echo "No 3D candidate installed, no human realism assessment, no release, no deploy"
