name: Reusable figure local-only preview QA
on:
  push:
    branches: [feature/reusable-figure-local-closet-preview-20261019, feature/local-garment-mesh-warp-20261019, feature/local-fitting-landmarks-20261019, integration/local-fit-alpha-and-landmarks-20261019, fix/atomic-private-preview-cache-20261019]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  figure-and-integrated-node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify local wardrobe layering, privacy and no billable requests
        run: node --test tests/figure-preview-cache.test.cjs tests/garment-fit-geometry.test.cjs tests/local-garment-warp.test.cjs tests/reusable-figure-preview.test.cjs tests/outfit-board.test.cjs
      - name: Build and run full Node integration suite
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Install isolated browser emulation (not physical phones)
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium webkit
      - name: Verify local reusable figures and temporary selfie in Android and iPhone browser emulation
        run: node scripts/test-reusable-figure-phone-browsers.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-fitting-licensed-photo-browser-evidence
          path: artifacts/local-fitting/
      - name: Paid backend approvals must stay disabled
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const edge=fs.readFileSync('supabase/functions/ai-try-on/index.ts','utf8');
            const html=fs.readFileSync('public/index.html','utf8');
            const ui=fs.readFileSync('public/reusable-figure-preview.js','utf8');
            if(!edge.includes('RESERVED_PAID_INFERENCE_APPROVED=false')||
               !edge.includes('CHAINED_PAID_INFERENCE_APPROVED=false')||
               !html.includes('id=\"reusableSelfieUpload\"')||
               /fetch\(|localStorage|sessionStorage/.test(ui))
              throw Error('Local reusable avatar or privacy policy violated');
          "
