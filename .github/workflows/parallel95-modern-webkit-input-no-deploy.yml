name: P95 modern WebKit 1.65.1 input gesture comparison NO DEPLOY
on:
  push:
    branches: [fix/parallel95-webkit-source-restore-reentry-HOLD]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  p95-modern-webkit-input:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      M51_ENGINE: webkit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact original-source protection and isolated newer browser binary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor bddcc4da68bee90fb2aad545cffc2aaa620c959e HEAD
          test "$(git rev-parse HEAD:public/outfit-board.js)" = 5668a4bc6da2e94fc13d23392cd7fb4981d0bc2d
          test "$(git rev-parse HEAD:scripts/test-main51-real-app-owner-original-2d.mjs)" = 63cc9da00eaecbeb2576482dcae1528b44ea8189
          test "$(git rev-parse HEAD:research/main-thread-integration-1054/native-2d-preview.mjs)" = 0af20d49d87436683630d587ec0284c611cd3414
          git diff --exit-code bddcc4da68bee90fb2aad545cffc2aaa620c959e HEAD -- public/ ':(exclude)public/outfit-board.js' supabase/ research/main-thread-integration-1054/
          node --check scripts/test-parallel95-native-source-restore-reentry.mjs
      - name: Install test-only pinned latest Playwright and existing source-safe dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.65.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Install version-matched WebKit runtime on disposable Ubuntu runner
        run: npx playwright install --with-deps webkit
      - name: Show only isolated engine and WebKit version, never private test data
        run: |
          node --input-type=module - <<'JS'
          import {webkit} from 'playwright';
          const b=await webkit.launch({headless:true});
          console.log('P95_MODERN_WEBKIT_ENGINE',JSON.stringify({playwright:'1.65.1',engine:webkit.name(),version:b.version()}));
          await b.close();
          JS
      - name: Repeat six completely fresh modern WebKit native app processes, mixed click and genuine mobile tap
        shell: bash
        run: |
          set -euo pipefail
          for trial in $(seq 1 6); do
            echo "P95_MODERN_WEBKIT_PROCESS_BEGIN trial=$trial sha=$(git rev-parse HEAD)"
            node scripts/test-parallel95-native-source-restore-reentry.mjs
            echo "P95_MODERN_WEBKIT_PROCESS_STRICT_PASS trial=$trial widths=320,390,430"
          done
          echo "P95_MODERN_WEBKIT_PROCESS_6_OF_6_PASS noRetries=true"
