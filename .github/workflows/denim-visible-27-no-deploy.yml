name: DENIM-VISUAL-27 authentic 96-frame human-review quality gate (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'research/denim-visible-27/**'
      - 'scripts/audit-denim-visible-27.mjs'
      - 'tests/denim-visible-27.test.mjs'
      - '.github/workflows/denim-visible-27-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-photograph-and-silhouette-visual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Exact P26 verified ancestor and STRICT no production changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 1679cda2ac31bd01a08b036abdf4f4acf810f3ce HEAD
          git diff --name-only 1679cda2ac31bd01a08b036abdf4f4acf810f3ce HEAD | while IFS= read -r path; do
            case "$path" in
              research/denim-visible-27/*|scripts/audit-denim-visible-27.mjs|tests/denim-visible-27.test.mjs|.github/workflows/denim-visible-27-no-deploy.yml) ;;
              *) echo "DENIM27 UNAUTHORIZED prod/photo/model/parallel change: $path"; exit 1 ;;
            esac
          done
      - name: Pin genuine photos, WebGL rigs and offline image QA dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 three@0.180.0 playwright@1.56.1 three-mesh-bvh@0.9.2
      - name: P26 and P27 visual-evidence privacy and integrity regression tests
        run: |
          node --check scripts/audit-denim-visible-27.mjs
          node --check research/denim-visible-27/source-honest-visual-gate.mjs
          node --test tests/denim-visible-27.test.mjs tests/denim-anatomical-hang-26.test.mjs tests/denim-source-neutral-weave-25.test.mjs
      - name: Rebuild exact licensed photographed jeans and original 163-bone anatomical GLBs
        run: |
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node scripts/build-work47-benchmark.mjs
          git fetch --no-tags origin 53f2ad344dc56a1477e343531c423aed0e66c17d dd6bac3fa9ff640d4f562cf925337440bdb5cf8f 3a572193987cb29389727426136c6eb3ac326783 dfb40889c4c1221fb1833b859e8a11ef38aeb76e
          node research/three-d-20/restore-approved-models.mjs
      - name: Re-render all 96 genuine original photographed WebGL jeans views
        run: node scripts/test-denim-anatomical-hang-26-browser.mjs
      - name: Independently audit source pixels and produce 12 genuine contact sheets
        run: node scripts/audit-denim-visible-27.mjs
      - name: Enforce strict honest visual acceptance on exact web evidence
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,existsSync} from 'node:fs';
          const d=JSON.parse(readFileSync('benchmark/denim-visible-27/visual-acceptance.json'));
          assert.equal(d.fullOriginalSourceScreenshots,96);
          assert.equal(d.verifiedPairs,48);
          assert.equal(d.contactSheetCount,12);
          assert.equal(d.comparisons.length,48);
          assert.ok(d.comparisons.every(x=>x.metrics.fullyVisible&&x.noNewBVHContacts));
          assert.equal(d.originalSourceFrontSHAUVRestSkinPreserved,true);
          assert.equal(d.unphotographedBackMaterial,'MODELED_NOT_PHOTOGRAPHED');
          assert.equal(d.photorealismAcceptance,'REVIEW');
          assert.equal(d.realPhoneAcceptance,'NOT_TESTED');
          assert.equal(d.familyAlpha,'HOLD');
          assert.equal(d.releaseAuthorized,false);
          assert.equal(d.productionModified,false);
          for(const f of d.contactSheets)assert.ok(existsSync('benchmark/denim-visible-27/'+f));
          console.log('DENIM27: 96 source-honest WebGL views, 12 true 4-angle contact sheets, photorealism REVIEW');
          NODE
      - name: Upload exact source-honest WebGL proof and 12 labeled review strips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DENIM27-96-original-photo-WebGL-12-contact-sheets-HOLD
          path: |
            benchmark/denim-visible-27/
            benchmark/denim-anatomical-hang-26/results.json
          if-no-files-found: warn
