name: M2 category original rig placement HOLD
on:
  push:
    branches: [research/m2-category-rig-alignment-20261123-HOLD]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  original-rig-placement:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact parent and scoped paths
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 6f20d8d0bff7ed0d7e2fd24622033310271c46c0 HEAD
          while IFS= read -r p; do
            case "$p" in
              research/parallel89/category-rig-alignment89.mjs|scripts/test-parallel89-category-rig-alignment.mjs|.github/workflows/m2-category-rig-alignment-HOLD.yml) ;;
              *) echo "Unexpected scope: $p"; exit 1 ;;
            esac
          done < <(git diff --name-only 6f20d8d0bff7ed0d7e2fd24622033310271c46c0 HEAD)
      - name: Existing pinned dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 playwright@1.56.1 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Original immutable licensed male female GLB donor
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          git worktree add --detach .m2-immutable-licensed-body df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          test "$(git -C .m2-immutable-licensed-body rev-parse HEAD)" = df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          ln -s ../node_modules .m2-immutable-licensed-body/node_modules
          cd .m2-immutable-licensed-body
          node research/three-d-20/restore-approved-models.mjs
      - name: Twelve actual source category to original rig rest joint placement trials
        run: node scripts/test-parallel89-category-rig-alignment.mjs .m2-immutable-licensed-body
      - name: Unchanged application build
        run: node scripts/build.mjs
      - name: Full inherited Node regression
        run: node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M2-category-rig-placement-HOLD
          path: benchmark/m2-category-rig-placement-HOLD/
          retention-days: 7
          if-no-files-found: warn
