name: Mission 1 P825 original-owner crop session lease across decode, quality and queued draft — NO DEPLOY
on:
  push:
    branches: [research/mission1-crop-owner-session-lease-825-HOLD]
  pull_request:
    branches: [research/mission1-saved-ambiguous-crop-write-fence-824-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m1-p825-owner-crop-lease-HOLD-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-p824-parent-full-native-and-complete-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require verified P824 source and exactly five no-deploy code/test/report paths
        run: |
          set -euo pipefail
          BASE=44631d716648b9824d60b69c0d5b0b72ea903a6d
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD >/tmp/m1-p825-paths
          cat /tmp/m1-p825-paths
          test "$(wc -l </tmp/m1-p825-paths)" -eq 5
          while IFS= read -r p; do
            case "$p" in
              public/app.js|public/photo-crop-editor.js|tests/mission1-ambiguous-photo-crop-822.test.mjs|research/mission1-crop-owner-session-825/REPORT.md|.github/workflows/mission1-crop-owner-session-825-no-deploy.yml) ;;
              *) echo "UNAPPROVED PRIVATE SOURCE/MODEL/CLOUD/RELEASE CHANGE: $p";exit 1;;
            esac
          done </tmp/m1-p825-paths
          test -z "$(git diff --name-only "$BASE" HEAD -- supabase benchmark public/native-reviewed-private-save-167.mjs research/manual-reviewed-private-save-119/reviewed-source-commit.mjs)"
          grep -Fq 'FAMILY ALPHA HOLD #255' research/mission1-crop-owner-session-825/REPORT.md
          grep -Fq 'MISSION 1 NOT COMPLETE' research/mission1-crop-owner-session-825/REPORT.md
          echo P825_VERIFIED_P824_PARENT_ONLY_FIVE_PATHS_NO_DEPLOY
      - name: Ephemeral all-app Node dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Native actual crop, editor, owner SHA tests then bundle and complete application suite
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check public/photo-crop-editor.js
          node --check tests/mission1-ambiguous-photo-crop-822.test.mjs
          node --test tests/mission1-ambiguous-photo-crop-822.test.mjs tests/mission1-ambiguous-owner-edit-820.test.mjs tests/mission1-cutout-visible-photo-823.test.mjs
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  independent-async-owner-draft-race-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute real native handler and delayed Image.decode lease rejection
        run: |
          set -euo pipefail
          node --test tests/mission1-ambiguous-photo-crop-822.test.mjs
          grep -Fq "session!==lease825.captureSession||!batch.includes(item)" public/app.js
          grep -Fq "const tx=(lease825?.db||db).transaction('state','readwrite')" public/app.js
          grep -Fq "if(!isActive())throw Error('Crop owner/source changed during original JPEG decode')" public/photo-crop-editor.js
          echo P825_LATE_JPEG_DECODE_NO_CROSS_OWNER_DRAFT_WRITE_NO_RELEASE
