name: 3D-13 source-bound inner cuff gap repair (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'research/three-d-13/**'
      - 'research/three-d-11/natural-drape.mjs'
      - 'tests/three-d-13-cuff.test.mjs'
      - '.github/workflows/three-d-13-cuff-repair-no-deploy.yml'
permissions:
  contents: read
jobs:
  adult-cuff-original-fabric-rig:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Strict five-file research-only patch against PR411 exact source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin 7cdbd8cbdd88fabe862b39e584af42609bec1634
          git diff --name-only 7cdbd8cbdd88fabe862b39e584af42609bec1634 HEAD | while IFS= read -r path; do
            case "$path" in
              research/three-d-13/*|research/three-d-11/natural-drape.mjs|tests/three-d-13-cuff.test.mjs|.github/workflows/three-d-13-cuff-repair-no-deploy.yml) ;;
              *) echo "Unexpected original photo, 2D, other Work, wardrobe, auth, prod, staging or Drive Duel source: $path"; exit 1 ;;
            esac
          done
          test "$(git diff --name-only 7cdbd8cbdd88fabe862b39e584af42609bec1634 HEAD | wc -l)" -le 5
      - name: Install pinned, local research and real WebGL harness
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 three@0.180.0 playwright@1.56.1
      - name: Reconstruct verified 15 licensed originals and existing cutouts, lock CC0 rigs
        run: |
          git fetch --no-tags origin 53f2ad344dc56a1477e343531c423aed0e66c17d dd6bac3fa9ff640d4f562cf925337440bdb5cf8f 3a572193987cb29389727426136c6eb3ac326783
          node scripts/build-work47-benchmark.mjs
          node research/three-d-06/fetch-licensed-avatars.mjs
      - name: Exact source-safe cuff geometry male female skin weights and Work59 regressions
        run: |
          node --test tests/three-d-13-cuff.test.mjs
          node --test --test-name-pattern='targeted geometry' tests/three-d-11-drape.test.mjs
      - name: Real male female Chromium WebGL two poses four angles original photo and phone safety
        run: node scripts/test-three-d-11-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: THREE-D-13-REAL-INNER-CUFF-REPAIR-SOURCE-RGB-HOLD
          path: |
            benchmark/three-d-11/
            research/three-d-06/models/verified-assets.json
          if-no-files-found: warn
