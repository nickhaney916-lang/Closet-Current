name: Integrated restricted staging safeguards (no deployment)
on:
  push:
    branches: [integration/restricted-staging-safeguards-20261021]
permissions:
  contents: read
jobs:
  integrated-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify ancestry and unchanged customer runtime
        run: |
          git merge-base --is-ancestor 7c5584526bcad0439876aabe1f30889e817806c7 HEAD
          git merge-base --is-ancestor 2b2423b1fae5af5f9f9d7def94162a3b5e166b38 HEAD
          git diff --exit-code 7c5584526bcad0439876aabe1f30889e817806c7 HEAD -- public supabase .github/workflows/pages.yml .github/workflows/cloudflare-pages.yml
          node scripts/check-integrated-pilot-rc.mjs
          node scripts/check-staging-preflight-scope.mjs
      - name: Full build and regression suite including isolated security scenarios
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Validate synthetic staging bundle without network calls or publishing
        env:
          CLOSET_STAGING_APP_ORIGIN: https://preview.closet-current-staging.pages.dev/
          CLOSET_STAGING_SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
          CLOSET_STAGING_SUPABASE_PUBLISHABLE_KEY: sb_publishable_STAGING_TEST_FIXTURE_XYZ001
        run: |
          node scripts/build-restricted-staging.mjs
          node scripts/verify-restricted-staging-bundle.mjs
