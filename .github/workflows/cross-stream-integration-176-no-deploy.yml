name: P176 current owner index restore readiness real browser integration NO DEPLOY
on:
  push:
    branches:
      - research/cross-stream-ci-compatibility-176-main-20261108-HOLD
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-parent-and-full-node:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm exact verified P175 parent and seven CI-only research paths
        run: |
          set -eu
          BASE=ed37811efd44c9920c5c67bc743e34911a57b578
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          FIRST="$(git rev-list --reverse "$BASE..HEAD" | head -n1)"
          test "$(git rev-parse "$FIRST^")" = "$BASE"
          git diff --name-only "$BASE" HEAD >/tmp/p176-paths
          while IFS= read -r p; do
            case "$p" in
              scripts/legacy-scope-applicability-176.mjs|scripts/modern-original-photo-review-fixture-176.mjs|tests/cross-stream-applicability-176.test.mjs|research/cross-stream-ci-176/REPORT.md|.github/workflows/cross-stream-integration-176-no-deploy.yml|.github/workflows/native-index-live-07-no-deploy.yml|.github/workflows/native-restore-3d-06-no-deploy.yml|.github/workflows/native-photo-readiness-08-no-deploy.yml) ;;
              *) echo "P176 BLOCKED unrelated source or production file $p"; exit 1 ;;
            esac
          done </tmp/p176-paths
          test "$(wc -l </tmp/p176-paths)" -eq 8
          git diff --exit-code "$BASE" HEAD -- public research/native-3d-05 research/photo-dress-anatomical-drape-61 research/native-original-dress-drape-175 research/source-shoulder-seam-174 research/photo-torso-contour-172 supabase migrations benchmark/fixtures package.json package-lock.json
          node --check scripts/legacy-scope-applicability-176.mjs
          node --check scripts/modern-original-photo-review-fixture-176.mjs
          node --check tests/cross-stream-applicability-176.test.mjs
      - name: Install isolated Node and browser test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Verify adversarial legacy-scope classifier and original SHA guard preservation
        run: node --test tests/cross-stream-applicability-176.test.mjs
      - name: Build unchanged application and run all inherited Node regression tests
        run: |
          node scripts/build.mjs
          node --test tests/*.cjs tests/*.mjs
  current-native-original-photo-consumer-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        suite: [index, restore, readiness]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verified real Chromium and original SHA screenshot dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Build actual current private app and immutable real original 163-bone P541 donor
        run: |
          set -eu
          node scripts/build.mjs
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          git worktree add --detach .native05-donor-541 df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          git config --global --add safe.directory "$GITHUB_WORKSPACE/.native05-donor-541"
          ln -s ../node_modules .native05-donor-541/node_modules
          cd .native05-donor-541
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
          test -f benchmark/work47/manifest.json
      - name: Run actual original photo indexing, private atomic V4 restore, or source readiness through signed-mock consumer browser and 163-bone WebGL
        run: |
          set -eu
          # The CURRENT live UI requires two explicitly checked human-review
          # confirmations for saved original JPEGs; old test browsers must
          # simulate those real user actions, never bypass source guardrails.
          if [ "$SUITE" != restore ]; then
            node scripts/modern-original-photo-review-fixture-176.mjs
          fi
          case "$SUITE" in
            index)
              # Independent CURRENT native 163 bone 3D smoke in addition to
              # the original photo-to-index live refresh acceptance.
              node scripts/test-native-3d-05-browser.mjs
              node scripts/audit-native-3d-05.mjs
              node scripts/test-native-index-live-07-browser.mjs
              node scripts/audit-native-index-live-07.mjs
              ;;
            restore)
              node scripts/repro-restore-atomic-01-baseline.mjs
              node scripts/test-restore-atomic-01-browser.mjs
              node scripts/audit-restore-atomic-01.mjs
              node scripts/test-native-restore-3d-06-browser.mjs
              node scripts/audit-native-restore-3d-06.mjs
              ;;
            readiness)
              node scripts/test-native-photo-readiness-08-browser.mjs
              node scripts/audit-native-photo-readiness-08.mjs
              node scripts/test-user-photo-3d-01-browser.mjs
              node scripts/audit-user-photo-3d-01.mjs
              ;;
            *) echo "P176 unknown suite"; exit 1 ;;
          esac
      - name: Independently verify genuine 320 390 430 browser screenshots, original SHA, private owner safety and HOLD
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const suites={
           index:{prefix:'native-index-live-07',audit:'native-index-live-07-audit',count:18,
            priority:'NATIVE-INDEX-LIVE-07'},
           restore:{prefix:'native-restore-3d-06',audit:'native-restore-3d-06-audit',count:15,
            priority:'NATIVE-RESTORE-3D-06'},
           readiness:{prefix:'native-photo-readiness-08',audit:'native-photo-readiness-08-audit',
            count:24,priority:'NATIVE-PHOTO-READINESS-08'}
          };
          const mode=process.env.SUITE,s=suites[mode];
          assert.ok(s,'Unrecognized acceptance class');
          const prefix='benchmark/'+s.prefix+'/',audit='benchmark/'+s.audit+'/';
          const r=JSON.parse(readFileSync(prefix+'results.json','utf8'));
          const a=JSON.parse(readFileSync(audit+'acceptance.json','utf8'));
          assert.equal(r.priority,s.priority);
          assert.deepEqual(r.widths,[320,390,430]);
          assert.equal(r.cases,3);assert.equal(r.screenshots,s.count);
          assert.equal(r.evidence.length,3);assert.equal(r.screens.length,s.count);
          assert.equal(r.realWebGL,true);
          assert.equal(r.originalNativeAuthHTTPOnlyMocked,true);
          assert.equal(r.realSignedRLS,false);
          assert.equal(r.originalUserSavedStateUnmodified,true);
          assert.deepEqual(r.crashes,[]);assert.deepEqual(r.errors,[]);
          assert.equal(r.releaseAuthorized,false);assert.equal(r.familyAlpha,'HOLD');
          assert.equal(a.verifiedBrowserScreenshots,s.count);
          assert.equal(a.independentOriginalPhotoSHA,true);
          assert.equal(a.realSignedUsersVerified,false);
          assert.equal(a.realPhysicalPhonesVerified,false);
          assert.equal(a.releaseAuthorized,false);assert.equal(a.familyAlpha,'HOLD');
          assert.ok(r.evidence.every(x=>x.bones===163&&x.ownerACrossOwnerBRestoreBlocked&&
           x.authenticPhotoSourcedDress3D&&x.releaseAuthorized===false));
          const hashes=new Map(),stageKeys=new Set();
          for(const item of r.screens){
           assert.ok([320,390,430].includes(item.width));
           const key=item.width+'|'+item.stage;
           assert.ok(!stageKeys.has(key),'Duplicate screenshot stage '+key);
           stageKeys.add(key);
           const bytes=readFileSync(prefix+item.name);
           const dig=createHash('sha256').update(bytes).digest('hex');
           assert.equal(dig,item.sha256);
           assert.equal(bytes.readUInt32BE(16),item.width);
           if(hashes.has(dig)){
            // Exactly 3 intentional duplicate ORIGINAL photo-only frames:
            // foreign owner B sees the same safe missing-source fallback
            // under both labels 06 and 08 at each CSS viewport.
            assert.equal(mode,'readiness','Unexpected duplicate original screenshot SHA');
            const prior=hashes.get(dig);
            assert.equal(prior.width,item.width,'Cross-width screenshot reuse');
            assert.deepEqual([prior.stage,item.stage].sort(),
             ['06-B-private-missing-source-fallback',
              '08-B-private-missing-source-readiness']);
           }else hashes.set(dig,item);
          }
          assert.equal(stageKeys.size,s.count);
          assert.equal(hashes.size,mode==='readiness'?s.count-3:s.count);
          if(mode==='index'){
           assert.ok(r.evidence.every(x=>x.realOriginalJPEGImportedManuallyCorrectedAndIndexed&&
            x.previouslyStaleNewGarmentSavedToUnsavedOutfitWithoutReload&&
            x.savedOriginalPhotoIncludedInV4Restore));
          }
          if(mode==='restore'){
           assert.ok(r.evidence.every(x=>x.atomicLosslessV4RestoredBefore3D&&
            x.exactRestoredOriginalPhotos&&x.activeAnatomical3DRestoreBlocked));
          }
          if(mode==='readiness'){
           assert.ok(r.evidence.every(x=>x.sourceReadinessBlockedOnLogoutAndForeignOwner&&
            x.unsupportedShoesOuterwearRemainPhotoOnly));
           const p=JSON.parse(readFileSync('benchmark/user-photo-3d-01-audit/acceptance.json','utf8'));
           assert.equal(p.originalJPEGShaVerified,15);
           assert.equal(p.realChromiumScreenshots,9);
           assert.equal(p.readiness['3D Ready'],0);
           assert.equal(p.readiness['Needs Review'],12);
           assert.equal(p.readiness['Photo-Only'],3);
          }
          console.log('P176_REAL_ORIGINAL_OWNER_CROSS_STREAM_'+mode.toUpperCase()+
           '_163BONE_WEBGL_'+s.count+'_SHA_SCREENSHOTS_PASS_FAMILY_ALPHA_HOLD');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P176-current-owner-original-photo-${{ matrix.suite }}-native-163-bone-mobile-HOLD
          path: |
            benchmark/native-index-live-07/
            benchmark/native-index-live-07-audit/
            benchmark/native-restore-3d-06/
            benchmark/native-restore-3d-06-audit/
            benchmark/native-photo-readiness-08/
            benchmark/native-photo-readiness-08-audit/
            benchmark/user-photo-3d-01/
            benchmark/user-photo-3d-01-audit/
            benchmark/restore-atomic-01/
            benchmark/restore-atomic-01-audit/
            .native05-donor-541/benchmark/work47/manifest.json
          retention-days: 14
          if-no-files-found: warn
