name: MAIN1054 M40 P89 photo quality gate plus native M39 signed owner - NO DEPLOY
on:
  push:
    branches: [research/main1054-m40-p89-photo-3d-quality-gate-HOLD]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  actual-owner-original-2d-vs-p90:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: M39 immutable base, unchanged default consumer and P89 quality research-only scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a1ae0ef7e6a2173e8228a6758200932586fb42b4 HEAD
          test "$(git rev-parse HEAD:research/main1054-handoff37/safe-readonly-handoff.mjs)" = "$(git rev-parse d2eb53448e784e588ef9b9e6bff6693a3a2da977:research/main1054-handoff37/safe-readonly-handoff.mjs)"
          test "$(git rev-parse HEAD:tests/main37-source-handoff.test.mjs)" = "$(git rev-parse d2eb53448e784e588ef9b9e6bff6693a3a2da977:tests/main37-source-handoff.test.mjs)"
          git diff --exit-code a1ae0ef7e6a2173e8228a6758200932586fb42b4 HEAD -- supabase/ benchmark/
          git diff --exit-code a1ae0ef7e6a2173e8228a6758200932586fb42b4 HEAD -- public/
          git diff --name-only a1ae0ef7e6a2173e8228a6758200932586fb42b4 HEAD | while IFS= read -r path; do
            case "$path" in
              research/main1054-handoff40/p89-quality-admission.mjs|research/native-3d-05/native-preview-bridge.mjs|scripts/test-native-3d-05-browser.mjs|tests/main40-p89-quality-gate.test.mjs|research/master-consolidation-1054/MILESTONE40.md|.github/workflows/main1054-m40-quality-admission-no-deploy.yml) ;;
              *) echo "BLOCKED unexpected M40 changed path $path"; exit 1;;
            esac
          done
          node --check research/main1054-handoff37/safe-readonly-handoff.mjs
          node --check research/main1054-handoff40/p89-quality-admission.mjs
          node --check research/native-3d-05/native-preview-bridge.mjs
          node --check tests/main37-source-handoff.test.mjs
          node --check tests/main40-p89-quality-gate.test.mjs
          node --check scripts/test-native-3d-05-browser.mjs
      - name: Pin no-deploy test dependencies and browser engines
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
          npx playwright install --with-deps chromium webkit
      - name: Unchanged consumer build
        run: node scripts/build.mjs
      - name: Original PHOTO119+M39 owner + source-fidelity P89 M40 readiness regression
        run: node --test tests/main37-source-handoff.test.mjs tests/main38-owner-viewer.test.mjs tests/main39-native-provider.test.mjs tests/main40-p89-quality-gate.test.mjs
      - name: Complete no-deploy regression suite
        run: node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: M34 owner/source roster native Chromium WebKit acceptance
        run: MAIN34=research node scripts/test-main1054-native-picker33-browser.mjs
      - name: Build immutable PR541 true 163-bone donor into disposable worktree
        run: |
          git worktree add --detach .native05-donor-541 df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          ln -s ../node_modules .native05-donor-541/node_modules
          cd .native05-donor-541
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
      - name: Apply verified P90 camera installer only to immutable worktree
        run: node scripts/install-parallel90-viewer.mjs
      - name: Original P90 opt-in Chromium viewer intact, real 163-bone renderer
        run: P90=1 NATIVE88=1 NATIVE89=1 NATIVE91=1 NATIVE92=1 NATIVE93=1 NATIVE102=1 node scripts/test-native-3d-05-browser.mjs
      - name: Original P90 opt-in WebKit viewer intact, real 163-bone renderer
        run: P90=1 P90_ENGINE=webkit node scripts/test-native-3d-05-browser.mjs
      - name: Strict M38 actual Chromium native owner board remains 2D with zero donor imports
        run: M38=research node scripts/test-native-3d-05-browser.mjs
      - name: Strict M38 actual WebKit native owner board remains 2D with zero donor imports
        run: M38=research P90_ENGINE=webkit node scripts/test-native-3d-05-browser.mjs
      - name: M39 Chromium real native signed owner PHOTO119 private source 2D-only
        run: M38=research M39=research node scripts/test-native-3d-05-browser.mjs
      - name: M39 WebKit real native signed owner PHOTO119 private source 2D-only
        run: M38=research M39=research P90_ENGINE=webkit node scripts/test-native-3d-05-browser.mjs
      - name: M40 Chromium native signed owner with genuine P89 photo quality HOLD before WebGL
        run: M38=research M39=research M40=research node scripts/test-native-3d-05-browser.mjs
      - name: M40 WebKit native signed owner with genuine P89 photo quality HOLD before WebGL
        run: M38=research M39=research M40=research P90_ENGINE=webkit node scripts/test-native-3d-05-browser.mjs
      - name: Retain licensed-source and numeric-only test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main1054-m40-source-quality-2d-only-HOLD
          path: |
            benchmark/main40-chromium/
            benchmark/main40-webkit/
            benchmark/main39-chromium/
            benchmark/main39-webkit/
            benchmark/main38-chromium/
            benchmark/main38-webkit/
            benchmark/native-3d-05/
            benchmark/native-3d-05-webkit/
            benchmark/parallel90/
          if-no-files-found: ignore
          retention-days: 7
