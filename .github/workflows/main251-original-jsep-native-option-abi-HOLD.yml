name: MAIN251 original JSEP native WebAssembly option flag admission HOLD
on:
  push:
    branches: [research/main251-original-jsep-native-option-abi-HOLD]
permissions:
  contents: read
jobs:
  original-security-and-source:
    name: M251 immutable original Worker / entire inherited private and security
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source immutable and exactly four added non-product research-only paths
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=f85aa3eda38c5be2eb3762c296504f9f45e3c11a
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE" HEAD)" = "$(printf '%s\n' \
            '.github/workflows/main251-original-jsep-native-option-abi-HOLD.yml' \
            'scripts/main251-original-jsep-native-option-abi.mjs' \
            'scripts/test-main251-original-jsep-native-option-abi-browser.mjs' \
            'tests/main251-original-jsep-native-option-abi.test.mjs')"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-main250-original-jsep-mempattern-ab-browser.mjs)" = 49abd4dc6c0c2f12e46174cf275ccda90d5e0171
          test "$(git rev-parse HEAD:scripts/test-main249-original-failed-jsep-browser.mjs)" = c6f4d42e9e0b26c7adb727b1d1ff1c5999565def
          node --check scripts/main251-original-jsep-native-option-abi.mjs
          node --check scripts/test-main251-original-jsep-native-option-abi-browser.mjs
          node --test tests/main251-original-jsep-native-option-abi.test.mjs
          M251_SOURCE_ONLY=1 M251_ENGINE=webkit M251_WIDTH=320 M251_ARM=baseline node scripts/test-main251-original-jsep-native-option-abi-browser.mjs
          M251_SOURCE_ONLY=1 M251_ENGINE=webkit M251_WIDTH=320 M251_ARM=pattern_off node scripts/test-main251-original-jsep-native-option-abi-browser.mjs
      - name: Original test dependencies pinned
        run: npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Original offline app build and whole owner/photo/backup/security regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm view onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 dist.integrity)" = "sha512-0uS76OPgH0hWCPrFKlL8kYVV7ckM7t/36HfbgoFw6Nd0CZVVbQC4PkrR8mBX8LtNUFZO25IQBqV2Hx2ho3FlbQ=="
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  original-real-native-session:
    name: M251 native original JSEP ${{ matrix.engine }} ${{ matrix.width }} ${{ matrix.arm }}
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        include:
          - {engine: webkit, width: 320, arm: baseline}
          - {engine: webkit, width: 320, arm: pattern_off}
          - {engine: webkit, width: 390, arm: baseline}
          - {engine: webkit, width: 390, arm: pattern_off}
          - {engine: chromium, width: 390, arm: baseline}
          - {engine: chromium, width: 390, arm: pattern_off}
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M251_ENGINE: ${{ matrix.engine }}
      M251_WIDTH: ${{ matrix.width }}
      M251_ARM: ${{ matrix.arm }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original exact-source JSEP native ABI source and strict negative controls
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$M251_ENGINE" = "${{ matrix.engine }}"
          test "$M251_WIDTH" = "${{ matrix.width }}"
          test "$M251_ARM" = "${{ matrix.arm }}"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          node --test tests/main251-original-jsep-native-option-abi.test.mjs
          M251_SOURCE_ONLY=1 node scripts/test-main251-original-jsep-native-option-abi-browser.mjs
      - name: Exact original public SegFormer/JSEP and real native browser dependencies
        run: npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Actual original browser original JSEP model/native export and private owner 2D/v4
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node scripts/test-main251-original-jsep-native-option-abi-browser.mjs
