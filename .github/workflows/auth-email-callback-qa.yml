name: Email link confirmation and recovery callback QA
on:
  push:
    branches: [fix/auth-email-link-callback-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-email-link-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Auth callback syntax and focused tests
        run: |
          node --check public/auth.js
          node --test tests/auth.test.cjs tests/cloud-session-generation.test.cjs
      - name: Build and full app regression suite
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Protect original garment/camera history and release veto
        run: |
          node scripts/verify-camera-cloud-integration.mjs
          node scripts/check-dual-parent-review-integration.mjs
          node scripts/check-customer-pilot-release-gates.mjs
