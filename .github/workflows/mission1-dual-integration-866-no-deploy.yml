name: Mission 1 P866 combined dual-model + original photo — NO DEPLOY
on:
  push:
    branches: [research/mission1-dual-integration-866-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m1-p866-dual-combined-HOLD
  cancel-in-progress: true
jobs:
  pinned-combined-native-acceptance-NO-DEPLOY:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact P865 source, 20 immutable #82 donor blobs and 3 new paths only
        shell: bash
        run: |
          set -euo pipefail
          BASE=cab9b9f64daf95302e5901343ee0d996565513f0
          DONOR=d965ecfe9ad7ae70a1065e16b84ec3b7c9b40e7f
          git merge-base --is-ancestor "$BASE" HEAD
          if ! git cat-file -e "$DONOR^{commit}" 2>/dev/null; then git fetch --no-tags origin "$DONOR"; fi
          cat >/tmp/p866-donor-paths <<'P866_DONOR'
          .github/workflows/parallel82-dual-browser-no-deploy.yml
          public/app.js
          public/dual-core-82.mjs
          public/dual-model-lock-82.mjs
          public/dual-panel-82.mjs
          public/dual-worker-82.mjs
          public/model-arbitration-81.mjs
          research/parallel82/REPORT.md
          research/parallel82/frozen-text-82.json
          research/parallel82/summary.json
          scripts/p82-browser-server.mjs
          scripts/p82-prepare-models.mjs
          scripts/p82-real-browser.mjs
          scripts/p82-summarize.mjs
          scripts/parallel67-independent-siglip-scoring.mjs
          scripts/parallel67-precompute-fashion-text-03.mjs
          scripts/test-p82-real-review.mjs
          scripts/test-p82-review-browser.mjs
          tests/parallel82-default-scope.test.mjs
          tests/parallel82-evidence.test.mjs
          P866_DONOR
          git diff --name-only "$BASE" HEAD >/tmp/p866-changes
          cat /tmp/p866-changes
          test "$(wc -l </tmp/p866-changes)" -eq 23
          while IFS= read -r p; do
            if grep -Fxq "$p" /tmp/p866-donor-paths; then
              test "$(git hash-object "$p")" = "$(git rev-parse "$DONOR:$p")" || { echo "DONOR_BLOB_CHANGED $p"; exit 1; }
            else
              case "$p" in
                tests/mission1-parallel82-integration-866.test.mjs|research/mission1-dual-integration-866/REPORT.md|.github/workflows/mission1-dual-integration-866-no-deploy.yml) ;;
                *) echo "OUT_OF_SCOPE $p"; exit 1;;
              esac
            fi
          done </tmp/p866-changes
          while IFS= read -r p; do grep -Fxq "$p" /tmp/p866-changes || { echo "MISSING_DONOR $p"; exit 1; }; done </tmp/p866-donor-paths
          test -z "$(git diff --name-only "$BASE" HEAD -- public/local-worker.mjs public/recognition-engine.mjs public/recognition-vectors.json public/recognition-vectors.bin public/outfit-worker.mjs public/cloud-backup.js supabase)"
          grep -Fq 'const reviewFirst836=true;' public/app.js
          grep -Fq 'if(quality.blank){' public/app.js
          grep -Fq "new URLSearchParams(location.search).get('dual82')==='1'" public/app.js
          grep -Fq 'Family Alpha HOLD #255 OPEN' research/mission1-dual-integration-866/REPORT.md
          echo P866_VERIFIED_20_EXACT_DONOR_BLOBS
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium webkit
      - name: Full no-deploy native, both builds, inherited source guard and release gate
        shell: bash
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check scripts/test-m1-original-photo-browser-865.mjs
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          P79_REQUIRE_DECODER=1 node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
          node scripts/m1-release-evidence-851.mjs | tee /tmp/p866-gate
          grep -Fq '"status":"BLOCKED"' /tmp/p866-gate
          grep -Fq '"shouldLiftFamilyAlphaHold":false' /tmp/p866-gate
      - name: Actual original JPEG reload + opt-in review browser and footwear policies
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-m1-original-photo-browser-865.mjs
          node scripts/test-p82-review-browser.mjs
          node scripts/test-parallel80-subtype-browser.mjs
          node scripts/test-m1-owner-pair-admission-846.mjs
  authentic-public-model-replay-NO-DEPLOY:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 playwright@1.56.1 sharp@0.34.3
      - run: npx playwright install --with-deps chromium webkit
      - name: Download SHA-locked development originals and verify publicly pretrained model weights
        shell: bash
        run: |
          set -euo pipefail
          IDS=$(node -e "const fs=require('fs');console.log(['benchmark/manifest-reviewed-32.json','benchmark/manifest-holdout-16.json'].flatMap(p=>JSON.parse(fs.readFileSync(p)).map(x=>x.id)).join(','))")
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos "$IDS"
          node scripts/p82-prepare-models.mjs --check
      - name: Real dual-model Chromium inference on 48 public development originals
        shell: bash
        run: |
          set -euo pipefail
          node scripts/p82-real-browser.mjs chromium
          node scripts/p82-summarize.mjs benchmark/p82-chromium/results.json benchmark/p82-chromium
      - name: Isolated four-source WebKit diagnosis, NOT continuous WebKit/iPhone support
        run: P82_ISOLATED=1 P82_IDS=commons-0035,commons-0078,commons-0003,commons-0059 node scripts/p82-real-browser.mjs webkit benchmark/p82-webkit-hard4
      - name: Actual models into opt-in Adjust with real original and owner consent
        run: node scripts/test-p82-real-review.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: p866-development-numeric-only
          path: |
            benchmark/p82-chromium/*.json
            benchmark/p82-webkit-hard4/results.json
          if-no-files-found: error
