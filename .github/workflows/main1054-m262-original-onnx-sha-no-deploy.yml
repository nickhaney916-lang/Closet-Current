name: MAIN1054 M262 source-verified original ONNX identity NO DEPLOY HOLD
on:
  push:
    branches: [research/main1054-m262-original-onnx-byte-identity-HOLD]
  pull_request:
    branches: [research/main1054-m261-original-jsep-fault-gate-HOLD]
permissions:
  contents: read
jobs:
  source-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail-closed ancestry and exact original code barriers
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          PARENT=fe351bd1409c4b212c82d0598c7b00150549e3e2
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$PARENT" HEAD
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          test "$(git rev-parse HEAD:research/main1054/m261-controlled-native-jsep-fault.mjs)" = 1ad92e76b1c13e35f5b0ed4cb3ea4b07797b3236
          git diff --name-only "$PARENT" HEAD | while IFS= read -r path; do
            case "$path" in
              research/main1054/m262-original-onnx-byte-identity.mjs|tests/main1054-m262-original-onnx-byte-identity.test.mjs|.github/workflows/main1054-m262-original-onnx-sha-no-deploy.yml) ;;
              *) echo "M262 scope violation: $path"; exit 1 ;;
            esac
          done
          git diff --exit-code "$PARENT" HEAD -- public/ scripts/ supabase/ benchmark/ research/parallel106/
          node --check research/main1054/m262-original-onnx-byte-identity.mjs
          node --test tests/main1054-m262-original-onnx-byte-identity.test.mjs
      - name: Install pinned no-deploy dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: App build and inherited complete Node privacy and backup checks
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          test -s dist/index.html
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  original-browser:
    needs: source-node
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            mode: healthy
          - engine: webkit
            mode: healthy
          - engine: webkit
            mode: invalid-onnx
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: ${{ matrix.engine }}
      P94_WIDTH: 390
      M262_CASE: ${{ matrix.mode }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin original model code, prepare disposable browser, then preserve actual first-attempt verdict
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
          node research/main1054/m262-original-onnx-byte-identity.mjs prepare
          node --check scripts/.m262-original-onnx-network-study.mjs
          set +e
          set -o pipefail
          node scripts/.m262-original-onnx-network-study.mjs 2>&1 | tee m262-original.log
          model_exit=$?
          set -e
          if test "$M262_CASE" = invalid-onnx; then
            test "$model_exit" -ne 0
          else
            test "$model_exit" -eq 0
          fi
          MODEL_EXIT="$model_exit" node research/main1054/m262-original-onnx-byte-identity.mjs verify m262-original.log
