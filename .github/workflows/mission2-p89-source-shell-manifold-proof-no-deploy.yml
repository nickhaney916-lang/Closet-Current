name: "M2 P89 original photo shell manifold and component proof NO DEPLOY HOLD"
on:
  push:
    branches:
      - research/mission2-p89-source-shell-manifold-proof-20261118-HOLD
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  original-met-source-and-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact parent and research-only restricted changed paths
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor bec42338eb24d884c074351e69149aae03e85987 HEAD
          git diff --exit-code bec42338eb24d884c074351e69149aae03e85987 HEAD -- public/ supabase/ benchmark/fixtures/ benchmark/locked-photo-sources.json
          while IFS= read -r p; do
            case "$p" in
              research/parallel89/met-source-shell-manifold-proof89.mjs|scripts/test-parallel89-met-source-shell-manifold-proof.mjs|.github/workflows/mission2-p89-source-shell-manifold-proof-no-deploy.yml) ;;
              *) echo "Unauthorized modification: $p"; exit 1 ;;
            esac
          done < <(git diff --name-only bec42338eb24d884c074351e69149aae03e85987 HEAD)
      - name: Pinned disposable dependencies no lockfile edits
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Audit syntax and synthetic adversarial mesh witnesses
        run: |
          node --check research/parallel89/met-source-shell-manifold-proof89.mjs
          node --check scripts/test-parallel89-met-source-shell-manifold-proof.mjs
          node scripts/test-parallel89-met-source-shell-manifold-proof.mjs
      - name: Verify four true institutional ORIGINAL JPEG/RGB receipts
        run: node scripts/test-parallel89-met-four-original-photo-silhouettes.mjs
      - name: Pinned independent original source conservative mask producer
        run: |
          python -m venv .m2-met-mask-env
          .m2-met-mask-env/bin/python -m pip install --no-cache-dir --disable-pip-version-check numpy==1.26.4 opencv-python-headless==4.11.0.86 scipy==1.14.1
          .m2-met-mask-env/bin/python scripts/test-parallel89-met-four-real-full-masks.py
      - name: Genuine original source shell and connected manifold receipts
        env:
          P89_ACTUAL_SOURCE: '1'
        run: |
          node scripts/test-parallel89-met-source-neutral-shell.mjs
          node scripts/test-parallel89-met-source-shell-manifold-proof.mjs
      - name: Existing offline build and entire inherited security regressions
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Ensure original public/owner/private/source unchanged
        run: git diff --exit-code bec42338eb24d884c074351e69149aae03e85987 HEAD -- public/ supabase/ benchmark/fixtures/ benchmark/locked-photo-sources.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M2-P89-original-source-manifold-topology-not-wearable-HOLD
          path: |
            benchmark/parallel89-met70759-four-photo-research/
            benchmark/parallel89-met70759-full-alpha-proposals/
            benchmark/parallel89-met-original-front-neutral-shell-HOLD/
            benchmark/parallel89-met-source-shell-manifold-HOLD/
          if-no-files-found: warn
          retention-days: 7
  exact-original-native-browser-regressions:
    needs: original-met-source-and-topology
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      P89_BROWSER: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restrict research to immutable original source and private owner stability
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor bec42338eb24d884c074351e69149aae03e85987 HEAD
          git diff --exit-code bec42338eb24d884c074351e69149aae03e85987 HEAD -- public/ supabase/ benchmark/fixtures/ benchmark/locked-photo-sources.json
      - uses: actions/download-artifact@v4
        with:
          name: M2-P89-original-source-manifold-topology-not-wearable-HOLD
          path: benchmark/
      - name: Original engine plus exact JPEG pixel decoding
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 playwright@1.56.1
      - name: Native original-source neutral back shell draw and index-space audit
        env:
          P89_ACTUAL_SOURCE: '1'
        run: |
          node scripts/test-parallel89-met-source-neutral-shell.mjs
          node scripts/test-parallel89-met-source-shell-manifold-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M2-P89-${{ matrix.engine }}-genuine-neutral-shell-not-wearable-HOLD
          path: |
            benchmark/parallel89-met-original-front-neutral-shell-HOLD/
            benchmark/parallel89-met-source-shell-manifold-HOLD/
          retention-days: 7
          if-no-files-found: warn
