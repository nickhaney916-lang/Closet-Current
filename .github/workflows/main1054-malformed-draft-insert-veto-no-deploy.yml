name: MAIN1054 malformed draft insert veto NO DEPLOY
on:
  push:
    branches: [research/main1054-malformed-draft-insert-veto-HOLD]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  source-and-native-indexeddb:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify narrow scope and source-executed red before / green after
        shell: bash
        run: |
          set -euo pipefail
          BASE=f2befed4c776786dc11843b98fafec72f2d9c202
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse "$BASE:public/app.js")" = 835b4ad1f4a4a7f520aad5afd225134e5ea56e2d
          test "$(git rev-parse HEAD:public/app.js)" = a65494577009384979b29c2c1a05b5fedadbf988
          test "$(git diff --name-only "$BASE" HEAD | wc -l)" -eq 3
          git diff --name-only "$BASE" HEAD | grep -Fx public/app.js
          git diff --name-only "$BASE" HEAD | grep -Fx tests/main1054-malformed-draft-insert-veto.test.mjs
          git diff --name-only "$BASE" HEAD | grep -Fx .github/workflows/main1054-malformed-draft-insert-veto-no-deploy.yml
          mkdir -p /tmp/main1054-red/public /tmp/main1054-red/tests
          git show "$BASE:public/app.js" > /tmp/main1054-red/public/app.js
          git show "$BASE:public/taxonomy.js" > /tmp/main1054-red/public/taxonomy.js
          cp tests/main1054-malformed-draft-insert-veto.test.mjs /tmp/main1054-red/tests/
          if node --test /tmp/main1054-red/tests/main1054-malformed-draft-insert-veto.test.mjs > /tmp/draft-red.log 2>&1; then
            echo 'Original source unexpectedly passed'; cat /tmp/draft-red.log; exit 1
          fi
          cat /tmp/draft-red.log
          grep -Eq '^# fail 20$' /tmp/draft-red.log
          node --check public/app.js
          node --test tests/main1054-malformed-draft-insert-veto.test.mjs
      - name: Run actual Chromium and WebKit native IndexedDB synthetic owner regression
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
          NATIVE_DRAFT_BROWSER=1 node --test tests/main1054-malformed-draft-insert-veto.test.mjs
      - name: Offline application build
        run: node scripts/build.mjs
