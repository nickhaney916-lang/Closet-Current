name: MAIN229 v4 owner CAS and original-photo native acceptance HOLD
on:
  push:
    branches: [research/main229-v4-concurrent-owner-cas-HOLD]
  pull_request:
    branches: [research/main228-repeatable-source-owner-native-HOLD]
permissions:
  contents: read
jobs:
  original-owner-cas-node:
    name: M229 deterministic consent, transaction and original source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce M228 source ancestry, immutable production and test-only changes
        shell: bash
        run: |
          set -euo pipefail
          BASE=c492a65207605f49887fa72756cd55ef65b6eb69
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | while IFS= read -r path; do
            case "$path" in
              tests/main229-v4-concurrent-owner-cas.test.mjs|.github/workflows/main229-v4-owner-cas-no-deploy.yml) ;;
              *) echo "MAIN229 forbidden source alteration: $path"; exit 1 ;;
            esac
          done
          test "$(git rev-parse HEAD:public/native-lossless-v4-owner-acceptance-m3.mjs)" = 988918ee194b04c4764ac32ac3124cc633863165
          test "$(git rev-parse HEAD:public/native-default-atomic-import-m3.mjs)" = 1a4cf649a3656f604c4f3e1d2b1efd7910179edc
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          node --check tests/main229-v4-concurrent-owner-cas.test.mjs
      - name: Install pinned inherited application testing dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Five deterministic same-original async owner v4 integrity controls
        run: node --test tests/main229-v4-concurrent-owner-cas.test.mjs
      - name: Normal offline application build plus full inherited privacy suite
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  native-browser-unchanged-source:
    name: M229 actual original owner/2D/v4 Chromium-WebKit ($${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin native-original and signed-owner source without changes
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=c492a65207605f49887fa72756cd55ef65b6eb69
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | while IFS= read -r path; do
            case "$path" in
              tests/main229-v4-concurrent-owner-cas.test.mjs|.github/workflows/main229-v4-owner-cas-no-deploy.yml) ;;
              *) echo "M229 forbidden source change: $path"; exit 1 ;;
            esac
          done
          test "$(git rev-parse HEAD:public/native-lossless-v4-owner-acceptance-m3.mjs)" = 988918ee194b04c4764ac32ac3124cc633863165
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          test "$(git rev-parse HEAD:scripts/test-main226-native-v4-retired-source-browser.mjs)" = 057f1f51c77c4f1e43fa1761c8e361f7e53407c1
      - name: Install native browser pinned dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Actual 320/390/430 IndexedDB and WebCrypto v4 retired source fence
        shell: bash
        run: |
          set -euo pipefail
          for width in 320 390 430; do M226_WIDTH="$width" node scripts/test-main226-native-v4-retired-source-browser.mjs; done
      - name: Build native offline application
        run: node scripts/build.mjs
      - name: Actual unmodified positive SegFormer owner original to 2D v4 at 430
        run: P94_WIDTH=430 node scripts/test-parallel94-native-p88-browser.mjs
      - name: Normal original source photo owner 2D native v3 at 430
        run: P99_ENGINE=${{ matrix.engine }} P99_WIDTH=430 node scripts/test-parallel99-normal-app-browser.mjs
