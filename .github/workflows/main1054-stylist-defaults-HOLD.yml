name: MAIN1054 owner stylist defaults HOLD
on:
  pull_request:
    branches: [research/main1054-reviewed-closet-retrieval-HOLD]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/main1054-owner-stylist-defaults-HOLD'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        check: [regression, chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: node scripts/build.mjs
      - if: matrix.check == 'regression'
        run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
      - if: matrix.check != 'regression'
        env:
          P99_ENGINE: ${{ matrix.check }}
        run: |
          set -euo pipefail
          npx playwright install --with-deps "$P99_ENGINE"
          git worktree add --detach "$RUNNER_TEMP/p1653-baseline" 805587cc5f4ff8dabdbb6abbae3a9fa6c260d13f
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/p1653-baseline/node_modules"
          cp scripts/p1653-native-stylist-defaults.cjs "$RUNNER_TEMP/p1653-baseline/scripts/"
          (cd "$RUNNER_TEMP/p1653-baseline" && node scripts/build.mjs)
          for width in 320 390 430; do
            export P99_WIDTH="$width"
            (cd "$RUNNER_TEMP/p1653-baseline" && P1653_EXPECT_RED=1 node scripts/p1653-native-stylist-defaults.cjs)
            node scripts/p1653-native-stylist-defaults.cjs
          done
          P99_WIDTH=390 P1607_AUDIT=1 node scripts/test-parallel99-normal-app-browser.mjs
