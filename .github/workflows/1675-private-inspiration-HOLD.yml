name: MAIN1054 private inspiration recreation HOLD
on:
  pull_request:
    branches: [research/main1054-connectivity-recovery-HOLD]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/main1054-p1675-inspiration-HOLD'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        check: [regression, chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: node scripts/build.mjs
      - run: node --test tests/p1675-inspiration.cjs
      - if: matrix.check == 'regression'
        run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
      - if: matrix.check == 'chromium' || matrix.check == 'webkit'
        env:
          P99_ENGINE: ${{ matrix.check }}
        run: |
          set -euo pipefail
          npx playwright install --with-deps "$P99_ENGINE"
          git worktree add --detach "$RUNNER_TEMP/p1675-baseline" 9d39062d90a593f8cc5e236bdd783a3051df8896
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/p1675-baseline/node_modules"
          cp scripts/p1675-native-inspiration.cjs "$RUNNER_TEMP/p1675-baseline/scripts/"
          (cd "$RUNNER_TEMP/p1675-baseline" && node scripts/build.mjs)
          for width in 320 390 430; do
            export P99_WIDTH="$width"
            (cd "$RUNNER_TEMP/p1675-baseline" && P1675_BASELINE=1 node scripts/p1675-native-inspiration.cjs)
            node scripts/p1675-native-inspiration.cjs
          done
