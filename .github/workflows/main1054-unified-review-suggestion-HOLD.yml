name: MAIN1054 unified pending identity suggestion HOLD
on:
  pull_request:
    branches: [research/main1054-unified-subtype-owner-review-HOLD]
    paths:
      - public/app.js
      - tests/main1054-pending-identity-suggestion.test.cjs
      - .github/workflows/main1054-unified-review-suggestion-HOLD.yml
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/main1054-unified-review-suggestion-HOLD'
    strategy:
      fail-fast: false
      matrix:
        check: [regression, storage, chromium, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact parent and confined pending proposal handoff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor f0236e34ce73207183444c58f5475a4e0606a2ed HEAD
          git diff --exit-code f0236e34ce73207183444c58f5475a4e0606a2ed HEAD -- . ':(exclude)public/app.js' ':(exclude)tests/main1054-pending-identity-suggestion.test.cjs' ':(exclude).github/workflows/main1054-unified-review-suggestion-HOLD.yml'
          test "$(git rev-parse HEAD:public/app.js)" = "8b2202dcaf199a23cd554c012722a797893761cc"
          test "$(git rev-parse HEAD:tests/main1054-pending-identity-suggestion.test.cjs)" = "eea9fe7d2e7a6d57cd18c3771645e3a61239269c"
          git show f0236e34ce73207183444c58f5475a4e0606a2ed:public/app.js > "$RUNNER_TEMP/suggestion-parent-app.js"
          git show 234176ed23dc56d7338f8de0646d591fda9e83a2:public/app.js > "$RUNNER_TEMP/subtype-parent-app.js"
          git show 53ef0f5339c6e520705dd7868f94229c05eff4ac:public/app.js > "$RUNNER_TEMP/envelope-parent-app.js"
          git show 1c022c26dfe680135ad2e4b805ccad70a85e946c:public/app.js > "$RUNNER_TEMP/recognition-parent-app.js"
          git log -1 --format='commit %H tree %T'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: node scripts/build.mjs
      - if: matrix.check == 'regression'
        name: Source-executed original RED and corrected owner decision tests
        run: |
          RECOGNITION_EXPECT_RED=1 RECOGNITION_SOURCE="$RUNNER_TEMP/recognition-parent-app.js" node --test tests/main1054-owner-decision-recognition.test.mjs
          node --test tests/main1054-owner-decision-recognition.test.mjs
          node --test tests/mission3-auto-index-source-cas.test.cjs
          ENVELOPE_EXPECT_RED=1 ENVELOPE_SOURCE="$RUNNER_TEMP/envelope-parent-app.js" node --test tests/main1054-recognition-envelope-admission.test.cjs
          SUBTYPE_EXPECT_RED=1 ENVELOPE_SOURCE="$RUNNER_TEMP/subtype-parent-app.js" node --test tests/main1054-recognition-envelope-admission.test.cjs
          node --test tests/main1054-recognition-envelope-admission.test.cjs
          if SUGGESTION_SOURCE="$RUNNER_TEMP/suggestion-parent-app.js" node --test --test-name-pattern='recognition retains a verified proposal' tests/main1054-pending-identity-suggestion.test.cjs > "$RUNNER_TEMP/suggestion-red.log" 2>&1; then
            cat "$RUNNER_TEMP/suggestion-red.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/suggestion-red.log"
          grep -F 'not ok 1 - recognition retains a verified proposal' "$RUNNER_TEMP/suggestion-red.log"
          node --test tests/main1054-pending-identity-suggestion.test.cjs
      - if: matrix.check == 'regression'
        run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
      - if: matrix.check == 'storage'
        run: npx playwright install --with-deps chromium webkit
      - if: matrix.check == 'storage'
        name: Inherited native reviewed save and wardrobe recovery checks
        run: |
          set -euo pipefail
          node scripts/test-main1054-reviewed-payload-native.mjs
          CONFLICT_OUT="$RUNNER_TEMP/review-concurrency" node scripts/test-outfit-draft-conflicts-browser.mjs
          node scripts/test-p1600-wardrobe-recovery-browser.mjs
          node scripts/test-mission3-lossless-v4-owner-acceptance-browser.mjs "$RUNNER_TEMP/review-backup"
      - if: matrix.check == 'chromium' || matrix.check == 'webkit'
        run: npx playwright install --with-deps "${{ matrix.check }}"
      - if: matrix.check == 'chromium' || matrix.check == 'webkit'
        name: Actual normal application photo containment and inference journey
        env:
          P99_ENGINE: ${{ matrix.check }}
          M58_ENGINE: ${{ matrix.check }}
        run: |
          set -euo pipefail
          P1607_AUDIT=1 P99_WIDTH=390 node scripts/test-parallel99-normal-app-browser.mjs
          node scripts/test-parallel94-native-p88-browser.mjs
          node scripts/check-1452-journey-receipts.mjs "$P99_ENGINE"
  acceptance:
    if: always()
    needs: [verify]
    runs-on: ubuntu-24.04
    env:
      RESULT: ${{ needs.verify.result }}
    steps:
      - run: test "$RESULT" = success
