# Staging-only bundle. GitHub Actions produces an artifact, never a deployment.
# Publishable key is deliberately a browser-safe Supabase key; never add service-role keys.
name: Restricted protected pilot preview bundle
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  build-offline-staging:
    if: ${{ github.head_ref == 'staging/protected-preview-bundle-20261022b' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOSET_STAGING_SUPABASE_URL: https://fbnplztkbsteuzrmbgib.supabase.co
      CLOSET_STAGING_APP_ORIGIN: https://pilot-access-check.closet-current-staging.pages.dev/
      CLOSET_STAGING_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Tc9eXwg8XTY6rJ0uZBD2VQ_NTGeIUNG
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify Node runtime
        run: |
          node --version
          node --input-type=module -e "import assert from 'node:assert/strict';assert.ok(Number(process.versions.node.split('.')[0])>=20)"
      - name: Build fail-closed connected staging bundle
        run: node scripts/build-connected-staging-candidate.mjs
      - name: Revalidate final asset integrity
        run: node scripts/verify-restricted-staging-bundle.mjs
      - name: Upload restricted preview bundle for manual Cloudflare upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: closet-current-staging-preview-static
          path: staging-dist/
          retention-days: 3
          if-no-files-found: error
