name: Mission1 P774 integrated full recognition, real 73-source exclusion and human annotation verification NO DEPLOY
on:
  push:
    branches:
      - research/mission1-unified-recognition-evidence-774-HOLD
    paths:
      - research/mission1-*/**
      - scripts/mission1-73-source-review-774.mjs
      - scripts/prospective-holdout-768.mjs
      - scripts/scan-visual-source-overlap-769.mjs
      - scripts/select-publisher-mask-holdout-772.py
      - scripts/sign-manual-human-review-774.mjs
      - scripts/test-mission1-offline-reviewer-774-browser.mjs
      - scripts/test-mission1-unseeded-region-773-browser.mjs
      - scripts/score-mission1-two-model-consensus-779.mjs
      - tests/mission1-*.test.mjs
      - tests/test_publisher_mask_selection_772.py
      - .github/workflows/mission1-unified-774-no-deploy.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m1-774-integrated-HOLD-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrated-native-research-and-auth-holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact pinned 1514-test P767 parent and only 28 scoped, no-deploy research paths
        run: |
          set -euo pipefail
          BASE=0d9534130cc1e72e9e9e0dd7827267babdc5a911
          # Hosted checkout is shallow; fetch the actual stacked head ancestry
          # rather than incorrectly treating missing ancestors as a defect.
          git fetch --deepen=80 origin "$GITHUB_SHA"
          git fetch origin "$BASE"
          git merge-base --is-ancestor "$BASE" "$GITHUB_SHA"
          test "$(git rev-parse "$BASE")" = "$BASE"
          git diff --name-only "$BASE" "$GITHUB_SHA" > /tmp/mission1-774-changed-paths
          cat /tmp/mission1-774-changed-paths
          test "$(wc -l < /tmp/mission1-774-changed-paths)" -eq 34
          while read -r file; do
            case "$file" in
              research/mission1-*/*|scripts/mission1-73-source-review-774.mjs|scripts/prospective-holdout-768.mjs|scripts/scan-visual-source-overlap-769.mjs|scripts/select-publisher-mask-holdout-772.py|scripts/sign-manual-human-review-774.mjs|scripts/test-mission1-offline-reviewer-774-browser.mjs|scripts/test-mission1-unseeded-region-773-browser.mjs|scripts/score-mission1-two-model-consensus-779.mjs|tests/mission1-*.test.mjs|tests/test_publisher_mask_selection_772.py|.github/workflows/mission1-unified-774-no-deploy.yml) ;;
              *) echo "P774 REJECTS UNAPPROVED APP/RELEASE/PRIVATE PATH: $file"; exit 1 ;;
            esac
          done < /tmp/mission1-774-changed-paths
          test -z "$(git diff --name-only "$BASE" "$GITHUB_SHA" -- public supabase)"
          echo MISSION1_P774_EXACT_ADVANCED_PARENT_34_RESEARCH_ONLY_FILES_HOLD
      - name: Install full original advanced 3D/camera/review/recognition test dependencies ephemeral only
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Exact source reviewer CLI/mixed garment/73 visual registry syntax checks
        run: |
          set -euo pipefail
          node --check research/mission1-reviewer-774/offline-human-polygon-receipt.mjs
          node --check research/mission1-sealed-human-holdout-768/prospective-gate.mjs
          node --check research/mission1-visual-source-overlap-769/original-perceptual-ledger.mjs
          node --check scripts/mission1-73-source-review-774.mjs
          node --check scripts/sign-manual-human-review-774.mjs
          node --check scripts/prospective-holdout-768.mjs
          node --check scripts/test-mission1-offline-reviewer-774-browser.mjs
      - name: Nine actual reviewer-signature and five strict 73-historic-source admission tests
        run: node --test tests/mission1-offline-human-polygon-774.test.mjs tests/mission1-source-exposure-73-774.test.mjs
      - name: Immutable source photo annotation selector tests
        run: |
          python -m py_compile scripts/select-publisher-mask-holdout-772.py
          python -m unittest discover -s tests -p 'test_publisher_mask_selection_772.py' -v
      - name: Full advanced closet/camera/cloud/recognition/3D and integrated human-photo Node suite
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: No synthetic human fixture can assert entire Mission 1 readiness
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {P59_EXPOSED_DIGESTS_774,P772_EXPOSED_DIGESTS_774} from './research/mission1-exposure-774/pinned-exposed-source-history.mjs';
          import {P66_EXPOSED_DIGESTS} from './research/mission1-sealed-human-holdout-768/prospective-gate.mjs';
          const all=[...P59_EXPOSED_DIGESTS_774,...P66_EXPOSED_DIGESTS,...P772_EXPOSED_DIGESTS_774];
          assert.equal(all.length,73);assert.equal(new Set(all).size,73);
          console.log('M1_774_73_RESEARCH_EXPOSED_SOURCE_DIGESTS_EXCLUDED');
          console.log('M1_774_ZERO_INDEPENDENT_ACTUAL_HUMAN_REVIEWER_RECEIPTS_IN_CI_NO_RELEASE');
          console.log('FAMILY_ALPHA_HOLD_255_NATIVE_RELEASE_NOT_AUTHORIZED');
          NODE
  mobile-reviewer-offline-chromium-webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact synthetic reviewer browser QA dependencies
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3
          test -d /ms-playwright
      - name: Two real browser engines, 320/390 mobile viewport drawing two manual polygons and blocking tampered original JPEG
        run: node scripts/test-mission1-offline-reviewer-774-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission1-774-OFFLINE-HUMAN-REVIEW-UI-SYNTHETIC-ONLY-NO-REAL-HUMAN-PROOF
          path: benchmark/m1-human-reviewer-ui-774/
          retention-days: 14
          if-no-files-found: warn
  all-73-actual-exposed-source-photo-quarantine:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ephemeral genuine original photo decoder dependency, no model changes
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3
      - name: Download and SHA-verify EXACT original historical 59 licensed public source JPEGs
        run: |
          set -euo pipefail
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json
          test "$(find benchmark/photos -maxdepth 1 -name '*.jpg' | wc -l)" -eq 59
      - name: Preserve and byte-SHA verify prior six real Fashionpedia/Pexels sources before ever selecting eight new
        run: |
          set -euo pipefail
          cp research/real-garment-acceptance-66/fashionpedia-sample.json research/real-garment-acceptance-66/pinned-published-exposed.json
          python scripts/fetch-fashionpedia-66.py
          test "$(find benchmark/real-garment-acceptance-66/fashionpedia -maxdepth 1 -name '*.jpg' | wc -l)" -eq 6
          # The next P772 selector fetches the six pinned references separately
          # and writes eight NEW originals into this same temporary folder.
          # Remove old copies so 6+8 file accumulation is not mistaken as
          # a selected or failed cohort; immutable six-source receipt remains.
          rm -rf benchmark/real-garment-acceptance-66/fashionpedia
      - name: Reproduce original P772 deterministic publisher source metadata and all eight actual SHA pinned original JPEGs
        run: |
          set -euo pipefail
          mkdir -p benchmark/m1-p774
          python scripts/select-publisher-mask-holdout-772.py research/real-garment-acceptance-66/fashionpedia-sample.json benchmark/real-garment-acceptance-66/fashionpedia
          test "$(find benchmark/real-garment-acceptance-66/fashionpedia -maxdepth 1 -name '*.jpg' | wc -l)" -eq 8
          test "$(find benchmark/real-garment-acceptance-66/previous-six -maxdepth 1 -name '*.jpg' | wc -l)" -eq 6
      - name: SHA-verify and compute 7 real crop windows of each exact 59+6+8 original public source
        run: |
          set -euo pipefail
          node scripts/mission1-73-source-review-774.mjs build benchmark/photos benchmark/real-garment-acceptance-66/previous-six benchmark/real-garment-acceptance-66/fashionpedia benchmark/m1-p774/73-original-sources-actual-byte-verified-ledger.json
      - name: Actual new JPEG re-encoding of already-exposed P772 image cannot be admitted after strict 73-source scan
        run: |
          set -euo pipefail
          mkdir -p benchmark/m1-p774/inputs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import sharp from 'sharp';
          import {createHash} from 'node:crypto';
          import {MISSION1_P772_PUBLISHED_DEVELOPMENT_SOURCES_774} from './research/mission1-exposure-774/pinned-exposed-source-history.mjs';
          const row=MISSION1_P772_PUBLISHED_DEVELOPMENT_SOURCES_774[0];
          const src=readFileSync('benchmark/real-garment-acceptance-66/fashionpedia/'+row.image);
          const digest=b=>createHash('sha256').update(b).digest('hex');
          assert.equal(digest(src),row.sha256);
          const altered=await sharp(src).jpeg({quality:65}).toBuffer();
          assert.notEqual(digest(altered),row.sha256);
          writeFileSync('benchmark/m1-p774/inputs/altered.jpg',altered);
          writeFileSync('benchmark/m1-p774/candidates.json',JSON.stringify([{image:'altered.jpg',sha256:digest(altered)}],null,2));
          NODE
          node scripts/mission1-73-source-review-774.mjs screen benchmark/m1-p774/73-original-sources-actual-byte-verified-ledger.json benchmark/m1-p774/candidates.json benchmark/m1-p774/inputs benchmark/m1-p774/altered-p772-source-refused.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const l=JSON.parse(readFileSync('benchmark/m1-p774/73-original-sources-actual-byte-verified-ledger.json'));
          const r=JSON.parse(readFileSync('benchmark/m1-p774/altered-p772-source-refused.json'));
          assert.equal(l.realSourcePhotos,73);
          assert.equal(l.fingerprints.length,73);
          assert.equal(l.newerPublisherDevelopmentSources,8);
          assert.equal(new Set(l.fingerprints.map(x=>x.sourceSHA256)).size,73);
          assert.ok(l.fingerprints.every(x=>x.views.length===7));
          assert.equal(r.verifiedExposedSources,73);
          assert.equal(r.candidatesApprovedAsUnseen,0);
          assert.equal(r.candidateOriginals,1);
          assert.equal(r.nearDuplicateFlagCount,1);
          assert.equal(r.outcomes[0].status,'QUARANTINE_SOURCE_OVERLAP');
          assert.equal(r.familyAlpha,'HOLD');
          console.log('MISSION1_73_REAL_ORIGINAL_JPEGS_SHA_VERIFIED_7_VISUAL_WINDOWS_EACH');
          console.log('MISSION1_REAL_P772_RECOMPRESSED_SOURCE_EXCLUDED_FROM_NEW_HUMAN_HOLDOUT');
          console.log('MISSION1_ZERO_NEW_RIGHTS_HUMAN_IDENTITY_RELEASE_APPROVAL');
          NODE
      - name: Erase every original publisher/owner pixel and temporary candidate bytes before public source-only artifacts
        if: always()
        run: |
          rm -rf benchmark/photos
          rm -rf benchmark/real-garment-acceptance-66/fashionpedia
          rm -rf benchmark/real-garment-acceptance-66/previous-six
          rm -rf benchmark/m1-p774/inputs
          rm -f benchmark/m1-p774/candidates.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission1-774-73-GENUINE-original-sources-SHA-visual-quarantine-NO-PRIVATE-JPEGS
          path: |
            benchmark/m1-p774/73-original-sources-actual-byte-verified-ledger.json
            benchmark/m1-p774/altered-p772-source-refused.json
          retention-days: 14
          if-no-files-found: warn

