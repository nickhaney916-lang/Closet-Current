          python scripts/select-publisher-mask-holdout-772.py research/real-garment-acceptance-66/fashionpedia-sample.json benchmark/real-garment-acceptance-66/fashionpedia
      - name: Real model evidence in Chromium; no fake masks or owner review
        run: MISSION1_ENGINE=chromium node scripts/test-mission1-unseeded-region-773-browser.mjs
      - name: Repeat all real model tests against original publisher polygons in WebKit
        run: MISSION1_ENGINE=webkit node scripts/test-mission1-unseeded-region-773-browser.mjs
      - name: Require 8 source photos, 20 original human annotations, unaltered model and no release
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          for(const engine of ['chromium','webkit']){
            const r=JSON.parse(readFileSync('benchmark/mission1-unseeded-region-773/'+engine+'/results.json','utf8'));
            assert.equal(r.photos,8);
            assert.equal(r.publisherHumanInstances,20);
            assert.equal(r.summary.componentReviewNoAutomaticAcceptance,true);
            assert.equal(r.releaseAuthorized,false);
            assert.equal(r.familyAlpha,'HOLD');
            assert.ok(Number.isInteger(r.summary.componentNewReviewProposals));
            assert.ok(r.rows.every(row=>row.componentReceipts.every(x=>x.accepted===false&&x.autoIndex===false)));
            console.log(JSON.stringify({engine,publisherInstances:20,
              baseline:r.summary.candidateInstanceDiagnostic,
              disconnectedReview:r.summary.componentReviewArm,
              additionalUnapprovedProposals:r.summary.componentNewReviewProposals,
              verdict:r.summary.componentResearchVerdict,
              independentHumanAcceptance:false,releaseAuthorized:false}));
          }
          NODE
      - name: Delete all source originals from CI workspace before uploading receipts
        if: always()
        run: |
          rm -rf benchmark/real-garment-acceptance-66/fashionpedia
          rm -rf benchmark/real-garment-acceptance-66/previous-six
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission1-P776-exposed-real-source-component-Chromium-WebKit-RESEARCH-HOLD
          path: benchmark/mission1-unseeded-region-773/
          retention-days: 14
          if-no-files-found: warn

