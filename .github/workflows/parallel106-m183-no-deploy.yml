name: Parallel106 M183 candidate source and browser checks NO DEPLOY HOLD
on:
  push:
    branches: [research/parallel106-m4-gate-migration-HOLD]
permissions:
  contents: read
jobs:
  inherited-node-and-lease:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the frozen candidate and additive migration
        run: node scripts/parallel106-source-gate.mjs
      - name: Independent session lease and negative Worker Node cases
        run: node --test tests/outfit-capture.test.cjs
      - name: Install pinned isolated original PWA/test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Offline packaged native PWA and all inherited source tests
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  native-recovery:
    needs: inherited-node-and-lease
    name: actual unflagged PWA original owner recovery (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M181_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the frozen candidate and additive migration
        run: node scripts/parallel106-source-gate.mjs
      - name: Install pinned browser and application runtime
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Build actual signed local user normal PWA without deploy
        run: node scripts/build.mjs
      - name: Genuine Chromium/WebKit built PWA negative recovery at 320 390 430
        shell: bash
        run: |
          set -euo pipefail
          for width in 320 390 430; do
            M181_WIDTH="$width" node scripts/test-main181-zero-proposal-native-browser.mjs
          done
  original-browser:
    needs: inherited-node-and-lease
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        width: [320, 390, 430]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: ${{ matrix.engine }}
      P94_WIDTH: ${{ matrix.width }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify identical product Worker/native original runner and install no-deploy dependencies
        shell: bash
        run: |
          set -euo pipefail
          node scripts/parallel106-source-gate.mjs
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Genuine first-attempt original SegFormer/photo/owner-private 2D-v4 journey
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-parallel94-native-p88-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parallel106-original-${{ matrix.engine }}-${{ matrix.width }}-HOLD
          path: benchmark/parallel94-native-p88-browser/${{ matrix.engine }}/${{ matrix.width }}/*.json
          retention-days: 14
          if-no-files-found: warn
