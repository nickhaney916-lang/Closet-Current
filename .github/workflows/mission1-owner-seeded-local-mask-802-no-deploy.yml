name: M1 P802 original owner box+seed LOCAL color mask — NO DEPLOY
on:
  push:
    branches: [research/mission1-owner-seeded-local-mask-802-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m1-p802-original-owner-seeded-color-region-HOLD-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-parent-complete-node-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact verified P801 document parent; only 7 allowlisted research, UI and test files; NO DEPLOY
        run: |
          set -euo pipefail
          BASE=dda67515067bfa25dd8b5f884077b2b6d988a31b
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD >/tmp/m1-p802-allowlist
          test "$(wc -l </tmp/m1-p802-allowlist)" -eq 7
          while read -r path; do
            case "$path" in
              public/mission1-local-mask-preview-802.mjs|public/owner-original-photo-point-798.mjs|public/app.js|tests/mission1-owner-seeded-local-mask-802.test.mjs|scripts/test-mission1-real-segformer-to-closet-782-browser.mjs|research/mission1-owner-seeded-local-mask-802/REPORT.md|.github/workflows/mission1-owner-seeded-local-mask-802-no-deploy.yml) ;;
              *) echo "UNAPPROVED MODEL/AUTH/CLOUD/RELEASE CHANGE: $path"; exit 1 ;;
            esac
          done </tmp/m1-p802-allowlist
          test -z "$(git diff --name-only "$BASE" HEAD -- supabase public/local-worker.mjs public/auth.js public/cloud-backup.js public/native-reviewed-private-save-167.mjs public/local-catalog.mjs public/photo-color.js benchmark)"
          grep -Fq 'FAMILY ALPHA HOLD #255' research/mission1-owner-seeded-local-mask-802/REPORT.md
          echo M1_P802_VERIFIED_P801_PARENT_ALLOWLIST_SOURCE_PRIVATE_NO_DEPLOY
      - name: Install ephemeral complete repo test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: P802 original owner SHA source + local mask source test and all Node/cloud/3D regressions
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check public/owner-original-photo-point-798.mjs
          node --check public/mission1-local-mask-preview-802.mjs
          node --check scripts/test-mission1-real-segformer-to-closet-782-browser.mjs
          node --test tests/mission1-owner-seeded-local-mask-802.test.mjs
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  real-original-local-color-two-browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      MULTI16_RELAY_MODEL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install actual Chromium WebKit SegFormer source-native flow deps
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3
      - name: Actual original-JPEG SegFormer native Adjust + owner box + seed + local color-preview + manual private fixture save
        run: node scripts/test-mission1-real-segformer-to-closet-782-browser.mjs
      - name: Assert original SHA source unchanged, ephemeral mask NOT SAM2, and owner-controlled save
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const result=JSON.parse(readFileSync('benchmark/mission1-real-model-native-closet-782/browser-results.json'));
          assert.equal(result.researchOnly,true);
          assert.equal(result.releaseAuthorized,false);
          assert.equal(result.familyAlpha,'HOLD');
          assert.equal(result.realAuthenticatedCloudUsers,false);
          assert.deepEqual(new Set(result.scenarios.map(x=>x.browser)),new Set(['chromium','webkit']));
          for(const row of result.scenarios){
           for(const key of ['actualOriginalSourceOwnerPoint798ReviewedInNativeAdjust',
            'actualOriginalSourceOwnerBox800BrowserDrawn',
            'actualOriginalSourceOwnerBox800KeyboardEntered',
            'actualOriginalSourceOwnerBox800NotPersisted',
            'actualOriginalSourceOwnerMask802ActualLocalColorPixels',
            'actualOriginalSourceOwnerMask802ExplicitlyUnverifiedAndNotPersisted',
            'actualOriginalSourceOwnerPoint798NotPersisted',
            'actualMyClosetSaved','simulatedManualUnknownSubtypeRefusedBeforeSave'])
            assert.equal(row[key],true,key);
           assert.equal(row.actualHumanGroundTruthIndependentlyVerified,false);
           assert.equal(row.physicalPhoneTested,false);
           assert.equal(row.actualSignedCloudRLS,false);
           assert.equal(row.familyAlpha,'HOLD');
          }
          console.log('M1_P802_ACTUAL_ORIGINAL_SOURCE_OWNER_LOCAL_COLOR_PREVIEW_CHROMIUM_WEBKIT_NOT_SAM2_NOT_SAVED_HOLD');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission1-P802-original-JPEG-owner-seeded-LOCAL-color-mask-NOT-SAM2-HOLD
          path: benchmark/mission1-real-model-native-closet-782/
          retention-days: 14
          if-no-files-found: warn
