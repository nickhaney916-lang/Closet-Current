name: Mission 1 P812 blind prospective original coordinator Ed25519 witness — NO DEPLOY
on:
  push:
    branches: [research/mission1-offline-witness-verification-812-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mission1-P812-witness-HOLD
  cancel-in-progress: true
jobs:
  exact-parent-full-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-bound P811 exact parent, only four research and test paths
        run: |
          set -euo pipefail
          BASE=3825cdb8263a9327dcb12a60ee2c19136743caa9
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD >/tmp/m1-p812-changed
          test "$(wc -l </tmp/m1-p812-changed)" -eq 4
          while read -r p; do
            case "$p" in
              research/mission1-reviewer-774/offline-photo-polygon-review.html|scripts/test-mission1-offline-reviewer-774-browser.mjs|research/mission1-offline-witness-verification-812/REPORT.md|.github/workflows/mission1-offline-witness-812-no-deploy.yml) ;;
              *) echo "UNAUTHORIZED PHOTO OWNER MODEL AUTH RELEASE CHANGE: $p"; exit 1 ;;
            esac
          done </tmp/m1-p812-changed
          test -z "$(git diff --name-only "$BASE" HEAD -- public supabase benchmark)"
          grep -Fq 'FAMILY ALPHA HOLD #255' research/mission1-offline-witness-verification-812/REPORT.md
          echo M1_P812_NO_DEPLOY_EXACT_P811_AND_FOUR_PATHS_ONLY
      - name: Ephemeral full suite dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Full source QA native build and all application regression
        run: |
          set -euo pipefail
          node --check scripts/test-mission1-offline-reviewer-774-browser.mjs
          node --test tests/mission1-offline-human-polygon-774.test.mjs
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  real-browser-cryptographic-coordinator-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chromium and WebKit real WebCrypto Ed25519 witness; synthetic keys only
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3
          node scripts/test-mission1-offline-reviewer-774-browser.mjs
      - name: Cryptographically verify sixteen original/synthetic browser screenshots
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const root='benchmark/m1-human-reviewer-ui-774/';
          const p=JSON.parse(readFileSync(root+'synthetic-only-screenshot-receipts.json','utf8'));
          assert.deepEqual(new Set(p.testedBrowserEngines),new Set(['chromium','webkit']));
          assert.deepEqual(p.widths,[320,390]);
          assert.equal(p.screenshotReceipts.length,16);
          assert.equal(p.actualIndependentHumanReviewers,0);
          assert.equal(p.realPhotoOwnerPermissionVerified,false);
          assert.equal(p.releaseAuthorized,false);
          assert.equal(p.familyAlpha,'HOLD');
          assert.equal(new Set(p.screenshotReceipts.map(x=>x.sha256)).size,16);
          const paths={
            'outer-hole':'synthetic-human-annotation-ui',
            'stale-source-rejected':'source-race-stale-rejected',
            'tampered-seal-rejected':'tampered-seal-refused',
            'invalid-witness-rejected':'invalid-witness-refused'
          };
          const seen=new Set();
          for(const x of p.screenshotReceipts){
            assert.equal(x.syntheticOnly,true);
            const kind=x.kind||'outer-hole';
            assert.ok(Object.hasOwn(paths,kind));
            const key=x.engine+':'+x.width+':'+kind;
            assert.equal(seen.has(key),false,key);seen.add(key);
            const raw=readFileSync(root+x.engine+'-'+x.width+'-'+paths[kind]+'.png');
            assert.equal(createHash('sha256').update(raw).digest('hex'),x.sha256);
          }
          console.log('M1_P812_SIXTEEN_GENUINE_BROWSER_SCREENSHOTS_ED25519_WITNESS_HOLD_NO_HUMAN');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission1-P812-coordinator-Ed25519-witness-16-synthetic-browser-sha-HOLD
          path: benchmark/m1-human-reviewer-ui-774/
          retention-days: 14
          if-no-files-found: warn
