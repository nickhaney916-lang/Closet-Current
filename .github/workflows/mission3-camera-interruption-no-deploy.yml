name: Mission 3 camera interruption and pending capture safety — NO DEPLOY
on:
  push:
    branches: [research/mission3-camera-interruption-20261110-HOLD]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-capture-interruption:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce Mission 3 verified private-cloud parent and camera-only paths
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=4d1657fa748156ddb4e92dd70731ad01298a33ec
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --exit-code "$BASE" HEAD -- public/auth.js public/cloud-backup.js supabase public/local-worker.mjs public/recognition-engine.mjs
          git diff --name-only "$BASE" HEAD | while read -r p; do
            case "$p" in
              public/app.js|tests/mission3-camera-interruption.test.cjs|research/mission3-camera-interruption/REPORT.md|.github/workflows/mission3-camera-interruption-no-deploy.yml) ;;
              *) echo "Unexpected camera branch path: $p"; exit 1 ;;
            esac
          done
      - name: Install pinned browser and test dependencies
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Reproduce exact-parent background camera risk without patch
        run: |
          git worktree add --detach /tmp/closet-mission3-camera-parent 4d1657fa748156ddb4e92dd70731ad01298a33ec
          CAMERA_SOURCE_ROOT=/tmp/closet-mission3-camera-parent EXPECT_BASELINE=1 node --test tests/mission3-camera-interruption.test.cjs
      - name: Verify camera cancellation, deferred media permission and new request isolation
        run: node --test tests/mission3-camera-interruption.test.cjs
      - name: Complete Node suite including cloud owner/session regression
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Real Chromium and WebKit mobile canonical camera-to-review-to-private-closet
        run: node scripts/test-native-canonical-original-167-browser.mjs
      - name: Real Chromium and WebKit mobile interrupted storage and app reliability
        run: node scripts/test-family-reliability-mobile.mjs
      - name: Preserve evidence, no deployment tokens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission3-mobile-camera-interruption-HOLD
          path: |
            benchmark/native-canonical-closet-style-167/
            benchmark/family-reliability-mobile/
          retention-days: 14
