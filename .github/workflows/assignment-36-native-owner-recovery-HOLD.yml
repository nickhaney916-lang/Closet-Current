name: Assignment 36 cumulative native owner recovery HOLD
on:
  pull_request:
    branches: [research/main1054-jpeg-exif-fill-byte-HOLD]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/assignment-36-native-owner-recovery-HOLD'
    strategy:
      fail-fast: false
      matrix:
        lane: [auth, backup, outfit, interruption-chromium, interruption-webkit, regression]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      BASE_SHA: bba97ce9b6535ed3fd5882501464806560585cdb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact head, reviewed ancestry and test-only scope
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$PR_BASE" = "$BASE_SHA"
          test "$EXPECTED_HEAD" != "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          test -z "$(git rev-list --merges "$BASE_SHA..HEAD")"
          test "$(git rev-parse "$BASE_SHA^{tree}")" = 95a36849ed10cde535096c7a300999d7dbe32f4c
          git diff --no-renames --name-only "$BASE_SHA" HEAD > /tmp/cc36-paths
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/assignment-36-native-owner-recovery-HOLD.yml|docs/assignment-36-native-owner-recovery.md|scripts/assignment-31/browser.mjs|scripts/test-mission3-lossless-v4-owner-acceptance-browser.mjs|scripts/test-outfit-save-recovery-browser.mjs) ;;
              *) echo "Unexpected changed path: $path"; exit 1 ;;
            esac
          done < /tmp/cc36-paths
          git log -1 --format='commit %H tree %T'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: node scripts/build.mjs
      - if: matrix.lane == 'auth'
        run: node scripts/verify-auth-review-session-36.mjs
      - if: matrix.lane == 'backup'
        run: |
          node scripts/test-mission3-lossless-v4-owner-acceptance-browser.mjs benchmark/assignment-36/backup
          node scripts/test-mission3-cloud-restore-owner-browser.mjs benchmark/assignment-36/cloud-restore
      - if: matrix.lane == 'outfit'
        env:
          OUTFIT_SAVE_OUT: benchmark/assignment-36/outfit-save
        run: node scripts/test-outfit-save-recovery-browser.mjs
      - if: startsWith(matrix.lane, 'interruption-')
        env:
          CC31_ENGINE: ${{ matrix.lane == 'interruption-chromium' && 'chromium' || 'webkit' }}
        run: node scripts/assignment-31/browser.mjs
      - if: matrix.lane == 'regression'
        run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
      - if: always() && contains(fromJSON('["auth","backup","outfit"]'), matrix.lane)
        uses: actions/upload-artifact@v4
        with:
          name: assignment-36-${{ matrix.lane }}-HOLD
          path: |
            benchmark/auth-review-session-36/browser
            benchmark/assignment-36
          if-no-files-found: warn
          retention-days: 21
