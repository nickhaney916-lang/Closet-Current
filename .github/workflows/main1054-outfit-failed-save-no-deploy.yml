name: M4 P1 outfit failed-save rollback no deploy
on:
  push:
    branches: [research/main1054-p1-outfit-save-failure-rollback-HOLD]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact SHA, original branch ancestry and narrow edit surface
        shell: bash
        run: |
          set -euo pipefail
          BASE=ed340449514255c4bda84eb47f64187e5bd546c8
          test "${{ github.run_attempt }}" = 1
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --check "$BASE" HEAD
          while IFS= read -r file; do
            case "$file" in
              public/outfit-board.js|public/closet-browser.js|tests/main1054-outfit-failed-save-rollback.test.cjs|.github/workflows/main1054-outfit-failed-save-no-deploy.yml) ;;
              *) echo "OUT OF SCOPE $file"; exit 1 ;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
          node --check public/outfit-board.js
          node --check public/closet-browser.js
      - name: Reproduce original genuine selection handlers and simulated storage abort
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/main1054-outfit-failed-save-rollback.test.cjs | tee "$RUNNER_TEMP/failed-save.tap"
          grep -Eq '^# fail 0$' "$RUNNER_TEMP/failed-save.tap"
      - name: Build and run complete existing Node regression suite
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs | tee "$RUNNER_TEMP/full-node.tap"
          grep -Eq '^# fail 0$' "$RUNNER_TEMP/full-node.tap"
          grep -Eq '^# skipped 0$' "$RUNNER_TEMP/full-node.tap"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main1054-outfit-failed-save-no-deploy
          path: |
            ${{ runner.temp }}/failed-save.tap
            ${{ runner.temp }}/full-node.tap
          if-no-files-found: ignore
