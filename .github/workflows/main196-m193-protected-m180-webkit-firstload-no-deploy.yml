name: MAIN196 protected M180 unmodified WebKit first-load on M193 NO DEPLOY HOLD
on:
  push:
    branches: [research/main196-protected-m180-webkit-firstload-M193-HOLD]
  pull_request:
    branches: [research/main193-protected-m58-m192-source-guard-HOLD]
    paths:
      - .github/workflows/main196-m193-protected-m180-webkit-firstload-no-deploy.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  unmodified-webkit-firstload:
    name: unmodified P88 native WebKit first-load ${{ matrix.independent_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        independent_run: [1, 2, 3]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: webkit
      P94_WIDTH: '390'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard immutable M179 adopted source, real model and NO private/product edits
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          PARENT=38322b2c48e27f7b0d636395306a68777115487b
          P88=cc4554ef0104506a72bf0a28423fee52b6e4fff2
          git merge-base --is-ancestor "$PARENT" HEAD
          git cat-file -e "$P88^{commit}"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse HEAD:public/outfit-instance-review-840.mjs)" = 6324d8eda33024f166311f424392ed83363e4942
          test "$(git rev-parse HEAD:research/multi-garment-capture-01/review-ui.mjs)" = d478fcf6e4e8889a23b1620b444667ac949da7a9
          test "$(git rev-parse HEAD:scripts/test-main58-actual-p88-wasm-browser.mjs)" = 96ba2f5ee2420de52f45911881fdcc139455c353
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          test "$(git rev-parse HEAD:public/native-reviewed-private-save-167.mjs)" = 8a4c5f1ba513792c8cacbf898d9263ce76a78963
          test "$(git rev-parse HEAD:public/native-2d-preview-p99.mjs)" = 62bad171a97030846b0f1bb3bab740dec20ac5e7
          # M196: mandatory exact donor source and original-M190 proof; do not
          # accept any unpinned index substitute, disabled owner review, or fake mask.
          test "$(git rev-parse HEAD:public/native-owner-wardrobe-index-167.mjs)" = 674797958366cc976a1a4abc8073087148d22975
          test "$(git rev-parse HEAD:tests/main190-retired-duplicate-owner-index.test.mjs)" = cf9fd805e3a257378ac658b23d50a9a9339daa0c
          test "$(git rev-parse HEAD:public/native-outfit-source-plan-p99.mjs)" = 0d4972a7fddfcfae0dd811765e4a94b962f4b578
          test "$(git rev-parse HEAD:public/native-photo-3d-veto-p99.mjs)" = 82b93d12d2fbcba146a190f5dce87a6ac5fc44af
          test "$(git rev-parse HEAD:research/parallel96-highres/source-derivative-intake96.mjs)" = 1840c4496aefc28941f4c3de24a29bac1cb5e792
          # M182 accepts ONLY the SHA-reviewed M181 no-proposal user fallback;
          # real SegFormer, owner storage, 3D denial and M58/P94 assertions unchanged.
          test "$(git rev-parse HEAD:public/outfit-capture.js)" = 8d55715ef09e34086d3c401ec38340bfc25f5fe8
          test "$(git rev-parse HEAD:tests/outfit-capture.test.cjs)" = b254c78302136761e1edf336056f8b949832c0ec
          test "$(git rev-parse HEAD:scripts/test-main181-zero-proposal-native-browser.mjs)" = ea1a5bdb7f0617c71695f9b0382afd6ff7d5f089
          test "$(git rev-parse HEAD:research/master-consolidation-1054/M181-ZERO-PROPOSAL-NATIVE-FAILCLOSED-HOLD.md)" = b408db8aeb16750b87a18f940d40d7bf4d05497b
          test "$(git rev-parse HEAD:.github/workflows/main181-zero-proposal-native-no-deploy.yml)" = cf7731ed4c55bb5e9f96c47f5a13390b4c44ecf2
          # Two strict inherited CI allowlists: only known M180 filename additions.
          # Blob-pinned end to end; no product/model/assertion/receipt relaxation.
          test "$(git rev-parse HEAD:.github/workflows/main1054-m58-real-p88-worker-no-deploy.yml)" = 14b0f9e09b28068d9d12f829ce5ecad8b3cfc662
          test "$(git rev-parse HEAD:.github/workflows/main173-unflagged-owner-24mp-no-deploy.yml)" = d442beaa482cb11dae1f5b103d32f1204b132a2b
          test "$(git rev-parse "$P88:public/outfit-worker.mjs")" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse "$P88:public/outfit-segmentation.mjs")" = d357955dd8fdab7c0cb727ea597c270edd9309ac
          git diff --exit-code "$PARENT" HEAD -- public/ ':(exclude)public/native-owner-wardrobe-index-167.mjs' ':(exclude)public/outfit-capture.js' ':(exclude)public/native-2d-preview-p99.mjs' ':(exclude)public/native-outfit-source-plan-p99.mjs' scripts/ ':(exclude)scripts/test-main181-zero-proposal-native-browser.mjs' tests/ ':(exclude)tests/main190-retired-duplicate-owner-index.test.mjs' ':(exclude)tests/outfit-capture.test.cjs' ':(exclude)tests/main187-required-owner-assert-current.test.mjs' ':(exclude)tests/main188-owner-revoked-outfit-preview.test.mjs' supabase/ benchmark/ research/multi-garment-capture-01/ research/parallel96-highres/
          git diff --name-only "$PARENT" HEAD | while IFS= read -r path; do
            case "$path" in
              .github/workflows/main180-unmodified-webkit-firstload-no-deploy.yml|research/master-consolidation-1054/M180-WEBKIT-FIRSTLOAD-RELIABILITY-HOLD.md|.github/workflows/main1054-m58-real-p88-worker-no-deploy.yml|.github/workflows/main173-unflagged-owner-24mp-no-deploy.yml|.github/workflows/main181-zero-proposal-native-no-deploy.yml|public/outfit-capture.js|research/master-consolidation-1054/M181-ZERO-PROPOSAL-NATIVE-FAILCLOSED-HOLD.md|scripts/test-main181-zero-proposal-native-browser.mjs|tests/outfit-capture.test.cjs|.github/workflows/main183-outfit-session-epoch-no-deploy.yml|public/native-outfit-source-plan-p99.mjs|public/native-2d-preview-p99.mjs|tests/main187-required-owner-assert-current.test.mjs|tests/main188-owner-revoked-outfit-preview.test.mjs|.github/workflows/main187-required-owner-lease-no-deploy.yml|.github/workflows/main188-owner-revoked-original-preview-no-deploy.yml|.github/workflows/main189-lease-revocation-crossmission-no-deploy.yml|research/master-consolidation-1054/M189-OWNER-REVOCATION-ADMISSION-HOLD.md|public/native-owner-wardrobe-index-167.mjs|tests/main190-retired-duplicate-owner-index.test.mjs|.github/workflows/main192-m189-m190-source-convergence-no-deploy.yml|.github/workflows/main193-m192-protected-m58-candidate-no-deploy.yml|.github/workflows/main196-m193-protected-m180-webkit-firstload-no-deploy.yml) ;;
              *) echo "M180 unexpected modified source path: $path"; exit 1 ;;
            esac
          done
          node --check scripts/test-main58-actual-p88-wasm-browser.mjs
          node --check scripts/test-parallel94-native-p88-browser.mjs
      - name: Extract immutable P88 donor ONLY into disposable local CI route
        shell: bash
        run: |
          set -euo pipefail
          P88=cc4554ef0104506a72bf0a28423fee52b6e4fff2
          mkdir -p .m57-exact-p88-donor/public
          for file in outfit-worker.mjs outfit-segmentation.mjs outfit-instance-review-840.mjs photo-color.js; do
            git show "$P88:public/$file" > ".m57-exact-p88-donor/public/$file"
            test "$(git hash-object ".m57-exact-p88-donor/public/$file")" = "$(git rev-parse "$P88:public/$file")"
          done
      - name: Install same pinned genuine browser/WASM test runtime
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Genuine first WebKit browser process - original M58 owner and real WASM model
        run: node scripts/test-main58-actual-p88-wasm-browser.mjs
      - name: Genuine second fresh WebKit process - installed unmodified P94 source and owner/restore
        run: node scripts/test-parallel94-native-p88-browser.mjs
      - name: Verify exact model receipt and mandatory no-silent-save gates
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('benchmark/main58-real-p88-browser-worker/webkit/M58-ACTUAL-P88-BROWSER-NO-SILENT-SAVE.json','utf8'));
          if(r.actualBrowser!=='webkit'||r.actualP88ModuleWorkerExecuted!==true||
             r.noSyntheticWorker!==true||r.sourceVerified!==true||
             !(r.sourceGroupsUnverified>=1&&r.sourceGroupsUnverified<=12)||
             r.ownerPrivateSaves!==0||r.unexpectedOutbound?.length!==0||
             r.hostedSignedRLS!==false||r.physicalDevice!==false||
             r.familyAlpha!=='HOLD'||r.releaseAllowed!==false)
            throw Error('M180 unmodified WebKit genuine-model/no-silent-save receipt failed');
          console.log('M180_GENUINE_WEBKIT_FIRSTLOAD_SOURCE_SAFE_PASS',JSON.stringify({
            actualWebKit:true,unmodifiedWorker:true,sourceVerified:true,
            unverifiedGroups:r.sourceGroupsUnverified,ownerPrivateSaves:0,
            firstLoadAcceptanceOnly:true,physicalDevice:false,hostedRLS:false,
            familyAlpha:'HOLD',releaseAllowed:false
          }));
          JS
