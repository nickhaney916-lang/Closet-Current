name: DETECTOR57 native synthetic detector replay and final atomic crop gate NO DEPLOY
on:
  push:
    branches:
      - research/detector-proposal-native-acceptance-57-main-20261105-HOLD
  pull_request:
    paths:
      - 'research/detector-proposal-native-acceptance-57/**'
      - 'research/multi-garment-capture-01/atomic-group.mjs'
      - 'scripts/test-multi-garment-capture-01-browser.mjs'
      - 'scripts/audit-detector57-browser.mjs'
      - 'tests/multi-garment-capture-01.test.mjs'
      - '.github/workflows/detector-proposal-native-acceptance-57-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  true-native-browser-crop-review-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce exact verified SAFETY55 research baseline and no unrelated app or production edits
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 77af898d0cf67f963d13f487da1ecfe2e96fe035 HEAD
          git diff --name-only 77af898d0cf67f963d13f487da1ecfe2e96fe035 HEAD > /tmp/detector57-files
          while IFS= read -r path; do
            case "$path" in
              research/detector-proposal-native-acceptance-57/*|research/multi-garment-capture-01/atomic-group.mjs|scripts/test-multi-garment-capture-01-browser.mjs|scripts/audit-detector57-browser.mjs|tests/multi-garment-capture-01.test.mjs|.github/workflows/detector-proposal-native-acceptance-57-no-deploy.yml) ;;
              *) echo "BLOCKED production/staging or unrelated edit: $path"; exit 1 ;;
            esac
          done < /tmp/detector57-files
      - name: Install pinned dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Build app and pass full inherited plus two new final-writer attack tests
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Retest genuine original photo manual three-piece private closet full regression
        run: node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Six actual native mobile browser detector-message safety to private closet full E2E
        run: DETECTOR57=1 node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Independent source, screenshot SHA, width, ownership and 72-frame evidence audit
        run: node scripts/audit-detector57-browser.mjs
      - name: Archive sanitized real-browser screenshots and acceptance manifests ONLY
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DETECTOR57-real-native-private-review-72-screenshots-HOLD
          path: |
            benchmark/multi-garment-capture-01/acceptance.json
            benchmark/detector-proposal-native-57/acceptance.json
            benchmark/detector-proposal-native-57/*.png
          if-no-files-found: warn
          retention-days: 14
