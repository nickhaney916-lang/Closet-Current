name: DENIM-SEAM-FLOW-28 original 163-bone photographed side/rear geometry QA (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'research/denim-fit-06/source-neutral-side-seam-flow-28.mjs'
      - 'research/denim-fit-06/static-source-denim-fit.mjs'
      - 'research/fabric-sweep-04/dress-outfit-controller.mjs'
      - 'research/fabric-sweep-04/dress-mobile-showroom.mjs'
      - 'research/fabric-sweep-04/wardrobe-demo.mjs'
      - 'research/denim-seam-flow-28/**'
      - 'scripts/test-denim-seam-flow-28-browser.mjs'
      - 'scripts/audit-denim-seam-flow-28.mjs'
      - 'tests/denim-seam-flow-28.test.mjs'
      - '.github/workflows/denim-seam-flow-28-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-original-jeans-seam-fitting:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Exact P27 source-honest verified ancestor and no production changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor eaccc4d7f945e2ea5af746f9486c5cccf03047e0 HEAD
          git diff --name-only eaccc4d7f945e2ea5af746f9486c5cccf03047e0 HEAD | while IFS= read -r path; do
            case "$path" in
              research/denim-fit-06/source-neutral-side-seam-flow-28.mjs|research/denim-fit-06/static-source-denim-fit.mjs|research/fabric-sweep-04/dress-outfit-controller.mjs|research/fabric-sweep-04/dress-mobile-showroom.mjs|research/fabric-sweep-04/wardrobe-demo.mjs|research/denim-seam-flow-28/*|scripts/test-denim-seam-flow-28-browser.mjs|scripts/audit-denim-seam-flow-28.mjs|tests/denim-seam-flow-28.test.mjs|.github/workflows/denim-seam-flow-28-no-deploy.yml) ;;
              *) echo "P28 unauthorized production/photo/index/parallel edit: $path"; exit 1 ;;
            esac
          done
      - name: Install pinned source image and authentic 163-bone browser dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 three@0.180.0 playwright@1.56.1 three-mesh-bvh@0.9.2
      - name: Source/photo/provenance/geometry static and unit regression checks
        run: |
          node --check research/denim-fit-06/source-neutral-side-seam-flow-28.mjs
          node --check research/denim-fit-06/static-source-denim-fit.mjs
          node --check research/fabric-sweep-04/wardrobe-demo.mjs
          node --check research/fabric-sweep-04/dress-outfit-controller.mjs
          node --check research/fabric-sweep-04/dress-mobile-showroom.mjs
          node --check scripts/test-denim-seam-flow-28-browser.mjs
          node --check scripts/audit-denim-seam-flow-28.mjs
          node --test tests/denim-seam-flow-28.test.mjs tests/denim-anatomical-hang-26.test.mjs tests/denim-source-neutral-weave-25.test.mjs tests/denim-visible-27.test.mjs
      - name: Rebuild exact original licensed photographed denim and original approved anatomical rigs
        run: |
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node scripts/build-work47-benchmark.mjs
          node --test tests/three-d-31-jeans-source.test.mjs tests/three-d-37-source-true.test.mjs
          git fetch --no-tags origin 53f2ad344dc56a1477e343531c423aed0e66c17d dd6bac3fa9ff640d4f562cf925337440bdb5cf8f 3a572193987cb29389727426136c6eb3ac326783 dfb40889c4c1221fb1833b859e8a11ef38aeb76e
          node research/three-d-20/restore-approved-models.mjs
      - name: P28 genuine 96 original photographed 163-bone WebGL side/quarter/rear comparison
        run: node scripts/test-denim-seam-flow-28-browser.mjs
      - name: Independently audit exact image bytes and all 12 original garment contact sheets
        run: node scripts/audit-denim-seam-flow-28.mjs
      - name: Enforce true-photo and actual rear/side contour visibility without a fake photorealism pass
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,existsSync} from 'node:fs';
          const root='benchmark/denim-seam-flow-28/';
          const r=JSON.parse(readFileSync(root+'results.json','utf8'));
          const v=JSON.parse(readFileSync('benchmark/denim-seam-flow-28-review/visual-acceptance.json','utf8'));
          assert.equal(r.genuineBeforeAfterWebGLFrames,96);
          assert.equal(r.results.length,48);
          assert.equal(r.modeledAnatomicalSeam28,true);
          assert.equal(r.actualSourceRGBNeverChanged,true);
          assert.equal(r.independentRearPhotographAvailable,false);
          assert.ok(r.results.every(x=>x.P28Fitted&&x.noNewBVHContacts&&x.originalFrontPhotoRGBUntouched&&x.sourceOriginalSHAUVRestSkinPreserved&&x.owner==='fixture-account-a'&&x.bones===163));
          assert.ok(r.results.filter(x=>x.angle!==0).every(x=>x.changedOnRealDenimPixels>=20));
          assert.equal(v.fullOriginalSourceScreenshots,96);
          assert.equal(v.verifiedPairs,48);
          assert.equal(v.contactSheetCount,12);
          assert.equal(v.anatomicalSeamFlow28,true);
          assert.equal(v.unphotographedBackMaterial,'MODELED_NOT_PHOTOGRAPHED');
          assert.equal(v.photorealismAcceptance,'REVIEW');
          assert.equal(v.realPhoneAcceptance,'NOT_TESTED');
          assert.equal(v.releaseAuthorized,false);
          assert.equal(v.productionModified,false);
          for(const f of v.contactSheets)assert.ok(existsSync('benchmark/denim-seam-flow-28-review/'+f));
          assert.deepEqual(r.errors,[]);
          assert.deepEqual(r.external,[]);
          assert.equal(r.familyAlpha,'HOLD');
          console.log('P28: 96 genuine-source mobile WebGL views and 12 contact sheets, NO DEPLOY, photorealism REVIEW');
          NODE
      - name: Upload true original-photo P26-to-P28 visual comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P28-96-genuine-denim-WebGL-12-reviewed-contact-sheets-HOLD
          path: |
            benchmark/denim-seam-flow-28/
            benchmark/denim-seam-flow-28-review/
          if-no-files-found: warn
