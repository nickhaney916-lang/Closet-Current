name: P1633 wardrobe version compatibility HOLD
on:
  push:
    branches: [research/p1633-version-compatibility-HOLD]
  workflow_dispatch: {}
permissions:
  contents: read
env:
  DONOR: c2b1ae41603d476358af39eba99008914fac8046
  CANDIDATE: 1b949a8ecbcad670259ef46897131e3abda6cf72
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        check: [regression, chromium, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin both application sources
        shell: bash
        run: |
          git fetch --no-tags origin "$CANDIDATE" "$DONOR"
          test "$(git rev-parse "$DONOR^{tree}")" = d8879b394118cff8a02e7d63c7298fedf61b1f8e
          test "$(git rev-parse "$CANDIDATE^{tree}")" = 8c8f9a190660f4bf69aa85ee042703a70d795496
          git diff --exit-code "$CANDIDATE" HEAD -- public scripts/build.mjs
          git worktree add --detach "$RUNNER_TEMP/p1633-donor" "$DONOR"
          git log -1 --format='commit %H tree %T'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: node scripts/build.mjs
      - if: matrix.check == 'regression'
        run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
      - if: matrix.check != 'regression'
        run: npx playwright install --with-deps "${{ matrix.check }}"
      - if: matrix.check != 'regression'
        name: Upgrade and roll back actual application builds
        shell: bash
        env:
          P1633_ENGINE: ${{ matrix.check }}
        run: |
          (cd "$RUNNER_TEMP/p1633-donor" && node scripts/build.mjs)
          for width in 320 390 430; do
            P1633_WIDTH="$width" node scripts/test-p1633-version-compatibility-browser.mjs "$RUNNER_TEMP/p1633-donor/dist" dist |
              tee "$RUNNER_TEMP/p1633-$P1633_ENGINE-$width.log"
          done
      - if: always() && matrix.check != 'regression'
        uses: actions/upload-artifact@v4
        with:
          name: p1633-${{ matrix.check }}-receipts
          path: ${{ runner.temp }}/p1633-${{ matrix.check }}-*.log
          if-no-files-found: ignore
