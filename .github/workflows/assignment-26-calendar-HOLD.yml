name: Assignment 26 calendar integrity HOLD
on:
  pull_request:
    branches: [research/main1054-unified-active-session-HOLD]
permissions:
  contents: read
jobs:
  acceptance:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/assignment-26-calendar-HOLD'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: regression
          - lane: chromium
            width: 320
          - lane: chromium
            width: 390
          - lane: chromium
            width: 430
          - lane: webkit
            width: 320
          - lane: webkit
            width: 390
          - lane: webkit
            width: 430
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Verify assignment source and accepted parent
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = 2f57f8753d56907bc686f2fcfd58c12e3cb357cc
          git log -1 --format='commit %H tree %T'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: node scripts/build.mjs
      - if: matrix.lane == 'regression'
        run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
      - if: matrix.lane != 'regression'
        env:
          P99_ENGINE: ${{ matrix.lane }}
          P99_WIDTH: ${{ matrix.width }}
        run: node scripts/assignment-26-calendar.cjs
