name: PARALLEL 67 independent real SigLIP clothing recognition evidence — NO DEPLOY
on:
  push:
    branches: [research/parallel67-independent-siglip-challenger-01-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: parallel67-siglip-HOLD-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-main-native-and-safety-tests-HOLD:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated five-path difference and EXACT protected main checkpoint
        run: |
          set -euo pipefail
          BASE=8c3355350303399e9edc2e98beaf9de15d601282
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD >/tmp/p67-files
          cat /tmp/p67-files
          test "$(wc -l </tmp/p67-files)" -eq 5
          while IFS= read -r path; do
            case "$path" in
              scripts/parallel67-independent-siglip-scoring.mjs|scripts/parallel67-run-siglip-real16.mjs|tests/parallel67-independent-siglip-evidence.test.mjs|research/parallel67-independent-siglip-challenger-01/REPORT.md|.github/workflows/parallel67-independent-siglip-real16-no-deploy.yml) ;;
              *) echo "UNAUTHORIZED LIVE MODEL, ACCOUNT, CLOUD OR RELEASE MODIFICATION $path"; exit 1 ;;
            esac
          done </tmp/p67-files
          test -z "$(git diff --name-only "$BASE" HEAD -- public supabase benchmark)"
          grep -Fq 'Family Alpha HOLD #255' research/parallel67-independent-siglip-challenger-01/REPORT.md
          echo PARALLEL67_DISTINCT_SIGLIP_RESEARCH_ONLY_FIVE_FILES_NO_DEPLOY
      - name: Install ephemeral regression dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Verify ranking safety, original frozen labels and all existing native regressions
        run: |
          set -euo pipefail
          node --check scripts/parallel67-independent-siglip-scoring.mjs
          node --check scripts/parallel67-run-siglip-real16.mjs
          node --test tests/parallel67-independent-siglip-evidence.test.mjs
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  actually-run-independent-quantized-siglip-on-originals-HOLD:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      NODE_OPTIONS: "--max-old-space-size=5120"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact independent Transformers.js / ONNX inference only
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1
      - name: Download original 16 publisher photos with LICENSED source and SHA-256 checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IDS=$(node -e 'process.stdout.write(require("./benchmark/manifest-holdout-16.json").map(x=>x.id).join(","))')
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos "$IDS"
      - name: Real pinned SigLIP q8 ONNX CPU on all original local JPEGs, fail on model error
        run: |
          set -euo pipefail
          node scripts/parallel67-run-siglip-real16.mjs benchmark/p67-independent-siglip-real16
      - name: Upload numerical source-ID only receipts, not photos or pretrained model weights
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PARALLEL67-independent-SigLIP-real16-NUMERIC-ONLY-NOT-BLIND-NO-DEPLOY
          path: benchmark/p67-independent-siglip-real16/siglip-developer-exposed-real16.json
          retention-days: 14
          if-no-files-found: error
