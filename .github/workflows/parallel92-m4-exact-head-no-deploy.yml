name: P92 M4 exact-head Chromium WebKit x2 NO DEPLOY
on:
  push:
    branches: [research/parallel92-m4-integration-acceptance-HOLD]
  pull_request:
    branches: [research/main1054-m58-real-p88-browser-worker-HOLD]
    paths:
      - scripts/test-parallel92-exact-head.mjs
      - scripts/test-parallel92-independent-browser.mjs
      - scripts/test-parallel92-m51-webkit-reentry.mjs
      - scripts/test-parallel92-preview-terminal-candidate.mjs
      - research/parallel92-integration/LEDGER.md
      - .github/workflows/parallel92-m4-exact-head-no-deploy.yml
permissions:
  contents: read
concurrency:
  group: p92-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  actual-native-browser-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      P92_ENGINE: ${{ matrix.engine }}
      P92_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstitute exact immutable P88 module Worker in disposable CI-only source route
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          P88=cc4554ef0104506a72bf0a28423fee52b6e4fff2
          git cat-file -e "$P88^{commit}"
          mkdir -p .m57-exact-p88-donor/public
          for file in outfit-worker.mjs outfit-segmentation.mjs outfit-instance-review-840.mjs photo-color.js; do
            git show "$P88:public/$file" > ".m57-exact-p88-donor/public/$file"
            test "$(git hash-object ".m57-exact-p88-donor/public/$file")" = "$(git rev-parse "$P88:public/$file")"
          done
          test "$(git hash-object .m57-exact-p88-donor/public/outfit-worker.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
      - name: Install only isolated local native browser dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Two consecutive fresh browser tests on identical exact SHA
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$P92_CHECKOUT_SHA"
          node --check scripts/test-parallel92-exact-head.mjs
          for trial in 1 2; do
            echo "P92 STRICT TRIAL $trial/2 ENGINE $P92_ENGINE HEAD $(git rev-parse HEAD)"
            P92_TRIAL="$trial" node scripts/test-parallel92-exact-head.mjs
          done
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          for(const t of [1,2]){
           const r=JSON.parse(fs.readFileSync('benchmark/parallel92/'+process.env.P92_ENGINE+'/trial-'+t+'/receipt.json','utf8'));
           if(r.exactHead!==process.env.P92_CHECKOUT_SHA||r.trial!==t||r.status!=='PASS'||r.releaseAllowed!==false)throw Error('P92 failed to create two strict same-head receipts');
          }
          JS
      - name: Archive only non-sensitive JSON evidence (NO private photos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p92-${{ matrix.engine }}-two-independent-fresh-native-journeys-HOLD
          retention-days: 14
          if-no-files-found: ignore
          path: |
            benchmark/parallel92/${{ matrix.engine }}/trial-1/receipt.json
            benchmark/parallel92/${{ matrix.engine }}/trial-2/receipt.json
            benchmark/parallel92/${{ matrix.engine }}/trial-1/v4/results.json
            benchmark/parallel92/${{ matrix.engine }}/trial-2/v4/results.json
            benchmark/main58-real-p88-browser-worker/${{ matrix.engine }}/M58-ACTUAL-P88-BROWSER-NO-SILENT-SAVE.json
            benchmark/main58-real-p88-browser-worker/${{ matrix.engine }}/P91-LIFECYCLE.json
            benchmark/main51-real-app-owner-2d/${{ matrix.engine }}/M51-native-owner-source-2d-NOT-RELEASE.json
  independent-source-safe-native-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      P92_ENGINE: ${{ matrix.engine }}
      P92_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned local browser dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Verify native 2D, durable source duplicate, v4 rollback and owner guards twice
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$P92_CHECKOUT_SHA"
          node --check scripts/test-parallel92-independent-browser.mjs
          for trial in 1 2; do
            P92_TRIAL="$trial" node scripts/test-parallel92-independent-browser.mjs
          done
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          for(const t of [1,2]){
           const r=JSON.parse(fs.readFileSync('benchmark/parallel92-independent/'+process.env.P92_ENGINE+'/trial-'+t+'/receipt.json','utf8'));
           if(r.exactHead!==process.env.P92_CHECKOUT_SHA||r.trial!==t||r.status!=='PASS'||r.releaseAllowed!==false||r.modelInference!=='NOT_RUN_IN_THIS_JOB')throw Error('P92 independent receipt invalid');
          }
          JS
      - name: Archive source-safe native browser receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p92-${{ matrix.engine }}-native-photo2d-v4-two-trials-HOLD
          retention-days: 14
          if-no-files-found: ignore
          path: |
            benchmark/parallel92-independent/${{ matrix.engine }}/trial-1/receipt.json
            benchmark/parallel92-independent/${{ matrix.engine }}/trial-2/receipt.json
            benchmark/parallel92-independent/${{ matrix.engine }}/trial-1/v4/results.json
            benchmark/parallel92-independent/${{ matrix.engine }}/trial-2/v4/results.json
  webkit-m51-focus-reentry-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      P92_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      P92_REENTRY_RUNS: '12'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin exact native app and prior M51 test source; read-only diagnosis
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$P92_CHECKOUT_SHA"
          test "$(git rev-parse HEAD:scripts/test-main51-real-app-owner-original-2d.mjs)" = 63cc9da00eaecbeb2576482dcae1528b44ea8189
          test "$(git rev-parse HEAD:public/app.js)" = 438acfeda76e313b84a7f41a78aab4a748c4e932
          test "$(git rev-parse HEAD:public/outfit-board.js)" = 42dc1a7a2503a1722e6addcd0b8613a7eb029b60
      - name: Install immutable local browser test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Twelve strict fresh real WebKit original-JPEG preview/lease trials, 320 390 430, failure-only phases
        run: |
          node --check scripts/test-parallel92-m51-webkit-reentry.mjs
          node scripts/test-parallel92-m51-webkit-reentry.mjs
      - name: Retain source-safe failure-only diagnosis, no images or credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p92-webkit-m51-owner-preview-reentry-diagnostic-HOLD
          path: benchmark/parallel92-webkit-reentry/result.json
          retention-days: 14
          if-no-files-found: ignore
  m101-native-atomic-import-cross-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      P92_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict M101 exact main owner source and unchanged atomic import browser test
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$P92_CHECKOUT_SHA"
          test "$(git merge-base 3bf2bdad10d264ebe23ba58e156389a1db5feb0b HEAD)" = 3bf2bdad10d264ebe23ba58e156389a1db5feb0b
          test "$(git rev-parse HEAD:public/app.js)" = 438acfeda76e313b84a7f41a78aab4a748c4e932
          test "$(git rev-parse HEAD:public/native-default-atomic-import-m3.mjs)" = e739f1533108d53961483d761a27f0525623af3d
          test "$(git rev-parse HEAD:scripts/test-mission3-default-atomic-import-browser.mjs)" = 375ff22b8c69bd6f7ddb19fc59cb6c4460eb7ba8
          test "$(git rev-parse HEAD:tests/mission3-default-atomic-backup-source-guard.test.mjs)" = 443c4f3a9b288aa8af36137985c684826b4414cd
          node --check scripts/test-mission3-default-atomic-import-browser.mjs
      - name: Install pinned no-deploy native browser dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Verify M101 owner-readable SHA provenance refusals, 8MiB originals and rollback before browser import
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:public/native-default-atomic-import-m3.mjs)" = e739f1533108d53961483d761a27f0525623af3d
          test "$(git rev-parse HEAD:tests/mission3-default-atomic-backup-source-guard.test.mjs)" = 443c4f3a9b288aa8af36137985c684826b4414cd
          node --test tests/mission3-default-atomic-backup-source-guard.test.mjs
      - name: Two independent native M101 trials across both engines at widths 320 390 430
        shell: bash
        run: |
          set -euo pipefail
          for trial in 1 2; do
            node scripts/test-mission3-default-atomic-import-browser.mjs "benchmark/parallel92-m101-import/trial-$trial"
          done
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          for(const trial of [1,2]){
            const r=JSON.parse(fs.readFileSync('benchmark/parallel92-m101-import/trial-'+trial+'/results.json','utf8'));
            if(r.kind!=='mission3-default-atomic-import-browser'||r.familyAlpha!=='HOLD'||
               r.realChromiumWebKit!==true||r.nativeIndexedDB!==true||
               r.hostedCloud!==false||r.physicalDevices!==false||
               r.errors.length!==0||r.cases.length!==6)throw Error('Incomplete M101 browser receipt');
            for(const engine of ['chromium','webkit'])for(const width of [320,390,430]){
              const c=r.cases.find(x=>x.engine===engine&&x.width===width);
              const assertions=['nativeIndexedDB','originalAliasSourceBlocked','ownerFacingDuplicateRecoveryVerified',
               'originalIdCollisionBlocked','unverifiedLegacyJPEGAliasBlocked','foreignOwnerBlocked','duplicateIdsBlocked',
               'unsavedCaptureBlocked','syntheticStageRollback','mergePreservesItems',
               'looksOutfitsOneCommit','cloudRevisionAtomic','badRefRollback',
               'cancellationPreserves','oldOwnerReject'];
              if(width===320){
               for(const key of ['largeCameraOriginalVerified','largeOriginalRequiresReceipt','largeConflictingReceiptsDenied','largeOriginalTamperBlocked','overlongDisplayPreviewBlocked'])
                if(c?.[key]!==true)throw Error('M98 camera original/thumbnail/rollback condition missing: '+key);
              }
              else if(c?.largeCameraOriginalVerified!==null||c?.largeOriginalRequiresReceipt!==null||
               c?.largeConflictingReceiptsDenied!==null||c?.largeOriginalTamperBlocked!==null||
               c?.overlongDisplayPreviewBlocked!==null)throw Error('M98 390/430 camera-original flags not scoped');
              if(!c||assertions.some(k=>c[k]!==true)||c.syntheticOwners!==true||
                 c.hostedSupabase!==false||c.physicalPhone!==false)
                throw Error('M98 native original/photo/owner rollback case failed');
            }
            console.log('P92_M101_NATIVE_IMPORT_STRICT_PASS',JSON.stringify({
              exactHead:process.env.P92_CHECKOUT_SHA,trial,realBrowserCases:6,
              widths:[320,390,430],engines:['chromium','webkit'],
              duplicateOriginalDenied:true,unverifiedOriginalAliasesDenied:true,
              original8MiBRetained:true,shaRequiredForLargeOriginal:true,
              conflictingSourceSHARefused:true,oversizePreviewDenied:true,rollbackAtomic:true,hostedRLS:false,
              familyAlpha:'HOLD'
            }));
          }
          JS
      - name: Archive non-sensitive native import proof only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p92-m101-native-import-twice-cross-engine-HOLD
          retention-days: 14
          if-no-files-found: ignore
          path: |
            benchmark/parallel92-m101-import/trial-1/results.json
            benchmark/parallel92-m101-import/trial-2/results.json
  guarded-stale-lease-disposable-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      P92_ENGINE: ${{ matrix.engine }}
      P92_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned local browser dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Two fresh source-identical native baseline versus scratch-guard trials
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$P92_CHECKOUT_SHA"
          node --check scripts/test-parallel92-preview-terminal-candidate.mjs
          for trial in 1 2; do
            P92_CANDIDATE_TRIAL="$trial" node scripts/test-parallel92-preview-terminal-candidate.mjs
          done
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          for(const n of [1,2]){
            const r=JSON.parse(fs.readFileSync('benchmark/parallel92-preview-terminal-candidate/'+process.env.P92_ENGINE+'/trial-'+n+'/result.json','utf8'));
            if(r.exactHead!==process.env.P92_CHECKOUT_SHA||r.engine!==process.env.P92_ENGINE||
               r.trial!==n||r.status!=='PASS'||r.comparisons?.length!==3||
               r.publicSourceModified===true||r.releaseAllowed!==false)
              throw Error('P92 scratch terminal candidate source-locked trial failed');
          }
          JS
      - name: Archive only source-safe terminal-status receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p92-${{ matrix.engine }}-scratch-terminal-candidate-HOLD
          retention-days: 14
          if-no-files-found: ignore
          path: benchmark/parallel92-preview-terminal-candidate/${{ matrix.engine }}/trial-*/result.json

  inherited-full-native-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      P92_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict immutable M4 app source and test-only diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$P92_CHECKOUT_SHA"
          test "$(git merge-base 3bf2bdad10d264ebe23ba58e156389a1db5feb0b HEAD)" = 3bf2bdad10d264ebe23ba58e156389a1db5feb0b
          test "$(git rev-parse HEAD:public/app.js)" = 438acfeda76e313b84a7f41a78aab4a748c4e932
          test "$(git rev-parse HEAD:public/outfit-board.js)" = 42dc1a7a2503a1722e6addcd0b8613a7eb029b60
          git diff --name-only 3bf2bdad10d264ebe23ba58e156389a1db5feb0b HEAD | while IFS= read -r p; do
            case "$p" in
              scripts/test-parallel92-exact-head.mjs|scripts/test-parallel92-independent-browser.mjs|scripts/test-parallel92-m51-webkit-reentry.mjs|scripts/test-parallel92-preview-terminal-candidate.mjs|research/parallel92-integration/LEDGER.md|.github/workflows/parallel92-m4-exact-head-no-deploy.yml) ;;
              *) echo "P92 REFUSED CONSUMER/DONOR CHANGE: $p"; exit 1 ;;
            esac
          done
      - name: Install pinned native test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Build offline app (no deployment)
        run: node scripts/build.mjs
      - name: Strict full inherited Node and PWA regression suite
        run: node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
