    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      P92_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      P92_MAIN_PIN: 635bd385d0fbcc9a0dd59cce62e74cd310be283a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable current-main source and start disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$P92_CHECKOUT_SHA"
          test "$(git rev-parse "$P92_MAIN_PIN:public/outfit-board.js")" = 22e76c92dc31d8a10d8186e259a4e3784e4b3c84
          test "$(git rev-parse "$P92_MAIN_PIN:public/app.js")" = 835b4ad1f4a4a7f520aad5afd225134e5ea56e2d
          test "$(git rev-parse "$P92_MAIN_PIN:public/native-reviewed-private-save-167.mjs")" = 8a4c5f1ba513792c8cacbf898d9263ce76a78963
          test "$(git rev-parse "$P92_MAIN_PIN:tests/main1054-m132-photo119-large-display-preview.test.mjs")" = 79295b94fc0b1abe954a621ccf056abb23a902a6
          test "$(git rev-parse "$P92_MAIN_PIN:public/native-default-verified-backup-export-m3.mjs")" = e70fdc392c2652dc969b7d7c4b807f3cafd81e03
          test "$(git rev-parse "$P92_MAIN_PIN:public/native-default-atomic-import-m3.mjs")" = e739f1533108d53961483d761a27f0525623af3d
