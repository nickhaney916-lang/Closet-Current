name: Assignment 36 cumulative owner recovery HOLD
on:
  pull_request:
    branches: [research/main1054-jpeg-exif-fill-byte-HOLD]
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'research/assignment-36-owner-recovery-HOLD' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        lane: [chromium, webkit, regression, auth, backup, capture, index, review, native, model, interrupt]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact cumulative head, ancestry and allowed additions
        run: bash scripts/assignment-36/check-scope.sh "$EXPECTED_HEAD"
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Install native browser engines
        if: matrix.lane != 'regression'
        run: npx playwright install --with-deps chromium webkit
      - run: node scripts/build.mjs
      - name: Execute the assigned checks
        env:
          LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          case "$LANE" in
            chromium|webkit) A36_ENGINE="$LANE" node scripts/assignment-36/browser.mjs ;;
            regression) node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs ;;
            *) node scripts/assignment-36/historical.mjs "$LANE" ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always() && matrix.lane != 'regression'
        with:
          name: assignment-36-${{ matrix.lane }}-HOLD
          path: |
            benchmark/assignment-36/
            benchmark/auth-review-session-36/browser/
            benchmark/**/results.json
            benchmark/**/failure.json
          if-no-files-found: ignore
          retention-days: 14

  signed-postgres:
    if: github.head_ref == 'research/assignment-36-owner-recovery-HOLD' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: assignment36-local-only
          POSTGRES_DB: mission3_disposable
        options: >-
          --health-cmd "pg_isready -U postgres -d mission3_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PGHOST: postgres
      PGDATABASE: mission3_disposable
      P147_POSTGRES_URL: postgresql://postgres:assignment36-local-only@postgres:5432/mission3_disposable
      M3_EPHEMERAL_POSTGRES_URL: postgresql://postgres:assignment36-local-only@postgres:5432/mission3_disposable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact cumulative head, ancestry and allowed additions
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/assignment-36/check-scope.sh "$EXPECTED_HEAD"
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 axe-core@4.10.3 pg@8.16.3
      - run: node scripts/build.mjs
      - run: node scripts/bootstrap-mission3-disposable-postgres.mjs
      - run: node scripts/test-signed-jwt-postgres-147.mjs
      - run: node scripts/test-mission3-native-signed-postgres-browser.mjs benchmark/assignment-36/signed-postgres
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assignment-36-signed-postgres-HOLD
          path: benchmark/assignment-36/signed-postgres/
          if-no-files-found: warn
          retention-days: 14
