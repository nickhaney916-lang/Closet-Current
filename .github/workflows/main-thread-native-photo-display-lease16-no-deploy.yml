name: "MAIN1054 M16 exact owner original-photo display lease — NO DEPLOY"
on:
  push:
    branches: [research/main-thread-native-photo-display-lease-1054-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: main1054-m16-exact-owner-photo-display-hold
  cancel-in-progress: true
jobs:
  pinned-source-session-and-full-node-NO-DEPLOY:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Four-path exact-parent original-photo privacy scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=8f9b6975b48e27833b32d6b2b3a17eab60a231ec
          git merge-base --is-ancestor "$BASE" HEAD
          CHANGED="$(git diff --name-only "$BASE" HEAD)"
          test "$(printf '%s\n' "$CHANGED" | wc -l)" -eq 4
          while IFS= read -r p; do
            case "$p" in
              research/main-thread-integration-1054/native-2d-preview.mjs|\
              research/main-thread-integration-1054/native-2d-display-lease16.test.mjs|\
              research/main-thread-integration-1054/MILESTONE16.md|\
              .github/workflows/main-thread-native-photo-display-lease16-no-deploy.yml) ;;
              *) echo "M16_SCOPE_VIOLATION $p" >&2; exit 1 ;;
            esac
          done <<< "$CHANGED"
          git diff --exit-code "$BASE" HEAD -- public/ supabase/ benchmark/ package.json package-lock.json
          test "$(git hash-object public/closet-stylist.js)" = "f2657fffb17a3b2cc606f32b4206a574ef5ddf88"
          test "$(git hash-object public/dual-panel-82.mjs)" = "1a6062877be41a831cb4724448d482405ce75727"
          node --check research/main-thread-integration-1054/native-2d-preview.mjs
          node --check research/main-thread-integration-1054/native-2d-display-lease16.test.mjs
          grep -q "a.authRef!==b.authRef" research/main-thread-integration-1054/native-2d-preview.mjs
          grep -q "a.privateDbRef!==b.privateDbRef" research/main-thread-integration-1054/native-2d-preview.mjs
          grep -q "a.operationEpoch!==b.operationEpoch" research/main-thread-integration-1054/native-2d-preview.mjs
          echo "Exact native original photo display session checks retained. NO DEPLOY."
      - name: Test dependencies without manifest mutation
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Existing app build and exact native owner-display 2D source tests
        run: |
          node scripts/build.mjs
          node --test research/main-thread-integration-1054/native-2d-display-lease16.test.mjs
          node --test research/main-thread-integration-1054/photographed-3d-evidence-gate15.test.mjs
          node --test research/main-thread-integration-1054/source-to-outfit.test.mjs
          node --test research/main-thread-integration-1054/test-native-session-contract14.mjs
      - name: Inherited full native safety, private wardrobe, backup and model tests
        run: node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Family Alpha remains blocked
        run: |
          echo "Family Alpha #255 OPEN HOLD; no original JPEG/private data mutations, no deploy"
  native-actual-browser-owner-photos-and-p880-NO-DEPLOY:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Source branch parent and untouched public/ native auth and model
        shell: bash
        run: |
          set -euo pipefail
          BASE=8f9b6975b48e27833b32d6b2b3a17eab60a231ec
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE" HEAD | wc -l)" -eq 4
          git diff --exit-code "$BASE" HEAD -- public/ supabase/
          test "$(git hash-object public/closet-stylist.js)" = "f2657fffb17a3b2cc606f32b4206a574ef5ddf88"
      - name: Install browser-test only dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: npx playwright install --with-deps chromium webkit
      - name: Real native signed-owner original-photo 2D on Chromium and WebKit 320/390/430
        run: node scripts/test-main1054-native-preview-browser.mjs
      - name: Real native P880 owner-review with no auto save, all mobile viewports
        run: node scripts/test-main1054-dual-review-browser.mjs
      - name: Source-preview auth/DB ref private display revocation + M15 strain NO-GO
        run: |
          node --test research/main-thread-integration-1054/native-2d-display-lease16.test.mjs
          node --test research/main-thread-integration-1054/photographed-3d-evidence-gate15.test.mjs
      - name: Deny permission to release or invent physical phones
        run: |
          node -e "const r=require('./benchmark/main1054-dual-policy-browser/results.json'); if(r.status!=='PASS'||r.total!==54||r.genuineModelsRun!==false||r.physicalPhones!==false||r.hostedCloud!==false||r.autoSaved!==false||r.releaseAuthorized!==false||r.familyAlpha!=='HOLD')process.exit(1);console.log('M16_SIGNED_OWNER_POLICY',r.total)"
          echo "Exact-owner original photo 2D only. Family Alpha HOLD #255. No deploy."
