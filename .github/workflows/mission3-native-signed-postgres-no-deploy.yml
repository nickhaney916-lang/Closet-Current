name: Mission 3 native signed JWT + real disposable PostgreSQL owner RLS — NO DEPLOY
on:
  push:
    branches: [research/mission3-native-signed-postgres-integration-20261110-HOLD]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-signed-two-owner-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mission3-temporary-only
          POSTGRES_DB: mission3_disposable
        options: >-
          --health-cmd "pg_isready -U postgres -d mission3_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: mission3-temporary-only
      PGDATABASE: mission3_disposable
      M3_EPHEMERAL_POSTGRES_URL: postgresql://postgres:mission3-temporary-only@postgres:5432/mission3_disposable
      P147_POSTGRES_URL: postgresql://postgres:mission3-temporary-only@postgres:5432/mission3_disposable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard exact verified Mission 3 parent, no hosted/staging changes and three research paths
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=e9d45020a057697eea8b3a00579518b4654d9a15
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --exit-code "$BASE" HEAD -- public supabase research/signed-two-owner-transport-147 research/two-owner-cloud-rls-recovery-128 package.json package-lock.json
          git diff --name-only "$BASE" HEAD | while read -r p; do
            case "$p" in
              scripts/test-mission3-native-signed-postgres-browser.mjs|research/mission3-native-signed-postgres/REPORT.md|.github/workflows/mission3-native-signed-postgres-no-deploy.yml) ;;
              *) echo "Mission 3 refused unapproved changed path: $p"; exit 1 ;;
            esac
          done
      - name: Install pinned Node browser and real PostgreSQL test dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq postgresql-client
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Apply unchanged actual owner RLS and private Storage SQL to temporary PostgreSQL 17 only
        run: |
          test "$PGHOST" = postgres
          test "$PGDATABASE" = mission3_disposable
          psql -v ON_ERROR_STOP=1 -f research/two-owner-cloud-rls-recovery-128/local-postgres-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -Atc "select (select count(*) from pg_policies where schemaname='public' and tablename='closet_backups')::text||':'||(select count(*) from pg_policies where schemaname='storage' and tablename='objects')::text" | grep -q '^1:4$'
      - name: Independent existing signed-JWT PostgreSQL RLS and private Storage baseline
        run: node scripts/test-signed-jwt-postgres-147.mjs
      - name: Build current actual Closet Current application (no deployment)
        run: node scripts/build.mjs
      - name: Exact current full serial Node regression
        run: node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Genuine Chromium and WebKit 320 390 430 current app real owner RLS and signed JWT
        run: node scripts/test-mission3-native-signed-postgres-browser.mjs benchmark/mission3-native-signed-postgres-browser
      - name: Refuse all external/hosted project access and record local only
        run: |
          node -e "const x=require('./benchmark/mission3-native-signed-postgres-browser/results.json');if(x.cases.length!==6||x.errors.length||!x.claims.realPostgresRLS||x.claims.supabaseHostedAuth||x.claims.supabaseHostedStorage||x.cases.some(c=>!c.realPostgresStorageRLS||!c.realSQLBackupAndRestore||c.hostedProject||c.axeViolations))process.exit(1)"
          echo "PASS: actual native app + local signed RSA + unchanged PostgreSQL RLS; hosted Supabase Auth and Storage NOT certified."
          echo "FAMILY ALPHA HOLD #255: NO DEPLOY."
      - name: Upload synthetic-only local signed SQL and native mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission3-actual-postgres-signed-native-mobile-evidence-HOLD
          path: benchmark/mission3-native-signed-postgres-browser/
          retention-days: 14
