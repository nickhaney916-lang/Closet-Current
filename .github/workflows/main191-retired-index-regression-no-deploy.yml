name: MAIN191 M190 inherited retired-source acceptance no-deploy HOLD
on:
  push:
    branches: [research/main191-m190-inherited-revoked-regression-HOLD]
  pull_request:
    branches: [research/main190-revoked-wardrobe-duplicate-index-HOLD]
    paths:
      - tests/main188-owner-revoked-outfit-preview.test.mjs
      - .github/workflows/main191-retired-index-regression-no-deploy.yml
permissions:
  contents: read
jobs:
  index-contract-and-full-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin exact M190 product and reject all other changed paths
        shell: bash
        run: |
          set -euo pipefail
          BASE=3e1749efad35312026e6c4c26c6cba93dea81e19
          git merge-base --is-ancestor "$BASE" HEAD
          while IFS= read -r f; do
            case "$f" in
              tests/main188-owner-revoked-outfit-preview.test.mjs|.github/workflows/main191-retired-index-regression-no-deploy.yml) ;;
              *) echo "M191 unauthorized changed path: $f"; exit 1 ;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
          test "$(git rev-parse HEAD:public/native-owner-wardrobe-index-167.mjs)" = 65d6f603d6e4e37d01e786c2b8137b919bf71be7
          test "$(git rev-parse HEAD:tests/main190-retired-duplicate-owner-index.test.mjs)" = b21f9ccc42e5f94acfe2928b9e9e20b9a2106186
          test "$(git rev-parse HEAD:public/native-outfit-source-plan-p99.mjs)" = 0d4972a7fddfcfae0dd811765e4a94b962f4b578
          test "$(git rev-parse HEAD:public/native-2d-preview-p99.mjs)" = 62bad171a97030846b0f1bb3bab740dec20ac5e7
          test "$(git rev-parse HEAD:public/app.js)" = 835b4ad1f4a4a7f520aad5afd225134e5ea56e2d
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          node --check public/native-owner-wardrobe-index-167.mjs
          node --check tests/main190-retired-duplicate-owner-index.test.mjs
          node --check tests/main188-owner-revoked-outfit-preview.test.mjs
      - name: Both strict M188 revoked-source and M190 retirement tests
        run: node --test tests/main188-owner-revoked-outfit-preview.test.mjs tests/main190-retired-duplicate-owner-index.test.mjs
      - name: Install pinned Node full-suite dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Build offline and run inherited complete owner/private/recognition tests
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  genuine-native-outfit:
    name: unmodified normal owner JPEG (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      P99_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin actual unmodified P99 browser flow and native app sources
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD:scripts/test-parallel99-normal-app-browser.mjs)" = 9b8c3b37d1d8116e4bf9bc6dbf7ea82e2752433d
          test "$(git rev-parse HEAD:public/app.js)" = 835b4ad1f4a4a7f520aad5afd225134e5ea56e2d
      - name: Install original real browser dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Build real unflagged PWA offline
        run: node scripts/build.mjs
      - name: Real Chromium and WebKit signed-local photo outfit and v3 restore
        shell: bash
        run: |
          set -euo pipefail
          for width in 320 390 430; do
            P99_WIDTH="$width" node scripts/test-parallel99-normal-app-browser.mjs
          done
