name: OWNER APPROVED - Closet Current STAGING owner-login once
# Cloudflare public destinations supported; owner policy must be verified before upload.
on:
  push:
    branches: [deploy/approved-owner-auth-staging-only-20261025]
    paths: ['.github/workflows/family-alpha-owner-auth-staging-once.yml']
permissions:
  contents: read
concurrency:
  group: closet-current-STAGING-OWNER-AUTH-20261025
  cancel-in-progress: false
env:
  STAGE_PIN: '879f1b92fb15f9bc9a7f0429c7ee178f7bbf1373'
  RECOGNITION_PIN: '795ad6637f8d4f782bc99751211b25e8e72a3a7d'
  RECOVERY_PIN: '08ed6ac4a3fc921eae5d5d3df3bd3966429559d2'
  REVIEW_PIN: '1ecac1079e75f1f25dc70a4c712b2448eb87dca8'
  # STAGING-only, public/publishable browser API key; NEVER a secret or service-role credential
  STAGE_PUBLIC_KEY: 'sb_publishable_Tc9eXwg8XTY6rJ0uZBD2VQ_NTGeIUNG'
jobs:
  staging-owner-auth:
    if: "github.event.head_commit.message == 'deploy(stage-auth): approved owner-only login 2026-10-25'"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact isolated reviewed source changes
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/deploy/approved-owner-auth-staging-only-20261025"
          git merge-base --is-ancestor "61746ed699b4c4ea3c5a20c758c62d460e5c7012" HEAD
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          const paths=execFileSync('git',['diff','--name-only','61746ed699b4c4ea3c5a20c758c62d460e5c7012','HEAD'],{encoding:'utf8'}).trim().split(/\n/).sort();
          const expected=[
            '.github/workflows/family-alpha-owner-auth-staging-once.yml',
            'scripts/build-family-alpha-owner-auth-approved.mjs',
            'scripts/verify-owner-only-stage-access.mjs',
            'tests/family-alpha-owner-auth-approved.test.mjs',
            'tests/family-alpha-owner-only-access-proof.test.mjs'
          ].sort();
          if(JSON.stringify(paths)!==JSON.stringify(expected))throw Error('Unreviewed source differences');
          console.log('Source integrity: approved isolated owner staging Auth changes only');
          NODE
      - name: Fetch source-pinned staging, recognition, recovery and review
        run: git fetch --no-tags origin "$STAGE_PIN" "$RECOGNITION_PIN" "$RECOVERY_PIN" "$REVIEW_PIN"
      - name: Assemble full login-disabled source and audit all packaged assets
        run: |
          node scripts/build-family-alpha-staging-auth-hold.mjs
          node scripts/build-family-alpha-recognition-integrated-hold.mjs
          node scripts/build-family-alpha-protected-preview-hold.mjs
          node scripts/audit-family-alpha-stage-assets-hold.mjs
      - name: Run every offline Node regression (synthetic accounts; no actual API call)
        run: node --test tests/*.test.cjs tests/*.test.mjs
      - name: Build separate authorized owner login package after synthetic tests
        run: node scripts/build-family-alpha-owner-auth-approved.mjs
      - name: Verify exact protected staging Auth build with avatar and family release disabled
        run: |
          node --input-type=module <<'NODE'
          import {verifyApprovedOwnerAuth} from './scripts/build-family-alpha-owner-auth-approved.mjs';
          const x=await verifyApprovedOwnerAuth({publicKey:process.env.STAGE_PUBLIC_KEY});
          if(x.releaseGate!=='HOLD'||x.avatarEnabled!==false||
             x.stagingAuthEnabled!==true||x.familyAlphaAuthorized!==false||
             x.stageRoot!=='https://closet-current-staging.pages.dev/'||
             x.qaFiles<60||x.productionUntouched!==true)
            throw Error('Unsafe owner-only stage Auth QA candidate');
          console.log('Real STAGING publishable key present; Auth QA scoped to root; avatar disabled; family release HOLD.');
          NODE
      - name: Verify exact existing staging Pages project and root/wildcard single-owner CF Access policies READ ONLY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {verifyOwnerOnlyStageAccess} from './scripts/verify-owner-only-stage-access.mjs';
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!token)throw Error('Missing existing scoped Cloudflare token');
          const url='https://api.cloudflare.com/client/v4/accounts/43ad9703708ddb191712306bebadcace/pages/projects/closet-current-staging';
          const r=await fetch(url,{headers:{Authorization:'Bearer '+token},redirect:'error'});
          if(!r.ok)throw Error('Could not verify staging Pages project');
          const o=await r.json();
          if(!o.success||o.result?.name!=='closet-current-staging'||o.result.production_branch!=='main')
           throw Error('Wrong Cloudflare Pages project; STOP');
          const p=await verifyOwnerOnlyStageAccess({token});
          if(p.approvedIdentityCount!==1||p.allowPolicies!==2)
           throw Error('Owner-only Access policy not proven; STOP');
          console.log('Staging-only Pages target and one-email policies verified without modification.');
          NODE
      - name: Ensure unauthenticated staging and previous preview are Access challenged BEFORE enabling login
        run: |
          node --input-type=module <<'NODE'
          const hosts=[
           'https://closet-current-staging.pages.dev/',
           'https://closet-current-staging.pages.dev/index.html',
           'https://closet-current-staging.pages.dev/auth.js',
           'https://closet-current-staging.pages.dev/app.js',
           'https://fd096539.closet-current-staging.pages.dev/'
          ];
          for(const uri of hosts){
           const r=await fetch(uri,{method:'GET',redirect:'manual',cache:'no-store'});
           let ok=false;
           try{const u=new URL(r.headers.get('location')||'',uri);
            ok=r.status>=300&&r.status<400&&u.protocol==='https:'&&
             u.hostname.endsWith('.cloudflareaccess.com')&&u.pathname.startsWith('/cdn-cgi/access/');
           }catch{}
           if(!ok)throw Error('Missing CF Access challenge before deploy: '+new URL(uri).pathname);
          }
          console.log('All selected anonymous staging/preview paths still challenge Access.');
          NODE
      - name: OWNER APPROVED - deploy only closet-current-staging login QA (never production)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '43ad9703708ddb191712306bebadcace'
          command: pages deploy dist-family-alpha-OWNER-ONLY-staging-qa --project-name=closet-current-staging --branch=main
      - name: Verify postdeploy guest Access denial to login, backup and config
        run: |
          node --input-type=module <<'NODE'
          for(const path of ['/','/index.html','/auth.js','/app.js','/cloud-backup.js','/alpha-stage-config.js']){
           const url='https://closet-current-staging.pages.dev'+path;
           const r=await fetch(url,{method:'GET',redirect:'manual',cache:'no-store'});
           let ok=false;
           try{const u=new URL(r.headers.get('location')||'',url);
            ok=r.status>=300&&r.status<400&&u.protocol==='https:'&&
             u.hostname.endsWith('.cloudflareaccess.com')&&u.pathname.startsWith('/cdn-cgi/access/');
           }catch{}
           if(!ok)throw Error('Postdeployment CF Access missing from '+path);
          }
          console.log('Owner-only staging login uploaded, guest routes protected; avatar OFF, family release HOLD.');
          NODE
