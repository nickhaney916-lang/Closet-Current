name: Assignment 15 saved outfit management HOLD
on:
  pull_request:
    branches: [research/main1054-unified-retrieval-connectivity-3d-HOLD]
    paths:
      - .github/workflows/assignment-15-saved-outfit-management-HOLD.yml
      - scripts/test-assignment-15-browser.mjs
      - public/outfit-board.js
      - public/index.html
permissions:
  contents: read
jobs:
  browser-and-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: node scripts/build.mjs
      - if: matrix.engine == 'chromium'
        run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
      - run: npx playwright install --with-deps "${{ matrix.engine }}"
      - name: Verify the accepted parent capacity and management gap
        run: |
          BASE=80262e5a900cae4302db84881e2929ffac6c681e
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          git worktree add --detach "$RUNNER_TEMP/assignment-15-parent" "$BASE"
          node scripts/test-assignment-15-browser.mjs
        env:
          A15_ENGINE: ${{ matrix.engine }}
          APP_SOURCE_ROOT: ${{ runner.temp }}/assignment-15-parent
          A15_BASELINE: '1'
          A15_OUT: benchmark/assignment-15/baseline
      - run: node scripts/test-assignment-15-browser.mjs
        env:
          A15_ENGINE: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assignment-15-${{ matrix.engine }}
          path: benchmark/assignment-15/
          if-no-files-found: ignore
