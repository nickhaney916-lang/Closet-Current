name: M1585 original P94 WebKit Worker single Inspector frontend (HOLD)
on:
  push:
    branches: [research/main1054-m1585-original-worker-evidence-contract-HOLD]
permissions:
  contents: read
jobs:
  original-p94-first-attempt:
    name: original-p94-first-attempt-${{ matrix.ordinal }}
    strategy:
      fail-fast: false
      matrix:
        ordinal: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M1585_COHORT_ORDINAL: ${{ matrix.ordinal }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail closed unless original P94 and inspector assets are pinned
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "${{ github.run_attempt }}" = "1"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse HEAD:research/main1054/m287-original-webkit-failing-process-witness.mjs)" = 4439bb9d27220fe0a37402e81899d2bf5bcc5346
          test "$(git diff --name-only 7043a298912a865246a8b43a12f6d31a8161738c HEAD -- public)" = ""
          node --check research/main1054/m1585-original-p94-standalone-webkit.mjs
      - name: Install the identical pinned browser-facing Playwright release
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - name: One fresh process with original SHA-pinned P94, no retries (ordinal ${{ matrix.ordinal }})
        shell: bash
        run: timeout -k 10s 400s node research/main1054/m1585-original-p94-standalone-webkit.mjs
