name: MAIN1054 combined reviewed metadata and closet retrieval HOLD
on:
  pull_request:
    branches: [research/main1054-reviewed-wardrobe-details-HOLD]
    paths:
      - public/app.js
      - public/closet-browser.js
      - tests/p1647-closet-retrieval.test.cjs
      - scripts/p1647-native-retrieval.cjs
      - .github/workflows/main1054-reviewed-closet-retrieval-HOLD.yml
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/main1054-reviewed-closet-retrieval-HOLD'
    strategy:
      fail-fast: false
      matrix:
        check: [regression, chromium, webkit, storage]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable parent and confined retrieval changes
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a9be54beba1d0820e48d74bd8d2e8adf148fbcc6 HEAD
          git diff --name-only a9be54beba1d0820e48d74bd8d2e8adf148fbcc6 HEAD | while IFS= read -r path; do
            case "$path" in
              public/app.js|public/closet-browser.js|tests/p1647-closet-retrieval.test.cjs|scripts/p1647-native-retrieval.cjs|.github/workflows/main1054-reviewed-closet-retrieval-HOLD.yml) ;;
              *) echo "Unexpected path $path"; exit 1 ;;
            esac
          done
          git show a9be54beba1d0820e48d74bd8d2e8adf148fbcc6:public/app.js > "$RUNNER_TEMP/p1647-parent-app.js"
          git show a9be54beba1d0820e48d74bd8d2e8adf148fbcc6:public/closet-browser.js > "$RUNNER_TEMP/p1647-parent-browser.js"
          test "$(git rev-parse HEAD:public/app.js)" = "34905a5c8c187102dd252e4405928ac22dab3d94"
          test "$(git rev-parse HEAD:public/closet-browser.js)" = "cd7cfd1459368e2131388f291ed6d171c7406f2a"
          test "$(git rev-parse HEAD:public/native-reviewed-private-save-167.mjs)" = "3227633c67528e615779065b1dae6f12dbc1e482"
          git log -1 --format='commit %H tree %T'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: node scripts/build.mjs
      - if: matrix.check == 'regression'
        name: Exact parent RED and corrected retrieval controls
        run: |
          set -euo pipefail
          if P1647_APP="$RUNNER_TEMP/p1647-parent-app.js" P1647_BROWSER="$RUNNER_TEMP/p1647-parent-browser.js" node --test tests/p1647-closet-retrieval.test.cjs > "$RUNNER_TEMP/p1647-red.log" 2>&1; then
            cat "$RUNNER_TEMP/p1647-red.log"; exit 1
          fi
          cat "$RUNNER_TEMP/p1647-red.log"
          grep -F 'not ok 1 - season-only' "$RUNNER_TEMP/p1647-red.log"
          node --test tests/p1647-closet-retrieval.test.cjs
          node --test tests/main1054-reviewed-wardrobe-details.test.mjs tests/mission3-reviewed-editor-postcommit-lease.test.cjs
          node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
      - if: matrix.check == 'storage'
        run: npx playwright install --with-deps chromium webkit
      - if: matrix.check == 'storage'
        name: Inherited native reviewed save and wardrobe recovery
        run: |
          set -euo pipefail
          node scripts/test-main1054-reviewed-payload-native.mjs
          CONFLICT_OUT="$RUNNER_TEMP/review-concurrency" node scripts/test-outfit-draft-conflicts-browser.mjs
          node scripts/test-p1600-wardrobe-recovery-browser.mjs
          node scripts/test-mission3-lossless-v4-owner-acceptance-browser.mjs "$RUNNER_TEMP/review-backup"
      - if: matrix.check == 'chromium' || matrix.check == 'webkit'
        run: npx playwright install --with-deps "${{ matrix.check }}"
      - if: matrix.check == 'chromium' || matrix.check == 'webkit'
        name: Native ordinary chooser, standalone filter RED and retrieval GREEN
        env:
          P99_ENGINE: ${{ matrix.check }}
          M58_ENGINE: ${{ matrix.check }}
        run: |
          set -euo pipefail
          cp dist/app.js "$RUNNER_TEMP/p1647-candidate-app.js"
          cp dist/closet-browser.js "$RUNNER_TEMP/p1647-candidate-browser.js"
          trap 'cp "$RUNNER_TEMP/p1647-candidate-app.js" dist/app.js; cp "$RUNNER_TEMP/p1647-candidate-browser.js" dist/closet-browser.js' EXIT
          cp "$RUNNER_TEMP/p1647-parent-app.js" dist/app.js
          cp "$RUNNER_TEMP/p1647-parent-browser.js" dist/closet-browser.js
          P1647_EXPECT_RED=1 P99_WIDTH=390 node scripts/p1647-native-retrieval.cjs
          cp "$RUNNER_TEMP/p1647-candidate-app.js" dist/app.js
          cp "$RUNNER_TEMP/p1647-candidate-browser.js" dist/closet-browser.js
          P1607_AUDIT=1 P99_WIDTH=390 node scripts/test-main1054-reviewed-wardrobe-details-browser.cjs
          for width in 320 390 430; do
            P99_WIDTH="$width" node scripts/p1647-native-retrieval.cjs
            P1607_AUDIT=1 P99_WIDTH="$width" node scripts/test-parallel99-normal-app-browser.mjs
          done
          node scripts/test-parallel94-native-p88-browser.mjs
          node scripts/check-1452-journey-receipts.mjs "$P99_ENGINE"
  acceptance:
    if: always()
    needs: [verify]
    runs-on: ubuntu-24.04
    env:
      RESULT: ${{ needs.verify.result }}
    steps:
      - run: test "$RESULT" = success
