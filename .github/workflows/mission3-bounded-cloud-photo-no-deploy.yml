name: Mission 3 bounded owner-private cloud photos and cutout SHA — NO DEPLOY
on:
  push:
    branches: [research/mission3-bounded-cloud-photo-processing-20261110-HOLD]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-private-photo-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce exact verified Mission 3 camera parent and six path research scope
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=d9ba6e0c96589232c26afc0ef59ca1e963fd0aee
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --exit-code "$BASE" HEAD -- public/auth.js public/app.js supabase public/local-worker.mjs public/recognition-engine.mjs
          git diff --name-only "$BASE" HEAD | while read -r p; do
            case "$p" in
              public/cloud-backup-engine.js|public/cloud-backup.js|tests/mission3-cloud-photo-queue.test.cjs|scripts/test-outfit-backup-compatibility-browser.mjs|research/mission3-cloud-photo/REPORT.md|.github/workflows/mission3-bounded-cloud-photo-no-deploy.yml) ;;
              *) echo "Unexpected Mission 3 cloud-photo path: $p"; exit 1 ;;
            esac
          done
      - name: Install pinned browser/test dependencies without changing app manifest
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Reproduce unbounded parent and omitted cutout / corrupt inline acceptance
        run: |
          git worktree add --detach /tmp/closet-mission3-cloud-photo-parent d9ba6e0c96589232c26afc0ef59ca1e963fd0aee
          CLOUD_SOURCE_ROOT=/tmp/closet-mission3-cloud-photo-parent EXPECT_BASELINE=1 node --test tests/mission3-cloud-photo-queue.test.cjs
      - name: Verify strict mapping bound, cutout SHA and historical migration
        run: node --test tests/mission3-cloud-photo-queue.test.cjs
      - name: Build and full serial regression including cloud owner/session and camera
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Genuine Chromium mobile private backup original and reviewed cutout SHA
        run: |
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos commons-0002
          node scripts/test-outfit-backup-compatibility-browser.mjs benchmark/mission3-bounded-photo-backup
      - name: Genuine Chromium/WebKit 320 390 430 photo capture review and styling
        run: node scripts/test-native-canonical-original-167-browser.mjs
      - name: Genuine Chromium/WebKit mobile storage recovery and accessibility
        run: |
          node scripts/test-family-reliability-mobile.mjs
          node scripts/test-outfit-wardrobe-consistency-browser.mjs
      - name: Retain synthetic photo and mobile browser evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission3-bounded-private-photo-evidence-HOLD
          path: |
            benchmark/mission3-bounded-photo-backup/
            benchmark/native-canonical-closet-style-167/
            benchmark/family-reliability-mobile/
            benchmark/outfit-wardrobe-consistency/
          retention-days: 14
