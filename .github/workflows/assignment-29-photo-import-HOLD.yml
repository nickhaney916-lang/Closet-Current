name: Assignment 29 mobile photo import HOLD
on:
  pull_request:
    branches:
      - research/main1054-unified-backup-revision-HOLD
    paths:
      - .github/workflows/assignment-29-photo-import-HOLD.yml
permissions:
  contents: read
jobs:
  local-photo-import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify accepted parent
        run: test "$(git merge-base HEAD ${{ github.event.pull_request.base.sha }})" = 1e1a0724350001a2ed3b89f48919a8447022d37f
      - name: Install test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Build and run full Node suite
        run: |
          node scripts/build.mjs
          node --test tests/*.cjs tests/*.mjs
      - name: Exercise the real app import and review controls in both browsers
        run: node scripts/test-native-canonical-original-167-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assignment29-mobile-photo-import
          path: benchmark/native-canonical-closet-style-167/
          if-no-files-found: ignore
