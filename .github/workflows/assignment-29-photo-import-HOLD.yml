name: Assignment 29 mobile photo import HOLD
on:
  pull_request:
    branches: [research/assignment-33-weather-context-HOLD]
permissions:
  contents: read
jobs:
  photo-import:
    if: github.head_ref == 'research/main1054-jpeg-exif-fill-byte-HOLD' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/build.mjs
      - run: ASSIGNMENT_29=1 node scripts/test-native-canonical-original-167-browser.mjs
      - run: node scripts/test-capture-proof-01-browser.mjs
      - run: node scripts/test-camera-to-closet-79-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assignment-29-mobile-photo-import
          path: |
            benchmark/assignment-29/
            benchmark/capture-proof-01/results.json
            benchmark/capture-proof-01/failure.json
            benchmark/camera-to-closet-75/results.json
            benchmark/camera-to-closet-75/failure.json
  regression:
    if: github.head_ref == 'research/main1054-jpeg-exif-fill-byte-HOLD' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: node scripts/build.mjs
      - run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
