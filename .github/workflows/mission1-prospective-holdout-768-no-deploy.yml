name: Mission1 prospective sealed human review holdout protocol NO DEPLOY
on:
  push:
    branches:
      - research/mission1-sealed-human-holdout-20261109-HOLD
    paths:
      - research/mission1-sealed-human-holdout-768/prospective-gate.mjs
      - scripts/prospective-holdout-768.mjs
      - tests/mission1-prospective-holdout-768.test.mjs
      - research/mission1-sealed-human-holdout-768/REPORT.md
      - .github/workflows/mission1-prospective-holdout-768-no-deploy.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mission1-prospective-768-HOLD-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-independent-evidence-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact verified P766 parent and only 5 research/test paths, no application changes
        run: |
          set -euo pipefail
          BASE=bd31bccac787f0b7830ed5e405ef5ef101e18100
          git fetch --depth=1 origin "$BASE"
          test "$(git rev-parse "$BASE")" = "$BASE"
          git diff --name-only "$BASE" "$GITHUB_SHA" > /tmp/p768-paths
          cat /tmp/p768-paths
          test "$(wc -l </tmp/p768-paths)" -eq 5
          while read -r file; do
            case "$file" in
              research/mission1-sealed-human-holdout-768/prospective-gate.mjs|scripts/prospective-holdout-768.mjs|tests/mission1-prospective-holdout-768.test.mjs|research/mission1-sealed-human-holdout-768/REPORT.md|.github/workflows/mission1-prospective-holdout-768-no-deploy.yml) ;;
              *) echo "P768 research boundary exceeded: $file"; exit 1 ;;
            esac
          done </tmp/p768-paths
          test -z "$(git diff --name-only "$BASE" "$GITHUB_SHA" -- public supabase)"
          echo M1_SEALED_HOLDOUT_FIVE_PATHS_NO_SHIPPING_CHANGE
      - name: Install unchanged app test dependencies only
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Static checks and reproducible local build
        run: |
          set -euo pipefail
          node --check research/mission1-sealed-human-holdout-768/prospective-gate.mjs
          node --check scripts/prospective-holdout-768.mjs
          node --check tests/mission1-prospective-holdout-768.test.mjs
          node scripts/build.mjs
      - name: Adversarial source/heldout-signature/annotator-adjudication/segmentation tests
        run: node --test tests/mission1-prospective-holdout-768.test.mjs
      - name: Complete existing application and recognition regressions
        run: node --test tests/*.test.cjs tests/*.test.mjs
      - name: Verify repository has no forged real-human benchmark and source exclusion is complete
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {P66_EXPOSED_DIGESTS} from './research/mission1-sealed-human-holdout-768/prospective-gate.mjs';
          const historical=JSON.parse(readFileSync('benchmark/locked-photo-sources.json','utf8'));
          assert.equal(historical.length,59);
          assert.equal(new Set(historical.map(x=>x.sha256)).size,59);
          assert.equal(P66_EXPOSED_DIGESTS.length,6);
          assert.equal(new Set(P66_EXPOSED_DIGESTS).size,6);
          assert.equal(new Set([...historical.map(x=>x.sha256),...P66_EXPOSED_DIGESTS]).size,65);
          console.log('MISSION1_65_PREVIOUSLY_EXPOSED_SOURCE_BYTES_EXCLUDED_PASS');
          console.log('MISSION1_ZERO_NEW_INDEPENDENT_HUMAN_PHOTOS_REGISTERED_NO_RELEASE_PASS');
          NODE
