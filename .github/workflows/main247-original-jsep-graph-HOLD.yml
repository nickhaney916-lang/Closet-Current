name: MAIN247 original SegFormer JSEP native source-verified HOLD
on:
  push:
    branches: [research/main247-original-jsep-segformer-native-HOLD]
permissions:
  contents: read
jobs:
  original-node-source-security:
    name: M247 exact-source + all inherited privacy/security Node
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact parent, protected source and research-only change set
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=a4d4fd8b86db5b496d21d8649cb6b951cd6f0bce
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE" HEAD)" = "$(printf '%s\n' \
            '.github/workflows/main247-original-jsep-graph-HOLD.yml' \
            'scripts/main247-original-jsep-native-contract.mjs' \
            'scripts/test-main247-original-jsep-native-browser.mjs' \
            'tests/main247-original-jsep-native-graph.test.mjs')"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-main243-original-segformer-native-session-browser.mjs)" = fdfb979ca3783cb362cb5eb909612902af0c3b70
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          node --check scripts/main247-original-jsep-native-contract.mjs
          node --check scripts/test-main247-original-jsep-native-browser.mjs
          node --check tests/main247-original-jsep-native-graph.test.mjs
          node --test tests/main247-original-jsep-native-graph.test.mjs
      - name: Install exact original research dependencies
        run: npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Original application offline build and all inherited Node checks
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  actual-original-graph-jsep-browsers:
    name: M247 exact original graph real JSEP native WebKit + Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Proven exact original Worker and native source fixture
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-main243-original-segformer-native-session-browser.mjs)" = fdfb979ca3783cb362cb5eb909612902af0c3b70
          node --test tests/main247-original-jsep-native-graph.test.mjs
      - name: Install pinned public original runtime and native browsers
        run: npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Real ORIGINAL graph JSEP WASM binary and native session (no non-JSEP substitution)
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          for engine in webkit chromium; do
            for arm in baseline pattern_off; do
              echo "::group::M247 true native $engine $arm original JSEP only"
              if M247_ENGINE="$engine" M247_ARM="$arm" node scripts/test-main247-original-jsep-native-browser.mjs; then
                echo "M247_TRUE_ORIGINAL_JSEP_PASS engine=$engine arm=$arm"
              else
                code=$?
                echo "::error::M247_ORIGINAL_JSEP_RED engine=$engine arm=$arm exit=$code"
                failures=$((failures+1))
              fi
              echo "::endgroup::"
            done
          done
          echo "M247_NATIVE_JSEP_FINAL attempts=4 failures=$failures"
          test "$failures" -eq 0
