name: PARALLEL 67 frozen Marqo fashion embeddings vision-only parity — NO DEPLOY
on:
  push:
    branches: [research/parallel67-precomputed-fashion-text-vectors-03-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: parallel67-frozen-text-vectors-03-HOLD-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pinned-P67-02-native-and-safety-HOLD:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact verified full fashion-model parent and SIX isolated research/test paths
        run: |
          set -euo pipefail
          BASE=42dd05cb3378fdb103d16408d4751460054d35e9
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD >/tmp/p67-03-files
          cat /tmp/p67-03-files
          test "$(wc -l </tmp/p67-03-files)" -eq 6
          while IFS= read -r p; do
            case "$p" in
              scripts/parallel67-precompute-fashion-text-03.mjs|scripts/parallel67-run-fashion-vision-only-real16-03.mjs|scripts/parallel67-compare-vision-only-03.mjs|tests/parallel67-precomputed-fashion-text-03.test.mjs|research/parallel67-precomputed-fashion-text-vectors-03/REPORT.md|.github/workflows/parallel67-precomputed-fashion-text-vectors-03-no-deploy.yml) ;;
              *) echo "UNAUTHORIZED ORIGINAL MODEL, OWNER, PRIVATE PHOTO OR DEPLOY PATH: $p"; exit 1 ;;
            esac
          done </tmp/p67-03-files
          test -z "$(git diff --name-only "$BASE" HEAD -- public supabase benchmark)"
          grep -Fq 'FAMILY ALPHA HOLD #255' research/parallel67-precomputed-fashion-text-vectors-03/REPORT.md
          echo P67_03_SIX_FROZEN_RESEARCH_FILES_EXACT_PARENT_NO_DEPLOY
      - name: Install ephemeral native app dependencies only
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Validate exact text source bundle and strict sourcewise rank parity + full native regressions
        run: |
          set -euo pipefail
          node --check scripts/parallel67-precompute-fashion-text-03.mjs
          node --check scripts/parallel67-run-fashion-vision-only-real16-03.mjs
          node --check scripts/parallel67-compare-vision-only-03.mjs
          node --test tests/parallel67-precomputed-fashion-text-03.test.mjs
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  real-q8-text-model-export-only-once-HOLD:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      NODE_OPTIONS: "--max-old-space-size=5120"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ephemeral local inference library, no private images
        run: npm install --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1
      - name: Actually load pinned q8 Marqo text ONNX, encode 47 source-independent clothing labels
        run: |
          set -euo pipefail
          node scripts/parallel67-precompute-fashion-text-03.mjs benchmark/p67-frozen-text
          node --test tests/parallel67-precomputed-fashion-text-03.test.mjs
      - name: Upload only text vector bytes + SHA-256/model revision receipt, no model weights or photos
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: P67-03-FROZEN-47-CLASSES-144384-TEXT-BYTES-NOT-HOSTED
          path: |
            benchmark/p67-frozen-text/fashion-text-vectors.bin
            benchmark/p67-frozen-text/fashion-text-manifest.json
          retention-days: 14
          if-no-files-found: error
  real-q8-vision-ONLY-all-16-public-originals-HOLD:
    runs-on: ubuntu-24.04
    needs: [real-q8-text-model-export-only-once-HOLD]
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      NODE_OPTIONS: "--max-old-space-size=5120"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Get byte-verifiable frozen text embeddings, no live tokenizer/text ONNX
        uses: actions/download-artifact@v4
        with:
          name: P67-03-FROZEN-47-CLASSES-144384-TEXT-BYTES-NOT-HOSTED
          path: benchmark/p67-frozen-text
      - name: Install ephemeral original q8 vision model runtime
        run: npm install --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1
      - name: Download original publisher photos, all 16 SHA-verified; no owner content
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IDS=$(node -e 'process.stdout.write(require("./benchmark/manifest-holdout-16.json").map(x=>x.id).join(","))')
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos "$IDS"
      - name: Real q8 VISION ONNX inference only, no text model loaded or new training
        run: |
          set -euo pipefail
          node scripts/parallel67-run-fashion-vision-only-real16-03.mjs benchmark/p67-vision-only-real16 benchmark/p67-frozen-text
      - name: Upload numeric-only same-publisher-source comparison, no source JPEG or weights
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: P67-03-vision-only-real16-NUMERIC-NOT-BLIND-NO-DEPLOY
          path: benchmark/p67-vision-only-real16/siglip-developer-exposed-real16.json
          retention-days: 14
          if-no-files-found: error
  fail-closed-exact-full-SigLIP-parity-HOLD:
    needs: [real-q8-vision-ONLY-all-16-public-originals-HOLD]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact previously green full Marqo q8 model results, not a guess
        uses: actions/download-artifact@v4
        with:
          run-id: 43151861029
          github-token: ${{ github.token }}
          name: P67-02-Marqo-fashionSigLIP-16-originals-FORCED-TOP1-NUMERIC-NOT-BLIND
          path: benchmark/p67-full-model-green
      - name: Actual frozen vision-only q8 output, same original SHA sources
        uses: actions/download-artifact@v4
        with:
          name: P67-03-vision-only-real16-NUMERIC-NOT-BLIND-NO-DEPLOY
          path: benchmark/p67-vision-only-real16
      - name: Enforce 16/16 identical source categories/subtypes/cosine scores and no auto admission
        run: |
          set -euo pipefail
          node --test tests/parallel67-precomputed-fashion-text-03.test.mjs
          node scripts/parallel67-compare-vision-only-03.mjs benchmark/p67-full-model-green/siglip-developer-exposed-real16.json benchmark/p67-vision-only-real16/siglip-developer-exposed-real16.json benchmark/p67-vision-only-real16/parity.json
      - name: Preserve numeric-only source parity metrics, not a deployment
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: P67-03-16-source-EXACT-q8-vision-only-parity-NUMERIC-HOLD
          path: benchmark/p67-vision-only-real16/parity.json
          retention-days: 14
          if-no-files-found: error
