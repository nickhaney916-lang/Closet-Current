name: MAIN1054 M42 actual licensed source P93 conservative fringe review NO DEPLOY
on:
  push:
    branches: [research/main1054-m42-source-fringe-conservative-trial-HOLD]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  actual-original-source-and-safe-fringe-trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable accepted M41 head and strict research-only source allowlist
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ed4b011f1852e4101799736aa62ed6d9cb557d3a HEAD
          for path in research/main1054-mask41/original-rgb-alpha-audit.mjs scripts/build-main41-real-source-review.mjs research/main1054-handoff40/p89-quality-admission.mjs research/native-3d-05/native-preview-bridge.mjs public/outfit-board.js; do
            test "$(git rev-parse HEAD:$path)" = "$(git rev-parse ed4b011f1852e4101799736aa62ed6d9cb557d3a:$path)"
          done
          git diff --exit-code ed4b011f1852e4101799736aa62ed6d9cb557d3a HEAD -- public/ supabase/ benchmark/ research/main1054-handoff40/ research/native-3d-05/
          git diff --name-only ed4b011f1852e4101799736aa62ed6d9cb557d3a HEAD | while IFS= read -r path; do
            case "$path" in
              research/main1054-mask42/conservative-fringe-trial.mjs|research/main1054-mask42/offline-four-way-review.html|tests/main42-conservative-fringe.test.mjs|scripts/build-main42-source-fringe-comparison.mjs|scripts/test-main42-offline-review.mjs|research/master-consolidation-1054/MILESTONE42.md|.github/workflows/main1054-m42-conservative-fringe-no-deploy.yml) ;;
              *) echo "BLOCKED unexpected M42 changed path $path"; exit 1;;
            esac
          done
          node --check research/main1054-mask42/conservative-fringe-trial.mjs
          node --check tests/main42-conservative-fringe.test.mjs
          node --check scripts/build-main42-source-fringe-comparison.mjs
          node --check scripts/test-main42-offline-review.mjs
      - name: Install pinned local no-deploy development dependencies
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 playwright@1.56.1 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Unchanged default app build, no deploy
        run: node scripts/build.mjs
      - name: New strict synthetic source-adjacent alpha safety tests
        run: node --test tests/main42-conservative-fringe.test.mjs
      - name: Entire inherited no-deploy Node regression
        run: node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Pin P541 source photographer and original P93 alpha operator from exact immutable history
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach .native05-donor-541 df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          git worktree add --detach .m41-p93-donor 690eaeec9ebe911714d6f45fb0d9a59b2ee918d8
          ln -s ../node_modules .native05-donor-541/node_modules
          ln -s ../node_modules .m41-p93-donor/node_modules
          test "$(git rev-parse 690eaeec9ebe911714d6f45fb0d9a59b2ee918d8:research/mission2-p93/alpha-only-source-warm-edge.mjs)" = "$(git -C .m41-p93-donor rev-parse HEAD:research/mission2-p93/alpha-only-source-warm-edge.mjs)"
      - name: Rebuild REAL original public Commons source photograph and original RGB Work47 cutout
        working-directory: .native05-donor-541
        run: |
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node scripts/build-work47-benchmark.mjs
      - name: Recompute exact unchanged licensed P93 candidate and M41 audited real source images
        run: |
          node .m41-p93-donor/scripts/build-mission2-p93-real-source-mask.mjs
          node scripts/build-main41-real-source-review.mjs
      - name: Propose strict one-pixel source-RGB-continuous M42 separate alpha trial on actual dress
        run: node scripts/build-main42-source-fringe-comparison.mjs
      - name: Install Chromium and WebKit source review test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Actual Chromium offline eight-source-image review with no fake acceptance
        run: M42_ENGINE=chromium node scripts/test-main42-offline-review.mjs
      - name: Actual WebKit offline eight-source-image review with no fake acceptance
        run: M42_ENGINE=webkit node scripts/test-main42-offline-review.mjs
      - name: Confirm immutable consumer, cloud, original JPEG/alpha, and avatar scope preserved
        run: |
          git diff --exit-code ed4b011f1852e4101799736aa62ed6d9cb557d3a HEAD -- public/ supabase/ benchmark/ research/native-3d-05/
          test -f benchmark/main42-source-fringe/original-source.jpg
          test -f benchmark/main42-source-fringe/M42-conservative-fringe-UNAPPROVED.png
          test -f benchmark/main42-source-fringe/offline-four-way-review.html
      - name: Retain genuine licensed source and original/P93/M42 visual comparison only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main1054-m42-genuine-original-p93-fringe-TRIAL-NOT-APPROVED
          path: benchmark/main42-source-fringe/
          if-no-files-found: ignore
          retention-days: 14
