name: LABELSYNC66 corrected human garment subtype color saved closet index NO DEPLOY
on:
  push:
    branches:
      - research/corrected-garment-name-index-66-main-20261105-HOLD
  pull_request:
    paths:
      - 'research/corrected-name-index-66/**'
      - 'public/app.js'
      - 'scripts/test-multi-garment-capture-01-browser.mjs'
      - 'scripts/audit-corrected-name-index-66-browser.mjs'
      - 'tests/corrected-name-index-66.test.mjs'
      - '.github/workflows/corrected-name-index-66-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-source-correction-title-search-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce exact successful RECOVERY65 parent and opt-in source edit only
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor fb35cf9d45a63775743ac86522c95d7286523757 HEAD
          git diff --name-only fb35cf9d45a63775743ac86522c95d7286523757 HEAD > /tmp/label66-scope
          while IFS= read -r path; do
            case "$path" in
              research/corrected-name-index-66/*|public/app.js|scripts/test-multi-garment-capture-01-browser.mjs|scripts/audit-corrected-name-index-66-browser.mjs|tests/corrected-name-index-66.test.mjs|.github/workflows/corrected-name-index-66-no-deploy.yml) ;;
              *) echo "BLOCKED production/staging or unrelated edit: $path"; exit 1 ;;
            esac
          done < /tmp/label66-scope
          grep -F "get('correctedName66')==='research'" public/app.js
      - name: Install exact native browser and full Node test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Build and run all inherited and 15 new corrected-title CAS/independent-label Node regression tests
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Original six source-proof camera→manual-closet→outfit→backup native browser cases
        run: node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Six NEW actual original JPEG human-corrected saved title and private V4 restore browser cases
        run: NAME66=1 node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Audit 72 genuine native mobile corrected-name UI before-after PNGs SHA/dimensions
        run: node scripts/audit-corrected-name-index-66-browser.mjs
      - name: Archive sanitized genuine original source identity, correction and 72 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LABELSYNC66-human-corrected-original-JPEG-closet-search-private-V4-HOLD
          path: |
            benchmark/multi-garment-capture-01/acceptance.json
            benchmark/corrected-name-index-66/acceptance.json
            benchmark/corrected-name-index-66/*.png
          if-no-files-found: warn
          retention-days: 14
