name: MAIN198 M193 source protected M183 same-owner session epoch NO DEPLOY HOLD
on:
  push:
    branches: [research/main198-m193-protected-m183-session-epoch-HOLD]
  pull_request:
    branches: [research/main193-protected-m58-m192-source-guard-HOLD]
    paths:
      - .github/workflows/main198-m193-protected-m183-session-epoch-no-deploy.yml
permissions:
  contents: read
jobs:
  inherited-node-and-lease:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: SHA-pin scoped M183 source and refuse unrelated product/hosted edits
        shell: bash
        run: |
          set -euo pipefail
          BASE=921cb4d40f6920520f498972c26a6763ccfabc27
          git merge-base --is-ancestor "$BASE" HEAD
          # M198 exact original M190 retired-index and signed owner's source test.
          test "$(git rev-parse HEAD:public/native-owner-wardrobe-index-167.mjs)" = 674797958366cc976a1a4abc8073087148d22975
          test "$(git rev-parse HEAD:tests/main190-retired-duplicate-owner-index.test.mjs)" = cf9fd805e3a257378ac658b23d50a9a9339daa0c
          test "$(git rev-parse HEAD:public/outfit-capture.js)" = 8d55715ef09e34086d3c401ec38340bfc25f5fe8
          test "$(git rev-parse HEAD:tests/outfit-capture.test.cjs)" = b254c78302136761e1edf336056f8b949832c0ec
          test "$(git rev-parse HEAD:public/app.js)" = 835b4ad1f4a4a7f520aad5afd225134e5ea56e2d
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          # M183: inherited protected CI changes are scoped only to exact
          # donor source/test SHA repins and this named workflow allowlist.
          test "$(git rev-parse HEAD:.github/workflows/main1054-m58-real-p88-worker-no-deploy.yml)" = 14b0f9e09b28068d9d12f829ce5ecad8b3cfc662
          test "$(git rev-parse HEAD:.github/workflows/main173-unflagged-owner-24mp-no-deploy.yml)" = d442beaa482cb11dae1f5b103d32f1204b132a2b
          test "$(git rev-parse HEAD:.github/workflows/main180-unmodified-webkit-firstload-no-deploy.yml)" = 3d435ee3c6fd7a26b4a854fa3af3141a72cbca0d
          test "$(git rev-parse HEAD:.github/workflows/main181-zero-proposal-native-no-deploy.yml)" = cf7731ed4c55bb5e9f96c47f5a13390b4c44ecf2
          git diff --name-only "$BASE" HEAD | while IFS= read -r path; do
            case "$path" in
              public/outfit-capture.js|tests/outfit-capture.test.cjs|.github/workflows/main183-outfit-session-epoch-no-deploy.yml|.github/workflows/main1054-m58-real-p88-worker-no-deploy.yml|.github/workflows/main173-unflagged-owner-24mp-no-deploy.yml|.github/workflows/main180-unmodified-webkit-firstload-no-deploy.yml|.github/workflows/main181-zero-proposal-native-no-deploy.yml|public/native-outfit-source-plan-p99.mjs|public/native-2d-preview-p99.mjs|tests/main187-required-owner-assert-current.test.mjs|tests/main188-owner-revoked-outfit-preview.test.mjs|.github/workflows/main187-required-owner-lease-no-deploy.yml|.github/workflows/main188-owner-revoked-original-preview-no-deploy.yml|.github/workflows/main189-lease-revocation-crossmission-no-deploy.yml|research/master-consolidation-1054/M189-OWNER-REVOCATION-ADMISSION-HOLD.md|public/native-owner-wardrobe-index-167.mjs|tests/main190-retired-duplicate-owner-index.test.mjs|.github/workflows/main192-m189-m190-source-convergence-no-deploy.yml|.github/workflows/main193-m192-protected-m58-candidate-no-deploy.yml|.github/workflows/main198-m193-protected-m183-session-epoch-no-deploy.yml) ;;
              *) echo "M183 unreviewed change: $path"; exit 1 ;;
            esac
          done
          git diff --exit-code "$BASE" HEAD -- public/ ':(exclude)public/native-owner-wardrobe-index-167.mjs' ':(exclude)public/outfit-capture.js' ':(exclude)public/native-outfit-source-plan-p99.mjs' ':(exclude)public/native-2d-preview-p99.mjs' scripts/ supabase/ benchmark/ tests/ ':(exclude)tests/main190-retired-duplicate-owner-index.test.mjs' ':(exclude)tests/outfit-capture.test.cjs' ':(exclude)tests/main187-required-owner-assert-current.test.mjs' ':(exclude)tests/main188-owner-revoked-outfit-preview.test.mjs'
          node --check public/outfit-capture.js
          node --check tests/outfit-capture.test.cjs
      - name: Independent session lease and negative Worker Node cases
        run: node --test tests/outfit-capture.test.cjs
      - name: Install pinned isolated original PWA/test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Offline packaged native PWA and all inherited source tests
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  native-recovery:
    name: actual unflagged PWA original owner recovery (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M181_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert original app session controller and exact M183 native source
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # M198 exact original M190 retired-index and signed owner's source test.
          test "$(git rev-parse HEAD:public/native-owner-wardrobe-index-167.mjs)" = 674797958366cc976a1a4abc8073087148d22975
          test "$(git rev-parse HEAD:tests/main190-retired-duplicate-owner-index.test.mjs)" = cf9fd805e3a257378ac658b23d50a9a9339daa0c
          test "$(git rev-parse HEAD:public/outfit-capture.js)" = 8d55715ef09e34086d3c401ec38340bfc25f5fe8
          test "$(git rev-parse HEAD:public/app.js)" = 835b4ad1f4a4a7f520aad5afd225134e5ea56e2d
          test "$(git rev-parse HEAD:scripts/test-main181-zero-proposal-native-browser.mjs)" = ea1a5bdb7f0617c71695f9b0382afd6ff7d5f089
      - name: Install pinned browser and application runtime
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Build actual signed local user normal PWA without deploy
        run: node scripts/build.mjs
      - name: Genuine Chromium/WebKit built PWA negative recovery at 320 390 430
        shell: bash
        run: |
          set -euo pipefail
          for width in 320 390 430; do
            M181_WIDTH="$width" node scripts/test-main181-zero-proposal-native-browser.mjs
          done
