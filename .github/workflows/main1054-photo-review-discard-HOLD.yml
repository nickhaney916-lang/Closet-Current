name: Main1054 photo review discard acceptance HOLD
on:
  pull_request:
    branches: [research/main1054-photo-review-operation-feedback-HOLD]
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'research/main1054-photo-review-discard-HOLD' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lane: [chromium, webkit, regression]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact correction source, accepted base and isolated acceptance scope
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          base=5e75631b55aca18ad060ca7c074a5e99c3480cfb
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$PR_BASE" = "$base"
          test "$(git rev-parse HEAD^)" = 8f321edcacacf1f24aecf47d3529c40436336b0f
          test "$(git rev-parse HEAD^^)" = 8a3b5a629ce335b5fc5f34ca7bf9c3f192eafb96
          test "$(git rev-parse HEAD^^^^^^^)" = "$base"
          test "$(git rev-parse HEAD:public/app.js)" = d5dec3d6f3e2ed3f0efcf5c4a457e31b27584be7
          printf '%s\n' '.github/workflows/main1054-photo-review-discard-HOLD.yml' 'public/app.js' 'scripts/main1054-photo-review-discard-browser.mjs' > "$RUNNER_TEMP/expected-paths"
          git diff --name-only "$base" HEAD > "$RUNNER_TEMP/actual-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
          git log -1 --format='tested commit %H tree %T'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: node scripts/build.mjs
      - if: matrix.lane == 'regression'
        run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
      - if: matrix.lane != 'regression'
        env:
          BROWSER_ENGINE: ${{ matrix.lane }}
        run: |
          npx playwright install --with-deps "$BROWSER_ENGINE"
          git show 5e75631b55aca18ad060ca7c074a5e99c3480cfb:public/app.js > "$RUNNER_TEMP/base-app.js"
          node scripts/main1054-photo-review-discard-browser.mjs "$BROWSER_ENGINE" "$RUNNER_TEMP/base-app.js" baseline
          node scripts/main1054-photo-review-discard-browser.mjs "$BROWSER_ENGINE"
          node scripts/main1054-photo-review-operation-feedback-browser.mjs "$BROWSER_ENGINE"
          node scripts/main1054-photo-review-remove-pending-browser.mjs "$BROWSER_ENGINE"
          node scripts/main1054-photo-review-pending-browser.mjs "$BROWSER_ENGINE"
          node scripts/main1054-saved-editor-pending-browser.mjs "$BROWSER_ENGINE"
