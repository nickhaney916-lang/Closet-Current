name: 3D-47 source-photo upper-arm fabric volume and seam-preserving mobile QA (DRAFT HOLD NO DEPLOY)
on:
  pull_request:
    paths:
      - 'research/three-d-47/**'
      - 'research/three-d-42/posed-contact.mjs'
      - 'research/three-d-15/outfit-controller.mjs'
      - 'research/three-d-15/showroom.mjs'
      - 'research/three-d-31/photo-jeans-demo.mjs'
      - 'research/three-d-37/second-jeans-demo.mjs'
      - 'tests/three-d-40-independent-silhouettes.test.mjs'
      - 'tests/three-d-39-original-cloth-contact.test.mjs'
      - 'tests/three-d-37-second-models.test.mjs'
      - 'tests/three-d-38-full-outfit-waist.test.mjs'
      - 'scripts/*three-d-47*.mjs'
      - 'tests/three-d-47-upper-arm-volume.test.mjs'
      - '.github/workflows/three-d-47-upper-arm-no-deploy.yml'
permissions:
  contents: read
jobs:
  original-photo-full-outfit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Exact reviewed PR453 parent, no production file changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor fe351f01fe565179e40daa57ec2d7aead15adc99 HEAD
          git diff --name-only fe351f01fe565179e40daa57ec2d7aead15adc99 HEAD | while IFS= read -r f; do
            case "$f" in
              research/three-d-47/*|research/three-d-42/posed-contact.mjs|research/three-d-15/outfit-controller.mjs|research/three-d-15/showroom.mjs|research/three-d-31/photo-jeans-demo.mjs|research/three-d-37/second-jeans-demo.mjs|tests/three-d-47-upper-arm-volume.test.mjs|scripts/*three-d-47*.mjs|.github/workflows/three-d-47-upper-arm-no-deploy.yml) ;;
              *) echo "OUT OF SCOPE: $f"; exit 1 ;;
            esac
          done
      - name: Install pinned no-token original photo development tools
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 three@0.180.0 playwright@1.56.1 three-mesh-bvh@0.9.2
      - name: Reproduce byte-exact two different original photos and source-only alpha proposals
        run: |
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node --test tests/three-d-31-jeans-source.test.mjs tests/three-d-37-source-true.test.mjs
      - name: Restore original CC0 male/female 163-bone models and genuine photographed AJ shirt
        run: |
          git fetch --no-tags origin 53f2ad344dc56a1477e343531c423aed0e66c17d dd6bac3fa9ff640d4f562cf925337440bdb5cf8f 3a572193987cb29389727426136c6eb3ac326783 dfb40889c4c1221fb1833b859e8a11ef38aeb76e
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
      - name: 'Fail-fast: verify detached cap topology, cloth shoulder contour and preserved original sources'
        run: |
          node --test tests/three-d-45-independent-caps.test.mjs
          node --test tests/three-d-46-shoulder-contour.test.mjs
      - name: Original 3D42 independent construction regression + source-true intermediate arm pose unit testing
        run: |
          node --test tests/three-d-42-construction.test.mjs
          node --test tests/three-d-43-intermediate-poses.test.mjs
          node --test tests/three-d-44-shoulder-tailoring.test.mjs
      - name: Existing exact original source/relaxed posed triangle gate
        run: node scripts/audit-three-d-42-triangles.mjs
      - name: All actual source-photo body, shirt and jeans triangles at five sampled original arm poses
        run: node scripts/audit-three-d-43-pose-sweep.mjs
      - name: Source-preserving tailored sleeve five-sampled-pose actual BVH triangle gate
        run: node scripts/audit-three-d-44-shoulder-poses.mjs
      - name: Previous reviewed original independent-cap 28-record BVH regression
        run: node scripts/audit-three-d-45-independent-caps.mjs
      - name: Real independently reprofiled cloth shoulder crest across five sampled male/female poses
        run: |
          node scripts/audit-three-d-46-shoulder-contour.mjs
          node --input-type=module <<'AUDIT'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const path='benchmark/three-d-46/intermediate-triangle-audit.json';
          const out=JSON.parse(readFileSync(path,'utf8'));
          assert.equal(out.studied,28,'Both original rigs × two original denims × five poses + two repeat poses');
          assert.equal(out.records.length,28,'No missing real triangle observations');
          for(const item of out.records)for(const name of ['shirtBody','pantsBody','shirtJeans'])
            assert.equal(item[name].crossingTrianglePairs,0,'Actual independent caps crossed '+name+' in '+JSON.stringify({kind:item.kind,pose:item.pose,source:item.source}));
          assert.equal(out.continuousMotionCollisionCertified,false);
          assert.equal(out.releaseAuthorized,false);
          console.log('THREE_D46_INDEPENDENT_SHOULDER_CONTOUR_AUDIT_REPORT_VERIFIED',out.records.length);
          AUDIT
      - name: '3D47: source-preserved separate upper-arm panels and seam vertices'
        run: node --test tests/three-d-47-upper-arm-volume.test.mjs
      - name: '3D47: fail-closed real skinned cloth/body/jeans triangle crossings, source and intermediate poses'
        run: |
          node scripts/audit-three-d-47-upper-arm-volume.mjs
          node --input-type=module <<'AUDIT47'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const a=JSON.parse(readFileSync('benchmark/three-d-47/intermediate-triangle-audit.json','utf8'));
          assert.equal(a.records.length,28,'Four original figure/denim combinations × seven pose/return steps');
          assert.equal(a.studied,28);
          assert.equal(a.upperArmFabricVolumeTailored,true);
          for(const r of a.records)for(const k of ['shirtBody','pantsBody','shirtJeans'])
            assert.equal(r[k].crossingTrianglePairs,0,'Actual posed garment crossing '+k+' '+r.kind+'/'+r.pose);
          assert.equal(a.continuousMotionCollisionCertified,false);
          assert.equal(a.releaseAuthorized,false);
          AUDIT47
      - name: Four original model+photo combinations tested physically in real skinned source-pose geometry
        run: |
          node --test tests/three-d-41-source-leg-fall.test.mjs
          node --test tests/three-d-40-independent-silhouettes.test.mjs tests/three-d-39-original-cloth-contact.test.mjs
          node --test tests/three-d-38-full-outfit-waist.test.mjs tests/three-d-37-second-models.test.mjs tests/three-d-29-neckline.test.mjs
      - name: Render actual original photographed tailored sleeves before-after at 320/390/430 in 3 views
        run: node scripts/test-three-d-46-shoulder-browser.mjs
      - name: '3D47: genuine WebGL before/after upper-arm fabric photo at 320/390/430'
        run: node scripts/test-three-d-47-upper-arm-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: THREE-D-47-INDEPENDENT-UPPER-ARM-VOLUME-WEBGL-HOLD
          path: |
            benchmark/three-d-47/
            benchmark/three-d-46/
            benchmark/three-d-45/intermediate-triangle-audit.json
            benchmark/three-d-44/intermediate-triangle-audit.json
            benchmark/three-d-43/intermediate-triangle-audit.json
            benchmark/three-d-42/triangle-collisions.json
            benchmark/three-d-37/metrics.json
            benchmark/three-d-37/matte-review.png
            benchmark/three-d-31/metrics.json
          if-no-files-found: warn
