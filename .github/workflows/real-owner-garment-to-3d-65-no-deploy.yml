name: P65 owner-mask-derived 3D contour, real WebGL and mobile evidence NO DEPLOY
on:
  push:
    branches:
      - research/real-owner-garment-to-3d-65-HOLD
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-geometry-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact P189 parent and research-only file scope
        run: |
          set -eu
          BASE=f36560d76aee298ed19f96b740721086008431fc
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git rev-parse "$(git rev-list --reverse "$BASE..HEAD" | head -n1)^")" = "$BASE"
          git diff --name-only "$BASE" HEAD > /tmp/p65-paths
          while IFS= read -r p; do
            case "$p" in
              .github/workflows/real-owner-garment-to-3d-65-no-deploy.yml|research/native-3d-05/native-preview-bridge.mjs|research/native-consumer-board-04/consumer-board-controller.mjs|research/owner-reviewed-cutout-texture-188/private-cutout-texture.mjs|research/real-owner-garment-to-3d-65/owner-mask-geometry.mjs|research/real-owner-garment-to-3d-65/REPORT.md|scripts/install-owner-mask-geometry-65.mjs|scripts/test-native-3d-05-browser.mjs|tests/real-owner-garment-to-3d-65.test.mjs) ;;
              *) echo "P65 refuses out-of-scope file $p"; exit 1 ;;
            esac
          done </tmp/p65-paths
          test "$(wc -l </tmp/p65-paths)" -eq 9
          git diff --exit-code "$BASE" HEAD -- public supabase migrations package.json package-lock.json
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Focused geometry checks, build, and complete regression suite
        run: |
          node --check research/real-owner-garment-to-3d-65/owner-mask-geometry.mjs
          node --check research/owner-reviewed-cutout-texture-188/private-cutout-texture.mjs
          node --check research/native-consumer-board-04/consumer-board-controller.mjs
          node --check research/native-3d-05/native-preview-bridge.mjs
          node --check scripts/install-owner-mask-geometry-65.mjs
          node --check scripts/test-native-3d-05-browser.mjs
          node --test tests/real-owner-garment-to-3d-65.test.mjs tests/owner-cutout-photo-fit-186.test.mjs tests/pre-webgl-owner-cutout-187.test.mjs tests/owner-reviewed-cutout-texture-188.test.mjs tests/owner-mask-fabric-189.test.mjs
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  chromium-webkit-real-owner-contour:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Build pinned 163-bone licensed source donor only
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git worktree add --detach .donor541 df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          git worktree add --detach .p60 6fe5e46b91533a96f3c0d86950ea077cb355c459
          git worktree add --detach .p172 88d2fdb412f84b0498c86bfa17f4b391425e1958
          for name in .donor541 .p60 .p172; do
            git config --global --add safe.directory "$GITHUB_WORKSPACE/$name"
            ln -s ../node_modules "$name/node_modules"
          done
          cd .donor541
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
          cd ..
          cd .p60 && node scripts/install-photo-cloth-realism-164.mjs ../.donor541 && cd ..
          node scripts/install-native-photo-anatomical-fit-171.mjs .donor541
          node scripts/install-native-photo-torso-173.mjs .donor541 .p172
          node scripts/install-source-shoulder-seam-174.mjs .donor541
          node scripts/install-native-original-dress-drape-175.mjs .donor541
          node scripts/install-user-photo-to-anatomical-3d-62.mjs .donor541
          node scripts/install-photographed-garment-shoulder-185.mjs .donor541
          node scripts/install-owner-reviewed-cutout-texture-188.mjs .donor541
          node scripts/build.mjs
      - name: P189 before comparison on genuine 163-bone female and male fixtures
        env:
          PHOTO_FIT171: '1'
          PHOTO_SILHOUETTE62: '1'
          PHOTO_SHOULDER185: '1'
          PHOTO_OWNER_CUTOUT186: '1'
          PHOTO_CUTOUT_PREFLIGHT187: '1'
          PHOTO_OWNER_POSITIVE188: '1'
          PHOTO_OWNER_ALPHA189: '1'
          PHOTO_SILHOUETTE62_BROWSER: ${{ matrix.engine }}
        run: |
          node scripts/test-native-3d-05-browser.mjs
          mkdir -p benchmark/real-owner-garment-to-3d-65/${{ matrix.engine }}
          cp -a benchmark/user-photo-to-anatomical-3d-62/${{ matrix.engine }} benchmark/real-owner-garment-to-3d-65/${{ matrix.engine }}/before
      - name: Install P65 owner-mask contour deformation into disposable donor
        run: node scripts/install-owner-mask-geometry-65.mjs .donor541
      - name: P65 actual selected source mesh, SHA provenance, fallback, 320 390 430
        env:
          PHOTO_FIT171: '1'
          PHOTO_SILHOUETTE62: '1'
          PHOTO_SHOULDER185: '1'
          PHOTO_OWNER_CUTOUT186: '1'
          PHOTO_CUTOUT_PREFLIGHT187: '1'
          PHOTO_OWNER_POSITIVE188: '1'
          PHOTO_OWNER_ALPHA189: '1'
          PHOTO_OWNER_GEOMETRY65: '1'
          PHOTO_SILHOUETTE62_BROWSER: ${{ matrix.engine }}
        run: |
          node scripts/test-native-3d-05-browser.mjs
          cp -a benchmark/user-photo-to-anatomical-3d-62/${{ matrix.engine }} benchmark/real-owner-garment-to-3d-65/${{ matrix.engine }}/after
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const engine=process.env.PHOTO_SILHOUETTE62_BROWSER;
          const result=JSON.parse(readFileSync(`benchmark/real-owner-garment-to-3d-65/${engine}/after/results.json`,'utf8'));
          assert.equal(result.priority,'REAL-OWNER-GARMENT-TO-3D-65');
          assert.deepEqual(result.widths,[320,390,430]);
          assert.equal(result.screens.length,22);
          assert.equal(result.errors.length,0);
          assert.ok(result.evidence.every(row=>row.ownerMaskGeometryChangedActualSkinnedVertices65===true&&
            row.ownerMaskGeometryMovedVertices65>=20&&row.ownerMaskHumanReviewIndependentlyVerified65===false&&
            row.ownerMaskTopologyReconstructed65===false&&row.femaleAndMaleRendered===true&&
            row.bothHumanoidFrontSideRearCaptured===true&&row.outfitUnmodified===true));
          console.log(`P65_${engine.toUpperCase()}_22_REAL_WEBGL_SCREENSHOTS_OWNER_CONTOUR_GEOMETRY_PASS`);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P65-${{ matrix.engine }}-before-after-real-webgl-mobile-screens-HOLD
          path: benchmark/real-owner-garment-to-3d-65/${{ matrix.engine }}/
          retention-days: 14
          if-no-files-found: warn
