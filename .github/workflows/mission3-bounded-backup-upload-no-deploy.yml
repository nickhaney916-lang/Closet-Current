name: Mission 3 bounded original JPEG cloud upload manifest — NO DEPLOY
on:
  push:
    branches: [research/mission3-bounded-backup-jpeg-manifest-20261110-HOLD]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-private-photo-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect exact verified Mission 3 parent and four-path isolated scope
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=6c594ecc02255231365162284b6b6fa80f02ebe4
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --exit-code "$BASE" HEAD -- public/auth.js public/app.js public/photo-import.js public/cloud-backup-engine.js supabase public/local-worker.mjs public/recognition-engine.mjs
          git diff --name-only "$BASE" HEAD | while read -r p; do
            case "$p" in
              public/cloud-backup.js|tests/mission3-bounded-upload-manifest.test.cjs|research/mission3-bounded-backup-upload/REPORT.md|.github/workflows/mission3-bounded-backup-upload-no-deploy.yml) ;;
              *) echo "Unexpected Mission 3 upload manifest path: $p"; exit 1 ;;
            esac
          done
      - name: Install pinned Node and actual browser engines
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Reproduce exact-parent unbounded retained JPEG byte arrays and stale digest behavior
        run: |
          git worktree add --detach /tmp/closet-mission3-upload-parent 6c594ecc02255231365162284b6b6fa80f02ebe4
          CLOUD_SOURCE_ROOT=/tmp/closet-mission3-upload-parent EXPECT_BASELINE=1 node --test tests/mission3-bounded-upload-manifest.test.cjs
      - name: Verify one-JPEG-at-a-time upload, 1000 items, failure recovery and owner revocation
        run: node --test tests/mission3-bounded-upload-manifest.test.cjs
      - name: Build and complete entire serial Node suite
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Genuine Chromium synthetic-owner original/reviewed photo cross-browser cloud restore
        run: |
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos commons-0002
          node scripts/test-outfit-backup-compatibility-browser.mjs benchmark/mission3-bounded-upload-browser
      - name: Genuine Chromium and WebKit mobile photo capture review and owned looks 320 390 430
        run: node scripts/test-native-canonical-original-167-browser.mjs
      - name: Genuine Chromium and WebKit mobile quota recovery and accessibility
        run: node scripts/test-family-reliability-mobile.mjs
      - name: Retain synthetic owner screenshots and browser receipts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission3-bounded-private-upload-evidence-HOLD
          path: |
            benchmark/mission3-bounded-upload-browser/
            benchmark/native-canonical-closet-style-167/
            benchmark/family-reliability-mobile/
          retention-days: 14
