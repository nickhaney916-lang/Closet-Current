name: Mission1 P770 independent blind human mask geometry agreement NO DEPLOY
on:
  push:
    branches:
      - research/mission1-blind-geometry-consensus-770-HOLD
    paths:
      - research/mission1-sealed-human-holdout-768/prospective-gate.mjs
      - tests/mission1-prospective-holdout-768.test.mjs
      - research/mission1-blind-mask-consensus-770/REPORT.md
      - .github/workflows/mission1-blind-mask-consensus-770-no-deploy.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mission1-independent-human-770-HOLD-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-parent-full-node-independent-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact verified P769 parent and exact four narrow research/test paths, no release writes
        run: |
          set -euo pipefail
          BASE=a40e09ad648700d21a3379ef4fe1ce96b9d5e703
          git fetch --depth=1 origin "$BASE"
          test "$(git rev-parse "$BASE")" = "$BASE"
          git diff --name-only "$BASE" "$GITHUB_SHA" > /tmp/p770-paths
          cat /tmp/p770-paths
          test "$(wc -l </tmp/p770-paths)" -eq 4
          while read -r f; do
            case "$f" in
              research/mission1-sealed-human-holdout-768/prospective-gate.mjs|tests/mission1-prospective-holdout-768.test.mjs|research/mission1-blind-mask-consensus-770/REPORT.md|.github/workflows/mission1-blind-mask-consensus-770-no-deploy.yml) ;;
              *) echo "Mission1 P770 refuses scope escape: $f"; exit 1 ;;
            esac
          done </tmp/p770-paths
          test -z "$(git diff --name-only "$BASE" "$GITHUB_SHA" -- public supabase)"
          echo P770_BLIND_REVIEW_FOUR_SCOPED_RESEARCH_FILES_ONLY
      - name: Ephemeral unchanged test libraries only
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Node syntax/reproducible build and all blinded source-review regression tests
        run: |
          set -euo pipefail
          node --check research/mission1-sealed-human-holdout-768/prospective-gate.mjs
          node --check tests/mission1-prospective-holdout-768.test.mjs
          node scripts/build.mjs
          node --test tests/mission1-prospective-holdout-768.test.mjs
      - name: Full application/photo/source/privacy regression suite
        run: |
          set -euo pipefail
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Explicitly prove no new independent real human reviews supplied
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {P66_EXPOSED_DIGESTS} from './research/mission1-sealed-human-holdout-768/prospective-gate.mjs';
          const historical=JSON.parse(readFileSync('benchmark/locked-photo-sources.json','utf8'));
          assert.equal(historical.length,59);
          assert.equal(P66_EXPOSED_DIGESTS.length,6);
          assert.equal(new Set([...historical.map(x=>x.sha256),...P66_EXPOSED_DIGESTS]).size,65);
          console.log('P770_65_PREVIOUSLY_EXPOSED_SOURCES_REMAIN_EXCLUDED_0_NEW_INDEPENDENT_BLIND_HUMAN_LABELS');
          console.log('P770_FAMILY_ALPHA_HOLD_255_NO_DEPLOY');
          NODE
