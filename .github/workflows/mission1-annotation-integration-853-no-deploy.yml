name: Mission 1 P853 offline annotation integration — NO DEPLOY
on:
  push:
    branches: [research/mission1-offline-human-label-integration-853-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mission1-p853-human-annotation-HOLD
  cancel-in-progress: true
jobs:
  exact-parent-research-native-no-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable P852 parent, exact 14 research paths, P79 blob pins, HOLD
        shell: bash
        run: |
          set -euo pipefail
          BASE=3f918e7cb4fffcbb10e455126b5d92a484c0b7c6
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE" HEAD > /tmp/p853-paths
          cat /tmp/p853-paths
          test "$(wc -l </tmp/p853-paths)" -eq 14
          while IFS= read -r p; do
            case "$p" in
              research/parallel79/OPERATOR.md|research/parallel79/REPORT.md|research/parallel79/workstation/app.js|research/parallel79/workstation/display.mjs|research/parallel79/workstation/index.html|research/parallel79/workstation/style.css|scripts/p79-synthetic-fixtures.mjs|scripts/p79-workstation-core.mjs|scripts/p79-workstation.mjs|scripts/test-p79-workstation-browser.mjs|tests/parallel79-workstation.test.mjs|tests/mission1-annotation-release-integration-853.test.mjs|research/mission1-annotation-integration-853/REPORT.md|.github/workflows/mission1-annotation-integration-853-no-deploy.yml) ;;
              *) echo "P853 OUT-OF-SCOPE: $p"; exit 1 ;;
            esac
          done </tmp/p853-paths
          test -z "$(git diff --name-only "$BASE" HEAD -- public supabase benchmark scripts/p75-dataset-core.mjs scripts/p75-review-offline.mjs scripts/m1-release-evidence-851.mjs)"
          test "$(git hash-object scripts/p79-workstation-core.mjs)" = 01babea28288d5d192b6227d366dbdb7a720e9f3
          test "$(git hash-object scripts/p79-workstation.mjs)" = 71fa5d3a3919ed4a9faed8fee2ab346b6a9f4aee
          test "$(git hash-object research/parallel79/workstation/app.js)" = 624fa0f726c5fe6b4a6811de049899fcc0225e07
          grep -Fq 'FAMILY ALPHA HOLD #255 OPEN' research/mission1-annotation-integration-853/REPORT.md
          grep -Fqx 'const reviewFirst836=true;' <(grep '^const reviewFirst836=' public/app.js)
          echo M1_P853_EXACT_SOURCE_AND_NO_DEPLOY_PASS
      - name: Install temporary decoder and test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Cross-gate tests, unchanged builds and full native regression
        run: |
          set -euo pipefail
          node --check scripts/p79-workstation.mjs
          node --check scripts/p79-workstation-core.mjs
          node --check research/parallel79/workstation/app.js
          node --test tests/mission1-annotation-release-integration-853.test.mjs
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          P79_REQUIRE_DECODER=1 node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
          node scripts/m1-release-evidence-851.mjs | tee /tmp/p853-release
          grep -Fq '"status":"BLOCKED"' /tmp/p853-release
          grep -Fq '"shouldLiftFamilyAlphaHold":false' /tmp/p853-release
  synthetic-desktop-browsers-not-physical-phones:
    needs: exact-parent-research-native-no-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium webkit
      - name: P79 independent human annotation workstation browser synthetic QA
        run: node scripts/test-p79-workstation-browser.mjs
      - name: P852 opt-in device recorder DESKTOP engine simulation only
        run: node scripts/test-parallel78-device-browser.mjs
      - name: Inherited camera-to-owner-reviewed private closet safeguards
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node scripts/test-m1-batch-review-850.mjs
          node scripts/test-parallel77-cross-capture-browser.mjs
          node scripts/test-parallel76-color-browser.mjs
          node scripts/test-m1-owner-learning-integration-847.mjs
          node scripts/test-m1-owner-pair-admission-846.mjs
          node scripts/test-m1-review-save-lifecycle-844.mjs parent
          node scripts/test-m1-review-save-lifecycle-844.mjs candidate
          node scripts/test-m1-review-first-default-843.mjs
          node scripts/test-m1-owner-review-editor-839.mjs
  original-public-photo-integrity-not-human-accuracy:
    needs: exact-parent-research-native-no-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      P73_PHOTO_IDS: commons-0003,commons-0014,commons-0021,commons-0033,commons-0049,commons-0060,commons-0077,commons-0082,commons-0094,validation-0001,validation-0019
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3
      - name: Hash lawful public originals, never infer blind photo accuracy
        run: |
          set -euo pipefail
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos "$P73_PHOTO_IDS"
          node scripts/evaluate-parallel73-real-photo.mjs
