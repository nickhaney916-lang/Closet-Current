name: 3D-57 real source photographed elbow fabric responds to approved arm poses and keeps original BVH (DRAFT HOLD NO DEPLOY)
on:
  pull_request:
    paths:
      - 'research/three-d-57/**'
      - 'research/three-d-15/outfit-controller.mjs'
      - 'research/three-d-15/showroom.mjs'
      - 'research/three-d-31/photo-jeans-demo.mjs'
      - 'research/three-d-37/second-jeans-demo.mjs'
      - 'scripts/audit-three-d-47-upper-arm-volume.mjs'
      - 'scripts/test-three-d-57-pose-browser.mjs'
      - 'tests/three-d-57-pose-responsive-original-elbow.test.mjs'
      - '.github/workflows/three-d-57-pose-elbow-no-deploy.yml'
permissions:
  contents: read
jobs:
  real-original-source-pose-responsive-elbow:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Exact source photographed 3D56 parent; verify previous 3D56 dedicated run green before promoting, approved research only
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor cab950fe597fc5503aa135bba639bf19ce670fb6 HEAD
          git diff --name-only cab950fe597fc5503aa135bba639bf19ce670fb6 HEAD | while IFS= read -r f; do
            case "$f" in
              research/three-d-57/*|research/three-d-15/outfit-controller.mjs|research/three-d-15/showroom.mjs|research/three-d-31/photo-jeans-demo.mjs|research/three-d-37/second-jeans-demo.mjs|scripts/audit-three-d-47-upper-arm-volume.mjs|scripts/test-three-d-57-pose-browser.mjs|tests/three-d-57-pose-responsive-original-elbow.test.mjs|.github/workflows/three-d-57-pose-elbow-no-deploy.yml) ;;
              *) echo "BLOCKED outside approved research 3D57: $f"; exit 1 ;;
            esac
          done
      - name: Install pinned original-source local research dependencies; no external inference
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 three@0.180.0 playwright@1.56.1 three-mesh-bvh@0.9.2
      - name: Generate both licensed original photographic denim sources, hash and license verify
        run: |
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node --test tests/three-d-31-jeans-source.test.mjs tests/three-d-37-source-true.test.mjs
      - name: Restore immutable 163-bone original female/male anatomical rigs and original photographed shirt
        run: |
          git fetch --no-tags origin 53f2ad344dc56a1477e343531c423aed0e66c17d dd6bac3fa9ff640d4f562cf925337440bdb5cf8f 3a572193987cb29389727426136c6eb3ac326783 dfb40889c4c1221fb1833b859e8a11ef38aeb76e
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
      - name: Guard existing independent caps, real bilateral seams, collar and proven neutral rear hem
        run: |
          node --test tests/three-d-47-upper-arm-volume.test.mjs
          node --test tests/three-d-48-cap-seam-witness.test.mjs
          node --test tests/three-d-48-collar-roll.test.mjs
          node --test tests/three-d-53-rear-fabric-relief.test.mjs
      - name: Preserve all original source sewn elbow folds, then prove true physically pose-responsive elbows female/male and both original denims
        run: |
          node --test tests/three-d-54-shoulder-sleeve-rounding.test.mjs
          node --test tests/three-d-55-source-sleeve-hang.test.mjs
          node --test tests/three-d-56-original-elbow-creases.test.mjs
          node --test tests/three-d-57-pose-responsive-original-elbow.test.mjs
      - name: Independently audit all original source skinned shirt-body denim 28 actual posed BVH triangle samples with true photo pose-responsive elbow fabric after original skinned pose contact
        run: |
          node scripts/audit-three-d-47-upper-arm-volume.mjs --dynamic57
          node --input-type=module <<'AUDIT'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const a=JSON.parse(readFileSync('benchmark/three-d-57/intermediate-triangle-audit.json','utf8'));
          assert.equal(a.naturalShoulderSleeveTransition,true);
          assert.equal(a.sourceMeasuredSleeveHang,true);
          assert.equal(a.sourceElbowClothCreases,true);
          assert.equal(a.poseResponsiveElbowCloth,true);
          assert.equal(a.sourceNeutralRearFabricRelief,true);
          assert.equal(a.records.length,28,'Both real anatomical rigs times both original licensed jean sources times seven samples');
          for(const r of a.records)for(const key of ['shirtBody','pantsBody','shirtJeans'])
            assert.equal(r[key].crossingTrianglePairs,0,'True original source posed fabric crossing '+r.kind+'/'+r.source+'/'+r.pose+'/'+key);
          assert.equal(a.signedVolumeContainmentCertified,false);
          assert.equal(a.releaseAuthorized,false);
          AUDIT
      - name: Genuine mobile original photograph 320 390 430 front side back before/after pose-responsive original photographed elbow A/B QA
        run: node scripts/test-three-d-57-pose-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: THREE-D-57-ORIGINAL-PHOTO-POSE-RESPONSIVE-ELBOW-MOBILE-QA-HOLD
          path: |
            benchmark/three-d-57/
          if-no-files-found: warn
