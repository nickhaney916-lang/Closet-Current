name: Family Alpha session-bound photo fit preview, no persistence or deploy (HOLD)
on:
  pull_request:
    paths:
      - 'research/family-alpha-40/**'
      - 'scripts/build-family-alpha-40-session-fit-hold.mjs'
      - 'scripts/test-family-alpha-40-browser.mjs'
      - 'tests/integration/family-alpha-40-session-fit-hold.test.mjs'
      - 'docs/FAMILY-ALPHA-40-SESSION-FIT-HOLD.md'
      - '.github/workflows/family-alpha-40-session-fit-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-originals-atomic-and-session:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Fetch exact proven ancestor inputs
        run: |
          git fetch --no-tags origin 0fb6ab04ab79c36d449acee21aaaf4318871d647 879f1b92fb15f9bc9a7f0429c7ee178f7bbf1373 795ad6637f8d4f782bc99751211b25e8e72a3a7d 08ed6ac4a3fc921eae5d5d3df3bd3966429559d2 1ecac1079e75f1f25dc70a4c712b2448eb87dca8 d0ff131a4e5617e1a3f4fcfb40d00602fdce9833 68bed0c0f0f25538d0d5a00fbaf9aa34d80b8663 97397e80a7cf66e5e656c5b74c924a51e50f0f6f 44f288dfdcfa02ec5b2cf89a7c79c08cfcaa3584 e75cd4689356ae468a88504ddb25df4b4ff6cb70 c86f48f0119329e4001002304e2dfe480815b099 100ffc194793470c871f2b0c6092bc59f1c583b8 77d9f5b83eae475cd8d5d35593c1dc9c2e6bf02f
      - name: Rebuild full inherited staging-safe styling and atomically saved 2D human without deployment
        run: |
          node scripts/build-family-alpha-staging-auth-hold.mjs
          node scripts/build-family-alpha-recognition-integrated-hold.mjs
          node scripts/build-family-alpha-protected-preview-hold.mjs
          node scripts/build-family-alpha-29-hold.mjs
          node scripts/build-family-alpha-31-hold.mjs
          node scripts/build-family-alpha-refined-avatar-integration-hold.mjs
          node scripts/build-family-alpha-34-storage-hold.mjs
          node scripts/build-family-alpha-35-visual-repair-hold.mjs
          node scripts/build-family-alpha-36-rigid-fit-hold.mjs
          node scripts/build-family-alpha-full-stage-routing-hold.mjs
          node scripts/build-family-alpha-40-session-fit-hold.mjs
      - name: Run original wardrobe and source-matched fit/atomic recovery suites
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund fake-indexeddb@6.2.4
          node --test tests/*.test.cjs tests/*.test.mjs tests/integration/family-alpha-refined-avatar-integration-hold.test.mjs tests/integration/family-alpha-29-store.test.mjs tests/integration/family-alpha-34-storage.test.mjs tests/integration/family-alpha-35-visual-repair-hold.test.mjs tests/integration/family-alpha-36-rigid-fit-hold.test.mjs tests/integration/family-alpha-full-stage-routing-hold.test.mjs tests/integration/family-alpha-40-session-fit-hold.test.mjs
          node --test tests/integration/family-alpha-assignment22-integrity.test.cjs tests/integration/family-alpha-worker-recovery.test.mjs
      - name: Refuse any release or source image/session persistence claim
        run: |
          node --input-type=module -e "import {assert40HOLD} from './scripts/build-family-alpha-40-session-fit-hold.mjs';const x=await assert40HOLD();if(x.releaseGate!=='HOLD'||!x.memoryOnly||x.fitPreferencesCloudSaved||x.fitPreferencesIndexedDbSaved||x.stagingDeployed||x.ownerVisualApproved)process.exit(1);console.log('HOLD: per-account per-image memory only, no persistent fit or staging connection');"
  compiled-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Fetch exact proven ancestor inputs
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin 0fb6ab04ab79c36d449acee21aaaf4318871d647 879f1b92fb15f9bc9a7f0429c7ee178f7bbf1373 795ad6637f8d4f782bc99751211b25e8e72a3a7d 08ed6ac4a3fc921eae5d5d3df3bd3966429559d2 1ecac1079e75f1f25dc70a4c712b2448eb87dca8 d0ff131a4e5617e1a3f4fcfb40d00602fdce9833 68bed0c0f0f25538d0d5a00fbaf9aa34d80b8663 97397e80a7cf66e5e656c5b74c924a51e50f0f6f 44f288dfdcfa02ec5b2cf89a7c79c08cfcaa3584 e75cd4689356ae468a88504ddb25df4b4ff6cb70 c86f48f0119329e4001002304e2dfe480815b099 100ffc194793470c871f2b0c6092bc59f1c583b8 77d9f5b83eae475cd8d5d35593c1dc9c2e6bf02f
      - name: Rebuild full disabled family candidate + per-session alignment
        run: |
          node scripts/build-family-alpha-staging-auth-hold.mjs
          node scripts/build-family-alpha-recognition-integrated-hold.mjs
          node scripts/build-family-alpha-protected-preview-hold.mjs
          node scripts/build-family-alpha-29-hold.mjs
          node scripts/build-family-alpha-31-hold.mjs
          node scripts/build-family-alpha-refined-avatar-integration-hold.mjs
          node scripts/build-family-alpha-34-storage-hold.mjs
          node scripts/build-family-alpha-35-visual-repair-hold.mjs
          node scripts/build-family-alpha-36-rigid-fit-hold.mjs
          node scripts/build-family-alpha-full-stage-routing-hold.mjs
          node scripts/build-family-alpha-40-session-fit-hold.mjs
      - name: Install pinned test browser and simulated IndexedDB
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 fake-indexeddb@6.2.4
      - name: Full synthetic phone journey re-review same source plus owner/PNG-scoped fitting, swap, rollback
        run: node scripts/test-family-alpha-40-browser.mjs
      - name: Preserve synthetic-only screenshots, never real-family data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-alpha-40-scoped-manual-fit-SYNTHETIC-HOLD
          path: benchmark/family-alpha-40/
          retention-days: 7
          if-no-files-found: warn
