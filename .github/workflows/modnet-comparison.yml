name: Experimental MODNet six-photo comparison
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run-modnet-comparison.mjs'
      - 'scripts/build-raw-alpha-review.mjs'
      - 'scripts/build-threshold128-edge-review.mjs'
      - 'scripts/build-edge-background-stress.mjs'
      - 'scripts/build-threshold-sensitivity-review.mjs'
      - 'scripts/build-annotation-reference-pack.mjs'
      - 'benchmark/shadow-annotation-validator.mjs'
      - 'benchmark/annotate-shadow-polygons.html'
      - 'scripts/test-shadow-outline-editor.mjs'
      - 'tests/shadow-annotation-validator.test.mjs'
      - 'scripts/check-shadow-outline-readiness.mjs'
      - 'benchmark/score-reviewed-shadow-cleanup.mjs'
      - 'tests/score-reviewed-shadow-cleanup.test.mjs'
      - 'scripts/compare-garment-models.mjs'
      - 'scripts/build-three-way-visual.mjs'
      - 'scripts/build-four-way-model-review.mjs'
      - 'benchmark/modnet-promotion-gate.mjs'
      - 'tests/modnet-promotion-gate.test.mjs'
      - 'tests/modnet-sharp128-baseline.test.mjs'
      - 'benchmark/modnet-sharp128-baseline-decision.json'
      - 'scripts/build-footwear-disagreement-visual.mjs'
      - 'benchmark/footwear-shadow-candidates.mjs'
      - 'benchmark/lower-footwear-disagreement.mjs'
      - 'tests/lower-footwear-disagreement.test.mjs tests/validate-visual-feedback.test.mjs'
      - 'scripts/build-footwear-shadow-overlay.mjs'
      - 'scripts/build-footwear-shadow-before-after.mjs'
      - 'scripts/build-soft-edge-comparison.mjs'
      - 'scripts/build-boundary-defect-review.mjs'
      - 'scripts/build-selective-boundary-proposal.mjs'
      - 'scripts/build-post-cleanup-check.mjs'
      - 'scripts/build-multiscale-contamination-review.mjs'
      - 'scripts/build-lower-edge-zoom.mjs'
      - 'scripts/build-detached-component-review.mjs'
      - 'scripts/footwear-edge-contrast.mjs'
      - 'tests/footwear-shadow-candidates.test.mjs'
      - 'tests/compare-garment-models.test.mjs'
      - 'scripts/build-segmentation-review-pack.mjs'
      - 'benchmark/FOOTWEAR-OUTLINE-REVIEW.txt'
      - 'scripts/test-mobile-garment-review.mjs'
      - 'scripts/validate-visual-feedback.mjs'
      - 'tests/validate-visual-feedback.test.mjs'
      - 'benchmark/mobile-review-template.html'
      - 'benchmark/propose-island-cleanup.mjs'
      - 'benchmark/foreground-geometry.mjs'
      - 'benchmark/border-connected-foreground.mjs'
      - 'tests/border-connected-foreground.test.mjs'
      - 'tests/foreground-geometry.test.mjs'
      - 'tests/propose-island-cleanup.test.mjs'
      - 'benchmark/annotate-garment.html'
      - 'benchmark/modnet-boundary-report.mjs'
      - 'tests/modnet-boundary-report.test.mjs'
      - '.github/workflows/modnet-comparison.yml'
permissions:
  contents: read
jobs:
  experimental:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Validate threshold boundary analysis
        run: node --test tests/modnet-boundary-report.test.mjs tests/propose-island-cleanup.test.mjs tests/foreground-geometry.test.mjs tests/border-connected-foreground.test.mjs tests/compare-garment-models.test.mjs tests/footwear-shadow-candidates.test.mjs tests/lower-footwear-disagreement.test.mjs
      - name: Validate MODNet fail-closed promotion criteria
        run: |
          node --test tests/modnet-promotion-gate.test.mjs
          node benchmark/modnet-promotion-gate.mjs
      - name: Enforce user-selected sharp MODNet 128 benchmark baseline
        run: node --test tests/modnet-sharp128-baseline.test.mjs
      - name: Check independent shadow annotation schema
        run: |
          node --test tests/shadow-annotation-validator.test.mjs
          node benchmark/shadow-annotation-validator.mjs
          node scripts/check-shadow-outline-readiness.mjs
          node --test tests/score-reviewed-shadow-cleanup.test.mjs
      - name: Download and verify source photographs
        run: node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos commons-0035,commons-0049,commons-0053,commons-0065,commons-0079,commons-0094
      - name: Smoke-test polygon editor with verified original photo
        run: node scripts/test-shadow-outline-editor.mjs
      - name: Generate clean original-photo annotation reference pack
        run: node scripts/build-annotation-reference-pack.mjs benchmark/annotation-reference-pack
      - name: Verify annotation reference images
        run: |
          for id in commons-0035 commons-0049 commons-0053 commons-0065 commons-0079 commons-0094; do
            test -s "benchmark/annotation-reference-pack/$id-annotation-source.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-six-garment-annotation-sources
          path: benchmark/annotation-reference-pack/
          retention-days: 14
      - name: Generate experimental MODNet masks
        run: node scripts/run-modnet-comparison.mjs benchmark/modnet-predictions
      - name: Compare native MODNet alpha versus binary segmentation
        run: node scripts/build-raw-alpha-review.mjs benchmark/raw-alpha-review
      - name: Verify original alpha reviews for six garments
        run: |
          for id in commons-0035 commons-0049 commons-0053 commons-0065 commons-0079 commons-0094; do
            test -s "benchmark/modnet-predictions/$id.modnet-alpha.png"
            test -s "benchmark/raw-alpha-review/$id-raw-alpha-review.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-six-garment-native-alpha-review
          path: benchmark/raw-alpha-review/
          retention-days: 14
      - name: Generate threshold-128 sharp and feathered cutout review
        run: node scripts/build-threshold128-edge-review.mjs benchmark/threshold128-edge-review
      - name: Confirm all six threshold review images
        run: |
          for id in commons-0035 commons-0049 commons-0053 commons-0065 commons-0079 commons-0094; do
            test -s "benchmark/threshold128-edge-review/$id-threshold128-review.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-modnet-threshold128-edge-review
          path: benchmark/threshold128-edge-review/
          retention-days: 14
      - name: Stress-test sharp and softened edges on contrasting backgrounds
        run: node scripts/build-edge-background-stress.mjs benchmark/edge-background-stress
      - name: Verify contrasting-background reviews
        run: |
          for id in commons-0035 commons-0049 commons-0053 commons-0065 commons-0079 commons-0094; do
            test -s "benchmark/edge-background-stress/$id-edge-background-stress.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-modnet-edge-background-stress
          path: benchmark/edge-background-stress/
          retention-days: 14
      - name: Compare sharp baseline against stricter alpha thresholds
        run: node scripts/build-threshold-sensitivity-review.mjs benchmark/threshold-sensitivity-review
      - name: Verify threshold sensitivity images
        run: |
          for id in commons-0035 commons-0049 commons-0053 commons-0065 commons-0079 commons-0094; do
            test -s "benchmark/threshold-sensitivity-review/$id-threshold-sensitivity.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-modnet-threshold-sensitivity
          path: benchmark/threshold-sensitivity-review/
          retention-days: 14
      - name: Generate experimental SegFormer masks for paired comparison
        run: node scripts/run-real-segmentation-benchmark.mjs benchmark/segmentation-predictions
      - name: Compare model disagreement without claiming accuracy
        run: node scripts/compare-garment-models.mjs benchmark/segmentation-predictions benchmark/modnet-predictions benchmark/model-disagreements
      - name: Build three-way visual comparison for jacket and footwear
        run: node scripts/build-three-way-visual.mjs benchmark/model-visual-comparison
      - name: Build six-garment four-way model review
        run: node scripts/build-four-way-model-review.mjs benchmark/four-way-model-review
      - name: Verify all model review photographs
        run: |
          for id in commons-0035 commons-0049 commons-0053 commons-0065 commons-0079 commons-0094; do
            test -s "benchmark/four-way-model-review/$id-four-way.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-six-garment-four-way-model-review
          path: benchmark/four-way-model-review/
          retention-days: 14
      - name: Build footwear-only disagreement visualizations
        run: node scripts/build-footwear-disagreement-visual.mjs benchmark/footwear-disagreement-visuals
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-footwear-disagreement-visuals
          path: benchmark/footwear-disagreement-visuals/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-three-way-visuals
          path: benchmark/model-visual-comparison/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-model-disagreement
          path: benchmark/model-disagreements/
          retention-days: 14
      - name: Visualize suspected shoe-shadow pixels on source photos
        run: node scripts/build-footwear-shadow-overlay.mjs benchmark/footwear-shadow-review
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-footwear-shadow-overlays
          path: benchmark/footwear-shadow-review/
          retention-days: 14
      - name: Generate six-garment native edge inspections and footwear shadow comparisons
        run: node scripts/build-footwear-shadow-before-after.mjs benchmark/footwear-shadow-before-after
      - name: Verify shoe and boot native-resolution evidence
        run: |
          test -s benchmark/footwear-shadow-before-after/commons-0035-native-edges-2x.png
          test -s benchmark/footwear-shadow-before-after/commons-0049-native-edges-2x.png
          test -s benchmark/footwear-shadow-before-after/commons-0053-native-edges-2x.png
          test -s benchmark/footwear-shadow-before-after/commons-0065-native-edges-2x.png
          test -s benchmark/footwear-shadow-before-after/commons-0079-native-edges-2x.png
          test -s benchmark/footwear-shadow-before-after/commons-0094-native-edges-2x.png
          test -s benchmark/footwear-shadow-before-after/commons-0079-shadow-before-after.png
          test -s benchmark/footwear-shadow-before-after/commons-0094-shadow-before-after.png
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-six-garment-native-edge-and-footwear-shadow
          path: benchmark/footwear-shadow-before-after/
          retention-days: 14
      - name: Measure shoe-edge contrast without mask modification
        run: node scripts/footwear-edge-contrast.mjs benchmark/footwear-edge-contrast
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-footwear-edge-contrast
          path: benchmark/footwear-edge-contrast/
          retention-days: 14
      - name: Generate three-way edge and shadow candidate comparisons
        run: node scripts/build-soft-edge-comparison.mjs benchmark/soft-edge-comparison
      - name: Verify all six soft edge comparison PNGs
        run: |
          for id in commons-0035 commons-0049 commons-0053 commons-0065 commons-0079 commons-0094; do
            test -s "benchmark/soft-edge-comparison/$id-hard-soft-shadow.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-six-garment-soft-edge-shadow-comparisons
          path: benchmark/soft-edge-comparison/
          retention-days: 14
      - name: Review side and bottom boundary contamination across six garments
        run: node scripts/build-boundary-defect-review.mjs benchmark/boundary-defect-review
      - name: Confirm all boundary review PNGs generated
        run: |
          for id in commons-0035 commons-0049 commons-0053 commons-0065 commons-0079 commons-0094; do
            test -s "benchmark/boundary-defect-review/$id-boundary-risks.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-six-garment-boundary-defect-review
          path: benchmark/boundary-defect-review/
          retention-days: 14
      - name: Generate six-garment selective cleanup proposal images
        run: node scripts/build-selective-boundary-proposal.mjs benchmark/selective-boundary-proposals
      - name: Verify selective cleanup previews exist
        run: |
          for id in commons-0035 commons-0049 commons-0053 commons-0065 commons-0079 commons-0094; do
            test -s "benchmark/selective-boundary-proposals/$id-selective-candidate.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-six-garment-selective-boundary-candidates
          path: benchmark/selective-boundary-proposals/
          retention-days: 14
      - name: Post-check residual boundaries and matte blending
        run: node scripts/build-post-cleanup-check.mjs benchmark/post-cleanup-check
      - name: Verify six post-check images
        run: |
          for id in commons-0035 commons-0049 commons-0053 commons-0065 commons-0079 commons-0094; do
            test -s "benchmark/post-cleanup-check/$id-postcheck.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-six-garment-post-cleanup-check
          path: benchmark/post-cleanup-check/
          retention-days: 14
      - name: Analyze wider shadows and attached background at several distances
        run: node scripts/build-multiscale-contamination-review.mjs benchmark/multiscale-contamination
      - name: Verify six multiscale review images
        run: |
          for id in commons-0035 commons-0049 commons-0053 commons-0065 commons-0079 commons-0094; do
            test -s "benchmark/multiscale-contamination/$id-multiscale.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-six-garment-multiscale-contamination
          path: benchmark/multiscale-contamination/
          retention-days: 14
      - name: Generate enlarged lower-edge verification images
        run: node scripts/build-lower-edge-zoom.mjs benchmark/multiscale-contamination benchmark/lower-edge-zoom
      - name: Verify lower-edge details exist
        run: |
          for id in commons-0035 commons-0049 commons-0053 commons-0065 commons-0079 commons-0094; do
            test -s "benchmark/lower-edge-zoom/$id-lower-edge-zoom.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-lower-edge-zoom-review
          path: benchmark/lower-edge-zoom/
          retention-days: 14
      - name: Review detached foreground components without deleting fabric
        run: node scripts/build-detached-component-review.mjs benchmark/detached-component-review
      - name: Verify all component review previews
        run: |
          for id in commons-0035 commons-0049 commons-0053 commons-0065 commons-0079 commons-0094; do
            test -s "benchmark/detached-component-review/$id-component-review.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-six-garment-detached-component-review
          path: benchmark/detached-component-review/
          retention-days: 14
      - name: Prepare six-photo human review pack
        run: node scripts/build-segmentation-review-pack.mjs
      - name: Verify footwear reviewer instructions included
        run: |
          test -s benchmark/review-pack/FOOTWEAR-OUTLINE-REVIEW.txt
          test -s benchmark/review-pack/START-FOOTWEAR-REVIEW.html
          test -s benchmark/review-pack/OPEN-IMAGES-ON-PHONE/commons-0079-comparison.png
          test -s benchmark/review-pack/OPEN-IMAGES-ON-PHONE/commons-0094-comparison.png
          grep -q 'commons-0079' benchmark/review-pack/START-FOOTWEAR-REVIEW.html
          grep -q 'commons-0094' benchmark/review-pack/START-FOOTWEAR-REVIEW.html
      - name: Verify one-tap mobile review screen
        run: node scripts/test-mobile-garment-review.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: segmentation-human-review-pack
          path: benchmark/review-pack/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-modnet-masks
          path: benchmark/modnet-predictions/
          retention-days: 14
