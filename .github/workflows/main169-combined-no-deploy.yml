            case "$path" in
              research/multi-garment-capture-01/review-ui.mjs|research/parallel96-highres/LICENSED_CAMERA_ORIGINAL_FIXTURE.md|research/parallel96-highres/source-derivative-intake96.mjs|scripts/test-parallel96-native-highres-browser.mjs|tests/parallel96-highres-source-derivative.test.mjs|benchmark/fixtures/commons-artist-cowrie-original-4000x6000-cc-by-sa-4.0.jpg|.github/workflows/main169-combined-no-deploy.yml) ;;
