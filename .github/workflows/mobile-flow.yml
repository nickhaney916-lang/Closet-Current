name: Mobile capture and closet persistence flow
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/run-mobile-flow.mjs'
      - '.github/workflows/mobile-flow.yml'
      - 'scripts/download-reviewed-photos.mjs'
      - 'benchmark/locked-photo-sources.json'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run-mobile-flow.mjs'
      - '.github/workflows/mobile-flow.yml'
      - '.github/workflows/reviewed-photo-baseline.yml'
      - 'scripts/audit-100-photo-results.mjs'
      - 'scripts/assemble-reviewed-baseline.mjs'
      - 'tests/reviewed-photo-audit.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser and licensed camera fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos commons-0001,commons-0002,commons-0003,commons-0021,commons-0024,commons-0033,commons-0049,commons-0060,commons-0079,commons-0094
          mkdir -p benchmark/photos benchmark/mobile-flow
          cp benchmark/locked-photo-sources.json benchmark/mobile-flow/
          ffmpeg -loglevel error -loop 1 -i benchmark/photos/commons-0001.jpg -vf 'scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:black' -r 10 -t 2 -pix_fmt yuv420p -f yuv4mpegpipe benchmark/mobile-camera.y4m
      - name: Check benchmark audit regression tests
        run: node --test tests/reviewed-photo-audit.test.mjs
      - name: Build and verify touch viewport flow with real worker
        run: |
          node scripts/build.mjs
          node scripts/run-mobile-flow.mjs benchmark/mobile-flow
      - name: Assemble and verify the reviewed 59-photo set
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p benchmark/combined-59
          node scripts/assemble-reviewed-baseline.mjs benchmark/combined-59/manifest.json benchmark/manifest-reviewed-32.json benchmark/manifest-holdout-16.json benchmark/manifest-fresh-11.json
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json
          node scripts/download-reviewed-photos.mjs benchmark/manifest-fresh-11.json
          node scripts/validate-100-photo-set.mjs benchmark/combined-59/manifest.json benchmark/photos 59 > benchmark/combined-59/validation.json
      - name: Run real 59-photo browser recognition
        if: success() || failure()
        run: |
          if [ ! -f benchmark/combined-59/manifest.json ]; then
            echo "::error::Reviewed benchmark manifest was not assembled"
            exit 1
          fi
          node scripts/run-browser-photo-benchmark.mjs benchmark/combined-59/manifest.json benchmark/combined-59/results
      - name: Evaluate any available recognition predictions
        if: always()
        run: |
          if [ -f benchmark/combined-59/manifest.json ] && [ -f benchmark/combined-59/results/results.json ]; then
            node scripts/evaluate-recognition-benchmark.mjs benchmark/combined-59/manifest.json benchmark/combined-59/results/results.json > benchmark/combined-59/evaluation.json
            node scripts/report-cross-category-evidence.mjs benchmark/combined-59/manifest.json benchmark/combined-59/results/results.json benchmark/combined-59/cross-category-evidence.json
            node scripts/audit-100-photo-results.mjs benchmark/combined-59/manifest.json benchmark/combined-59/results/results.json benchmark/combined-59/audit.json 59
          else
            echo "::error::Recognition predictions unavailable; inspect the preceding browser step"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-flow-results
          path: |
            benchmark/mobile-flow/
            benchmark/combined-59/
          retention-days: 14
