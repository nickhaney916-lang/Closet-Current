name: Mobile capture and closet persistence flow
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/run-mobile-flow.mjs'
      - '.github/workflows/mobile-flow.yml'
      - 'scripts/download-reviewed-photos.mjs'
      - 'benchmark/locked-photo-sources.json'
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'tests/photo-*.test.cjs'
      - 'tests/outfit-segmentation-edge.test.mjs'
      - 'tests/garment-mask-metrics.test.mjs'
      - 'benchmark/garment-mask-metrics.mjs'
      - 'benchmark/annotate-garment.html'
      - 'scripts/test-garment-annotation-editor.mjs'
      - 'scripts/run-mobile-flow.mjs'
      - '.github/workflows/mobile-flow.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser and licensed camera fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos commons-0001,commons-0002,commons-0003,commons-0021,commons-0024,commons-0033,commons-0035,commons-0045,commons-0049,commons-0053,commons-0060,commons-0065,commons-0070,commons-0079,commons-0083,commons-0094
          mkdir -p benchmark/photos benchmark/mobile-flow
          cp benchmark/locked-photo-sources.json benchmark/mobile-flow/
          ffmpeg -loglevel error -loop 1 -i benchmark/photos/commons-0001.jpg -vf 'scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:black' -r 10 -t 2 -pix_fmt yuv420p -f yuv4mpegpipe benchmark/mobile-camera.y4m
      - name: Verify garment annotation editor draft export
        run: node scripts/test-garment-annotation-editor.mjs
      - name: Check camera frame quality and stability
        run: node --test tests/automatic-indexing.test.cjs tests/clothing-details.test.cjs tests/capture.test.cjs tests/photo-native-still.test.cjs tests/photo-capture-quality.test.cjs tests/photo-frame-quality.test.cjs tests/photo-stability.test.cjs tests/photo-crop-resolution.test.cjs tests/outfit-segmentation-edge.test.mjs tests/outfit-color-evidence.test.mjs tests/photo-color.test.cjs tests/garment-mask-metrics.test.mjs
      - name: Build and verify touch viewport flow with real worker
        run: |
          node scripts/build.mjs
          node scripts/run-mobile-flow.mjs benchmark/mobile-flow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-flow-results
          path: benchmark/mobile-flow/
          retention-days: 14
