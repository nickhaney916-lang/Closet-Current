name: MAIN1054 M256 negative-attempt quarantine exact-head NO DEPLOY HOLD
on:
  push:
    branches: [research/main1054-m256-negative-attempt-quarantine-HOLD]
  pull_request:
    branches: [research/main1054-m255-combined-acceptance-HOLD]
permissions:
  contents: read
jobs:
  m256-integrity-and-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact parent, original donor, source identity, and three-file additive scope
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          PARENT=b50122f86997b3111afbbb00886f303fee0a27d6
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$PARENT" HEAD
          test "$(git rev-parse HEAD:research/parallel105/closeout.mjs)" = ea8732b5e0cc32388c4c4a9b7e0f39a4395858e2
          test "$(git rev-parse HEAD:tests/parallel105-closeout.test.mjs)" = 950e47c828e2eb0f7962a71ee11b7340c6485aeb
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          test "$(git rev-parse HEAD:.github/workflows/main1054-m255-combined-no-deploy.yml)" = ca67f4f9da15997cef60e66b7298a33979db9527
          git diff --name-only "$PARENT" HEAD | while IFS= read -r path; do
            case "$path" in
              research/main1054/m256-negative-attempt-quarantine.mjs|tests/main1054-m256-negative-attempt-quarantine.test.mjs|.github/workflows/main1054-m256-negative-attempt-no-deploy.yml) ;;
              *) echo "M256 unexpected path: $path"; exit 1 ;;
            esac
          done
          git diff --exit-code "$PARENT" HEAD -- public/ scripts/ supabase/ benchmark/ research/parallel105/ tests/parallel105-closeout.test.mjs
          node --check research/main1054/m256-negative-attempt-quarantine.mjs
      - name: Execute original #105 and M256 red-preservation/fail-closed tests
        run: node --test tests/parallel105-closeout.test.mjs tests/main1054-m256-negative-attempt-quarantine.test.mjs
      - name: Install offline test dependencies without deployment
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Build application and run all inherited private-source, security and backup regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          test -s dist/index.html
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs

  m256-original-browser:
    needs: m256-integrity-and-node
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: ${{ matrix.engine }}
      P94_WIDTH: '390'
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify identical product Worker/native original runner and install no-deploy dependencies
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Genuine first-attempt original SegFormer/photo/owner-private 2D-v4 journey
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-parallel94-native-p88-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m256-original-${{ matrix.engine }}-390-HOLD
          path: benchmark/parallel94-native-p88-browser/${{ matrix.engine }}/390/*.json
          retention-days: 14
          if-no-files-found: warn
