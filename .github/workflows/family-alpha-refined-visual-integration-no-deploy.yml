name: Family Alpha Refined Face + Styling OFFLINE HOLD - NO DEPLOY
on:
  pull_request:
    paths:
      - 'scripts/build-family-alpha-refined-avatar-integration-hold.mjs'
      - 'tests/family-alpha-refined-avatar-integration-hold.test.mjs'
      - 'scripts/test-family-alpha-31-browser.mjs'
      - 'docs/FAMILY-ALPHA-REFINED-STYLE-INTEGRATION-HOLD.md'
      - '.github/workflows/family-alpha-refined-visual-integration-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  CLOSET_ALPHA_REFINED_31_VISUAL: '1'
jobs:
  validate-source-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Fetch immutable Work 29, Work 31, recognition and improved face source — no secrets
        run: |
          git fetch --no-tags origin 0fb6ab04ab79c36d449acee21aaaf4318871d647 879f1b92fb15f9bc9a7f0429c7ee178f7bbf1373 795ad6637f8d4f782bc99751211b25e8e72a3a7d 08ed6ac4a3fc921eae5d5d3df3bd3966429559d2 1ecac1079e75f1f25dc70a4c712b2448eb87dca8 d0ff131a4e5617e1a3f4fcfb40d00602fdce9833 68bed0c0f0f25538d0d5a00fbaf9aa34d80b8663 97397e80a7cf66e5e656c5b74c924a51e50f0f6f 44f288dfdcfa02ec5b2cf89a7c79c08cfcaa3584 e75cd4689356ae468a88504ddb25df4b4ff6cb70
      - name: Build all disabled predecessors and source-pinned refined candidate
        run: |
          node scripts/build-family-alpha-staging-auth-hold.mjs
          node scripts/build-family-alpha-recognition-integrated-hold.mjs
          node scripts/build-family-alpha-protected-preview-hold.mjs
          node scripts/build-family-alpha-29-hold.mjs
          node scripts/build-family-alpha-31-hold.mjs
          node scripts/build-family-alpha-refined-avatar-integration-hold.mjs
      - name: Full Node regressions with strict unchanged source, privacy and visual gates
        run: node --test tests/*.test.cjs tests/*.test.mjs
      - name: Explicit release STOP — no accounts/photos/fit certified
        run: |
          node --input-type=module -e "import {assertVisualHOLD} from './scripts/build-family-alpha-refined-avatar-integration-hold.mjs';const m=await assertVisualHOLD();if(m.releaseGate!=='HOLD'||m.deployAuthorized||m.familyFourAccountsCertified||m.realPhotoCutoutsCertified||m.reliableGarmentFittingVerified)process.exit(1);console.log('HOLD: no actual fitting or production/staging authorization');"
  chromium-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Fetch same exact immutable upstream commits
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin 0fb6ab04ab79c36d449acee21aaaf4318871d647 879f1b92fb15f9bc9a7f0429c7ee178f7bbf1373 795ad6637f8d4f782bc99751211b25e8e72a3a7d 08ed6ac4a3fc921eae5d5d3df3bd3966429559d2 1ecac1079e75f1f25dc70a4c712b2448eb87dca8 d0ff131a4e5617e1a3f4fcfb40d00602fdce9833 68bed0c0f0f25538d0d5a00fbaf9aa34d80b8663 97397e80a7cf66e5e656c5b74c924a51e50f0f6f 44f288dfdcfa02ec5b2cf89a7c79c08cfcaa3584 e75cd4689356ae468a88504ddb25df4b4ff6cb70
      - name: Build offline styling-to-refined-face candidate only
        run: |
          node scripts/build-family-alpha-staging-auth-hold.mjs
          node scripts/build-family-alpha-recognition-integrated-hold.mjs
          node scripts/build-family-alpha-protected-preview-hold.mjs
          node scripts/build-family-alpha-29-hold.mjs
          node scripts/build-family-alpha-31-hold.mjs
          node scripts/build-family-alpha-refined-avatar-integration-hold.mjs
      - name: Install isolated test dependencies, no paid providers or app changes
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 fake-indexeddb@6.2.4
      - name: Actual compiled synthetic JPEG workflow — three outfits using refined humanoid
        run: node scripts/test-family-alpha-31-browser.mjs
      - name: Save only synthetic screenshot evidence, not release artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-alpha-refined-31-synthetic-preview-NOT-RELEASE
          path: benchmark/family-alpha-refined-avatar-HOLD/
          retention-days: 7
          if-no-files-found: warn
