name: Synthetic humanoid browser fixture QA
on:
  push:
    branches:
      - qa/verified-humanoid-browser-fixture-20261023
  pull_request:
    paths:
      - 'public/verified-humanoid-browser-fixture*'
      - 'public/humanoid-3d-*'
      - 'tests/verified-humanoid-browser-fixture.test.mjs'
      - '.github/workflows/verified-humanoid-browser-fixture-qa.yml'
jobs:
  node-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/verified-humanoid-browser-fixture.test.mjs
      - run: node --test tests/apply-verified-humanoid-outfit.test.mjs
  browser-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/verified-humanoid-browser.playwright.spec.mjs --browser chromium --reporter=line
      - run: npx playwright test tests/verified-humanoid-browser.playwright.spec.mjs --browser webkit --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-avatar-browser-evidence
          path: test-results/
          if-no-files-found: ignore
