name: M1 P833 bounded worker recovery private recognition — NO DEPLOY
on:
  push:
    branches: [research/mission1-bounded-worker-recovery-833-HOLD]
  pull_request:
    branches: [research/mission1-cancellable-phone-photo-prep-832-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m1-p833-worker-recovery-HOLD-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-P832-full-native-bundle-and-adversarial-HOLD:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact P832 3-of-3 green parent and eight tightly scoped research files
        run: |
          set -euo pipefail
          BASE=89e9176ae3fd92bf17438fa8a3df6b9a51ee7d08
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD >/tmp/m1-p833-paths
          cat /tmp/m1-p833-paths
          test "$(wc -l </tmp/m1-p833-paths)" -eq 8
          while IFS= read -r p; do
            case "$p" in
              public/phone-photo-run-recovery-833.mjs|public/phone-photo-check.mjs|scripts/build-m1-no-account-trial-831.mjs|scripts/test-m1-no-account-trial-831.mjs|scripts/run-phone-photo-check.mjs|tests/mission1-bounded-worker-recovery-833.test.mjs|research/mission1-bounded-worker-recovery-833/REPORT.md|.github/workflows/mission1-bounded-worker-recovery-833-no-deploy.yml) ;;
              *) echo "UNAUTHORIZED MODEL/PHOTO/CLOUD/DEPLOY CHANGE $p"; exit 1 ;;
            esac
          done </tmp/m1-p833-paths
          test -z "$(git diff --name-only "$BASE" HEAD -- supabase benchmark public/local-worker.mjs public/recognition-engine.mjs public/photo-import.js public/phone-photo-prep-832.mjs)"
          grep -Fq 'FAMILY ALPHA HOLD #255' research/mission1-bounded-worker-recovery-833/REPORT.md
          echo M1_P833_EXACT_P832_EIGHT_FILES_NO_DEPLOY
      - name: Install ephemeral native test tools only
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Build native app, verify 14-file owner-only archive and full Node suite
        run: |
          set -euo pipefail
          node --check public/phone-photo-run-recovery-833.mjs
          node --check public/phone-photo-check.mjs
          node --check scripts/run-phone-photo-check.mjs
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          node --test scripts/test-m1-no-account-trial-831.mjs
          node --test tests/mission1-bounded-worker-recovery-833.test.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Save isolated owner-review archive, NEVER host or deploy
        uses: actions/upload-artifact@v4
        with:
          name: mission1-P833-ONE-RECOVERY-OWNER-RECOGNITION-PREVIEW-NOT-HOSTED
          path: benchmark/m1-no-account-trial-831/
          retention-days: 14
          if-no-files-found: error
  real-FashionCLIP-and-simulated-crash-in-browser-HOLD:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Genuine SHA-locked original garment and negative plus browser
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps ${{ matrix.browser }}
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos commons-0001,commons-0090
      - name: Real model on original photos, plus simulated one-worker crash no secret replay
        env:
          M1_TRIAL_ROOT: benchmark/m1-no-account-trial-831
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          node --test scripts/test-m1-no-account-trial-831.mjs
          node --test tests/mission1-bounded-worker-recovery-833.test.mjs
          node scripts/run-phone-photo-check.mjs benchmark/phone-photo-flow-${{ matrix.browser }} ${{ matrix.browser }}
      - name: Upload sanitized numeric-only receipts, NEVER original images or screenshots
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mission1-P833-${{ matrix.browser }}-ONE-RESTART-NUMERIC-ONLY-HOLD
          path: |
            benchmark/phone-photo-flow-${{ matrix.browser }}/results.json
            benchmark/phone-photo-flow-${{ matrix.browser }}/summary.json
          retention-days: 14
          if-no-files-found: error
