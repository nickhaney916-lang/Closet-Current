name: MAIN206 signed original preview in-flight focus source lease NO DEPLOY HOLD
on:
  push:
    branches: [research/main206-p99-pending-owner-focus-revoke-HOLD]
  pull_request:
    branches: [research/main199-verified-cutout-owner-source-gate-HOLD]
permissions:
  contents: read
jobs:
  focused-owner-pending-focus-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact M199 original owner/photo source and strict scope gate
        shell: bash
        run: |
          set -euo pipefail
          BASE=8993da21fd5d103f25dbcb5eab36ed9498047cd7
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | while IFS= read -r path; do
            case "$path" in
              public/native-2d-preview-p99.mjs|tests/main206-pending-owner-focus-reentry.test.mjs|.github/workflows/main206-p99-pending-focus-reentry-no-deploy.yml) ;;
              *) echo "M206 unauthorized changed path $path"; exit 1 ;;
            esac
          done
          test "$(git rev-parse HEAD:public/native-2d-preview-p99.mjs)" = 62bad171a97030846b0f1bb3bab740dec20ac5e7
          test "$(git rev-parse HEAD:public/native-outfit-source-plan-p99.mjs)" = 0d4972a7fddfcfae0dd811765e4a94b962f4b578
          test "$(git rev-parse HEAD:public/native-owner-wardrobe-index-167.mjs)" = d872c582a9d8e6f319cae4c99f84dbc81ea7f7d3
          test "$(git rev-parse HEAD:public/outfit-board.js)" = b8ed5ebe18e81ec3f8f5659257289b8217a6877b
          node --check tests/main206-pending-owner-focus-reentry.test.mjs
      - name: Actual in-flight owner focus event and original-photo stale read acceptance
        run: node --test tests/main206-pending-owner-focus-reentry.test.mjs
