name: Mission1 59 locked real-photo recognition independent evidence NO DEPLOY
on:
  push:
    branches:
      - research/mission1-independent-real-photo-acceptance-20261109-HOLD
    paths:
      - scripts/audit-mission1-real-photos.mjs
      - tests/mission1-real-photo-evidence.test.mjs
      - research/mission1-real-photo-acceptance/REPORT.md
      - .github/workflows/mission1-real-photo-accuracy-no-deploy.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mission1-real-photo-independent-HOLD-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-source-scope-and-node:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independently verify direct original main parent and strict four-file research scope
        run: |
          set -euo pipefail
          BASE=8c3355350303399e9edc2e98beaf9de15d601282
          git fetch --depth=1 origin "$BASE"
          test "$(git rev-parse "$BASE")" = "$BASE"
          git diff --name-only "$BASE" "$GITHUB_SHA" > /tmp/mission1-changed-paths
          cat /tmp/mission1-changed-paths
          test "$(wc -l </tmp/mission1-changed-paths)" -eq 4
          while read -r f; do
            case "$f" in
              scripts/audit-mission1-real-photos.mjs|tests/mission1-real-photo-evidence.test.mjs|research/mission1-real-photo-acceptance/REPORT.md|.github/workflows/mission1-real-photo-accuracy-no-deploy.yml) ;;
              *) echo "Mission 1 refuses source/production/cloud write: $f"; exit 1 ;;
            esac
          done < /tmp/mission1-changed-paths
          test -z "$(git diff --name-only "$BASE" "$GITHUB_SHA" -- public supabase)"
          echo MISSION1_SOURCE_4_RESEARCH_PATHS_ONLY_NO_DEPLOY
      - name: Install existing Node test libraries, not a shipping dependency change
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Run Mission1 seven fail-closed adversarial source/readout tests and existing recognition tests
        run: |
          set -euo pipefail
          node --check scripts/audit-mission1-real-photos.mjs
          node --check tests/mission1-real-photo-evidence.test.mjs
          node --test tests/mission1-real-photo-evidence.test.mjs
          node --test tests/recognition*.test.mjs tests/phone-photo-benchmark.test.mjs
      - name: Full current repository Node regressions and reproducible build
        run: |
          set -euo pipefail
          node --test tests/*.test.cjs tests/*.test.mjs
          node scripts/build.mjs
  real-chromium-inference-all-59:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download original licensed photographs from SHA-locked repository fixtures
        run: |
          set -euo pipefail
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json
          test "$(find benchmark/photos -maxdepth 1 -name '*.jpg' | wc -l)" -eq 59
          echo MISSION1_REAL_LICENSED_JPEG_BYTES_59_LOADED
      - name: Install real headless Chromium and existing Web Worker prerequisites
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build unchanged shipping app locally in isolated ephemeral CI workspace
        run: node scripts/build.mjs
      - name: Real FashionCLIP/WASM Web Worker inference on 32 curated source JPEGs
        run: |
          set -euo pipefail
          node scripts/run-browser-photo-benchmark.mjs benchmark/manifest-reviewed-32.json benchmark/mission1-live/curated
      - name: Real FashionCLIP/WASM Web Worker inference on 16 disjoint holdout JPEGs
        run: |
          set -euo pipefail
          node scripts/run-browser-photo-benchmark.mjs benchmark/manifest-holdout-16.json benchmark/mission1-live/holdout
      - name: Real FashionCLIP/WASM Web Worker inference on 11 fresh, disjoint licensed JPEGs
        run: |
          set -euo pipefail
          node scripts/run-browser-photo-benchmark.mjs benchmark/manifest-fresh-11.json benchmark/mission1-live/fresh
      - name: Verify every original JPEG SHA and all live predictions without invented mask, color or human truth
        run: |
          set -euo pipefail
          node scripts/audit-mission1-real-photos.mjs live-browser-ci benchmark/mission1-live/curated/results.json benchmark/mission1-live/holdout/results.json benchmark/mission1-live/fresh/results.json > benchmark/mission1-live/strict-audit.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const a=JSON.parse(readFileSync('benchmark/mission1-live/strict-audit.json','utf8'));
          assert.equal(a.execution,'live-browser-ci');
          assert.equal(a.total.photos,59);
          assert.equal(a.sourceProof.distinctSourcePhotos,59);
          assert.equal(a.sourceProof.completeSha256AndLicenseChecks,59);
          assert.equal(a.sourceProof.holdoutDisjointFromCurated,true);
          assert.equal(a.sourceProof.freshDisjointFromPrevious,true);
          assert.equal(a.sourceProof.inferenceHashLocked,true);
          assert.equal(a.total.runtimeErrors,0);
          assert.equal(a.labels.newIndependentHumanAdjudications,0);
          assert.equal(a.labels.verifiedIndependentPixelMasks,0);
          assert.equal(a.colorAccuracyPercent,null);
          assert.equal(a.segmentationIoUPercent,null);
          assert.equal(a.missionOneCompleted,false);
          assert.equal(a.eligibleToAdvanceToMissionTwo,false);
          assert.equal(a.releaseAuthorized,false);
          assert.equal(a.familyAlpha,'HOLD');
          console.log('MISSION1_59_GENUINE_CHROMIUM_WORKER_PHOTOS_EXACT_JPEG_SHA_AND_HONEST_DENOMINATORS_PASS');
          console.log('SUMMARY',JSON.stringify(a.total));
          for(const split of ['curated','holdout','fresh'])
           console.log(split.toUpperCase(),JSON.stringify(a.splits[split].summary));
          NODE
      - name: Preserve known real-image automatic-classification regression invariants
        run: |
          set -euo pipefail
          node scripts/check-recognition-regressions.mjs benchmark/manifest-reviewed-32.json benchmark/mission1-live/curated/results.json benchmark/regression-reviewed-32.json
          node scripts/check-recognition-regressions.mjs benchmark/manifest-holdout-16.json benchmark/mission1-live/holdout/results.json benchmark/regression-holdout-16.json
          node scripts/check-recognition-regressions.mjs benchmark/manifest-fresh-11.json benchmark/mission1-live/fresh/results.json benchmark/regression-fresh-11.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission1-59-genuine-source-sha-browser-recognition-HOLD
          path: |
            benchmark/mission1-live/
          retention-days: 14
          if-no-files-found: warn
