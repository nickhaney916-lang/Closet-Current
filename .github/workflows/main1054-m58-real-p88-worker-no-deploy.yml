name: MAIN1054 M58 actual P88 browser WASM model to native private review NO DEPLOY
on:
  push:
    branches: [research/main1054-m58-real-p88-browser-worker-HOLD, fix/parallel91-browser-lifecycle-HOLD]
  pull_request:
    branches: [research/main1054-m58-real-p88-browser-worker-HOLD]
    paths: [scripts/test-main58-actual-p88-wasm-browser.mjs, scripts/lib/owner-item-mutation91.mjs, scripts/test-browser-owner-mutation91.mjs, .github/workflows/main1054-m58-real-p88-worker-no-deploy.yml]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  m58-real-browser-worker-and-mask-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin EXACT M57 parent, immutable P88 source and strict no-merge path allowance
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=8eed18265db2191afdb553147330e2db7e412750
          P88=cc4554ef0104506a72bf0a28423fee52b6e4fff2
          git merge-base --is-ancestor "$BASE" HEAD
          git cat-file -e "$P88^{commit}"
          test "$(git rev-parse "$P88:public/outfit-worker.mjs")" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse "$P88:public/outfit-segmentation.mjs")" = d357955dd8fdab7c0cb727ea597c270edd9309ac
          test "$(git rev-parse "$P88:public/outfit-instance-review-840.mjs")" = 6324d8eda33024f166311f424392ed83363e4942
          test "$(git rev-parse HEAD:public/native-default-atomic-import-m3.mjs)" = e739f1533108d53961483d761a27f0525623af3d
          # M105: admit only the already-reviewed P93 M101 exporter correction.
          test "$(git rev-parse HEAD:public/native-default-verified-backup-export-m3.mjs)" = 99d4da0aeffd43720fae98bddb414d55aeb3bc06
          test "$(git rev-parse HEAD:tests/mission3-default-atomic-backup-source-guard.test.mjs)" = 443c4f3a9b288aa8af36137985c684826b4414cd
          git diff --exit-code "$BASE" HEAD -- public/ ':(exclude)public/outfit-board.js' ':(exclude)public/app.js' ':(exclude)public/native-default-atomic-import-m3.mjs' ':(exclude)public/native-default-verified-backup-export-m3.mjs' supabase/ benchmark/ research/multi-garment-capture-01/ research/mission1-parallel88/ research/parallel89/ research/native-3d-05/
          # M78: only byte-verified donor application is permitted beyond
          # the existing M58 native board; no other protected app edits.
          DONOR=055f7a6569059c3845c0d8dc5960767fc944c6ac
          git cat-file -e "$DONOR^{commit}"
          test "$(git rev-parse "$DONOR:public/app.js")" = ce16b3e219ec9596ffd396264d882ade99590490
          # M83: strict reviewed extension of the exact saved-photo donor,
          # only source identity comparisons and duplicate UX may differ.
          test "$(git rev-parse HEAD:public/app.js)" = 438acfeda76e313b84a7f41a78aab4a748c4e932
          git diff --name-only "$BASE" HEAD | while IFS= read -r path; do
            case "$path" in
              scripts/test-main58-actual-p88-wasm-browser.mjs|scripts/lib/owner-item-mutation91.mjs|scripts/test-browser-owner-mutation91.mjs|research/master-consolidation-1054/MILESTONE58.md|.github/workflows/main1054-m58-real-p88-worker-no-deploy.yml|public/outfit-board.js|research/master-consolidation-1054/reviewed-photo-only-gallery59.mjs|research/master-consolidation-1054/reviewed-photo-only-handoff59.mjs|tests/detector-manual-recovery-65.test.mjs|tests/invalid-selection-race-71.test.mjs|tests/review-source-epoch-34.test.mjs|tests/mission3-outfit-card-picker-owner-lease.test.cjs|tests/mission3-outfit-suggestion-owner-lease.test.cjs|public/app.js|scripts/test-main1054-duplicate-fence-browser.mjs|tests/main1054-saved-photo-duplicate-fence.test.mjs|tests/mission3-saved-photo-insert-cas.test.cjs|tests/mission3-auto-index-source-cas.test.cjs|tests/automatic-indexing.test.cjs|public/native-default-atomic-import-m3.mjs|tests/mission3-default-atomic-backup-source-guard.test.mjs|scripts/test-main51-real-app-owner-original-2d.mjs|scripts/test-mission3-default-atomic-import-browser.mjs|public/native-default-verified-backup-export-m3.mjs|tests/main1054-m104-large-original-export-receipts.test.mjs) ;;
              *) echo "MAIN58 blocked unexpected change: $path"; exit 1;;
            esac
          done
          node --check scripts/test-main58-actual-p88-wasm-browser.mjs
          # M79: preserve real getAll semantics in inherited private-save
          # synthetic IDB fixture after adopting the donor JPEG fence.
          grep -Fq "getAll(){" tests/mission3-saved-photo-insert-cas.test.cjs
          # M86: all three inherited native synthetic IDB writers must
          # exercise real asynchronous getAll before source duplicate CAS.
          grep -Fq "getAll(){" tests/mission3-auto-index-source-cas.test.cjs
          grep -Fq "getAll(){" tests/automatic-indexing.test.cjs
      - name: Extract exact immutable P88 browser worker + import graph (NO default public change)
        shell: bash
        run: |
          set -euo pipefail
          P88=cc4554ef0104506a72bf0a28423fee52b6e4fff2
          mkdir -p .m57-exact-p88-donor/public
          for file in outfit-worker.mjs outfit-segmentation.mjs outfit-instance-review-840.mjs photo-color.js; do
            git show "$P88:public/$file" > ".m57-exact-p88-donor/public/$file"
            test "$(git hash-object ".m57-exact-p88-donor/public/$file")" = "$(git rev-parse "$P88:public/$file")"
          done
          test "$(git hash-object .m57-exact-p88-donor/public/outfit-worker.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
      - name: Verify exact immutable M59 research gallery now opt-in wired to real native consumer
        shell: bash
        run: |
          set -euo pipefail
          M59=d3aa25c850d0a73e90a539c4e90595c378b86d11
          git cat-file -e "$M59^{commit}"
          for path in public/native-owner-wardrobe-index-167.mjs public/native-canonical-photo-source-167.mjs public/outfit-board-engine.js research/main-thread-integration-1054/source-to-outfit.mjs; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$M59:$path")"
          done
          for name in reviewed-photo-only-handoff59.mjs reviewed-photo-only-gallery59.mjs; do
            path="research/master-consolidation-1054/$name"
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$M59:$path")"
          done
          test "$(git rev-parse HEAD:research/master-consolidation-1054/reviewed-photo-only-handoff59.mjs)" = 2c06fcae0e8fb6f5099d313644951c7ff25c774d
          test "$(git rev-parse HEAD:research/master-consolidation-1054/reviewed-photo-only-gallery59.mjs)" = b607a3df58d8c50c0f7c4bb7c255daab4692a1d5
          grep -Fq "get('reviewedPhotoGallery59')==='research'" public/outfit-board.js
          node --check public/outfit-board.js
          node --check research/master-consolidation-1054/reviewed-photo-only-gallery59.mjs
          test "$(git rev-parse HEAD:public/native-default-atomic-import-m3.mjs)" = e739f1533108d53961483d761a27f0525623af3d
          test "$(git rev-parse HEAD:tests/mission3-default-atomic-backup-source-guard.test.mjs)" = 443c4f3a9b288aa8af36137985c684826b4414cd
          git diff --exit-code -- public/ research/multi-garment-capture-01/ supabase/
      - name: Install isolated native browser dependencies (NO paid API/deploy)
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: P91 classify underlying Chromium protocol failures without protocol payloads
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const path='node_modules/playwright-core/lib/server/chromium/crExecutionContext.js';
          const source=fs.readFileSync(path,'utf8');
          const marker='function rewriteError(error) {';
          if(!source.includes(marker))throw Error('Pinned Playwright diagnostic hook changed');
          fs.writeFileSync(path,source.replace(marker,marker+`
            const category=['Promise was collected','Cannot find context','Execution context was destroyed','Target closed'].find(value=>error.message.includes(value))||'other-protocol-error';
            console.error('P91_PROTOCOL_ERROR_CATEGORY',category);
          `));
          JS
      - name: P91 real IndexedDB commit, abort, owner replacement and document lifecycle regression
        run: P91_ENGINE=${{ matrix.engine }} node scripts/test-browser-owner-mutation91.mjs
      - name: Live original JPEG, native owner WebCrypto, exact P88 Worker, browser SegFormer WASM, NO SAVE
        run: node scripts/test-main58-actual-p88-wasm-browser.mjs
      - name: Verify source-safe actual worker receipt, zero private saves and immutable donor
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const engine=process.env.M58_ENGINE;
          if(!['chromium','webkit'].includes(engine))throw Error('M58 unknown browser engine');
          const p=`benchmark/main58-real-p88-browser-worker/${engine}/M58-ACTUAL-P88-BROWSER-NO-SILENT-SAVE.json`;
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          if(r.actualBrowser!==engine||r.actualP88ModuleWorkerExecuted!==true||r.noSyntheticWorker!==true||
             r.sourceVerified!==true||r.actualNativeApp!==true||
             r.sourceGroupsUnverified<1||r.sourceGroupsUnverified>12||
             r.ownerPrivateSaves!==0||r.humanAccuracyMeasured!==false||
             r.physicalDevice!==false||r.hostedSignedRLS!==false||
             r.familyAlpha!=='HOLD'||r.releaseAllowed!==false||
             r.unexpectedOutbound.length!==0)
            throw Error('M58 actual model worker or no-silent-save receipt is invalid');
          console.log('M58 actual live browser donor worker real source proposals',r.sourceGroupsUnverified);
          JS
          test "$(git rev-parse HEAD:public/native-default-atomic-import-m3.mjs)" = e739f1533108d53961483d761a27f0525623af3d
          test "$(git rev-parse HEAD:tests/mission3-default-atomic-backup-source-guard.test.mjs)" = 443c4f3a9b288aa8af36137985c684826b4414cd
          git diff --exit-code 8eed18265db2191afdb553147330e2db7e412750 HEAD -- public/ ':(exclude)public/outfit-board.js' ':(exclude)public/app.js' ':(exclude)public/native-default-atomic-import-m3.mjs' ':(exclude)public/native-default-verified-backup-export-m3.mjs' supabase/ benchmark/ research/multi-garment-capture-01/ research/mission1-parallel88/ research/parallel89/ research/native-3d-05/
      - name: Archive metrics ONLY (NO private photos, masked crops, model weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main1054-m58-${{ matrix.engine }}-real-p88-browser-wasm-original-JPEG-owner-HOLD
          path: |
            benchmark/main58-real-p88-browser-worker/${{ matrix.engine }}/M58-ACTUAL-P88-BROWSER-NO-SILENT-SAVE.json
            benchmark/main58-real-p88-browser-worker/${{ matrix.engine }}/P91-LIFECYCLE.json
          retention-days: 14
          if-no-files-found: ignore

