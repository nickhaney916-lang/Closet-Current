name: MAIN1054 M58 actual P88 browser WASM model to native private review NO DEPLOY
on:
  push:
    branches: [research/main1054-m58-real-p88-browser-worker-HOLD]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  m58-real-browser-worker-and-mask-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin EXACT M57 parent, immutable P88 source and strict no-merge path allowance
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=8eed18265db2191afdb553147330e2db7e412750
          P88=cc4554ef0104506a72bf0a28423fee52b6e4fff2
          git merge-base --is-ancestor "$BASE" HEAD
          git cat-file -e "$P88^{commit}"
          test "$(git rev-parse "$P88:public/outfit-worker.mjs")" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse "$P88:public/outfit-segmentation.mjs")" = d357955dd8fdab7c0cb727ea597c270edd9309ac
          test "$(git rev-parse "$P88:public/outfit-instance-review-840.mjs")" = 6324d8eda33024f166311f424392ed83363e4942
          git diff --exit-code "$BASE" HEAD -- public/ ':(exclude)public/outfit-board.js' supabase/ benchmark/ research/multi-garment-capture-01/ research/mission1-parallel88/ research/parallel89/ research/native-3d-05/
          git diff --name-only "$BASE" HEAD | while IFS= read -r path; do
            case "$path" in
              scripts/test-main58-actual-p88-wasm-browser.mjs|research/master-consolidation-1054/MILESTONE58.md|.github/workflows/main1054-m58-real-p88-worker-no-deploy.yml|public/outfit-board.js|research/master-consolidation-1054/reviewed-photo-only-gallery59.mjs|research/master-consolidation-1054/reviewed-photo-only-handoff59.mjs|tests/detector-manual-recovery-65.test.mjs|tests/invalid-selection-race-71.test.mjs|tests/review-source-epoch-34.test.mjs|tests/mission3-outfit-card-picker-owner-lease.test.cjs|tests/mission3-outfit-suggestion-owner-lease.test.cjs) ;;
              *) echo "MAIN58 blocked unexpected change: $path"; exit 1;;
            esac
          done
          node --check scripts/test-main58-actual-p88-wasm-browser.mjs
      - name: Extract exact immutable P88 browser worker + import graph (NO default public change)
        shell: bash
        run: |
          set -euo pipefail
          P88=cc4554ef0104506a72bf0a28423fee52b6e4fff2
          mkdir -p .m57-exact-p88-donor/public
          for file in outfit-worker.mjs outfit-segmentation.mjs outfit-instance-review-840.mjs photo-color.js; do
            git show "$P88:public/$file" > ".m57-exact-p88-donor/public/$file"
            test "$(git hash-object ".m57-exact-p88-donor/public/$file")" = "$(git rev-parse "$P88:public/$file")"
          done
          test "$(git hash-object .m57-exact-p88-donor/public/outfit-worker.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
      - name: Verify exact immutable M59 research gallery now opt-in wired to real native consumer
        shell: bash
        run: |
          set -euo pipefail
          M59=d3aa25c850d0a73e90a539c4e90595c378b86d11
          git cat-file -e "$M59^{commit}"
          for path in public/native-owner-wardrobe-index-167.mjs public/native-canonical-photo-source-167.mjs public/outfit-board-engine.js research/main-thread-integration-1054/source-to-outfit.mjs; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$M59:$path")"
          done
          for name in reviewed-photo-only-handoff59.mjs reviewed-photo-only-gallery59.mjs; do
            path="research/master-consolidation-1054/$name"
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$M59:$path")"
          done
          test "$(git rev-parse HEAD:research/master-consolidation-1054/reviewed-photo-only-handoff59.mjs)" = 2c06fcae0e8fb6f5099d313644951c7ff25c774d
          test "$(git rev-parse HEAD:research/master-consolidation-1054/reviewed-photo-only-gallery59.mjs)" = b607a3df58d8c50c0f7c4bb7c255daab4692a1d5
          grep -Fq "get('reviewedPhotoGallery59')==='research'" public/outfit-board.js
          node --check public/outfit-board.js
          node --check research/master-consolidation-1054/reviewed-photo-only-gallery59.mjs
          git diff --exit-code -- public/ research/multi-garment-capture-01/ supabase/
      - name: Install isolated native browser dependencies (NO paid API/deploy)
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Live original JPEG, native owner WebCrypto, exact P88 Worker, browser SegFormer WASM, NO SAVE
        run: node scripts/test-main58-actual-p88-wasm-browser.mjs
      - name: Verify source-safe actual worker receipt, zero private saves and immutable donor
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const engine=process.env.M58_ENGINE;
          if(!['chromium','webkit'].includes(engine))throw Error('M58 unknown browser engine');
          const p=`benchmark/main58-real-p88-browser-worker/${engine}/M58-ACTUAL-P88-BROWSER-NO-SILENT-SAVE.json`;
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          if(r.actualBrowser!==engine||r.actualP88ModuleWorkerExecuted!==true||r.noSyntheticWorker!==true||
             r.sourceVerified!==true||r.actualNativeApp!==true||
             r.sourceGroupsUnverified<1||r.sourceGroupsUnverified>12||
             r.ownerPrivateSaves!==0||r.humanAccuracyMeasured!==false||
             r.physicalDevice!==false||r.hostedSignedRLS!==false||
             r.familyAlpha!=='HOLD'||r.releaseAllowed!==false||
             r.unexpectedOutbound.length!==0)
            throw Error('M58 actual model worker or no-silent-save receipt is invalid');
          console.log('M58 actual live browser donor worker real source proposals',r.sourceGroupsUnverified);
          JS
          git diff --exit-code 8eed18265db2191afdb553147330e2db7e412750 HEAD -- public/ ':(exclude)public/outfit-board.js' supabase/ benchmark/ research/multi-garment-capture-01/ research/mission1-parallel88/ research/parallel89/ research/native-3d-05/
      - name: Archive metrics ONLY (NO private photos, masked crops, model weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main1054-m58-${{ matrix.engine }}-real-p88-browser-wasm-original-JPEG-owner-HOLD
          path: benchmark/main58-real-p88-browser-worker/${{ matrix.engine }}/M58-ACTUAL-P88-BROWSER-NO-SILENT-SAVE.json
          retention-days: 14
          if-no-files-found: ignore

  m58-unchanged-native-outfit-2d:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M51_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin original M51 native-app source test and forbid consumer/owner rewrites
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          M51=22f3db9f9d5dd34ff2d1323e59d3848935e65f4f
          git cat-file -e "$M51^{commit}"
          test "$(git rev-parse HEAD:scripts/test-main51-real-app-owner-original-2d.mjs)" = "$(git rev-parse "$M51:scripts/test-main51-real-app-owner-original-2d.mjs")"
          git diff --exit-code 8eed18265db2191afdb553147330e2db7e412750 HEAD -- public/ ':(exclude)public/outfit-board.js' supabase/ research/main-thread-integration-1054/ research/mission1-parallel88/ research/parallel89/ research/native-3d-05/
      - name: Install pinned isolated application test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Re-run unchanged actual app original JPEG → reviewed private owner item → native 2D outfit, logout and source veto
        run: node scripts/test-main51-real-app-owner-original-2d.mjs
      - name: Assert actual app three widths and no unjustified 3D or release
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const engine=process.env.M51_ENGINE;
          const p=`benchmark/main51-real-app-owner-2d/${engine}/M51-native-owner-source-2d-NOT-RELEASE.json`;
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          if(r.engine!==engine||r.actualNativeAppShell!==true||
             r.actualAppOwnerButtonUsed!==true||r.screenshotCount!==3||
             r.cases?.length!==3||r.consumer3D!==false||r.releaseAuthorized!==false||
             r.familyAlpha!=='HOLD'||r.realUserAccounts!==false||
             r.hostedJWTAndRLS!==false||r.physicalAndroidIphone!==false)
            throw Error('M58 inherited actual M51 app journey is incomplete');
          for(const width of [320,390,430]){
            const c=r.cases.find(x=>x.width===width);
            if(!c||c.ownerBDeniedOldOwnerPhoto!==true||
               c.sourceTamperRejected!==true||c.originalPhoto2DOnly!==true)
              throw Error('M58 native app owner/source/2D veto failed for '+width);
          }
          console.log('M58 unchanged M51 real native owner 2D passed',engine,'at 320/390/430; no 3D admission');
          JS
      - name: Archive numeric owner/source receipts only, no private originals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main1054-m58-${{ matrix.engine }}-native-original-2d-HOLD
          path: benchmark/main51-real-app-owner-2d/${{ matrix.engine }}/M51-native-owner-source-2d-NOT-RELEASE.json
          retention-days: 14
          if-no-files-found: ignore

  m58-native-lossless-restore-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin tested inherited restore script and unchanged consumer source
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code 8eed18265db2191afdb553147330e2db7e412750 HEAD -- public/ ':(exclude)public/outfit-board.js' supabase/ research/multi-garment-capture-01/ research/mission1-parallel88/ research/parallel89/
          test -s scripts/test-mission3-lossless-v4-owner-acceptance-browser.mjs
          node --check scripts/test-mission3-lossless-v4-owner-acceptance-browser.mjs
      - name: Install pinned no-deploy browser/test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Run inherited owner-photo and source-mask negative checks
        run: node --test tests/main49-licensed-original-photo-private-outfit-2d.test.mjs tests/main54-unresolved-multi-mask-owner-veto.test.mjs tests/main55-p88-source-key-lease.test.mjs tests/main56-source-mask-to-owner-intake.test.mjs tests/mission3-lossless-v4-owner-acceptance.test.mjs
      - name: Actually test browser v4 lossless owner backup/restore and cross-owner refusal
        run: node scripts/test-mission3-lossless-v4-owner-acceptance-browser.mjs benchmark/main58-native-v4-owner-restore
      - name: Confirm browser receipt and inherited app build, no deployment
        shell: bash
        run: |
          set -euo pipefail
          test -d benchmark/main58-native-v4-owner-restore
          node scripts/build.mjs
          git diff --exit-code 8eed18265db2191afdb553147330e2db7e412750 HEAD -- public/ ':(exclude)public/outfit-board.js' supabase/ research/multi-garment-capture-01/ research/mission1-parallel88/ research/parallel89/

  m58-full-inherited-native-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin verified corrected M57 structural guards, parent and unchanged consumer source
        shell: bash
        run: |
          set -euo pipefail
          BASE=8eed18265db2191afdb553147330e2db7e412750
          M57=91723408a7d1ddc7240e5cbb67d90b242f6f4743
          git merge-base --is-ancestor "$BASE" HEAD
          git cat-file -e "$M57^{commit}"
          for path in tests/detector-manual-recovery-65.test.mjs tests/invalid-selection-race-71.test.mjs tests/review-source-epoch-34.test.mjs; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$M57:$path")"
          done
          git diff --exit-code "$BASE" HEAD -- public/ ':(exclude)public/outfit-board.js' supabase/ research/multi-garment-capture-01/ research/mission1-parallel88/ research/parallel89/ research/native-3d-05/
      - name: Install isolated inherited native test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 playwright@1.56.1 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      # tests/pwa.test.mjs reads dist/manifest.webmanifest and dist/sw.js.
      # Generate these offline artifacts BEFORE the inherited test suite;
      # previously 2776/2777 passed but PWA failed on ENOENT (no dist build).
      - name: Offline application source build before PWA regression (no deploy)
        run: node scripts/build.mjs
      - name: Run exact-head all inherited application and recognition tests
        run: node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Final protected source and branch boundaries
        run: git diff --exit-code 8eed18265db2191afdb553147330e2db7e412750 HEAD -- public/ ':(exclude)public/outfit-board.js' supabase/ research/multi-garment-capture-01/ research/mission1-parallel88/ research/parallel89/ research/native-3d-05/
