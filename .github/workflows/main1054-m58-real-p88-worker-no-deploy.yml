          test "$(git rev-parse HEAD:public/outfit-board.js)" = b8ed5ebe18e81ec3f8f5659257289b8217a6877b
          test "$(git rev-parse HEAD:research/parallel99-normal-journey-HOLD/NORMAL-MODE-CONTRACT.md)" = 56e96d56adf063754112534cc6d6817ceb054f1c
