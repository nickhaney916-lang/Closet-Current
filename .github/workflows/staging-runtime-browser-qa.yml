name: Staging photo backup recovery (synthetic only)
on:
  push:
    branches: [test/staging-photo-backup-recovery-20261021]
permissions:
  contents: read
jobs:
  browser-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard source and run complete regressions
        run: |
          git diff --exit-code 0dbcab844ea5e0d48aa0cacbf08d22ff1ff5c33d HEAD -- public supabase .github/workflows/pages.yml .github/workflows/cloudflare-pages.yml
          node scripts/check-staging-preflight-scope.mjs
          node scripts/check-integrated-pilot-rc.mjs
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Build and verify invented staging fixture (never uploaded)
        env:
          CLOSET_STAGING_APP_ORIGIN: https://preview.closet-current-staging.pages.dev/
          CLOSET_STAGING_SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
          CLOSET_STAGING_SUPABASE_PUBLISHABLE_KEY: sb_publishable_STAGING_TEST_FIXTURE_XYZ001
        run: |
          node scripts/build-restricted-staging.mjs
          node scripts/verify-restricted-staging-bundle.mjs
      - name: Install pinned browser test tools
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Run generated app in Android Chromium and iPhone WebKit emulation
        run: node scripts/test-staging-runtime-browsers.mjs
