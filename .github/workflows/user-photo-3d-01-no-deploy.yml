name: USER-PHOTO-3D-01 source-honest 15 photo and 163 bone acceptance NO DEPLOY
on:
  pull_request:
    paths:
      - 'research/user-photo-3d-01/**'
      - 'tests/user-photo-3d-01.test.mjs'
      - 'scripts/test-user-photo-3d-01-browser.mjs'
      - 'scripts/audit-user-photo-3d-01.mjs'
      - '.github/workflows/user-photo-3d-01-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-sources-no-unverified-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require exact PR557 original consumer 3D baseline and research-only changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor be430292bedc074e52b9368e7f4bcb7d436e329b HEAD
          git diff --name-only be430292bedc074e52b9368e7f4bcb7d436e329b HEAD | while IFS= read -r path; do
            case "$path" in
              research/user-photo-3d-01/*|tests/user-photo-3d-01.test.mjs|scripts/test-user-photo-3d-01-browser.mjs|scripts/audit-user-photo-3d-01.mjs|.github/workflows/user-photo-3d-01-no-deploy.yml) ;;
              *) echo "BLOCKED: out of scope production/parallel change $path"; exit 1 ;;
            esac
          done
          git diff --exit-code be430292bedc074e52b9368e7f4bcb7d436e329b HEAD -- public/ research/native-3d-05/ research/native-consumer-board-04/ research/board-lossless-02/ supabase/ benchmark/fixtures/ benchmark/locked-photo-sources.json
      - name: Install pinned browser, real garment and private IDB research dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 fake-indexeddb@6.2.4 sharp@0.34.3 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Verify source syntax, original application build and all inherited regressions
        run: |
          node --check research/user-photo-3d-01/photo-readiness.mjs
          node --check tests/user-photo-3d-01.test.mjs
          node --check scripts/test-user-photo-3d-01-browser.mjs
          node --check scripts/audit-user-photo-3d-01.mjs
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Pin unchanged original 163-bone male and female donor with original JPEG and masks
        run: |
          git fetch --no-tags origin df6885d6011cb33fb22dceb81a08f35a0ac4dd61 53f2ad344dc56a1477e343531c423aed0e66c17d dd6bac3fa9ff640d4f562cf925337440bdb5cf8f 3a572193987cb29389727426136c6eb3ac326783 dfb40889c4c1221fb1833b859e8a11ef38aeb76e
          git worktree add --detach .native05-donor-541 df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          git config --global --add safe.directory "$GITHUB_WORKSPACE/.native05-donor-541"
          test "$(git -C .native05-donor-541 rev-parse HEAD)" = df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          ln -s ../node_modules .native05-donor-541/node_modules
          cd .native05-donor-541
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
          node --test tests/outfit-3d-01.test.mjs
      - name: Actual original native consumer saved outfit to vetted 163-bone WebGL
        run: node scripts/test-native-3d-05-browser.mjs
      - name: Independent male and female 163-bone source-verified 3D mobile views
        run: |
          cd .native05-donor-541
          node scripts/test-outfit-3d-01-browser.mjs
      - name: Fifteen non-demo original full JPEG photos and owner-private IndexedDB 3 viewport Chromium
        run: node scripts/test-user-photo-3d-01-browser.mjs
      - name: Independently SHA-audit real source review screenshots and produce 3 contact sheets
        run: node scripts/audit-user-photo-3d-01.mjs
      - name: Enforce honest results no fake general 3D and no production permission
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,existsSync} from 'node:fs';
          const r=JSON.parse(readFileSync('benchmark/user-photo-3d-01/results.json'));
          const a=JSON.parse(readFileSync('benchmark/user-photo-3d-01-audit/acceptance.json'));
          const donor=JSON.parse(readFileSync('.native05-donor-541/benchmark/outfit-3d-01/results.json'));
          const native=JSON.parse(readFileSync('benchmark/native-3d-05/results.json'));
          assert.equal(r.cases.length,3);assert.equal(r.screenshots.length,9);
          assert.deepEqual(r.external,[]);assert.deepEqual(r.errors,[]);
          assert.equal(a.status,'PASS_ORIGINAL_SOURCE_READINESS_AND_PHOTO_FALLBACK_ONLY');
          assert.equal(a.originalJPEGShaVerified,15);
          assert.deepEqual(a.readiness,{'3D Ready':0,'Needs Review':12,'Photo-Only':3});
          assert.equal(donor.verdict,'PASS');assert.equal(donor.realBrowserWebGL,true);
          assert.deepEqual(donor.widths,[320,390,430]);
          assert.deepEqual(donor.figures,['female','male']);
          assert.ok(donor.cases.every(c=>c.bones===163&&c.realWebGL));
          assert.equal(native.realWebGL,true);assert.equal(native.screenshots,15);
          for(const c of donor.cases)assert.ok(existsSync('.native05-donor-541/benchmark/outfit-3d-01/'+c.screenshot));
          assert.equal(a.actualHuman3DPhotoReconstructionAccepted,false);
          assert.equal(a.releaseAuthorized,false);assert.equal(a.familyAlpha,'HOLD');
          console.log('SOURCE-HONEST PHOTO21: 15 originals, 0 falsely admitted 3D, live existing male/female source 3D inherited, release HOLD');
          NODE
      - name: Upload real original photo and anatomical WebGL evidence no credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PHOTO3D01-15-originals-and-source-only-anatomical-3D-HOLD
          path: |
            benchmark/user-photo-3d-01/
            benchmark/user-photo-3d-01-audit/
            benchmark/native-3d-05/
            .native05-donor-541/benchmark/outfit-3d-01/
          if-no-files-found: warn
