name: MAIN217 authentic native owner photo manual 2D/v4 fallback on NEGATIVE P94 worker NO DEPLOY HOLD
on:
  push:
    branches: [research/main217-m215-p94-no-proposal-owner-manual-restore-HOLD]
  pull_request:
    branches: [research/main215-m210-m213-retired-photo-owner-lease-24mp-HOLD]
    paths: [.github/workflows/main217-p94-negative-owner-manual-v4-no-deploy.yml, scripts/test-main217-p94-negative-owner-recovery.mjs]
permissions:
  contents: read
jobs:
  inherited-node-and-owner-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact M215 private owner source and P94 negative simulation gates
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          M215=f7534e0d1a9be48284d6be3eedd205420b7e1931
          git merge-base --is-ancestor "$M215" HEAD
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse HEAD:public/native-default-atomic-import-m3.mjs)" = 5a4b2f2e98a9c30a5fd0787ffbb8c9546aacc408
          test "$(git rev-parse HEAD:public/native-2d-preview-p99.mjs)" = b2e26e8b0538b4d344b498bfb55fd74d7f65eb0e
          test "$(git rev-parse HEAD:public/native-reviewed-shared-original-157.mjs)" = 2108bdc2f0a67b8e356ea8c47d0042512ca618bf
          test "$(git rev-parse HEAD:tests/main211-retired-shared-original-import.test.mjs)" = a4351afaa97cb30ecdbf8c781da6cdd4032f7b99
          test "$(git rev-parse HEAD:public/outfit-segmentation.mjs)" = d357955dd8fdab7c0cb727ea597c270edd9309ac
          test "$(git rev-parse HEAD:scripts/test-main217-p94-negative-owner-recovery.mjs)" = 2b672eb27594c54591279213782d8a52fb50cc24
          expected="$(printf '%s\n' '.github/workflows/main217-p94-negative-owner-manual-v4-no-deploy.yml' 'scripts/test-main217-p94-negative-owner-recovery.mjs')"
          test "$(git diff --name-only "$M215" HEAD)" = "$expected"
          node --check scripts/test-main217-p94-negative-owner-recovery.mjs
          node --check scripts/test-parallel94-native-p88-browser.mjs
      - name: Install pinned offline native source and owner test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 playwright@1.56.1 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Build actual native application no deployment
        run: node scripts/build.mjs
      - name: Run full inherited Node recognition, private photo, backup and safety suite
        run: node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Pinned M204 source and M211 retired same-photo original regressions
        run: node --test tests/main204-restore-source-revocation.test.mjs tests/main211-retired-shared-original-import.test.mjs tests/main206-pending-owner-focus-reentry.test.mjs
  true-native-manual-photo-recovery-negative-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {engine: chromium, width: 320, mode: done-zero}
          - {engine: chromium, width: 390, mode: done-zero}
          - {engine: chromium, width: 430, mode: done-zero}
          - {engine: webkit, width: 320, mode: done-zero}
          - {engine: webkit, width: 390, mode: done-zero}
          - {engine: webkit, width: 430, mode: done-zero}
          - {engine: chromium, width: 430, mode: worker-error}
          - {engine: webkit, width: 430, mode: worker-error}
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: ${{ matrix.engine }}
      P94_WIDTH: ${{ matrix.width }}
      M217_CASE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact M215 private owner source and P94 negative simulation gates
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          M215=f7534e0d1a9be48284d6be3eedd205420b7e1931
          git merge-base --is-ancestor "$M215" HEAD
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse HEAD:public/native-default-atomic-import-m3.mjs)" = 5a4b2f2e98a9c30a5fd0787ffbb8c9546aacc408
          test "$(git rev-parse HEAD:public/native-2d-preview-p99.mjs)" = b2e26e8b0538b4d344b498bfb55fd74d7f65eb0e
          test "$(git rev-parse HEAD:public/native-reviewed-shared-original-157.mjs)" = 2108bdc2f0a67b8e356ea8c47d0042512ca618bf
          test "$(git rev-parse HEAD:tests/main211-retired-shared-original-import.test.mjs)" = a4351afaa97cb30ecdbf8c781da6cdd4032f7b99
          test "$(git rev-parse HEAD:public/outfit-segmentation.mjs)" = d357955dd8fdab7c0cb727ea597c270edd9309ac
          test "$(git rev-parse HEAD:scripts/test-main217-p94-negative-owner-recovery.mjs)" = 2b672eb27594c54591279213782d8a52fb50cc24
          expected="$(printf '%s\n' '.github/workflows/main217-p94-negative-owner-manual-v4-no-deploy.yml' 'scripts/test-main217-p94-negative-owner-recovery.mjs')"
          test "$(git diff --name-only "$M215" HEAD)" = "$expected"
          node --check scripts/test-main217-p94-negative-owner-recovery.mjs
          node --check scripts/test-parallel94-native-p88-browser.mjs
      - name: Install real browser and offline native P94 dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 playwright@1.56.1 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Real owner/private original/manual crop/2D/v4 cross-owner refusal after simulated negative Worker ONLY
        run: node scripts/test-main217-p94-negative-owner-recovery.mjs
      - name: Preserve evidence of original SHA, manual review, no silent save and 2D/v4 without source images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main217-${{ matrix.engine }}-${{ matrix.width }}-${{ matrix.mode }}-negative-owner-fallback-HOLD
          path: |
            benchmark/parallel94-native-p88-browser/${{ matrix.engine }}/${{ matrix.width }}/M217-NEGATIVE-OWNER-FALLBACK.json
          if-no-files-found: warn
          retention-days: 14
