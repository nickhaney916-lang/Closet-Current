name: "M2 P89 source original closed shell neutral rear WebGL NO DEPLOY HOLD"
on:
  push:
    branches:
      - research/mission2-p89-source-closed-shell-front-vs-unobserved-back-HOLD
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  true-source-shell-node-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Strict exact donor HEAD, two research files and workflow only
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 83eee4e9361101a91df3e0747822afe184bcaf78 HEAD
          git diff --exit-code 83eee4e9361101a91df3e0747822afe184bcaf78 HEAD -- public/ supabase/ benchmark/fixtures/ benchmark/locked-photo-sources.json
          while IFS= read -r p; do
            case "$p" in
              research/parallel89/met-source-front-neutral-shell89.mjs|scripts/test-parallel89-met-source-neutral-shell.mjs|.github/workflows/mission2-p89-met-front-neutral-shell-no-deploy.yml) ;;
              *) echo "Unauthorized owner, production, photo or other mission file $p"; exit 1 ;;
            esac
          done < <(git diff --name-only 83eee4e9361101a91df3e0747822afe184bcaf78 HEAD)
      - name: Install exact disposable research node packages
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Parse source shell and actual research tests
        run: |
          node --check research/parallel89/met-source-front-neutral-shell89.mjs
          node --check scripts/test-parallel89-met-source-neutral-shell.mjs
      - name: Fetch and SHA-256 verify four genuine original institutional museum JPEG and RGB
        run: node scripts/test-parallel89-met-four-original-photo-silhouettes.mjs
      - name: Isolate pinned original conservative OpenCV masks
        run: |
          python -m venv .m2-met-mask-env
          .m2-met-mask-env/bin/python -m pip install --no-cache-dir --disable-pip-version-check numpy==1.26.4 opencv-python-headless==4.11.0.86 scipy==1.14.1
      - name: Rebuild all 4 genuine museum ORIGINAL RGB conservative masks, unreviewed
        run: .m2-met-mask-env/bin/python scripts/test-parallel89-met-four-real-full-masks.py
      - name: Source-verified original mask shell boundary, rear-neutral topology and adversarial refusal
        run: node scripts/test-parallel89-met-source-neutral-shell.mjs
      - name: Build held original native app OFFLINE without deployment
        run: node scripts/build.mjs
      - name: Entire inherited original private owner, photo, security and source research regressions
        run: node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Verify protected app/account/original source bytes untouched
        run: git diff --exit-code 83eee4e9361101a91df3e0747822afe184bcaf78 HEAD -- public/ supabase/ benchmark/fixtures/ benchmark/locked-photo-sources.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M2-P89-authentic-original-source-mask-neutral-closed-shell-input-HOLD
          path: |
            benchmark/parallel89-met70759-four-photo-research/
            benchmark/parallel89-met70759-full-alpha-proposals/
            benchmark/parallel89-met-original-front-neutral-shell-HOLD/
          retention-days: 7
          if-no-files-found: error

  true-native-front-vs-inferred-rear-webgl:
    needs: true-source-shell-node-and-regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      P89_BROWSER: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact immutable original source/parent plus no private/deploy diff
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 83eee4e9361101a91df3e0747822afe184bcaf78 HEAD
          git diff --exit-code 83eee4e9361101a91df3e0747822afe184bcaf78 HEAD -- public/ supabase/ benchmark/fixtures/ benchmark/locked-photo-sources.json
      - uses: actions/download-artifact@v4
        with:
          name: M2-P89-authentic-original-source-mask-neutral-closed-shell-input-HOLD
          path: benchmark/
      - name: Install pinned disposable genuine native browser plus JPEG decoder
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 playwright@1.56.1
      - name: Real ${{ matrix.engine }} WebGL 0/65/180-degree front-vs-unknown-back neutral draw
        run: node scripts/test-parallel89-met-source-neutral-shell.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M2-P89-genuine-${{ matrix.engine }}-neutral-back-not-realistic-source-shell-HOLD
          path: benchmark/parallel89-met-original-front-neutral-shell-HOLD/
          retention-days: 14
          if-no-files-found: warn
