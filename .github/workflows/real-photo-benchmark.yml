name: Real-photo recognition benchmark
on:
  push:
    paths:
      - '.github/workflows/real-photo-benchmark.yml'
      - 'benchmark/locked-photo-sources.json'
      - 'scripts/evaluate-recognition-benchmark.mjs'
      - 'scripts/compare-detail-field-coverage.mjs'
      - 'scripts/check-recognition-regressions.mjs'
      - 'benchmark/regression-*.json'
      - 'scripts/run-browser-photo-benchmark.mjs'
      - 'public/benchmark-runner.mjs'
      - 'public/benchmark.html'
      - 'public/photo-color.js'
      - 'public/outfit-worker.mjs'
      - 'public/outfit-segmentation.mjs'
      - 'public/recognition-engine.mjs'
      - 'public/recognition-photo.mjs'
      - 'public/local-worker.mjs'
      - 'public/vector-scorer.mjs'
      - 'public/clothing-memory.js'
      - 'scripts/evaluate-clothing-memory.mjs'
      - 'public/recognition-vectors.json'
      - 'public/recognition-vectors.bin'
      - 'benchmark/manifest-holdout-16.json'
      - 'benchmark/manifest-fresh-11.json'
      - 'scripts/download-reviewed-photos.mjs'
      - 'benchmark/manifest-reviewed-32.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and verify locked licensed source photographs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json
      - name: Install headless browser
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Build production app
        run: node scripts/build.mjs
      - name: Run real FashionCLIP inference in Chromium
        run: node scripts/run-browser-photo-benchmark.mjs
      - name: Evaluate real predictions
        if: always()
        run: |
          if [ -f benchmark/output/results.json ]; then
            node scripts/evaluate-recognition-benchmark.mjs benchmark/manifest-reviewed-32.json benchmark/output/results.json > benchmark/output/evaluation.json
            cat benchmark/output/evaluation.json
            node scripts/check-recognition-regressions.mjs benchmark/manifest-reviewed-32.json benchmark/output/results.json benchmark/regression-reviewed-32.json
          fi
      - name: Compare prioritized color coverage on identical model outputs
        run: node scripts/compare-detail-field-coverage.mjs benchmark/output/results.json > benchmark/output/detail-coverage.json
      - name: Evaluate additional clothing and negative regression set
        run: |
          node scripts/run-browser-photo-benchmark.mjs benchmark/manifest-holdout-16.json benchmark/output/holdout
          node scripts/evaluate-recognition-benchmark.mjs benchmark/manifest-holdout-16.json benchmark/output/holdout/results.json > benchmark/output/holdout/evaluation.json
          cat benchmark/output/holdout/evaluation.json
          node scripts/check-recognition-regressions.mjs benchmark/manifest-holdout-16.json benchmark/output/holdout/results.json benchmark/regression-holdout-16.json
      - name: Evaluate locked independent fresh photographs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/download-reviewed-photos.mjs benchmark/manifest-fresh-11.json
          node scripts/run-browser-photo-benchmark.mjs benchmark/manifest-fresh-11.json benchmark/output/fresh
          node scripts/evaluate-recognition-benchmark.mjs benchmark/manifest-fresh-11.json benchmark/output/fresh/results.json > benchmark/output/fresh/evaluation.json
          cat benchmark/output/fresh/evaluation.json
          node scripts/check-recognition-regressions.mjs benchmark/manifest-fresh-11.json benchmark/output/fresh/results.json benchmark/regression-fresh-11.json
      - name: Verify real image features and confirmed-example retrieval
        run: node scripts/evaluate-clothing-memory.mjs > benchmark/output/recognition-memory.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-photo-inference-results
          path: benchmark/output/
          if-no-files-found: warn
          retention-days: 14
