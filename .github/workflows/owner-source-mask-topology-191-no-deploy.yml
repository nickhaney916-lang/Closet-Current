name: P191 alpha topology Node and build verification NO DEPLOY
on:
  push:
    branches:
      - research/owner-source-mask-topology-191-main-20261109-HOLD
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  reviewed-owner-proof-and-full-node:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact independently green P190 parent and 10 scoped research-only paths, NO DEPLOY
        run: |
          set -eu
          BASE=d1480f9abba630fd5e944595fca42e6c26ee2624
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git rev-parse "$(git rev-list --reverse "$BASE..HEAD" | head -n1)^")" = "$BASE"
          git diff --name-only "$BASE" HEAD > /tmp/p191-paths
          while IFS= read -r p; do
            case "$p" in
              research/owner-source-mask-topology-191/source-contour-integrity.mjs|research/owner-source-mask-topology-191/REPORT.md|tests/owner-source-mask-topology-191.test.mjs|research/owner-reviewed-cutout-texture-188/private-cutout-texture.mjs|research/owner-mask-geometry-190/owner-alpha-contour.mjs|research/native-consumer-board-04/consumer-board-controller.mjs|scripts/install-owner-source-topology-191.mjs|research/native-3d-05/native-preview-bridge.mjs|scripts/test-native-3d-05-browser.mjs|.github/workflows/owner-source-mask-topology-191-no-deploy.yml) ;;
              *) echo "P191 rejects unrelated source $p"; exit 1 ;;
            esac
          done </tmp/p191-paths
          test "$(wc -l </tmp/p191-paths)" -eq 10
          git diff --exit-code "$BASE" HEAD -- public supabase migrations package.json package-lock.json research/cloud-to-native-3d-180
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: P191 connected alpha overlap and full regression tests
        run: |
          node --check research/owner-source-mask-topology-191/source-contour-integrity.mjs
          node --check scripts/install-owner-source-topology-191.mjs
          node --check tests/owner-source-mask-topology-191.test.mjs
          node --check research/owner-mask-geometry-190/owner-alpha-contour.mjs
          node --check scripts/install-owner-alpha-geometry-190.mjs
          node --check tests/owner-mask-geometry-190.test.mjs
          node --check research/owner-mask-fabric-189/mask-contract.mjs
          node --check tests/owner-mask-fabric-189.test.mjs
          node --check research/pre-webgl-owner-cutout-187/cutout-lease.mjs
          node --check research/owner-reviewed-cutout-texture-188/private-cutout-texture.mjs
          node --check scripts/install-owner-reviewed-cutout-texture-188.mjs
          node --check research/owner-cutout-photo-fit-186/review-contract.mjs
          node --check research/native-consumer-board-04/consumer-board-controller.mjs
          node --check research/native-3d-05/native-preview-bridge.mjs
          node --check scripts/test-native-3d-05-browser.mjs
          node --test tests/owner-cutout-photo-fit-186.test.mjs tests/pre-webgl-owner-cutout-187.test.mjs tests/owner-reviewed-cutout-texture-188.test.mjs tests/owner-mask-fabric-189.test.mjs tests/owner-mask-geometry-190.test.mjs tests/owner-source-mask-topology-191.test.mjs
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
