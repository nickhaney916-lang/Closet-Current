          node --check research/native-3d-05/native-preview-bridge.mjs
          node --check scripts/test-native-3d-05-browser.mjs
          node --test tests/owner-cutout-photo-fit-186.test.mjs tests/pre-webgl-owner-cutout-187.test.mjs tests/owner-reviewed-cutout-texture-188.test.mjs tests/owner-mask-fabric-189.test.mjs tests/owner-mask-geometry-190.test.mjs tests/owner-source-mask-topology-191.test.mjs tests/owner-local-mask-continuity-192.test.mjs tests/owner-hairline-continuity-194.test.mjs tests/owner-bilateral-asymmetric-fit-195.test.mjs tests/owner-mesh-bilateral-readback-196.test.mjs
