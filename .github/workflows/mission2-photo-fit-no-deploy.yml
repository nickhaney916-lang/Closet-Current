          node --check research/owner-mesh-bilateral-readback-196/real-mesh-evidence.mjs
          node --check tests/owner-mesh-bilateral-readback-196.test.mjs
          node --check research/owner-bilateral-asymmetric-fit-195/side-profile.mjs
          node --check tests/owner-bilateral-asymmetric-fit-195.test.mjs
          node --check research/owner-hairline-continuity-194/hairline-source-proof.mjs
          node --check tests/owner-hairline-continuity-194.test.mjs
          node --check research/owner-local-mask-continuity-192/source-local-continuity.mjs
          node --check tests/owner-local-mask-continuity-192.test.mjs
          node --check research/owner-source-mask-topology-191/source-contour-integrity.mjs
          node --check scripts/install-owner-source-topology-191.mjs
          node --check tests/owner-source-mask-topology-191.test.mjs
          node --check research/owner-mask-geometry-190/owner-alpha-contour.mjs
          node --check scripts/install-owner-alpha-geometry-190.mjs
          node --check tests/owner-mask-geometry-190.test.mjs
          node --check research/owner-mask-fabric-189/mask-contract.mjs
          node --check tests/owner-mask-fabric-189.test.mjs
          node --check research/pre-webgl-owner-cutout-187/cutout-lease.mjs
