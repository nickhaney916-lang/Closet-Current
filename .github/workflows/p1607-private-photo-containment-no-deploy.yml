name: P1607 private photograph containment (NO DEPLOY)
on:
  push:
    branches: [research/p1607-private-photo-containment-HOLD]
  pull_request:
    branches: [research/1452-wardrobe-integration-HOLD]
    paths: [.github/workflows/p1607-private-photo-containment-no-deploy.yml]
permissions:
  contents: read
env:
  BASELINE: c2b1ae41603d476358af39eba99008914fac8046
jobs:
  verification:
    if: github.event_name == 'push' || (github.head_ref == 'research/p1607-private-photo-containment-HOLD' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [regression, browser]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source and isolated no-deploy scope
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASELINE" HEAD
          git diff --exit-code "$BASELINE" HEAD -- . \
            ':(exclude)public/auth.js' \
            ':(exclude)public/cloud-backup.js' \
            ':(exclude)scripts/p1607-photo-containment.mjs' \
            ':(exclude)scripts/test-parallel99-normal-app-browser.mjs' \
            ':(exclude)tests/p1607-private-transport.test.cjs' \
            ':(exclude).github/workflows/p1607-private-photo-containment-no-deploy.yml'
          git worktree add --detach "${RUNNER_TEMP}/p1607-base" "$BASELINE"
          (cd "${RUNNER_TEMP}/p1607-base" && bash scripts/check-1452-integration-source.sh "$BASELINE")
          git log -1 --format='commit %H tree %T'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: node scripts/build.mjs
      - if: matrix.check == 'regression'
        run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
      - if: matrix.check == 'browser'
        run: npx playwright install --with-deps chromium webkit
      - if: matrix.check == 'browser'
        name: Observe private photograph containment and backup in both engines
        run: |
          set -euo pipefail
          for engine in chromium webkit; do
            for width in 320 390 430; do
              P1607_AUDIT=1 P99_ENGINE="$engine" P99_WIDTH="$width" node scripts/test-parallel99-normal-app-browser.mjs
              if [ "$engine" = webkit ]; then
                P1607_AUDIT=1 P1607_CACHE_ONLY=1 P99_ENGINE="$engine" P99_WIDTH="$width" node scripts/test-parallel99-normal-app-browser.mjs
              fi
            done
          done
          node scripts/test-cloud-roundtrip-browser-141.mjs
          node scripts/test-mission3-lossless-v4-owner-acceptance-browser.mjs "${RUNNER_TEMP}/p1607-lossless"
