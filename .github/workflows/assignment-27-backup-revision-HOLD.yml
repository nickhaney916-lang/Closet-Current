name: Assignment 27 independent device backup HOLD
on:
  pull_request:
    branches: [research/main1054-unified-logout-HOLD]
permissions:
  contents: read
jobs:
  local-backend:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/assignment-27-backup-revision-HOLD'
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SUPABASE_TELEMETRY_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin application and policy source
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$BASE_SHA" = be1ae82688b99b5332757d4bd472f7f4b9eec713
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --exit-code "$BASE_SHA" HEAD -- supabase
          test "$(git diff --name-only "$BASE_SHA" HEAD -- public)" = public/cloud-backup.js
          test "$(git hash-object scripts/assignment-21/disposable-policy.sql)" = af56d5079541689ba5452cc5d844258265d3ca32
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.48.3
      - name: Install pinned browser test dependencies
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3
          npx playwright install --with-deps ${{ matrix.engine }}
          node scripts/build.mjs
      - name: Start isolated Supabase Auth, PostgREST, Storage and Postgres
        run: |
          set -eu
          umask 077
          mkdir "$RUNNER_TEMP/closet-a27"
          cd "$RUNNER_TEMP/closet-a27"
          supabase init
          sed -i 's/^project_id = .*/project_id = "closet-a27"/; s/^jwt_expiry = .*/jwt_expiry = 3600/' supabase/config.toml
          grep -q '^jwt_expiry = 3600$' supabase/config.toml
          supabase --version
          supabase start > "$RUNNER_TEMP/closet-a27-start.log" 2>&1 || { echo 'Disposable Supabase startup failed'; exit 1; }
          supabase status -o env > "$RUNNER_TEMP/closet-a27.env"
          docker exec -i supabase_db_closet-a27 psql -U postgres -v ON_ERROR_STOP=1 < "$GITHUB_WORKSPACE/scripts/assignment-21/disposable-policy.sql"
          docker exec -i supabase_db_closet-a27 psql -U postgres -v ON_ERROR_STOP=1 < "$GITHUB_WORKSPACE/supabase/cloud-backup-active-session.sql"
          docker exec supabase_db_closet-a27 psql -U postgres -Atc 'show server_version'
          docker inspect --format '{{.Config.Image}}' supabase_auth_closet-a27 supabase_rest_closet-a27 supabase_storage_closet-a27
      - name: Verify database policy and function grants
        run: |
          docker exec -i supabase_db_closet-a27 psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if not (select relrowsecurity from pg_class where oid='public.closet_backups'::regclass)
               or not (select relrowsecurity from pg_class where oid='storage.objects'::regclass)
               or (select public from storage.buckets where id='closet-private')
               or has_table_privilege('anon','public.closet_backups','SELECT, INSERT, UPDATE, DELETE')
               or has_table_privilege('authenticated','public.closet_backups','DELETE, TRUNCATE, REFERENCES, TRIGGER')
               or has_function_privilege('anon','public.save_closet_backup(bigint,jsonb)','EXECUTE')
               or not has_function_privilege('authenticated','public.save_closet_backup(bigint,jsonb)','EXECUTE')
               or (select prosecdef from pg_proc where oid='public.save_closet_backup(bigint,jsonb)'::regprocedure)
            then raise exception 'Unexpected grant, RLS, private bucket, or RPC scope';
            end if;
          end $$;
          SQL
      - name: Exercise independent devices, stale decisions and original-photo recovery
        env:
          A27_REVISION_CONFLICT: "1"
          A21_ENGINE: ${{ matrix.engine }}
        run: |
          set -o pipefail
          SUPABASE_TEST_ENV="$RUNNER_TEMP/closet-a27.env" node scripts/assignment-21/browser.mjs | tee "$RUNNER_TEMP/closet-a27-browser.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assignment-27-${{ matrix.engine }}-receipt
          path: ${{ runner.temp }}/closet-a27-browser.log
          if-no-files-found: ignore
      - name: Destroy local backend and remove credentials
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/closet-a27/supabase/config.toml"; then
            (cd "$RUNNER_TEMP/closet-a27" && supabase stop --no-backup >/dev/null 2>&1)
          fi
          rm -f "$RUNNER_TEMP/closet-a27.env" "$RUNNER_TEMP/closet-a27-start.log"
  regression:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/assignment-27-backup-revision-HOLD'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: node scripts/build.mjs
      - run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
