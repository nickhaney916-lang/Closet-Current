name: MAIN1054 M278 genuine WebKit original OrtCreateSession error-type and WASM heap HOLD
on:
  push:
    branches: [research/main1054-m278-native-session-memory-class-HOLD]
permissions:
  contents: read
jobs:
  m278-source-security-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify first-attempt source and byte-identical original native model runner and Worker
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD:research/main1054/m278-native-session-memory-class.mjs)" = 8c8ac5a2eae233778a805063eba57dce22e1c386
          node research/main1054/m278-native-session-memory-class.mjs prepare
          node --check scripts/.cc-m278-native-typed-trace.mjs
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
      - name: Reject fabricated native root cause and protect all genuine red tests
        run: node --test tests/main1054-m278-native-session-memory-class.test.mjs
      - name: Inherited exact original native source diagnostics and security test suite
        run: node --test tests/main1054-m269-webkit-original-graph-optimization-ab.test.mjs
      - name: Install pinned source-only test requirements
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Original app offline build and complete inherited source/security/privacy/backup Node suite
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          test -s dist/index.html
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  m278-fresh-native-typed-cohort:
    needs: m278-source-security-node
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - {engine: webkit, width: 320, count: 8}
          - {engine: webkit, width: 390, count: 8}
          - {engine: webkit, width: 430, count: 8}
          - {engine: chromium, width: 390, count: 2}
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: ${{ matrix.engine }}
      P94_WIDTH: ${{ matrix.width }}
      M278_COUNT: ${{ matrix.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source pin plus disposable trace-only JSEP glue before any native model
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD:research/main1054/m278-native-session-memory-class.mjs)" = 8c8ac5a2eae233778a805063eba57dce22e1c386
          node research/main1054/m278-native-session-memory-class.mjs prepare
          node --check scripts/.cc-m278-native-typed-trace.mjs
      - name: Install pinned original actual WASM/SegFormer browser requirements
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Run precommitted original independent model and private-owner journeys retaining EVERY native fail
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m278-sanitized
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          failed=0
          for i in $(seq 1 "$M278_COUNT"); do
            result=0
            timeout -k 5s 170s node scripts/.cc-m278-native-typed-trace.mjs > "$log" 2>&1 || result=$?
            export M278_ORDINAL="$i"
            node research/main1054/m278-native-session-memory-class.mjs receipt "$log" "$result" > "m278-sanitized/$i.txt"
            cat "m278-sanitized/$i.txt"
            if [ "$result" != 0 ] || ! grep -q '^P91_FULL_JOURNEY_PASS ' "$log"; then
              failed=1
            fi
          done
          if [ "$failed" != 0 ]; then
            echo 'M278_ORIGINAL_MODEL_NATIVE_RED_PRESERVED: one or more genuinely failing original model sessions'
          fi
          exit "$failed"
      - name: Archive only sanitized native error category, scalar heap pages and original-pass verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m278-true-native-${{ matrix.engine }}-${{ matrix.width }}-HOLD
          path: m278-sanitized/*.txt
          retention-days: 7
          if-no-files-found: ignore
