name: Family Alpha - verify split Cloudflare read-only credentials (NO DEPLOY)
on:
  push:
    branches: [audit/family-alpha-readonly-cloudflare-token-check-20261025]
    paths: ['.github/workflows/family-alpha-access-token-readonly.yml']
permissions:
  contents: read
jobs:
  read-only-credential-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAGES_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCESS_READ_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify STAGING Pages using original token, two owner Access policies using separate read-only token
        run: |
          node --input-type=module <<'NODE'
          import {verifyOwnerOnlyStageAccess} from './scripts/verify-owner-only-stage-access.mjs';
          const pagesToken=process.env.PAGES_TOKEN;
          const accessToken=process.env.ACCESS_READ_TOKEN;
          if(!pagesToken||!accessToken)
            throw Error('Both separate GitHub Actions credentials are required');
          if(pagesToken===accessToken)
            throw Error('Read-only Access credential should not be the Pages deployment token');
          const url='https://api.cloudflare.com/client/v4/accounts/43ad9703708ddb191712306bebadcace/pages/projects/closet-current-staging';
          const response=await fetch(url,{
            method:'GET',redirect:'error',
            headers:{Authorization:'Bearer '+pagesToken,Accept:'application/json'}
          });
          if(!response.ok)
            throw Error('Existing Pages credential cannot read exact staging project: HTTP '+response.status);
          const result=await response.json();
          if(result.success!==true||result.result?.name!=='closet-current-staging'||
             result.result?.production_branch!=='main')
            throw Error('Existing Pages credential points to an unexpected project');
          console.log('Original GitHub Pages token: exact existing closet-current-staging project VERIFIED');
          const audit=await verifyOwnerOnlyStageAccess({token:accessToken});
          if(audit.result!=='OWNER_ONLY_ACCESS_READ_VERIFIED'||
             audit.approvedIdentityCount!==1||audit.allowPolicies!==2||
             audit.rootDomain!=='closet-current-staging.pages.dev'||
             audit.previewDomain!=='*.closet-current-staging.pages.dev'||
             audit.changesMade!==false)
            throw Error('Staging root and preview policies not verified as one owner');
          console.log('Distinct read-only GitHub Access token: two same-owner staging policies VERIFIED');
          console.log('FAMILY_ALPHA_ACCESS_SECURITY_READ_ONLY_PASS '+JSON.stringify({
             project:'closet-current-staging',
             stageRoot: audit.rootDomain,
             stagePreview: audit.previewDomain,
             allowPolicies:audit.allowPolicies,
             approvedIdentityCount:audit.approvedIdentityCount,
             ownerFingerprint:audit.ownerEmailFingerprint,
             usedSeparateCredentials:true,
             changedCloudflare:false,
             deployed:false,
             realOwnerLoginTested:false,
             avatarActivated:false,
             familyInvitesSent:false
          }));
          NODE
