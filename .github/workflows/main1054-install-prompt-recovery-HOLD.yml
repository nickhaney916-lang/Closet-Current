name: Main1054 installation prompt recovery acceptance HOLD
on:
  pull_request:
    branches: [research/main1054-restored-session-credential-HOLD]
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'research/main1054-install-prompt-recovery-HOLD' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lane: [chromium, webkit, regression]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact correction source, accepted base and isolated acceptance scope
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          base=5bb94527703044218d2a6e1bd52d84900a5e7ef4
          candidate=adcdbc5b29c5307d2836d2b90f935dec8593d036
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$PR_BASE" = "$base"
          test "$(git rev-parse "$base^{tree}")" = 71b74b9fd3ab5b687463a5816a69a68eb7572b44
          git merge-base --is-ancestor "$base" "$candidate"
          git merge-base --is-ancestor "$candidate" HEAD
          printf '%s\n' '.github/workflows/main1054-install-prompt-recovery-HOLD.yml' 'public/pwa.js' 'scripts/main1054-install-prompt-browser.mjs' 'tests/main1054-install-prompt.cjs' > "$RUNNER_TEMP/expected-paths"
          git diff --name-only "$base" HEAD > "$RUNNER_TEMP/actual-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
          test "$(git rev-parse 'HEAD:public/pwa.js')" = '8f7b88dc53905b06a0926cce21a57d5172736143'
          test "$(git rev-parse 'HEAD:scripts/main1054-install-prompt-browser.mjs')" = 'a80e27b2a31a2f763954e4860115445e79a6f135'
          test "$(git rev-parse 'HEAD:tests/main1054-install-prompt.cjs')" = '8e60c451a2e23e931746d923a54c5087b08deaa6'
          git log -1 --format='tested commit %H tree %T'
          echo "Application correction source pinned to $candidate"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: node scripts/build.mjs
      - if: matrix.lane == 'regression'
        run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
      - if: matrix.lane != 'regression'
        env:
          A35_ENGINE: ${{ matrix.lane }}
          CC34_ENGINE: ${{ matrix.lane }}
          CC_AUTH_ENGINE: ${{ matrix.lane }}
          CC_INSTALL_ENGINE: ${{ matrix.lane }}
        run: |
          npx playwright install --with-deps "$A35_ENGINE"
          node scripts/main1054-install-prompt-browser.mjs
          node scripts/main1054-restored-session-browser.mjs
          node scripts/assignment-34/browser.mjs
          node scripts/assignment-35/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always() && matrix.lane != 'regression'
        with:
          name: assignment-35-${{ matrix.lane }}-HOLD
          path: benchmark/assignment-35/quality-*.json
          if-no-files-found: warn
