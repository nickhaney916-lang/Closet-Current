name: MAIN1054 M279 exact original OrtCreateSession pointer length and native WASM bounds HOLD
on:
  push:
    branches: [research/main1054-m279-native-model-pointer-bounds-HOLD]
permissions:
  contents: read
jobs:
  m279-original-source-security-and-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: First-attempt parent source original Worker and native 3-arg boundary proof
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD:research/main1054/m279-original-model-pointer-bounds.mjs)" = f2fd27553cc6854997480ee586cb8e191e9aca11
          node research/main1054/m279-original-model-pointer-bounds.mjs prepare
          node --check scripts/.cc-m279-original-pointer-abi.mjs
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
      - name: Original model pointer range WASM memory, native stack offset and security negative tests
        run: node --test tests/main1054-m279-original-model-pointer-bounds.test.mjs
      - name: Inherited original M278 typed session diagnostics and anti-false-positive tests
        run: node --test tests/main1054-m278-native-session-memory-class.test.mjs tests/main1054-m269-webkit-original-graph-optimization-ab.test.mjs
      - name: Install exact pinned test-only runtime without live signed access
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Build the original app offline and run all inherited Node privacy and backup regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          test -s dist/index.html
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  m279-actual-untouched-segformer-native-original-cohort:
    needs: m279-original-source-security-and-node
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {engine: webkit, width: 320, shard: 1, count: 8}
          - {engine: webkit, width: 320, shard: 2, count: 8}
          - {engine: webkit, width: 320, shard: 3, count: 8}
          - {engine: webkit, width: 390, shard: 1, count: 8}
          - {engine: webkit, width: 390, shard: 2, count: 8}
          - {engine: webkit, width: 390, shard: 3, count: 8}
          - {engine: webkit, width: 430, shard: 1, count: 8}
          - {engine: webkit, width: 430, shard: 2, count: 8}
          - {engine: webkit, width: 430, shard: 3, count: 8}
          - {engine: chromium, width: 320, shard: 1, count: 2}
          - {engine: chromium, width: 390, shard: 1, count: 2}
          - {engine: chromium, width: 430, shard: 1, count: 2}
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: ${{ matrix.engine }}
      P94_WIDTH: ${{ matrix.width }}
      M279_SHARD: ${{ matrix.shard }}
      M279_COUNT: ${{ matrix.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify same first-attempt unmodified original SegFormer and native pointer probe
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD:research/main1054/m279-original-model-pointer-bounds.mjs)" = f2fd27553cc6854997480ee586cb8e191e9aca11
          node research/main1054/m279-original-model-pointer-bounds.mjs prepare
          node --check scripts/.cc-m279-original-pointer-abi.mjs
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
      - name: Install pinned real browser native worker requirements
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Execute every original model owner and private 2D v4 trial; retain ALL failures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m279-sanitized
          logfile="$(mktemp)"
          trap 'rm -f "$logfile"' EXIT
          failed=0
          for i in $(seq 1 "$M279_COUNT"); do
            result=0
            timeout -k 5s 180s node scripts/.cc-m279-original-pointer-abi.mjs > "$logfile" 2>&1 || result=$?
            export M279_ORDINAL="$i"
            receiptResult=0
            node research/main1054/m279-original-model-pointer-bounds.mjs receipt "$logfile" "$result" > "m279-sanitized/$i.txt" || receiptResult=$?
            cat "m279-sanitized/$i.txt"
            if [ "$result" != 0 ] || [ "$receiptResult" != 0 ] || ! grep -q '^P91_FULL_JOURNEY_PASS ' "$logfile"; then
              failed=1
              echo "M279_ORIGINAL_NATIVE_TRUE_RED_OR_UNVERIFIED ordinal=$i"
            fi
          done
          if [ "$failed" != 0 ]; then
            echo 'M279_AUTHENTIC_ORIGINAL_MODEL_NATIVE_RED_PRESERVED'
          fi
          exit "$failed"
      - name: Archive bounded numeric pointer range and actual exception-offset receipts ONLY
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m279-original-native-bounds-${{ matrix.engine }}-${{ matrix.width }}-shard-${{ matrix.shard }}-HOLD
          path: m279-sanitized/*.txt
          retention-days: 7
          if-no-files-found: ignore
