name: 3D-MOBILE-24 Genuine Original Denim Mobile 360 QA (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'scripts/test-denim-mobile-24-browser.mjs'
      - 'research/denim-mobile-24/**'
      - 'tests/denim-mobile-24.test.mjs'
      - '.github/workflows/denim-mobile-24-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-original-denim-mobile-screenshot-and-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Exact independently verified P23 ancestor and no sibling/production edits
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 5c281e5b981fba3ab01d268cd5fbd4c0afca78c8 HEAD
          git diff --name-only 5c281e5b981fba3ab01d268cd5fbd4c0afca78c8 HEAD | while IFS= read -r path; do
            case "$path" in
              scripts/test-denim-mobile-24-browser.mjs|research/denim-mobile-24/*|tests/denim-mobile-24.test.mjs|.github/workflows/denim-mobile-24-no-deploy.yml) ;;
              *) echo "P24 UNAUTHORIZED photo, production or parallel branch edit: $path"; exit 1 ;;
            esac
          done
      - name: Install authentic source 163 bone 3D test runtime only
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 three@0.180.0 playwright@1.56.1 three-mesh-bvh@0.9.2
      - name: Static original source and authenticity QA
        run: |
          node --check scripts/test-denim-mobile-24-browser.mjs
          node --check research/denim-fit-06/source-neutral-light-23.mjs
          node --check research/fabric-sweep-04/wardrobe-demo.mjs
          node --check research/fabric-sweep-04/dress-outfit-controller.mjs
          node --check research/fabric-sweep-04/dress-mobile-showroom.mjs
          node --test tests/denim-neutral-light-23.test.mjs tests/denim-cuff-stack-22.test.mjs tests/denim-mobile-24.test.mjs
      - name: Generate exact unchanged SHA-authenticated source JPEGs and segmentation
        run: |
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node scripts/build-work47-benchmark.mjs
          node --test tests/three-d-31-jeans-source.test.mjs tests/three-d-37-source-true.test.mjs
      - name: Restore SHA-verified CC0 original male and female 163-bone GLBs
        run: |
          git fetch --no-tags origin 53f2ad344dc56a1477e343531c423aed0e66c17d dd6bac3fa9ff640d4f562cf925337440bdb5cf8f 3a572193987cb29389727426136c6eb3ac326783 dfb40889c4c1221fb1833b859e8a11ef38aeb76e
          node research/three-d-20/restore-approved-models.mjs
      - name: 48 original-163-bone mobile 320/390/430 WebGL screenshots
        run: node scripts/test-denim-mobile-24-browser.mjs
      - name: Confirm exact genuine source/mobile/privacy evidence, never physical phone approval
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,existsSync} from 'node:fs';
          const report=JSON.parse(readFileSync('benchmark/denim-mobile-24/results.json','utf8'));
          assert.equal(report.genuineWebGLFrames,48);
          assert.equal(report.cases.length,48);
          assert.deepEqual(report.mobileSimulatedWidths,[320,390,430]);
          assert.deepEqual(report.rigNames,['female','male']);
          assert.deepEqual(report.angles,[0,90,135,180]);
          assert.ok(report.twoAuthenticOriginalDenims);
          assert.ok(report.sourceOwnerPrivate);
          assert.ok(report.cases.every(x=>x.fragmentShaderCompiled&&x.blueDenimPixels>=1200&&
            x.boneCount===163&&x.noNewBVHContacts&&x.noMobileOverflow&&
            x.originalPhotographedFrontAndUVProtected&&x.originalSourceGenuine&&
            x.unphotographedRearStillNeutral&&x.actualChromeMobileWebGL&&
            x.sourceOwner==='fixture-account-a'&&!x.physicalPhoneApproved&&
            !x.humanPhotorealismApproved&&!x.productionModified&&!x.releaseAuthorized));
          for(const x of report.cases)assert.ok(existsSync('benchmark/denim-mobile-24/'+
            x.width+'-'+x.rig+'-photo-'+x.denimIndex+'-angle-'+x.angle+'.png'));
          assert.deepEqual(report.errors,[]);
          assert.deepEqual(report.external,[]);
          assert.equal(report.familyAlpha,'HOLD');
          assert.equal(report.realPhysicalPhoneTested,false);
          assert.equal(report.productionModified,false);
          assert.equal(report.releaseAuthorized,false);
          console.log('48 real original-source WebGL mobile screenshots + no new intersections verified');
          NODE
      - name: Upload actual 48 source-photo-preserved Chromium PNGs HOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MOBILE-24-48-ORIGINAL-DENIM-3WIDTH-4VIEW-163BONE-HOLD
          path: benchmark/denim-mobile-24/
          if-no-files-found: warn
