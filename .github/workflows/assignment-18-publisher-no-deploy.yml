name: Assignment 18 publisher feed acceptance HOLD
on:
  pull_request:
    branches: [assignment-16-maintenance]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'assignment-18-publisher-feed'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        check: [regression, chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact head and accepted parent
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor e508c152fb9385f8014df16287964fc74006a877 HEAD
          git log -1 --format='commit %H tree %T'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: node scripts/build.mjs
      - if: matrix.check == 'regression'
        run: |
          set -o pipefail
          node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs 2>&1 | tee assignment-18-regression.log
      - if: matrix.check != 'regression'
        run: npx playwright install --with-deps "${{ matrix.check }}"
      - if: matrix.check != 'regression'
        env:
          P99_ENGINE: ${{ matrix.check }}
          ASSIGNMENT_18_PUBLISHER: "1"
        run: |
          set -o pipefail
          result=0
          for width in 320 390 430; do
            P99_WIDTH="$width" node scripts/maintenance/browser-test.mjs 2>&1 | tee "assignment-18-$width.log" || result=1
          done
          exit "$result"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assignment-18-${{ matrix.check }}-${{ github.event.pull_request.head.sha }}
          path: |
            assignment-18-*.log
            benchmark/assignment-18-publisher/
