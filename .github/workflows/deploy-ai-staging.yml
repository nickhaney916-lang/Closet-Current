name: Deploy Closet Current AI staging (manual only)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY_STAGING to deploy isolated staging services only'
        required: true
        type: string
permissions:
  contents: read
jobs:
  deploy-staging:
    if: ${{ inputs.confirmation == 'DEPLOY_STAGING' && github.ref == 'refs/heads/fix/mobile-recognition-timeout-diagnostics' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: closet-current-ai-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require isolated diagnostic branch
        run: test "$GITHUB_REF" = 'refs/heads/fix/mobile-recognition-timeout-diagnostics'
      - name: Require independent staging credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_STAGING_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_STAGING_ACCOUNT_ID'; exit 1; }
      - name: Verify staging Pages project already exists
        run: |
          node --input-type=module <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!/^[a-f0-9]{32}$/i.test(account))throw Error('Invalid staging Cloudflare account identifier.');
          const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/pages/projects/closet-current-ai-staging',{
            headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}
          });
          if(!response.ok)throw Error('Staging Pages project must exist before Worker deploy; HTTP '+response.status);
          const result=await response.json();
          if(!result.success||result.result?.name!=='closet-current-ai-staging')throw Error('Unexpected Cloudflare Pages project.');
          NODE
      - name: Run safety tests
        run: node --test tests/ai-preview-*.test.mjs tests/ai-outfit-preview.test.mjs
      - name: Build static application
        run: node scripts/build.mjs
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Deploy staging quota Durable Object Worker
        run: npx wrangler deploy --config workers/ai-preview-quota/wrangler.json
      - name: Prepare isolated staging Pages configuration
        run: cp config/closet-current-ai-staging.wrangler.example.json wrangler.json
      - name: Deploy to existing staging Pages project only
        run: npx wrangler pages deploy dist --project-name closet-current-ai-staging --branch staging
