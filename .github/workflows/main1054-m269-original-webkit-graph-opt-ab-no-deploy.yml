name: MAIN1054 P0 M269 ORIGINAL WebKit graph optimization runtime A B NO DEPLOY HOLD
on:
  push:
    branches: [fix/main1054-p0-webkit-original-segformer-graph-optimizer-ab-HOLD]
  pull_request:
    branches: [research/main1054-m268-redirect-linked-original-fresh-cohort-HOLD]
permissions:
  contents: read
jobs:
  source-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect original Worker and pinned model + exact-isolated branch delta
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          PARENT=0bc51ceffff90220721028d0ecfd19264ebafc5a
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$GITHUB_RUN_ATTEMPT" = 1
          git merge-base --is-ancestor "$PARENT" HEAD
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          test "$(git rev-parse HEAD:research/main1054/m268-redirect-linked-original-fresh-cohort.mjs)" = bac57142af8e4b913955d681a0450d212acf68d6
          git diff --name-only "$PARENT" HEAD | while IFS= read -r path; do
            case "$path" in
              research/main1054/m269-webkit-graph-optimization-runtime-ab.mjs|tests/main1054-m269-webkit-original-graph-optimization-ab.test.mjs|.github/workflows/main1054-m269-original-webkit-graph-opt-ab-no-deploy.yml) ;;
              *) echo "P0 M269 source-scope violation: $path"; exit 1 ;;
            esac
          done
          git diff --exit-code "$PARENT" HEAD -- public/ scripts/ benchmark/ supabase/ research/parallel106/ research/mission3-release-evidence-gate/
          node --check research/main1054/m269-webkit-graph-optimization-runtime-ab.mjs
          node --test tests/main1054-m269-webkit-original-graph-optimization-ab.test.mjs
      - name: Install exact no-deploy original test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Original offline app build, full inherited privacy/photo/model security tests
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          test -s dist/index.html
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  original-native-ab:
    needs: source-node
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: webkit
            width: 320
            arm: baseline
            count: 5
          - engine: webkit
            width: 320
            arm: graph_opt_disabled
            count: 5
          - engine: webkit
            width: 390
            arm: baseline
            count: 5
          - engine: webkit
            width: 390
            arm: graph_opt_disabled
            count: 5
          - engine: webkit
            width: 430
            arm: baseline
            count: 5
          - engine: webkit
            width: 430
            arm: graph_opt_disabled
            count: 5
          - engine: chromium
            width: 320
            arm: baseline
            count: 1
          - engine: chromium
            width: 320
            arm: graph_opt_disabled
            count: 1
          - engine: chromium
            width: 390
            arm: baseline
            count: 1
          - engine: chromium
            width: 390
            arm: graph_opt_disabled
            count: 1
          - engine: chromium
            width: 430
            arm: baseline
            count: 1
          - engine: chromium
            width: 430
            arm: graph_opt_disabled
            count: 1
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: ${{ matrix.engine }}
      P94_WIDTH: ${{ matrix.width }}
      M269_ARM: ${{ matrix.arm }}
      M269_COUNT: ${{ matrix.count }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: True original fp32 SegFormer and owner journey, independent cold-start WebKit/Chromium
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
          node research/main1054/m269-webkit-graph-optimization-runtime-ab.mjs prepare
          node --check scripts/.m269-original-graph-optimization-ab.mjs
          mkdir -p m269-receipts
          for ordinal in $(seq 1 "$M269_COUNT"); do
            echo "M269 ORIGINAL model runtime trial: arm=$M269_ARM engine=$M58_ENGINE width=$P94_WIDTH independent=$ordinal"
            set +e
            timeout -s TERM 180s node scripts/.m269-original-graph-optimization-ab.mjs > m269-native-original.log 2>&1
            exit_code=$?
            set -e
            M269_ORDINAL="$ordinal" node research/main1054/m269-webkit-graph-optimization-runtime-ab.mjs verify m269-native-original.log "m269-receipts/receipt-$ordinal.json" "$exit_code"
            rm -f m269-native-original.log
          done
          node research/main1054/m269-webkit-graph-optimization-runtime-ab.mjs aggregate m269-receipts m269-receipts/summary.json
      - name: Keep only sanitized scalar A B source receipts, no private photo, user, raw log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m269-${{ matrix.engine }}-${{ matrix.width }}-${{ matrix.arm }}-HOLD
          path: m269-receipts/
          if-no-files-found: warn
          retention-days: 7
