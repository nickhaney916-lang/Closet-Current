name: Mobile import responsiveness and bounded photo detail
on:
  push:
    branches: [fix/import-photo-detail-first-budget-20261021, fix/import-retry-mobile-responsiveness-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope-build-and-all-node:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin one intentional import source and all preserved source gates
        run: |
          node scripts/check-import-detail-budget-scope.mjs
          node scripts/check-offline-review-coordinator-source.mjs
          node scripts/check-one-click-review-source.mjs
          node scripts/check-human-review-cloud-bridge.mjs
          node scripts/check-blind-photo-cloud-integration.mjs
          node scripts/verify-camera-cloud-integration.mjs
          node scripts/check-dual-parent-review-integration.mjs
          node scripts/check-customer-pilot-release-gates.mjs
      - name: Build and all current Node regressions
        run: |
          node --check public/photo-import.js
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
  synthetic-original-mobile-fidelity:
    needs: scope-build-and-all-node
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Chromium and WebKit
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Verify real JPEG pixels under forced budget pressure in mobile browsers
        run: |
          mkdir -p "$RUNNER_TEMP/photo-evidence"
          node scripts/test-import-detail-budget-browsers.mjs --out "$RUNNER_TEMP/photo-evidence/fidelity.json"
          node scripts/test-untyped-photo-import-mobile.mjs
          node scripts/build.mjs
          node scripts/test-original-crop-source-mobile.mjs
          node scripts/test-original-source-duplicate-mobile.mjs
          node scripts/test-native-camera-fidelity-mobile.mjs
          node scripts/test-cloud-session-generation-browsers.mjs
          STYLE_BROWSER=chromium node scripts/test-style-my-new-item-mobile.mjs
          STYLE_BROWSER=webkit node scripts/test-style-my-new-item-mobile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imported-photo-detail-technical-evidence-no-human-labels
          path: ${{ runner.temp }}/photo-evidence/
          retention-days: 14
          if-no-files-found: warn
