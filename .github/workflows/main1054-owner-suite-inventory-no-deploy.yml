name: M4 P1 immutable owner-adjacent Node evidence inventory HOLD
on:
  push:
    branches: [research/main1054-p1-owner-suite-inventory-HOLD]
permissions:
  contents: read
jobs:
  pinned-node-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove exact QA branch and pinned candidate lineage
        shell: bash
        run: |
          set -euo pipefail
          BASE=ed340449514255c4bda84eb47f64187e5bd546c8
          test "${{ github.run_attempt }}" = 1
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --check "$BASE" HEAD
          diff -u <(printf 'A\t%s\n' \
            .github/workflows/main1054-owner-suite-inventory-no-deploy.yml \
            research/main1054/owner-suite-inventory.mjs \
            tests/main1054-owner-suite-inventory.test.mjs) \
            <(git diff --name-status "$BASE" HEAD)
          node --test tests/main1054-owner-suite-inventory.test.mjs
          git worktree add --detach "$RUNNER_TEMP/owner-candidate" "$BASE"
      - name: Run actual immutable auth, photo, backup and outfit source tests
        shell: bash
        run: |
          set -euo pipefail
          node research/main1054/owner-suite-inventory.mjs "$RUNNER_TEMP/owner-candidate" | tee "$RUNNER_TEMP/owner-suite-inventory.json"
      - name: Install ordinary Node test dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/owner-candidate"
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Build pinned application and run full available ordinary Node suite
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/owner-candidate"
          node scripts/build.mjs
          test -s dist/index.html
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs | tee "$RUNNER_TEMP/main1054-owner-suite-full.tap"
          grep -Eq '^# fail 0$' "$RUNNER_TEMP/main1054-owner-suite-full.tap"
          grep -Eq '^# skipped 0$' "$RUNNER_TEMP/main1054-owner-suite-full.tap"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main1054-owner-suite-pinned-node-evidence
          path: |
            ${{ runner.temp }}/owner-suite-inventory.json
            ${{ runner.temp }}/main1054-owner-suite-full.tap
          if-no-files-found: ignore
