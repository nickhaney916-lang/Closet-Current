name: MAIN1054 stylist lease regression handoff HOLD
on:
  pull_request:
    branches: [research/p1636-returning-owner-stylist-focus-HOLD]
    paths: [.github/workflows/main1054-stylist-lease-regression-handoff-HOLD.yml, tests/mission3-stylist-submit-owner-request-lease.test.cjs]
permissions:
  contents: read
jobs:
  acceptance:
    if: github.head_ref == 'research/main1054-stylist-lease-regression-handoff-HOLD' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        check: [regression, chromium, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact donor and test-only reconciliation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor 896480960b7d821479fea06c10d3545a8818783c HEAD
          git diff --exit-code 896480960b7d821479fea06c10d3545a8818783c HEAD -- . ':(exclude)tests/mission3-stylist-submit-owner-request-lease.test.cjs' ':(exclude).github/workflows/main1054-stylist-lease-regression-handoff-HOLD.yml'
          test "$(git rev-parse HEAD:tests/mission3-stylist-submit-owner-request-lease.test.cjs)" = "862d5c3882fb185086eb1f23a486f93f078c4ba4"
          test "$(git rev-parse HEAD:public/closet-stylist.js)" = "e852fee3a26f38fcc6d0884eb2d52a47bc01697b"
          git log -1 --format='commit %H tree %T'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: node scripts/build.mjs
      - if: matrix.check == 'regression'
        name: Reproduce exact parent source defect then run full regression
        run: |
          git show 1b949a8ecbcad670259ef46897131e3abda6cf72:public/closet-stylist.js > "$RUNNER_TEMP/p1636-parent.js"
          if P1636_STYLIST_SOURCE="$RUNNER_TEMP/p1636-parent.js" node --test tests/p1636-stylist-focus.test.cjs > "$RUNNER_TEMP/p1636-red.log" 2>&1; then
            cat "$RUNNER_TEMP/p1636-red.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/p1636-red.log"
          grep -F 'not ok 1 - manual pinned garment' "$RUNNER_TEMP/p1636-red.log"
          grep -F 'not ok 2 - programmatic pinned garment' "$RUNNER_TEMP/p1636-red.log"
          git show 1b949a8ecbcad670259ef46897131e3abda6cf72:public/closet-stylist-engine.js > "$RUNNER_TEMP/p1636-parent-engine.js"
          if P1636_ENGINE_SOURCE="$RUNNER_TEMP/p1636-parent-engine.js" node --test tests/p1636-stylist-diversity.test.cjs > "$RUNNER_TEMP/p1636-diversity-red.log" 2>&1; then
            cat "$RUNNER_TEMP/p1636-diversity-red.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/p1636-diversity-red.log"
          grep -F 'not ok 1 - rich pinned wardrobe' "$RUNNER_TEMP/p1636-diversity-red.log"
          node --test tests/mission3-stylist-submit-owner-request-lease.test.cjs
          node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
      - if: matrix.check != 'regression'
        run: npx playwright install --with-deps "${{ matrix.check }}"
      - if: matrix.check != 'regression'
        name: Native parent RED and corrected normal journey
        env:
          P99_ENGINE: ${{ matrix.check }}
          M58_ENGINE: ${{ matrix.check }}
        run: |
          set -euo pipefail
          cp dist/closet-stylist.js "$RUNNER_TEMP/p1636-candidate.js"
          cp dist/closet-stylist-engine.js "$RUNNER_TEMP/p1636-candidate-engine.js"
          trap 'cp "$RUNNER_TEMP/p1636-candidate.js" dist/closet-stylist.js; cp "$RUNNER_TEMP/p1636-candidate-engine.js" dist/closet-stylist-engine.js' EXIT
          git show 1b949a8ecbcad670259ef46897131e3abda6cf72:public/closet-stylist-engine.js > dist/closet-stylist-engine.js
          git show 1b949a8ecbcad670259ef46897131e3abda6cf72:public/closet-stylist.js > dist/closet-stylist.js
          P1607_AUDIT=1 P1636_FOCUS=1 P1636_EXPECT_STALE=1 P99_WIDTH=390 node scripts/test-parallel99-normal-app-browser.mjs
          cp "$RUNNER_TEMP/p1636-candidate.js" dist/closet-stylist.js
          cp "$RUNNER_TEMP/p1636-candidate-engine.js" dist/closet-stylist-engine.js
          for width in 320 390 430; do
            P1607_AUDIT=1 P1636_FOCUS=1 P99_WIDTH="$width" node scripts/test-parallel99-normal-app-browser.mjs
            if [ "$P99_ENGINE" = webkit ]; then
              P1607_AUDIT=1 P1607_CACHE_ONLY=1 P99_WIDTH="$width" node scripts/test-parallel99-normal-app-browser.mjs
            fi
          done
          node scripts/test-parallel94-native-p88-browser.mjs
          node scripts/check-1452-journey-receipts.mjs "$M58_ENGINE"
