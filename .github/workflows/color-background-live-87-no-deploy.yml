name: COLOR87 real-browser background-color abstention and owner-private save NO DEPLOY
on:
  push:
    branches:
      - research/color-background-live-ui-87-main-20261105-HOLD
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-browser-color-warning-and-private-closet:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact proven COLOR85 ancestor and five-file test-only scope
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=b5167567d4a47e2ce720ccd3727647c037974b3a
          git merge-base --is-ancestor "$BASE" HEAD
          FIRST=$(git rev-list --reverse "$BASE..HEAD" | head -n1)
          test "$(git rev-parse "$FIRST^")" = "$BASE"
          git diff --name-only "$BASE" HEAD >/tmp/color87-paths
          while IFS= read -r path; do
            case "$path" in
              research/color-background-live-ui-87/classifier-fixture.js|research/color-background-live-ui-87/REPORT.md|scripts/test-color-background-live-87-browser.mjs|scripts/audit-color-background-live-87-browser.mjs|tests/color-background-live-87.test.mjs|.github/workflows/color-background-live-87-no-deploy.yml) ;;
              *) echo "BLOCKED unauthorized production, staging, review-app code or unrelated change: $path"; exit 1 ;;
            esac
          done </tmp/color87-paths
      - name: Install pinned research-only test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 playwright@1.56.1 sharp@0.34.3
      - name: Build app, check new scripts and run complete inherited Node suite
        run: |
          node --check research/color-background-live-ui-87/classifier-fixture.js
          node --check scripts/test-color-background-live-87-browser.mjs
          node --check scripts/audit-color-background-live-87-browser.mjs
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Six real browser UI cases with synthetic white-backed blue vs solid-blue sources
        run: node scripts/test-color-background-live-87-browser.mjs
      - name: Independently audit all thirty real native browser screenshots
        run: node scripts/audit-color-background-live-87-browser.mjs
      - name: Preserve original JPEG multi-garment private acceptance of verified COLOR85
        run: CAMERAMIXED84=1 node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Independently audit original-JPEG whole-outfit capture photographs
        run: node scripts/audit-outfit-camera-mixed-save-84-browser.mjs
      - name: Preserve owner-consented new-only saved clothes and private owner isolation
        run: MIXED80=1 node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Independently audit mixed-source mobile screenshots
        run: node scripts/audit-mixed-saved-new-clothes-80-browser.mjs
      - name: Preserve native original JPEG camera lifecycle and private closet
        run: node scripts/test-camera-to-closet-79-browser.mjs
      - name: Preserve safely cloned source photo review, Style and atomic restore
        run: SNAPSHOT78=1 node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Independently audit saved native review snapshot screenshot hashes
        run: node scripts/audit-allowlisted-review-snapshot-78-browser.mjs
      - name: Preserve sanitized manifests and controlled test images only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLOR87-native-pixel-background-warning-HOLD-NO-DEPLOY
          path: |
            benchmark/color-background-live-87/acceptance.json
            benchmark/color-background-live-87/*.png
            benchmark/outfit-camera-mixed-save-84/acceptance.json
            benchmark/mixed-saved-new-clothes-80/acceptance.json
            benchmark/allowlisted-review-snapshot-78/acceptance.json
          retention-days: 14
          if-no-files-found: warn
