name: Mission1 P773 source-logit missing garment review genuine publisher mask A-B NO DEPLOY
on:
  push:
    branches:
      - research/mission1-missing-region-source-logit-review-773-HOLD
    paths:
      - research/mission1-unseeded-region-773/original-logit-review.mjs
      - tests/mission1-unseeded-region-review-773.test.mjs
      - scripts/test-mission1-unseeded-region-773-browser.mjs
      - research/mission1-unseeded-region-773/REPORT.md
      - .github/workflows/mission1-unseeded-review-773-no-deploy.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mission1-unseeded-source-logit-773-HOLD-${{ github.ref }}
  cancel-in-progress: true
jobs:
  selected-before-inference-source-and-full-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exactly verified P771 parent and four isolated non-shipping research files
        run: |
          set -euo pipefail
          BASE=83dec61eca0857df144c7e24b38d13f9eb475f4b
          git fetch --depth=1 origin "$BASE"
          test "$(git rev-parse "$BASE")" = "$BASE"
          git diff --name-only "$BASE" "$GITHUB_SHA" > /tmp/p772-files
          cat /tmp/p772-files
          test "$(wc -l </tmp/p772-files)" -eq 5
          while read -r f; do
            case "$f" in
              research/mission1-unseeded-region-773/original-logit-review.mjs|tests/mission1-unseeded-region-review-773.test.mjs|scripts/test-mission1-unseeded-region-773-browser.mjs|research/mission1-unseeded-region-773/REPORT.md|.github/workflows/mission1-unseeded-review-773-no-deploy.yml) ;;
              *) echo "P772 refuses shipping model/owner cloud/source edit: $f"; exit 1 ;;
            esac
          done </tmp/p772-files
          test -z "$(git diff --name-only "$BASE" "$GITHUB_SHA" -- public supabase)"
          echo P773_FIVE_RESEARCH_FILES_ONLY_NO_DEPLOY_FAMILY_ALPHA_HOLD
      - name: Six pre-inference publisher image selection integrity unit tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/select-publisher-mask-holdout-772.py
          python -m unittest discover -s tests -p 'test_publisher_mask_selection_772.py' -v
      - name: Ephemeral unchanged test libraries
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: P773 actual original-logit-only missing garment and anti-spoof adversarial tests
        run: |
          set -euo pipefail
          node --check research/mission1-unseeded-region-773/original-logit-review.mjs
          node --check scripts/test-mission1-unseeded-region-773-browser.mjs
          node --test tests/mission1-unseeded-region-review-773.test.mjs
      - name: Full application recognition signature 3D and privacy regressions
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
  real-publisher-human-polygons-chromium-webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    defaults:
      run:
        shell: bash
    env:
      MULTI16_RELAY_MODEL: '1'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original genuine Chromium WebKit and pinned browser worker dependencies in ephemeral runner
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3
          test -d /ms-playwright
          echo P772_PINNED_VERIFIED_PREINSTALLED_CHROMIUM_WEBKIT_BROWSER_CONTAINER
      - name: Copy only pinned verified P66 real SegFormer worker, boundary evaluator and existing publisher archive reference to temporary runner
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          DONOR=7a933a6ccd461fc722bf3de18ef977c0233023d3
          git fetch --depth=1 origin "$DONOR"
          for file in \
            research/real-mask-evidence-31/worker.mjs \
            research/real-mask-evidence-31/model-assets.mjs \
            research/real-mask-evidence-31/legacy-visible-groups.mjs \
            research/multi-garment-capture-01/visible-groups.mjs \
            research/multi-garment-capture-01/shoe-pair-geometry-30.mjs \
            research/real-garment-acceptance-66/boundary-evidence.mjs \
            research/real-garment-acceptance-66/fashionpedia-sample.json \
            scripts/test-fashionpedia-66-browser.mjs; do
            mkdir -p "$(dirname "$file")"
            git show "$DONOR:$file" > "$file"
          done
          GROWTH=0d9534130cc1e72e9e9e0dd7827267babdc5a911
          git fetch --depth=1 origin "$GROWTH"
          for file in \
            research/mission1-seeded-boundary-recovery/review-growth.mjs \
            research/mission1-external-human-evidence/instance-metrics.mjs; do
            mkdir -p "$(dirname "$file")"
            git show "$GROWTH:$file" > "$file"
          done
          cp research/real-garment-acceptance-66/fashionpedia-sample.json research/real-garment-acceptance-66/pinned-published-exposed.json
          test "$(node -e 'console.log(JSON.parse(require("fs").readFileSync("research/real-garment-acceptance-66/pinned-published-exposed.json")).rows.length)')" -eq 6
      - name: SHA-lock historical 59 real licensed JPEG originals for visual exposure preflight
        run: |
          set -euo pipefail
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json
          test "$(find benchmark/photos -maxdepth 1 -name '*.jpg' | wc -l)" -eq 59
      - name: Preselect 8 NEW publisher human mask photos WITHOUT model output or human synthetic labels
        run: |
          set -euo pipefail
          mkdir -p benchmark/m1-p772
          python scripts/select-publisher-mask-holdout-772.py research/real-garment-acceptance-66/fashionpedia-sample.json benchmark/real-garment-acceptance-66/fashionpedia | tee benchmark/m1-p772/pre-inference-selection.txt
          test "$(find benchmark/real-garment-acceptance-66/fashionpedia -maxdepth 1 -name '*.jpg' | wc -l)" -eq 8
          test "$(find benchmark/real-garment-acceptance-66/previous-six -maxdepth 1 -name '*.jpg' | wc -l)" -eq 6
      - name: Independent pre-inference P769 visual exposure scan against 65 already used genuine photos
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {buildExposureLedger,screenProspectiveImages} from './research/mission1-visual-source-overlap-769/original-perceptual-ledger.mjs';
          const read=p=>JSON.parse(readFileSync(p,'utf8'));
          const old=read('benchmark/locked-photo-sources.json');
          const prior=read('research/real-garment-acceptance-66/pinned-published-exposed.json').rows;
          const fresh=read('research/real-garment-acceptance-66/fashionpedia-sample.json').rows;
          const prev=prior.map(x=>({...x,image:x.file_name,kind:'publisher'}));
          const historical=old.map(x=>({...x,kind:'historical'}));
          const ledger=await buildExposureLedger({
           historical59:historical,published6:prev,
           readOriginal:async row=>readFileSync(row.kind==='publisher'?
            'benchmark/real-garment-acceptance-66/previous-six/'+row.image:
            'benchmark/photos/'+row.image)
          });
          const scan=await screenProspectiveImages({
           ledger,known65:[...historical,...prev].map(x=>x.sha256),
           candidates:fresh.map(x=>({image:x.file_name,sha256:x.sha256})),
           readCandidate:async row=>readFileSync('benchmark/real-garment-acceptance-66/fashionpedia/'+row.image)
          });
          writeFileSync('benchmark/m1-p772/65-source-visual-preflight.json',JSON.stringify(scan,null,2));
          if(ledger.realSourcePhotos!==65||scan.candidateOriginals!==8||scan.candidatesApprovedAsUnseen!==0)
           throw Error('source overlap preflight attribution mismatch');
          console.log('P772_8_SOURCE_SHA_VERIFIED_AND_SCREENED_BEFORE_FIRST_MODEL_INFERENCE');
          console.log('P772_VISUAL_OVERLAP_FLAGS_RETAINED_NEVER_AUTOCLEARED',scan.nearDuplicateFlagCount);
          NODE
      - name: Source locked unchanged SegFormer versus P767 seeded versus P773 missing-region research in actual Chromium
        run: MISSION1_ENGINE=chromium node scripts/test-mission1-unseeded-region-773-browser.mjs
      - name: Same exact model original images and all three arms independently evaluated in actual WebKit
        run: MISSION1_ENGINE=webkit node scripts/test-mission1-unseeded-region-773-browser.mjs
      - name: Exact source, complete publisher human polygons and SHA verified independent browser summaries
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const read=p=>JSON.parse(readFileSync(p,'utf8'));
          const m=read('research/real-garment-acceptance-66/fashionpedia-sample.json');
          const scan=read('benchmark/m1-p772/65-source-visual-preflight.json');
          assert.equal(m.rows.length,8);
          assert.deepEqual(m.rows.map(x=>x.selectionTargetCategoryID),[0,1,4,6,7,8,10,23]);
          const source=new Map(m.rows.map(x=>[x.id,x.sha256]));
          assert.equal(source.size,8);
          const summaries={manifestSchema:m.schema,selectionFixedBeforeInference:true,
           originalJPEGs:8,publisherHumanPolygons:m.rows.reduce((a,r)=>a+r.annotations.length,0),
           preInferenceVisualOverlapFlags:scan.nearDuplicateFlagCount,
           engines:{},independentlyBlindedTwoHumanReviewers:false,
           exactSubtypeAccuracy:null,independentColorAccuracy:null,
           independentSameClassInstanceSeparationAccuracy:null,
           actualPhotoTo3DFidelity:null,independentTrainingUnseenGuarantee:false,
           approvedForFamilyAlpha:false,familyAlpha:'HOLD'};
          for(const engine of ['chromium','webkit']){
           const r=read('benchmark/mission1-unseeded-region-773/'+engine+'/results.json');
           assert.equal(r.engine,engine);assert.equal(r.photos,8);
           assert.equal(r.rows.length,8);assert.equal(r.screens.length,8);
           for(const item of r.rows){
            assert.equal(item.sourceSHA256,source.get(item.id));
            assert.ok(item.measured.length>0);
            assert.ok(item.measured.every(x=>Number.isFinite(x.iou)&&x.iou>=0&&x.iou<=1));
           }
           assert.equal(r.publisherHumanInstances,summaries.publisherHumanPolygons);
           assert.equal(r.familyAlpha,'HOLD');assert.equal(r.ownerReviews,0);
           assert.equal(typeof r.summary.unseededReviewCount,'number');
           assert.equal(r.summary.unseededReviewNoAutomaticAcceptance,true);
           assert.equal(typeof r.summary.unseededReviewArm.truePositives,'number');
           summaries.engines[engine]=r.summary;
           console.log('P773_ACTUAL_SEGFORMER_THREE_ARM_PUBLISHER_HUMAN_POLYGON_RESULTS',engine,JSON.stringify(r.summary));
          }
          writeFileSync('benchmark/m1-p772/unseeded-original-logit-three-arm-results.json',JSON.stringify(summaries,null,2));
          console.log('P773_EXPOSED_EIGHT_REAL_PUBLISHER_POLYGON_CROSS_STREAM_A_B_NO_RELEASE');
          NODE
      - name: Remove all source JPEG bytes and irrelevant private data prior to public-source-only evidence upload
        if: always()
        run: |
          rm -rf benchmark/real-garment-acceptance-66/fashionpedia
          rm -rf benchmark/real-garment-acceptance-66/previous-six
          rm -rf benchmark/photos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission1-773-real-seeded-unseeded-source-logit-two-browser-results-HOLD
          path: |
            benchmark/m1-p772/
            benchmark/mission1-unseeded-region-773/
            research/real-garment-acceptance-66/fashionpedia-sample.json
          retention-days: 14
          if-no-files-found: warn
