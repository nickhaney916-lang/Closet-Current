name: RECOVERY65 detector worker failure to native manual photo review NO DEPLOY
on:
  push:
    branches:
      - research/detector-manual-recovery-65-main-20261105-HOLD
  pull_request:
    paths:
      - 'research/multi-garment-capture-01/review-ui.mjs'
      - 'research/detector-recovery-65/**'
      - 'scripts/test-multi-garment-capture-01-browser.mjs'
      - 'scripts/audit-detector-recovery-65-browser.mjs'
      - 'tests/detector-manual-recovery-65.test.mjs'
      - '.github/workflows/detector-manual-recovery-65-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker-failure-native-manual-owner-private-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Strict known verified REVIEW63 parent and no-production or staging file changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 78e6ecdaeb836626ee2c31dedfbf4b627036271c HEAD
          git diff --name-only 78e6ecdaeb836626ee2c31dedfbf4b627036271c HEAD >/tmp/detector65-scope
          while IFS= read -r path; do
            case "$path" in
              research/multi-garment-capture-01/review-ui.mjs|research/detector-recovery-65/*|scripts/test-multi-garment-capture-01-browser.mjs|scripts/audit-detector-recovery-65-browser.mjs|tests/detector-manual-recovery-65.test.mjs|.github/workflows/detector-manual-recovery-65-no-deploy.yml) ;;
              *) echo "BLOCKED unrelated app/staging/production edit: $path"; exit 1 ;;
            esac
          done </tmp/detector65-scope
      - name: Install pinned source-test and real mobile browser dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Build existing app and run all inherited and RECOVERY65 adversarial Node tests
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Six original licensed JPEG real manual camera -> private closet -> owner style -> restore browser regressions
        run: node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Six inherited 100-percent untrusted detector proposal -> human review real browser regressions
        run: DETECTOR57=1 node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Six NEW actual native original JPEG worker failure/recovery browser scenarios across Chromium WebKit 320 390 430
        run: DETECTOR65=1 node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Independent full PNG SHA dimensions/source audit of all 66 worker-failure native screenshot frames
        run: node scripts/audit-detector-recovery-65-browser.mjs
      - name: Archive sanitized original-photo identity evidence and 66 real browser screenshot PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RECOVERY65-manual-original-JPEG-when-AI-fails-native-owner-HOLD
          path: |
            benchmark/multi-garment-capture-01/acceptance.json
            benchmark/detector-proposal-native-57/acceptance.json
            benchmark/detector-recovery-65/acceptance.json
            benchmark/detector-recovery-65/*.png
          if-no-files-found: warn
          retention-days: 14
