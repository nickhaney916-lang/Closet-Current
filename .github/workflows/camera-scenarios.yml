name: Camera and indexing scenario tests
on:
  push:
    paths:
      - 'tests/**'
      - 'public/app.js'
      - 'public/outfit-capture.js'
      - 'public/**'
      - 'scripts/**'
      - '.github/workflows/camera-scenarios.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate production build (do not deploy)
        run: node scripts/build.mjs
      - name: Fetch pinned staging/recognition fixture source for inherited Node tests
        run: |
          git fetch --no-tags origin 879f1b92fb15f9bc9a7f0429c7ee178f7bbf1373 795ad6637f8d4f782bc99751211b25e8e72a3a7d 08ed6ac4a3fc921eae5d5d3df3bd3966429559d2 1ecac1079e75f1f25dc70a4c712b2448eb87dca8
      - name: Build disabled staging Auth and retained JPEG artifacts required by inherited Node suite
        run: |
          node scripts/build-family-alpha-staging-auth-hold.mjs
          node scripts/build-family-alpha-recognition-integrated-hold.mjs
          node scripts/build-family-alpha-protected-preview-hold.mjs
      - name: Prepare immutable styling and avatar integration fixtures for full suite
        run: |
          node scripts/build-family-alpha-29-hold.mjs
          node scripts/build-family-alpha-31-hold.mjs
      - name: Run complete Node test suite (all application and recognition tests, no skips)
        run: node --test tests/*.test.cjs tests/*.test.mjs
