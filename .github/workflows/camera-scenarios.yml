name: Camera and indexing scenario tests
on:
  push:
    branches:
      - fix/mobile-recognition-timeout-diagnostics
    paths:
      - 'tests/**'
      - 'public/app.js'
      - 'public/outfit-capture.js'
      - 'public/**'
      - 'scripts/**'
      - 'benchmark/independent-candidates.json'
      - '.github/workflows/camera-scenarios.yml'
  workflow_dispatch:
concurrency:
  group: closet-camera-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate production build
        run: node scripts/build.mjs
      - name: Run complete Node test suite (all application and recognition tests)
        run: node --test tests/*.test.cjs tests/*.test.mjs
  resolution-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare the locked independent 11-photo subset
        run: |
          mkdir -p benchmark/resolution-comparison
          cp benchmark/manifest-fresh-11.json benchmark/resolution-comparison/manifest.json
          node scripts/download-reviewed-photos.mjs benchmark/resolution-comparison/manifest.json
          node scripts/validate-100-photo-set.mjs benchmark/resolution-comparison/manifest.json benchmark/photos 11
      - name: Install browser benchmark dependencies
        run: |
          npm install --no-save --no-package-lock --fetch-retries=4 playwright
          npx playwright install --with-deps chromium
          node scripts/build.mjs
      - name: Run paired recognition at 2048 and 4096 pixels
        run: |
          node scripts/run-browser-photo-benchmark.mjs benchmark/resolution-comparison/manifest.json benchmark/resolution-comparison/old 2048
          node scripts/run-browser-photo-benchmark.mjs benchmark/resolution-comparison/manifest.json benchmark/resolution-comparison/new 4096
          node scripts/compare-photo-resolutions.mjs benchmark/resolution-comparison/manifest.json benchmark/resolution-comparison/old/results.json benchmark/resolution-comparison/new/results.json benchmark/resolution-comparison/comparison.json
      - name: Upload resolution comparison and per-photo diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recognition-resolution-2048-vs-4096
          path: benchmark/resolution-comparison/
          retention-days: 14
  collect-independent-photos:
    if: github.ref_name == 'fix/mobile-recognition-timeout-diagnostics' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect focused shell jacket and rainwear review photos
        env:
          CLOSET_COLLECTION_IDS: candidate-shell-001,candidate-shell-003,candidate-trench-001,candidate-rainwear-001
        run: node scripts/collect-independent-photo-bytes.mjs
      - name: Summarize rainwear photo collection
        if: always()
        run: |
          if [ -f benchmark/photo-collection/report.json ]; then
            node --input-type=module -e 'import {readFileSync,appendFileSync} from "node:fs"; const rows=JSON.parse(readFileSync("benchmark/photo-collection/report.json")); const pending=rows.filter(x=>x.id.includes("shell")||x.id.includes("trench")); const output=["## Rainwear photo downloads","","| Photo candidate | Collection result |","|---|---|",...pending.map(x=>`| ${x.id} | ${x.status}${x.reason?" — "+x.reason:""} |`),"","Downloaded photos are **not approved** until image content, license, subtype and baseline independence are reviewed."]; appendFileSync(process.env.GITHUB_STEP_SUMMARY,output.join("\\n")+"\\n");'
          else
            echo 'Photo collector did not produce a report.' >> "$GITHUB_STEP_SUMMARY"
          fi
      # Only the isolated gray jacket is required to unblock the next benchmark.
      # The museum jacket and trenchcoat are optional review evidence.
      - name: Verify gray shell-jacket download
        if: always()
        run: |
          node scripts/check-photo-collection.mjs benchmark/photo-collection/report.json candidate-shell-001
      - name: Stage unscored gray shell diagnostic
        run: |
          mkdir -p benchmark/shell-diagnostic
          node scripts/stage-shell-diagnostic.mjs benchmark/photo-collection/report.json benchmark/independent-candidates.json benchmark/shell-diagnostic/manifest.json benchmark/photos
      - name: Run real FashionCLIP recognition on gray waterproof jacket
        run: |
          for attempt in 1 2 3; do
            if npm install --no-save --no-package-lock --fetch-retries=4 --fetch-retry-mintimeout=10000 playwright; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
          npx playwright install --with-deps chromium
          node scripts/build.mjs
          node scripts/run-browser-photo-benchmark.mjs benchmark/shell-diagnostic/manifest.json benchmark/shell-diagnostic/results
          node scripts/report-independent-subtypes.mjs benchmark/shell-diagnostic/manifest.json benchmark/shell-diagnostic/results/results.json benchmark/shell-diagnostic/subtypes.json
      - name: Publish gray shell diagnostic result
        if: success()
        run: |
          node --input-type=module -e 'import {readFileSync,appendFileSync} from "node:fs";const x=JSON.parse(readFileSync("benchmark/shell-diagnostic/results/results.json"))[0];appendFileSync(process.env.GITHUB_STEP_SUMMARY,`\n## Gray shell jacket recognition (diagnostic only)\n\n- Predicted: ${x?.prediction?.category||"none"} / ${x?.prediction?.type||"none"}\n- Expected label: Outerwear / Jacket\n- Runtime error: ${x?.error||"none"}\n- **Not an approved independent accuracy sample.**\n`);'
      - name: Stage unscored red rain jacket challenge
        id: red-stage
        continue-on-error: true
        run: |
          mkdir -p benchmark/rain-jacket-challenge
          node scripts/stage-shell-diagnostic.mjs benchmark/photo-collection/report.json benchmark/independent-candidates.json benchmark/rain-jacket-challenge/manifest.json benchmark/photos candidate-shell-003
      - name: Run FashionCLIP on mixed-garment rain jacket
        if: steps.red-stage.outcome == 'success'
        run: |
          node scripts/run-browser-photo-benchmark.mjs benchmark/rain-jacket-challenge/manifest.json benchmark/rain-jacket-challenge/results
          node scripts/report-independent-subtypes.mjs benchmark/rain-jacket-challenge/manifest.json benchmark/rain-jacket-challenge/results/results.json benchmark/rain-jacket-challenge/subtypes.json
      - name: Summarize red rain-jacket diagnostic
        if: always()
        run: |
          if [ -f benchmark/rain-jacket-challenge/results/results.json ]; then
            node --input-type=module -e 'import {readFileSync,appendFileSync} from "node:fs";const rows=JSON.parse(readFileSync("benchmark/rain-jacket-challenge/results/results.json","utf8"));const x=rows[0]||{};appendFileSync(process.env.GITHUB_STEP_SUMMARY,"\n## Red rain jacket (unscored, other garments visible)\n\n"+JSON.stringify({id:x.id,prediction:x.prediction,framingExperiment:x.framingExperiment?{method:x.framingExperiment.method,prediction:x.framingExperiment.prediction,reason:x.framingExperiment.reason,error:x.framingExperiment.error}:null,category:x.category,type:x.type,reason:x.reason,error:x.error},null,2)+"\n");'
          else
            echo 'Red jacket challenge was not run or did not produce a result; it remains optional and is not an accuracy sample.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Stage optional yellow rain cape edge case
        id: cape-stage
        continue-on-error: true
        run: |
          mkdir -p benchmark/yellow-rain-cape
          node scripts/stage-shell-diagnostic.mjs benchmark/photo-collection/report.json benchmark/independent-candidates.json benchmark/yellow-rain-cape/manifest.json benchmark/photos candidate-rainwear-001
      - name: Run unscored yellow rain cape recognition
        if: steps.cape-stage.outcome == 'success'
        run: |
          node scripts/run-browser-photo-benchmark.mjs benchmark/yellow-rain-cape/manifest.json benchmark/yellow-rain-cape/results
          node scripts/report-independent-subtypes.mjs benchmark/yellow-rain-cape/manifest.json benchmark/yellow-rain-cape/results/results.json benchmark/yellow-rain-cape/subtypes.json
      - name: Upload unscored yellow rain cape result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yellow-rain-cape-unscored
          path: benchmark/yellow-rain-cape/
          retention-days: 14
      - name: Upload unscored rain jacket challenge
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: red-rain-jacket-unscored-challenge
          path: benchmark/rain-jacket-challenge/
          retention-days: 14
      - name: Upload gray shell diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-jacket-unscored-diagnostic
          path: benchmark/shell-diagnostic/
          retention-days: 14
      - name: Upload photo review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-photo-collection
          path: benchmark/photo-collection/
          retention-days: 14
  independent-approved-photo-smoke:
    if: github.ref_name == 'fix/mobile-recognition-timeout-diagnostics' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare approved photos and guard against prior benchmark leakage
        run: |
          mkdir -p benchmark/independent-smoke
          node scripts/prepare-independent-photos.mjs benchmark/independent-candidates.json benchmark/independent-smoke/manifest.json benchmark/independent-smoke/coverage.json
          node -e "const r=require('./benchmark/independent-smoke/coverage.json');if(r.approvedCount<2)process.exit(1)"
          node scripts/assemble-reviewed-baseline.mjs benchmark/independent-smoke/baseline.json benchmark/manifest-reviewed-32.json benchmark/manifest-holdout-16.json benchmark/manifest-fresh-11.json
          node scripts/check-independent-validation.mjs benchmark/independent-smoke/baseline.json benchmark/independent-smoke/manifest.json benchmark/independent-smoke/independence.json
      - name: Download and verify exact approved photos
        run: |
          node scripts/download-reviewed-photos.mjs benchmark/independent-smoke/manifest.json
          node scripts/validate-100-photo-set.mjs benchmark/independent-smoke/manifest.json benchmark/photos 2 > benchmark/independent-smoke/photos.json
      - name: Run independent FashionCLIP browser smoke test
        run: |
          for attempt in 1 2 3; do
            if npm install --no-save --no-package-lock --fetch-retries=4 --fetch-retry-mintimeout=10000 playwright; then break; fi
            if [ "$attempt" -eq 3 ]; then echo "::error::Playwright install failed after 3 attempts"; exit 1; fi
            sleep $((attempt * 10))
          done
          npx playwright install --with-deps chromium
          node scripts/build.mjs
          node scripts/run-browser-photo-benchmark.mjs benchmark/independent-smoke/manifest.json benchmark/independent-smoke/results
          node scripts/report-independent-subtypes.mjs benchmark/independent-smoke/manifest.json benchmark/independent-smoke/results/results.json benchmark/independent-smoke/subtypes.json
      - name: Publish benchmark result summary
        if: always()
        run: |
          if [ -f benchmark/independent-smoke/subtypes.json ]; then
            node --input-type=module -e 'import {readFileSync,appendFileSync} from "node:fs";const x=JSON.parse(readFileSync("benchmark/independent-smoke/subtypes.json"));appendFileSync(process.env.GITHUB_STEP_SUMMARY,`## Closet Current independent recognition\n\n- Samples: ${x.sampleSize}\n- Correct categories: ${x.categoryCorrect}/${x.sampleSize}\n- Exact subtypes: ${x.exactSubtypeCorrect}/${x.sampleSize}\n- Acceptable subtypes: ${x.acceptableSubtypeCount}/${x.sampleSize}\n- Consistent wrong subtypes: ${x.consensusSubtypeMismatchCount}\n\nNo changes to production recognition.\n`);'
          else
            echo 'Independent recognition test did not produce a subtype report; see job logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload independent smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-approved-photo-smoke
          path: benchmark/independent-smoke/
          retention-days: 14
