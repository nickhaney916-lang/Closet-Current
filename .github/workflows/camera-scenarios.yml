name: Camera and indexing scenario tests
on:
  push:
    paths:
      - 'tests/**'
      - 'public/app.js'
      - 'public/outfit-capture.js'
      - 'public/**'
      - 'scripts/**'
      - '.github/workflows/camera-scenarios.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate production build
        run: node scripts/build.mjs
      - name: Install pinned Node regression test dependencies without changing production manifest
        run: npm install --no-save --no-package-lock --no-audit --no-fund fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 playwright@1.56.1 sharp@0.34.3
      - name: Run complete Node test suite (all application and recognition tests)
        run: node --test tests/*.test.cjs tests/*.test.mjs
