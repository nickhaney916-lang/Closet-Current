name: Camera and indexing scenario tests
on:
  push:
    paths:
      - 'tests/**'
      - 'public/app.js'
      - 'public/outfit-capture.js'
      - 'public/**'
      - 'scripts/**'
      - '.github/workflows/camera-scenarios.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Source-provenance tests require the pinned application ancestor.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate production build
        run: node scripts/build.mjs
      - name: Run complete Node test suite (all application and recognition tests)
        run: node --test tests/*.test.cjs tests/*.test.mjs
