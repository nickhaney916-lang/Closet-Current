name: Camera and indexing scenario tests
on:
  push:
    branches:
      - fix/mobile-recognition-timeout-diagnostics
    paths:
      - 'tests/**'
      - 'public/app.js'
      - 'public/outfit-capture.js'
      - 'public/**'
      - 'scripts/**'
      - 'benchmark/independent-candidates.json'
      - '.github/workflows/camera-scenarios.yml'
  workflow_dispatch:
concurrency:
  group: closet-camera-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate production build
        run: node scripts/build.mjs
      - name: Run complete Node test suite (all application and recognition tests)
        run: node --test tests/*.test.cjs tests/*.test.mjs
  collect-independent-photos:
    if: github.ref_name == 'fix/mobile-recognition-timeout-diagnostics' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect focused shell jacket and rainwear review photos
        env:
          CLOSET_COLLECTION_IDS: candidate-shell-001,candidate-shell-003,candidate-trench-001
        run: node scripts/collect-independent-photo-bytes.mjs
      - name: Summarize rainwear photo collection
        if: always()
        run: |
          if [ -f benchmark/photo-collection/report.json ]; then
            node --input-type=module -e 'import {readFileSync,appendFileSync} from "node:fs"; const rows=JSON.parse(readFileSync("benchmark/photo-collection/report.json")); const pending=rows.filter(x=>x.id.includes("shell")||x.id.includes("trench")); const output=["## Rainwear photo downloads","","| Photo candidate | Collection result |","|---|---|",...pending.map(x=>`| ${x.id} | ${x.status}${x.reason?" — "+x.reason:""} |`),"","Downloaded photos are **not approved** until image content, license, subtype and baseline independence are reviewed."]; appendFileSync(process.env.GITHUB_STEP_SUMMARY,output.join("\\n")+"\\n");'
          else
            echo 'Photo collector did not produce a report.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload photo review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-photo-collection
          path: benchmark/photo-collection/
          retention-days: 14
  independent-approved-photo-smoke:
    if: github.ref_name == 'fix/mobile-recognition-timeout-diagnostics' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare approved photos and guard against prior benchmark leakage
        run: |
          mkdir -p benchmark/independent-smoke
          node scripts/prepare-independent-photos.mjs benchmark/independent-candidates.json benchmark/independent-smoke/manifest.json benchmark/independent-smoke/coverage.json
          node -e "const r=require('./benchmark/independent-smoke/coverage.json');if(r.approvedCount<2)process.exit(1)"
          node scripts/assemble-reviewed-baseline.mjs benchmark/independent-smoke/baseline.json benchmark/manifest-reviewed-32.json benchmark/manifest-holdout-16.json benchmark/manifest-fresh-11.json
          node scripts/check-independent-validation.mjs benchmark/independent-smoke/baseline.json benchmark/independent-smoke/manifest.json benchmark/independent-smoke/independence.json
      - name: Download and verify exact approved photos
        run: |
          node scripts/download-reviewed-photos.mjs benchmark/independent-smoke/manifest.json
          node scripts/validate-100-photo-set.mjs benchmark/independent-smoke/manifest.json benchmark/photos 2 > benchmark/independent-smoke/photos.json
      - name: Run independent FashionCLIP browser smoke test
        run: |
          for attempt in 1 2 3; do
            if npm install --no-save --no-package-lock --fetch-retries=4 --fetch-retry-mintimeout=10000 playwright; then break; fi
            if [ "$attempt" -eq 3 ]; then echo "::error::Playwright install failed after 3 attempts"; exit 1; fi
            sleep $((attempt * 10))
          done
          npx playwright install --with-deps chromium
          node scripts/build.mjs
          node scripts/run-browser-photo-benchmark.mjs benchmark/independent-smoke/manifest.json benchmark/independent-smoke/results
          node scripts/report-independent-subtypes.mjs benchmark/independent-smoke/manifest.json benchmark/independent-smoke/results/results.json benchmark/independent-smoke/subtypes.json
      - name: Publish benchmark result summary
        if: always()
        run: |
          if [ -f benchmark/independent-smoke/subtypes.json ]; then
            node --input-type=module -e 'import {readFileSync,appendFileSync} from "node:fs";const x=JSON.parse(readFileSync("benchmark/independent-smoke/subtypes.json"));appendFileSync(process.env.GITHUB_STEP_SUMMARY,`## Closet Current independent recognition\n\n- Samples: ${x.sampleSize}\n- Correct categories: ${x.categoryCorrect}/${x.sampleSize}\n- Exact subtypes: ${x.exactSubtypeCorrect}/${x.sampleSize}\n- Acceptable subtypes: ${x.acceptableSubtypeCount}/${x.sampleSize}\n- Consistent wrong subtypes: ${x.consensusSubtypeMismatchCount}\n\nNo changes to production recognition.\n`);'
          else
            echo 'Independent recognition test did not produce a subtype report; see job logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload independent smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-approved-photo-smoke
          path: benchmark/independent-smoke/
          retention-days: 14
