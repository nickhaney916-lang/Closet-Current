name: Camera and indexing scenario tests
on:
  push:
    paths:
      - 'tests/**'
      - 'public/app.js'
      - 'public/outfit-capture.js'
      - 'public/taxonomy.js'
      - '.github/workflows/camera-scenarios.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test single-shot indexing, 100 images, 100 outfits, and segmentation safeguards
        run: node --test tests/automatic-indexing.test.cjs tests/outfit-capture.test.cjs tests/capture.test.cjs tests/recognition-index-coverage.test.mjs
