name: E2E-INTEGRATION-01 Camera Closet Original Source 163Bone 3D NO DEPLOY
on:
  pull_request:
    paths:
      - 'research/e2e-integration-01/**'
      - 'tests/e2e-integration-01.test.mjs'
      - 'scripts/test-e2e-integration-01-browser.mjs'
      - '.github/workflows/e2e-integration-01-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  camera-owner-index-outfit-real-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Pin original CAPTURE-PROOF SHA and strict research-only change scope
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor dbc3a75e508d006d6d87ffce69832246c2087890 HEAD
          git diff --name-only dbc3a75e508d006d6d87ffce69832246c2087890 HEAD | while IFS= read -r path; do
            case "$path" in
              research/e2e-integration-01/*|tests/e2e-integration-01.test.mjs|scripts/test-e2e-integration-01-browser.mjs|.github/workflows/e2e-integration-01-no-deploy.yml) ;;
              *) echo "Unauthorized research source delta: $path"; exit 1;;
            esac
          done
      - name: Install test-only approved browser and genuine 3D libraries
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 three@0.180.0 three-mesh-bvh@0.9.2 sharp@0.34.3
      - name: Fetch EXACT immutable donor PR541 and PR544 revisions without merging
        run: |
          git fetch --no-tags origin df6885d6011cb33fb22dceb81a08f35a0ac4dd61 eaccc4d7f945e2ea5af746f9486c5cccf03047e0
          git worktree add --detach .e2e-outfit-541 df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          git worktree add --detach .e2e-denim-544 eaccc4d7f945e2ea5af746f9486c5cccf03047e0
          git config --global --add safe.directory "$GITHUB_WORKSPACE/.e2e-outfit-541"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/.e2e-denim-544"
          ln -s ../node_modules .e2e-outfit-541/node_modules
          ln -s ../node_modules .e2e-denim-544/node_modules
          test "$(git -C .e2e-outfit-541 rev-parse HEAD)" = df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          test "$(git -C .e2e-denim-544 rev-parse HEAD)" = eaccc4d7f945e2ea5af746f9486c5cccf03047e0
          git diff --exit-code -- public/app.js public/auth.js public/outfit-board.js
      - name: Verify newly added bridge and real existing app 315+ regressions
        run: |
          node --check research/e2e-integration-01/three-owned-looks.mjs
          node --check research/e2e-integration-01/cross-branch-adapter.mjs
          node --check scripts/test-e2e-integration-01-browser.mjs
          node --check tests/e2e-integration-01.test.mjs
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Independent original donor owner and source-truth unit regressions
        run: |
          (cd .e2e-outfit-541 && node --test tests/outfit-3d-01.test.mjs tests/outfit-board.test.cjs tests/three-d-69-indexed-photo-real-3d.test.mjs)
          (cd .e2e-denim-544 && node --test tests/denim-visible-27.test.mjs)
      - name: Independently audit PR544 denim photography and release HOLD contract
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const m=await import('./.e2e-denim-544/research/denim-visible-27/source-honest-visual-gate.mjs');
          assert.equal(m.DENIM_VISUAL27.syntheticRearIsNotPhotography,true);
          assert.equal(m.DENIM_VISUAL27.humanPhotorealismApproved,false);
          assert.equal(m.DENIM_VISUAL27.physicalPhonesApproved,false);
          assert.equal(m.DENIM_VISUAL27.releaseAuthorized,false);
          assert.equal(m.DENIM_VISUAL27.familyAlpha,'HOLD');
          console.log('PR544 exact visual proof gate sourced; NEVER claimed photorealism');
          NODE
      - name: Generate source-honest licensed garment JPEG, masks and identity manifest from PR541
        run: |
          cd .e2e-outfit-541
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node scripts/build-work47-benchmark.mjs
      - name: Restore genuine approved CC0 anatomical male/female 163-bone GLBs
        run: |
          git fetch --no-tags origin 53f2ad344dc56a1477e343531c423aed0e66c17d dd6bac3fa9ff640d4f562cf925337440bdb5cf8f 3a572193987cb29389727426136c6eb3ac326783 dfb40889c4c1221fb1833b859e8a11ef38aeb76e
          cd .e2e-outfit-541
          node research/three-d-20/restore-approved-models.mjs
      - name: Cross-branch actual PR545 capture to real PR541 3D and private outfit saves
        run: node scripts/test-e2e-integration-01-browser.mjs
      - name: Existing exact PR541 real anatomical owner WebGL regression (not mocks)
        run: |
          cd .e2e-outfit-541
          node scripts/test-outfit-3d-01-browser.mjs
      - name: Require complete six-browser acceptance, genuine 3D and strict HOLD boundaries
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,existsSync} from 'node:fs';
          const r=JSON.parse(readFileSync('benchmark/e2e-integration-01/results.json','utf8'));
          assert.equal(r.verdict,'PASS');assert.equal(r.total,6);
          assert.deepEqual(r.results.map(x=>x.engine+':'+x.width),
           ['chromium:320','chromium:390','chromium:430','webkit:320','webkit:390','webkit:430']);
          assert.equal(r.errors.length,0);
          assert.equal(r.requests.filter(x=>x.method!=='GET').length,0);
          assert.equal(r.independentAccountsTested,true);
          assert.equal(r.realThreeDAssignment,true);
          assert.equal(r.originalPhotoByteShaVerified,true);
          assert.equal(r.productionDeployed,false);
          assert.equal(r.mockedRecognition,true);
          assert.equal(r.simulatedCamera,true);
          assert.equal(r.actualAuthenticatedCloud,false);
          assert.equal(r.physicalAndroidTested,false);
          assert.equal(r.physicalIphoneTested,false);
          assert.equal(r.originalUnphotographedRearPresentedAsPhoto,false);
          assert.equal(r.photorealismApproved,false);
          assert.equal(r.familyAlpha,'HOLD');
          assert.ok(r.screenshotsCount>=40);
          assert.ok(r.results.every(x=>x.actualApp&&x.realIndexedDB&&x.sourceSHA&&
           x.manualReviewSaved&&x.indexSixCategories&&x.threeDifferentOwnedLooks&&
           x.saveReloadOutfits&&x.reclassifiedOutfitReview&&x.unsupportedMeshesPhotoFallback&&
           !x.physicalPhones&&!x.productionChanged));
          assert.ok(r.results.filter(x=>x.engine==='chromium').every(x=>
           x.actualDonor3D&&x.realSourceDenim&&x.realSourceDress&&x.full360Control&&
           JSON.stringify(x.verified163BoneRigs)==='["female","male"]'));
          assert.ok(r.screenshots.every(s=>existsSync('benchmark/e2e-integration-01/'+s)));
          console.log('E2E-INTEGRATION-01 exact commit browser source and isolation PASS');
          NODE
      - name: Upload real Chromium WebGL, WebKit source-only and full E2E synthetic/browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E2E-INTEGRATION-01-REAL-CAMERA-JPEG-PRIVATE-CLOSET-3D-CHROMIUM-WEBKIT-HOLD
          path: |
            benchmark/e2e-integration-01/
            .e2e-outfit-541/benchmark/outfit-3d-01/results.json
          if-no-files-found: warn
