name: Assignment 19 owner troubleshooting HOLD
on:
  pull_request:
    branches: [research/assignment-19-accepted-baseline-HOLD]
permissions:
  contents: read
jobs:
  acceptance:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/assignment-19-owner-troubleshooting-HOLD'
    strategy:
      fail-fast: false
      matrix:
        lane: [regression, chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact candidate and independently accepted baseline
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = fefe69cd04c57515433985e6141f7f9f0951f6ab
      - name: Install pinned test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: node scripts/build.mjs
      - if: matrix.lane == 'regression'
        run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
      - if: matrix.lane != 'regression'
        env:
          A19_ENGINE: ${{ matrix.lane }}
        run: node scripts/test-assignment-19-browser.mjs
