name: Parallel 70 P841 garment-unit research — NO DEPLOY
on:
  push:
    branches: [research/parallel70-garment-unit-reconciliation-841-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p70-p841-garment-units-HOLD
  cancel-in-progress: true
jobs:
  exact-parent-native-tests-HOLD:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact P840 ancestry and isolated eight-path scope
        run: |
          set -euo pipefail
          BASE=c44166443e52ac7487ea84d8218098ff629610d2
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD >/tmp/changed-p841
          cat /tmp/changed-p841
          test "$(wc -l </tmp/changed-p841)" -eq 8
          while IFS= read -r p; do
            case "$p" in
              public/garment-unit-reconciliation-70.mjs|public/outfit-instance-review-840.mjs|public/outfit-worker.mjs|tests/garment-unit-reconciliation-70.test.mjs|tests/outfit-instance-review-840.test.mjs|tests/outfit-capture.test.cjs|research/parallel70-garment-unit-reconciliation-841/REPORT.md|.github/workflows/parallel70-garment-unit-reconciliation-841-no-deploy.yml) ;;
              *) echo "UNSCOPED P841 CHANGE: $p"; exit 1 ;;
            esac
          done </tmp/changed-p841
          test -z "$(git diff --name-only "$BASE" HEAD -- public/app.js public/local-worker.mjs public/recognition-engine.mjs supabase benchmark)"
          grep -Fq 'FAMILY ALPHA HOLD #255' research/parallel70-garment-unit-reconciliation-841/REPORT.md
      - name: Check sources and isolated reconciliation tests
        run: |
          set -euo pipefail
          node --check public/garment-unit-reconciliation-70.mjs
          node --check public/outfit-instance-review-840.mjs
          node --check public/outfit-worker.mjs
          node --test tests/garment-unit-reconciliation-70.test.mjs tests/outfit-instance-review-840.test.mjs tests/outfit-capture.test.cjs tests/outfit-worker.test.mjs
      - name: Install app build and browser test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Full native regression and no-account build
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
