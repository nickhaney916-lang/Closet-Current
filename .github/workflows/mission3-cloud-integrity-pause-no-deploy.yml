name: Mission 3 owner-durable cloud photo integrity quarantine — NO DEPLOY
on:
  push:
    branches: [research/mission3-cloud-integrity-retry-stop-20261110-HOLD]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atomic-local-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin exact verified Mission 3 persistent device quota parent and strict no-deploy scope
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=6a122c8a194acc018566a46e3a33b35dc16ca9ad
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --exit-code "$BASE" HEAD -- public/auth.js public/app.js public/cloud-backup-engine.js supabase public/local-worker.mjs public/recognition-engine.mjs
          git diff --name-only "$BASE" HEAD | while read -r p; do
            case "$p" in
              public/cloud-backup.js|tests/mission3-cloud-integrity-retry-pause.test.cjs|scripts/test-mission3-cloud-integrity-pause-browser.mjs|research/mission3-cloud-integrity-pause/REPORT.md|.github/workflows/mission3-cloud-integrity-pause-no-deploy.yml) ;;
              *) echo "Mission 3 unexpected integrity quarantine path: $p"; exit 1 ;;
            esac
          done
      - name: Install pinned independent browser/IndexedDB dependencies
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Confirm parent lacked persistent cloud object-integrity quarantine
        run: |
          git worktree add --detach /tmp/closet-mission3-integrity-parent 6a122c8a194acc018566a46e3a33b35dc16ca9ad
          CLOUD_SOURCE_ROOT=/tmp/closet-mission3-integrity-parent EXPECT_BASELINE=1 node --test tests/mission3-cloud-integrity-retry-pause.test.cjs
      - name: Verify corrupt JPEG SHA quarantine, owner isolation, reload and manual repair
        run: node --test tests/mission3-cloud-integrity-retry-pause.test.cjs
      - name: Build complete application and run entire serial Node regression
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Real Chromium/WebKit 320 390 430 CORRUPT SHA reload quarantine, no cloud retry, manual repair
        run: node scripts/test-mission3-cloud-integrity-pause-browser.mjs benchmark/mission3-cloud-integrity-pause-browser
      - name: Real Chromium/WebKit 320 390 430 RELOAD persistent quota pause, zero cloud requests, manual recovery
        run: node scripts/test-mission3-persistent-device-quota-browser.mjs benchmark/mission3-persistent-device-quota-browser
      - name: Real Chromium/WebKit 320 390 430 actual IndexedDB quota abort and manual restoration
        run: node scripts/test-mission3-device-quota-restore-browser.mjs benchmark/mission3-device-quota-atomic-browser
      - name: Real Chromium/WebKit 320 390 430 owner capacity reload/retry and accessibility
        run: node scripts/test-mission3-durable-capacity-browser.mjs benchmark/mission3-device-quota-durable-mobile
      - name: Real Chromium synthetic-owner original/cutout cloud recovery and private outfits
        run: |
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos commons-0002
          node scripts/test-outfit-backup-compatibility-browser.mjs benchmark/mission3-device-quota-private-backup
      - name: Real Chromium and WebKit 320 390 430 original-to-private-closet styling
        run: node scripts/test-native-canonical-original-167-browser.mjs
      - name: Real Chromium and WebKit mobile quota recovery/accessibility
        run: node scripts/test-family-reliability-mobile.mjs
      - name: Keep only synthetic browser JPEG screenshots and test receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission3-cloud-integrity-pause-evidence-HOLD
          path: |
            benchmark/mission3-cloud-integrity-pause-browser/
            benchmark/mission3-persistent-device-quota-browser/
            benchmark/mission3-device-quota-atomic-browser/
            benchmark/mission3-device-quota-durable-mobile/
            benchmark/mission3-device-quota-private-backup/
            benchmark/native-canonical-closet-style-167/
            benchmark/family-reliability-mobile/
          retention-days: 14
