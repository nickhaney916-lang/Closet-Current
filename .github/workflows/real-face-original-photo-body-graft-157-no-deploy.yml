      - name: Download exact original MIT-licensed male/female GLBs into disposable CI and physically rebuild verified textured HEAD + HAIR with no source clothing
        run: |
          set -eu
          SRC=https://raw.githubusercontent.com/927tanmay/react-ai-voice-avatar/fc1398c2f8ba600c3676a5277684ed4f3e2731d7/assets/avatars
          mkdir -p benchmark/dual-human-foundation-candidate-155/assets
          for f in ananya.glb aarav.glb; do
            curl --fail --silent --show-error --location --retry 3 --max-time 180 "$SRC/$f" -o "benchmark/dual-human-foundation-candidate-155/assets/$f"
          done
          curl --fail --silent --show-error --location --retry 3 --max-time 50 "$SRC/LICENSE.md" -o benchmark/dual-human-foundation-candidate-155/assets/CONVERTED-PROVENANCE-LICENSE.md
          curl --fail --silent --show-error --location --retry 3 --max-time 50 https://raw.githubusercontent.com/microsoft/Microsoft-Rocketbox/master/LICENSE.md -o benchmark/dual-human-foundation-candidate-155/assets/ORIGINAL-MICROSOFT-MIT.md
          grep -q "Male_Adult_04" benchmark/dual-human-foundation-candidate-155/assets/CONVERTED-PROVENANCE-LICENSE.md
          grep -q "Female_Adult_07" benchmark/dual-human-foundation-candidate-155/assets/CONVERTED-PROVENANCE-LICENSE.md
          grep -q "MIT License" benchmark/dual-human-foundation-candidate-155/assets/ORIGINAL-MICROSOFT-MIT.md
          node research/rocketbox-wardrobe-separation-156/analyze-source-anatomy.mjs
          node research/rocketbox-wardrobe-separation-156/extract-source-head.mjs
          node scripts/install-real-face-original-outfit-157.mjs .p150-donor-541
          node --check .p150-donor-541/research/real-face-original-photo-body-graft-157/attach-licensed-head.mjs
