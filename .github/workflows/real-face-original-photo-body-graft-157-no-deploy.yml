          cp benchmark/dual-humanoid-photorealistic-integration-150/*.png benchmark/real-face-original-photo-body-graft-157/after/
          cp benchmark/dual-humanoid-photorealistic-integration-150/screens-*.json benchmark/real-face-original-photo-body-graft-157/after/
          cp benchmark/native-3d-05/results.json benchmark/real-face-original-photo-body-graft-157/after/native-result.json
          test "$(find benchmark/real-face-original-photo-body-graft-157/after -name '*.png' | wc -l)" -eq 18
      - name: Actual WebKit original source photo owner-saved dress 163-bone WebGL at 320 390 and 430px with original licensed head and no double mannequin face
