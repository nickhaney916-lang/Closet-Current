          test "$(git -C .p150-donor-541 rev-parse HEAD)" = df6885d6011cb33fb22dceb81a08f35a0ac4dd61
      - name: AFTER same original saved-owner dress with actual authenticated 163-bone humanoid and source MIT 80-bone face/hair graft on REAL Chromium mobile
        run: |
          P150=1 P150_TIMEOUT=45000 node scripts/test-native-3d-05-p150-157.mjs
