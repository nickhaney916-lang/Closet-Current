        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const x=JSON.parse(readFileSync('benchmark/real-face-original-photo-body-graft-157/audit/acceptance.json','utf8'));
          assert.equal(x.actualGenuineChromiumBeforeAfterViews,18);
