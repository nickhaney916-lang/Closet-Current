name: P157 LICENSED REAL HEAD ORIGINAL 163-BONE PHOTO OUTFIT EXACT WEBGL NO DEPLOY
on:
  push:
    branches:
      - research/real-face-original-photo-body-graft-157-main-20261107-HOLD
  pull_request:
    branches:
      - research/rocketbox-wardrobe-separation-156-main-20261107-HOLD
    paths:
      - research/real-face-original-photo-body-graft-157/**
      - scripts/install-real-face-original-outfit-157.mjs
      - scripts/audit-real-face-original-photo-body-graft-157.mjs
      - tests/real-face-original-photo-body-graft-157.test.mjs
