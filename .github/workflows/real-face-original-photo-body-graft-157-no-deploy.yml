          P150=1 node scripts/test-native-3d-05-p150-157.mjs
          mkdir -p benchmark/real-face-original-photo-body-graft-157/before
          cp benchmark/dual-humanoid-photorealistic-integration-150/*.png benchmark/real-face-original-photo-body-graft-157/before/
