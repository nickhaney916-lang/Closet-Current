name: M1 P804 real SAM2 on native browser non-oracle original box — NO DEPLOY
on:
  push:
    branches: [research/mission1-browser-owner-box-real-sam2-804-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m1-p804-real-SAM2-native-browser-box-HOLD-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pinned-parent-full-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact independently green P803 head, ONLY seven source/research/test/CI files, NO DEPLOY
        run: |
          set -euo pipefail
          BASE=820cff708bb318b01c615d69838d4bd20cadb6ba
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD >/tmp/m1-p804-paths
          test "$(wc -l </tmp/m1-p804-paths)" -eq 7
          while read -r path; do
            case "$path" in
              public/owner-original-photo-point-798.mjs|public/app.js|scripts/test-mission1-real-segformer-to-closet-782-browser.mjs|scripts/test-mission1-browser-box-sam2-804.py|tests/test_mission1_native_browser_box_sam2_804.py|research/mission1-browser-owner-box-real-sam2-804/REPORT.md|.github/workflows/mission1-browser-owner-box-real-sam2-804-no-deploy.yml) ;;
              *) echo "UNAUTHORIZED SOURCE/AUTH/CLOUD/MODEL/PRODUCTION CHANGE: $path"; exit 1 ;;
            esac
          done </tmp/m1-p804-paths
          test -z "$(git diff --name-only "$BASE" HEAD -- supabase public/local-worker.mjs public/auth.js public/cloud-backup.js public/native-reviewed-private-save-167.mjs public/local-catalog.mjs public/photo-color.js benchmark)"
          grep -Fq 'FAMILY ALPHA HOLD #255' research/mission1-browser-owner-box-real-sam2-804/REPORT.md
          echo M1_P804_STRICT_SEVEN_PATHS_PINNED_P803_NO_DEPLOY
      - name: Install full native build/regression test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Full Node app/cloud/3D, original owner source and regression suite
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check public/owner-original-photo-point-798.mjs
          node --check scripts/test-mission1-real-segformer-to-closet-782-browser.mjs
          python3 -m py_compile scripts/test-mission1-browser-box-sam2-804.py tests/test_mission1_native_browser_box_sam2_804.py
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs

  real-native-original-box-browser-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      MULTI16_RELAY_MODEL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install actual Chromium/WebKit original source-model/native app runner
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3
      - name: Actual native Adjust original JPEG owner RECTANGLE POINT from Chromium/WebKit + private fixture review
        run: node scripts/test-mission1-real-segformer-to-closet-782-browser.mjs
      - name: Prove two browser gestures came from native source not publisher oracle or independent humans
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const x=JSON.parse(readFileSync('benchmark/mission1-real-model-native-closet-782/browser-results.json'));
          assert.equal(x.researchOnly,true);assert.equal(x.releaseAuthorized,false);assert.equal(x.familyAlpha,'HOLD');
          assert.deepEqual(new Set(x.scenarios.map(v=>v.browser)),new Set(['chromium','webkit']));
          for(const s of x.scenarios){
            const p=s.sourcePromptForActualSAM2804;
            assert.equal(p.schema,'closet-current-m1-original-native-gesture-sam2-research-804/v1');
            assert.equal(p.sourceId,'commons-0053');
            assert.equal(p.sourceSHA256,s.realModelOriginalSHA256);
            assert.ok(Number.isInteger(p.originalWidth)&&p.originalWidth>=8&&p.originalWidth<=3072);
            assert.ok(Number.isInteger(p.originalHeight)&&p.originalHeight>=8&&p.originalHeight<=3072);
            assert.ok(p.originalPixelBox[0]>=0&&p.originalPixelBox[2]<=p.originalWidth);
            assert.ok(p.originalPixelBox[1]>=0&&p.originalPixelBox[3]<=p.originalHeight);
            assert.equal(p.actualOriginalGestureInNativeAdjust,true);
            assert.equal(p.publisherPolygonNotUsedToConstructPrompt,true);
            assert.equal(p.automatedPlaywrightFixture,true);
            assert.equal(p.independentHumanDrawnBox,false);
            assert.equal(p.ownerApprovedMask,false);
            assert.equal(p.privateOwnerPhoto,false);
            assert.equal(p.autoSaveAllowed,false);
            assert.equal(s.actualOriginalSourceOwnerMask803ManualCorrectionPointerAndKeyboard,true);
            assert.equal(s.actualOriginalSourceOwnerMask803NoApprovalOrPrivatePersistence,true);
            assert.equal(s.actualOriginalSourceOwnerBox800NotPersisted,true);
            assert.equal(s.actualHumanGroundTruthIndependentlyVerified,false);
            assert.equal(s.actualSignedCloudRLS,false);
            assert.equal(s.physicalPhoneTested,false);
            assert.equal(s.actualMyClosetSaved,true);
          }
          console.log('M1_P804_ACTUAL_NATIVE_CHROMIUM_WEBKIT_GESTURE_ORIGINAL_SOURCE_PIXELS_NO_PUBLISHER_ORACLE_NO_HUMAN_CLAIM');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission1-P804-native-original-JPEG-actual-browser-gesture-SAM2-input-HOLD
          path: benchmark/mission1-real-model-native-closet-782/
          retention-days: 14
          if-no-files-found: warn

  actual-pinned-sam2-owner-browser-box-CPU:
    needs: real-native-original-box-browser-provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only pinned numeric/image/CPU model packages
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.1.3 pillow==11.1.0 onnxruntime==1.23.2
      - uses: actions/download-artifact@v4
        with:
          name: mission1-P804-native-original-JPEG-actual-browser-gesture-SAM2-input-HOLD
          path: benchmark/mission1-real-model-native-closet-782
      - name: Reject fake human, forged source SHA, wrong original geometry, oracle, bad owner approval
        run: python -m unittest discover -s tests -p 'test_mission1_native_browser_box_sam2_804.py' -v
      - name: REAL source SHA pinned SAM2 ONNX original JPEG encoder and four native-browser box/pointBox decodes
        run: |
          set -euo pipefail
          python scripts/test-mission1-browser-box-sam2-804.py
      - name: Strict real model mask proof without human IoU, private owner approval or phone claim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("benchmark/mission1-native-gesture-real-sam2-804/real-native-browser-box-sam2-results.json").read_text())
          assert x["schema"]=="m1-p804-original-native-gesture-pinned-real-sam2-no-human-truth/v1"
          assert x["familyAlpha"]=="HOLD" and x["releaseAuthorized"] is False
          assert x["actualRealNativeBrowserGesturePrompts"]==2
          assert x["actualIndependentHumanGesturePrompts"]==0
          assert x["publisherMaskTruthWasUsedForPrompts"] is False
          assert x["modelPredictedIoUIsNotGroundTruth"] is True
          assert x["modelRunInHostedLinuxRunnerNotPhysicalPhone"] is True
          assert x["actualPhysicalPhoneTests"]==0 and x["independentBlindHumanMaskReviewers"]==0
          assert x["ownerMaskApproved"] is False and x["privateCutoutSaved"] is False
          assert len(x["arms"])==4
          assert set((r["browser"],r["promptArm"]) for r in x["arms"])=={
            ("chromium","box"),("chromium","pointBox"),("webkit","box"),("webkit","pointBox")}
          for r in x["arms"]:
            assert r["actualPinnedONNXEncoderExecuted"] is True
            assert r["actualPinnedONNXDecoderExecuted"] is True
            assert r["sam2PromptCodes"]==([2,3] if r["promptArm"]=="box" else [1,2,3])
            assert r["independentHumanMaskIoU"] is None
            assert r["independentRealHumanGesture"] is False
            assert r["oraclePolygonDerivedPrompt"] is False
            assert r["autoSaveAllowed"] is False
            assert Path("benchmark/mission1-native-gesture-real-sam2-804",r["maskFile"]).is_file()
          print("M1_P804_REAL_SAM2_ORIGINAL_BROWSER_BOX_POINT_FOUR_DECODES_NO_TRUTH_OR_RELEASE")
          PY
      - name: Purge downloaded model checkpoint weights before public evidence upload
        if: always()
        run: rm -rf /tmp/m1-sam2-796-weights
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission1-P804-actual-non-oracle-native-browser-SAM2-source-mask-unverified-NO-DEPLOY
          path: benchmark/mission1-native-gesture-real-sam2-804/
          retention-days: 14
          if-no-files-found: warn
