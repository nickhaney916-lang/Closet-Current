name: MAIN235 active model owner session switch privacy no-deploy HOLD
on:
  push:
    branches: [research/main235-active-model-owner-switch-isolation-HOLD]
  pull_request:
    branches: [research/main233-stopped-model-manual-source-v4-HOLD]
permissions:
  contents: read
jobs:
  inherited-security:
    name: M235 immutable source, offline app and complete owner privacy regression
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Two-file exact diff and consumer source gate
        shell: bash
        run: |
          set -euo pipefail
          BASE=c876b964fd94da2e47d3cda3576787b07c633aeb
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE" HEAD)" = "$(printf '%s\n' '.github/workflows/main235-active-worker-owner-switch-no-deploy.yml' 'scripts/test-main235-original-model-active-owner-switch-browser.mjs')"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:public/app.js)" = 835b4ad1f4a4a7f520aad5afd225134e5ea56e2d
          test "$(git rev-parse HEAD:research/multi-garment-capture-01/review-ui.mjs)" = 1bd97b80b51fab1cb269ae565acb73a274b6e6d0
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          test "$(git rev-parse HEAD:scripts/test-main231-stalled-p94-native-owner-manual-browser.mjs)" = e853f1bc693e0359fd079a0017f5279911ecfc9d
          test "$(git rev-parse HEAD:scripts/test-main235-original-model-active-owner-switch-browser.mjs)" = f64b87f4e879fef2afbae5d3c8fac83b606b6151
          node --check scripts/test-main235-original-model-active-owner-switch-browser.mjs
      - name: Pinned full app dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Build offline app and full original security/owner/backup Node suite
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  genuine-browser:
    name: M235 real native owner-switch race + separate unchanged real SegFormer (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, chromium]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert pinned exact original and owner isolation test
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor c876b964fd94da2e47d3cda3576787b07c633aeb HEAD
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:research/multi-garment-capture-01/review-ui.mjs)" = 1bd97b80b51fab1cb269ae565acb73a274b6e6d0
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          test "$(git rev-parse HEAD:scripts/test-main235-original-model-active-owner-switch-browser.mjs)" = f64b87f4e879fef2afbae5d3c8fac83b606b6151
      - name: Original native Playwright and local app dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Native owner A logout DURING original P94 ONNX load, distinct B JPEG and A/B return (320/430)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          for width in 320 430; do
            echo "M235 original pinned Worker active on $M58_ENGINE at $width"
            P94_WIDTH="$width" node scripts/test-main235-original-model-active-owner-switch-browser.mjs
          done
      - name: Independently unchanged positive full SegFormer browser source-private 2D v4 owner test 430
        run: P94_WIDTH=430 node scripts/test-parallel94-native-p88-browser.mjs
