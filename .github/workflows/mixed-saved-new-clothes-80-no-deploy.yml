name: MIXED80 save only NEW confirmed clothes with owner-consented duplicate exclusion NO DEPLOY
on:
  push:
    branches:
      - research/mixed-saved-new-clothes-80-main-20261105-HOLD
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-mixed-duplicate-new-reviewed-garments-with-owner-consent:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Lock exact verified SNAPSHOT78 parent and five research-only changed paths
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 0117f227b65ce2ae72729ca864ef38e26e6b74ce HEAD
          git diff --name-only 0117f227b65ce2ae72729ca864ef38e26e6b74ce HEAD >/tmp/mixed80-files
          while IFS= read -r path; do
            case "$path" in
              research/multi-garment-capture-01/previously-saved-review-80.mjs|research/multi-garment-capture-01/review-ui.mjs|tests/mixed-saved-new-clothes-80.test.mjs|scripts/test-multi-garment-capture-01-browser.mjs|scripts/audit-mixed-saved-new-clothes-80-browser.mjs|.github/workflows/mixed-saved-new-clothes-80-no-deploy.yml) ;;
              *) echo "BLOCKED unrelated production/staging mutation: $path"; exit 1 ;;
            esac
          done </tmp/mixed80-files
      - name: Install pinned test-only research dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Build app and all inherited plus nine new owner-source duplicate partition Node tests
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Six inherited full original-JPEG owner-private native browser workflows
        run: node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Six native owner-consented mixed saved and new real-photo browser workflows
        run: MIXED80=1 node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Independently audit six browser cases and 72 real PNG screenshots
        run: node scripts/audit-mixed-saved-new-clothes-80-browser.mjs
      - name: Archive sanitized SHA-pinned genuine-source evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MIXED80-owner-consented-new-only-reviewed-HOLD
          path: |
            benchmark/mixed-saved-new-clothes-80/acceptance.json
            benchmark/mixed-saved-new-clothes-80/*.png
          if-no-files-found: warn
          retention-days: 14
