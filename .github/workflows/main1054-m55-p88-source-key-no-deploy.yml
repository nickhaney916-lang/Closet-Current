name: MAIN1054 M55 source bound P88 garment identity no deploy
on:
  push:
    branches: [research/main1054-m55-p88-source-key-admission-HOLD]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  m55-p88-original-owner-mask-lease:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Freeze M54 parent and exact independent P88 worker; prevent consumer changes
        shell: bash
        run: |
          set -euo pipefail
          BASE=8287b7a4177251d896529dce8f19f01aaea44a73
          P88=cc4554ef0104506a72bf0a28423fee52b6e4fff2
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse "$P88:public/outfit-worker.mjs")" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          git diff --exit-code "$BASE" HEAD -- public/ supabase/ benchmark/ research/parallel89/ research/mission1-parallel88/ research/native-3d-05/ research/multi-garment-capture-01/
          git diff --name-only "$BASE" HEAD | while IFS= read -r path; do
            case "$path" in
              research/master-consolidation-1054/p88-source-key-adapter-55.mjs|research/master-consolidation-1054/MILESTONE55.md|tests/main55-p88-source-key-lease.test.mjs|.github/workflows/main1054-m55-p88-source-key-no-deploy.yml) ;;
              *) echo "Unexpected M55 path: $path"; exit 1;;
            esac
          done
          node --check research/master-consolidation-1054/p88-source-key-adapter-55.mjs
          node --check tests/main55-p88-source-key-lease.test.mjs
      - name: Install local research test dependencies only
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 playwright@1.56.1 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Check exact licensed original SHA, P88 bound mask/ordinal, stale lease and inherited M54 veto
        run: node --test tests/main55-p88-source-key-lease.test.mjs tests/main54-unresolved-multi-mask-owner-veto.test.mjs tests/bounded-detection-review-58.test.mjs
      - name: Build unchanged consumer assets BEFORE inherited offline/PWA tests
        run: node scripts/build.mjs
      - name: Full inherited no-deploy Node regression
        run: node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Reassert original JPEG/consumer/cloud/other mission source untouched
        run: git diff --exit-code 8287b7a4177251d896529dce8f19f01aaea44a73 HEAD -- public/ supabase/ benchmark/ research/parallel89/ research/mission1-parallel88/ research/native-3d-05/ research/multi-garment-capture-01/
