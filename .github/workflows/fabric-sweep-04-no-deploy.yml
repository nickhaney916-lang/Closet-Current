name: DRESS-FIT-05 Original-Photo Dress Settle and Freeze + SWEEP-04 NO DEPLOY HOLD
on:
  pull_request:
    paths:
      - 'research/fabric-sweep-04/**'
      - 'research/dress-fit-05/**'
      - 'scripts/test-fabric-sweep-04-browser.mjs'
      - 'tests/fabric-sweep-04.test.mjs'
      - 'tests/dress-fit-05.test.mjs'
      - '.github/workflows/fabric-sweep-04-no-deploy.yml'
permissions:
  contents: read
jobs:
  source-and-genuine-skinned-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Assert exact successful PR505 ancestor and NO production or sibling changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 7716c3876284bfa474f9964e7d5b0e69f629d79b HEAD
          git diff --name-only 7716c3876284bfa474f9964e7d5b0e69f629d79b HEAD | while IFS= read -r path; do
            case "$path" in
              research/fabric-sweep-04/*|research/dress-fit-05/*|scripts/test-fabric-sweep-04-browser.mjs|tests/fabric-sweep-04.test.mjs|tests/dress-fit-05.test.mjs|.github/workflows/fabric-sweep-04-no-deploy.yml) ;;
              *) echo "UNAUTHORIZED sibling or production edit: $path"; exit 1 ;;
            esac
          done
      - name: Offline original source photograph and genuine skinned research runtime
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 three@0.180.0 playwright@1.56.1 three-mesh-bvh@0.9.2
      - name: Static JS safety, unit tests, preservation of previous 3D verified research
        run: |
          node --check research/fabric-sweep-04/continuous-gait-phase.mjs
          node --check research/fabric-sweep-04/dress-outfit-controller.mjs
          node --check research/fabric-sweep-04/dress-mobile-showroom.mjs
          node --check research/fabric-sweep-04/wardrobe-demo.mjs
          node --check research/dress-fit-05/static-source-dress-fit.mjs
          node --check scripts/test-fabric-sweep-04-browser.mjs
          node --test tests/dress-fit-05.test.mjs tests/fabric-sweep-04.test.mjs tests/fabric-folds-03.test.mjs tests/fabric-walk-02.test.mjs tests/fabric-motion-01.test.mjs tests/integration-04-wardrobe-dress.test.mjs tests/dress-mobile-01.test.mjs tests/three-d-78-original-anatomical-knee-poses.test.mjs
      - name: Generate unchanged source photograph / original garment segmentation
        run: |
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node scripts/build-work47-benchmark.mjs
          node --test tests/three-d-31-jeans-source.test.mjs tests/three-d-37-source-true.test.mjs
      - name: Restore SHA-verified CC0 male/female original anatomical 163-bone GLBs
        run: |
          git fetch --no-tags origin 53f2ad344dc56a1477e343531c423aed0e66c17d dd6bac3fa9ff640d4f562cf925337440bdb5cf8f 3a572193987cb29389727426136c6eb3ac326783 dfb40889c4c1221fb1833b859e8a11ef38aeb76e
          node research/three-d-20/restore-approved-models.mjs
      - name: Test original 163-bone 44 real WebGL screenshots and 18 dense gait contact frames
        run: node scripts/test-fabric-sweep-04-browser.mjs
      - name: Assert genuine photographed rig evidence and strict family release HOLD
        run: |
          node --input-type=module <<'CHECK'
          import assert from 'node:assert/strict';
          import {readFileSync,readdirSync} from 'node:fs';
          const dir='benchmark/fabric-sweep-04',r=JSON.parse(readFileSync(dir+'/browser-results.json'));
          assert.equal(r.screenshots,44);
          assert.equal(readdirSync(dir).filter(s=>s.endsWith('.png')).length,44);
          assert.deepEqual(r.mobileWidths,[320,390,430]);
          assert.deepEqual(r.originalFigures,['female','male']);
          assert.ok(r.cases.length===6&&r.cases.every(x=>x.leftChangedPixels>=50&&x.rightChangedPixels>=50&&x.resetChangedPixels===0));
          assert.equal(r.realTriangleContactAudits.length,2);
          assert.equal(r.ninePhaseSkinnedContactSweeps.length,2);
          assert.ok(r.ninePhaseSkinnedContactSweeps.every(x=>x.phaseSamples.length===9&&x.sampledNoNewContacts));
          assert.equal(r.allEighteenSampledPhasesNoNewContacts,true);
          assert.equal(r.mathematicallySweptCollisionCertified,false);
          assert.equal(r.sourceNeutralPoseDrape03Verified,true);
          assert.equal(r.originalSourceFoldComparedInSameGaitPose,true);
          assert.ok(r.cases.filter(x=>x.actualWebGLFoldBeforeAfterChangedPixels!==null)
            .every(x=>x.actualWebGLFoldBeforeAfterChangedPixels>=5));
          assert.ok(r.realTriangleContactAudits.every(x=>
            x.crossedSegmentsAtLeftStep<=x.crossedSegmentsAtRest&&
            x.crossedSegmentsAtRightStep<=x.crossedSegmentsAtRest),
            'True anatomy source dress must not add body intersections on either step');
          assert.equal(r.genuineAnatomicalHipKneeAndPelvisMotion,true);
          assert.equal(r.clothRespondsToBodyGait,true);
          assert.equal(r.exactPoseAndClothReset,true);
          assert.equal(r.sourcePhotoRestUVAndSkinUnmodified,true);
          assert.equal(r.defaultOff,true);
          assert.equal(r.continuousCollisionCertified,false);
          assert.equal(r.walkingFootPlantPhysicsCertified,false);
          assert.equal(r.physicalAndroidIphoneVerified,false);
          assert.equal(r.realUserPhotosUsed,false);
          assert.equal(r.productionModified,false);
          assert.equal(r.familyAlpha,'HOLD');
          assert.equal(r.releaseAuthorized,false);
          CHECK
      - name: Verify original photographed dress static fit, genuine WebGL freeze proof and no release
        run: |
          node --input-type=module <<'CHECK'
          import assert from 'node:assert/strict';
          import {readFileSync,readdirSync} from 'node:fs';
          const dir='benchmark/dress-fit-05',r=JSON.parse(readFileSync(dir+'/results.json'));
          assert.equal(r.frozenDress.length,6);
          assert.equal(r.frozenWebGLImages,24);
          assert.equal(readdirSync(dir).filter(x=>x.endsWith('.png')).length,24);
          assert.deepEqual(r.mobileWidths,[320,390,430]);
          assert.deepEqual(r.originalFigures,['female','male']);
          assert.ok(r.frozenDress.every(x=>x.sourceSHA256==='e7a617cd23a159864f619e8397d5f37d48b684e47dddc4ad6b46b14481042019'&&
            x.account==='fixture-account-a'&&x.changedWebGLPixels>=8&&
            x.rotationDriftPixels<=2&&x.repeatDriftPixels<=2&&
            x.originalPhotoFrontUntouched&&x.sourceRestAndSkinPreserved&&
            x.bodyContactsAfter<=x.bodyContactsBefore&&x.sourceColorAndShaderUnmodified));
          assert.equal(r.actualVerifiedSource,true);
          assert.equal(r.originalPhotoUnchanged,true);
          assert.equal(r.realPhoneApproved,false);
          assert.equal(r.visualPhotorealismApproved,false);
          assert.equal(r.familyAlpha,'HOLD');
          assert.equal(r.releaseAuthorized,false);
          assert.equal(r.productionModified,false);
          CHECK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRESS-FIT-05-24-REAL-WEBGL-STATIC-PHOTO-HOLD
          path: benchmark/dress-fit-05/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SWEEP-04-REAL-PHOTO-DRESS-44-WEBGL-HOLD
          path: benchmark/fabric-sweep-04/
          if-no-files-found: warn
