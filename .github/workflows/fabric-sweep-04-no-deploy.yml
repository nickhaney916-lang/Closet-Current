name: SOURCE-TOUCH-12 Native Chromium Touch Gesture Source-Coverage QA HOLD
on:
  pull_request:
    paths:
      - 'research/fabric-sweep-04/**'
      - 'research/dress-fit-05/**'
      - 'research/denim-fit-06/**'
      - 'scripts/test-fabric-sweep-04-browser.mjs'
      - 'tests/fabric-sweep-04.test.mjs'
      - 'tests/dress-fit-05.test.mjs'
      - 'tests/denim-fit-06.test.mjs'
      - 'tests/denim-silhouette-07.test.mjs'
      - 'tests/denim-fairing-08.test.mjs'
      - 'tests/denim-angle-09.test.mjs'
      - 'tests/source-photo-coverage-10.test.mjs'
      - 'tests/garment-pixel-witness-10.test.mjs'
      - '.github/workflows/fabric-sweep-04-no-deploy.yml'
permissions:
  contents: read
jobs:
  source-and-genuine-skinned-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Assert exact successful PR505 ancestor and NO production or sibling changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 7716c3876284bfa474f9964e7d5b0e69f629d79b HEAD
          git diff --name-only 7716c3876284bfa474f9964e7d5b0e69f629d79b HEAD | while IFS= read -r path; do
            case "$path" in
              research/fabric-sweep-04/*|research/dress-fit-05/*|research/denim-fit-06/*|scripts/test-fabric-sweep-04-browser.mjs|tests/fabric-sweep-04.test.mjs|tests/dress-fit-05.test.mjs|tests/denim-fit-06.test.mjs|tests/denim-silhouette-07.test.mjs|tests/denim-fairing-08.test.mjs|tests/denim-angle-09.test.mjs|tests/source-photo-coverage-10.test.mjs|tests/garment-pixel-witness-10.test.mjs|.github/workflows/fabric-sweep-04-no-deploy.yml) ;;
              *) echo "UNAUTHORIZED sibling or production edit: $path"; exit 1 ;;
            esac
          done
      - name: Offline original source photograph and genuine skinned research runtime
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 three@0.180.0 playwright@1.56.1 three-mesh-bvh@0.9.2
      - name: Static JS safety, unit tests, preservation of previous 3D verified research
        run: |
          node --check research/fabric-sweep-04/continuous-gait-phase.mjs
          node --check research/fabric-sweep-04/dress-outfit-controller.mjs
          node --check research/fabric-sweep-04/dress-mobile-showroom.mjs
          node --check research/fabric-sweep-04/wardrobe-demo.mjs
          node --check research/dress-fit-05/static-source-dress-fit.mjs
          node --check research/denim-fit-06/static-source-denim-fit.mjs
          node --check tests/denim-silhouette-07.test.mjs
          node --check tests/denim-fairing-08.test.mjs
          node --check tests/denim-angle-09.test.mjs
          node --check tests/source-photo-coverage-10.test.mjs
          node --check tests/garment-pixel-witness-10.test.mjs
          node --check research/denim-fit-06/garment-pixel-witness-10.mjs
          node --check research/denim-fit-06/source-photo-coverage-10.mjs
          node --check scripts/test-fabric-sweep-04-browser.mjs
          node --test tests/garment-pixel-witness-10.test.mjs tests/source-photo-coverage-10.test.mjs tests/denim-angle-09.test.mjs tests/denim-fairing-08.test.mjs tests/denim-silhouette-07.test.mjs tests/denim-fit-06.test.mjs tests/dress-fit-05.test.mjs tests/fabric-sweep-04.test.mjs tests/fabric-folds-03.test.mjs tests/fabric-walk-02.test.mjs tests/fabric-motion-01.test.mjs tests/integration-04-wardrobe-dress.test.mjs tests/dress-mobile-01.test.mjs tests/three-d-78-original-anatomical-knee-poses.test.mjs
      - name: Generate unchanged source photograph / original garment segmentation
        run: |
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node scripts/build-work47-benchmark.mjs
          node --test tests/three-d-31-jeans-source.test.mjs tests/three-d-37-source-true.test.mjs
      - name: Restore SHA-verified CC0 male/female original anatomical 163-bone GLBs
        run: |
          git fetch --no-tags origin 53f2ad344dc56a1477e343531c423aed0e66c17d dd6bac3fa9ff640d4f562cf925337440bdb5cf8f 3a572193987cb29389727426136c6eb3ac326783 dfb40889c4c1221fb1833b859e8a11ef38aeb76e
          node research/three-d-20/restore-approved-models.mjs
      - name: Test original 163-bone 44 real WebGL screenshots and 18 dense gait contact frames
        run: node scripts/test-fabric-sweep-04-browser.mjs
      - name: Assert genuine photographed rig evidence and strict family release HOLD
        run: |
          node --input-type=module <<'CHECK'
          import assert from 'node:assert/strict';
          import {readFileSync,readdirSync} from 'node:fs';
          const dir='benchmark/fabric-sweep-04',r=JSON.parse(readFileSync(dir+'/browser-results.json'));
          assert.equal(r.screenshots,44);
          assert.equal(readdirSync(dir).filter(s=>s.endsWith('.png')).length,44);
          assert.deepEqual(r.mobileWidths,[320,390,430]);
          assert.deepEqual(r.originalFigures,['female','male']);
          assert.ok(r.cases.length===6&&r.cases.every(x=>x.leftChangedPixels>=50&&x.rightChangedPixels>=50&&x.resetChangedPixels===0));
          assert.equal(r.realTriangleContactAudits.length,2);
          assert.equal(r.ninePhaseSkinnedContactSweeps.length,2);
          assert.ok(r.ninePhaseSkinnedContactSweeps.every(x=>x.phaseSamples.length===9&&x.sampledNoNewContacts));
          assert.equal(r.allEighteenSampledPhasesNoNewContacts,true);
          assert.equal(r.mathematicallySweptCollisionCertified,false);
          assert.equal(r.sourceNeutralPoseDrape03Verified,true);
          assert.equal(r.originalSourceFoldComparedInSameGaitPose,true);
          assert.ok(r.cases.filter(x=>x.actualWebGLFoldBeforeAfterChangedPixels!==null)
            .every(x=>x.actualWebGLFoldBeforeAfterChangedPixels>=5));
          assert.ok(r.realTriangleContactAudits.every(x=>
            x.crossedSegmentsAtLeftStep<=x.crossedSegmentsAtRest&&
            x.crossedSegmentsAtRightStep<=x.crossedSegmentsAtRest),
            'True anatomy source dress must not add body intersections on either step');
          assert.equal(r.genuineAnatomicalHipKneeAndPelvisMotion,true);
          assert.equal(r.clothRespondsToBodyGait,true);
          assert.equal(r.exactPoseAndClothReset,true);
          assert.equal(r.sourcePhotoRestUVAndSkinUnmodified,true);
          assert.equal(r.defaultOff,true);
          assert.equal(r.continuousCollisionCertified,false);
          assert.equal(r.walkingFootPlantPhysicsCertified,false);
          assert.equal(r.physicalAndroidIphoneVerified,false);
          assert.equal(r.realUserPhotosUsed,false);
          assert.equal(r.productionModified,false);
          assert.equal(r.familyAlpha,'HOLD');
          assert.equal(r.releaseAuthorized,false);
          CHECK
      - name: Verify original photographed dress static fit, genuine WebGL freeze proof and no release
        run: |
          node --input-type=module <<'CHECK'
          import assert from 'node:assert/strict';
          import {readFileSync,readdirSync} from 'node:fs';
          const dir='benchmark/dress-fit-05',r=JSON.parse(readFileSync(dir+'/results.json'));
          assert.equal(r.frozenDress.length,6);
          assert.equal(r.frozenWebGLImages,24);
          assert.equal(readdirSync(dir).filter(x=>x.endsWith('.png')).length,24);
          assert.deepEqual(r.mobileWidths,[320,390,430]);
          assert.deepEqual(r.originalFigures,['female','male']);
          assert.ok(r.frozenDress.every(x=>x.sourceSHA256==='e7a617cd23a159864f619e8397d5f37d48b684e47dddc4ad6b46b14481042019'&&
            x.account==='fixture-account-a'&&x.changedWebGLPixels>=8&&
            x.rotationDriftPixels<=2&&x.repeatDriftPixels<=2&&
            x.originalPhotoFrontUntouched&&x.sourceRestAndSkinPreserved&&
            x.bodyContactsAfter<=x.bodyContactsBefore&&x.sourceColorAndShaderUnmodified));
          assert.equal(r.actualVerifiedSource,true);
          assert.equal(r.originalPhotoUnchanged,true);
          assert.equal(r.realPhoneApproved,false);
          assert.equal(r.visualPhotorealismApproved,false);
          assert.equal(r.familyAlpha,'HOLD');
          assert.equal(r.releaseAuthorized,false);
          assert.equal(r.productionModified,false);
          CHECK
      - name: Verify original photographed saved jeans static fit on genuine 163-bone mannequins
        run: |
          node --input-type=module <<'CHECK'
          import assert from 'node:assert/strict';
          import {readFileSync,readdirSync} from 'node:fs';
          const r=JSON.parse(readFileSync('benchmark/denim-fit-06/results.json'));
          assert.equal(r.frozenDenim.length,8);
          assert.equal(r.realWebGLFrames,32);
          assert.equal(readdirSync('benchmark/denim-fit-06').filter(x=>x.endsWith('.png')).length,32);
          assert.deepEqual(r.original163BoneFigures,['female','male']);
          assert.deepEqual(r.mobileWidths,[320,390,430]);
          assert.equal(r.independentOriginalDenims,2);
          assert.equal(new Set(r.frozenDenim.map(x=>x.sourceDenim)).size,2);
          assert.ok(r.frozenDenim.every(x=>x.sourceOwner==='fixture-account-a'&&
            Number.isInteger(x.sourceGeneration)&&x.sourceGeneration>=1&&
            x.sourceBoundToSavedWardrobe===true&&x.movedPixels>=6&&
            x.rotationDrift<=2&&x.repeatDrift<=2&&
            x.bodyContactsAfter<=x.bodyContactsBefore&&
            x.originalPhotoFrontAndSkinUnchanged));
          assert.equal(r.savedWardrobeOwnerBound,true);
          assert.equal(r.fullyGeneralUserPhoto3DCertified,false);
          assert.equal(r.physicalPhoneVerified,false);
          assert.equal(r.humanVisualApproved,false);
          assert.equal(r.releaseAuthorized,false);
          assert.equal(r.productionModified,false);
          assert.equal(r.familyAlpha,'HOLD');
          CHECK
      - name: Assert actual matched WebGL source jeans anatomical taper A/B and preserved front photograph
        run: |
          node --input-type=module <<'CHECK'
          import assert from 'node:assert/strict';
          import {readFileSync,readdirSync} from 'node:fs';
          const dir='benchmark/denim-silhouette-07';
          const r=JSON.parse(readFileSync(dir+'/results.json','utf8'));
          assert.equal(r.genuinePhotoOriginalDenimComparisons.length,4);
          assert.equal(r.realMatchedWebGLComparisonFrames,8);
          assert.equal(readdirSync(dir).filter(x=>x.endsWith('.png')).length,8);
          assert.deepEqual(r.original163BoneFigures,['female','male']);
          assert.equal(r.cameraAngleDegrees,90);
          assert.equal(r.width,390);
          assert.equal(r.licensedSourceDenims,2);
          assert.equal(new Set(r.genuinePhotoOriginalDenimComparisons.map(x=>x.sourceDenim)).size,2);
          assert.ok(r.genuinePhotoOriginalDenimComparisons.every(x=>
            x.width===390&&x.changedPixelsAgainstExactOriginalF06>=30&&
            x.originalFrontAndSkinPreserved&&x.actualSewnFoldTopologyPreserved&&
            x.noNewTriangleContacts&&x.realSourceDenim&&
            x.original163BoneMannequin&&x.kneeVsHemEaseMeters>=.008));
          assert.equal(r.frontTextureDetailsNotSynthesized,true);
          assert.equal(r.physicalPhoneApproved,false);
          assert.equal(r.independentHumanPhotorealismApproved,false);
          assert.equal(r.releaseAuthorized,false);
          assert.equal(r.familyAlpha,'HOLD');
          assert.equal(r.productionModified,false);
          CHECK
      - name: Assert genuine source-licensed photographed denim F07/F08 WebGL cuffs, SHA and zero-new BVH
        run: |
          node --input-type=module <<'CHECK'
          import assert from 'node:assert/strict';
          import {readFileSync,readdirSync} from 'node:fs';
          const dir='benchmark/denim-fairing-08';
          const r=JSON.parse(readFileSync(dir+'/results.json','utf8'));
          assert.equal(r.matchedOriginalPhotoFairingPairs.length,4);
          assert.equal(r.realMatchedWebGLFrames,8);
          assert.equal(readdirSync(dir).filter(x=>x.endsWith('.png')).length,8);
          assert.deepEqual(r.original163BoneFigures,['female','male']);
          assert.equal(r.mobileWidth,390);
          assert.equal(r.licensedOriginalDenims,2);
          assert.equal(new Set(r.matchedOriginalPhotoFairingPairs.map(x=>x.sourceDenim)).size,2);
          assert.ok(r.matchedOriginalPhotoFairingPairs.every(x=>
            x.width===390&&x.changedPixelsAgainstExactOriginalF07>=20&&
            x.changedGarmentPixelsAgainstExactOriginalF07>=20&&
            x.garmentPixelsExcludingScreenshotTopRow===true&&
            x.originalSourcePhotoSHA256===x.sourceDenim&&
            x.realSource163BoneRig&&x.frontPhotoAndUVUnchanged&&
            x.noNewSkinnedTriangleContacts&&
            x.cuffReleasedVertices>=8&&x.maxCuffReleaseMeters>=.008));
          assert.equal(r.originalFrontPhotoUntouched,true);
          assert.equal(r.savedWardrobeSourceValidated,true);
          assert.equal(r.physicalPhoneApproved,false);
          assert.equal(r.humanPhotorealismApproved,false);
          assert.equal(r.releaseAuthorized,false);
          assert.equal(r.productionModified,false);
          assert.equal(r.familyAlpha,'HOLD');
          CHECK
      - name: Verify genuine multi-angle source-photo WebGL male/female F07 vs F08, exact resets and no-release
        run: |
          node --input-type=module <<'CHECK'
          import assert from 'node:assert/strict';
          import {readFileSync,readdirSync} from 'node:fs';
          const dir='benchmark/denim-angle-09';
          const r=JSON.parse(readFileSync(dir+'/results.json','utf8'));
          assert.equal(r.actualOriginalDenimAngleComparisons.length,16);
          assert.equal(r.actualWebGLAngleFrames,32);
          assert.equal(readdirSync(dir).filter(x=>x.endsWith('.png')).length,32);
          assert.deepEqual(r.cameraAnglesDegrees,[0,45,135,180]);
          assert.deepEqual(r.genuine163BoneFigures,['female','male']);
          assert.equal(r.originalPhotoSources,2);
          assert.equal(new Set(r.actualOriginalDenimAngleComparisons.map(x=>x.sourceDenim)).size,2);
          for(const a of r.actualOriginalDenimAngleComparisons){
           assert.equal(a.width,390);
           assert.ok(r.cameraAnglesDegrees.includes(a.angle));
           assert.equal(a.sameConfirmedOriginalSource,true);
           assert.equal(a.sameReal163BoneAnatomy,true);
           assert.equal(a.sourceFrontUVAndSHAProtected,true);
           assert.equal(a.noNewBVHContacts,true);
           assert.equal(a.sourcePhotographyRearNotInferred,true);
           assert.equal(a.actualBrowserWebGL,true);
           assert.ok(Number.isSafeInteger(a.changedPixels)&&a.changedPixels>=0);
           assert.equal(a.releaseAuthorized,false);
          }
          assert.equal(r.originalPhotographedFrontUVAndSHAUnmodified,true);
          assert.equal(r.synthesizedUnseenRearPhoto,false);
          assert.equal(r.sourceAccountIsolated,true);
          assert.equal(r.humanPhotorealismAccepted,false);
          assert.equal(r.physicalPhoneApproved,false);
          assert.equal(r.releaseAuthorized,false);
          assert.equal(r.productionModified,false);
          assert.equal(r.familyAlpha,'HOLD');
          CHECK
      - name: Verify actual mobile browser pointer drag and truthful source provenance, never release
        run: |
          node --input-type=module <<'CHECK'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('benchmark/source-rotate-11/results.json','utf8'));
          assert.equal(r.realMobileBrowserPointerQA,true);
          assert.equal(r.realPhysicalPhoneTested,false);
          assert.equal(r.actualOriginalDenimPointerDrags.length,1);
          const d=r.actualOriginalDenimPointerDrags[0];
          assert.equal(d.width,390);
          assert.equal(d.rig,'female');
          assert.equal(d.denimIndex,0);
          assert.equal(d.initialClass,'front-photo');
          assert.ok(['mixed-photo-and-model','unphotographed-rear'].includes(d.draggedViewClass));
          assert.ok(d.pixelsChangedOnRealWebGL>=50);
          assert.match(d.input,/real canvas mouse drag/i);
          assert.match(d.sourceSHA256,/^[a-f0-9]{64}$/);
          assert.equal(d.authenticatedOwner,'fixture-account-a');
          assert.equal(d.original163BoneAnatomy,true);
          assert.equal(d.unseenRearPhotographCertified,false);
          assert.equal(d.originalFrontSourcePreserved,true);
          assert.equal(r.modeledRearOnly,true);
          assert.equal(r.customerPhotosUsed,false);
          assert.equal(r.productionModified,false);
          assert.equal(r.releaseAuthorized,false);
          assert.equal(r.familyAlpha,'HOLD');
          CHECK
      - name: Verify F12 native mobile touch WebGL photographs and false-rear protection (NO RELEASE)
        run: |
          node --input-type=module <<'CHECK'
          import assert from 'node:assert/strict';
          import {readFileSync,readdirSync} from 'node:fs';
          const r=JSON.parse(readFileSync('benchmark/source-touch-12/results.json','utf8'));
          assert.deepEqual(r.mobileWidths,[320,390,430]);
          assert.deepEqual(r.anatomicalRigs,['female','male']);
          assert.equal(r.licensedOriginalDenims,2);
          assert.equal(r.actualNativeChromeTouchEvents,true);
          assert.equal(r.genuineChromiumTouchSwipes.length,8);
          assert.equal(r.realWebGLTouchFrameCount,16);
          assert.equal(readdirSync('benchmark/source-touch-12').filter(x=>x.endsWith('.png')).length,16);
          assert.equal(new Set(r.genuineChromiumTouchSwipes.map(x=>x.sourceSHA256)).size,2);
          assert.deepEqual([...new Set(r.genuineChromiumTouchSwipes.map(x=>x.width))],[320,390,430]);
          assert.deepEqual([...new Set(r.genuineChromiumTouchSwipes.map(x=>x.rig))],['female','male']);
          for(const t of r.genuineChromiumTouchSwipes){
           assert.equal(t.actualRigBones,163);
           assert.equal(t.signedInSyntheticAccount,'fixture-account-a');
           assert.equal(t.finger12.steps,18);
           assert.equal(t.finger12.chromeNativeTouchEvents,true);
           assert.equal(t.finger12.physicalTouchHardwareUsed,false);
           assert.match(t.input,/native touchStart\/touchMove\/touchEnd/);
           assert.match(t.sourceSHA256,/^[a-f0-9]{64}$/);
           assert.equal(t.frontClass,'front-photo');
           assert.ok(['mixed-photo-and-model','unphotographed-rear'].includes(t.afterClass));
           assert.ok(t.changedWebGLPixels>=50);
           assert.equal(t.sourceIdentitySameAfterTouch,true);
           assert.equal(t.isolatedBrowserSession,true);
           assert.equal(t.garmentContactNoNew,true);
           assert.equal(t.confirmedRearOriginalPhoto,false);
           assert.equal(t.originalPhotoRGBUVAndSkinUnmodified,true);
           assert.equal(t.physicalAndroidIphoneTested,false);
           assert.equal(t.productionModified,false);
           assert.equal(t.releaseAuthorized,false);
          }
          assert.equal(r.realPhysicalAndroidIphoneVerified,false);
          assert.equal(r.sourcePrivacyAndOwnerPreserved,true);
          assert.equal(r.unseenRearPhotoInvented,false);
          assert.equal(r.originalPhotoRGBUVAndSkinUnchanged,true);
          assert.equal(r.photorealismHumanApproved,false);
          assert.equal(r.productionModified,false);
          assert.equal(r.familyAlpha,'HOLD');
          assert.equal(r.releaseAuthorized,false);
          CHECK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SOURCE-TOUCH-12-NATIVE-MOBILE-CHROME-16-REAL-WEBGL-FRAMES-HOLD
          path: benchmark/source-touch-12/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SOURCE-ROTATE-11-REAL-MOBILE-POINTER-WEBGL-HOLD
          path: benchmark/source-rotate-11/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DENIM-ANGLE-09-F07-F08-REAL-WEBGL-32-FRAMES-HOLD
          path: benchmark/denim-angle-09/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DENIM-FAIRING-08-ACTUAL-SOURCE-MATCHED-F07-F08-HOLD
          path: benchmark/denim-fairing-08/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DENIM-SILHOUETTE-07-ACTUAL-SOURCE-MATCHED-F06-F07-HOLD
          path: benchmark/denim-silhouette-07/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DENIM-FIT-06-32-REAL-WEBGL-SAVED-WARDROBE-HOLD
          path: benchmark/denim-fit-06/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRESS-FIT-05-24-REAL-WEBGL-STATIC-PHOTO-HOLD
          path: benchmark/dress-fit-05/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SWEEP-04-REAL-PHOTO-DRESS-44-WEBGL-HOLD
          path: benchmark/fabric-sweep-04/
          if-no-files-found: warn
