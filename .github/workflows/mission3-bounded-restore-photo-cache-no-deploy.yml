name: Mission 3 bounded owner-private JPEG restore cache — NO DEPLOY
on:
  push:
    branches: [research/mission3-bounded-restore-photo-cache-20261110-HOLD]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-photo-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin verified Mission 3 clean sync parent and enforce no hosted changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=1c243b2da0fb3e785e8af59bcb1fd2ee0a35aa14
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --exit-code "$BASE" HEAD -- public/auth.js public/app.js public/photo-import.js supabase public/local-worker.mjs public/recognition-engine.mjs
          git diff --name-only "$BASE" HEAD | while read -r p; do
            case "$p" in
              public/cloud-backup.js|public/cloud-backup-engine.js|tests/mission3-bounded-restore-photo-cache.test.cjs|research/mission3-bounded-photo-restore/REPORT.md|.github/workflows/mission3-bounded-restore-photo-cache-no-deploy.yml) ;;
              *) echo "Unexpected Mission 3 restore-cache path: $p"; exit 1 ;;
            esac
          done
      - name: Install pinned real browser and synthetic private storage tests
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Show exact parent retained unbounded decoded JPEG map
        run: |
          git worktree add --detach /tmp/closet-mission3-photo-cache-parent 1c243b2da0fb3e785e8af59bcb1fd2ee0a35aa14
          CLOUD_SOURCE_ROOT=/tmp/closet-mission3-photo-cache-parent EXPECT_BASELINE=1 node --test tests/mission3-bounded-restore-photo-cache.test.cjs
      - name: Verify LRU cap, coalescing, error retry and real owner-bound JPEG restore
        run: node --test tests/mission3-bounded-restore-photo-cache.test.cjs
      - name: Build and full application Node regression
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Genuine Chromium backup and second-browser private original/cutout restore
        run: |
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos commons-0002
          node scripts/test-outfit-backup-compatibility-browser.mjs benchmark/mission3-photo-cache-private-backup
      - name: Genuine Chromium/WebKit 320 390 430 native capture review closet and style
        run: node scripts/test-native-canonical-original-167-browser.mjs
      - name: Genuine Chromium/WebKit mobile quota recovery and accessibility
        run: node scripts/test-family-reliability-mobile.mjs
      - name: Retain synthetic-owner screenshots only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission3-bounded-photo-restore-evidence-HOLD
          path: |
            benchmark/mission3-photo-cache-private-backup/
            benchmark/native-canonical-closet-style-167/
            benchmark/family-reliability-mobile/
          retention-days: 14
