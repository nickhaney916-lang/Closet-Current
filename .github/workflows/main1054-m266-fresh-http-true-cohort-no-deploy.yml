name: MAIN1054 M266 combine original HTTP-truth and fresh-process cohort NO DEPLOY HOLD
on:
  push:
    branches: [research/main1054-m266-merge-http-truth-with-fresh-cohort-HOLD]
  pull_request:
    branches: [research/main1054-m265-original-jsep-http-truth-HOLD]
permissions:
  contents: read
jobs:
  source-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact commit, immutable original Worker and inherited canonical HTTP research guard
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          PARENT=6a6c62bbbf1fed39f649c32edcc162f1e961a816
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$GITHUB_RUN_ATTEMPT" = 1
          git merge-base --is-ancestor "$PARENT" HEAD
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          test "$(git rev-parse HEAD:research/main1054/m265-original-jsep-http-truth.mjs)" = 8279ce7645a802657fe3d6c775bb1f7e1f718542
          git diff --name-only "$PARENT" HEAD | while IFS= read -r file; do
            case "$file" in
              research/main1054/m266-original-http-true-fresh-cohort.mjs|tests/main1054-m266-original-http-true-fresh-cohort.test.mjs|.github/workflows/main1054-m266-fresh-http-true-cohort-no-deploy.yml) ;;
              *) echo "M266 scope violation: $file"; exit 1 ;;
            esac
          done
          git diff --exit-code "$PARENT" HEAD -- public/ scripts/ supabase/ benchmark/ research/parallel106/ research/mission3-release-evidence-gate/
          node --check research/main1054/m266-original-http-true-fresh-cohort.mjs
          node --test tests/main1054-m266-original-http-true-fresh-cohort.test.mjs
          node research/main1054/m266-original-http-true-fresh-cohort.mjs pin
      - name: Install no-deploy pinned original browser dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Full original app build, privacy, source-photo and backup regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          test -s dist/index.html
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  fresh-original:
    needs: source-node
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: webkit
            width: 320
            count: 4
          - engine: webkit
            width: 390
            count: 4
          - engine: webkit
            width: 430
            count: 4
          - engine: chromium
            width: 320
            count: 2
          - engine: chromium
            width: 390
            count: 2
          - engine: chromium
            width: 430
            count: 2
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: ${{ matrix.engine }}
      P94_WIDTH: ${{ matrix.width }}
      M266_COUNT: ${{ matrix.count }}
      M265_CASE: healthy
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fresh original native browser/WebKit model plus HTTP-true source-bound cohort
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
          node research/main1054/m266-original-http-true-fresh-cohort.mjs pin
          node research/main1054/m265-original-jsep-http-truth.mjs prepare
          node --check scripts/.m265-original-jsep-http-study.mjs
          mkdir -p m266-receipts
          for ordinal in $(seq 1 "$M266_COUNT"); do
            echo "M266 fresh original attempt $ordinal on $M58_ENGINE width $P94_WIDTH"
            set +e
            timeout -s TERM 180s node scripts/.m265-original-jsep-http-study.mjs > m266-original.log 2>&1
            child_exit=$?
            set -e
            M266_ORDINAL="$ordinal" node research/main1054/m266-original-http-true-fresh-cohort.mjs verify m266-original.log "m266-receipts/receipt-$ordinal.json" "$child_exit"
            rm -f m266-original.log
          done
          node research/main1054/m266-original-http-true-fresh-cohort.mjs aggregate m266-receipts m266-receipts/summary.json
      - name: Preserve bounded source status only, no private photo/tokens/raw logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m266-safe-original-${{ matrix.engine }}-${{ matrix.width }}-HOLD
          path: m266-receipts/
          if-no-files-found: warn
          retention-days: 7
