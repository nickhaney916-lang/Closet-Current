name: Main1054 crop preview revision acceptance HOLD
on:
  pull_request:
    branches: [research/main1054-auth-password-field-hygiene-HOLD]
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'research/main1054-crop-preview-revision-HOLD' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lane: [chromium, webkit, regression]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact correction source, accepted base and isolated acceptance scope
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          base=1908970f71c940b79cd47ca20cfc8102d1dbf764
          candidate=17b51fd5dd2477d1e41af060be564e504c174561
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$PR_BASE" = "$base"
          test "$(git rev-parse "$base^{tree}")" = 9420771b76bc94ac6165e30067b5a0891110d25d
          git merge-base --is-ancestor "$base" "$candidate"
          git merge-base --is-ancestor "$candidate" HEAD
          printf '%s\n' '.github/workflows/main1054-crop-preview-revision-HOLD.yml' 'public/photo-crop-editor.js' 'scripts/main1054-crop-preview-browser.mjs' 'tests/main1054-crop-preview-revision.cjs' > "$RUNNER_TEMP/expected-paths"
          git diff --name-only "$base" HEAD > "$RUNNER_TEMP/actual-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
          test "$(git rev-parse 'HEAD:public/photo-crop-editor.js')" = '8d927e25702fed1daf27a372eb173fc9653722c0'
          test "$(git rev-parse 'HEAD:scripts/main1054-crop-preview-browser.mjs')" = '78c57c120623592050cad45f7bf03d22bf1f6df9'
          test "$(git rev-parse 'HEAD:tests/main1054-crop-preview-revision.cjs')" = 'bba7362e1236bf45d51e49d1d121a6ccbba0964e'
          git log -1 --format='tested commit %H tree %T'
          echo "Application correction source pinned to $candidate"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: node scripts/build.mjs
      - if: matrix.lane == 'regression'
        run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
      - if: matrix.lane != 'regression'
        env:
          A35_ENGINE: ${{ matrix.lane }}
          CC34_ENGINE: ${{ matrix.lane }}
          CC_AUTH_ENGINE: ${{ matrix.lane }}
          CC_INSTALL_ENGINE: ${{ matrix.lane }}
          CC_DEVICE_ENGINE: ${{ matrix.lane }}
          CC_CAMERA_ENGINE: ${{ matrix.lane }}
          CC_NAV_ENGINE: ${{ matrix.lane }}
          CC_DEVICE_FOCUS_ENGINE: ${{ matrix.lane }}
          CC_PASSWORD_ENGINE: ${{ matrix.lane }}
          CC_CROP_ENGINE: ${{ matrix.lane }}
        run: |
          npx playwright install --with-deps "$A35_ENGINE"
          node scripts/main1054-crop-preview-browser.mjs
          node scripts/main1054-auth-password-browser.mjs
          node scripts/main1054-device-check-focus-browser.mjs
          node scripts/main1054-navigation-menu-browser.mjs
          node scripts/main1054-camera-clock-browser.mjs
          node scripts/main1054-device-check-session-browser.mjs
          node scripts/main1054-install-prompt-browser.mjs
          node scripts/main1054-restored-session-browser.mjs
          node scripts/assignment-34/browser.mjs
          node scripts/assignment-35/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always() && matrix.lane != 'regression'
        with:
          name: assignment-35-${{ matrix.lane }}-HOLD
          path: benchmark/assignment-35/quality-*.json
          if-no-files-found: warn
