name: P121 signed-owner cloud boundary audit NO DEPLOY
on:
  push:
    branches:
      - research/signed-owner-cloud-e2e-121-main-20261106-HOLD
  pull_request:
    branches:
      - research/reviewed-app-capture-closet-120-main-20261106-HOLD
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-cloud-security-regressions:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact P120 parent and only three authorized research files
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=2d996a3aa1ed4f8dbad50a7a7553fb9121723c5d
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          FIRST="$(git rev-list --reverse "$BASE..HEAD" | head -n1)"
          test "$(git rev-parse "$FIRST^")" = "$BASE"
          git diff --name-only "$BASE" HEAD >/tmp/p121-paths
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/signed-owner-cloud-e2e-121-no-deploy.yml|tests/signed-owner-cloud-e2e-121.test.mjs|research/signed-owner-cloud-e2e-121/REPORT.md) ;;
              *) echo "P121 STOP unauthorized auth/runtime, cloud, customer data or other path: $path"; exit 1 ;;
            esac
          done </tmp/p121-paths
          test "$(wc -l </tmp/p121-paths)" -eq 3
          git diff --exit-code "$BASE" HEAD -- public supabase package.json package-lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install inherited research-only browser and IndexedDB dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Build and execute P121 security configuration regressions
        run: |
          node --check tests/signed-owner-cloud-e2e-121.test.mjs
          node scripts/build.mjs
          node --test tests/signed-owner-cloud-e2e-121.test.mjs
      - name: Run complete inherited Node app and research regression suite
        run: node --test tests/*.test.cjs tests/*.test.mjs
      - name: Run inherited real-app mobile Chromium and WebKit import-review-private-save acceptance
        run: node scripts/test-reviewed-app-capture-closet-120-browser.mjs
      - name: Audit browser screenshots and keep authenticated cloud claims explicit
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,readdirSync,statSync} from 'node:fs';
          const dir='benchmark/reviewed-app-capture-closet-120';
          const p=JSON.parse(readFileSync(dir+'/browser-results.json','utf8'));
          assert.deepEqual(p.scenarios.map(x=>[x.browser,x.width]),[
            ['chromium',320],['chromium',390],['chromium',430],['webkit',390]
          ]);
          for(const row of p.scenarios){
            assert.equal(row.realAppPage,true);
            assert.equal(row.actualOwnerBoundIndexedDB,true);
            assert.equal(row.originalSourceIndependentHash,true);
            assert.equal(row.actualUserCorrectionForm,true);
            assert.equal(row.noHorizontalOverflow,true);
            assert.equal(row.actualSignedCloudRLS,false);
            assert.equal(row.physicalPhoneTested,false);
          }
          assert.equal(p.realAuthenticatedCloudUsers,false);
          assert.equal(p.physicalPhoneCameraVerified,false);
          assert.equal(p.productionDeployed,false);
          const images=readdirSync(dir).filter(x=>x.endsWith('.png'));
          assert.equal(images.length,12);
          for(const name of images)assert.ok(statSync(dir+'/'+name).size>1000,name);
          NODE
      - name: Archive source-only app screenshots and non-secret results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P121-real-app-mobile-private-local-evidence-NO-DEPLOY
          path: benchmark/reviewed-app-capture-closet-120/
          retention-days: 14
