name: MAIN1054 M41 actual licensed RGB/alpha visual quality workstation NO DEPLOY
on:
  push:
    branches: [research/main1054-m41-source-alpha-human-review-HOLD]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  original-source-review-workstation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact immutable M40 ancestry, untouched consumer/owner/cloud/3D and M37 source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 912afbc1113f378ee0e360dd9d11d01f90cc948a HEAD
          test "$(git rev-parse HEAD:research/main1054-handoff40/p89-quality-admission.mjs)" = "$(git rev-parse 912afbc1113f378ee0e360dd9d11d01f90cc948a:research/main1054-handoff40/p89-quality-admission.mjs)"
          test "$(git rev-parse HEAD:research/native-3d-05/native-preview-bridge.mjs)" = "$(git rev-parse 912afbc1113f378ee0e360dd9d11d01f90cc948a:research/native-3d-05/native-preview-bridge.mjs)"
          test "$(git rev-parse HEAD:research/main1054-handoff37/safe-readonly-handoff.mjs)" = "$(git rev-parse d2eb53448e784e588ef9b9e6bff6693a3a2da977:research/main1054-handoff37/safe-readonly-handoff.mjs)"
          git diff --exit-code 912afbc1113f378ee0e360dd9d11d01f90cc948a HEAD -- public/ supabase/ benchmark/ research/native-3d-05/ research/main1054-handoff40/
          git diff --name-only 912afbc1113f378ee0e360dd9d11d01f90cc948a HEAD | while IFS= read -r path; do
            case "$path" in
              research/main1054-mask41/original-rgb-alpha-audit.mjs|research/main1054-mask41/offline-source-quality-review.html|tests/main41-source-mask-review.test.mjs|scripts/build-main41-real-source-review.mjs|scripts/test-main41-offline-review.mjs|research/master-consolidation-1054/MILESTONE41.md|.github/workflows/main1054-m41-source-mask-human-review-no-deploy.yml) ;;
              *) echo "BLOCKED unexpected M41 changed path $path"; exit 1;;
            esac
          done
          node --check research/main1054-mask41/original-rgb-alpha-audit.mjs
          node --check tests/main41-source-mask-review.test.mjs
          node --check scripts/build-main41-real-source-review.mjs
          node --check scripts/test-main41-offline-review.mjs
      - name: Pin no-deploy licensed research tools
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 playwright@1.56.1 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Unchanged consumer build, not release
        run: node scripts/build.mjs
      - name: M41 alpha-integrity adversarial Node tests
        run: node --test tests/main41-source-mask-review.test.mjs
      - name: Inherited serial no-deploy Node regression
        run: node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Exact P541 source Work47 and original P93 alpha-only algorithm pinned in detached worktrees
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach .native05-donor-541 df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          git worktree add --detach .m41-p93-donor 690eaeec9ebe911714d6f45fb0d9a59b2ee918d8
          ln -s ../node_modules .native05-donor-541/node_modules
          ln -s ../node_modules .m41-p93-donor/node_modules
          test "$(git rev-parse 690eaeec9ebe911714d6f45fb0d9a59b2ee918d8:research/mission2-p93/alpha-only-source-warm-edge.mjs)" = "$(git -C .m41-p93-donor rev-parse HEAD:research/mission2-p93/alpha-only-source-warm-edge.mjs)"
          test "$(git rev-parse 690eaeec9ebe911714d6f45fb0d9a59b2ee918d8:scripts/build-mission2-p93-real-source-mask.mjs)" = "$(git -C .m41-p93-donor rev-parse HEAD:scripts/build-mission2-p93-real-source-mask.mjs)"
      - name: Build true P541 licensed original Commons JPEGs and actual Work47 alpha
        working-directory: .native05-donor-541
        run: |
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node scripts/build-work47-benchmark.mjs
      - name: Run exact unchanged P93 algorithm against original JPEG RGB and PNG
        run: node .m41-p93-donor/scripts/build-mission2-p93-real-source-mask.mjs
      - name: M41 recompute original-P93 alpha-only pixel/contour proof and true review images
        run: node scripts/build-main41-real-source-review.mjs
      - name: Install offline Chromium/WebKit browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Actual local file Chromium five original/provisional/candidate source images and unverified review export
        run: M41_ENGINE=chromium node scripts/test-main41-offline-review.mjs
      - name: Actual local file WebKit five original/provisional/candidate source images and unverified review export
        run: M41_ENGINE=webkit node scripts/test-main41-offline-review.mjs
      - name: Final NO CHANGES to consumer/cloud/original source files
        run: |
          git diff --exit-code 912afbc1113f378ee0e360dd9d11d01f90cc948a HEAD -- public/ supabase/ benchmark/
          test -f benchmark/main41-source-review/original-source.jpg
          test -f benchmark/main41-source-review/offline-source-quality-review.html
      - name: Preserve actual licensed original/source mask reviews as research evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main1054-m41-real-source-neckline-review-NOT-APPROVED-HOLD
          path: |
            benchmark/main41-source-review/
          if-no-files-found: ignore
          retention-days: 14
