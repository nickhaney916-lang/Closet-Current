name: Main1054 camera and import after saved editor fix HOLD
on:
  pull_request:
    branches: [research/main1054-saved-editor-pending-HOLD]
permissions:
  contents: read
jobs:
  cumulative-original-camera:
    if: github.head_ref == 'research/main1054-camera-after-saved-editor-HOLD' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin exact cumulative application and unchanged historical proof
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          candidate=8c5d848ee8c3216916a7805d6cbdf758bf99f464
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$PR_BASE" = "$candidate"
          test "$(git rev-parse "$candidate^{tree}")" = 86e525feffb6ae98d1cb4f4fcfeb56c92d5cc8bb
          test "$(git rev-parse HEAD^)" = 64fc7ec56dd2a11963e3a2ceaf3178e183f5a896
          test "$(git rev-parse HEAD^^)" = "$candidate"
          test "$(git diff --name-only "$candidate" HEAD)" = '.github/workflows/main1054-camera-after-saved-editor-HOLD.yml'
          test "$(git rev-parse HEAD:.github/workflows/capture-proof-01-no-deploy.yml)" = 1aa47f424b137bf697268bf49525152bcb15fce1
          test "$(git rev-parse HEAD:scripts/test-capture-proof-01-browser.mjs)" = 631c050d6ec3cadf356dcd1e1b989a853928e97e
          test "$(git rev-parse HEAD:public/app.js)" = 373343aeb3a880554c07123c41e595b3c8a54b9a
          git checkout --detach "$candidate"
          test "$(git rev-parse HEAD)" = "$candidate"
          git log -1 --format='tested exact candidate %H tree %T'
      - name: Install isolated pinned dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Original camera and import source proof regressions
        run: node --test tests/capture-proof-01.test.mjs tests/index-04-saved-recognition.test.mjs tests/index-03-recognition-safety.test.mjs tests/wardrobe-index-01.test.mjs tests/wardrobe-index-02.test.mjs
      - name: Build exact candidate without deployment
        run: node scripts/build.mjs
      - name: Original camera and import actual browsers at 320 390 430
        run: node scripts/test-capture-proof-01-browser.mjs
      - name: Strict evidence manifest and no-deploy acceptance
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('benchmark/capture-proof-01/results.json','utf8'));
          assert.equal(r.verdict,'PASS');
          assert.deepEqual(r.results.map(x=>x.engine+':'+x.width),
           ['chromium:320','chromium:390','chromium:430','webkit:320','webkit:390','webkit:430']);
          assert.equal(r.errors.length,0);assert.equal(r.outbound.length,0);
          assert.ok(r.results.every(x=>x.realPage&&x.realCanvasJPEG&&x.genuineWebCrypto&&
           x.realIndexedDB&&x.simulatedCamera&&x.mockedWorkers&&
           x.permissionDeniedAndRecovered&&x.frontFacingFallback&&
           x.originalFullResolution&&x.unverifiedNeedsReview&&
           x.originalImportConversionHonest&&x.manualCorrectionSaved&&x.tamperedSourceRefused&&
           x.failedPlaybackStopped&&x.visibilityInterruptStopped&&
           x.logoutDuringPendingHashDiscarded&&x.outfitOriginalHandoff&&
           x.logoutClearsPrivateIndex&&!x.actualPhysicalPhone));
          assert.equal(r.physicalAndroidTested,false);
          assert.equal(r.physicalIphoneTested,false);
          assert.equal(r.freshNeuralInference,false);
          assert.equal(r.productionDeployed,false);
          assert.equal(r.familyAlpha,'HOLD');
          console.log('CAPTURE-PROOF 6 genuine browser viewport scenarios and no-deploy PASS');
          NODE
      - name: Upload synthetic browser screenshots and integrity manifest HOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MAIN1054-CUMULATIVE-CAMERA-CHROMIUM-WEBKIT-SYNTHETIC-HOLD
          path: benchmark/capture-proof-01/
          if-no-files-found: warn
