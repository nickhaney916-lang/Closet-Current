name: MAIN233 WebKit true P94 runtime identity certification gate HOLD NO DEPLOY
on:
  push:
    branches: [research/main233-webkit-ort-runtime-identity-release-gate-HOLD]
  pull_request:
    branches: [fix/parallel102-webkit-ort-runtime-compat-HOLD]
permissions:
  contents: read
jobs:
  full-original-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable original P102 source and M233 scope guards
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=3bb85a46671553cdd48e3c92595878ff3e7164f5
          git merge-base --is-ancestor "$BASE" HEAD
          changed="$(git diff --name-only "$BASE" HEAD)"
          test "$changed" = "$(printf '%s\n' '.github/workflows/main233-webkit-ort-runtime-identity-no-deploy.yml' 'scripts/lib/main233-ort-runtime-identity.mjs' 'scripts/test-main233-native-ort-asset-identity.mjs' 'tests/main233-ort-runtime-identity.test.mjs')"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-parallel102-ort-runtime-compat-browser.mjs)" = 5bd2186372ac24428ddc957e4f3050acb3351b7c
          test "$(git rev-parse HEAD:scripts/lib/main233-ort-runtime-identity.mjs)" = 4cef6f39ce4e9ee47c885c12abc396280089e4b9
          test "$(git rev-parse HEAD:scripts/test-main233-native-ort-asset-identity.mjs)" = 0057966d1c35e4d111fd2202951fcf0b7ce108f8
          test "$(git rev-parse HEAD:tests/main233-ort-runtime-identity.test.mjs)" = c958acf55b104e3fd5c6931db64c0cc5c0bc4675
          node --check scripts/lib/main233-ort-runtime-identity.mjs
          node --check scripts/test-main233-native-ort-asset-identity.mjs
          node --check tests/main233-ort-runtime-identity.test.mjs
      - name: Install original app/test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Unit checks, full inherited owner/privacy Node suite and offline build
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/main233-ort-runtime-identity.test.mjs
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  native-real-model-identity:
    name: M233 source-locked genuine original P94 model and JSEP asset identity (${{ matrix.engine }} ${{ matrix.width }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {engine: webkit, width: 320}
          - {engine: webkit, width: 430}
          - {engine: chromium, width: 430}
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: ${{ matrix.engine }}
      P94_WIDTH: ${{ matrix.width }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source / receipt verifier immutability
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=3bb85a46671553cdd48e3c92595878ff3e7164f5
          git merge-base --is-ancestor "$BASE" HEAD
          changed="$(git diff --name-only "$BASE" HEAD)"
          test "$changed" = "$(printf '%s\n' '.github/workflows/main233-webkit-ort-runtime-identity-no-deploy.yml' 'scripts/lib/main233-ort-runtime-identity.mjs' 'scripts/test-main233-native-ort-asset-identity.mjs' 'tests/main233-ort-runtime-identity.test.mjs')"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-parallel102-ort-runtime-compat-browser.mjs)" = 5bd2186372ac24428ddc957e4f3050acb3351b7c
          test "$(git rev-parse HEAD:scripts/lib/main233-ort-runtime-identity.mjs)" = 4cef6f39ce4e9ee47c885c12abc396280089e4b9
          test "$(git rev-parse HEAD:scripts/test-main233-native-ort-asset-identity.mjs)" = 0057966d1c35e4d111fd2202951fcf0b7ce108f8
          test "$(git rev-parse HEAD:tests/main233-ort-runtime-identity.test.mjs)" = c958acf55b104e3fd5c6931db64c0cc5c0bc4675
          node --check scripts/lib/main233-ort-runtime-identity.mjs
          node --check scripts/test-main233-native-ort-asset-identity.mjs
          node --check tests/main233-ort-runtime-identity.test.mjs
      - name: Install pinned genuine browser dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Original SegFormer native positive baseline and fixed-SIMD true JSEP asset proof
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-main233-native-ort-asset-identity.mjs
