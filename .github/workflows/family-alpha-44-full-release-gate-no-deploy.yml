    paths:
      - 'scripts/check-family-alpha-44-integrated-readiness-hold.mjs'
      - 'scripts/check-family-alpha-27.mjs'
      - 'scripts/check-family-alpha-stage-live-preflight.mjs'
      - 'docs/family-alpha-27/**'
      - 'docs/family-alpha-44/**'
      - 'tests/integration/family-alpha-44-integrated-readiness-hold.test.mjs'
