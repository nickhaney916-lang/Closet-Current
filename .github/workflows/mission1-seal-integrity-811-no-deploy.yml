name: Mission 1 P811 original cohort seal SHA integrity research — NO DEPLOY
on:
  push:
    branches: [research/mission1-seal-integrity-811-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mission1-P811-seal-research-HOLD
  cancel-in-progress: true
jobs:
  exact-P810-four-path-full-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verified P810 parent; no public app, private photos, cloud or deployment changes
        run: |
          set -euo pipefail
          BASE=d0419384542f3d05198a55d8d60c05c8184be781
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD >/tmp/m1-p811-paths
          test "$(wc -l </tmp/m1-p811-paths)" -eq 4
          while read -r p; do
            case "$p" in
              research/mission1-reviewer-774/offline-photo-polygon-review.html|scripts/test-mission1-offline-reviewer-774-browser.mjs|research/mission1-seal-integrity-811/REPORT.md|.github/workflows/mission1-seal-integrity-811-no-deploy.yml) ;;
              *) echo "UNAUTHORIZED OWNER/MODEL/RELEASE CHANGE: $p"; exit 1 ;;
            esac
          done </tmp/m1-p811-paths
          test -z "$(git diff --name-only "$BASE" HEAD -- public supabase benchmark)"
          grep -Fq 'FAMILY ALPHA HOLD #255' research/mission1-seal-integrity-811/REPORT.md
          echo M1_P811_ONLY_FOUR_BLIND_SOURCE_REVIEW_PATHS_NO_DEPLOY
      - name: Install ephemeral full app test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Full app regression, build and source geometry tests
        run: |
          set -euo pipefail
          node --check scripts/test-mission1-offline-reviewer-774-browser.mjs
          node --test tests/mission1-offline-human-polygon-774.test.mjs
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  chromium-webkit-real-seal-cryptographic-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify valid canonical seal, reject tampered source, enforce old-source lease
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3
          node scripts/test-mission1-offline-reviewer-774-browser.mjs
      - name: Require twelve SHA-authenticated synthetic browser UI screenshots and HOLD
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const root='benchmark/m1-human-reviewer-ui-774/';
          const p=JSON.parse(readFileSync(root+'synthetic-only-screenshot-receipts.json','utf8'));
          assert.deepEqual(new Set(p.testedBrowserEngines),new Set(['chromium','webkit']));
          assert.deepEqual(p.widths,[320,390]);
          assert.equal(p.screenshotReceipts.length,12);
          assert.equal(p.actualIndependentHumanReviewers,0);
          assert.equal(p.realPhotoOwnerPermissionVerified,false);
          assert.equal(p.releaseAuthorized,false);
          assert.equal(p.familyAlpha,'HOLD');
          assert.equal(new Set(p.screenshotReceipts.map(x=>x.sha256)).size,12);
          const seen=new Set();
          for(const x of p.screenshotReceipts){
            assert.equal(x.syntheticOnly,true);
            const kind=x.kind||'outer-hole';
            const key=x.engine+':'+x.width+':'+kind;
            assert.equal(seen.has(key),false,key);seen.add(key);
            const suffix=kind==='stale-source-rejected'?'source-race-stale-rejected':
             kind==='tampered-seal-rejected'?'tampered-seal-refused':'synthetic-human-annotation-ui';
            const raw=readFileSync(root+x.engine+'-'+x.width+'-'+suffix+'.png');
            assert.equal(createHash('sha256').update(raw).digest('hex'),x.sha256);
          }
          console.log('M1_P811_12_REAL_BROWSER_SCREENSHOTS_TAMPERED_SEAL_SHA_REJECTED_NO_HUMAN_ACCEPTANCE');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission1-P811-offline-human-seal-source-SHA-tamper-12-synthetic-screens-HOLD
          path: benchmark/m1-human-reviewer-ui-774/
          retention-days: 14
          if-no-files-found: warn
