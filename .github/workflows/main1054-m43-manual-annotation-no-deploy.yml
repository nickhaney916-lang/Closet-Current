name: MAIN1054 M43 genuine original-source manual contour annotation NO DEPLOY
on:
  push:
    branches: [research/main1054-m43-human-contour-annotation-HOLD]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  actual-licensed-source-annotation-workstation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned M42 unchanged and exact source-private-production code scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 6a7359b7108ff5d745b7fbd9afec24186f85bb72 HEAD
          for path in research/main1054-mask41/original-rgb-alpha-audit.mjs research/main1054-mask42/conservative-fringe-trial.mjs scripts/build-main41-real-source-review.mjs scripts/build-main42-source-fringe-comparison.mjs research/main1054-handoff40/p89-quality-admission.mjs research/native-3d-05/native-preview-bridge.mjs public/outfit-board.js; do
            test "$(git rev-parse HEAD:$path)" = "$(git rev-parse 6a7359b7108ff5d745b7fbd9afec24186f85bb72:$path)"
          done
          git diff --exit-code 6a7359b7108ff5d745b7fbd9afec24186f85bb72 HEAD -- public/ supabase/ benchmark/ research/main1054-handoff40/ research/native-3d-05/
          git diff --name-only 6a7359b7108ff5d745b7fbd9afec24186f85bb72 HEAD | while IFS= read -r path; do
            case "$path" in
              research/main1054-mask43/source-annotation-contract.mjs|research/main1054-mask43/offline-human-contour-editor.html|research/main1054-mask43/manual-contour-editor.js|tests/main43-original-source-annotation.test.mjs|scripts/build-main43-offline-annotator.mjs|scripts/apply-main43-unverified-patch.mjs|scripts/test-main43-real-source-annotator.mjs|research/master-consolidation-1054/MILESTONE43.md|.github/workflows/main1054-m43-manual-annotation-no-deploy.yml) ;;
              *) echo "BLOCKED unexpected M43 changed path $path"; exit 1;;
            esac
          done
          node --check research/main1054-mask43/source-annotation-contract.mjs
          node --check research/main1054-mask43/manual-contour-editor.js
          node --check tests/main43-original-source-annotation.test.mjs
          node --check scripts/build-main43-offline-annotator.mjs
          node --check scripts/apply-main43-unverified-patch.mjs
          node --check scripts/test-main43-real-source-annotator.mjs
      - name: Pinned no-deploy local developer dependencies
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 playwright@1.56.1 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Unchanged default consumer application build
        run: node scripts/build.mjs
      - name: M43 actual original-JPEG RGB safe manual annotation unit tests
        run: node --test tests/main43-original-source-annotation.test.mjs
      - name: Entire inherited no-deploy Node regression
        run: node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Pin immutable true licensed P541 source and original P93 algorithm
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach .native05-donor-541 df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          git worktree add --detach .m41-p93-donor 690eaeec9ebe911714d6f45fb0d9a59b2ee918d8
          ln -s ../node_modules .native05-donor-541/node_modules
          ln -s ../node_modules .m41-p93-donor/node_modules
          test "$(git rev-parse HEAD:research/main1054-mask42/conservative-fringe-trial.mjs)" = "$(git rev-parse 6a7359b7108ff5d745b7fbd9afec24186f85bb72:research/main1054-mask42/conservative-fringe-trial.mjs)"
      - name: Rebuild genuine Commons original, exact RGB Work47 and P93 original source
        working-directory: .native05-donor-541
        run: |
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node scripts/build-work47-benchmark.mjs
      - name: Rebuild exact unchanged P93 and M41 source photo visual evidence
        run: |
          node .m41-p93-donor/scripts/build-mission2-p93-real-source-mask.mjs
          node scripts/build-main41-real-source-review.mjs
      - name: Build original M42 unchanged hypothesis comparison and source licenses
        run: node scripts/build-main42-source-fringe-comparison.mjs
      - name: Build genuine source-JPEG-locked independent OFFLINE annotation viewer
        run: node scripts/build-main43-offline-annotator.mjs
      - name: Install pinned Chromium and WebKit for real original photograph interactions
        run: npx playwright install --with-deps chromium webkit
      - name: Actual Chromium original JPEG canvas pointer drawing, undo and export (SYNTHETIC TEST ONLY)
        run: M43_ENGINE=chromium node scripts/test-main43-real-source-annotator.mjs
      - name: Actual WebKit original JPEG canvas pointer drawing, undo and export (SYNTHETIC TEST ONLY)
        run: M43_ENGINE=webkit node scripts/test-main43-real-source-annotator.mjs
      - name: Independently reconstitute synthetic annotation with exact original source RGB, NO 3D
        run: node scripts/apply-main43-unverified-patch.mjs benchmark/main43-contour-editor/SYNTHETIC-TEST-NOT-HUMAN-annotations-chromium.json
      - name: Assert immutable original public JPEG, consumer, cloud, model, native 3D scope
        run: |
          git diff --exit-code 6a7359b7108ff5d745b7fbd9afec24186f85bb72 HEAD -- public/ supabase/ benchmark/ research/native-3d-05/
          test -f benchmark/main43-contour-editor/original-source.jpg
          test -f benchmark/main43-contour-editor/offline-human-contour-editor.html
          test -f benchmark/main43-contour-editor/M43-LOCAL-ANNOTATION-CANDIDATE-NOT-APPROVED.png
      - name: Keep genuine licensed original, local annotation workstation, UNAPPROVED synthetic patch evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main1054-m43-actual-original-P93-human-annotation-UNVERIFIED-HOLD
          path: |
            benchmark/main43-contour-editor/
          if-no-files-found: ignore
          retention-days: 14
