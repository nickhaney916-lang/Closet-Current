name: Mission 1 P870 proactive dual review invalidation — NO DEPLOY
on:
  push:
    branches: [research/mission1-dual-editor-invalidation-870-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m1-p870-editor-invalidation-HOLD
  cancel-in-progress: true
jobs:
  pinned-editor-invalidations-NO-DEPLOY:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: P869 immutable base and five-file allowlist
        shell: bash
        run: |
          set -euo pipefail
          BASE=94cf9ec5ee30760d8b710fa3bedd5fd1cfa7a7f6
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | tee /tmp/p870-files
          test "$(wc -l </tmp/p870-files)" -eq 5
          while IFS= read -r p; do
            case "$p" in
              public/app.js|public/dual-panel-82.mjs|scripts/test-p82-review-browser.mjs|research/mission1-dual-editor-invalidation-870/REPORT.md|.github/workflows/mission1-dual-editor-invalidation-870-no-deploy.yml) ;;
              *) echo "UNAUTHORIZED_PATH $p"; exit 1;;
            esac
          done </tmp/p870-files
          test -z "$(git diff --name-only "$BASE" HEAD -- public/dual-worker-82.mjs public/dual-core-82.mjs public/local-worker.mjs public/recognition-engine.mjs public/cloud-backup.js supabase)"
          grep -Fq 'const reviewFirst836=true;' public/app.js
          grep -Fq 'FAMILY ALPHA HOLD #255 OPEN' research/mission1-dual-editor-invalidation-870/REPORT.md
          echo P870_SCOPE_NO_DEPLOY_PASS
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium webkit
      - name: Source syntax, both builds, full native suite and release HOLD
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check public/dual-panel-82.mjs
          node --check scripts/test-p82-review-browser.mjs
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          P79_REQUIRE_DECODER=1 node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
          node scripts/m1-release-evidence-851.mjs | tee /tmp/p870-release
          grep -Fq '"status":"BLOCKED"' /tmp/p870-release
          grep -Fq '"shouldLiftFamilyAlphaHold":false' /tmp/p870-release
      - name: Native original JPEG and real editor photo-fill browser regression
        run: |
          set -euo pipefail
          node scripts/test-m1-original-photo-browser-865.mjs
          node scripts/test-p82-review-browser.mjs | tee /tmp/p870-browser
          grep -Fq 'P870_REAL_EDITOR_PROGRAMMATIC_FILL_REVOKES_CONSENT chromium 390 no-form-input zero-writes' /tmp/p870-browser
          node scripts/test-parallel80-subtype-browser.mjs
          node scripts/test-m1-owner-pair-admission-846.mjs
