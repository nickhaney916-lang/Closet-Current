name: M2 six real-photo source aspect regression HOLD
on:
  push:
    branches: [research/m2-multicategory-original-aspect-20261123-HOLD]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  original-source-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable parent and strict research path boundary
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 73ae72211a6e5995c3deb9035302f1944ba01c91 HEAD
          while IFS= read -r p; do
            case "$p" in
              research/parallel89/source-original-texture-transfer89.mjs|tests/parallel89-multicategory-original-aspect.test.mjs|.github/workflows/m2-multicategory-original-aspect-HOLD.yml) ;;
              *) echo "Unexpected scope: $p"; exit 1 ;;
            esac
          done < <(git diff --name-only 73ae72211a6e5995c3deb9035302f1944ba01c91 HEAD)
      - name: Install pinned existing test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 playwright@1.56.1 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Original source must fail exact same six-JPEG regression
        shell: bash
        run: |
          set -euo pipefail
          git show 73ae72211a6e5995c3deb9035302f1944ba01c91:research/parallel89/source-original-texture-transfer89.mjs > research/parallel89/.aspect-baseline.mjs
          trap 'rm -f research/parallel89/.aspect-baseline.mjs' EXIT
          if M2_ASPECT_BASELINE=1 node --test tests/parallel89-multicategory-original-aspect.test.mjs > baseline.log 2>&1; then
            cat baseline.log
            echo "Expected baseline defect was not reproduced"
            exit 1
          fi
          cat baseline.log
          grep -F 'SOURCE_ASPECT_DISTORTION' baseline.log
      - name: Corrected source and existing original RGB texture tests
        run: node --test tests/parallel89-multicategory-original-aspect.test.mjs tests/parallel89-source-original-texture-transfer.test.mjs
      - name: Original app build
        run: node scripts/build.mjs
      - name: Full inherited Node regression
        run: node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
