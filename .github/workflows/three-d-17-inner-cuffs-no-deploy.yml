name: 3D-17 anatomical source-neutral inner cuff facing (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'research/three-d-17/**'
      - 'research/three-d-15/outfit-controller.mjs'
      - 'research/three-d-15/showroom.mjs'
      - 'research/three-d-15/demo.mjs'
      - 'tests/three-d-17-inner-cuff-facing.test.mjs'
      - 'scripts/test-three-d-17-browser.mjs'
      - '.github/workflows/three-d-17-inner-cuffs-no-deploy.yml'
permissions:
  contents: read
jobs:
  independent-source-cuff-facing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Enforce only 3D-17 prototype and QA paths, no deployment changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin 8a7e25a59ca70943a7e9b0cd942cea5008a9cc8b
          git diff --name-only 8a7e25a59ca70943a7e9b0cd942cea5008a9cc8b HEAD | while IFS= read -r path; do
            case "$path" in
              research/three-d-17/*|research/three-d-15/outfit-controller.mjs|research/three-d-15/showroom.mjs|research/three-d-15/demo.mjs|tests/three-d-17-inner-cuff-facing.test.mjs|scripts/test-three-d-17-browser.mjs|.github/workflows/three-d-17-inner-cuffs-no-deploy.yml) ;;
              *) echo "Unexpected app, photo, staging, production, auth or Drive Duel source modification: $path"; exit 1 ;;
            esac
          done
          test "$(git diff --name-only 8a7e25a59ca70943a7e9b0cd942cea5008a9cc8b HEAD | wc -l)" -le 8
      - name: Install pinned 3D source and local browser dependencies only
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 three@0.180.0 playwright@1.56.1
      - name: Rebuild exact historical licensed original photos and hash-locked CC0 figures
        run: |
          git fetch --no-tags origin 53f2ad344dc56a1477e343531c423aed0e66c17d dd6bac3fa9ff640d4f562cf925337440bdb5cf8f 3a572193987cb29389727426136c6eb3ac326783 dfb40889c4c1221fb1833b859e8a11ef38aeb76e
          node scripts/build-work47-benchmark.mjs
          for attempt in 1 2 3; do
            node research/three-d-14/cc0-pinned-download.mjs && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 2
          done
      - name: Validate original source panels, both real cuff boundaries, shared rigs and privacy
        run: |
          node --test tests/three-d-17-inner-cuff-facing.test.mjs
          node --test --test-name-pattern='atomic outfit slots|Stock-only mode|Both garment cutouts' tests/three-d-15-outfits.test.mjs
      - name: Compare photographed actual WebGL2 cuff before after on male female 320 390 430
        run: node scripts/test-three-d-17-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: THREE-D-17-SOURCE-NEUTRAL-INNER-CUFF-FACING-HOLD
          path: |
            benchmark/three-d-17/
            research/three-d-06/models/verified-assets.json
          if-no-files-found: warn
