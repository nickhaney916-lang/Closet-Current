name: Assignment 9 garment photo UV research - NO DEPLOY
on:
  push:
    branches: [research/assignment9-garment-uv-20261023]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Preserve existing 2D, original adapters and cloud code
        run: git diff --exit-code 6025b134678b218d67b7ad6a7769457c8bbb2fc1 HEAD -- public/index.html public/app.js public/auth.js public/closet-stylist.js public/closet-stylist-engine.js public/outfit-board.js public/outfit-board-engine.js public/humanoid-3d-body-geometry.mjs public/humanoid-3d-detailed-renderer.mjs public/humanoid-3d-saved-bridge.mjs supabase
      - run: node scripts/build.mjs
      - run: node --test tests/*.test.cjs tests/*.test.mjs
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - run: node scripts/build.mjs
      - name: Existing avatar/selection baseline journeys
        run: node scripts/test-humanoid-3d-saved-mobile.mjs
      - name: Source RGB, geometry, revocation, rotation and software frame benchmarks
        run: node scripts/test-issue243-photo-humanoid-browsers.mjs
      - name: Exact indexed-vs-unindexed pixels and prior shoulder comparison
        run: node scripts/test-3d-indexed-shoulders-mobile.mjs
      - name: Asymmetric shoe details and full-height shorts source comparison
        run: node scripts/test-assignment9-garment-uv-mobile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assignment9-garment-uv-SYNTHETIC-NO-DEPLOY
          path: artifacts/
          retention-days: 14
