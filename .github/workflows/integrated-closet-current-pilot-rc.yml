name: Integrated Closet Current customer pilot RC test suite
on:
  push:
    branches: [integration/closet-current-pilot-rc-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove exact merged-source ancestry and protected customer data
        run: node scripts/check-integrated-pilot-rc.mjs
      - name: Build integrated customer app and run all Node regression tests
        run: |
          node --check public/app.js
          node --check public/auth.js
          node --check public/photo-import.js
          node --check public/wardrobe-backup.js
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
  mobile-cross-feature:
    needs: source-and-regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned phone browser engines
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Verify cross-feature synthetic Android Chromium and iPhone WebKit flows
        run: |
          node scripts/build.mjs
          node scripts/test-auth-recovery-onboarding-mobile.mjs
          node scripts/test-mobile-owned-outfit-reliability.mjs
          node scripts/test-wardrobe-file-backup-browsers.mjs
          node scripts/test-mobile-memory-storage-browsers.mjs
          node scripts/test-recognition-confirmation-mobile.mjs
          node scripts/test-integrated-pilot-journeys-mobile.mjs
          node scripts/test-pwa-atomic-release-mobile.mjs
