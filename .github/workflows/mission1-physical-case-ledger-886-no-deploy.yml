name: Mission 1 P886 true Git HEAD and source-exact 23 physical case receipts — NO DEPLOY
on:
  push:
    branches: [research/mission1-physical-case-ledger-886-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m1-p886-source-case-ledger-HOLD-${{ github.sha }}
  cancel-in-progress: true
jobs:
  full-native-owner-regression-NO-DEPLOY:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable P885 parent, exact four-file source scope, Family Alpha HOLD open
        shell: bash
        run: |
          set -euo pipefail
          BASE=eecbc6ac4f750954f6343407a7e7af4e69ddabc0
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | tee /tmp/p886-paths
          test "$(wc -l </tmp/p886-paths)" -eq 5
          while IFS= read -r p; do
            case "$p" in
              scripts/m1-release-evidence-851.mjs|scripts/m1-physical-case-ledger-886.mjs|tests/mission1-release-evidence-851.test.mjs|research/mission1-physical-case-ledger-886/REPORT.md|.github/workflows/mission1-physical-case-ledger-886-no-deploy.yml) ;;
              *) echo "P886_UNAUTHORIZED_PATH $p"; exit 1 ;;
            esac
          done </tmp/p886-paths
          test -z "$(git diff --name-only "$BASE" HEAD -- public benchmark supabase)"
          grep -Fiq 'FAMILY ALPHA HOLD #255 OPEN' research/mission1-physical-case-ledger-886/REPORT.md
          grep -Fq 'const reviewFirst836=true;' public/app.js
          echo P886_IMMUTABLE_SOURCE_AND_HOLD_VERIFIED
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium webkit
      - name: Full native and privacy source regression, owner release remains BLOCKED
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/m1-release-evidence-851.mjs
          node --check scripts/m1-physical-case-ledger-886.mjs
          node --check tests/mission1-release-evidence-851.test.mjs
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          P79_REQUIRE_DECODER=1 node --test --test-concurrency=1 tests/*.cjs tests/*.mjs | tee /tmp/p886-native
          grep -Eq '^# fail 0$' /tmp/p886-native
          node scripts/m1-release-evidence-851.mjs | tee /tmp/p886-untrusted
          grep -Fq '"status":"BLOCKED"' /tmp/p886-untrusted
          grep -Fq '"shouldLiftFamilyAlphaHold":false' /tmp/p886-untrusted
      - name: Desktop Chromium/WebKit original-photo and owner confirmation safeguards
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-m1-original-photo-browser-865.mjs
          node scripts/test-p82-review-browser.mjs | tee /tmp/p886-owner
          test "$(grep -c '^P82_DESKTOP_POLICY_PASS ' /tmp/p886-owner)" -eq 6
          test "$(grep -c '^P880_EXACT_ONE_JOINT_TOP_ONLY ' /tmp/p886-owner)" -eq 6
          test "$(grep -c '^P879_SUBTYPE_CONFLICT_MANUAL_ONLY ' /tmp/p886-owner)" -eq 6
          node scripts/test-m1-owner-pair-admission-846.mjs
  evidence-adversarial-and-ci-no-truth-NO-DEPLOY:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: True Git HEAD and every exact P78 case-witness evidence negative test
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/mission1-release-evidence-851.test.mjs | tee /tmp/p886-focused
          grep -Eq '^# fail 0$' /tmp/p886-focused
          node scripts/m1-release-evidence-851.mjs | tee /tmp/p886-blank
          grep -Fq '"status":"BLOCKED"' /tmp/p886-blank
          grep -Fq '"countOfIndependentHumanBlindSources":0' /tmp/p886-blank
          grep -Fq '"countOfPhysicalDevicePlatforms":0' /tmp/p886-blank
          grep -Fq '"shouldLiftFamilyAlphaHold":false' /tmp/p886-blank
          echo P886_NO_PRIVATE_LABELS_PHONES_OR_CLOUD_ASSERTED
