name: Staging bundle complete-byte SHA-256 inventory QA
on:
  push:
    branches: [security/staging-asset-byte-integrity-20261021]
permissions:
  contents: read
jobs:
  sealed-bundle-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm customer app and hosted production unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 3e594a5714b7822ada852cd74d8bc5dc2d51c6ad HEAD -- public supabase .github/workflows/pages.yml .github/workflows/cloudflare-pages.yml
          node scripts/check-staging-preflight-scope.mjs
          node scripts/check-integrated-pilot-rc.mjs
          node scripts/check-customer-pilot-release-gates.mjs
      - name: Verify all staging seal corruption and tamper refusals
        run: |
          node --test tests/staging-asset-seal.test.mjs tests/staging-artifact-integrity.test.mjs tests/atomic-staging-output.test.mjs
          node --test tests/restricted-staging-integration.test.mjs
      - name: Full app regression suite
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Build only an invented restricted static staging candidate
        env:
          CLOSET_STAGING_APP_ORIGIN: https://preview.closet-current-staging.pages.dev/
          CLOSET_STAGING_SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
          CLOSET_STAGING_SUPABASE_PUBLISHABLE_KEY: sb_publishable_STAGING_TEST_FIXTURE_XYZ001
        run: |
          node scripts/build-restricted-staging.mjs
          node scripts/verify-restricted-staging-bundle.mjs
          node scripts/test-staging-sw-cache.mjs
      - name: No hosted deployment or paid resources
        run: echo 'UNSIGNED ASSET BYTE INVENTORY REVIEW ONLY; NO DEPLOYMENT, REAL ACCOUNTS OR PAID PROVIDERS'
