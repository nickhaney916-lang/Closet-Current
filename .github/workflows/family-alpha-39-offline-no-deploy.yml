name: Family Alpha 39 Capture Research OFFLINE NO DEPLOY
on:
  pull_request:
    paths: ['research/family-alpha-39/**', 'tests/research39/**', 'scripts/test-family-alpha-39-browser.mjs', '.github/workflows/family-alpha-39-offline-no-deploy.yml']
permissions:
  contents: read
jobs:
  capture-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - run: node --test tests/research39/*.test.mjs
      - run: node scripts/test-family-alpha-39-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: work39-offline-capture-screenshots-HOLD
          path: benchmark/family-alpha-39/
