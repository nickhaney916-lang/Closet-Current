name: MAIN182 genuine WebKit model and user zero-proposal fallback NO DEPLOY HOLD
on:
  push:
    branches: [research/main182-m180-m181-combined-failclosed-HOLD]
permissions:
  contents: read
jobs:
  inherited-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: M182 exact M180 parent and immutable M181 fallback donor
        shell: bash
        run: |
          set -euo pipefail
          BASE=3ba517c386629d14eabcfa6a8137563f58cfa70b
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | while IFS= read -r path; do
            case "$path" in
              public/outfit-capture.js|tests/outfit-capture.test.cjs|scripts/test-main181-zero-proposal-native-browser.mjs|research/master-consolidation-1054/M181-ZERO-PROPOSAL-NATIVE-FAILCLOSED-HOLD.md|.github/workflows/main182-m180-m181-combined-no-deploy.yml|research/master-consolidation-1054/M182-M180-M181-INTEGRATED-ACCEPTANCE-HOLD.md) ;;
              *) echo "M181 blocked unreviewed change: $path"; exit 1 ;;
            esac
          done
          test "$(git rev-parse HEAD:public/outfit-capture.js)" = b85242b7856c3b83ed4c38afcb4b409f7292933e
          test "$(git rev-parse HEAD:.github/workflows/main180-unmodified-webkit-firstload-no-deploy.yml)" = bdbde623f95bf975f43f4ead7154b52241e4747b
          test "$(git rev-parse HEAD:.github/workflows/main1054-m58-real-p88-worker-no-deploy.yml)" = 04705da387b22c5a2ee88f2ba8ba4111f2f57063
          test "$(git rev-parse HEAD:.github/workflows/main173-unflagged-owner-24mp-no-deploy.yml)" = fcc91363bc82fe0b48641dd88c4e0b7483d545d2
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse HEAD:tests/outfit-capture.test.cjs)" = ab60c5d45b60f5f8daf994898bcd2146f1a97f45
          test "$(git rev-parse HEAD:scripts/test-main181-zero-proposal-native-browser.mjs)" = ea1a5bdb7f0617c71695f9b0382afd6ff7d5f089
          test "$(git rev-parse HEAD:research/master-consolidation-1054/M181-ZERO-PROPOSAL-NATIVE-FAILCLOSED-HOLD.md)" = b408db8aeb16750b87a18f940d40d7bf4d05497b
          git diff --exit-code "$BASE" HEAD -- public/app.js public/outfit-worker.mjs public/outfit-worker-p94.mjs public/outfit-board.js public/auth.js public/native-default-atomic-import-m3.mjs public/native-default-verified-backup-export-m3.mjs supabase/ benchmark/fixtures/
          node --check public/outfit-capture.js
          node --check scripts/test-main181-zero-proposal-native-browser.mjs
      - name: Install pinned test dependencies without hosted writes
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Build exact native PWA with worker unchanged
        run: |
          node scripts/build.mjs
          test -s dist/index.html
          grep -Fq 'No new clothing pieces were added. Nothing was saved.' dist/outfit-capture.js
      - name: All inherited source, owner, backup and privacy Node regressions
        run: node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  browsers:
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M181_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact-reviewed negative-only test and native consumer blobs
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD:public/outfit-capture.js)" = b85242b7856c3b83ed4c38afcb4b409f7292933e
          test "$(git rev-parse HEAD:scripts/test-main181-zero-proposal-native-browser.mjs)" = ea1a5bdb7f0617c71695f9b0382afd6ff7d5f089
      - name: Install pinned Playwright and browser tools
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Actual offline PWA build; never deploy
        run: node scripts/build.mjs
      - name: Unflagged native browser negative worker completion -> retry -> real Single item -> explicit owner approved original
        shell: bash
        run: |
          set -euo pipefail
          for width in 320 390 430; do
            M181_WIDTH="$width" node scripts/test-main181-zero-proposal-native-browser.mjs
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main181-${{ matrix.engine }}-synthetic-negative-no-deploy-HOLD
          path: benchmark/main181-zero-result-native/${{ matrix.engine }}/**/*.json
          retention-days: 14
          if-no-files-found: warn
  m182-unmodified-webkit-firstload:
    name: unmodified P88 native WebKit first-load ${{ matrix.independent_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        independent_run: [1, 2, 3]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: webkit
      P94_WIDTH: '390'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard joined M181 fail-closed and original real P88
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          PARENT=3ba517c386629d14eabcfa6a8137563f58cfa70b
          P88=cc4554ef0104506a72bf0a28423fee52b6e4fff2
          git merge-base --is-ancestor "$PARENT" HEAD
          git cat-file -e "$P88^{commit}"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse HEAD:public/outfit-instance-review-840.mjs)" = 6324d8eda33024f166311f424392ed83363e4942
          test "$(git rev-parse HEAD:research/multi-garment-capture-01/review-ui.mjs)" = d478fcf6e4e8889a23b1620b444667ac949da7a9
          test "$(git rev-parse HEAD:scripts/test-main58-actual-p88-wasm-browser.mjs)" = 96ba2f5ee2420de52f45911881fdcc139455c353
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          test "$(git rev-parse HEAD:public/native-reviewed-private-save-167.mjs)" = 8a4c5f1ba513792c8cacbf898d9263ce76a78963
          test "$(git rev-parse HEAD:public/native-2d-preview-p99.mjs)" = 52d2b6d8834f27d9114e022fe8574947eda85206
          test "$(git rev-parse HEAD:public/native-photo-3d-veto-p99.mjs)" = 82b93d12d2fbcba146a190f5dce87a6ac5fc44af
          test "$(git rev-parse HEAD:research/parallel96-highres/source-derivative-intake96.mjs)" = 1840c4496aefc28941f4c3de24a29bac1cb5e792
          # Two strict inherited CI allowlists: only known M180 filename additions.
          # Blob-pinned end to end; no product/model/assertion/receipt relaxation.
          test "$(git rev-parse HEAD:.github/workflows/main1054-m58-real-p88-worker-no-deploy.yml)" = 04705da387b22c5a2ee88f2ba8ba4111f2f57063
          test "$(git rev-parse HEAD:.github/workflows/main173-unflagged-owner-24mp-no-deploy.yml)" = fcc91363bc82fe0b48641dd88c4e0b7483d545d2
          test "$(git rev-parse "$P88:public/outfit-worker.mjs")" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse "$P88:public/outfit-segmentation.mjs")" = d357955dd8fdab7c0cb727ea597c270edd9309ac
          git diff --exit-code "$PARENT" HEAD -- public/ ':(exclude)public/outfit-capture.js' scripts/ ':(exclude)scripts/test-main181-zero-proposal-native-browser.mjs' tests/ ':(exclude)tests/outfit-capture.test.cjs' supabase/ benchmark/ research/multi-garment-capture-01/ research/parallel96-highres/
          test "$(git rev-parse HEAD:public/outfit-capture.js)" = b85242b7856c3b83ed4c38afcb4b409f7292933e
          test "$(git rev-parse HEAD:tests/outfit-capture.test.cjs)" = ab60c5d45b60f5f8daf994898bcd2146f1a97f45
          test "$(git rev-parse HEAD:scripts/test-main181-zero-proposal-native-browser.mjs)" = ea1a5bdb7f0617c71695f9b0382afd6ff7d5f089
          test "$(git rev-parse HEAD:research/master-consolidation-1054/M181-ZERO-PROPOSAL-NATIVE-FAILCLOSED-HOLD.md)" = b408db8aeb16750b87a18f940d40d7bf4d05497b
          git diff --name-only "$PARENT" HEAD | while IFS= read -r path; do
            case "$path" in
              public/outfit-capture.js|tests/outfit-capture.test.cjs|scripts/test-main181-zero-proposal-native-browser.mjs|research/master-consolidation-1054/M181-ZERO-PROPOSAL-NATIVE-FAILCLOSED-HOLD.md|.github/workflows/main182-m180-m181-combined-no-deploy.yml|research/master-consolidation-1054/M182-M180-M181-INTEGRATED-ACCEPTANCE-HOLD.md) ;;
              *) echo "M180 unexpected modified source path: $path"; exit 1 ;;
            esac
          done
          node --check scripts/test-main58-actual-p88-wasm-browser.mjs
          node --check scripts/test-parallel94-native-p88-browser.mjs
      - name: Extract immutable P88 donor ONLY into disposable local CI route
        shell: bash
        run: |
          set -euo pipefail
          P88=cc4554ef0104506a72bf0a28423fee52b6e4fff2
          mkdir -p .m57-exact-p88-donor/public
          for file in outfit-worker.mjs outfit-segmentation.mjs outfit-instance-review-840.mjs photo-color.js; do
            git show "$P88:public/$file" > ".m57-exact-p88-donor/public/$file"
            test "$(git hash-object ".m57-exact-p88-donor/public/$file")" = "$(git rev-parse "$P88:public/$file")"
          done
      - name: Install same pinned genuine browser/WASM test runtime
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Genuine first WebKit browser process - original M58 owner and real WASM model
        run: node scripts/test-main58-actual-p88-wasm-browser.mjs
      - name: Genuine second fresh WebKit process - installed unmodified P94 source and owner/restore
        run: node scripts/test-parallel94-native-p88-browser.mjs
      - name: Verify exact model receipt and mandatory no-silent-save gates
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('benchmark/main58-real-p88-browser-worker/webkit/M58-ACTUAL-P88-BROWSER-NO-SILENT-SAVE.json','utf8'));
          if(r.actualBrowser!=='webkit'||r.actualP88ModuleWorkerExecuted!==true||
             r.noSyntheticWorker!==true||r.sourceVerified!==true||
             !(r.sourceGroupsUnverified>=1&&r.sourceGroupsUnverified<=12)||
             r.ownerPrivateSaves!==0||r.unexpectedOutbound?.length!==0||
             r.hostedSignedRLS!==false||r.physicalDevice!==false||
             r.familyAlpha!=='HOLD'||r.releaseAllowed!==false)
            throw Error('M180 unmodified WebKit genuine-model/no-silent-save receipt failed');
          console.log('M180_GENUINE_WEBKIT_FIRSTLOAD_SOURCE_SAFE_PASS',JSON.stringify({
            actualWebKit:true,unmodifiedWorker:true,sourceVerified:true,
            unverifiedGroups:r.sourceGroupsUnverified,ownerPrivateSaves:0,
            firstLoadAcceptanceOnly:true,physicalDevice:false,hostedRLS:false,
            familyAlpha:'HOLD',releaseAllowed:false
          }));
          JS
