name: Mission 1 P864 never silently discard original capture — NO DEPLOY
on:
  push:
    branches: [research/mission1-original-photo-review-864-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m1-p864-original-photo-HOLD
  cancel-in-progress: true
jobs:
  native-original-no-discard-NO-DEPLOY:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact P863 immutable parent and five-file no-deploy-only scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=312b1c7545e201d831db8fa654a120005c280974
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE" HEAD >/tmp/m1-p864-paths
          cat /tmp/m1-p864-paths
          test "$(wc -l </tmp/m1-p864-paths)" -eq 5
          while IFS= read -r p; do
            case "$p" in
              public/app.js|tests/automatic-indexing.test.cjs|tests/mission1-original-photo-no-auto-discard-864.test.mjs|research/mission1-original-photo-no-auto-discard-864/REPORT.md|.github/workflows/mission1-original-photo-no-auto-discard-864-no-deploy.yml) ;;
              *) echo "P864 UNAUTHORIZED PATH $p"; exit 1;;
            esac
          done </tmp/m1-p864-paths
          test -z "$(git diff --name-only "$BASE" HEAD -- public/local-worker.mjs public/recognition-engine.mjs public/recognition-confusion-guard.mjs public/clothing-memory.js public/cloud-backup.js public/recognition-vectors.bin supabase benchmark)"
          grep -Fq 'Family Alpha HOLD #255 OPEN' research/mission1-original-photo-no-auto-discard-864/REPORT.md
          grep -Fq "if(quality.blank){" public/app.js
          grep -Fq "exact_duplicate_review_required" public/app.js
          grep -Fq 'const reviewFirst836=true;' public/app.js
          echo P864_SCOPED_SOURCE_PASS
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Source-executed photo-original regressions, all native tests, build, release BLOCKED
        run: |
          set -euo pipefail
          node --check public/app.js
          node --test tests/automatic-indexing.test.cjs tests/mission1-original-photo-no-auto-discard-864.test.mjs tests/mission1-mask-category-evidence-863.test.mjs
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          P79_REQUIRE_DECODER=1 node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
          node scripts/m1-release-evidence-851.mjs | tee /tmp/p864-release
          grep -Fq '"status":"BLOCKED"' /tmp/p864-release
          grep -Fq '"shouldLiftFamilyAlphaHold":false' /tmp/p864-release
  desktop-existing-owner-browser-NOT-physical-devices:
    needs: native-original-no-discard-NO-DEPLOY
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium webkit
      - name: Actual native owner-review/camera/footwear controls, synthetic inputs only
        run: |
          set -euo pipefail
          node scripts/test-m1-review-first-default-843.mjs
          node scripts/test-parallel80-subtype-browser.mjs
          node scripts/test-m1-owner-pair-admission-846.mjs
