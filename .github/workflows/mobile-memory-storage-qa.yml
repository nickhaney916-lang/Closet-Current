name: Mobile photo memory, draft coalescing and quota recovery QA
on:
  push:
    branches: [fix/mobile-photo-memory-quota-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-node:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve original photos, account admission, video, recognition, backup and review evidence
        run: |
          node scripts/check-mobile-memory-storage-scope.mjs
          node scripts/check-customer-pilot-release-gates.mjs
          git worktree add --detach "$RUNNER_TEMP/verified-pr135" 8fbe7096e655f06dd9d414521f32d1a11182c322
          (cd "$RUNNER_TEMP/verified-pr135" && node scripts/check-photo-batch-owner-scope.mjs)
      - name: Build and complete Node suite
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
  mobile-memory-and-storage:
    needs: source-and-node
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Chromium and WebKit
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium webkit
          node scripts/build.mjs
      - name: Compare exact baseline resource use and test quota retry on small and large synthetic closets
        run: node scripts/test-mobile-memory-storage-browsers.mjs
      - name: Preserve phone source quality, decoder failures and owner cancellation
        run: |
          node scripts/test-photo-batch-owner-mobile.mjs
          node scripts/test-untyped-photo-import-mobile.mjs
          node scripts/test-video-import-bounded-mobile.mjs
          node scripts/test-inspiration-original-photo-browsers.mjs
      - name: Cloud session ownership and interrupted sync recovery
        run: |
          node scripts/test-cloud-session-generation-browsers.mjs
          node scripts/test-cloud-conflict-retry-browsers.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-memory-storage-synthetic-evidence
          path: artifacts/
