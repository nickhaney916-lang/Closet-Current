name: MAIN245 original Worker CDN ONNX WASM binary identity HOLD
on:
  push:
    branches: [research/main245-original-worker-jsep-runtime-asset-identity-HOLD]
  pull_request:
    branches: [research/main244-original-owner-vs-native-graph-parity-HOLD]
permissions:
  contents: read
jobs:
  security:
    name: M245 source guards, original app build, full inherited privacy/security
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Four added research files only and unchanged installed Worker/browser
        shell: bash
        run: |
          set -euo pipefail
          BASE=76bbd7dd4a01d172bca92efa8b1b0541035a8ea5
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE" HEAD)" = "$(printf '%s\n' '.github/workflows/main245-original-worker-cdn-runtime-HOLD.yml' 'scripts/main245-original-worker-cdn-wasm-identity.mjs' 'scripts/test-main245-real-p94-runtime-identity-browser.mjs' 'tests/main245-pinned-public-wasm-runtime-identity.test.mjs')"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          node --check scripts/main245-original-worker-cdn-wasm-identity.mjs
          node --check scripts/test-main245-real-p94-runtime-identity-browser.mjs
          node --test tests/main245-pinned-public-wasm-runtime-identity.test.mjs
          M245_SOURCE_ONLY=1 node scripts/test-main245-real-p94-runtime-identity-browser.mjs
      - name: Original pinned no-release dependencies
        run: npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Pinned package integrity, full offline original app and all Node privacy security
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm view onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 dist.integrity)" = "sha512-0uS76OPgH0hWCPrFKlL8kYVV7ckM7t/36HfbgoFw6Nd0CZVVbQC4PkrR8mBX8LtNUFZO25IQBqV2Hx2ho3FlbQ=="
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  browser:
    name: M245 genuine original Worker and public WASM asset ${{ matrix.engine }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, chromium]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M245_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify untouched P94 real Worker and source-only no-leak logic
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 76bbd7dd4a01d172bca92efa8b1b0541035a8ea5 HEAD
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          node --test tests/main245-pinned-public-wasm-runtime-identity.test.mjs
          M245_SOURCE_ONLY=1 node scripts/test-main245-real-p94-runtime-identity-browser.mjs
      - name: Install original source, runtime and browser dependencies only
        run: npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Actual Worker native source-to-owner with SHA of loaded CDN public WASM
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node scripts/test-main245-real-p94-runtime-identity-browser.mjs
