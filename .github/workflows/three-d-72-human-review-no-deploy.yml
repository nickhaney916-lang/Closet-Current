name: 3D-72 genuine 360 human visual-review gallery (DRAFT HOLD NO DEPLOY)
on:
  pull_request:
    paths:
      - 'research/three-d-72/**'
      - 'scripts/build-three-d-72-human-gallery.mjs'
      - 'tests/three-d-72-human-review.test.mjs'
      - '.github/workflows/three-d-72-human-review-no-deploy.yml'
permissions:
  contents: read
jobs:
  original-source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Strict green 3D71 ancestor and research-only changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor ca578b12b4cc2714f484d0582651ca56bd89ce0a HEAD
          git diff --name-only ca578b12b4cc2714f484d0582651ca56bd89ce0a HEAD | while IFS= read -r file; do
            case "$file" in
              research/three-d-72/*|scripts/build-three-d-72-human-gallery.mjs|tests/three-d-72-human-review.test.mjs|.github/workflows/three-d-72-human-review-no-deploy.yml) ;;
              *) echo "UNAUTHORIZED outside 3D72 review: $file"; exit 1 ;;
            esac
          done
      - name: Install pinned source-only 3D tooling
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 three@0.180.0 playwright@1.56.1 three-mesh-bvh@0.9.2
      - name: Restore exact source CC0 163-bone male and female
        run: |
          git fetch --no-tags origin 53f2ad344dc56a1477e343531c423aed0e66c17d dd6bac3fa9ff640d4f562cf925337440bdb5cf8f 3a572193987cb29389727426136c6eb3ac326783 dfb40889c4c1221fb1833b859e8a11ef38aeb76e
          node research/three-d-20/restore-approved-models.mjs
      - name: Test 3D71 source geometry and truthful 3D72 review contracts
        run: |
          node --check research/three-d-72/review-gate.mjs
          node --check scripts/build-three-d-72-human-gallery.mjs
          node --test tests/three-d-72-human-review.test.mjs
          node --test tests/three-d-71-seat-thigh.test.mjs
      - name: Capture 72 real male/female CC0 skinned WebGL screenshots and 360 closure
        run: node scripts/test-three-d-71-seat-thigh-360-browser.mjs
      - name: Generate local, offline 36-pair before-and-after human review workbench
        run: node scripts/build-three-d-72-human-gallery.mjs
      - name: Verify real source images, honest HOLD and review export
        run: |
          node --input-type=module <<'CHECK'
          import {readFileSync,readdirSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const m=JSON.parse(readFileSync('benchmark/three-d-72/verified-review-manifest.json','utf8'));
          const html=readFileSync('benchmark/three-d-72/index.html','utf8');
          assert.equal(m.caseCount,36);assert.equal(m.imageCount,72);
          assert.equal(m.comparisons.length,36);
          assert.equal(m.visualReviewStatus,'UNREVIEWED');
          assert.equal(m.humanAestheticApproved,false);
          assert.equal(m.photographedDenimImproved,false);
          assert.equal(m.authenticAndroidPhoneVerified,false);
          assert.equal(m.authenticIphoneVerified,false);
          assert.equal(m.familyAlpha,'HOLD');assert.equal(m.releaseAuthorized,false);
          assert.equal(readdirSync('benchmark/three-d-71').filter(n=>n.endsWith('.png')).length,72);
          for(const x of m.comparisons){
            assert.match(x.sha256Before,/^[a-f0-9]{64}$/);
            assert.match(x.sha256After,/^[a-f0-9]{64}$/);
            assert.ok(html.includes('../three-d-71/'+x.before));
            assert.ok(html.includes('../three-d-71/'+x.after));
          }
          assert.ok(html.includes('NOT genuine photographed denim'));
          assert.ok(html.includes('humanPhotorealismApproved:false'));
          CHECK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: THREE-D-72-REAL-CC0-360-HUMAN-VISUAL-REVIEW-HOLD
          path: |
            benchmark/three-d-71/
            benchmark/three-d-72/
          if-no-files-found: warn
