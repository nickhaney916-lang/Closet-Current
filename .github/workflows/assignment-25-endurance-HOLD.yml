name: Assignment 25 repeated wardrobe use HOLD
on:
  pull_request:
    branches: [research/main1054-unified-active-session-HOLD]
permissions:
  contents: read
jobs:
  regression:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/assignment-25-endurance-HOLD'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record exact candidate and verify application provenance
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git merge-base --is-ancestor 2f57f8753d56907bc686f2fcfd58c12e3cb357cc HEAD
          git diff --exit-code 2f57f8753d56907bc686f2fcfd58c12e3cb357cc HEAD -- public supabase ':(exclude)public/navigation.js'
          git log -1 --format='commit %H tree %T'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: node scripts/build.mjs
      - run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
  endurance:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/assignment-25-endurance-HOLD'
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        width: [320, 390, 430]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SUPABASE_TELEMETRY_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin the inherited test policy
        run: |
          git diff --exit-code 2f57f8753d56907bc686f2fcfd58c12e3cb357cc HEAD -- supabase scripts/assignment-21 scripts/assignment-22
          cmp scripts/assignment-21/disposable-policy.sql supabase/cloud-backup.sql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.48.3
      - name: Build and install browser dependencies
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3
          npx playwright install --with-deps ${{ matrix.engine }}
          node scripts/build.mjs
      - name: Start isolated Supabase Auth, PostgREST, Storage and Postgres
        run: |
          set -eu
          umask 077
          mkdir "$RUNNER_TEMP/closet-a25"
          cd "$RUNNER_TEMP/closet-a25"
          supabase init
          sed -i 's/^project_id = .*/project_id = "closet-a25"/; s/^jwt_expiry = .*/jwt_expiry = 3600/' supabase/config.toml
          grep -q '^jwt_expiry = 3600$' supabase/config.toml
          supabase --version
          # Each attempt receives a fresh group of loopback ports. Keep the
          # probes open together so two config entries never get the same port.
          pick_ports() {
            python3 - <<'PYTHON'
          import re
          import socket
          from pathlib import Path

          config = Path("supabase/config.toml")
          probes = []

          def replace(match):
              probe = socket.socket()
              probes.append(probe)
              probe.bind(("127.0.0.1", 0))
              return match[1] + str(probe.getsockname()[1])

          try:
              text, count = re.subn(
                  r"(?m)^(\s*(?:[a-z_]+_)?port\s*=\s*)[0-9]+",
                  replace, config.read_text(),
              )
              if count < 3:
                  raise SystemExit("Expected API, database and shadow port declarations")
              config.write_text(text)
              print(f"Assigned {count} distinct local ports")
          finally:
              for probe in probes:
                  probe.close()
          PYTHON
          }
          # Retry infrastructure startup only, before applying SQL or creating owners.
          # Emit classified counters, never raw CLI output (may include credentials).
          started=0
          for attempt in 1 2 3; do
            pick_ports
            log="$RUNNER_TEMP/closet-a25-start.log"
            if supabase start > "$log" 2>&1; then
              echo "Disposable scale backend started on attempt $attempt"
              started=1
              break
            else
              code=$?
              echo "Disposable scale backend startup attempt $attempt failed (exit $code)"
            fi
            for category in 'timeout|timed out|deadline exceeded' 'rate limit|too many requests|429' 'no space left|disk full' 'unhealthy|health check' 'connection refused|connection reset|network|TLS' 'address already in use|port is already allocated' 'pull access denied|manifest unknown|unauthorized'; do
              count=$(grep -Eic "$category" "$log" || true)
              printf 'Startup diagnostic category [%s]: %s\n' "$category" "$count"
            done
            # These commands target only this ephemeral runner's test project.
            docker ps -a --filter 'name=closet-a25' --format '{{.Names}} {{.Status}}'
            df -h "$RUNNER_TEMP"
            if ! supabase stop --no-backup > "$RUNNER_TEMP/closet-a25-stop.log" 2>&1; then
              echo 'Disposable project cleanup failed; refusing unsafe retry'
              exit 1
            fi
            if test "$attempt" -lt 3; then sleep "$((attempt * 15))"; fi
          done
          test "$started" = 1 || { echo 'Disposable backend startup exhausted three attempts'; exit 1; }
          supabase status -o env > "$RUNNER_TEMP/closet-a25.env"
          docker exec -i supabase_db_closet-a25 psql -U postgres -v ON_ERROR_STOP=1 < "$GITHUB_WORKSPACE/scripts/assignment-21/disposable-policy.sql"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD:supabase/cloud-backup-active-session.sql)" = 56eedc11006bc2e670f8e1da8d8b7e50a3342eb3
          docker exec -i supabase_db_closet-a25 psql -U postgres -v ON_ERROR_STOP=1 < "$GITHUB_WORKSPACE/supabase/cloud-backup-active-session.sql"
          docker exec -i supabase_db_closet-a25 psql -U postgres -v ON_ERROR_STOP=1 < "$GITHUB_WORKSPACE/scripts/assignment-22/policy-contract.sql"
          docker exec supabase_db_closet-a25 psql -U postgres -Atc 'show server_version'
          docker inspect --format '{{.Config.Image}}' supabase_auth_closet-a25 supabase_rest_closet-a25 supabase_storage_closet-a25
      - name: Run sequential browser endurance
        env:
          A25_ENGINE: ${{ matrix.engine }}
          A25_WIDTH: ${{ matrix.width }}
        run: |
          set -o pipefail
          export SUPABASE_TEST_ENV="$RUNNER_TEMP/closet-a25.env"
          node scripts/assignment-25/browser.mjs 2>&1 | tee "$RUNNER_TEMP/assignment-25.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assignment-25-${{ matrix.engine }}-${{ matrix.width }}
          path: ${{ runner.temp }}/assignment-25.log
          if-no-files-found: ignore
      - name: Destroy disposable backend
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/closet-a25/supabase/config.toml"; then
            (cd "$RUNNER_TEMP/closet-a25" && supabase stop --no-backup >/dev/null 2>&1)
          fi
          rm -f "$RUNNER_TEMP/closet-a25.env" "$RUNNER_TEMP/closet-a25-start.log" "$RUNNER_TEMP/closet-a25-stop.log"
