jobs:
  exact-parent-source-photo-and-complete-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exactly inherited verified P157 and six isolated P158 files, no shipping app or photo writes
        run: |
          set -eu
          BASE=1063f0f229b7b7b26e1eebb6c784706ebcc0661c
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          FIRST="$(git rev-list --reverse "$BASE..HEAD" | head -n1)"
          test "$(git rev-parse "$FIRST^")" = "$BASE"
          git diff --name-only "$BASE" HEAD >/tmp/p158-files
          while IFS= read -r p; do
            case "$p" in
              research/licensed-face-skin-neck-harmony-158/skin-neck-harmony.mjs|research/licensed-face-skin-neck-harmony-158/REPORT.md|scripts/install-licensed-face-skin-neck-158.mjs|scripts/audit-licensed-face-skin-neck-harmony-158.mjs|tests/licensed-face-skin-neck-harmony-158.test.mjs|.github/workflows/licensed-face-skin-neck-harmony-158-no-deploy.yml) ;;
              *) echo "P158 REFUSE shipping app, P157 accepted baseline, wardrobe, staging or production mutation: $p"; exit 1 ;;
            esac
          done </tmp/p158-files
          test "$(wc -l </tmp/p158-files)" -eq 6
          git diff --exit-code "$BASE" HEAD -- public supabase package.json package-lock.json research/real-face-original-photo-body-graft-157 research/rocketbox-wardrobe-separation-156
      - name: P158 reversible source albedo sampler and exact installer syntax; real 163-bone app regression
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
          node --check research/real-face-original-photo-body-graft-157/attach-licensed-head.mjs
          node --check scripts/install-real-face-original-outfit-157.mjs
          node --check scripts/audit-real-face-original-photo-body-graft-157.mjs
          node --check research/licensed-face-skin-neck-harmony-158/skin-neck-harmony.mjs
          node --check scripts/install-licensed-face-skin-neck-158.mjs
          node --check scripts/audit-licensed-face-skin-neck-harmony-158.mjs
          node --test tests/real-face-original-photo-body-graft-157.test.mjs tests/licensed-face-skin-neck-harmony-158.test.mjs
      - name: Unchanged native app build and entire inherited test suite
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
  actual-licensed-male-female-face-original-photo-outfit-mobile-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source pinned real WebGL/GLTF/Sharp browser dependencies only
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Reconstruct exact P150 source and P152 body skin, P153 anatomically attached scalp, P154 real original face baseline into pinned detached P541
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          P150=6e576da9d7ff6a0a439a7762cf333670d20f0131
          P118=672247f7121e92bba32b81cec74efddb2b69c817
          P541=df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          git fetch --no-tags origin "$P150" "$P118" "$P541"
          git worktree add --detach .p150-donor-541 "$P541"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/.p150-donor-541"
          test "$(git -C .p150-donor-541 rev-parse HEAD)" = "$P541"
          ln -s ../node_modules .p150-donor-541/node_modules
          cd .p150-donor-541
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
          mkdir -p research/dual-humanoid-photorealism-118
          git -C .. show "$P118":scripts/install-dual-humanoid-realism-118.mjs > scripts/install-dual-humanoid-realism-118.mjs
          cd ..
          for path in research/dual-humanoid-photorealism-118/realism.mjs research/dual-humanoid-face-definition-131/face-definition.mjs research/dual-humanoid-photorealistic-integration-150/apply-humanoid.mjs scripts/install-dual-humanoid-face-131.mjs scripts/install-dual-humanoid-photorealistic-integration-150.mjs; do
            test ! -e "$path"
            mkdir -p "$(dirname "$path")"
            git show "$P150:$path" > "$path"
          done
          git show "$P150:scripts/test-native-3d-05-browser.mjs" > scripts/test-native-3d-05-p150-157.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const f='scripts/test-native-3d-05-p150-157.mjs';
          let s=readFileSync(f,'utf8');
          const anchor='prunedHairStrands:overlay.skinHair.prunedHairStrands,';
          assert.equal(s.split(anchor).length,2,'P157 exact pinned P150 native 3D evidence anchor changed');
          s=s.replace(anchor,anchor+
           'headHairMeshCount153:overlay.headHair153?.hairMeshes||0,'+
           'faceContourMeshCount154:overlay.faceContours154?.contourMeshes||0,'+
           'licensedHeadAttached157:overlay.licensedHead157?.headAttachedToOriginal163Bone===true,'+
           'licensedHeadSourceRigBones157:overlay.licensedHead157?.originalLicensedHeadRigBones||0,'+
           'licensedHeadSHA157:overlay.licensedHead157?.originalLicensedP156HeadSHA256||null,'+
           'licensedOriginalBodyUnchanged157:overlay.licensedHead157?.originalSourceBodyGeometryIndicesChanged===false,'+
           'licensedOriginalPhotoUnchanged157:overlay.licensedHead157?.originalSavedOwnerPhotoOrCutoutBytesChanged===false,'+
           'licensedGarmentCountUnchanged157:overlay.licensedHead157?.originalGarmentMeshesBefore===overlay.licensedHead157?.originalGarmentMeshesAfter,'+
           'originalHeadMaskActive157:overlay.licensedHead157?.oldFaceBodyMaterialMaskedWithoutGeometryChanges===true,'+
           'licensedHeadTopError157:overlay.licensedHead157?.actualHeadTopError??999,'+
           'licensedNeckSeam157:overlay.licensedHead157?.neckSeamSignedWorldY??999,'+
           'skinHarmonyApplied158:overlay.licensedHead157?.skinHarmony158?.harmonyApplied===true,'+
           'skinHarmonySamples158:overlay.licensedHead157?.skinHarmony158?.sourceFaceAlbedoSamplePixels||0,'+
           'skinHarmonyMaterials158:overlay.licensedHead157?.skinHarmony158?.matchedExposedBodyPBRMaterials||0,'+
           'skinHarmonyBodyDelta158:overlay.licensedHead157?.skinHarmony158?.actualBodySkinLinearChange||0,'+
           'skinHarmonySourceSHA158:overlay.licensedHead157?.skinHarmony158?.sourceP156HeadSHA256||null,');
          const p150Marker="r.face?.photorealismProven===false&&r.releaseAuthorized===false;";
          assert.equal(s.split(p150Marker).length,2,'P157 saved outfit source marker changed');
          s=s.replace(p150Marker,
           "r.face?.photorealismProven===false&&r.releaseAuthorized===false&&"+
           "(r.licensedHead157===undefined||r.licensedHead157.headAttachedToOriginal163Bone===true);");
          const errAnchor="  page.on('pageerror',e=>errors.push({width,message:e.message}));";
          assert.equal(s.split(errAnchor).length,2,'P157 actual browser console diagnostic anchor unavailable');
          s=s.replace(errAnchor,"  page.on('pageerror',e=>{errors.push({width,message:e.message});console.error('P157_REAL_PAGE_EXCEPTION',e.message);});"+
           "\n  page.on('console',m=>{if(m.type()==='error'){const detail=m.text();console.error('P157_REAL_WEBGL_CONSOLE',detail);if(/THREE\\.WebGLProgram: Shader Error|WebGL: INVALID_OPERATION: useProgram|ERROR: 0:\\d+:|P157_RESEARCH_FACE_GRAFT_REFUSED SKIN158|P157_EXACT_SOURCE_ASSET_REFUSED/i.test(detail))errors.push({width,message:'P157_WEBGL_SHADER_FAILURE: '+detail.slice(0,250)});}});"+
           "\n  page.on('requestfailed',r=>console.error('P157_REAL_HTTP_REQUEST_FAILED',r.url(),r.failure()?.errorText));");
          const gate="  await page.waitForFunction(()=>window.native3D05Bridge?.state().modelReady&&";
          assert.ok(s.includes(gate),'P157 original 163-bone genuine WebGL gate changed');
          s=s.replaceAll(gate,"  console.log('P157_REAL_OUTFIT_PREVIEW_GATE',JSON.stringify(await page.evaluate(()=>({state:window.native3D05Bridge?.state?.(),status:document.getElementById('outfit3D01Status')?.textContent,nativeStatus:document.getElementById('native3D05Status')?.textContent,builderStatus:document.getElementById('outfit3D01Status')?.textContent,appMessage:document.getElementById('message')?.textContent,model:document.getElementById('outfit3D01Canvas')?.dataset?.model}))));\n"+gate);
          writeFileSync(f,s);
          NODE
          node .p150-donor-541/scripts/install-dual-humanoid-realism-118.mjs .p150-donor-541
          node scripts/install-dual-humanoid-face-131.mjs .p150-donor-541
          node scripts/install-dual-humanoid-photorealistic-integration-150.mjs .p150-donor-541
          node scripts/install-dual-humanoid-visible-skin-152.mjs .p150-donor-541
          node scripts/install-dual-humanoid-head-hair-153.mjs .p150-donor-541
          node scripts/install-dual-humanoid-facial-contours-154.mjs .p150-donor-541
          node --check scripts/test-native-3d-05-p150-157.mjs
          test "$(git -C .p150-donor-541 rev-parse HEAD)" = "$P541"
          ln -s .p150-donor-541 .native05-donor-541
      - name: Download exact original MIT-licensed male/female GLBs into disposable CI and physically rebuild verified textured HEAD + HAIR with no source clothing
        run: |
          set -eu
          SRC=https://raw.githubusercontent.com/927tanmay/react-ai-voice-avatar/fc1398c2f8ba600c3676a5277684ed4f3e2731d7/assets/avatars
          mkdir -p benchmark/dual-human-foundation-candidate-155/assets
          for f in ananya.glb aarav.glb; do
            curl --fail --silent --show-error --location --retry 3 --max-time 180 "$SRC/$f" -o "benchmark/dual-human-foundation-candidate-155/assets/$f"
