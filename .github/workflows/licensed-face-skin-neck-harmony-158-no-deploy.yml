name: P158 FACE ALBEDO TO ORIGINAL 163-BONE EXPOSED BODY SKIN NO DEPLOY
on:
  push:
    branches:
      - research/licensed-face-skin-neck-harmony-158-main-20261107-HOLD
  pull_request:
    branches:
      - research/real-face-original-photo-body-graft-157-main-20261107-HOLD
    paths:
      - research/licensed-face-skin-neck-harmony-158/**
      - scripts/install-licensed-face-skin-neck-158.mjs
      - scripts/audit-licensed-face-skin-neck-harmony-158.mjs
