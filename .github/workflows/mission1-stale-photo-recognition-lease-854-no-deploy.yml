name: Mission 1 P854 stale original-photo / signed-owner lease — NO DEPLOY
on:
  push:
    branches: [research/mission1-stale-photo-recognition-lease-854-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mission1-p854-stale-photo-HOLD
  cancel-in-progress: true
jobs:
  source-lease-native-no-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable verified P853 exact parent and four-path scope, HOLD
        shell: bash
        run: |
          set -euo pipefail
          BASE=29d1905172ab21a277021ac40333174e70879a0d
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE" HEAD >/tmp/p854-paths
          cat /tmp/p854-paths
          test "$(wc -l </tmp/p854-paths)" -eq 4
          while IFS= read -r p; do
            case "$p" in
              public/app.js|tests/mission1-stale-photo-recognition-lease-854.test.cjs|research/mission1-stale-photo-recognition-lease-854/REPORT.md|.github/workflows/mission1-stale-photo-recognition-lease-854-no-deploy.yml) ;;
              *) echo "P854 OUT OF SCOPE: $p"; exit 1 ;;
            esac
          done </tmp/p854-paths
          test -z "$(git diff --name-only "$BASE" HEAD -- public/local-worker.mjs public/outfit-worker.mjs public/outfit-capture.js public/recognition-engine.mjs public/photo-color.js public/cross-capture-duplicate-77.js public/garment-color-76.mjs public/review-queue-850.js public/device-acceptance-78.js public/clothing-memory.js supabase benchmark)"
          grep -Fqx 'const reviewFirst836=true;' <(grep '^const reviewFirst836=' public/app.js)
          grep -Fq 'P849_CHANGED_CANDIDATE_OR_OWNER' public/app.js
          grep -Fq 'reviewQueue850.keepForLater(batch,window.closetAuth.user)' public/app.js
          grep -Fq 'function learningScope72()' public/app.js
          grep -Fq "const live854=()=>sameOwner854()" public/app.js
          grep -Fq "result=await localRequest('classify',source73,item.id,item.segmentHint);" public/app.js
          grep -Fq 'FAMILY ALPHA HOLD #255 OPEN' research/mission1-stale-photo-recognition-lease-854/REPORT.md
          echo M1_P854_PINNED_PARENT_4_PATH_NO_DEPLOY_PASS
      - name: Install local-only testing/decoder dependencies, no production write
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Execute actual app scanner source against source/crop/mask/account race fixtures
        run: |
          set -euo pipefail
          node --check public/app.js
          node --test tests/mission1-stale-photo-recognition-lease-854.test.cjs
          echo M1_P854_ACTUAL_RECOGNIZEITEM_LEASE_SOURCE_TESTS_PASS
      - name: Preserve P853 labels and full native, both app builds; release remains BLOCKED
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          P79_REQUIRE_DECODER=1 node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
          node scripts/m1-release-evidence-851.mjs | tee /tmp/p854-release
          grep -Fq '"status":"BLOCKED"' /tmp/p854-release
          grep -Fq '"shouldLiftFamilyAlphaHold":false' /tmp/p854-release
          echo M1_P854_ALL_NATIVE_BUILDS_RELEASE_HOLD_PASS
  real-desktop-browsers-NOT-physical-phones:
    needs: source-lease-native-no-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium webkit
      - name: P853 annotation workstation and P852 local device panel on real desktop engines
        run: |
          set -euo pipefail
          node scripts/test-p79-workstation-browser.mjs
          node scripts/test-parallel78-device-browser.mjs
      - name: Inherited P850 batch, P849 duplicates, P848 colors, P847 consent and owner-reviewed first photo
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node scripts/test-m1-batch-review-850.mjs
          node scripts/test-parallel77-cross-capture-browser.mjs
          node scripts/test-parallel76-color-browser.mjs
          node scripts/test-m1-owner-learning-integration-847.mjs
          node scripts/test-m1-owner-pair-admission-846.mjs
          node scripts/test-m1-review-save-lifecycle-844.mjs parent
          node scripts/test-m1-review-save-lifecycle-844.mjs candidate
          node scripts/test-m1-review-first-default-843.mjs
          node scripts/test-m1-owner-review-editor-839.mjs
          echo M1_P854_ALL_INHERITED_DESKTOP_CHROMIUM_WEBKIT_PASS
  public-original-byte-provenance-NOT-model-accuracy:
    needs: source-lease-native-no-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      P73_PHOTO_IDS: commons-0003,commons-0014,commons-0021,commons-0033,commons-0049,commons-0060,commons-0077,commons-0082,commons-0094,validation-0001,validation-0019
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3
      - name: Verify lawful original JPEG byte hashes, NOT blind model accuracy
        run: |
          set -euo pipefail
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos "$P73_PHOTO_IDS"
          node scripts/evaluate-parallel73-real-photo.mjs
          echo M1_P854_11_PUBLIC_ORIGINAL_HASHES_NOT_HUMAN_TRUTH_PASS
