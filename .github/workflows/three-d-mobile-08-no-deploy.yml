name: Chat mobile 3D-08 verified model cache and mobile reliability (NO DEPLOY)
on:
  pull_request:
    branches:
      - research/work58-posed-real-clothing
    paths:
      - 'research/three-d-mobile-08/**'
      - 'scripts/test-three-d-mobile-08-*.mjs'
      - 'tests/three-d-mobile-08-*.test.mjs'
      - '.github/workflows/three-d-mobile-08-no-deploy.yml'
permissions:
  contents: read
jobs:
  verified-model-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure independent performance-only scope
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --name-only 7d05929a1a06d80d04a4ea000c419d30761c3c8c HEAD | while IFS= read -r path; do
            case "$path" in
              research/three-d-mobile-08/*|scripts/test-three-d-mobile-08-*.mjs|tests/three-d-mobile-08-*.test.mjs|.github/workflows/three-d-mobile-08-no-deploy.yml) ;;
              *) echo "Refusing garment, cloud, production or unrelated code change: $path"; exit 1 ;;
            esac
          done
      - name: Install pinned offline local renderer and browsers
        run: npm install --no-save --no-package-lock --no-audit --no-fund three@0.180.0 playwright@1.56.1 sharp@0.34.3
      - name: Rebuild only existing locked licensed test assets
        run: |
          git fetch --no-tags origin 53f2ad344dc56a1477e343531c423aed0e66c17d dd6bac3fa9ff640d4f562cf925337440bdb5cf8f 3a572193987cb29389727426136c6eb3ac326783
          node scripts/build-work47-benchmark.mjs
          node research/three-d-06/fetch-licensed-avatars.mjs
      - name: Exact CC0 source and independent cache verification and retry tests
        run: node --test tests/three-d-06-anatomical-models.test.mjs tests/three-d-07-source-rig.test.mjs tests/three-d-mobile-08-cache.test.mjs
      - name: Preserve Work58 fitted garment/source RGB behavior, not its single-stage file allowlist
        run: node --test --test-name-pattern="canonical Work56 fit|Original stock source and cutout" tests/three-d-09-integration.test.mjs
      - name: Real baseline vs cache WebGL2 measurement, touch, tab switching, and WebKit attempt
        run: node scripts/test-three-d-mobile-08-browser.mjs
      - name: Upload frozen measurements and actual WebGL screenshots (HOLD)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CHAT-MOBILE-3D08-CACHE-MOBILE-BASELINE-COMPARISON-HOLD
          path: benchmark/three-d-mobile-08/
          retention-days: 14
