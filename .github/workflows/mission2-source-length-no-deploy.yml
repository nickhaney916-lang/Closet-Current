name: Mission2 source-proportion physical length and posed body intersections NO DEPLOY
'on':
  push:
    branches:
    - research/mission2-source-length-20261110-HOLD
    - research/mission2-visible-dual-humanoid-delta-20261110-HOLD
    - research/mission2-surface-contact-20261110-HOLD
    - research/mission2-contact-constrained-source-20261110-HOLD
    - research/mission2-garment-part-contact-20261110-HOLD
    - research/mission2-self-contact-20261110-HOLD
    - research/mission2-adaptive-attribution-20261111-HOLD
    - research/mission2-unique-triangle-budget-20261111-HOLD
    - research/mission2-changed-face-self-delta-20261111-HOLD
    - research/mission2-body-contact-locality-20261111-HOLD
    - research/mission2-depth-clearance-experiment-20261111-HOLD
    - research/mission2-native-depth-trial-20261111-HOLD
    - research/mission2-intrapanel-fold-locality-20261111-HOLD
    - research/mission2-hem-depth-taper-20261111-HOLD
    - research/mission2-source-seam-contact-typing-20261111-HOLD
    - research/mission2-original-face-area-provenance-20261111-HOLD
    - research/mission2-upstream-face-quality-trace-20261111-HOLD
    - research/mission2-stage-blend-feasibility-20261111-HOLD
    - research/mission2-original-triangle-skin-provenance-20261111-HOLD
    - research/mission2-source-topology-triage-20261111-HOLD
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  source-length-and-full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - &id001
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - &id002
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Exact verified parent and nine research-only paths
      run: "set -eu\nBASE=349322687edb7035c321e11b54a9ed5c52476c5f\ntest \"$(git merge-base \"$BASE\" HEAD)\" = \"$BASE\"\ngit diff --name-only\
        \ \"$BASE\" HEAD > /tmp/mission2-length-paths\nwhile IFS= read -r p; do\n case \"$p\" in\n  tests/mission2-source-adaptive.test.mjs|research/mission2-source-length/ADAPTIVE-SAFETY-REPORT.md|tests/mission2-triangle-contacts.test.mjs|research/mission2-source-length/TRIANGLE-CONTACT-AUDIT.md|scripts/check-mission2-visual-delta.mjs|tests/mission2-visible-acceptance.test.mjs|research/mission2-source-length/source-length.mjs|research/mission2-source-length/source-projection.mjs|research/mission2-source-length/posed-intersections.mjs|research/mission2-source-length/REPORT.md|scripts/install-mission2-source-length.mjs|scripts/test-native-3d-05-browser.mjs|research/native-3d-05/native-preview-bridge.mjs|tests/mission2-source-length.test.mjs|.github/workflows/mission2-source-length-no-deploy.yml)\
        \ ;;\n  *) echo \"Unexpected source-length path $p\"; exit 1 ;;\n esac\ndone < /tmp/mission2-length-paths\ntest \"$(wc -l < /tmp/mission2-length-paths)\"\
        \ -eq 15\ngit diff --exit-code \"$BASE\" HEAD -- public supabase\n"
    - &id003
      run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
        axe-core@4.10.3
    - run: 'node --test tests/mission2-source-length.test.mjs

        node --test tests/mission2-triangle-contacts.test.mjs

        node --test tests/mission2-source-adaptive.test.mjs

        node scripts/build.mjs

        node --test --test-concurrency=1 tests/*.cjs tests/*.mjs'
  source-length-real-mobile-browser:
    outputs:
      locality390: ${{ steps.locality_probe.outputs.report }}
      depthTrial390: ${{ steps.depth_probe.outputs.report }}
      contactTyping390: ${{ steps.contact_typing_probe.outputs.report }}
      area390: ${{ steps.area_provenance_probe.outputs.report }}
      sourceStages390: ${{ steps.source_stages_probe.outputs.report }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    strategy:
      fail-fast: false
      matrix:
        engine:
        - chromium
        - webkit
    env:
      PHOTO_FIT171: '1'
      PHOTO_SILHOUETTE62: '1'
      PHOTO_SHOULDER185: '1'
      PHOTO_OWNER_CUTOUT186: '1'
      PHOTO_CUTOUT_PREFLIGHT187: '1'
      PHOTO_OWNER_POSITIVE188: '1'
      PHOTO_OWNER_ALPHA189: '1'
      PHOTO_OWNER_GEOMETRY190: '1'
      PHOTO_OWNER_TOPOLOGY191: '1'
      PHOTO_OWNER_BILATERAL195: '1'
      PHOTO_PHYSICAL_READBACK196: '1'
      PHOTO_SILHOUETTE62_BROWSER: ${{ matrix.engine }}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
    - *id001
    - *id002
    - *id003
    - name: Install genuine P541/P60/P172 source photo rig into disposable donor only
      run: "set -eu\ngit config --global --add safe.directory \"$GITHUB_WORKSPACE\"\ngit worktree add --detach .donor541 df6885d6011cb33fb22dceb81a08f35a0ac4dd61\n\
        git worktree add --detach .p60 6fe5e46b91533a96f3c0d86950ea077cb355c459\ngit worktree add --detach .p172 88d2fdb412f84b0498c86bfa17f4b391425e1958\n\
        for name in .donor541 .p60 .p172; do\n  git config --global --add safe.directory \"$GITHUB_WORKSPACE/$name\"\n  ln -s ../node_modules\
        \ \"$name/node_modules\"\ndone\ncd .donor541\nnode scripts/build-three-d-31-jeans-proposal.mjs\nnode scripts/build-three-d-37-second-jeans.mjs\n\
        node scripts/build-work47-benchmark.mjs\nnode research/three-d-20/restore-approved-models.mjs\ncd ..\ncd .p60 && node scripts/install-photo-cloth-realism-164.mjs\
        \ ../.donor541 && cd ..\nnode scripts/install-native-photo-anatomical-fit-171.mjs .donor541\nnode scripts/install-native-photo-torso-173.mjs\
        \ .donor541 .p172\nnode scripts/install-source-shoulder-seam-174.mjs .donor541\nnode scripts/install-native-original-dress-drape-175.mjs\
        \ .donor541\nnode scripts/install-user-photo-to-anatomical-3d-62.mjs .donor541\nnode scripts/install-photographed-garment-shoulder-185.mjs\
        \ .donor541\nnode scripts/install-owner-reviewed-cutout-texture-188.mjs .donor541\nnode scripts/install-owner-alpha-geometry-190.mjs .donor541\n\
        node scripts/install-owner-source-topology-191.mjs .donor541\n"
    - run: 'node scripts/install-mission2-source-length.mjs .donor541

        node scripts/build.mjs'
    - name: 'Before: genuine verified source/owner blouse at all widths and both figures'
      run: 'node scripts/test-native-3d-05-browser.mjs

        mkdir -p benchmark/mission2-source-length

        cp -a benchmark/user-photo-to-anatomical-3d-62/${{ matrix.engine }} benchmark/mission2-source-length/before-${{ matrix.engine }}

        rm -rf benchmark/user-photo-to-anatomical-3d-62/${{ matrix.engine }}'
    - name: 'After: measured source length, original UV/owner identity and actual posed body intersections'
      env:
        PHOTO_SOURCE_LENGTH: '1'
        PHOTO_SOURCE_PROJECTION: '1'
        PHOTO_TRIANGLE_CONTACTS: '1'
        MISSION2_PERFORMANCE: '1'
      run: 'node scripts/test-native-3d-05-browser.mjs

        cp -a benchmark/user-photo-to-anatomical-3d-62/${{ matrix.engine }} benchmark/mission2-source-length/after-${{ matrix.engine }}'
    - name: Independently SHA-audit 44 real before-after PNGs and six actual mesh receipts
      run: "node --input-type=module <<'NODE'\nimport assert from 'node:assert/strict';\nimport {readFileSync} from 'node:fs';\nimport {createHash}\
        \ from 'node:crypto';\nconst engine=process.env.PHOTO_SILHOUETTE62_BROWSER;\nconst root='benchmark/mission2-source-length/';\nlet count=0;\n\
        for(const stage of ['before','after']){\n const prefix=root+stage+'-'+engine+'/';\n const r=JSON.parse(readFileSync(prefix+'results.json','utf8'));\n\
        \ assert.equal(r.screens.length,22);assert.deepEqual(r.errors,[]);assert.equal(r.crashes.length,0);\n for(const s of r.screens){const\
        \ b=readFileSync(prefix+s.name);assert.equal(createHash('sha256').update(b).digest('hex'),s.sha256);assert.equal(b.readUInt32BE(16),s.width);count++;}\n\
        \ if(stage==='after'){\n  assert.equal(r.sourceLengthMode,true);assert.equal(r.sourceProjectionMode,true);assert.equal(r.sourceLengthEvidence.length,6);assert.equal(r.performanceSamples.length,6);\n\
        \  for(const width of [320,390,430])assert.deepEqual(r.sourceLengthEvidence.filter(x=>x.width===width).map(x=>x.figure).sort(),['female','male']);\n\
        \  for(const e of r.sourceLengthEvidence){assert.ok(e.movedVertices>=100);assert.ok(e.newHemY<e.oldHemY-.07);assert.ok(e.newHemY>=.55);assert.ok(e.intersectionPairsAfter<=e.intersectionPairsBefore);assert.ok(e.testedPairs>=3);assert.equal(e.collisionCertified,false);assert.equal(e.triangleAudit,true);assert.ok(Number.isInteger(e.triangleContactsBefore)&&e.triangleContactsBefore>0);assert.ok(Number.isInteger(e.triangleContactsAfter)&&e.triangleContactsAfter>=0);assert.ok(Number.isInteger(e.newTriangleContacts)&&e.newTriangleContacts>=0);assert.equal(e.sourceProjectionRGB,true);assert.ok(e.sourceProjectionCompiledMaterialCount>=1);assert.equal(e.bodyContactDistribution?.total,e.triangleContactsBefore);assert.equal(e.bodyContactDistribution?.sourceFaceIdentity,true);assert.equal(e.bodyContactDistribution?.releaseAuthorized,false);assert.ok(Number.isInteger(e.bodyContactDistribution?.byGarmentMesh?.length)&&e.bodyContactDistribution.byGarmentMesh.length>=3&&e.bodyContactDistribution.byGarmentMesh.length<=8);assert.equal(e.bodyContactDistribution.byGarmentMesh.reduce((a,n)=>a+n,0),e.bodyContactDistribution.total);assert.equal(e.bodyContactDistribution.byBodyMesh.reduce((a,n)=>a+n.contacts,0),e.bodyContactDistribution.total);}\n\
        \ }\n}\nassert.equal(count,44);console.log('M2_SOURCE_LENGTH_'+engine+'_44_REAL_SHA_SCREENSHOTS_POSED_BODY_NONREGRESSION');console.log('M2_TRIANGLE_CONTACTS_'+engine+':'+JSON.stringify(JSON.parse(readFileSync(root+'after-'+engine+'/results.json','utf8')).sourceLengthEvidence.map(x=>({width:x.width,figure:x.figure,before:x.triangleContactsBefore,after:x.triangleContactsAfter,new:x.newTriangleContacts}))));\nconsole.log('M2_CONTACT_ATTRIBUTION_'+engine+':'+JSON.stringify(JSON.parse(readFileSync(root+'after-'+engine+'/results.json','utf8')).sourceLengthEvidence.map(x=>({width:x.width,figure:x.figure,byGarment:x.bodyContactDistribution.byGarmentMesh,topBody:x.bodyContactDistribution.byBodyMesh.slice(0,6)}))));\nNODE"
    - name: Require genuine before/after pixels and independently distinct male/female anatomical scenes
      run: node scripts/check-mission2-visual-delta.mjs ${{ matrix.engine }}
    - name: Genuine signed-fixture owner original-photo fallback if source geometry adds triangle contacts
      env:
        PHOTO_SOURCE_LENGTH: '1'
        PHOTO_SOURCE_PROJECTION: '1'
        PHOTO_TRIANGLE_CONTACTS: '1'
        PHOTO_TRIANGLE_ADAPTIVE: '1'
        MISSION2_PERFORMANCE: '0'
      run: |
        node scripts/test-native-3d-05-browser.mjs
        mkdir -p benchmark/mission2-source-adaptive
        cp -a benchmark/user-photo-to-anatomical-3d-62/${{ matrix.engine }} benchmark/mission2-source-adaptive/${{ matrix.engine }}
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';
        import {readFileSync} from 'node:fs';
        import {createHash} from 'node:crypto';
        const engine=process.env.PHOTO_SILHOUETTE62_BROWSER;
        const dir='benchmark/mission2-source-adaptive/'+engine+'/';
        const r=JSON.parse(readFileSync(dir+'results.json','utf8'));
        assert.equal(r.sourceAdaptiveMode,true);
        assert.equal(r.cases,3);
        assert.equal(r.screens.length,6);
        assert.deepEqual(r.errors,[]);
        assert.equal(r.crashes.length,0);
        assert.equal(r.evidence.length,3);
        let rejected=0,accepted=0;
        const reasonCounts={};
        for(const e of r.evidence){
         assert.equal(e.originalJPEGRetained,true);
         assert.equal(e.originalPrivateOwnerRetained,true);
         assert.equal(e.realSignedInSavedBoardRetained,true);
         assert.equal(e.releaseAuthorized,false);
         assert.equal(e.noNewGarmentPartTriangleContactsIfAccepted,e.sampledPoseAdmitted);
         assert.equal(e.noNewIntrapanelTriangleContactsIfAccepted,e.sampledPoseAdmitted);
         assert.equal(e.changedFaceDeltaVerifiedIfAccepted,e.sampledPoseAdmitted);
         const d=e.safeBodyLocality;
         assert.equal(d?.accepted,e.sampledPoseAdmitted);
         assert.equal(d?.noPhotoOrOwnerFields,true);
         assert.equal(d?.releaseAuthorized,false);
         assert.ok(d.attempts.length>=1&&d.attempts.length<=4);
         if(!e.sampledPoseAdmitted)assert.equal(d.attempts.length,4);
         for(const a of d.attempts){
          if(a.bodyRegions){
           assert.equal(a.bodyRegions.originalFaceIdentity,true);
           assert.equal(a.bodyRegions.newContactCount,a.newBodyContacts);
           assert.equal(a.bodyRegions.byGarmentMesh.reduce((t,n)=>t+n,0),a.newBodyContacts);
           assert.equal(a.bodyRegions.byHeightQuartile.reduce((t,n)=>t+n,0),a.newBodyContacts);
          }
         }
         if(e.sampledPoseAdmitted){
          assert.equal(e.refusalReason,null);
          assert.equal(e.noNewBodyTriangleContactsIfAccepted,true);
          accepted++;
         }else{
          assert.equal(e.unsafe3DRefused,true);
          assert.match(e.refusalReason,/^[a-z-]+$/);
          reasonCounts[e.refusalReason]=(reasonCounts[e.refusalReason]||0)+1;
          rejected++;
         }
        }
        for(const s of r.screens){
         const b=readFileSync(dir+s.name);
         assert.equal(createHash('sha256').update(b).digest('hex'),s.sha256);
         assert.equal(b.readUInt32BE(16),s.width);
        }
        assert.equal(rejected+accepted,3);
        console.log('M2_ADAPTIVE_'+engine+'_REAL_BROWSER_SAFE_OR_2D_FALLBACK',JSON.stringify({rejected,accepted,screens:6,reasons:reasonCounts}));
        console.log('M2_ADAPTIVE_BODY_LOCALITY_'+engine+':'+JSON.stringify(r.evidence.filter(e=>e.width===390).map(e=>({
         width:e.width,reason:e.refusalReason,attempts:e.safeBodyLocality.attempts.map(a=>({
          scale:a.scale,reason:a.reason,newBodyContacts:a.newBodyContacts,
          byGarmentMesh:a.bodyRegions?.byGarmentMesh||null,
          byHeightQuartile:a.bodyRegions?.byHeightQuartile||null
         }))
        }))));
        NODE
    - name: Expose bounded no-photo contact counts at 390px for follow-on geometry repair
      id: locality_probe
      run: |
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';
        import {readFileSync,appendFileSync} from 'node:fs';
        const engine=process.env.PHOTO_SILHOUETTE62_BROWSER;
        const r=JSON.parse(readFileSync('benchmark/mission2-source-adaptive/'+engine+'/results.json','utf8'));
        const e=r.evidence.find(x=>x.width===390);
        assert.equal(e?.safeBodyLocality?.noPhotoOrOwnerFields,true);
        assert.equal(e?.safeBodyLocality?.attempts?.length,4);
        const a=e.safeBodyLocality.attempts;
        const counts=a.map(x=>Number.isSafeInteger(x.newBodyContacts)?x.newBodyContacts:'x').join(',');
        const last=a[3].bodyRegions;
        const m=last?.byGarmentMesh?.join(',')||'none';
        const h=last?.byHeightQuartile?.join(',')||'none';
        assert.match(m,/^(none|[0-9,]+)$/);
        assert.match(h,/^(none|[0-9,]+)$/);
        const report=engine+'-new['+counts+']-mesh['+m+']-height['+h+']';
        assert.ok(report.length<192);
        appendFileSync(process.env.GITHUB_OUTPUT,'report='+report+'\n');
        console.log('M2_LOCALITY_AGGREGATE_ONLY',report);
        NODE
    - name: Genuine signed-owner optical source depth trial (8 to 24mm) with no gate bypass
      id: depth_probe
      env:
        PHOTO_SOURCE_LENGTH: '1'
        PHOTO_SOURCE_PROJECTION: '1'
        PHOTO_TRIANGLE_CONTACTS: '1'
        PHOTO_TRIANGLE_ADAPTIVE: '1'
        PHOTO_DEPTH_EXPERIMENT: '1'
        PHOTO_STAGE_AREA_AUDIT: '1'
        MISSION2_PERFORMANCE: '0'
      run: |
        node scripts/test-native-3d-05-browser.mjs
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';
        import {readFileSync,appendFileSync} from 'node:fs';
        import {createHash} from 'node:crypto';
        const engine=process.env.PHOTO_SILHOUETTE62_BROWSER;
        const dir='benchmark/user-photo-to-anatomical-3d-62/'+engine+'/';
        const r=JSON.parse(readFileSync(dir+'results.json','utf8'));
        assert.equal(r.sourceAdaptiveMode,true);
        assert.equal(r.sourceDepthExperiment,true);
        assert.equal(r.evidence.length,3);
        assert.equal(r.screens.length,6);
        assert.deepEqual(r.errors,[]);
        assert.equal(r.crashes.length,0);
        let admitted=0;
        for(const e of r.evidence){
         const d=e.safeBodyLocality;
         assert.equal(e.nativeDepthExperiment,true);
         assert.equal(e.neverClaimedPhotographedDepth,true);
         const stages=e.safeStageAreaProvenance;
         assert.deepEqual(stages?.stages,[
          'anatomicalBeforePhoto','afterP62P185Photo','afterP190P195Owner']);
         assert.equal(stages.sourceTriangleIdentityUnchanged,true);
         assert.equal(stages.noSourceFaceIdsCoordinatesOrOwnerFields,true);
         assert.equal(stages.noCollisionWaived,true);
         assert.equal(stages.releaseAuthorized,false);
         assert.ok(stages.byGarmentMesh.length>=3&&stages.byGarmentMesh.length<=32);
         assert.equal(stages.sourcePieceCount,stages.byGarmentMesh.length);
         assert.equal(stages.totalOriginalSourceFaces,
          stages.byGarmentMesh.reduce((n,m)=>n+m.sourceFaceCount,0));
         assert.equal(stages.smallAfterPhotoFit,
          stages.smallAtAnatomicalConstruction+stages.newlySmallDuringPhotoFit-
           stages.recoveredDuringPhotoFit);
         assert.equal(stages.smallAfterOwnerMaskFit,
          stages.smallAfterPhotoFit+stages.newlySmallDuringOwnerMaskFit-
           stages.recoveredDuringOwnerMaskFit);
         assert.equal(e.realSignedInSavedBoardRetained,true);
         assert.equal(e.originalJPEGRetained,true);
         assert.equal(e.originalPrivateOwnerRetained,true);
         assert.equal(e.releaseAuthorized,false);
         assert.equal(d?.experimentalDepthTrial,true);
         assert.equal(d?.noPhotoOrOwnerFields,true);
         assert.equal(d?.releaseAuthorized,false);
         assert.ok(d.attempts.length>=4&&d.attempts.length<=16);
         assert.deepEqual(d.attempts.slice(0,4).map(a=>a.depthClearance),[0,0,0,0]);
         assert.ok(d.attempts.slice(0,10).every(a=>a.depthEasingExponent===1));
         assert.ok(d.attempts.slice(10).every(a=>a.depthClearance===.008&&
          [2,3,4].includes(a.depthEasingExponent)));
         for(const a of d.attempts){
          assert.ok([1,.75,.5,.25].includes(a.scale));
          assert.ok([0,.008,.016,.024].includes(a.depthClearance));
          assert.ok([1,2,3,4].includes(a.depthEasingExponent));
          if(a.selfContactTypes){
           const t=a.selfContactTypes;
           assert.equal(t.newSelfContactCount,a.newSelfContacts);
           assert.equal(t.noContactWaived,true);
           assert.equal(t.topologyGapIsNotASafetyExemption,true);
           assert.equal(t.noPhotoOrOwnerFields,true);
           assert.equal(t.releaseAuthorized,false);
           assert.equal(Object.values(t.byContactGeometry).reduce((v,n)=>v+n,0),a.newSelfContacts);
           assert.equal(t.byOriginalCoincidentCorners.reduce((v,n)=>v+n,0),a.newSelfContacts);
           assert.equal(t.byStagedCoincidentCorners.reduce((v,n)=>v+n,0),a.newSelfContacts);
           assert.equal(t.byGarmentMesh.reduce((v,n)=>v+n,0),a.newSelfContacts);
           assert.equal(t.noSmallAreaWaiver,true);
           assert.equal(Object.values(t.byPairAreaProvenance).reduce((v,n)=>v+n,0),a.newSelfContacts);
           assert.equal(Object.values(t.byUniqueFaceAreaProvenance).reduce((v,n)=>v+n,0),
            t.uniqueAffectedSourceFaceCount);
           assert.ok(t.uniqueAffectedSourceFaceCount<=a.newSelfContacts*2);
          }
          if(a.selfRegions){
           assert.equal(a.selfRegions.originalSourceFaceIdentity,true);
           assert.equal(a.selfRegions.newSelfContactCount,a.newSelfContacts);
           assert.equal(a.selfRegions.byGarmentMesh.reduce((t,n)=>t+n,0),a.newSelfContacts);
           assert.equal(a.selfRegions.byHeightBandPair.reduce((t,n)=>t+n,0),a.newSelfContacts);
           assert.equal(a.selfRegions.byHeightSeparation.reduce((t,n)=>t+n,0),a.newSelfContacts);
          }
          if(a.bodyRegions){
           assert.equal(a.bodyRegions.newContactCount,a.newBodyContacts);
           assert.equal(a.bodyRegions.byGarmentMesh.reduce((t,n)=>t+n,0),a.newBodyContacts);
           assert.equal(a.bodyRegions.byHeightQuartile.reduce((t,n)=>t+n,0),a.newBodyContacts);
          }
         }
         if(e.sampledPoseAdmitted){
          admitted++;
          assert.equal(e.changedFaceDeltaVerifiedIfAccepted,true);
          assert.equal(e.noNewBodyTriangleContactsIfAccepted,true);
          assert.equal(e.noNewGarmentPartTriangleContactsIfAccepted,true);
          assert.equal(e.noNewIntrapanelTriangleContactsIfAccepted,true);
          assert.ok(Number.isFinite(e.inferredDepthAcceptedIfAny));
          assert.equal(d.selectedDepthClearance,e.inferredDepthAcceptedIfAny);
          assert.equal(d.selectedDepthEasingExponent,e.inferredHemEasingAcceptedIfAny);
         }else{
          assert.equal(e.unsafe3DRefused,true);
          assert.equal(e.inferredDepthAcceptedIfAny,null);
          assert.equal(e.inferredHemEasingAcceptedIfAny,null);
          assert.equal(d.attempts.length,16);
         }
        }
        for(const shot of r.screens){
         const bytes=readFileSync(dir+shot.name);
         assert.equal(createHash('sha256').update(bytes).digest('hex'),shot.sha256);
         assert.equal(bytes.readUInt32BE(16),shot.width);
        }
        const selected=r.evidence.find(e=>e.width===390);
        assert.ok(selected);
        const d=selected.safeBodyLocality;
        const opt=d.attempts.slice(4);
        const bodyCounts=opt.map(a=>Number.isSafeInteger(a.newBodyContacts)?a.newBodyContacts:'x').join(',');
        const selfCounts=opt.map(a=>Number.isSafeInteger(a.newSelfContacts)?a.newSelfContacts:'x').join(',');
        const lastSelfBand=opt.at(-1)?.selfRegions?.byHeightBandPair?.join(',')||'none';
        const acceptedDepth=selected.inferredDepthAcceptedIfAny===null?'none':Math.round(selected.inferredDepthAcceptedIfAny*1000)+'mm';
        const easing=selected.inferredHemEasingAcceptedIfAny===null?'none':selected.inferredHemEasingAcceptedIfAny;
        const report=engine+'-admitted['+admitted+']-body['+bodyCounts+']-self['+selfCounts+']-lastBand['+lastSelfBand+']-depth['+acceptedDepth+']-easing['+easing+']';
        assert.ok(report.length<192);
        appendFileSync(process.env.GITHUB_OUTPUT,'report='+report+'\n');
        console.log('M2_NATIVE_DEPTH_TRIAL_AGGREGATE_ONLY',report);
        NODE
    - name: Classify genuine source self-fold intersections without seam exemptions or private triangle data
      id: contact_typing_probe
      env:
        PHOTO_SOURCE_LENGTH: '1'
        PHOTO_SOURCE_PROJECTION: '1'
        PHOTO_TRIANGLE_CONTACTS: '1'
        PHOTO_TRIANGLE_ADAPTIVE: '1'
        PHOTO_DEPTH_EXPERIMENT: '1'
      run: |
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';
        import {readFileSync,appendFileSync} from 'node:fs';
        const engine=process.env.PHOTO_SILHOUETTE62_BROWSER;
        const r=JSON.parse(readFileSync('benchmark/user-photo-to-anatomical-3d-62/'+engine+'/results.json','utf8'));
        const e=r.evidence.find(c=>c.width===390);
        assert.ok(e);
        const attempts=e.safeBodyLocality?.attempts;
        assert.ok(attempts?.length>=4&&attempts.length<=16);
        const active=attempts.slice(10);
        const classes=['twoSidedPlaneStraddle','nearCoplanarOverlap',
         'boundaryOrNearPlaneContact','degenerate'];
        for(const a of attempts){
         if(!a.selfContactTypes)continue;
         const t=a.selfContactTypes;
         assert.equal(t.newSelfContactCount,a.newSelfContacts);
         assert.equal(t.noContactWaived,true);
         assert.equal(t.topologyGapIsNotASafetyExemption,true);
         assert.equal(Object.values(t.byContactGeometry).reduce((v,n)=>v+n,0),a.newSelfContacts);
         assert.equal(t.byOriginalCoincidentCorners.reduce((v,n)=>v+n,0),a.newSelfContacts);
         assert.equal(t.byStagedCoincidentCorners.reduce((v,n)=>v+n,0),a.newSelfContacts);
        }
        const compact=c=>active.map(a=>a.selfContactTypes?.byContactGeometry?.[c]??'x').join(',');
        const edges=active.map(a=>a.selfContactTypes?.byOriginalCoincidentCorners?.[2]??'x').join(',');
        const report=engine+'-cross['+compact(classes[0])+']-cop['+compact(classes[1])+']-touch['+
         compact(classes[2])+']-deg['+compact(classes[3])+']-edge['+edges+']';
        assert.ok(report.length<192);
        appendFileSync(process.env.GITHUB_OUTPUT,'report='+report+'\n');
        console.log('M2_NATIVE_SOURCE_SEAM_CONTACT_CLASS_AGGREGATES',report);
        NODE
    - name: Verify original-versus-staged area collapse for unique true-source faces
      id: area_provenance_probe
      env:
        PHOTO_SOURCE_LENGTH: '1'
        PHOTO_SOURCE_PROJECTION: '1'
        PHOTO_TRIANGLE_CONTACTS: '1'
        PHOTO_TRIANGLE_ADAPTIVE: '1'
        PHOTO_DEPTH_EXPERIMENT: '1'
      run: |
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';
        import {readFileSync,appendFileSync} from 'node:fs';
        const engine=process.env.PHOTO_SILHOUETTE62_BROWSER;
        const r=JSON.parse(readFileSync('benchmark/user-photo-to-anatomical-3d-62/'+engine+'/results.json','utf8'));
        const e=r.evidence.find(c=>c.width===390);
        assert.ok(e);
        const attempts=e.safeBodyLocality?.attempts;
        assert.ok(attempts?.length>=4&&attempts.length<=16);
        for(const a of attempts){
         const t=a.selfContactTypes;
         if(!t)continue;
         assert.equal(t.newSelfContactCount,a.newSelfContacts);
         assert.equal(t.noContactWaived,true);
         assert.equal(t.noSmallAreaWaiver,true);
         assert.equal(t.sourceAreaCrossSquaredThreshold,1e-10);
         assert.equal(Object.values(t.byPairAreaProvenance).reduce((v,n)=>v+n,0),a.newSelfContacts);
         assert.equal(Object.values(t.byUniqueFaceAreaProvenance).reduce((v,n)=>v+n,0),
          t.uniqueAffectedSourceFaceCount);
         assert.ok(t.uniqueAffectedSourceFaceCount<=a.newSelfContacts*2);
        }
        const opt=attempts.slice(10);
        const group=k=>opt.map(a=>a.selfContactTypes?.byPairAreaProvenance?.[k]??'x').join(',');
        const unique=k=>opt.map(a=>a.selfContactTypes?.byUniqueFaceAreaProvenance?.[k]??'x').join(',');
        const report=engine+'-oldPair['+group('preexistingSmall')+']-newPair['+
         group('newlySmall')+']-oldFaces['+unique('preexistingSmall')+']-newFaces['+unique('newlySmall')+']';
        assert.ok(report.length<192);
        appendFileSync(process.env.GITHUB_OUTPUT,'report='+report+'\n');
        console.log('M2_SOURCE_FACE_AREA_PROVENANCE_AGGREGATE',report);
        NODE
    - name: Report exact anatomical-versus-P62-versus-P190 unique source face area origins
      id: source_stages_probe
      run: |
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';
        import {readFileSync,appendFileSync} from 'node:fs';
        const engine=process.env.PHOTO_SILHOUETTE62_BROWSER;
        const r=JSON.parse(readFileSync('benchmark/user-photo-to-anatomical-3d-62/'+engine+'/results.json','utf8'));
        assert.equal(r.sourceDepthExperiment,true);
        assert.equal(r.evidence.length,3);
        for(const e of r.evidence){
         const s=e.safeStageAreaProvenance;
         assert.equal(s.sourceAreaCrossSquaredThreshold,1e-10);
         assert.equal(s.sourceTriangleIdentityUnchanged,true);
         assert.equal(s.noSourceFaceIdsCoordinatesOrOwnerFields,true);
         assert.equal(s.noCollisionWaived,true);
         assert.equal(s.releaseAuthorized,false);
         assert.equal(s.physicalClearanceVerified,false);
         assert.ok(s.byGarmentMesh.length>=3&&s.byGarmentMesh.length<=32);
         assert.equal(s.sourcePieceCount,s.byGarmentMesh.length);
         assert.equal(s.totalOriginalSourceFaces,s.byGarmentMesh.reduce((a,b)=>a+b.sourceFaceCount,0));
         for(const [field,byMeshField] of [
          ['smallAtAnatomicalConstruction','originalSmall'],
          ['smallAfterPhotoFit','afterPhotoSmall'],
          ['smallAfterOwnerMaskFit','afterOwnerSmall'],
          ['newlySmallDuringPhotoFit','photoFitNewSmall'],
          ['newlySmallDuringOwnerMaskFit','ownerFitNewSmall']])
          assert.equal(s[field],s.byGarmentMesh.reduce((a,b)=>a+b[byMeshField],0));
        }
        const s=r.evidence.find(e=>e.width===390).safeStageAreaProvenance;
        const q=s.sourceTopologyQuality;
        assert.equal(q.totalSourceFaces,s.totalOriginalSourceFaces);
        assert.equal(q.originalLocalTinyFaces,s.sourceLocalSmallAtAnatomicalConstruction);
        assert.equal(Object.values(q.tinyShape).reduce((a,b)=>a+b,0),q.originalLocalTinyFaces);
        assert.equal(q.byMesh.length,s.byGarmentMesh.length);
        assert.equal(q.byMesh.reduce((n,m)=>n+m.localSmallFaces,0),q.originalLocalTinyFaces);
        assert.equal(q.sourceBoundaryFaceCount,
         q.byMesh.reduce((n,m)=>n+m.sourceBoundaryFaceCount,0));
        assert.equal(q.sourceNonManifoldFaceCount,
         q.byMesh.reduce((n,m)=>n+m.sourceNonManifoldFaceCount,0));
        assert.equal(q.noGeometryChanged,true);
        assert.equal(q.noCollisionWaived,true);
        assert.equal(q.exactIndexedAdjacencyNotPhysicalSewing,true);
        assert.equal(q.releaseAuthorized,false);
        assert.equal(s.noMeshRepairApplied,true);
        assert.equal(JSON.stringify(s).includes('localXYZ'),false);
        console.log('M2_NATIVE_SOURCE_TOPOLOGY_COUNTS_ONLY',
         engine+'-micro['+q.tinyShape.pointMicro+
         ']-edge['+q.tinyShape.nearCoincidentEdge+
         ']-sliver['+q.tinyShape.thinSliver+
         ']-wellShapedSmall['+q.tinyShape.smallButWellShaped+
         ']-smallBoundary['+q.localTinyBoundaryFaces+
         ']-smallInterior['+q.localTinyInteriorFaces+
         ']-smallNonManifold['+q.localTinyNonManifoldFaces+']');
        assert.equal(s.sourceWorldPosedSmallAtAnatomicalConstruction,s.smallAtAnatomicalConstruction);
        assert.equal(s.sourceLocalSmallOnlyBeforePose+s.sourceSmallInBothLocalAndWorldPose,
         s.sourceLocalSmallAtAnatomicalConstruction);
        assert.equal(s.sourceWorldPosedSmallOnlyAfterTransform+s.sourceSmallInBothLocalAndWorldPose,
         s.smallAtAnatomicalConstruction);
        assert.equal(s.worldPoseIncludesSkinAndMeshTransforms,true);
        assert.equal(s.sourceLocalVsWorldAreaThresholdIsDiagnosticOnly,true);
        for(const [total,key] of [
         ['sourceLocalSmallAtAnatomicalConstruction','originalLocalSmall'],
         ['sourceWorldPosedSmallOnlyAfterTransform','worldPosedSmallOnlyAfterTransform'],
         ['sourceRepeatedIndexFacesAtAnatomicalConstruction','repeatedSourceVertexIndexFaces']])
         assert.equal(s[total],s.byGarmentMesh.reduce((n,m)=>n+m[key],0));
        for(const [samples,before,after] of [
         [s.photoStageBlendFeasibility,s.smallAtAnatomicalConstruction,s.smallAfterPhotoFit],
         [s.ownerStageBlendFeasibility,s.smallAfterPhotoFit,s.smallAfterOwnerMaskFit]]){
         assert.deepEqual(samples.map(x=>x.fraction),[0,.25,.5,.75,1]);
         assert.equal(samples[0].smallSourceFaces,before);
         assert.equal(samples.at(-1).smallSourceFaces,after);
         for(const trial of samples)
          assert.equal(trial.smallSourceFaces,before+trial.newlySmallSourceFaces-trial.recoveredSourceFaces);
        }
        assert.equal(s.partialBlendNotApplied,true);
        assert.equal(s.sourcePhotoShapeUnverifiedForBlend,true);
        assert.equal(JSON.stringify(s).includes('posedXYZ'),false);
        const shorten=items=>items.map(x=>x.newlySmallSourceFaces).join(',');
        const report=engine+'-trialP62['+shorten(s.photoStageBlendFeasibility)+
         ']-trialP190['+shorten(s.ownerStageBlendFeasibility)+']';
        console.log('M2_STAGE_BLEND_TRIAL_COUNTS_ONLY',report);
        const legacyReport=engine+'-anatomy['+s.smallAtAnatomicalConstruction+
         ']-photo['+s.smallAfterPhotoFit+']-owner['+s.smallAfterOwnerMaskFit+
         ']-newP62['+s.newlySmallDuringPhotoFit+']-newP190['+s.newlySmallDuringOwnerMaskFit+
         ']-local['+s.sourceLocalSmallAtAnatomicalConstruction+
         ']-poseOnly['+s.sourceWorldPosedSmallOnlyAfterTransform+
         ']-dupIdx['+s.sourceRepeatedIndexFacesAtAnatomicalConstruction+']';
        assert.ok(report.length<192&&legacyReport.length<192);
        appendFileSync(process.env.GITHUB_OUTPUT,'report='+legacyReport+'\n');
        console.log('M2_ANATOMICAL_PHOTO_OWNER_AREA_STAGE_COUNTS',legacyReport);
        NODE
