name: Mission2 source-proportion physical length and posed body intersections NO DEPLOY
'on':
  push:
    branches:
    - research/mission2-source-length-20261110-HOLD
    - research/mission2-visible-dual-humanoid-delta-20261110-HOLD
    - research/mission2-surface-contact-20261110-HOLD
    - research/mission2-contact-constrained-source-20261110-HOLD
    - research/mission2-garment-part-contact-20261110-HOLD
    - research/mission2-self-contact-20261110-HOLD
    - research/mission2-adaptive-attribution-20261111-HOLD
    - research/mission2-unique-triangle-budget-20261111-HOLD
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  source-length-and-full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - &id001
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - &id002
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Exact verified parent and nine research-only paths
      run: "set -eu\nBASE=349322687edb7035c321e11b54a9ed5c52476c5f\ntest \"$(git merge-base \"$BASE\" HEAD)\" = \"$BASE\"\ngit diff --name-only\
        \ \"$BASE\" HEAD > /tmp/mission2-length-paths\nwhile IFS= read -r p; do\n case \"$p\" in\n  tests/mission2-source-adaptive.test.mjs|research/mission2-source-length/ADAPTIVE-SAFETY-REPORT.md|tests/mission2-triangle-contacts.test.mjs|research/mission2-source-length/TRIANGLE-CONTACT-AUDIT.md|scripts/check-mission2-visual-delta.mjs|tests/mission2-visible-acceptance.test.mjs|research/mission2-source-length/source-length.mjs|research/mission2-source-length/source-projection.mjs|research/mission2-source-length/posed-intersections.mjs|research/mission2-source-length/REPORT.md|scripts/install-mission2-source-length.mjs|scripts/test-native-3d-05-browser.mjs|research/native-3d-05/native-preview-bridge.mjs|tests/mission2-source-length.test.mjs|.github/workflows/mission2-source-length-no-deploy.yml)\
        \ ;;\n  *) echo \"Unexpected source-length path $p\"; exit 1 ;;\n esac\ndone < /tmp/mission2-length-paths\ntest \"$(wc -l < /tmp/mission2-length-paths)\"\
        \ -eq 15\ngit diff --exit-code \"$BASE\" HEAD -- public supabase\n"
    - &id003
      run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
        axe-core@4.10.3
    - run: 'node --test tests/mission2-source-length.test.mjs

        node --test tests/mission2-triangle-contacts.test.mjs

        node --test tests/mission2-source-adaptive.test.mjs

        node scripts/build.mjs

        node --test --test-concurrency=1 tests/*.cjs tests/*.mjs'
  source-length-real-mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    strategy:
      fail-fast: false
      matrix:
        engine:
        - chromium
        - webkit
    env:
      PHOTO_FIT171: '1'
      PHOTO_SILHOUETTE62: '1'
      PHOTO_SHOULDER185: '1'
      PHOTO_OWNER_CUTOUT186: '1'
      PHOTO_CUTOUT_PREFLIGHT187: '1'
      PHOTO_OWNER_POSITIVE188: '1'
      PHOTO_OWNER_ALPHA189: '1'
      PHOTO_OWNER_GEOMETRY190: '1'
      PHOTO_OWNER_TOPOLOGY191: '1'
      PHOTO_OWNER_BILATERAL195: '1'
      PHOTO_PHYSICAL_READBACK196: '1'
      PHOTO_SILHOUETTE62_BROWSER: ${{ matrix.engine }}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
    - *id001
    - *id002
    - *id003
    - name: Install genuine P541/P60/P172 source photo rig into disposable donor only
      run: "set -eu\ngit config --global --add safe.directory \"$GITHUB_WORKSPACE\"\ngit worktree add --detach .donor541 df6885d6011cb33fb22dceb81a08f35a0ac4dd61\n\
        git worktree add --detach .p60 6fe5e46b91533a96f3c0d86950ea077cb355c459\ngit worktree add --detach .p172 88d2fdb412f84b0498c86bfa17f4b391425e1958\n\
        for name in .donor541 .p60 .p172; do\n  git config --global --add safe.directory \"$GITHUB_WORKSPACE/$name\"\n  ln -s ../node_modules\
        \ \"$name/node_modules\"\ndone\ncd .donor541\nnode scripts/build-three-d-31-jeans-proposal.mjs\nnode scripts/build-three-d-37-second-jeans.mjs\n\
        node scripts/build-work47-benchmark.mjs\nnode research/three-d-20/restore-approved-models.mjs\ncd ..\ncd .p60 && node scripts/install-photo-cloth-realism-164.mjs\
        \ ../.donor541 && cd ..\nnode scripts/install-native-photo-anatomical-fit-171.mjs .donor541\nnode scripts/install-native-photo-torso-173.mjs\
        \ .donor541 .p172\nnode scripts/install-source-shoulder-seam-174.mjs .donor541\nnode scripts/install-native-original-dress-drape-175.mjs\
        \ .donor541\nnode scripts/install-user-photo-to-anatomical-3d-62.mjs .donor541\nnode scripts/install-photographed-garment-shoulder-185.mjs\
        \ .donor541\nnode scripts/install-owner-reviewed-cutout-texture-188.mjs .donor541\nnode scripts/install-owner-alpha-geometry-190.mjs .donor541\n\
        node scripts/install-owner-source-topology-191.mjs .donor541\n"
    - run: 'node scripts/install-mission2-source-length.mjs .donor541

        node scripts/build.mjs'
    - name: 'Before: genuine verified source/owner blouse at all widths and both figures'
      run: 'node scripts/test-native-3d-05-browser.mjs

        mkdir -p benchmark/mission2-source-length

        cp -a benchmark/user-photo-to-anatomical-3d-62/${{ matrix.engine }} benchmark/mission2-source-length/before-${{ matrix.engine }}

        rm -rf benchmark/user-photo-to-anatomical-3d-62/${{ matrix.engine }}'
    - name: 'After: measured source length, original UV/owner identity and actual posed body intersections'
      env:
        PHOTO_SOURCE_LENGTH: '1'
        PHOTO_SOURCE_PROJECTION: '1'
        PHOTO_TRIANGLE_CONTACTS: '1'
        MISSION2_PERFORMANCE: '1'
      run: 'node scripts/test-native-3d-05-browser.mjs

        cp -a benchmark/user-photo-to-anatomical-3d-62/${{ matrix.engine }} benchmark/mission2-source-length/after-${{ matrix.engine }}'
    - name: Independently SHA-audit 44 real before-after PNGs and six actual mesh receipts
      run: "node --input-type=module <<'NODE'\nimport assert from 'node:assert/strict';\nimport {readFileSync} from 'node:fs';\nimport {createHash}\
        \ from 'node:crypto';\nconst engine=process.env.PHOTO_SILHOUETTE62_BROWSER;\nconst root='benchmark/mission2-source-length/';\nlet count=0;\n\
        for(const stage of ['before','after']){\n const prefix=root+stage+'-'+engine+'/';\n const r=JSON.parse(readFileSync(prefix+'results.json','utf8'));\n\
        \ assert.equal(r.screens.length,22);assert.deepEqual(r.errors,[]);assert.equal(r.crashes.length,0);\n for(const s of r.screens){const\
        \ b=readFileSync(prefix+s.name);assert.equal(createHash('sha256').update(b).digest('hex'),s.sha256);assert.equal(b.readUInt32BE(16),s.width);count++;}\n\
        \ if(stage==='after'){\n  assert.equal(r.sourceLengthMode,true);assert.equal(r.sourceProjectionMode,true);assert.equal(r.sourceLengthEvidence.length,6);assert.equal(r.performanceSamples.length,6);\n\
        \  for(const width of [320,390,430])assert.deepEqual(r.sourceLengthEvidence.filter(x=>x.width===width).map(x=>x.figure).sort(),['female','male']);\n\
        \  for(const e of r.sourceLengthEvidence){assert.ok(e.movedVertices>=100);assert.ok(e.newHemY<e.oldHemY-.07);assert.ok(e.newHemY>=.55);assert.ok(e.intersectionPairsAfter<=e.intersectionPairsBefore);assert.ok(e.testedPairs>=3);assert.equal(e.collisionCertified,false);assert.equal(e.triangleAudit,true);assert.ok(Number.isInteger(e.triangleContactsBefore)&&e.triangleContactsBefore>0);assert.ok(Number.isInteger(e.triangleContactsAfter)&&e.triangleContactsAfter>=0);assert.ok(Number.isInteger(e.newTriangleContacts)&&e.newTriangleContacts>=0);assert.equal(e.sourceProjectionRGB,true);assert.ok(e.sourceProjectionCompiledMaterialCount>=1);assert.equal(e.bodyContactDistribution?.total,e.triangleContactsBefore);assert.equal(e.bodyContactDistribution?.sourceFaceIdentity,true);assert.equal(e.bodyContactDistribution?.releaseAuthorized,false);assert.ok(Number.isInteger(e.bodyContactDistribution?.byGarmentMesh?.length)&&e.bodyContactDistribution.byGarmentMesh.length>=3&&e.bodyContactDistribution.byGarmentMesh.length<=8);assert.equal(e.bodyContactDistribution.byGarmentMesh.reduce((a,n)=>a+n,0),e.bodyContactDistribution.total);assert.equal(e.bodyContactDistribution.byBodyMesh.reduce((a,n)=>a+n.contacts,0),e.bodyContactDistribution.total);}\n\
        \ }\n}\nassert.equal(count,44);console.log('M2_SOURCE_LENGTH_'+engine+'_44_REAL_SHA_SCREENSHOTS_POSED_BODY_NONREGRESSION');console.log('M2_TRIANGLE_CONTACTS_'+engine+':'+JSON.stringify(JSON.parse(readFileSync(root+'after-'+engine+'/results.json','utf8')).sourceLengthEvidence.map(x=>({width:x.width,figure:x.figure,before:x.triangleContactsBefore,after:x.triangleContactsAfter,new:x.newTriangleContacts}))));\nconsole.log('M2_CONTACT_ATTRIBUTION_'+engine+':'+JSON.stringify(JSON.parse(readFileSync(root+'after-'+engine+'/results.json','utf8')).sourceLengthEvidence.map(x=>({width:x.width,figure:x.figure,byGarment:x.bodyContactDistribution.byGarmentMesh,topBody:x.bodyContactDistribution.byBodyMesh.slice(0,6)}))));\nNODE"
    - name: Require genuine before/after pixels and independently distinct male/female anatomical scenes
      run: node scripts/check-mission2-visual-delta.mjs ${{ matrix.engine }}
    - name: Genuine signed-fixture owner original-photo fallback if source geometry adds triangle contacts
      env:
        PHOTO_SOURCE_LENGTH: '1'
        PHOTO_SOURCE_PROJECTION: '1'
        PHOTO_TRIANGLE_CONTACTS: '1'
        PHOTO_TRIANGLE_ADAPTIVE: '1'
        MISSION2_PERFORMANCE: '0'
      run: |
        node scripts/test-native-3d-05-browser.mjs
        mkdir -p benchmark/mission2-source-adaptive
        cp -a benchmark/user-photo-to-anatomical-3d-62/${{ matrix.engine }} benchmark/mission2-source-adaptive/${{ matrix.engine }}
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';
        import {readFileSync} from 'node:fs';
        import {createHash} from 'node:crypto';
        const engine=process.env.PHOTO_SILHOUETTE62_BROWSER;
        const dir='benchmark/mission2-source-adaptive/'+engine+'/';
        const r=JSON.parse(readFileSync(dir+'results.json','utf8'));
        assert.equal(r.sourceAdaptiveMode,true);
        assert.equal(r.cases,3);
        assert.equal(r.screens.length,6);
        assert.deepEqual(r.errors,[]);
        assert.equal(r.crashes.length,0);
        assert.equal(r.evidence.length,3);
        let rejected=0,accepted=0;
        const reasonCounts={};
        for(const e of r.evidence){
         assert.equal(e.originalJPEGRetained,true);
         assert.equal(e.originalPrivateOwnerRetained,true);
         assert.equal(e.realSignedInSavedBoardRetained,true);
         assert.equal(e.releaseAuthorized,false);
         assert.equal(e.noNewGarmentPartTriangleContactsIfAccepted,e.sampledPoseAdmitted);
         assert.equal(e.noNewIntrapanelTriangleContactsIfAccepted,e.sampledPoseAdmitted);
         if(e.sampledPoseAdmitted){
          assert.equal(e.refusalReason,null);
          assert.equal(e.noNewBodyTriangleContactsIfAccepted,true);
          accepted++;
         }else{
          assert.equal(e.unsafe3DRefused,true);
          assert.match(e.refusalReason,/^[a-z-]+$/);
          reasonCounts[e.refusalReason]=(reasonCounts[e.refusalReason]||0)+1;
          rejected++;
         }
        }
        for(const s of r.screens){
         const b=readFileSync(dir+s.name);
         assert.equal(createHash('sha256').update(b).digest('hex'),s.sha256);
         assert.equal(b.readUInt32BE(16),s.width);
        }
        assert.equal(rejected+accepted,3);
        console.log('M2_ADAPTIVE_'+engine+'_REAL_BROWSER_SAFE_OR_2D_FALLBACK',JSON.stringify({rejected,accepted,screens:6,reasons:reasonCounts}));
        NODE
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Mission2-source-length-${{ matrix.engine }}-before-after-HOLD
        path: 'benchmark/mission2-source-adaptive/

          benchmark/mission2-source-length/

          benchmark/user-photo-to-anatomical-3d-62/'
        retention-days: 14
        if-no-files-found: warn
