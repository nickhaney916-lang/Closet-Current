name: MAIN233 stopped-model manual original owner 2D/v4 full journey HOLD
on:
  push:
    branches: [research/main233-stopped-model-manual-source-v4-HOLD]
  pull_request:
    branches: [research/main231-p94-stalled-native-manual-owner-HOLD]
permissions:
  contents: read
jobs:
  full-node-source:
    name: M233 complete owner source backup privacy regression
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lock exact source ancestry and ONLY two new test/CI paths
        shell: bash
        run: |
          set -euo pipefail
          BASE=ef71c62970ac4bd51ca9bd5547c6b3d212ecbcd7
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE" HEAD)" = "$(printf '%s\n' '.github/workflows/main233-stopped-model-v4-no-deploy.yml' 'scripts/test-main233-stopped-p94-manual-full-v4-browser.mjs')"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:research/multi-garment-capture-01/review-ui.mjs)" = 1bd97b80b51fab1cb269ae565acb73a274b6e6d0
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          test "$(git rev-parse HEAD:scripts/test-main231-stalled-p94-native-owner-manual-browser.mjs)" = e853f1bc693e0359fd079a0017f5279911ecfc9d
          test "$(git rev-parse HEAD:scripts/test-main233-stopped-p94-manual-full-v4-browser.mjs)" = 6ee5974b8c0814dd82faccb31ccd73973fb47482
          test "$(git rev-parse HEAD:public/native-lossless-v4-owner-acceptance-m3.mjs)" = 988918ee194b04c4764ac32ac3124cc633863165
          node --check scripts/test-main233-stopped-p94-manual-full-v4-browser.mjs
      - name: Install pinned inherited app test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Offline PWA build and complete inherited Node owner security tests
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  true-native:
    name: M233 native stopped-model 2D-v4 owner A-B-A + original positive (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, chromium]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify held base and unchanged model/private owner source
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor ef71c62970ac4bd51ca9bd5547c6b3d212ecbcd7 HEAD
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:research/multi-garment-capture-01/review-ui.mjs)" = 1bd97b80b51fab1cb269ae565acb73a274b6e6d0
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          test "$(git rev-parse HEAD:scripts/test-main231-stalled-p94-native-owner-manual-browser.mjs)" = e853f1bc693e0359fd079a0017f5279911ecfc9d
          test "$(git rev-parse HEAD:scripts/test-main233-stopped-p94-manual-full-v4-browser.mjs)" = 6ee5974b8c0814dd82faccb31ccd73973fb47482
      - name: Install genuine browsers and app dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Real original app full manual 2D/v4 and A-B-A after controlled model stall at 320 and 430
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          for width in 320 430; do
            echo "M233 native $M58_ENGINE $width controlled stall negative"
            P94_WIDTH="$width" node scripts/test-main233-stopped-p94-manual-full-v4-browser.mjs
          done
      - name: Separate unchanged original positive P94 SegFormer WASM full 430 source owner v4 A-B-A
        shell: bash
        run: |
          P94_WIDTH=430 node scripts/test-parallel94-native-p88-browser.mjs
