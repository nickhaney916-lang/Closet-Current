name: MAIN1054 M267 original ONNX JSEP redirect request-chain integrity NO DEPLOY HOLD
on:
  push:
    branches: [research/main1054-m267-native-model-redirect-lineage-HOLD]
  pull_request:
    branches: [research/main1054-m265-original-jsep-http-trust-HOLD]
permissions:
  contents: read
jobs:
  source-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check first source ancestry, immutable original code, and ONLY isolated research diff
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          PARENT=6a6c62bbbf1fed39f649c32edcc162f1e961a816
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$PARENT" HEAD
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          test "$(git rev-parse HEAD:research/main1054/m265-original-jsep-http-truth.mjs)" = 8279ce7645a802657fe3d6c775bb1f7e1f718542
          git diff --name-only "$PARENT" HEAD | while IFS= read -r path; do
            case "$path" in
              research/main1054/m267-original-network-redirect-chain.mjs|tests/main1054-m267-original-network-chain.test.mjs|.github/workflows/main1054-m267-original-network-chain-no-deploy.yml) ;;
              *) echo "M264 out-of-scope change: $path"; exit 1 ;;
            esac
          done
          git diff --exit-code "$PARENT" HEAD -- public/ scripts/ supabase/ benchmark/ research/parallel106/
          node --check research/main1054/m267-original-network-redirect-chain.mjs
          node --test tests/main1054-m267-original-network-chain.test.mjs
      - name: Pinned test-only dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Full original offline app build and complete inherited private source/backup tests
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          test -s dist/index.html
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs

  original-browser:
    needs: source-node
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: webkit
            width: 390
          - engine: chromium
            width: 390
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: ${{ matrix.engine }}
      P94_WIDTH: ${{ matrix.width }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original P94 and Worker byte pins, actual native browser, fail-closed exact-first-attempt receipt
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
          node research/main1054/m267-original-network-redirect-chain.mjs prepare
          node --check scripts/.m267-original-network-chain.mjs
          set +e
          set -o pipefail
          node scripts/.m267-original-network-chain.mjs 2>&1 | tee m267-original.log
          model_exit=$?
          set -e
          test "$model_exit" -eq 0
          MODEL_EXIT="$model_exit" node research/main1054/m267-original-network-redirect-chain.mjs verify m267-original.log
