name: MAIN1054 unified autonomous maintenance and source-to-3D HOLD
on:
  pull_request:
    branches: [research/main1054-unified-saved-outfit-management-HOLD]
permissions:
  contents: read
jobs:
  native:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/main1054-unified-autonomous-maintenance-HOLD'
    strategy:
      fail-fast: false
      matrix:
        lane: [regression, restore-both-engines, chromium-source-mobile, webkit-native, stylist-chromium, stylist-webkit, ordinary-chromium, ordinary-webkit, auth, mutation-chromium, mutation-webkit, management-chromium, management-webkit, maintenance-chromium, maintenance-webkit, capture-both-engines, consumer-board-both-engines]
    runs-on: ubuntu-latest
    timeout-minutes: 110
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Immutable accepted integration parent and exact maintenance donor
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor fffe8ea6c715083f680a4453536198b9b9d2540f HEAD
          git merge-base --is-ancestor fee6a472e196f89b51fe810a832f9abf1bfb27ce HEAD
