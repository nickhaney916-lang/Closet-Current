          printf '%s\n' '.github/workflows/assignment-16-maintenance-no-deploy.yml' '.github/workflows/main1054-unified-autonomous-maintenance-HOLD.yml' 'docs/assignment-16-maintenance.md' 'public/outfit-board.js' 'scripts/maintenance/browser-test.mjs' 'scripts/maintenance/job.mjs' 'scripts/maintenance/recognition-contract.mjs' 'scripts/maintenance/store.mjs' 'scripts/maintenance/test-data.mjs' 'scripts/maintenance/trends.mjs' 'tests/maintenance-1684.test.mjs' 'scripts/test-mission3-offline-auth-recovery-browser.mjs' 'scripts/p1669-native-connectivity.cjs' | LC_ALL=C sort > /tmp/cc-expected-paths
          git diff --name-only fee6a472e196f89b51fe810a832f9abf1bfb27ce HEAD | LC_ALL=C sort > /tmp/cc-actual-paths
          diff -u /tmp/cc-expected-paths /tmp/cc-actual-paths
          test "$(git rev-parse HEAD:.github/workflows/assignment-16-maintenance-no-deploy.yml)" = de71b0be43fb09699e071f8b9aa4fdbecb91ca3e
          test "$(git rev-parse HEAD:docs/assignment-16-maintenance.md)" = 66baa49c32b045b715f0ce6e01c59b0d06460dfc
          test "$(git rev-parse HEAD:scripts/maintenance/browser-test.mjs)" = d4511c1d81e5dbf8eb19814889725efd46de9b45
          test "$(git rev-parse HEAD:scripts/maintenance/job.mjs)" = 241ad3999934be0a0dd502f926ef5f1069fe11e7
          test "$(git rev-parse HEAD:scripts/maintenance/recognition-contract.mjs)" = 28142372e8b337d8b5a47a059dac3561d66281cc
          test "$(git rev-parse HEAD:scripts/maintenance/store.mjs)" = 0fb1428218b2b96f27be70f6de3bac3c779b671b
          test "$(git rev-parse HEAD:scripts/maintenance/test-data.mjs)" = 948f3b4fd8e36683c6b2298278e4e7e1b797291e
