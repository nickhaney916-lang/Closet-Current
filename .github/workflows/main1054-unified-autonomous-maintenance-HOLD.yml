          test "$(git rev-parse 961956470e21ab5edc231060d48e076f1de4d323:scripts/test-mission3-offline-auth-recovery-browser.mjs)" = 5e499aefa49e66cf8a4f52bcdebb0ce8920368e2
          test "$(git rev-parse HEAD:scripts/test-mission3-offline-auth-recovery-browser.mjs)" = a1a0a3adfa75eb5f30ca8274b5bc5f93e81fba56
          git diff --exit-code 961956470e21ab5edc231060d48e076f1de4d323 HEAD -- . ':(exclude)scripts/p1669-native-connectivity.cjs' ':(exclude)scripts/test-mission3-offline-auth-recovery-browser.mjs' ':(exclude).github/workflows/main1054-unified-autonomous-maintenance-HOLD.yml'
