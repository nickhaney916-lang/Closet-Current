          git merge-base --is-ancestor f6ec61b6197c437675b9b16a4f55bf7e84341376 HEAD
          test "$(git rev-parse HEAD:.github/workflows/main1054-unified-wardrobe-mutation-HOLD.yml)" = 20f5b7be480bef4b6ea5f4fc8e7c556ed4625890
