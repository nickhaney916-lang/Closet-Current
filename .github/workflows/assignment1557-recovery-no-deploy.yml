name: Assignment 1557 recognition recovery
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/assignment1557-recovery-no-deploy.yml', 'tests/recognition-message-recovery.test.cjs']
permissions:
  contents: read
jobs:
  node-tests:
    if: github.head_ref == 'research/assignment1557-message-recovery-HOLD' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source and Node regressions
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          node --test tests/recognition-message-recovery.test.cjs
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
