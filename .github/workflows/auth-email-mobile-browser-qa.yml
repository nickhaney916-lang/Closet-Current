name: Mobile email callback and recovery browser rehearsal
on:
  push:
    branches: [qa/auth-email-mobile-browser-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-auth-and-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and complete no-paid-provider app regression
        run: |
          node --check scripts/test-auth-email-mobile-browsers.mjs
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Verify historic original-photo and human review source, block launch
        run: |
          node scripts/verify-camera-cloud-integration.mjs
          node scripts/check-dual-parent-review-integration.mjs
          node scripts/check-customer-pilot-release-gates.mjs
      - name: Install emulated Android Chromium and iPhone WebKit
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium webkit
      - name: Real browser DOM and touch tests with all Supabase fetch calls isolated
        run: node scripts/test-auth-email-mobile-browsers.mjs
