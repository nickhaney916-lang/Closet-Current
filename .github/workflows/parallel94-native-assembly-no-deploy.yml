name: PARALLEL94 native four-mission assembly real browser NO DEPLOY HOLD
on:
  push:
    branches: [research/parallel94-actual-four-mission-assembly-HOLD]
  pull_request:
    branches: [research/main1054-m58-real-p88-browser-worker-HOLD]
permissions:
  contents: read
jobs:
  p94-build-and-full-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin donor bytes, protected consumer and strictly scoped isolated diff
        shell: bash
        run: |
          set -euo pipefail
          BASE=d1f11b1d5a30eb2d3a8f82c9fca3c48fa2dc24c1
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse HEAD:public/outfit-instance-review-840.mjs)" = 6324d8eda33024f166311f424392ed83363e4942
          test "$(git rev-parse HEAD:public/app.js)" = 835b4ad1f4a4a7f520aad5afd225134e5ea56e2d
          test "$(git rev-parse HEAD:public/outfit-worker.mjs)" = 03f4f354f8ad28ed764bf2601d31b0577e6ca8f9
          test "$(git rev-parse HEAD:public/outfit-segmentation.mjs)" = d357955dd8fdab7c0cb727ea597c270edd9309ac
          test "$(git rev-parse HEAD:public/native-default-atomic-import-m3.mjs)" = e739f1533108d53961483d761a27f0525623af3d
          test "$(git rev-parse HEAD:public/native-default-verified-backup-export-m3.mjs)" = e70fdc392c2652dc969b7d7c4b807f3cafd81e03
          test "$(git rev-parse HEAD:research/main-thread-integration-1054/photographed-3d-evidence-gate15.mjs)" = 82b93d12d2fbcba146a190f5dce87a6ac5fc44af
          test "$(git rev-parse HEAD:public/outfit-board.js)" = 03c83b79e076ed3b7f67353cd3cd69f13529ccab
          git diff --name-only "$BASE" HEAD > /tmp/p94-changed
          while IFS= read -r file; do
            case "$file" in
              public/outfit-worker-p94.mjs|public/outfit-instance-review-840.mjs|research/multi-garment-capture-01/review-ui.mjs|scripts/test-parallel94-native-p88-browser.mjs|.github/workflows/parallel94-native-assembly-no-deploy.yml|research/parallel94-assembly/README.md) ;;
              *) echo "Unexpected protected path: $file"; exit 1;;
            esac
          done < /tmp/p94-changed
          node --check public/outfit-worker-p94.mjs
          node --check public/outfit-instance-review-840.mjs
          node --check research/multi-garment-capture-01/review-ui.mjs
          node --check scripts/test-parallel94-native-p88-browser.mjs
      - name: Install isolated pinned test tools
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Offline actual application build (never deploy)
        run: node scripts/build.mjs
      - name: Execute full inherited strict Node suite
        run: node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  p94-real-worker-private-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        width: [320,390,430]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: ${{ matrix.engine }}
      P94_WIDTH: ${{ matrix.width }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify native worker, unchanged owner-original and main importer
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor d1f11b1d5a30eb2d3a8f82c9fca3c48fa2dc24c1 HEAD
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse HEAD:public/outfit-instance-review-840.mjs)" = 6324d8eda33024f166311f424392ed83363e4942
          test "$(git rev-parse HEAD:public/native-default-atomic-import-m3.mjs)" = e739f1533108d53961483d761a27f0525623af3d
          test "$(git rev-parse HEAD:public/app.js)" = 835b4ad1f4a4a7f520aad5afd225134e5ea56e2d
          node --check scripts/test-parallel94-native-p88-browser.mjs
      - name: Install pinned WASM/real browser dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Genuine SegFormer browser worker then human review, original, owner-private outfit and v4 atomic restore
        run: node scripts/test-parallel94-native-p88-browser.mjs
      - name: Real native two-distinct-original v3 top/bottom photo-only restore (320/390/430)
        if: matrix.width == 390
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:scripts/test-main1054-m123-photo119-restore-2d-browser.mjs)" = b76ffa0625d421a36a1cf3bcc00d109e9cea42b9
          M123_ENGINE="${M58_ENGINE}" node scripts/test-main1054-m123-photo119-restore-2d-browser.mjs "benchmark/parallel94-native-v3-distinct-sources/${M58_ENGINE}"
      - name: Archive source-safe metadata receipt ONLY
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel94-${{ matrix.engine }}-${{ matrix.width }}-HOLD
          path: benchmark/parallel94-native-p88-browser/${{ matrix.engine }}/${{ matrix.width }}/M58-ACTUAL-P88-BROWSER-NO-SILENT-SAVE.json
          retention-days: 14
          if-no-files-found: ignore
