name: Mission 1 P854 full signed human-label consensus — NO DEPLOY
on:
  push:
    branches: [research/mission1-full-annotation-consensus-854-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mission1-p854-full-consensus-HOLD
  cancel-in-progress: true
jobs:
  pinned-parent-consensus-native-HOLD:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact verified P853 parent, exactly five research-only paths, HOLD
        shell: bash
        run: |
          set -euo pipefail
          BASE=29d1905172ab21a277021ac40333174e70879a0d
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE" HEAD > /tmp/p854-files
          cat /tmp/p854-files
          test "$(wc -l </tmp/p854-files)" -eq 5
          while IFS= read -r p; do
            case "$p" in
              scripts/p75-dataset-core.mjs|tests/parallel75-independent-ground-truth.test.mjs|tests/mission1-full-label-consensus-854.test.mjs|research/mission1-full-label-consensus-854/REPORT.md|.github/workflows/mission1-full-label-consensus-854-no-deploy.yml) ;;
              *) echo "M1 P854 OUT-OF-SCOPE: $p"; exit 1 ;;
            esac
          done </tmp/p854-files
          test -z "$(git diff --name-only "$BASE" HEAD -- public supabase benchmark scripts/p75-review-offline.mjs scripts/p79-workstation-core.mjs scripts/m1-release-evidence-851.mjs)"
          grep -Fq 'FAMILY ALPHA HOLD #255 OPEN' research/mission1-full-label-consensus-854/REPORT.md
          grep -Fq 'completeSignedLabel' scripts/p75-dataset-core.mjs
          grep -Fq 'colorCast' scripts/p75-dataset-core.mjs
          grep -Fqx 'const reviewFirst836=true;' <(grep '^const reviewFirst836=' public/app.js)
          echo M1_P854_EXACT_RESEARCH_5_PATH_NO_DEPLOY_PASS
      - name: Install temporary synthetic image/browser/model dependencies, no package lock edits
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Signed synthetic nested-label disagreement, P79 handoff and P851 release BLOCKED
        run: |
          set -euo pipefail
          node --check scripts/p75-dataset-core.mjs
          node --test tests/parallel75-independent-ground-truth.test.mjs tests/mission1-full-label-consensus-854.test.mjs tests/parallel79-workstation.test.mjs
          node scripts/m1-release-evidence-851.mjs | tee /tmp/p854-release
          grep -Fq '"status":"BLOCKED"' /tmp/p854-release
          grep -Fq '"shouldLiftFamilyAlphaHold":false' /tmp/p854-release
      - name: Unchanged app builds and full inherited native tests
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          P79_REQUIRE_DECODER=1 node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  actual-desktop-engine-QA-NOT-physical-phones:
    needs: pinned-parent-consensus-native-HOLD
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium webkit
      - name: Offline human annotation browser controls with generated data only
        run: node scripts/test-p79-workstation-browser.mjs
      - name: Physical-device operator recorder simulated desktop QA only
        run: node scripts/test-parallel78-device-browser.mjs
      - name: Inherited safe camera-to-owner-reviewed closet browser QA
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node scripts/test-m1-batch-review-850.mjs
          node scripts/test-parallel77-cross-capture-browser.mjs
          node scripts/test-parallel76-color-browser.mjs
          node scripts/test-m1-owner-learning-integration-847.mjs
          node scripts/test-m1-owner-pair-admission-846.mjs
          node scripts/test-m1-review-save-lifecycle-844.mjs parent
          node scripts/test-m1-review-save-lifecycle-844.mjs candidate
          node scripts/test-m1-review-first-default-843.mjs
          node scripts/test-m1-owner-review-editor-839.mjs
  public-original-integrity-NOT-independent-accuracy:
    needs: pinned-parent-consensus-native-HOLD
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      P73_PHOTO_IDS: commons-0003,commons-0014,commons-0021,commons-0033,commons-0049,commons-0060,commons-0077,commons-0082,commons-0094,validation-0001,validation-0019
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3
      - name: Download and hash legally sourced public JPEG originals; do not infer accuracy
        run: |
          set -euo pipefail
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos "$P73_PHOTO_IDS"
          node scripts/evaluate-parallel73-real-photo.mjs
