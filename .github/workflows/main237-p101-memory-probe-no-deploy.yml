name: MAIN237 P101 native WASM memory growth phase localization HOLD
on:
  push:
    branches: [research/main237-p101-native-wasm-memory-growth-HOLD]
  pull_request:
    branches: [fix/parallel101-webkit-p94-model-initialization-HOLD]
permissions:
  contents: read
jobs:
  original-source-node:
    name: Original P101 immutable source and full owner security suite
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated two-path test only and immutable P94 Worker
        shell: bash
        run: |
          set -euo pipefail
          BASE=9972c8f6d560811180c3d21981989cdc10355840
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE" HEAD)" = "$(printf '%s\n' '.github/workflows/main237-p101-memory-probe-no-deploy.yml' 'scripts/test-main237-native-p101-wasm-memory-probe.mjs')"
          test "$(git rev-parse HEAD:scripts/test-parallel101-real-p94-model-init-stage-browser.mjs)" = ad8ab0eb33322a34f8cc3f45a1fe26feff87b2ab
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          test "$(git rev-parse HEAD:scripts/test-main237-native-p101-wasm-memory-probe.mjs)" = e281589a2f482791875ba2b9b51d0f215bc1af77
          node --check scripts/test-main237-native-p101-wasm-memory-probe.mjs
          M237_SOURCE_ONLY=1 node scripts/test-main237-native-p101-wasm-memory-probe.mjs
      - name: Install original offline test dependencies
        run: npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Unmodified offline build and inherited security/owner/photo suite
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  native-original:
    name: Actual unchanged P94 SegFormer owner journey + memory telemetry (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, chromium]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: ${{ matrix.engine }}
      P101_CACHE_MODE: baseline
      P101_SESSION_MODE: baseline
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable source and exact telemetry adapter
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=9972c8f6d560811180c3d21981989cdc10355840
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE" HEAD)" = "$(printf '%s\n' '.github/workflows/main237-p101-memory-probe-no-deploy.yml' 'scripts/test-main237-native-p101-wasm-memory-probe.mjs')"
          test "$(git rev-parse HEAD:scripts/test-parallel101-real-p94-model-init-stage-browser.mjs)" = ad8ab0eb33322a34f8cc3f45a1fe26feff87b2ab
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-main237-native-p101-wasm-memory-probe.mjs)" = e281589a2f482791875ba2b9b51d0f215bc1af77
          node --check scripts/test-main237-native-p101-wasm-memory-probe.mjs
          M237_SOURCE_ONLY=1 node scripts/test-main237-native-p101-wasm-memory-probe.mjs
      - name: Install original genuine native model/owner dependencies
        run: npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Original true model owner source/private 2D/v4 at 320 and 430, ZERO retries
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          for width in 320 430; do
            M214_ATTEMPT="M237-$M58_ENGINE-$width" P94_WIDTH="$width" node scripts/test-main237-native-p101-wasm-memory-probe.mjs
          done
