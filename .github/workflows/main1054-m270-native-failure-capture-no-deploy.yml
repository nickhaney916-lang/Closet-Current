name: Mission 4 native WebKit failure capture (no deploy)
on:
  push:
    branches: [research/m270-native-failure-capture-HOLD]
permissions:
  contents: read
jobs:
  pinned-browser:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {engine: webkit, width: 320, arm: capture, attempts: 6}
          - {engine: webkit, width: 390, arm: capture, attempts: 8}
          - {engine: webkit, width: 430, arm: capture, attempts: 6}
          - {engine: webkit, width: 390, arm: original, attempts: 8}
          - {engine: chromium, width: 390, arm: capture, attempts: 2}
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: ${{ matrix.engine }}
      P94_WIDTH: ${{ matrix.width }}
      CAPTURE_ARM: ${{ matrix.arm }}
      CAPTURE_ATTEMPTS: ${{ matrix.attempts }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned diagnostics and install browser test dependencies
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          node --test tests/main1054-m270-native-failure-capture.test.mjs
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
          node research/main1054/m270-native-failure-capture.mjs
          node --check scripts/.m270-native-failure-capture.mjs
      - name: Run separate first-attempt browser processes and preserve all failures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m270-receipts
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT
          script=scripts/test-parallel94-native-p88-browser.mjs
          if [[ "$CAPTURE_ARM" == capture ]]; then
            script=scripts/.m270-native-failure-capture.mjs
          fi
          failed=0
          for ordinal in $(seq 1 "$CAPTURE_ATTEMPTS"); do
            code=0
            timeout 180s node "$script" > "$log" 2>&1 || code=$?
            if [[ "$code" != 0 ]] || ! grep -q '^P91_FULL_JOURNEY_PASS ' "$log"; then
              failed=1
            fi
            node research/main1054/m270-native-failure-capture.mjs receipt "$log" "$ordinal" "$code" | tee "m270-receipts/$ordinal.json"
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m270-${{ matrix.engine }}-${{ matrix.width }}-${{ matrix.arm }}
          path: m270-receipts/
          retention-days: 7
