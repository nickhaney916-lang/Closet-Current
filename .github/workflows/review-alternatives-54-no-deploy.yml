name: REVIEW54 uncertain real FashionCLIP crop alternatives human review NO DEPLOY
on:
  push:
    branches:
      - research/review-alternatives-54-main-20261104-HOLD
  pull_request:
    paths:
      - 'research/multi-garment-capture-01/recognition-review-42.mjs'
      - 'research/multi-garment-capture-01/review-ui.mjs'
      - 'research/multi-garment-capture-01/review-alternatives-54.mjs'
      - 'research/review-alternatives-54/**'
      - 'scripts/*review-alternatives-54*'
      - 'scripts/test-multi-garment-capture-01-browser.mjs'
      - 'tests/review-alternatives-54.test.mjs'
      - '.github/workflows/review-alternatives-54-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-baseline-safe-human-review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Strict verified MODEL52 parent and NO deploy, cloud or unrelated app changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 05107691cee5bbf7429b824aa0b1444fcb70ae5b HEAD
          git diff --name-only 05107691cee5bbf7429b824aa0b1444fcb70ae5b HEAD > /tmp/review54-changes
          while IFS= read -r path; do
            case "$path" in
              research/multi-garment-capture-01/recognition-review-42.mjs|research/multi-garment-capture-01/review-ui.mjs|research/multi-garment-capture-01/review-alternatives-54.mjs|research/review-alternatives-54/*|scripts/audit-review-alternatives-54.mjs|scripts/test-review-alternatives-54-browser.mjs|scripts/audit-review-alternatives-54-browser.mjs|scripts/audit-review54-native-52.mjs|scripts/test-multi-garment-capture-01-browser.mjs|tests/review-alternatives-54.test.mjs|.github/workflows/review-alternatives-54-no-deploy.yml) ;;
              *) echo "BLOCKED production, staging, automatic classifier, cloud or unrelated code: $path"; exit 1 ;;
            esac
          done </tmp/review54-changes
      - name: Install pinned test dependencies only
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Build unchanged production-shaped research app and run all inherited Node tests
        run: |
          node --check scripts/audit-review-alternatives-54.mjs
          node --check scripts/test-review-alternatives-54-browser.mjs
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Retrieve completed locked source-provenance real image predictions from prior independent Work34 research
        uses: actions/download-artifact@v4
        with:
          name: GARMENT-CLASSIFICATION-ACCURACY-48-exact-head-evidence
          run-id: 41957999315
          github-token: ${{ github.token }}
          path: benchmark/review-alternatives-54/source
      - name: Audit 59 source-locked genuine photo predictions without altering baseline outputs or locked labels
        run: node scripts/audit-review-alternatives-54.mjs
      - name: Verify actual pinned local FashionCLIP image features in Chromium and WebKit
        run: node scripts/probe-real-model-assets-52.mjs
      - name: Run six genuine app original-photo reviewed-crop and owner-private outfit/save/restore scenarios
        env:
          RECOGNITION42: '1'
        run: node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Verify 73 real model/private app screenshots and explicitly classify known WebKit teardown cancellations
        run: node scripts/audit-review54-native-52.mjs
      - name: Native browser human-option clicks on source-pinned original with archived actual uncertain model outputs
        run: node scripts/test-review-alternatives-54-browser.mjs
      - name: Independently validate the 12 option review screenshots and all six human confirmation cases
        run: node scripts/audit-review-alternatives-54-browser.mjs
      - name: Archive measured accuracy, human review, screenshot and genuine model network evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: REVIEW54-actual-model-human-review-59-photo-evidence-HOLD
          path: |
            benchmark/review-alternatives-54/actual-genuine-photo-audit.json
            benchmark/review-alternatives-54/native-ui/**
            benchmark/review-alternatives-54/native-model-audit.json
            benchmark/model-asset-reliability-52/probe.json
            benchmark/model-asset-reliability-52/acceptance.json
            benchmark/recognition-to-closet-42/acceptance.json
          if-no-files-found: warn
          retention-days: 21
