name: Mission 3 integrated revision-first signed-owner quota and photo integrity — NO DEPLOY
on:
  push:
    branches: [research/mission3-private-cloud-integration-20261110-HOLD]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated-private-cloud:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard exact verified Mission 3 signed-owner parent, integrated scope and zero deployments
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=2ef3202ee60a13ef0d61c6493a1da02dd2ad7224
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --exit-code "$BASE" HEAD -- public/auth.js public/app.js public/photo-import.js public/cloud-backup-engine.js supabase public/local-worker.mjs public/recognition-engine.mjs
          git diff --name-only "$BASE" HEAD | while read -r p; do
            case "$p" in
              public/cloud-backup.js|tests/mission3-device-quota-atomic-restore.test.cjs|tests/mission3-cloud-integrity-retry-pause.test.cjs|tests/mission3-revision-first-cloud.test.cjs|scripts/test-mission3-persistent-device-quota-browser.mjs|scripts/test-mission3-cloud-integrity-pause-browser.mjs|research/mission3-persistent-device-quota/REPORT.md|research/mission3-cloud-integrity-pause/REPORT.md|research/mission3-integrated-private-cloud/REPORT.md|.github/workflows/mission3-integrated-private-cloud-no-deploy.yml) ;;
              *) echo "Unexpected Mission 3 integrated private cloud path: $p"; exit 1 ;;
            esac
          done
      - name: Install pinned independent Node and genuine Chromium/WebKit engines
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Reproduce exact parent foreign owner item/draft acceptance
        run: |
          git worktree add --detach /tmp/closet-mission3-owner-document-parent f872ef1799fdfda62fd2213c42aa624ded1e60da
          CLOUD_SOURCE_ROOT=/tmp/closet-mission3-owner-document-parent EXPECT_BASELINE=1 node --test tests/mission3-signed-owner-document-guards.test.cjs
      - name: Verify foreign owner garments/drafts fail closed and legacy ownerless remain compatible
        run: node --test tests/mission3-signed-owner-document-guards.test.cjs
      - name: Verify combined durable device quota and photo-integrity quarantine behavior
        run: |
          node --test tests/mission3-device-quota-atomic-restore.test.cjs
          node --test tests/mission3-cloud-integrity-retry-pause.test.cjs
      - name: Verify retained signed-owner privacy and revision-only backup tests
        run: |
          node --test tests/mission3-signed-owner-document-guards.test.cjs
          node --test tests/mission3-revision-first-cloud.test.cjs
      - name: Build and run entire serial application Node regression
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Actual Chromium/WebKit 320 390 430 corrupted immutable JPEG pause across reload, owner manual SHA recovery
        run: node scripts/test-mission3-cloud-integrity-pause-browser.mjs benchmark/mission3-integrated-integrity-browser
      - name: Actual Chromium/WebKit 320 390 430 persistent device quota pause across reload and manual recover
        run: node scripts/test-mission3-persistent-device-quota-browser.mjs benchmark/mission3-integrated-device-quota-browser
      - name: Actual Chromium and WebKit 320 390 430 foreign-owner cloud rejection and legacy recovery
        run: node scripts/test-mission3-signed-owner-document-browser.mjs benchmark/mission3-owner-document-private-browser
      - name: Actual Chromium/WebKit 320 390 430 revision-first large wardrobe
        run: node scripts/test-mission3-revision-first-browser.mjs benchmark/mission3-owner-document-revision-browser
      - name: Actual Chromium/WebKit 320 390 430 durable remote capacity and explicit retry
        run: node scripts/test-mission3-durable-capacity-browser.mjs benchmark/mission3-owner-document-capacity-browser
      - name: Actual Chromium/WebKit 320 390 430 local quota atomic restore
        run: node scripts/test-mission3-device-quota-restore-browser.mjs benchmark/mission3-owner-document-quota-browser
      - name: Actual Chromium original and reviewed photo private cloud recovery
        run: |
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos commons-0002
          node scripts/test-outfit-backup-compatibility-browser.mjs benchmark/mission3-owner-document-photo-browser
      - name: Actual Chromium/WebKit native photo to private closet styling
        run: node scripts/test-native-canonical-original-167-browser.mjs
      - name: Actual Chromium/WebKit mobile quota and accessibility
        run: node scripts/test-family-reliability-mobile.mjs
      - name: Preserve synthetic-owner screenshot and acceptance evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission3-integrated-revision-owner-quota-integrity-evidence-HOLD
          path: |
            benchmark/mission3-integrated-integrity-browser/
            benchmark/mission3-integrated-device-quota-browser/
            benchmark/mission3-owner-document-private-browser/
            benchmark/mission3-owner-document-revision-browser/
            benchmark/mission3-owner-document-capacity-browser/
            benchmark/mission3-owner-document-quota-browser/
            benchmark/mission3-owner-document-photo-browser/
            benchmark/native-canonical-closet-style-167/
            benchmark/family-reliability-mobile/
          retention-days: 14
