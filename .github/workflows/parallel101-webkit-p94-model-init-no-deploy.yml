name: P101 v3.8.1 WebKit P94 model-cache A-B NO DEPLOY HOLD
on:
  push:
    branches: [fix/parallel101-webkit-p94-model-initialization-HOLD]
  pull_request:
    branches: [research/main225-m224-full-original-seven-job-acceptance-HOLD]
permissions:
  contents: read
jobs:
  source-and-node:
    name: P101 exact M224 source and inherited safety suite
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify ONE workflow-only diff and all native original source SHA guards
        shell: bash
        run: |
          set -euo pipefail
          BASE=9b243ee584d6f16f553e2365e373e6e8be85cc36
          git merge-base --is-ancestor "$BASE" HEAD
          changed="$(git diff --name-only "$BASE" HEAD)"
          test "$changed" = "$(printf '%s\n' '.github/workflows/parallel101-webkit-p94-model-init-no-deploy.yml' 'scripts/test-parallel101-real-p94-model-init-stage-browser.mjs')"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-main214-p94-worker-outcome.mjs)" = 8cc2977f1932b3012c44bdd401081cc542b94c57
          test "$(git rev-parse HEAD:scripts/test-parallel101-real-p94-model-init-stage-browser.mjs)" = 188aa32d5f34a217b7572e0fd99fa89d37a6b2c7
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          test "$(git rev-parse HEAD:research/multi-garment-capture-01/review-ui.mjs)" = 1bd97b80b51fab1cb269ae565acb73a274b6e6d0
          test "$(git rev-parse HEAD:public/native-default-atomic-import-m3.mjs)" = 1a4cf649a3656f604c4f3e1d2b1efd7910179edc
          test "$(git rev-parse HEAD:public/native-default-verified-backup-export-m3.mjs)" = af15a9c08a81aa4064d1e5d1c4f0af0d855582c9
          node --check scripts/test-main214-p94-worker-outcome.mjs
          node --check scripts/test-parallel101-real-p94-model-init-stage-browser.mjs
          node --check public/outfit-worker-p94.mjs
      - name: Install pinned original app dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Offline build and all unchanged Node owner privacy and source guards
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  genuine-webkit-430:
    name: P101 fresh WebKit 320/390/430 model outcomes shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: webkit
      P94_WIDTH: '430'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin actual original Worker, tests and strict full-owner acceptance
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 9b243ee584d6f16f553e2365e373e6e8be85cc36 HEAD
          changed="$(git diff --name-only 9b243ee584d6f16f553e2365e373e6e8be85cc36 HEAD)"
          test "$changed" = "$(printf '%s\n' '.github/workflows/parallel101-webkit-p94-model-init-no-deploy.yml' 'scripts/test-parallel101-real-p94-model-init-stage-browser.mjs')"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-main214-p94-worker-outcome.mjs)" = 8cc2977f1932b3012c44bdd401081cc542b94c57
          test "$(git rev-parse HEAD:scripts/test-parallel101-real-p94-model-init-stage-browser.mjs)" = 188aa32d5f34a217b7572e0fd99fa89d37a6b2c7
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          test "$(git rev-parse HEAD:research/multi-garment-capture-01/review-ui.mjs)" = 1bd97b80b51fab1cb269ae565acb73a274b6e6d0
      - name: Install pinned real WebKit and original SegFormer runtime
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Three fresh independent genuine model and owner journeys; preserve every RED
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -uo pipefail
          failed=0
          # Two supported v3.8.1 model-cache conditions, two fresh shards each.
          # The newer WASM-cache knob is absent from pinned v3.8.1: do not test it.
          case "$SHARD" in
            1|3) cacheMode=baseline ;;
            2|4) cacheMode=browser_off ;;
          esac
          for attempt in 1 2 3; do
            echo "::group::P101 REAL WebKit model-initialization source shard $SHARD attempt $attempt"
            case "$attempt" in
              1) width=320 ;;
              2) width=390 ;;
              3) width=430 ;;
            esac
            if P101_CACHE_MODE="$cacheMode" P94_WIDTH="$width" M214_ATTEMPT="P101-WEBKIT-${width}-${cacheMode}-S${SHARD}-A${attempt}" node scripts/test-parallel101-real-p94-model-init-stage-browser.mjs; then
              echo "P101_REAL_WEBKIT_430_ATTEMPT_PASS shard=$SHARD attempt=$attempt"
            else
              code=$?
              echo "::error::P101_REAL_WEBKIT_430_ATTEMPT_FAIL shard=$SHARD attempt=$attempt exit=$code; preserve prior RED and stage evidence"
              failed=$((failed+1))
            fi
            echo "::endgroup::"
          done
          echo "P101_REAL_WEBKIT_430_SHARD_RECEIPT shard=$SHARD attempts=3 failures=$failed"
          test "$failed" -eq 0
  genuine-chromium-control:
    name: P101 genuine Chromium 320/390/430 staged-model control
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: chromium
      P94_WIDTH: '430'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict exact source original diagnostic and Worker
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 9b243ee584d6f16f553e2365e373e6e8be85cc36 HEAD
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-main214-p94-worker-outcome.mjs)" = 8cc2977f1932b3012c44bdd401081cc542b94c57
          test "$(git rev-parse HEAD:scripts/test-parallel101-real-p94-model-init-stage-browser.mjs)" = 188aa32d5f34a217b7572e0fd99fa89d37a6b2c7
      - name: Install real pinned Chromium and SegFormer runtime
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Two independent genuine chromium control journeys, no retries
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "::group::P101 real Chromium 430 control attempt $attempt"
            case "$attempt" in
              1) width=320; cacheMode=baseline ;;
              2) width=390; cacheMode=baseline ;;
              3) width=430; cacheMode=baseline ;;
              4) width=320; cacheMode=browser_off ;;
              5) width=390; cacheMode=browser_off ;;
              6) width=430; cacheMode=browser_off ;;
              7) width=430; cacheMode=baseline ;;
              8) width=430; cacheMode=browser_off ;;
            esac
            if P101_CACHE_MODE="$cacheMode" P94_WIDTH="$width" M214_ATTEMPT="P101-CHROMIUM-${width}-${cacheMode}-A${attempt}" node scripts/test-parallel101-real-p94-model-init-stage-browser.mjs; then
              echo "P101_REAL_CHROMIUM_430_ATTEMPT_PASS attempt=$attempt"
            else
              code=$?
              echo "::error::P101_REAL_CHROMIUM_430_ATTEMPT_FAIL attempt=$attempt exit=$code"
              failed=$((failed+1))
            fi
            echo "::endgroup::"
          done
          echo "P101_REAL_CHROMIUM_430_CONTROL_RECEIPT attempts=8 failures=$failed"
          test "$failed" -eq 0
