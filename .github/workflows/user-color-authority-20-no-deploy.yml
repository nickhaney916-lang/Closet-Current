name: USER-COLOR-AUTHORITY-20 real manual color survives model replay Chromium WebKit NO DEPLOY
on:
  pull_request:
    paths:
      - 'public/clothing-details.js'
      - 'tests/user-color-authority-20.test.cjs'
      - 'scripts/test-color-confidence-19-real-photo.mjs'
      - 'scripts/audit-user-color-authority-20.mjs'
      - 'research/user-color-authority-20/**'
      - '.github/workflows/user-color-authority-20-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-locked-manual-color-replay-privacy-no-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Parent PR576 exact commit ancestry and exclusive color authority changes only
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 55c1d3027be4761963578c014c9220eedac43ce3 HEAD
          git diff --name-only 55c1d3027be4761963578c014c9220eedac43ce3 HEAD | while IFS= read -r p; do
            case "$p" in
              public/clothing-details.js|tests/user-color-authority-20.test.cjs|scripts/test-color-confidence-19-real-photo.mjs|scripts/audit-user-color-authority-20.mjs|research/user-color-authority-20/*|.github/workflows/user-color-authority-20-no-deploy.yml) ;;
              *) echo "BLOCKED unexpected source / auth / index / 3D / deployment change: $p"; exit 1 ;;
            esac
          done
      - name: Install fixed browser testing dependencies without modifying package files
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Full inherited app build and regression tests including explicit user-color overwrite safeguards
        run: |
          node --check scripts/test-color-confidence-19-real-photo.mjs
          node --check scripts/audit-user-color-authority-20.mjs
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Real unchanged licensed originals and actual browser user input in Chromium and WebKit
        run: |
          node scripts/test-color-confidence-19-real-photo.mjs
          node scripts/audit-color-confidence-19.mjs
          node scripts/audit-user-color-authority-20.mjs
      - name: Retain sanitized source hashes and genuine mobile visual acceptance evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: USER-COLOR-AUTHORITY-20-real-browser-source-preservation-HOLD
          path: |
            benchmark/color-confidence-19/*.json
            benchmark/color-confidence-19/*.png
          if-no-files-found: warn
          retention-days: 21
