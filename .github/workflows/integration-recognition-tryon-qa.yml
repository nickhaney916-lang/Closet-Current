name: Integration recognition + prepaid try-on research QA
on:
  push:
    branches: [integration/original-photo-recognition-plus-tryon-20261019]
    paths:
      - 'public/**'
      - 'tests/**'
      - 'scripts/**'
      - 'supabase/functions/ai-try-on/**'
      - '.github/workflows/integration-recognition-tryon-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-merged-source-and-phone-emulation:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify full combined source without any provider activation
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Verify source safety and dual-pass server code in Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check Deno Edge and run local loopback entrypoint tests
        run: |
          deno check supabase/functions/ai-try-on/index.ts
          deno test --allow-net=127.0.0.1 --allow-env tests/deno/ai-tryon-runtime.test.mjs
      - name: Install isolated Chromium/WebKit engines for browser-only emulation
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium webkit
      - name: Original scene, cropped RGB and duplicate integrity in mobile emulation
        run: |
          node scripts/test-original-crop-source-mobile.mjs
          node scripts/test-original-source-duplicate-mobile.mjs
      - name: Built-app two-garment, source, owner and signed token integrity
        env:
          TRYON_QA_OUTPUT: test-results/integration-tryon
        run: |
          mkdir -p test-results/integration-tryon
          node scripts/test-multigarment-device-emulation.mjs
      - name: Style this owned-closet photos in both phone browser engines
        run: |
          node scripts/test-style-my-new-item-mobile.mjs
          STYLE_BROWSER=webkit node scripts/test-style-my-new-item-mobile.mjs
      - name: Reject absent phone and live provider evidence even with passing emulation
        run: |
          node scripts/audit-tryon-acceptance-evidence.mjs --branch-sha "$GITHUB_SHA" > test-results/integration-tryon/evidence.json
          node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('test-results/integration-tryon/evidence.json'));if(r.status!=='blocked'||r.actualGarmentAccuracy!==null||r.providerActivationAllowed||r.productionReleaseApproved)throw Error('Release evidence must remain blocked')"
      - name: Upload synthetic run evidence (not physical phone proof)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-original-source-and-tryon-browser-emulation
          path: test-results/integration-tryon
          if-no-files-found: ignore
          retention-days: 14
