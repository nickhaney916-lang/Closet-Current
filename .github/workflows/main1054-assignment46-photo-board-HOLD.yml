name: Assignment 46 original-photo outfit board HOLD

on:
  pull_request:
    branches: [research/assignment45-wear-history-portability-HOLD]

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'assignment-46-original-photo-board' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: [chromium, webkit, regression]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Verify isolated scope and reproducible offline build
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BASELINE: bd1df1b2a5dfaf4563e0b945a1601161e3abd341
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          git merge-base --is-ancestor "$BASELINE" HEAD
          test -z "$(git rev-list --merges "$BASELINE"..HEAD)"
          while IFS= read -r path; do
            case "$path" in
              public/style.css|public/app-theme.css|public/outfit-board.js|scripts/assignment46-board-visual-browser.mjs|.github/workflows/main1054-assignment46-photo-board-HOLD.yml) ;;
              *) echo "Out of scope: $path"; exit 1 ;;
            esac
          done < <(git diff --name-only "$BASELINE" HEAD)
          git diff --check "$BASELINE" HEAD
          node scripts/build.mjs
          cp -a dist "$RUNNER_TEMP/assignment46-first-build"
          node scripts/build.mjs
          diff -qr "$RUNNER_TEMP/assignment46-first-build" dist
      - name: Compare mobile screenshots and verify photo sources
        if: matrix.lane != 'regression'
        shell: bash
        env:
          ENGINE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/assignment46-baseline"
          mkdir -p "$baseline"
          git archive bd1df1b2a5dfaf4563e0b945a1601161e3abd341 public scripts/build.mjs | tar -x -C "$baseline"
          (cd "$baseline" && node scripts/build.mjs)
          node scripts/assignment46-board-visual-browser.mjs "$ENGINE" "$baseline/dist" baseline
          node scripts/assignment46-board-visual-browser.mjs "$ENGINE" dist candidate
      - uses: actions/upload-artifact@v4
        if: always() && matrix.lane != 'regression'
        with:
          name: assignment46-visuals-${{ matrix.lane }}
          path: assignment46-visuals/
      - name: Full regression
        if: matrix.lane == 'regression'
        run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
