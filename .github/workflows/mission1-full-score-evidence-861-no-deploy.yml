name: Mission 1 P861 full-score witness integration — NO DEPLOY
on:
  push:
    branches: [research/mission1-full-score-evidence-861-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m1-p861-full-scores-HOLD
  cancel-in-progress: true
jobs:
  native-integrity-NO-DEPLOY:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin exact P860 parent, nine-path research-only delta and untouched owner/model/cloud
        shell: bash
        run: |
          set -euo pipefail
          BASE=7dec4dd6a728947c4b5e83578595086277db402f
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE" HEAD > /tmp/p861-scoped
          cat /tmp/p861-scoped
          test "$(wc -l </tmp/p861-scoped)" -eq 9
          while IFS= read -r p; do
            case "$p" in
              scripts/p80-operator-category-lock.mjs|scripts/p80-full-score-transcript.mjs|scripts/p80-private-blind-evaluator.mjs|tests/parallel80-full-score-transcript.test.mjs|tests/parallel80-private-blind-evaluator.test.mjs|research/parallel80-private-blind-evaluator/REPORT.md|tests/mission1-full-score-integration-861.test.mjs|research/mission1-full-score-evidence-861/REPORT.md|.github/workflows/mission1-full-score-evidence-861-no-deploy.yml) ;;
              *) echo "P861 UNSCOPED FILE $p"; exit 1;;
            esac
          done </tmp/p861-scoped
          test -z "$(git diff --name-only "$BASE" HEAD -- public benchmark supabase scripts/p75-dataset-core.mjs scripts/p79-workstation-core.mjs scripts/m1-release-evidence-851.mjs)"
          grep -Fq 'FAMILY ALPHA HOLD #255 OPEN' research/parallel80-private-blind-evaluator/REPORT.md
          grep -Fq 'Family Alpha HOLD #255 OPEN' research/mission1-full-score-evidence-861/REPORT.md
          grep -Fq 'validateFullScoreProofs80' scripts/p80-private-blind-evaluator.mjs
          grep -Fq 'blindTemporalOrder80' scripts/p80-private-blind-evaluator.mjs
          grep -Fq 'p.alternatives.length === 0' scripts/p80-private-blind-evaluator.mjs || grep -Fq 'p.alternatives.length===0' scripts/p80-private-blind-evaluator.mjs
          echo P861_PINNED_SAFE_SOURCE_SCOPE_PASS
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Exact-source private score proof, synthetics only, and inherited full regressions
        run: |
          set -euo pipefail
          node --check scripts/p80-private-blind-evaluator.mjs
          node --check scripts/p80-full-score-transcript.mjs
          node --test tests/parallel80-private-blind-evaluator.test.mjs tests/parallel80-full-score-transcript.test.mjs tests/mission1-full-score-integration-861.test.mjs tests/mission1-private-human-evaluation-860.test.mjs
          node scripts/p80-private-blind-evaluator.mjs | tee /tmp/p861-blind
          grep -Fq '"status":"BLOCKED"' /tmp/p861-blind
          grep -Fq '"independentlyVerifiedSubtypeAccuracy":null' /tmp/p861-blind
          node scripts/m1-release-evidence-851.mjs | tee /tmp/p861-release
          grep -Fq '"shouldLiftFamilyAlphaHold":false' /tmp/p861-release
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          P79_REQUIRE_DECODER=1 node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  desktop-owner-safety-NOT-physical-phones:
    needs: native-integrity-NO-DEPLOY
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium webkit
      - name: Real app desktop policy and source/photo integrity, not a phone or independent photo accuracy
        run: |
          set -euo pipefail
          node scripts/test-parallel80-subtype-browser.mjs
          node scripts/test-p79-workstation-browser.mjs
          node scripts/test-parallel78-device-browser.mjs
