name: FABRIC-MOTION-01 Real Original Dress Skirt Spring · NO DEPLOY HOLD
on:
  pull_request:
    paths:
      - 'research/fabric-motion-01/**'
      - 'research/dress-mobile-01/dress-outfit-controller.mjs'
      - 'research/dress-mobile-01/dress-mobile-showroom.mjs'
      - 'research/integration-04-wardrobe-dress/wardrobe-demo.mjs'
      - 'research/integration-04-wardrobe-dress/index.html'
      - 'tests/fabric-motion-01.test.mjs'
      - 'scripts/test-fabric-motion-01-browser.mjs'
      - '.github/workflows/fabric-motion-01-no-deploy.yml'
permissions:
  contents: read
jobs:
  genuine-source-163-bone-skirt-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Enforce exact source-wardrobe verified ancestor and zero production changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 57e915d752f1ecfcff904b3cddfaf68d14779d2e HEAD
          git diff --name-only 57e915d752f1ecfcff904b3cddfaf68d14779d2e HEAD | while IFS= read -r path; do
            case "$path" in
              research/fabric-motion-01/*|research/dress-mobile-01/dress-outfit-controller.mjs|research/dress-mobile-01/dress-mobile-showroom.mjs|research/integration-04-wardrobe-dress/wardrobe-demo.mjs|research/integration-04-wardrobe-dress/index.html|tests/fabric-motion-01.test.mjs|scripts/test-fabric-motion-01-browser.mjs|.github/workflows/fabric-motion-01-no-deploy.yml) ;;
              *) echo "UNAUTHORIZED production / sibling change: $path"; exit 1 ;;
            esac
          done
      - name: Pin original-source offline WebGL test runtime
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 three@0.180.0 playwright@1.56.1 three-mesh-bvh@0.9.2
      - name: Source syntax, spring safety, exact-owner source and garment regression
        run: |
          node --check research/fabric-motion-01/bounded-skirt-motion.mjs
          node --check research/dress-mobile-01/dress-outfit-controller.mjs
          node --check research/dress-mobile-01/dress-mobile-showroom.mjs
          node --check research/integration-04-wardrobe-dress/wardrobe-demo.mjs
          node --check scripts/test-fabric-motion-01-browser.mjs
          node --test tests/fabric-motion-01.test.mjs tests/integration-04-wardrobe-dress.test.mjs tests/dress-mobile-01.test.mjs tests/three-d-78-original-anatomical-knee-poses.test.mjs tests/three-d-77-true-skinned-denim-contact.test.mjs
      - name: Generate original licensed JPEGs and authentic source segmentation
        run: |
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node scripts/build-work47-benchmark.mjs
          node --test tests/three-d-31-jeans-source.test.mjs tests/three-d-37-source-true.test.mjs
      - name: Restore exact approved real 163-bone female and male anatomical figures
        run: |
          git fetch --no-tags origin 53f2ad344dc56a1477e343531c423aed0e66c17d dd6bac3fa9ff640d4f562cf925337440bdb5cf8f 3a572193987cb29389727426136c6eb3ac326783 dfb40889c4c1221fb1833b859e8a11ef38aeb76e
          node research/three-d-20/restore-approved-models.mjs
      - name: Real Chrome WebGL dress motion, mobile widths, two rigs, identity/repair
        run: node scripts/test-fabric-motion-01-browser.mjs
      - name: Verify 24 real non-replaced screenshot artifacts and strict HOLD
        run: |
          node --input-type=module <<'CHECK'
          import {readFileSync,readdirSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const dir='benchmark/fabric-motion-01',r=JSON.parse(readFileSync(dir+'/results.json'));
          assert.equal(r.screenshots,24);
          assert.equal(readdirSync(dir).filter(s=>s.endsWith('.png')).length,24);
          assert.deepEqual(r.widths,[320,390,430]);
          assert.deepEqual(r.original163BoneFigures,['female','male']);
          assert.equal(r.scenarios.length,6);
          assert.ok(r.scenarios.every(s=>s.changedPixelsLeft>=6&&s.resetMismatchPixels<=2));
          assert.equal(r.defaultOff,true);assert.equal(r.reversibleMovement,true);
          assert.equal(r.trueClothPhysicsCertified,false);assert.equal(r.sweptCollisionCertified,false);
          assert.equal(r.physicalAndroidVerified,false);assert.equal(r.physicalIphoneVerified,false);
          assert.equal(r.releaseAuthorized,false);assert.equal(r.productionModified,false);
          assert.equal(r.familyAlpha,'HOLD');
          CHECK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FABRIC-MOTION-01-REAL-163-BONE-DRESS-24-HOLD
          path: benchmark/fabric-motion-01/
          if-no-files-found: warn
