name: P145 local owner-reviewed cloud sync safety fence NO DEPLOY
on:
  push:
    branches: [research/legacy-cloud-owner-review-fence-145-main-20261107-HOLD]
  pull_request:
    branches: [research/app-plus-cross-browser-recovery-143-main-20261107-HOLD]
    paths:
      - 'public/cloud-backup.js'
      - 'tests/legacy-cloud-owner-review-fence-145.test.cjs'
      - 'scripts/test-legacy-cloud-owner-review-145-browser.mjs'
      - 'research/legacy-cloud-owner-review-fence-145/**'
      - '.github/workflows/legacy-cloud-owner-review-fence-145-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-source-and-node:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact P143 parent, P145-only scope, no deployment or backend edits
        run: |
          BASE=663d42d721881dc3b5716259c49ea89ec5681d54
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          FIRST="$(git rev-list --reverse "$BASE..HEAD" | head -n1)"
          test "$(git rev-parse "$FIRST^")" = "$BASE"
          git diff --name-only "$BASE" HEAD >/tmp/p145-paths
          while IFS= read -r path; do
            case "$path" in
              public/cloud-backup.js|tests/legacy-cloud-owner-review-fence-145.test.cjs|scripts/test-legacy-cloud-owner-review-145-browser.mjs|research/legacy-cloud-owner-review-fence-145/REPORT.md|.github/workflows/legacy-cloud-owner-review-fence-145-no-deploy.yml) ;;
              *) echo "REFUSE unexpected source path: $path"; exit 1 ;;
            esac
          done </tmp/p145-paths
          test "$(wc -l </tmp/p145-paths)" -eq 5
          git diff --exit-code "$BASE" HEAD -- public/auth.js public/index.html public/cloud-backup-bridge.js public/app.js public/outfit-board.js supabase research/cross-browser-cloud-recovery-142 research/cloud-restore-owner-safety-137 research/local-remote-consent-fence-134
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependencies, no lockfile edits
        run: npm install --no-save --no-package-lock --no-audit --no-fund fake-indexeddb@6.2.4 playwright@1.56.1 sharp@0.34.3 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Cloud guard syntax and focused consent-bypass tests
        run: |
          node --check public/cloud-backup.js
          node --check tests/legacy-cloud-owner-review-fence-145.test.cjs
          node --check scripts/test-legacy-cloud-owner-review-145-browser.mjs
          node --test tests/legacy-cloud-owner-review-fence-145.test.cjs
      - name: Rebuild the app without deployment
        run: node scripts/build.mjs
      - name: Full inherited Node regressions at exact head
        run: node --test tests/*.test.cjs tests/*.test.mjs
  chromium-webkit-local-research-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin browser engine package, no lockfile edits
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - name: Real Chromium and WebKit research-only guard at 320/390/430
        run: node scripts/test-legacy-cloud-owner-review-145-browser.mjs
        env:
          ARTIFACT_DIR: benchmark/legacy-cloud-owner-review-145
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p145-local-cloud-owner-review-mobile
          path: benchmark/legacy-cloud-owner-review-145/
          if-no-files-found: warn
