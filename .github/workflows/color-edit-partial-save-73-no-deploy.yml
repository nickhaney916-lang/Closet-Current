name: COLOR73 individual color edit preserves other confirmed private Save NO DEPLOY
on:
  push:
    branches:
      - research/color-edit-partial-save-73-main-20261105-HOLD
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reviewed-one-color-edit-must-not-block-other-clothing-save:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce exact SOURCE72 verified parent and limited no-production/staging changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 2e1ef84ec21360c8ca6e0b587af17071c92437d1 HEAD
          git diff --name-only 2e1ef84ec21360c8ca6e0b587af17071c92437d1 HEAD >/tmp/color73-files
          while IFS= read -r path; do
            case "$path" in
              research/multi-garment-capture-01/review-ui.mjs|scripts/test-multi-garment-capture-01-browser.mjs|scripts/audit-color-edit-partial-save-73-browser.mjs|tests/color-edit-partial-save-73.test.mjs|.github/workflows/color-edit-partial-save-73-no-deploy.yml) ;;
              *) echo "BLOCKED production, staging, or unrelated modification: $path"; exit 1 ;;
            esac
          done </tmp/color73-files
      - name: Install only pinned browser and Node testing dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Full app build and all inherited plus new color edit Node tests
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Six inherited complete genuine licensed-JPEG private mobile browser workflows
        run: node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Six native mobile color-edited 2-of-3 private partial save and later confirmation workflows
        run: COLOR73=1 node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Independent 72 screenshots and six owner-private end-to-end partial Save audit
        run: node scripts/audit-color-edit-partial-save-73-browser.mjs
      - name: Archive sanitized original photo source hash and true browser screenshots only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLOR73-save-two-confirmed-keep-third-unreviewed-HOLD
          path: |
            benchmark/color-edit-partial-save-73/acceptance.json
            benchmark/color-edit-partial-save-73/*.png
          if-no-files-found: warn
          retention-days: 14
