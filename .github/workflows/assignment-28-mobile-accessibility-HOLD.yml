name: Assignment 28 mobile accessibility HOLD
on:
  pull_request:
    branches: [research/main1054-unified-backup-revision-HOLD]
permissions:
  contents: read
jobs:
  node-regression:
    if: github.head_ref == 'work/1717-mobile-accessibility' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build.mjs
      - run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
  mobile-browser:
    if: github.head_ref == 'work/1717-mobile-accessibility' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: node scripts/build.mjs
      - run: node scripts/assignment-28-mobile-accessibility.mjs
        env:
          A28_ENGINE: ${{ matrix.engine }}
          APP_SOURCE_ROOT: dist
      - run: node scripts/test-assignment-15-browser.mjs
        env:
          A15_ENGINE: ${{ matrix.engine }}
