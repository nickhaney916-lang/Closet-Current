name: MAIN234 CPU WASM streaming HTTP MIME root isolation HOLD NO DEPLOY
on:
  push:
    branches: [research/main234-webkit-wasm-mime-preflight-HOLD]
  pull_request:
    branches: [fix/parallel102-webkit-ort-runtime-compat-HOLD]
permissions:
  contents: read
jobs:
  original-source-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable original and exact two test-only files
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=3bb85a46671553cdd48e3c92595878ff3e7164f5
          git merge-base --is-ancestor "$BASE" HEAD
          changed="$(git diff --name-only "$BASE" HEAD)"
          test "$changed" = "$(printf '%s\n' '.github/workflows/main234-cpu-wasm-mime-no-deploy.yml' 'scripts/test-main234-native-wasm-mime-preflight.mjs')"
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-main234-native-wasm-mime-preflight.mjs)" = d4ab5bfdd84eb91fbf8ef12e079848a38cc66260
          node --check scripts/test-main234-native-wasm-mime-preflight.mjs
      - name: Install pinned exact CPU ORT and original security suite
        run: npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3 onnxruntime-web@1.22.0-dev.20250409-89f8206ba4
      - name: Full inherited owner/privacy/security Node suite and offline app build
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  native-mime-proof:
    name: Real browser ORT CPU .wasm streaming MIME proof (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, chromium]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable source and test-only fixture integrity
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=3bb85a46671553cdd48e3c92595878ff3e7164f5
          git merge-base --is-ancestor "$BASE" HEAD
          changed="$(git diff --name-only "$BASE" HEAD)"
          test "$changed" = "$(printf '%s\n' '.github/workflows/main234-cpu-wasm-mime-no-deploy.yml' 'scripts/test-main234-native-wasm-mime-preflight.mjs')"
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-main234-native-wasm-mime-preflight.mjs)" = d4ab5bfdd84eb91fbf8ef12e079848a38cc66260
          node --check scripts/test-main234-native-wasm-mime-preflight.mjs
      - name: Install exact same-build ORT non-JSEP binary and native browser
        run: npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3 onnxruntime-web@1.22.0-dev.20250409-89f8206ba4
      - name: Genuine installed browser Streaming MIME good versus octet negative
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-main234-native-wasm-mime-preflight.mjs
