name: Owner checked cloud backup RPC only - disposable PG, no host writes
on:
  push:
    branches: [security/backup-rpc-only-writes-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-rpc-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: closet_rpc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d closet_rpc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce RLS and deny direct owner writes on disposable PostgreSQL only
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: closet_rpc_test
        run: |
          command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
          psql -X -v ON_ERROR_STOP=1 -f tests/backup-rpc-only-writes-postgres.sql
      - name: Build and run all app/account/backup regressions
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Verify latest Work and pilot source history was not altered
        run: |
          node scripts/verify-camera-cloud-integration.mjs
          node scripts/check-dual-parent-review-integration.mjs
          node scripts/check-customer-pilot-release-gates.mjs
      - name: Assert this CI has no hosted Supabase migration path
        run: |
          test -f supabase/design/backup-rpc-only-writes.DRAFT.sql
          test ! -f supabase/migrations/20261020_backup_rpc_only_writes.sql
          grep -q "SECURITY INVOKER" supabase/design/backup-rpc-only-writes.DRAFT.sql
