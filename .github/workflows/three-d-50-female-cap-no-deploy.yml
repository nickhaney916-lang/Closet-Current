name: 3D-50 female detached source-photo cap regression (DRAFT HOLD NO DEPLOY)
on:
  pull_request:
    paths:
      - 'research/three-d-47/upper-arm-fabric-volume.mjs'
      - 'research/three-d-50/**'
      - '.github/workflows/three-d-50-female-cap-no-deploy.yml'
permissions:
  contents: read
jobs:
  original-female-cap-source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Exact approved research parent, no default-app or production changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 4229bf7933af359740ca751e9f9c6766187e0e6c HEAD
          git diff --name-only 4229bf7933af359740ca751e9f9c6766187e0e6c HEAD | while IFS= read -r f; do
            case "$f" in
              research/three-d-47/upper-arm-fabric-volume.mjs|research/three-d-50/*|.github/workflows/three-d-47-upper-arm-no-deploy.yml|.github/workflows/three-d-50-female-cap-no-deploy.yml) ;;
              *) echo "BLOCKED out-of-scope edit: $f"; exit 1 ;;
            esac
          done
      - name: Install source-preserving free local 3D development tools
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 three@0.180.0 playwright@1.56.1 three-mesh-bvh@0.9.2
      - name: Produce unchanged verified original public jean sources
        run: |
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node --test tests/three-d-31-jeans-source.test.mjs tests/three-d-37-source-true.test.mjs
      - name: Restore fixed-hash original 163-bone female and male anatomy and genuine source shirt
        run: |
          git fetch --no-tags origin 53f2ad344dc56a1477e343531c423aed0e66c17d dd6bac3fa9ff640d4f562cf925337440bdb5cf8f 3a572193987cb29389727426136c6eb3ac326783 dfb40889c4c1221fb1833b859e8a11ef38aeb76e
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
      - name: Four real female and male independent cap tailoring cases without weakening coverage
        run: node --test tests/three-d-47-upper-arm-volume.test.mjs
      - name: Independently verify true left and right cap-to-torso seam witnesses
        run: node --test tests/three-d-48-cap-seam-witness.test.mjs
      - name: Sample actual original photographed garment and body contact in each source pose
        run: |
          node scripts/audit-three-d-47-upper-arm-volume.mjs
          node --input-type=module <<'AUDIT'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const a=JSON.parse(readFileSync('benchmark/three-d-47/intermediate-triangle-audit.json','utf8'));
          assert.equal(a.records.length,28,'Do not omit any original real female case');
          for(const r of a.records)for(const k of ['shirtBody','pantsBody','shirtJeans'])
            assert.equal(r[k].crossingTrianglePairs,0,r.kind+'/'+r.source+'/'+r.pose+' '+k);
          assert.equal(a.signedVolumeContainmentCertified,false);
          assert.equal(a.releaseAuthorized,false);
          AUDIT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: THREE-D-50-FEMALE-ORIGINAL-CAP-SOURCE-TRIANGLES-HOLD
          path: benchmark/three-d-47/intermediate-triangle-audit.json
          if-no-files-found: warn
