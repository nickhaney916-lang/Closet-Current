name: Mission 1 P871 decode/unknown worker protocol — NO DEPLOY
on:
  push:
    branches: [research/mission1-dual-message-protocol-871-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m1-p871-worker-protocol-HOLD
  cancel-in-progress: true
jobs:
  worker-protocol-and-owner-review-NO-DEPLOY:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: P870 pinned immutable parent and four-path allowlist
        shell: bash
        run: |
          set -euo pipefail
          BASE=5e181dcbd090ea79aa998bbb2aa2dbbe48047883
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | tee /tmp/p871-changed
          test "$(wc -l </tmp/p871-changed)" -eq 4
          while IFS= read -r p; do
            case "$p" in
              public/dual-core-82.mjs|tests/mission1-dual-message-protocol-871.test.mjs|research/mission1-dual-message-protocol-871/REPORT.md|.github/workflows/mission1-dual-message-protocol-871-no-deploy.yml) ;;
              *) echo "UNAUTHORIZED_PATH $p"; exit 1;;
            esac
          done </tmp/p871-changed
          test -z "$(git diff --name-only "$BASE" HEAD -- public/app.js public/dual-worker-82.mjs public/dual-panel-82.mjs public/local-worker.mjs public/recognition-engine.mjs public/model-arbitration-81.mjs public/cloud-backup.js supabase)"
          grep -Fq 'const reviewFirst836=true;' public/app.js
          grep -Fq 'Family Alpha HOLD #255 OPEN' research/mission1-dual-message-protocol-871/REPORT.md
          echo P871_EXACT_SCOPE_NO_DEPLOY_PASS
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium webkit
      - name: Worker decode/protocol focused regressions
        run: |
          set -euo pipefail
          node --check public/dual-core-82.mjs
          node --test tests/mission1-dual-message-protocol-871.test.mjs tests/mission1-dual-worker-transport-867.test.mjs tests/mission1-dual-terminal-events-868.test.mjs
      - name: Both builds full native suite and BLOCKED release gate
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          P79_REQUIRE_DECODER=1 node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
          node scripts/m1-release-evidence-851.mjs | tee /tmp/p871-release
          grep -Fq '"status":"BLOCKED"' /tmp/p871-release
          grep -Fq '"shouldLiftFamilyAlphaHold":false' /tmp/p871-release
      - name: Native original JPEG and full opt-in browser policy regressions
        run: |
          set -euo pipefail
          node scripts/test-m1-original-photo-browser-865.mjs
          node scripts/test-p82-review-browser.mjs | tee /tmp/p871-browser
          grep -Fq 'P870_REAL_EDITOR_PROGRAMMATIC_FILL_REVOKES_CONSENT' /tmp/p871-browser
          node scripts/test-parallel80-subtype-browser.mjs
          node scripts/test-m1-owner-pair-admission-846.mjs
