name: MAIN181 zero-proposal native fail-closed recovery NO DEPLOY HOLD
on:
  push:
    branches: [research/main1054-m181-zero-proposal-native-fallback-HOLD]
  pull_request:
    branches: [research/main1054-m58-real-p88-browser-worker-HOLD]
permissions:
  contents: read
jobs:
  inherited-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: M181 exact-parent diff allowlist and source pins
        shell: bash
        run: |
          set -euo pipefail
          BASE=38322b2c48e27f7b0d636395306a68777115487b
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | while IFS= read -r path; do
            case "$path" in
              public/outfit-capture.js|tests/outfit-capture.test.cjs|scripts/test-main181-zero-proposal-native-browser.mjs|.github/workflows/main181-zero-proposal-native-no-deploy.yml|research/master-consolidation-1054/M181-ZERO-PROPOSAL-NATIVE-FAILCLOSED-HOLD.md) ;;
              *) echo "M181 blocked unreviewed change: $path"; exit 1 ;;
            esac
          done
          test "$(git rev-parse HEAD:public/outfit-capture.js)" = b85242b7856c3b83ed4c38afcb4b409f7292933e
          test "$(git rev-parse HEAD:tests/outfit-capture.test.cjs)" = ab60c5d45b60f5f8daf994898bcd2146f1a97f45
          test "$(git rev-parse HEAD:scripts/test-main181-zero-proposal-native-browser.mjs)" = ea1a5bdb7f0617c71695f9b0382afd6ff7d5f089
          test "$(git rev-parse HEAD:research/master-consolidation-1054/M181-ZERO-PROPOSAL-NATIVE-FAILCLOSED-HOLD.md)" = b408db8aeb16750b87a18f940d40d7bf4d05497b
          git diff --exit-code "$BASE" HEAD -- public/app.js public/outfit-worker.mjs public/outfit-worker-p94.mjs public/outfit-board.js public/auth.js public/native-default-atomic-import-m3.mjs public/native-default-verified-backup-export-m3.mjs supabase/ benchmark/fixtures/
          node --check public/outfit-capture.js
          node --check scripts/test-main181-zero-proposal-native-browser.mjs
      - name: Install pinned test dependencies without hosted writes
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Build exact native PWA with worker unchanged
        run: |
          node scripts/build.mjs
          test -s dist/index.html
          grep -Fq 'No new clothing pieces were added. Nothing was saved.' dist/outfit-capture.js
      - name: All inherited source, owner, backup and privacy Node regressions
        run: node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  browsers:
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M181_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact-reviewed negative-only test and native consumer blobs
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD:public/outfit-capture.js)" = b85242b7856c3b83ed4c38afcb4b409f7292933e
          test "$(git rev-parse HEAD:scripts/test-main181-zero-proposal-native-browser.mjs)" = ea1a5bdb7f0617c71695f9b0382afd6ff7d5f089
      - name: Install pinned Playwright and browser tools
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Actual offline PWA build; never deploy
        run: node scripts/build.mjs
      - name: Unflagged native browser negative worker completion -> retry -> real Single item -> explicit owner approved original
        shell: bash
        run: |
          set -euo pipefail
          for width in 320 390 430; do
            M181_WIDTH="$width" node scripts/test-main181-zero-proposal-native-browser.mjs
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main181-${{ matrix.engine }}-synthetic-negative-no-deploy-HOLD
          path: benchmark/main181-zero-result-native/${{ matrix.engine }}/**/*.json
          retention-days: 14
          if-no-files-found: warn
