name: FLATLAY-CONTRAST-29 source-verified optional manual backdrop review NO DEPLOY
on:
  push:
    branches:
      - research/flatlay-contrast-fallback-29-main-20261104-HOLD
  pull_request:
    paths:
      - 'research/multi-garment-capture-01/review-ui.mjs'
      - 'research/multi-garment-capture-01/flatlay-contrast-29.mjs'
      - 'research/flatlay-contrast-fallback-29/**'
      - 'tests/flatlay-contrast-fallback-29.test.mjs'
      - 'scripts/verify-flatlay-review-29.mjs'
      - 'scripts/measure-flatlay-contrast-real-29.mjs'
      - '.github/workflows/flatlay-contrast-fallback-29-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-plain-backdrop-review-and-real-originals-no-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require accepted parent SHA and research-only file whitelist
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 8515349e536a7c612a50ba8157f3af8b4579330b HEAD
          git diff --name-only 8515349e536a7c612a50ba8157f3af8b4579330b HEAD | while IFS= read -r p; do
            case "$p" in
              research/multi-garment-capture-01/review-ui.mjs|research/multi-garment-capture-01/flatlay-contrast-29.mjs|research/flatlay-contrast-fallback-29/*|tests/flatlay-contrast-fallback-29.test.mjs|scripts/verify-flatlay-review-29.mjs|scripts/measure-flatlay-contrast-real-29.mjs|.github/workflows/flatlay-contrast-fallback-29-no-deploy.yml) ;;
              *) echo "BLOCKED unrelated photo source/auth/segformer/model/3D/DB/deploy change: $p"; exit 1 ;;
            esac
          done
      - name: Install existing research dependencies (no lockfile change)
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Build actual application and run all inherited plus new unit tests
        run: |
          node --check research/multi-garment-capture-01/flatlay-contrast-29.mjs
          node --check research/multi-garment-capture-01/review-ui.mjs
          node --check scripts/verify-flatlay-review-29.mjs
          node --check scripts/measure-flatlay-contrast-real-29.mjs
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Genuine Chromium and WebKit native review UI at 320 390 430
        run: node scripts/verify-flatlay-review-29.mjs
      - name: Download four real source-locked Wikimedia JPEGs in research runner only
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl
          mkdir -p benchmark/flatlay-contrast-29
          curl -fL --silent --show-error --retry 5 --retry-delay 4 --max-time 120 -A 'ClosetCurrentResearch/1.0 (read-only SHA locked photo benchmark)' 'https://upload.wikimedia.org/wikipedia/commons/3/3b/Clothing_flatlay_%28Unsplash%29.jpg' -o benchmark/flatlay-contrast-29/flatlay-outfit.jpg
          sleep 2
          curl -fL --silent --show-error --retry 5 --retry-delay 4 --max-time 120 -A 'ClosetCurrentResearch/1.0 (read-only SHA locked photo benchmark)' 'https://upload.wikimedia.org/wikipedia/commons/e/e6/Outfit_%28Unsplash%29.jpg' -o benchmark/flatlay-contrast-29/flatlay-womens.jpg
          sleep 2
          curl -fL --silent --show-error --retry 5 --retry-delay 4 --max-time 120 -A 'ClosetCurrentResearch/1.0 (read-only SHA locked photo benchmark)' 'https://upload.wikimedia.org/wikipedia/commons/2/27/Shirts_-_Photo_A_Day_7_1_2009_%283681113424%29.jpg' -o benchmark/flatlay-contrast-29/two-shirts.jpg
          sleep 2
          curl -fL --silent --show-error --retry 5 --retry-delay 4 --max-time 120 -A 'ClosetCurrentResearch/1.0 (read-only SHA locked photo benchmark)' 'https://upload.wikimedia.org/wikipedia/commons/b/b0/Shirt_and_tie%2C_jeans_and_Converse.jpg' -o benchmark/flatlay-contrast-29/worn-rkk.jpg
          node scripts/measure-flatlay-contrast-real-29.mjs
      - name: Independently verify original hash receipts, UI state and all six PNG byte SHA values
        run: |
          node --input-type=module <<'EONODE'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import sharp from 'sharp';
          const dir='benchmark/flatlay-contrast-29/';
          const photo=JSON.parse(await readFile(dir+'real-originals.json','utf8'));
          const browser=JSON.parse(await readFile(dir+'browser.json','utf8'));
          assert.equal(photo.caseCount,4);
          assert.equal(photo.sourceSha256Verified,true);
          assert.equal(photo.realPhotoModelAccuracyClaimed,false);
          assert.equal(photo.newIndependentHoldout,false);
          assert.equal(photo.noGarmentTypeOrColorGuessed,true);
          assert.equal(browser.actualUiCases,6);
          assert.equal(browser.noAutoSave,true);
          assert.equal(browser.accountSwitchClears,true);
          assert.deepEqual(browser.unexpectedRequests,[]);
          assert.deepEqual(browser.browserErrors,[]);
          let screenshots=0;
          const identities=new Set();
          for(const item of browser.cases){
            const id=item.engine+'-'+item.width;
            assert.ok(!identities.has(id));identities.add(id);
            assert.ok(item.flatlayManualFallbackCount>=1);
            const png=await readFile(dir+item.filename);
            assert.equal(createHash('sha256').update(png).digest('hex'),item.sha256);
            const meta=await sharp(png).metadata();
            assert.equal(meta.format,'png');assert.equal(meta.width,item.width);
            screenshots++;
          }
          assert.equal(screenshots,6);
          console.log('FLATLAY-CONTRAST-29 INDEPENDENT ACCEPTANCE: four source-locked real originals, pure unclassified manual suggestions, six genuine phone screenshot SHA receipts, Family Alpha HOLD');
          EONODE
      - name: Delete original public source photographs before publishing sanitized evidence
        if: always()
        run: rm -f benchmark/flatlay-contrast-29/flatlay-outfit.jpg benchmark/flatlay-contrast-29/flatlay-womens.jpg benchmark/flatlay-contrast-29/two-shirts.jpg benchmark/flatlay-contrast-29/worn-rkk.jpg
      - name: Upload only sanitized geometry metrics and synthetic app UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FLATLAY-CONTRAST-29-source-honest-manual-regions-NO-DEPLOY-HOLD
          path: |
            benchmark/flatlay-contrast-29/real-originals.json
            benchmark/flatlay-contrast-29/browser.json
            benchmark/flatlay-contrast-29/*.png
          if-no-files-found: warn
          retention-days: 21
