name: SOURCE98 seven source-SHA-pinned original JPEG independent human reviewer handoff NO DEPLOY
on:
  push:
    branches:
      - research/source97-independent-human-review-handoff-98-main-20261105-HOLD
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seven-genuine-source-blind-human-annotation-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      SOURCE98_RECEIPT: /tmp/source98-reviewer-packets-receipt.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact green #97 parent and FIVE research-only P98 files, zero app/staging/production/deploy changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=31e47ee9f2dcd621fb380bd280ff88c986c219d1
          git merge-base --is-ancestor "$BASE" HEAD
          FIRST=$(git rev-list --reverse "$BASE..HEAD" | head -n1)
          test "$(git rev-parse "$FIRST^")" = "$BASE"
          git diff --name-only "$BASE" HEAD >/tmp/p98-allowed
          while IFS= read -r path; do
            case "$path" in
              scripts/prepare-source97-review-98.mjs|scripts/test-source97-review-98-browser.mjs|tests/source97-independent-human-review-98.test.mjs|research/source97-human-handoff-98/REPORT.md|.github/workflows/source97-independent-human-review-98-no-deploy.yml) ;;
              *) echo "REFUSE nonresearch or new app/customer photo/production/staging/other project change: $path"; exit 1 ;;
            esac
          done </tmp/p98-allowed
          test "$(wc -l </tmp/p98-allowed)" -eq 5
      - name: Install fixed local research-only browser and exact JPEG verification dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Full inherited app build and Node security/privacy/regression/source handoff tests
        run: |
          node --check scripts/prepare-source97-review-98.mjs
          node --check scripts/test-source97-review-98-browser.mjs
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Independently recheck ALL strict source97 original JPEG source-SHA pinning and existing 59+2 identities
        run: node scripts/verify-new-real-commons-candidates-97.mjs --strict
      - name: Generate actual seven-licensed-original A/B/C separate reviewer workspaces in OS TEMP, never artifacts
        run: node scripts/prepare-source97-review-98.mjs --build
      - name: Six actual Chromium and WebKit 320/390/430 original-JPEG annotation-browser cases, QA NOT humans
        run: node scripts/test-source97-review-98-browser.mjs
      - name: Preserve inherited P94 actual original JPEG reviewer browser and independent screenshot audits
        run: |
          node scripts/build-independent-instance-packets-94.mjs
          node scripts/test-independent-instance-94-browser.mjs
          node scripts/audit-independent-instance-94-browser.mjs
      - name: Separate actual-source QA from real human evidence; preserve scientific and release HOLD
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const receipt=JSON.parse(readFileSync(process.env.SOURCE98_RECEIPT,'utf8'));
          const audit=JSON.parse(readFileSync('benchmark/source97-human-handoff-98/browser-audit.json','utf8'));
          assert.equal(receipt.originalPhotoCount,7);
          assert.equal(receipt.sourceSHA256Verified,7);
          assert.equal(Object.keys(receipt.roles).length,3);
          assert.equal(receipt.actualHumanReviewers,0);
          assert.equal(receipt.humanInstanceMasks,0);
          assert.equal(receipt.scientificallyAccepted,0);
          assert.equal(receipt.candidateState,'SHA_PINNED_QUARANTINED_NOT_UNSEEN');
          assert.equal(audit.browserCases,6);
          assert.equal(audit.qaSimulatedPolygonReviews,6);
          assert.equal(audit.verifiedIndependentActualHumanReviews,0);
          assert.equal(audit.independentMasksAccepted,0);
          assert.equal(audit.scientificInstanceIoU,null);
          assert.equal(audit.sourcePoolScientificAcceptance,0);
          assert.equal(receipt.releaseAuthorized,false);
          assert.equal(audit.releaseAuthorized,false);
          assert.equal(audit.familyAlpha,'HOLD');
          assert.equal(audit.physicalAndroidIPhoneTested,false);
          console.log('SOURCE98 exact real original JPEGs and mobile browser research QA PASS; zero real human reviews, quarantine and Family Alpha HOLD.');
          NODE
      - name: Archive ONLY code-free photo-free SHA/screenshot receipt metadata and research report, NO photos, JSON exports or screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SOURCE98-original-JPEG-blind-human-reviewer-handoff-QUARANTINED-NO-DEPLOY
          path: |
            research/source97-human-handoff-98/REPORT.md
            benchmark/source97-human-handoff-98/browser-audit.json
          if-no-files-found: warn
          retention-days: 14
