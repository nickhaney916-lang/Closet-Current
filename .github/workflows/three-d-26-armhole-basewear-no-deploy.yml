name: 3D-26 source dress armhole basewear isolation (HOLD NO DEPLOY)
on:
  pull_request:
    paths:
      - 'research/three-d-15/showroom.mjs'
      - 'research/three-d-15/demo.mjs'
      - 'research/three-d-26/**'
      - 'tests/three-d-26-body-basewear.test.mjs'
      - 'scripts/test-three-d-26-basewear-browser.mjs'
      - '.github/workflows/three-d-26-armhole-basewear-no-deploy.yml'
permissions:
  contents: read
jobs:
  source-and-mannequin-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Strict seven-file isolated research-only source diff
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin 35efaadf9f80589195b261da58a5c16daa68e294
          git diff --name-only 35efaadf9f80589195b261da58a5c16daa68e294 HEAD | while IFS= read -r f; do
            case "$f" in
              research/three-d-15/showroom.mjs|research/three-d-15/demo.mjs|research/three-d-26/*|tests/three-d-26-body-basewear.test.mjs|scripts/test-three-d-26-basewear-browser.mjs|.github/workflows/three-d-26-armhole-basewear-no-deploy.yml) ;;
              *) echo "Unexpected original photos, anatomy, skin rigs, cutout, auth, staging, production or Drive Duel file $f"; exit 1 ;;
            esac
          done
          test "$(git diff --name-only 35efaadf9f80589195b261da58a5c16daa68e294 HEAD | wc -l)" -le 7
          git diff --quiet 35efaadf9f80589195b261da58a5c16daa68e294 HEAD -- research/three-d-24/anatomical-dress.mjs research/three-d-23/dress-neckline.mjs research/three-d-22/neckline-seams.mjs research/three-d-15/outfit-controller.mjs benchmark/locked-photo-sources.json
      - run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 three@0.180.0 playwright@1.56.1
      - name: Rebuild original verified licensed clothing and immutable CC0 anatomical figures
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin 53f2ad344dc56a1477e343531c423aed0e66c17d dd6bac3fa9ff640d4f562cf925337440bdb5cf8f 3a572193987cb29389727426136c6eb3ac326783 dfb40889c4c1221fb1833b859e8a11ef38aeb76e
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
      - name: Ensure green underlayer clears only for original source-verified anatomical dress
        run: |
          node --test tests/three-d-26-body-basewear.test.mjs tests/three-d-25-integrated-anatomy.test.mjs
          node --test --test-name-pattern='Stock-only|Both garment cutouts' tests/three-d-15-outfits.test.mjs
      - name: Actually compare green armhole pixels on unchanged licensed dress and exact shirt control
        run: node scripts/test-three-d-26-basewear-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: THREE-D-26-REAL-DRESS-ARMHOLE-UNDERLAYER-HOLD
          path: |
            benchmark/three-d-26/
            research/three-d-06/models/verified-assets.json
          if-no-files-found: warn
