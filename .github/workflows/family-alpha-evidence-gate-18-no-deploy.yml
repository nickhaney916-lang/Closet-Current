name: FAMILY-ALPHA-QUALITY-LEDGER-24 current PR scientific failures and Work29 health NO DEPLOY
on:
  pull_request:
    paths:
      - 'research/family-alpha-evidence-gate-18/**'
      - 'research/family-alpha-quality-ledger-24/**'
      - 'scripts/family-alpha-quality-ledger-24.mjs'
      - 'tests/family-alpha-quality-ledger-24.test.mjs'
      - 'scripts/family-alpha-evidence-gate-18.mjs'
      - 'tests/family-alpha-evidence-gate-18.test.mjs'
      - '.github/workflows/family-alpha-evidence-gate-18-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read
jobs:
  main-controller-live-evidence-audit-hold-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Prove baseline and source changes limited to independent research gate
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 9012e01443f97f81b236a4f51afdbb6ad885aaaa HEAD
          git diff --name-only 9012e01443f97f81b236a4f51afdbb6ad885aaaa HEAD | while IFS= read -r p; do
            case "$p" in
              research/family-alpha-quality-ledger-24/*|scripts/family-alpha-quality-ledger-24.mjs|tests/family-alpha-quality-ledger-24.test.mjs|.github/workflows/family-alpha-evidence-gate-18-no-deploy.yml) ;;
              *) echo "BLOCKED unrelated application/auth/photo/storage/3D/deploy change: $p"; exit 1 ;;
            esac
          done
      - name: Install read-only regression dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Build original app and run entire Node regression suite including scientific fail-closed gate
        run: |
          node --check scripts/family-alpha-evidence-gate-18.mjs
          node --check scripts/family-alpha-quality-ledger-24.mjs
          node --check tests/family-alpha-evidence-gate-18.test.mjs
          node --check tests/family-alpha-quality-ledger-24.test.mjs
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: READ-ONLY verify exact current PR heads and scientific failures and Work29 observable handoff
        run: node scripts/family-alpha-quality-ledger-24.mjs research/family-alpha-quality-ledger-24/manifest.json benchmark/family-alpha-quality-24 --live
      - name: Upload sanitized pilot readiness report, no photos or credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FAMILY-ALPHA-24-source-locked-current-quality-and-security-HOLD
          path: |
            benchmark/family-alpha-quality-24/report.json
            benchmark/family-alpha-quality-24/report.md
          if-no-files-found: warn
          retention-days: 21
