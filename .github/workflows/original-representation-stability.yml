name: Real original-photo representation stability (research only)
on:
  push:
    branches: [benchmark/original-representation-stability-20261021]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node scripts/original-representation-stability.mjs verify
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
          node scripts/check-customer-pilot-release-gates.mjs
      - name: Unchanged reviewed source guards at their pinned historical sources
        run: |
          git worktree add --detach "$RUNNER_TEMP/intake" 71053247402d2e428044ef38b359057011335823
          (cd "$RUNNER_TEMP/intake" && node scripts/source-holdout-human-review.mjs verify)
          git worktree add --detach "$RUNNER_TEMP/customer" a6ee34a676030cff2a4fcf3b31185275c78371a7
          (cd "$RUNNER_TEMP/customer" && node scripts/verify-camera-cloud-integration.mjs && node scripts/check-dual-parent-review-integration.mjs)
  actual-representation-inference:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1 sharp@0.34.4
          npx playwright install --with-deps chromium webkit
      - name: Fetch the same 13 original sources, never relabel or reacquire
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 39538230372 -n new-source-originals-before-inference -D "$RUNNER_TEMP/originals"
      - name: Prepare full-frame encodings and source/model lineage without garment labels
        run: |
          node scripts/original-representation-stability.mjs verify
          node scripts/original-representation-stability.mjs prepare "$RUNNER_TEMP/originals" "$RUNNER_TEMP/representations"
          node scripts/build.mjs
      - name: Actual unchanged FashionCLIP on originals first and two full-frame representations
        run: node scripts/run-browser-photo-benchmark.mjs "$RUNNER_TEMP/representations/blind-manifest.json" "$RUNNER_TEMP/representations/actual"
      - name: Verify inputs after inference and measure paired decision drift, not accuracy
        run: node scripts/original-representation-stability.mjs score "$RUNNER_TEMP/representations" "$RUNNER_TEMP/representations/actual/results.json"
      - name: Supported browser source and fidelity regression
        run: |
          node scripts/test-native-camera-fidelity-mobile.mjs
          node scripts/test-untyped-photo-import-mobile.mjs
          node scripts/test-original-crop-source-mobile.mjs
          node scripts/original-representation-stability.mjs verify
          node scripts/check-customer-pilot-release-gates.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-original-representation-stability
          path: ${{ runner.temp }}/representations/
          retention-days: 14
          if-no-files-found: error
