name: P153 exact source-head bone attached dual-humanoid hair real mobile WebGL NO DEPLOY
on:
  push:
    branches:
      - research/dual-humanoid-head-hair-153-main-20261107-HOLD
  pull_request:
    branches:
      - research/dual-humanoid-visible-skin-152-main-20261107-HOLD
    paths:
      - research/dual-humanoid-head-hair-153/**
      - scripts/install-dual-humanoid-head-hair-153.mjs
      - scripts/audit-dual-humanoid-head-hair-153.mjs
      - tests/dual-humanoid-head-hair-153.test.mjs
      - .github/workflows/dual-humanoid-head-hair-153-no-deploy.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-original-p152-source-and-complete-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact verified main P152 parent and six narrow research-only paths
        run: |
          BASE=d5319ed3531839b7dd158075603db09f62f3f2bf
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          FIRST="$(git rev-list --reverse "$BASE..HEAD" | head -n 1)"
          test "$(git rev-parse "$FIRST^")" = "$BASE"
          git diff --name-only "$BASE" HEAD >/tmp/p153-scope
          while IFS= read -r file; do
            case "$file" in
              research/dual-humanoid-head-hair-153/source-head-hair.mjs|research/dual-humanoid-head-hair-153/REPORT.md|scripts/install-dual-humanoid-head-hair-153.mjs|scripts/audit-dual-humanoid-head-hair-153.mjs|tests/dual-humanoid-head-hair-153.test.mjs|.github/workflows/dual-humanoid-head-hair-153-no-deploy.yml) ;;
              *) echo "P153 REFUSED production staging photorealism branch or unapproved source file: $file"; exit 1 ;;
            esac
          done </tmp/p153-scope
          test "$(wc -l </tmp/p153-scope)" -eq 6
          git diff --exit-code "$BASE" HEAD -- public supabase package.json package-lock.json research/dual-humanoid-visible-skin-152 research/dual-humanoid-photorealism-118 research/dual-humanoid-photorealistic-integration-150 research/dual-humanoid-face-definition-131
      - name: Install exact temporary Node test libraries without modifying app lockfile
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Research source geometry, detached-only installer and independent release-policy tests
        run: |
          node --check research/dual-humanoid-head-hair-153/source-head-hair.mjs
          node --check scripts/install-dual-humanoid-head-hair-153.mjs
          node --check scripts/audit-dual-humanoid-head-hair-153.mjs
          node --test tests/dual-humanoid-head-hair-153.test.mjs
      - name: Build unchanged native Closet Current app and run ALL inherited tests at exact head
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
  genuine-p150-p152-original-skin-and-layered-hair-3d-before-after:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned WebGL original clothing, Three.js and independent pixel-audit libraries
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Recreate exact independent P150 Parallel 57 source with original CC0 P541 skinned model
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          P150=6e576da9d7ff6a0a439a7762cf333670d20f0131
          P118=672247f7121e92bba32b81cec74efddb2b69c817
          P541=df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          git fetch --no-tags origin "$P150" "$P118" "$P541"
          git worktree add --detach .p150-donor-541 "$P541"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/.p150-donor-541"
          test "$(git -C .p150-donor-541 rev-parse HEAD)" = "$P541"
          ln -s ../node_modules .p150-donor-541/node_modules
          cd .p150-donor-541
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
          mkdir -p research/dual-humanoid-photorealism-118
          git -C .. show "$P118":scripts/install-dual-humanoid-realism-118.mjs > scripts/install-dual-humanoid-realism-118.mjs
          cd ..
          for path in research/dual-humanoid-photorealism-118/realism.mjs research/dual-humanoid-face-definition-131/face-definition.mjs research/dual-humanoid-photorealistic-integration-150/apply-humanoid.mjs scripts/install-dual-humanoid-face-131.mjs scripts/install-dual-humanoid-photorealistic-integration-150.mjs; do
            test ! -e "$path"
            mkdir -p "$(dirname "$path")"
            git show "$P150:$path" > "$path"
          done
          git show "$P150:scripts/test-native-3d-05-browser.mjs" > scripts/test-native-3d-05-p150-153.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const file='scripts/test-native-3d-05-p150-153.mjs';
          let s=readFileSync(file,'utf8');
          const anchor='prunedHairStrands:overlay.skinHair.prunedHairStrands,';
          assert.equal(s.split(anchor).length,2,'P153 pinned native screenshot receipt anchor mismatch');
          s=s.replace(anchor,anchor+
           'headHairMeshCount153:overlay.headHair153?.hairMeshes||0,'+
           'headBoneAttached153:overlay.headHair153?.headAttached||false,'+
           'sourcePhotoGeometryUnchanged153:overlay.headHair153?.originalGarmentGeometryChanged===false,');
          writeFileSync(file,s);
          NODE
          node .p150-donor-541/scripts/install-dual-humanoid-realism-118.mjs .p150-donor-541
          node scripts/install-dual-humanoid-face-131.mjs .p150-donor-541
          node scripts/install-dual-humanoid-photorealistic-integration-150.mjs .p150-donor-541
          node scripts/install-dual-humanoid-visible-skin-152.mjs .p150-donor-541
          node --check scripts/test-native-3d-05-p150-153.mjs
          test "$(git -C .p150-donor-541 rev-parse HEAD)" = "$P541"
          ln -s .p150-donor-541 .native05-donor-541
      - name: Render baseline genuinely visible P152 source skin with original small P150 hair cap
        run: |
          P150=1 node scripts/test-native-3d-05-p150-153.mjs
          mkdir -p benchmark/dual-humanoid-head-hair-153/before
          cp benchmark/dual-humanoid-photorealistic-integration-150/*.png benchmark/dual-humanoid-head-hair-153/before/
          cp benchmark/dual-humanoid-photorealistic-integration-150/screens-*.json benchmark/dual-humanoid-head-hair-153/before/
          cp benchmark/native-3d-05/results.json benchmark/dual-humanoid-head-hair-153/before/native-result.json
          test "$(find benchmark/dual-humanoid-head-hair-153/before -name '*.png' | wc -l)" -eq 18
      - name: Integrate actual head-anchored male/female scalp and layered source hair in detached test donor only
        run: |
          node scripts/install-dual-humanoid-head-hair-153.mjs .p150-donor-541
          node --check .p150-donor-541/research/dual-humanoid-head-hair-153/source-head-hair.mjs
          node --check .p150-donor-541/research/dual-humanoid-photorealistic-integration-150/apply-humanoid.mjs
          test "$(git -C .p150-donor-541 rev-parse HEAD)" = df6885d6011cb33fb22dceb81a08f35a0ac4dd61
      - name: Render actual photographed dress with visible male/female source skin, face and attached improved hair at all real native Chromium mobile widths
        run: |
          P150=1 node scripts/test-native-3d-05-p150-153.mjs
          mkdir -p benchmark/dual-humanoid-head-hair-153/after
          cp benchmark/dual-humanoid-photorealistic-integration-150/*.png benchmark/dual-humanoid-head-hair-153/after/
          cp benchmark/dual-humanoid-photorealistic-integration-150/screens-*.json benchmark/dual-humanoid-head-hair-153/after/
          cp benchmark/native-3d-05/results.json benchmark/dual-humanoid-head-hair-153/after/native-result.json
          test "$(find benchmark/dual-humanoid-head-hair-153/after -name '*.png' | wc -l)" -eq 18
      - name: Verify genuine WebKit source-licensed dress and both 163-bone figure choices (no fabricated photo fallback pass)
        run: |
          P150=1 P150_BROWSER=webkit node scripts/test-native-3d-05-p150-153.mjs
          cp benchmark/native-3d-05/results.json benchmark/dual-humanoid-head-hair-153/after/native-webkit-result.json
      - name: Independently audit 36 real original JPEG outfit P150/P152/P153 screenshot hashes, head silhouette and owner-source integrity
        run: node scripts/audit-dual-humanoid-head-hair-153.mjs
      - name: Require research HOLD, no invented independent facial photorealism approval
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const x=JSON.parse(readFileSync('benchmark/dual-humanoid-head-hair-153/audit/acceptance.json','utf8'));
          assert.equal(x.actualChromiumMatchedBeforeAfterPairs,18);
          assert.equal(x.SHA256VerifiedOriginalScreenshots,36);
          assert.equal(x.actualWebKitModelCases,3);
          assert.equal(x.savedOutfitSourceAndGarmentMeshCountsUnchanged,true);
          assert.equal(x.retainedGenuineSourceSkinShaderP152,true);
          assert.equal(x.independentHumanRealismApproved,false);
          assert.equal(x.releaseAuthorized,false);
          assert.equal(x.familyAlpha,'HOLD');
          console.log('P153 genuine head-anchored source hair improved, FULL photorealism remains unverified and Family Alpha remains HOLD');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P153-source-attached-female-male-hair-36-actual-WebGL-views-HOLD-NO-DEPLOY
          path: |
            research/dual-humanoid-head-hair-153/REPORT.md
            benchmark/dual-humanoid-head-hair-153/before/*.png
            benchmark/dual-humanoid-head-hair-153/before/screens-*.json
            benchmark/dual-humanoid-head-hair-153/after/*.png
            benchmark/dual-humanoid-head-hair-153/after/screens-*.json
            benchmark/dual-humanoid-head-hair-153/audit/acceptance.json
            benchmark/dual-humanoid-head-hair-153/after/native-*.json
          if-no-files-found: warn
          retention-days: 14
