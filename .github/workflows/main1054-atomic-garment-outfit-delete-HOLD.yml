name: MAIN1054 atomic garment outfit delete HOLD
on:
  pull_request:
    branches: [research/main1054-owner-stylist-defaults-HOLD]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/main1054-atomic-garment-outfit-delete-HOLD'
    strategy:
      fail-fast: false
      matrix:
        check: [regression, chromium, webkit, storage]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact accepted parent and restricted scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor 21108c29e66af063c5c52fb146a880023e7b6534 HEAD
          git diff --exit-code 21108c29e66af063c5c52fb146a880023e7b6534 HEAD -- . ':(exclude)public/app.js' ':(exclude)scripts/p1659-native-delete-reload.cjs' ':(exclude)tests/mission3-private-mutation-epoch.test.cjs' ':(exclude)tests/mission3-same-owner-delete-cas.test.cjs' ':(exclude)tests/mission3-saved-card-delete-session-cas.test.cjs' ':(exclude)tests/mission3-reviewed-editor-postcommit-lease.test.cjs' ':(exclude).github/workflows/main1054-atomic-garment-outfit-delete-HOLD.yml'
          git show 21108c29e66af063c5c52fb146a880023e7b6534:public/app.js > "$RUNNER_TEMP/delete-parent.js"
          node --check public/app.js
          node --check scripts/p1659-native-delete-reload.cjs
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: node scripts/build.mjs
      - if: matrix.check == 'regression'
        run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
      - if: matrix.check == 'storage'
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium webkit
          node scripts/test-main1054-reviewed-payload-native.mjs
          CONFLICT_OUT="$RUNNER_TEMP/delete-concurrency" node scripts/test-outfit-draft-conflicts-browser.mjs
          node scripts/test-mission3-lossless-v4-owner-acceptance-browser.mjs "$RUNNER_TEMP/delete-backup"
      - if: matrix.check == 'chromium' || matrix.check == 'webkit'
        env:
          P1600_ENGINE: ${{ matrix.check }}
          P99_ENGINE: ${{ matrix.check }}
          M58_ENGINE: ${{ matrix.check }}
        run: |
          set -euo pipefail
          npx playwright install --with-deps "$P99_ENGINE"
          cp public/app.js "$RUNNER_TEMP/delete-candidate.js"
          trap 'cp "$RUNNER_TEMP/delete-candidate.js" public/app.js' EXIT
          cp "$RUNNER_TEMP/delete-parent.js" public/app.js
          P1659_EXPECT_RED=1 node scripts/p1659-native-delete-reload.cjs
          cp "$RUNNER_TEMP/delete-candidate.js" public/app.js
          node scripts/p1659-native-delete-reload.cjs
          for width in 320 390 430; do
            P99_WIDTH="$width" node scripts/p1647-native-retrieval.cjs
            P99_WIDTH="$width" node scripts/p1653-native-stylist-defaults.cjs
            P1607_AUDIT=1 P99_WIDTH="$width" node scripts/test-parallel99-normal-app-browser.mjs
          done
          node scripts/test-parallel94-native-p88-browser.mjs
          node scripts/check-1452-journey-receipts.mjs "$P99_ENGINE"
  acceptance:
    if: always()
    needs: [verify]
    runs-on: ubuntu-24.04
    env:
      RESULT: ${{ needs.verify.result }}
    steps:
      - run: test "$RESULT" = success
