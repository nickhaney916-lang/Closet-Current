name: Mission 1 P841 all pending photo owner review — NO DEPLOY
on:
  push:
    branches: [research/mission1-all-pending-photo-review-841-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mission1-p841-pending-review-HOLD
  cancel-in-progress: true
jobs:
  exact-p840-scope-and-native-HOLD:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact research parent and strictly scoped four files
        run: |
          set -euo pipefail
          BASE=c44166443e52ac7487ea84d8218098ff629610d2
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD > /tmp/m1-p841-changed
          cat /tmp/m1-p841-changed
          test "$(wc -l < /tmp/m1-p841-changed)" -eq 4
          while IFS= read -r path; do
            case "$path" in
              public/app.js|scripts/test-m1-owner-review-editor-839.mjs|research/mission1-all-pending-photo-review-841/REPORT.md|.github/workflows/mission1-all-pending-photo-review-841-no-deploy.yml) ;;
              *) echo "P841 OUT-OF-SCOPE CHANGE: $path"; exit 1 ;;
            esac
          done < /tmp/m1-p841-changed
          test -z "$(git diff --name-only "$BASE" HEAD -- public/outfit-worker.mjs public/outfit-instance-review-840.mjs public/local-worker.mjs public/recognition-engine.mjs public/recognition-vectors.bin public/recognition-vectors.json supabase benchmark)"
          grep -Fq 'FAMILY ALPHA HOLD #255' research/mission1-all-pending-photo-review-841/REPORT.md
          echo M1_P841_NO_DEPLOY_SCOPED
      - name: Install native dependencies without tracked changes
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Full Node regression and original no-account build
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check scripts/test-m1-owner-review-editor-839.mjs
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  actual-mobile-width-browser-review-HOLD:
    needs: [exact-p840-scope-and-native-HOLD]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real desktop browser engines
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: P839 and P841 actual captured photo adjustment DOM checks (not physical devices)
        run: |
          set -euo pipefail
          node scripts/test-m1-owner-review-editor-839.mjs
          echo M1_P841_REAL_BROWSER_OWNER_REVIEW_PASS_NO_MODEL_ACCURACY_CLAIM
