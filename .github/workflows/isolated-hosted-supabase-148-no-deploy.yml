name: P148 isolated hosted Supabase acceptance guard and ready-to-run probe NO DEPLOY
on:
  push:
    branches: [research/isolated-hosted-supabase-acceptance-148-main-20261107-HOLD]
  pull_request:
    branches: [research/signed-two-owner-transport-147-main-20261107-HOLD]
    paths:
      - research/isolated-hosted-supabase-acceptance-148/**
      - scripts/test-isolated-hosted-supabase-148.mjs
      - tests/isolated-hosted-supabase-148.test.mjs
      - .github/workflows/isolated-hosted-supabase-148-no-deploy.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-project-gate-and-all-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact verified P147 parent, six research paths only and protected DB untouched
        run: |
          BASE=d4b835959630da59672077b291276491f5d0479c
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          FIRST="$(git rev-list --reverse "$BASE..HEAD" | head -n1)"
          test "$(git rev-parse "$FIRST^")" = "$BASE"
          git diff --name-only "$BASE" HEAD >/tmp/p148-changes
          while IFS= read -r path; do
            case "$path" in
              research/isolated-hosted-supabase-acceptance-148/hosted-project-guard.mjs|research/isolated-hosted-supabase-acceptance-148/hosted-acceptance-probe.mjs|research/isolated-hosted-supabase-acceptance-148/REPORT.md|scripts/test-isolated-hosted-supabase-148.mjs|tests/isolated-hosted-supabase-148.test.mjs|.github/workflows/isolated-hosted-supabase-148-no-deploy.yml) ;;
              *) echo "REFUSE unexpected source, production, staging or parallel path: $path"; exit 1 ;;
            esac
          done </tmp/p148-changes
          test "$(wc -l </tmp/p148-changes)" -eq 6
          git diff --exit-code "$BASE" HEAD -- public supabase package.json package-lock.json research/signed-two-owner-transport-147 research/native-owner-reviewed-cloud-ui-146 research/local-remote-consent-fence-134 research/cloud-restore-owner-safety-137 research/signed-owner-cloud-integration-129
      - name: Pinned temporary dependencies without lockfile modifications
        run: npm install --no-save --no-package-lock --no-audit --no-fund fake-indexeddb@6.2.4 sharp@0.34.3 playwright@1.56.1 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Validate runnable hosted probe and fail-closed gate syntax
        run: |
          node --check research/isolated-hosted-supabase-acceptance-148/hosted-project-guard.mjs
          node --check research/isolated-hosted-supabase-acceptance-148/hosted-acceptance-probe.mjs
          node --check scripts/test-isolated-hosted-supabase-148.mjs
          node --check tests/isolated-hosted-supabase-148.test.mjs
      - name: Refuse all connected production/staging/other project targets and dangerous credentials
        run: node --test tests/isolated-hosted-supabase-148.test.mjs
      - name: Safe hosted default MUST refuse without any hosted network or project changes
        run: |
          node scripts/test-isolated-hosted-supabase-148.mjs | tee /tmp/p148-safe-hold
          grep -q 'HOSTED_NOT_RUN_NO_APPROVED_DISPOSABLE_PROJECT' /tmp/p148-safe-hold
          grep -q '"hostedSupabaseCertified":false' /tmp/p148-safe-hold
          grep -q '"productionOrStagingTouched":false' /tmp/p148-safe-hold
      - name: Unchanged native Closet Current build
        run: node scripts/build.mjs
      - name: Complete inherited Node regression suite at exact HEAD
        run: node --test tests/*.test.cjs tests/*.test.mjs
      - name: Declare hosted certification NOT RUN without isolated project
        run: |
          echo "P148 valid artifact: safe guarded readiness + full inherited regression tests ONLY."
          echo "P148 actual hosted Supabase signed-JWT, Storage, RLS and recovery certification: BLOCKED pending separately approved disposable project."
          echo "Family Alpha Issue #255: HOLD. NO DEPLOY."
