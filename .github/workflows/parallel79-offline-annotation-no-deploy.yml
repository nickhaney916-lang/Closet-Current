name: Parallel 79 offline annotation — NO DEPLOY
on:
  push:
    branches: [research/parallel79-offline-human-annotation-workstation-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: parallel79-offline-annotation-HOLD
  cancel-in-progress: true
jobs:
  native-and-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable P851 parent and strict research-only allowlist
        shell: bash
        run: |
          set -euo pipefail
          BASE=9b582710e1b406e0d8ee256940627b5297646500
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE" HEAD > /tmp/p79-paths
          while IFS= read -r path; do
            case "$path" in
              scripts/p79-workstation-core.mjs|scripts/p79-workstation.mjs|scripts/p79-synthetic-fixtures.mjs|scripts/test-p79-workstation-browser.mjs|tests/parallel79-workstation.test.mjs|research/parallel79/workstation/index.html|research/parallel79/workstation/app.js|research/parallel79/workstation/style.css|research/parallel79/workstation/display.mjs|research/parallel79/OPERATOR.md|research/parallel79/REPORT.md|.github/workflows/parallel79-offline-annotation-no-deploy.yml) ;;
              *) echo "Out of scope: $path"; exit 1 ;;
            esac
          done < /tmp/p79-paths
          test -z "$(git diff --name-only "$BASE" HEAD -- public supabase benchmark scripts/p75-dataset-core.mjs scripts/p75-review-offline.mjs)"
          grep -Fq 'FAMILY ALPHA HOLD #255 OPEN' research/parallel79/REPORT.md
      - name: Temporary synthetic test dependencies only
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Full native regression and unchanged application builds
        run: |
          set -euo pipefail
          node --check scripts/p79-workstation.mjs
          node --check scripts/p79-workstation-core.mjs
          node --check research/parallel79/workstation/app.js
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          P79_REQUIRE_DECODER=1 node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
          node scripts/m1-release-evidence-851.mjs
  desktop-engines-synthetic-only:
    needs: native-and-scope
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium webkit
      - name: Actual desktop engines, synthetic fixtures, zero genuine human labels
        run: node scripts/test-p79-workstation-browser.mjs
