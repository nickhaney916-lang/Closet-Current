name: Work 42 Outfit Photo Board OFFLINE NO DEPLOY
on:
  pull_request:
    paths: ['research/work42-presentation/**', 'tests/work42/**', 'scripts/test-work42-photo-board-browser.mjs', '.github/workflows/work42-photo-board-offline-no-deploy.yml']
permissions:
  contents: read
jobs:
  photo-board:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - run: node --test tests/work42/*.test.mjs
      - run: node scripts/test-work42-photo-board-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: work42-licensed-photo-board-HOLD
          path: benchmark/work42/
