name: Main1054 cumulative original camera and import proof HOLD
on:
  pull_request:
    branches: [research/main1054-crop-preview-revision-HOLD]
permissions:
  contents: read
jobs:
  cumulative-camera-import:
    if: github.head_ref == 'research/main1054-cumulative-camera-proof-HOLD' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Independently verify accepted cumulative tree and workflow-only delta
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          base=a133273214432e0338c4ca988c1f75beea81acc6
          test "$PR_BASE" = "$base"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse "$base^{tree}")" = af68753b162c8b3163c5b0ce47f48be5a1ae9ff7
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git diff --name-only "$base" HEAD)" = '.github/workflows/main1054-cumulative-camera-proof-HOLD.yml'
          test "$(git rev-parse HEAD:.github/workflows/capture-proof-01-no-deploy.yml)" = 1aa47f424b137bf697268bf49525152bcb15fce1
          test "$(git rev-parse HEAD:scripts/test-capture-proof-01-browser.mjs)" = 631c050d6ec3cadf356dcd1e1b989a853928e97e
          test "$(git rev-parse HEAD:tests/capture-proof-01.test.mjs)" = a9f3c022b9f62222dda7598cdb122e1392230414
          test "$(git rev-parse HEAD:research/capture-proof-01/source-proof.mjs)" = 74e0a82b3d0e7ec88c5c2c21ce88b3faf6c7ba88
          git log -1 --format='tested commit %H tree %T'
          echo "Accepted application tree unchanged; historical guard preserved"
      - name: Install isolated browser test runner without packaging or deploy
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Source syntax, proof source guards and two-browser QA syntax
        run: |
          node --check public/app.js
          node --check public/outfit-capture.js
          node --check public/photo-crop-editor.js
          node --check research/capture-proof-01/source-proof.mjs
          node --check tests/capture-proof-01.test.mjs
          node --check scripts/test-capture-proof-01-browser.mjs
      - name: Original camera JPEG, EXIF, PNG conversion and tampering regressions
        run: node --test tests/capture-proof-01.test.mjs tests/index-04-saved-recognition.test.mjs tests/index-03-recognition-safety.test.mjs tests/wardrobe-index-01.test.mjs tests/wardrobe-index-02.test.mjs
      - name: Complete existing Closet Current app regression and build (NEVER PUBLISH)
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
      - name: True mobile Chromium and WebKit 320 390 430 page/canvas/WebCrypto/IDB QA
        run: node scripts/test-capture-proof-01-browser.mjs
      - name: Strict evidence manifest and no-deploy acceptance
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('benchmark/capture-proof-01/results.json','utf8'));
          assert.equal(r.verdict,'PASS');
          assert.deepEqual(r.results.map(x=>x.engine+':'+x.width),
           ['chromium:320','chromium:390','chromium:430','webkit:320','webkit:390','webkit:430']);
          assert.equal(r.errors.length,0);assert.equal(r.outbound.length,0);
          assert.ok(r.results.every(x=>x.realPage&&x.realCanvasJPEG&&x.genuineWebCrypto&&
           x.realIndexedDB&&x.simulatedCamera&&x.mockedWorkers&&
           x.permissionDeniedAndRecovered&&x.frontFacingFallback&&
           x.originalFullResolution&&x.unverifiedNeedsReview&&
           x.originalImportConversionHonest&&x.manualCorrectionSaved&&x.tamperedSourceRefused&&
           x.failedPlaybackStopped&&x.visibilityInterruptStopped&&
           x.logoutDuringPendingHashDiscarded&&x.outfitOriginalHandoff&&
           x.logoutClearsPrivateIndex&&!x.actualPhysicalPhone));
          assert.equal(r.physicalAndroidTested,false);
          assert.equal(r.physicalIphoneTested,false);
          assert.equal(r.freshNeuralInference,false);
          assert.equal(r.productionDeployed,false);
          assert.equal(r.familyAlpha,'HOLD');
          console.log('CAPTURE-PROOF 6 genuine browser viewport scenarios and no-deploy PASS');
          NODE
      - name: Upload synthetic browser screenshots and integrity manifest HOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MAIN1054-CUMULATIVE-CAMERA-IMPORT-SYNTHETIC-HOLD
          path: benchmark/capture-proof-01/
          if-no-files-found: warn
