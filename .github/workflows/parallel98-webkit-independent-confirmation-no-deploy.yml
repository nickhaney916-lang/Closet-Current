name: P98 independent second exact-HEAD Node and real browser gate NO DEPLOY
on:
  push:
    branches: [fix/parallel98-webkit-input-reentry-HOLD]
  pull_request:
    branches: [fix/parallel95-webkit-source-restore-reentry-HOLD]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  independent-node-and-owner-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact immutable native source identity
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=851b83390a3d933e43a0685e592f882d9009e332
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse HEAD:public/outfit-board.js)" = 5668a4bc6da2e94fc13d23392cd7fb4981d0bc2d
          test "$(git rev-parse HEAD:research/main-thread-integration-1054/native-2d-preview.mjs)" = 0af20d49d87436683630d587ec0284c611cd3414
          test "$(git rev-parse HEAD:scripts/test-parallel95-native-source-restore-reentry.mjs)" = 51ca53e77573f916bfe06539f1be9687f2eded09
          test "$(git rev-parse HEAD:scripts/test-main51-real-app-owner-original-2d.mjs)" = 63cc9da00eaecbeb2576482dcae1528b44ea8189
          git diff --exit-code "$BASE" HEAD -- public/ supabase/ research/ tests/
          git diff --name-only "$BASE" HEAD | while IFS= read -r path; do
           case "$path" in
            scripts/test-parallel98-webkit-input-reentry.mjs|.github/workflows/parallel98-webkit-input-acceptance-no-deploy.yml|.github/workflows/parallel98-webkit-independent-confirmation-no-deploy.yml) ;;
            *) echo "P98 unauthorized changed path: $path"; exit 1;;
           esac
          done
          node --check scripts/test-parallel98-webkit-input-reentry.mjs
      - name: Install local dependencies, build, full no-retry inherited tests
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  independent-genuine-browser-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, chromium]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M51_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact immutable native source identity
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=851b83390a3d933e43a0685e592f882d9009e332
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse HEAD:public/outfit-board.js)" = 5668a4bc6da2e94fc13d23392cd7fb4981d0bc2d
          test "$(git rev-parse HEAD:research/main-thread-integration-1054/native-2d-preview.mjs)" = 0af20d49d87436683630d587ec0284c611cd3414
          test "$(git rev-parse HEAD:scripts/test-parallel95-native-source-restore-reentry.mjs)" = 51ca53e77573f916bfe06539f1be9687f2eded09
          test "$(git rev-parse HEAD:scripts/test-main51-real-app-owner-original-2d.mjs)" = 63cc9da00eaecbeb2576482dcae1528b44ea8189
          git diff --exit-code "$BASE" HEAD -- public/ supabase/ research/ tests/
          git diff --name-only "$BASE" HEAD | while IFS= read -r path; do
           case "$path" in
            scripts/test-parallel98-webkit-input-reentry.mjs|.github/workflows/parallel98-webkit-input-acceptance-no-deploy.yml|.github/workflows/parallel98-webkit-independent-confirmation-no-deploy.yml) ;;
            *) echo "P98 unauthorized changed path: $path"; exit 1;;
           esac
          done
          node --check scripts/test-parallel98-webkit-input-reentry.mjs
      - name: Install local pinned dependencies, build
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
          node scripts/build.mjs
      - name: One independent genuine native mouse/tap/keyboard source-attested browser process
        run: node scripts/test-parallel98-webkit-input-reentry.mjs
