name: COLOR-ENGINE-CONSISTENCY-21 same-original cross-browser safe color acceptance NO DEPLOY
on:
  pull_request:
    paths:
      - 'public/photo-color.js'
      - 'tests/color-engine-consistency-21.test.cjs'
      - 'scripts/audit-color-engine-consistency-21.mjs'
      - 'research/color-engine-consistency-21/**'
      - '.github/workflows/color-engine-consistency-21-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-original-jpeg-auto-color-consistency-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Parent exact accepted PR577 and research-source-only no-deploy scope
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor b71b2c7e33c6b67ba66ae7b7be3a24f923311133 HEAD
          git diff --name-only b71b2c7e33c6b67ba66ae7b7be3a24f923311133 HEAD | while IFS= read -r p; do
            case "$p" in
              public/photo-color.js|tests/color-engine-consistency-21.test.cjs|scripts/audit-color-engine-consistency-21.mjs|research/color-engine-consistency-21/*|.github/workflows/color-engine-consistency-21-no-deploy.yml) ;;
              *) echo "BLOCKED changed unrelated auth/private closet/source/model/3D/deploy: $p"; exit 1 ;;
            esac
          done
      - name: Install fixed test dependencies without altering project packages
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Actual app build and full Node suite with color boundary and manual correction regressions
        run: |
          node --check public/photo-color.js
          node --check scripts/audit-color-engine-consistency-21.mjs
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Two real browser engines original JPEG photo-color pipeline and independent pair consistency
        run: |
          node scripts/test-color-confidence-19-real-photo.mjs
          node scripts/audit-color-confidence-19.mjs
          node scripts/audit-user-color-authority-20.mjs
          node scripts/audit-color-engine-consistency-21.mjs
      - name: Preserve true observed photo-pair results and hash-verified mobile browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLOR-ENGINE-21-source-locked-real-browser-safety-HOLD
          path: |
            benchmark/color-confidence-19/*.json
            benchmark/color-confidence-19/*.png
          if-no-files-found: warn
          retention-days: 21
