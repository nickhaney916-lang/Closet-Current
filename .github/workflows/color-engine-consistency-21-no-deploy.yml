name: REVIEW-COLOR-PROVENANCE-23 existing-workflow bridge for read-only consumer provenance NO DEPLOY
on:
  push:
    branches:
      - research/review-color-provenance-23-main-20261104-HOLD
  pull_request:
    paths:
      - 'public/app.js'
      - 'tests/review-color-provenance-23.test.cjs'
      - 'scripts/test-color-confidence-19-real-photo.mjs'
      - 'scripts/audit-review-color-provenance-23.mjs'
      - 'research/review-color-provenance-23/**'
      - '.github/workflows/review-color-provenance-23-no-deploy.yml'
      - '.github/workflows/color-engine-consistency-21-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-review-form-provenance-and-save-closures-no-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Pin exact accepted PR578 and limit changed paths to research review provenance
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 876b680272b6e2c40be24410a14b92802bdf991b HEAD
          git diff --name-only 876b680272b6e2c40be24410a14b92802bdf991b HEAD | while IFS= read -r p; do
            case "$p" in
              public/app.js|tests/review-color-provenance-23.test.cjs|scripts/test-color-confidence-19-real-photo.mjs|scripts/audit-review-color-provenance-23.mjs|research/review-color-provenance-23/*|.github/workflows/review-color-provenance-23-no-deploy.yml|.github/workflows/color-engine-consistency-21-no-deploy.yml) ;;
              *) echo "BLOCKED: unrelated app/model/auth/DB/3D/deploy file: $p"; exit 1 ;;
            esac
          done
      - name: Install existing research dependencies without modifying package files
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Full app build and all inherited plus capture/closet submit closure Node tests
        run: |
          node --check scripts/test-color-confidence-19-real-photo.mjs
          node --check scripts/audit-review-color-provenance-23.mjs
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Genuine unchanged JPEG and actual consumer clothingFields note edit vs color change Chromium and WebKit
        run: |
          node scripts/test-color-confidence-19-real-photo.mjs
          node scripts/audit-color-confidence-19.mjs
          node scripts/audit-user-color-authority-20.mjs
          node scripts/audit-color-engine-consistency-21.mjs
          node scripts/audit-review-color-provenance-23.mjs
      - name: Upload source integrity, color provenance proof and genuine phone-width screenshots only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: REVIEW-COLOR-PROVENANCE-23-real-source-and-browser-safety-HOLD
          path: |
            benchmark/color-confidence-19/*.json
            benchmark/color-confidence-19/*.png
          if-no-files-found: warn
          retention-days: 21
