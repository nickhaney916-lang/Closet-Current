name: MAIN248 fixed fresh real original JSEP WebKit sample HOLD
on:
  push:
    branches: [research/main248-original-jsep-fresh-sample-HOLD]
permissions:
  contents: read
jobs:
  original-source-security:
    name: M248 immutable original source and entire inherited owner security
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exactly four new research-only files and preserved original P94/P101/M247
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=39122f16e37ff4d4bbbddddf13b1a8d274faad25
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE" HEAD)" = "$(printf '%s\n' \
            '.github/workflows/main248-original-jsep-fresh-sample-HOLD.yml' \
            'scripts/main248-fresh-original-jsep-evidence.mjs' \
            'scripts/test-main248-fresh-original-jsep-browser-batch.mjs' \
            'tests/main248-fresh-original-jsep-evidence.test.mjs')"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-main247-original-jsep-phase-browser.mjs)" = f43fc837d485d82e058efc07180ecdd3bb21e313
          test "$(git rev-parse HEAD:scripts/test-parallel101-real-p94-model-init-stage-browser.mjs)" = ad8ab0eb33322a34f8cc3f45a1fe26feff87b2ab
          node --check scripts/main248-fresh-original-jsep-evidence.mjs
          node --check scripts/test-main248-fresh-original-jsep-browser-batch.mjs
          node --test tests/main248-fresh-original-jsep-evidence.test.mjs
          M248_SOURCE_ONLY=1 M248_ENGINE=webkit M248_WIDTH=390 M248_SHARD=0 M248_COUNT=4 node scripts/test-main248-fresh-original-jsep-browser-batch.mjs
      - name: Install pinned original offline app and security dependencies
        run: npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Full original offline build and inherited Node privacy/backup/security
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm view onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 dist.integrity)" = "sha512-0uS76OPgH0hWCPrFKlL8kYVV7ckM7t/36HfbgoFw6Nd0CZVVbQC4PkrR8mBX8LtNUFZO25IQBqV2Hx2ho3FlbQ=="
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  original-fresh-jsep:
    name: M248 original fresh ${{ matrix.engine }} ${{ matrix.width }} shard-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        include:
          - {engine: webkit, width: 320, shard: 0, count: 4}
          - {engine: webkit, width: 320, shard: 1, count: 4}
          - {engine: webkit, width: 390, shard: 0, count: 4}
          - {engine: webkit, width: 390, shard: 1, count: 4}
          - {engine: webkit, width: 430, shard: 0, count: 4}
          - {engine: webkit, width: 430, shard: 1, count: 4}
          - {engine: chromium, width: 320, shard: 0, count: 2}
          - {engine: chromium, width: 390, shard: 0, count: 2}
          - {engine: chromium, width: 430, shard: 0, count: 2}
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M248_ENGINE: ${{ matrix.engine }}
      M248_WIDTH: ${{ matrix.width }}
      M248_SHARD: ${{ matrix.shard }}
      M248_COUNT: ${{ matrix.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct actual matrix engine viewport fresh-process count and original Worker
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$M248_ENGINE" = "${{ matrix.engine }}"
          test "$M248_WIDTH" = "${{ matrix.width }}"
          test "$M248_SHARD" = "${{ matrix.shard }}"
          test "$M248_COUNT" = "${{ matrix.count }}"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-main247-original-jsep-phase-browser.mjs)" = f43fc837d485d82e058efc07180ecdd3bb21e313
          node --test tests/main248-fresh-original-jsep-evidence.test.mjs
          M248_SOURCE_ONLY=1 node scripts/test-main248-fresh-original-jsep-browser-batch.mjs
      - name: Install genuine original JSEP model and native Playwright browser dependencies
        run: npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Original public JPEG model Worker owner-private 2D v4 each fresh process
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node scripts/test-main248-fresh-original-jsep-browser-batch.mjs
