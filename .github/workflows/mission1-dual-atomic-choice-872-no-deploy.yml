name: Mission 1 P872 exact model choice application — NO DEPLOY
on:
  push:
    branches: [research/mission1-dual-atomic-choice-872-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m1-p872-atomic-choice-HOLD
  cancel-in-progress: true
jobs:
  exact-atomic-choice-and-owner-review-NO-DEPLOY:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: P871 immutable parent exact five-file allowlist, release protection
        shell: bash
        run: |
          set -euo pipefail
          BASE=d9ce392233f0ea3a3e6e6f037c3af8239ebca1d0
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | tee /tmp/p872-files
          test "$(wc -l </tmp/p872-files)" -eq 5
          while IFS= read -r p; do
            case "$p" in
              public/app.js|public/dual-panel-82.mjs|scripts/test-p82-review-browser.mjs|research/mission1-dual-atomic-choice-872/REPORT.md|.github/workflows/mission1-dual-atomic-choice-872-no-deploy.yml) ;;
              *) echo "UNAUTHORIZED_PATH $p"; exit 1;;
            esac
          done </tmp/p872-files
          test -z "$(git diff --name-only "$BASE" HEAD -- public/dual-worker-82.mjs public/dual-core-82.mjs public/local-worker.mjs public/recognition-engine.mjs public/model-arbitration-81.mjs public/cloud-backup.js supabase)"
          grep -Fq 'const reviewFirst836=true;' public/app.js
          grep -Fq 'Family Alpha HOLD #255 OPEN' research/mission1-dual-atomic-choice-872/REPORT.md
          echo P872_SCOPE_NO_DEPLOY_PASS
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium webkit
      - name: Syntax, builds, full native tests and no-release gate
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check public/dual-panel-82.mjs
          node --check scripts/test-p82-review-browser.mjs
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          P79_REQUIRE_DECODER=1 node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
          node scripts/m1-release-evidence-851.mjs | tee /tmp/p872-release
          grep -Fq '"status":"BLOCKED"' /tmp/p872-release
          grep -Fq '"shouldLiftFamilyAlphaHold":false' /tmp/p872-release
      - name: Native original-photo + actual draft choice policy desktop browser
        run: |
          set -euo pipefail
          node scripts/test-m1-original-photo-browser-865.mjs
          node scripts/test-p82-review-browser.mjs | tee /tmp/p872-browser
          test "$(grep -c '^P872_REJECTED_SUGGESTION_NO_FALSE_SUCCESS ' /tmp/p872-browser)" -eq 6
          grep -Fq 'P870_REAL_EDITOR_PROGRAMMATIC_FILL_REVOKES_CONSENT' /tmp/p872-browser
          node scripts/test-parallel80-subtype-browser.mjs
          node scripts/test-m1-owner-pair-admission-846.mjs
