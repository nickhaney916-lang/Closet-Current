name: PARALLEL101 WebKit model-load substage no-deploy HOLD
on:
  push:
    branches: [research/parallel101-webkit-model-init-substage-evidence-HOLD]
  pull_request:
    branches: [research/main225-m224-full-original-seven-job-acceptance-HOLD]
permissions:
  contents: read
jobs:
  source-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Restrict this work to disposable research and source-pinned source
        shell: bash
        run: |
          set -euo pipefail
          BASE=9b243ee584d6f16f553e2365e373e6e8be85cc36
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE" HEAD)" = "$(printf '%s\n' '.github/workflows/parallel101-webkit-model-load-substage-no-deploy.yml' 'scripts/test-parallel101-model-load-substage-browser.mjs')"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          test "$(git rev-parse HEAD:scripts/test-main214-p94-worker-outcome.mjs)" = 8cc2977f1932b3012c44bdd401081cc542b94c57
          test "$(git rev-parse HEAD:public/native-default-atomic-import-m3.mjs)" = 1a4cf649a3656f604c4f3e1d2b1efd7910179edc
          test "$(git rev-parse HEAD:public/native-default-verified-backup-export-m3.mjs)" = af15a9c08a81aa4064d1e5d1c4f0af0d855582c9
          node --check scripts/test-parallel101-model-load-substage-browser.mjs
      - name: Install pinned local test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Full inherited privacy, source, original, recognition Node and offline build
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  genuine-model:
    name: P101 real model substage ${{ matrix.engine }} shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - {engine: webkit, shard: 1}
          - {engine: webkit, shard: 2}
          - {engine: webkit, shard: 3}
          - {engine: webkit, shard: 4}
          - {engine: chromium, shard: 1}
          - {engine: chromium, shard: 2}
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: ${{ matrix.engine }}
      P101_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify only research/CI differences and original Worker/owner path
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=9b243ee584d6f16f553e2365e373e6e8be85cc36
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE" HEAD)" = "$(printf '%s\n' '.github/workflows/parallel101-webkit-model-load-substage-no-deploy.yml' 'scripts/test-parallel101-model-load-substage-browser.mjs')"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          node --check scripts/test-parallel101-model-load-substage-browser.mjs
      - name: Pinned real-browser dependencies and offline app
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
          node scripts/build.mjs
      - name: Fresh actual browser processes with 12 WebKit 430 stress repeats and strict model positives
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          widths=(320 390 430)
          if [ "$M58_ENGINE" = webkit ]; then widths+=(430 430); fi
          attempt=0
          for width in "${widths[@]}"; do
            attempt=$((attempt+1))
            echo "::group::P101 real $M58_ENGINE shard=$P101_SHARD width=$width"
            if P94_WIDTH="$width" P101_ATTEMPT="$M58_ENGINE-$P101_SHARD-$width-$attempt" node scripts/test-parallel101-model-load-substage-browser.mjs; then
              echo "P101_NATIVE_PASS $M58_ENGINE shard=$P101_SHARD width=$width"
            else
              code=$?
              echo "::error::P101_NATIVE_FAIL $M58_ENGINE shard=$P101_SHARD width=$width exit=$code"
              failures=$((failures+1))
            fi
            echo "::endgroup::"
          done
          echo "P101_NATIVE_SHARD_RESULT engine=$M58_ENGINE shard=$P101_SHARD attempts=$attempt failures=$failures"
          test "$failures" -eq 0
      - name: Independently unmodified original Worker control at 430px
        if: ${{ matrix.shard == 1 }}
        env:
          P94_WIDTH: '430'
        run: node scripts/test-main214-p94-worker-outcome.mjs
