          node --check tests/parallel89-virtual-loop-planarity.test.mjs
          node --check research/parallel89/skirt-virtual-loop-planarity89.mjs
          node --check tests/parallel89-original-core-contour-connectivity.test.mjs
          node --check tests/parallel89-original-core-nohit-geometry.test.mjs
          node --check tests/parallel89-skirt-original-core-skin-weight-sensitivity.test.mjs
          node --check tests/parallel89-skirt-original-core-nohit-source-bones.test.mjs
          node --check tests/parallel89-skirt-original-core-unknown-causes.test.mjs
          node --check tests/parallel89-skirt-original-core-span.test.mjs
          node --check tests/parallel89-skirt-original-source-boundary-regions.test.mjs
          node --check tests/parallel89-skirt-source-indexed-seam.test.mjs
          node --check tests/parallel89-skirt-source-body-manifold.test.mjs
          node --check tests/parallel89-skirt-source-radial-gap.test.mjs
          node --check research/parallel89/skirt-original-ray-coverage-causes89.mjs
          node --check research/parallel89/skirt-original-upper-inward-witness89.mjs
          node --check research/parallel89/skirt-original-upper-limb-core-veto89.mjs
          node --check scripts/test-parallel89-real-skirt-browser.mjs
      - name: Install exact browser, THREE, photographic decode and real BVH packages
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Read-only original licensed P541 and verified P84 BVH donor worktrees
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach .p89-disposable-p541 df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          git worktree add --detach .p89-readonly-p84 8385c308df215bcf80eb95b8c37660307dc80536
          for dir in .p89-disposable-p541 .p89-readonly-p84; do
            git config --global --add safe.directory "$GITHUB_WORKSPACE/$dir"
            ln -s ../node_modules "$dir/node_modules"
          done
          cd .p89-disposable-p541
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
      - name: Unchanged original Honolulu photo-to-163bone browser regression, newly separate Met research source not mixed
        run: node scripts/test-parallel89-real-skirt-browser.mjs .p89-disposable-p541 .p89-readonly-p84
      - name: Confirm real source donors and held consumer remain immutable
