          node --test tests/parallel89-met-four-photo-chromatic-silhouette.test.mjs
      - name: Acquire genuine four-image museum gallery and photo byte hashes (research-only, no source import)
        run: |
          node --check scripts/test-parallel89-met-four-original-photo-silhouettes.mjs
