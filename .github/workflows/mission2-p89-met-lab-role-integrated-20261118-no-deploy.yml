          .m2-met-mask-env/bin/python -m unittest discover -s tests -p 'test_parallel89_met_local_lab_boundary_stability.py' -v
      - name: Real original photograph nearest stable cloth vs exterior four-smoothing confidence veto
        run: .m2-met-mask-env/bin/python scripts/test-parallel89-met-independent-lab-boundary-real-source.py
