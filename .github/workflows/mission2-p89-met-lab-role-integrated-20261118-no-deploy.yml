      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M2-Met-source-photo-UNCERTAINTY-ONLY-proposal-preview-NOT-ACCEPTED-HOLD
          path: benchmark/parallel89-met70759-PREVIEW-not-accepted/
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: M2-Met-four-original-source-OFFLINE-human-review-correction-portal-HOLD
          path: benchmark/parallel89-met70759-OFFLINE-boundary-review-HOLD/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M2-Met-four-source-BOUNDARY-REVIEW-NEEDED-HOLD
          path: benchmark/parallel89-met70759-boundary-review-UNAPPROVED/
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M2-Met-four-SHA-source-full-alpha-AUTO-UNREVIEWED-HOLD
          path: benchmark/parallel89-met70759-full-alpha-proposals/
          retention-days: 14
          if-no-files-found: warn
      - name: Focused adversarial pooled and out-of-range source triangle checks
        run: node --test tests/parallel89-original-upper-limb-core-veto.test.mjs tests/parallel89-original-upper-inward-witness.test.mjs tests/parallel89-original-ray-coverage-causes.test.mjs tests/parallel89-original-dense-motion-contact.test.mjs tests/parallel89-source-contact-snapshot.test.mjs tests/parallel89-skirt-rigid-registration.test.mjs tests/parallel89-skirt-source-radial-gap.test.mjs tests/parallel89-skirt-source-body-manifold.test.mjs tests/parallel89-skirt-source-indexed-seam.test.mjs tests/parallel89-skirt-original-source-boundary-regions.test.mjs tests/parallel89-skirt-original-core-span.test.mjs tests/parallel89-skirt-original-core-unknown-causes.test.mjs tests/parallel89-skirt-original-core-nohit-source-bones.test.mjs tests/parallel89-skirt-original-core-skin-weight-sensitivity.test.mjs tests/parallel89-original-core-nohit-geometry.test.mjs tests/parallel89-original-core-contour-connectivity.test.mjs tests/parallel89-original-contour-endpoint-provenance.test.mjs tests/parallel89-virtual-loop-planarity.test.mjs tests/parallel89-virtual-contour-arrangement.test.mjs tests/parallel89-original-indexed-slab-connectivity.test.mjs tests/parallel89-original-seven-height-component.test.mjs tests/parallel89-original-seven-height-shell-eligibility.test.mjs
