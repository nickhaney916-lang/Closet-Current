          .m2-met-mask-env/bin/python -m unittest discover -s tests -p 'test_parallel89_met_source_component_correction.py' -v
      - name: Original museum 1406 actual pale photo background vs 1408 cream tie distinct source component corrected research candidate
        run: .m2-met-mask-env/bin/python scripts/test-parallel89-met-source-photo-component-correction.py
      - name: Adversarial independent-source local LAB vote categories and wrong-Met-pixel gate
