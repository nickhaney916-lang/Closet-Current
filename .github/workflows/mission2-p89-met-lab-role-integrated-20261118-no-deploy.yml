        run: |
          .m2-met-mask-env/bin/python -m py_compile research/parallel89/met_review_handoff89.py scripts/build-parallel89-met-mask-review-portal.py
          .m2-met-mask-env/bin/python scripts/build-parallel89-met-mask-review-portal.py
      - name: Adversarial source-original uncertainty-only correction and 3D veto tests
        run: |
          .m2-met-mask-env/bin/python -m py_compile research/parallel89/met_review_delta89.py scripts/test-parallel89-met-source-correction-preview.py
          .m2-met-mask-env/bin/python -m unittest discover -s tests -p 'test_parallel89_met_review_delta.py' -v
      - name: Actual four source-image SHA verified review proposal import to nonapproved candidate-only mask simulation
        run: .m2-met-mask-env/bin/python scripts/test-parallel89-met-source-correction-preview.py
      - name: Adversarial true-source side/caption spoof, original RGB/mask tamper, fake qualified approval controls
        run: |
