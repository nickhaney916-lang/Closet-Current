          node --check tests/parallel89-skirt-source3d.test.mjs
          node --test tests/parallel89-skirt-source3d.test.mjs
      - name: Joint photo-row source-fidelity and collision-floor negative contracts
        run: node --test tests/parallel89-skirt-source3d.test.mjs tests/parallel89-original-photo-front-locked-floor.test.mjs
      - name: Genuine original photographed front registration strip reductions and refusal tests
        run: |
          node --check research/parallel89/skirt-rigid-registration89.mjs
          node --check tests/parallel89-skirt-rigid-registration.test.mjs
          node --test tests/parallel89-skirt-rigid-registration.test.mjs
      - name: Verify exact original upstream #1329 physical-size source + adversarial tests
        shell: bash
