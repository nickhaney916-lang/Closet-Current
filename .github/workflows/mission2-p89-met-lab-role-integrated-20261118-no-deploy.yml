      - name: Install isolated source-only OpenCV mask research dependencies
        run: |
          python -m venv .m2-met-mask-env
          .m2-met-mask-env/bin/python -m pip install --no-cache-dir --disable-pip-version-check numpy==1.26.4 opencv-python-headless==4.11.0.86 scipy==1.14.1
      - name: Adversarial four-photo mask identity and pale waistband source-prior tests
        run: |
          .m2-met-mask-env/bin/python -m unittest discover -s tests -p 'test_parallel89_met_full_mask_proposal.py' -v
      - name: Source-identity spoof, detached fabric, color/neutral boundary adversarial controls
        run: .m2-met-mask-env/bin/python -m unittest discover -s tests -p 'test_parallel89_met_mask_boundary_triage.py' -v
      - name: Generate four genuine source RGB full-alpha proposals and uncertainty masks for expert review ONLY
        run: .m2-met-mask-env/bin/python scripts/test-parallel89-met-four-real-full-masks.py
      - name: True original decoded-RGB four-garment mask boundary and expert-review queue
