name: "Mission 2 P89 combined original Lab and catalog-role boundary NO DEPLOY"
on:
  push:
    branches: [research/mission2-p89-met-lab-role-integrated-safety-20261118-HOLD]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  inherited-node-and-negative:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict immutable P89 donor parent / research-only scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e6e3485fb3527fba753969195258ff28d3dfa4ec HEAD
          git diff --exit-code e6e3485fb3527fba753969195258ff28d3dfa4ec HEAD -- public/ supabase/ benchmark/fixtures/ benchmark/locked-photo-sources.json
          while IFS= read -r p; do
            case "$p" in
              scripts/build-parallel89-met-mask-review-portal.py|scripts/test-parallel89-met-offline-review-browser.mjs|.github/workflows/mission2-p89-met-original-source-lab-review-handoff-20261118-no-deploy.yml|research/parallel89/met-four-photo-chromatic-silhouette89.mjs|scripts/test-parallel89-met-four-original-photo-silhouettes.mjs|tests/parallel89-met-four-photo-chromatic-silhouette.test.mjs|.github/workflows/mission2-p89-met-four-gallery-view-provenance-safety-20261118-no-deploy.yml|.github/workflows/mission2-p89-met-lab-role-integrated-20261118-no-deploy.yml) ;;
              *) echo "Unauthorized non-M2 code change: $p"; exit 1 ;;
            esac
          done < <(git diff --name-only e6e3485fb3527fba753969195258ff28d3dfa4ec HEAD)
      - name: Verify exact upstream photo-row donor blobs and front-floor receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:research/parallel89/skirt-source3d89.mjs)" = e743bdada63cf2bb200e448540f33bb04f4e7cd6
          test "$(git rev-parse HEAD:tests/parallel89-skirt-source3d.test.mjs)" = f01d520f703a013cc963a5c27486ac28f1f53ef6
      - name: Install pinned disposable Node research packages
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Parse original-source and receipt modules
        run: |
          node --check research/parallel89/skirt-original-contour-endpoint-provenance89.mjs
          node --check research/parallel89/skirt-original-indexed-slab-connectivity89.mjs
          node --check research/parallel89/skirt-original-seven-height-component89.mjs
          node --check research/parallel89/skirt-original-seven-height-shell-eligibility89.mjs
          node --check tests/parallel89-original-seven-height-shell-eligibility.test.mjs
          node --check tests/parallel89-original-seven-height-component.test.mjs
          node --check tests/parallel89-original-indexed-slab-connectivity.test.mjs
          node --check research/parallel89/skirt-virtual-loop-planarity89.mjs
          node --check research/parallel89/skirt-virtual-contour-arrangement89.mjs
          node --check tests/parallel89-virtual-contour-arrangement.test.mjs
          node --check tests/parallel89-virtual-loop-planarity.test.mjs
          node --check research/parallel89/skirt-original-core-contour-connectivity89.mjs
          node --check research/parallel89/skirt-original-core-nohit-geometry89.mjs
          node --check research/parallel89/skirt-original-core-skin-weight-sensitivity89.mjs
          node --check research/parallel89/skirt-original-core-nohit-source-bones89.mjs
          node --check research/parallel89/skirt-original-core-unknown-causes89.mjs
          node --check research/parallel89/skirt-original-core-span89.mjs
          node --check research/parallel89/skirt-original-source-boundary-regions89.mjs
          node --check research/parallel89/skirt-source-indexed-seam89.mjs
          node --check research/parallel89/skirt-source-body-manifold89.mjs
          node --check research/parallel89/skirt-source-radial-gap89.mjs
          node --check research/parallel89/skirt-original-ray-coverage-causes89.mjs
          node --check research/parallel89/skirt-original-upper-inward-witness89.mjs
          node --check research/parallel89/skirt-original-upper-limb-core-veto89.mjs
          node --check tests/parallel89-original-upper-limb-core-veto.test.mjs
          node --check tests/parallel89-original-upper-inward-witness.test.mjs
          node --check tests/parallel89-original-ray-coverage-causes.test.mjs
          node --check research/parallel89/source-contact-snapshot89.mjs
          node --check research/parallel89/skirt-original-dense-motion-contact89.mjs
          node --check research/parallel89/native-skirt-browser89.mjs
          node --check tests/parallel89-original-dense-motion-contact.test.mjs
          node --check scripts/test-parallel89-real-skirt-browser.mjs
          node --check research/parallel89/skirt-rigid-registration89.mjs
          node --check tests/parallel89-source-contact-snapshot.test.mjs
          node --check tests/parallel89-skirt-rigid-registration.test.mjs
