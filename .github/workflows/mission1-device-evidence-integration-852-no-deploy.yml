name: Mission 1 P852 source-bound physical-device evidence integration — NO DEPLOY
on:
  push:
    branches: [research/mission1-device-evidence-integration-852-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mission1-p852-device-evidence-HOLD
  cancel-in-progress: true
jobs:
  pinned-P851-research-no-deploy-HOLD:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable P851 source, exactly eight changes, release HOLD and no deployment
        shell: bash
        run: |
          set -euo pipefail
          BASE=9b582710e1b406e0d8ee256940627b5297646500
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD >/tmp/p852-files
          cat /tmp/p852-files
          test "$(wc -l </tmp/p852-files)" -eq 8
          while IFS= read -r path; do
            case "$path" in
              public/index.html|public/device-acceptance-78.js|tests/parallel78-device-acceptance.test.cjs|tests/mission1-device-release-integration-852.test.mjs|scripts/test-parallel78-device-browser.mjs|research/parallel78-physical-device/OPERATOR-PROTOCOL.md|research/mission1-device-evidence-integration-852/REPORT.md|.github/workflows/mission1-device-evidence-integration-852-no-deploy.yml) ;;
              *) echo "M1 P852 OUT-OF-SCOPE $path"; exit 1 ;;
            esac
          done </tmp/p852-files
          test -z "$(git diff --name-only "$BASE" HEAD -- public/app.js public/auth.js public/outfit-capture.js public/local-worker.mjs public/outfit-worker.mjs public/recognition-engine.mjs public/review-queue-850.js scripts/m1-release-evidence-851.mjs supabase benchmark)"
          grep -Fqx 'const reviewFirst836=true;' <(grep '^const reviewFirst836=' public/app.js)
          grep -Fq 'let saveInFlight=false;' public/app.js
          grep -Fq 'P849_CHANGED_CANDIDATE_OR_OWNER' public/app.js
          grep -Fq 'reviewQueue850.keepForLater(batch,window.closetAuth.user)' public/app.js
          grep -Fq 'FAMILY ALPHA HOLD #255 OPEN' research/mission1-device-evidence-integration-852/REPORT.md
          grep -Fq 'id="p78commit"' public/device-acceptance-78.js
          grep -Fq 'const SOURCE_PARENT=' public/device-acceptance-78.js
          echo M1_P852_EXACT_P851_8_PATH_NO_DEPLOY_PASS
      - name: Install temporary no-save QA dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Source-executed device receipt, P851 signature and release BLOCKED integration
        run: |
          set -euo pipefail
          node --check public/device-acceptance-78.js
          node --check scripts/test-parallel78-device-browser.mjs
          node --test tests/parallel78-device-acceptance.test.cjs tests/mission1-device-release-integration-852.test.mjs
          node scripts/m1-release-evidence-851.mjs | tee /tmp/p852-evidence
          grep -Fq '"status":"BLOCKED"' /tmp/p852-evidence
          grep -Fq '"shouldLiftFamilyAlphaHold":false' /tmp/p852-evidence
          echo M1_P852_ALL_PHONE_CLAIMS_INDEPENDENT_RELEASE_STILL_BLOCKED_PASS
      - name: Both research builds and full native Node suite
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
          echo M1_P852_FULL_NATIVE_AND_BUILDS_PASS
  actual-desktop-browser-qa-HOLD:
    needs: [pinned-P851-research-no-deploy-HOLD]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and WebKit DESKTOP engines, never claim real devices
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Actual default-off #78 local device UI, mandatory exact-running SHA, blocked export 320/390/430
        run: |
          set -euo pipefail
          node scripts/test-parallel78-device-browser.mjs
      - name: Inherited P850 batch, P849 duplicates, P848 colors, P847 correction, P846 shoes and safe owner save
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node scripts/test-m1-batch-review-850.mjs
          node scripts/test-parallel77-cross-capture-browser.mjs
          node scripts/test-parallel76-color-browser.mjs
          node scripts/test-m1-owner-learning-integration-847.mjs
          node scripts/test-m1-owner-pair-admission-846.mjs
          node scripts/test-m1-review-save-lifecycle-844.mjs parent
          node scripts/test-m1-review-save-lifecycle-844.mjs candidate
          node scripts/test-m1-review-first-default-843.mjs
          node scripts/test-m1-owner-review-editor-839.mjs
          echo M1_P852_INHERITED_CHROMIUM_WEBKIT_OWNER_REVIEW_PASS
  public-original-source-hash-NOT-accuracy-HOLD:
    needs: [pinned-P851-research-no-deploy-HOLD]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      P73_PHOTO_IDS: commons-0003,commons-0014,commons-0021,commons-0033,commons-0049,commons-0060,commons-0077,commons-0082,commons-0094,validation-0001,validation-0019
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Temporary image decoder only
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3
      - name: Public original-source byte and SHA check; NOT human blind accuracy
        run: |
          set -euo pipefail
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos "$P73_PHOTO_IDS"
          node scripts/evaluate-parallel73-real-photo.mjs
          echo M1_P852_11_REAL_ORIGINAL_BYTES_HUMAN_TRUTH_ZERO_PASS
