name: INSTANCE-SEGMENTATION-56 pinned model pilot and inherited private-flow regression NO DEPLOY
on:
  push:
    branches:
      - research/instance-segmentation-accuracy-56-work-HOLD
  pull_request:
    paths:
      - 'research/instance-segmentation-accuracy-56/**'
      - '.github/workflows/instance-segmentation-accuracy-56-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-model-research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require verified Priority55 ancestry and strict research-only changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 77af898d0cf67f963d13f487da1ecfe2e96fe035 HEAD
          git diff --name-only 77af898d0cf67f963d13f487da1ecfe2e96fe035 HEAD > /tmp/instance56-files
          while IFS= read -r path; do
            case "$path" in
              research/instance-segmentation-accuracy-56/*|scripts/verify-instance-segmentation-accuracy-56-browser.mjs|benchmark/instance-segmentation-accuracy-56/*|.github/workflows/instance-segmentation-accuracy-56-no-deploy.yml) ;;
              *) echo "BLOCKED unexpected non-research change: $path"; exit 1 ;;
            esac
          done < /tmp/instance56-files
      - name: Install pinned browser dependencies and Python inference runtime
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 onnxruntime-web@1.23.2
          python -m pip install --disable-pip-version-check onnxruntime==1.23.2 numpy==2.2.6 Pillow==11.3.0
      - name: Build application and run inherited Node regression suite
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Run actual pinned ONNX instance-mask CPU pilot on frozen photo fixtures
        run: python research/instance-segmentation-accuracy-56/evaluate_yolo26_candidate.py
      - name: Run actual pinned ONNX instance-mask WASM inference in Chromium and WebKit at three widths
        run: node scripts/verify-instance-segmentation-accuracy-56-browser.mjs
      - name: Archive only sanitized metrics and screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: INSTANCE-SEGMENTATION-56-research-only-evidence
          path: |
            research/instance-segmentation-accuracy-56/pilot-report.json
            benchmark/instance-segmentation-accuracy-56/browser-report.json
            benchmark/instance-segmentation-accuracy-56/*.png
          if-no-files-found: warn
          retention-days: 14
