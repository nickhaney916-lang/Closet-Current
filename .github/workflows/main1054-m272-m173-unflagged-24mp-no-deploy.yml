name: MAIN1054 M272 M173 unflagged original and 24MP safe migration NO DEPLOY HOLD
on:
  push:
    branches: [research/main1054-m272-m173-unflagged-24mp-HOLD]
permissions:
  contents: read
jobs:
  m272-source-and-inherited-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin independent verifier and exact immutable M271 source lineage
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD:scripts/main1054-m272-m173-source-gate.mjs)" = 0c3fa7e42d3dd03e9a51c5708e575a782818fc14
          node scripts/main1054-m272-m173-source-gate.mjs
          node --check scripts/main1054-m272-m173-source-gate.mjs
      - name: First-attempt source, original EXIF, unflagged owner and tamper negative witnesses
        run: node --test tests/main1054-m272-m173-source-gate.test.mjs
      - name: Inherited consent/source/receipt and owner-lease regressions
        run: node --test tests/capture-navigation.test.cjs tests/outfit-capture.test.cjs tests/main1054-m254-signed-outfit-lease.test.mjs tests/main1054-m271-m58-gate.test.mjs tests/parallel106-source-gate.test.mjs
      - name: Install pinned source-only development test runtime (no deploy or hosted writes)
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Build genuine offline app and all inherited private-source, backup and security tests
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          test -s dist/index.html
          for f in native-outfit-source-plan-p99.mjs native-photo-3d-veto-p99.mjs native-2d-preview-p99.mjs; do test -s "dist/$f"; done
          grep -Fq 'const mission4Preview1054Active=true;' dist/outfit-board.js
          grep -Fq "'./native-2d-preview-p99.mjs'" dist/outfit-board.js
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  m272-normal-original-app:
    needs: m272-source-and-inherited-node
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        width: [320, 390, 430]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      P99_ENGINE: ${{ matrix.engine }}
      P99_WIDTH: ${{ matrix.width }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact M173 immutable JPEG, owner and P99 source and no deployment
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD:scripts/main1054-m272-m173-source-gate.mjs)" = 0c3fa7e42d3dd03e9a51c5708e575a782818fc14
          node scripts/main1054-m272-m173-source-gate.mjs
      - name: Install pinned original-app browser dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Offline build real unflagged normal app
        run: node scripts/build.mjs
      - name: Genuine normal Home/gallery original -> explicit synthetic review -> owner-private 2D outfit -> restored original
        run: node scripts/test-parallel99-normal-app-browser.mjs
      - name: Archive limited nonprivate receipt for each exact width and engine
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m272-normal-${{ matrix.engine }}-${{ matrix.width }}-NO-DEPLOY-HOLD
          path: benchmark/parallel99-normal-journey/${{ matrix.engine }}/${{ matrix.width }}/**/*.json
          retention-days: 7
          if-no-files-found: ignore
  m272-original-24mp-and-session:
    needs: m272-source-and-inherited-node
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      P99_ENGINE: ${{ matrix.engine }}
      M51_ENGINE: ${{ matrix.engine }}
      M58_ENGINE: ${{ matrix.engine }}
      M123_ENGINE: ${{ matrix.engine }}
      P94_WIDTH: '390'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm original 24MP license bytes and exact M173 owner/session source
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD:scripts/main1054-m272-m173-source-gate.mjs)" = 0c3fa7e42d3dd03e9a51c5708e575a782818fc14
          node scripts/main1054-m272-m173-source-gate.mjs
      - name: Install original native browser/runtime tools
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Build original local PWA, no deployment
        run: node scripts/build.mjs
      - name: Genuine previous owner-session source and original 2D reentry
        run: node scripts/test-main51-real-app-owner-original-2d.mjs
      - name: Preserve M106 terminal/stale/owner assertions using exact approved native source repin only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync,rmSync} from 'node:fs';
          import {spawnSync} from 'node:child_process';
          const source=readFileSync('scripts/test-main1054-m106-preview-terminal-browser.mjs','utf8');
          const replacements=[
            ['5668a4bc6da2e94fc13d23392cd7fb4981d0bc2d','b8ed5ebe18e81ec3f8f5659257289b8217a6877b'],
            ['research/main-thread-integration-1054/native-2d-preview.mjs','public/native-2d-preview-p99.mjs'],
            ['0af20d49d87436683630d587ec0284c611cd3414','52d2b6d8834f27d9114e022fe8574947eda85206']
          ];
          let adapted=source;
          for(const [before,after] of replacements){
            assert.ok(adapted.includes(before),'Inherited M106 assertion/source changed unexpectedly');
            adapted=adapted.replaceAll(before,after);
          }
          const file='scripts/.m272-m173-original-m106-approved-repin.mjs';
          try{
            writeFileSync(file,adapted,{flag:'wx'});
            const result=spawnSync(process.execPath,[file],{env:process.env,stdio:'inherit',timeout:12*60*1000});
            if(result.error)throw result.error;
            assert.equal(result.status,0,'unchanged M106 terminal/owner assertions failed');
          }finally{rmSync(file,{force:true});}
          JS
      - name: Genuine P88 WASM unmodified public 4000x6000 JPEG with EXIF and owner-confirmed private restore
        env:
          P96_NATIVE_4K: 'true'
        run: node scripts/test-parallel96-native-highres-browser.mjs
      - name: Genuine M172 24MP source refused if it would write unauthorized private owner state
        env:
          P96_NATIVE_4K: 'true'
        run: node scripts/test-main172-24mp-private-state-invariance.mjs
      - name: Same-owner two-source original restoration in real browser without fitted 3D permission
        run: node scripts/test-main157-same-photo-native-outfit-browser.mjs
      - name: Store no private photo, auth token, or hosted receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m272-original-24mp-${{ matrix.engine }}-HOLD
          path: |
            benchmark/parallel96-highres/${{ matrix.engine }}/**/*.json
            benchmark/main172*/${{ matrix.engine }}/**/*.json
          retention-days: 7
          if-no-files-found: ignore
