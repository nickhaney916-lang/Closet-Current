name: Family Alpha 2D isolated QA
on:
  push:
    branches: [alpha/photo-layered-2d-foundation-20261023]
  pull_request:
    paths:
      - 'public/family-alpha-2d-*'
      - 'tests/family-alpha-2d-*'
      - '.github/workflows/family-alpha-2d-qa.yml'
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/family-alpha-2d-layer-plan.test.mjs tests/family-alpha-2d-photo-renderer.test.mjs
