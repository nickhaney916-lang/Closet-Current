name: Family Alpha 2D aspect ratio QA - NO DEPLOY
on:
  push:
    branches: [fix/family-alpha-2d-aspect-contain-20261023]
  pull_request:
    paths:
      - 'public/family-alpha-2d-*'
      - 'tests/family-alpha-2d-*'
      - 'scripts/test-family-alpha-2d-aspect-browser.mjs'
      - '.github/workflows/family-alpha-2d-qa.yml'
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Build isolated app candidate only - do not deploy
        run: node scripts/build.mjs
      - name: Fetch exact pinned protected-stage and recognition source commits
        run: |
          git fetch --no-tags origin 879f1b92fb15f9bc9a7f0429c7ee178f7bbf1373 795ad6637f8d4f782bc99751211b25e8e72a3a7d 08ed6ac4a3fc921eae5d5d3df3bd3966429559d2 1ecac1079e75f1f25dc70a4c712b2448eb87dca8
      - name: Prepare isolated staging Auth HOLD fixture required by full Node suite
        run: node scripts/build-family-alpha-staging-auth-hold.mjs
      - name: Prepare disabled recognition plus original-JPEG avatar fixture required by full Node suite
        run: node scripts/build-family-alpha-recognition-integrated-hold.mjs
      - name: Run all Node regressions including photo aspect containment
        run: node --test tests/*.test.cjs tests/*.test.mjs
  chromium-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Install isolated browser harness without changing app dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - name: Verify decoded image proportions in Chromium and WebKit mobile viewports
        run: node scripts/test-family-alpha-2d-aspect-browser.mjs
