name: Real Chromium restricted staging service worker QA
on:
  push:
    branches: [test/staging-installed-pwa-chromium-20261021]
permissions:
  contents: read
jobs:
  chromium-installed-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove app, production workflow and hosted schemas untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 2651f4e4567b8ee1717ef869df2fa33ed6cb4ac8 HEAD -- public supabase .github/workflows/pages.yml .github/workflows/cloudflare-pages.yml
          node scripts/check-staging-preflight-scope.mjs
          node scripts/check-integrated-pilot-rc.mjs
          node scripts/check-customer-pilot-release-gates.mjs
      - name: Complete app Node suite
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Generate invented staging bundle and run offline simulation
        env:
          CLOSET_STAGING_APP_ORIGIN: https://preview.closet-current-staging.pages.dev/
          CLOSET_STAGING_SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
          CLOSET_STAGING_SUPABASE_PUBLISHABLE_KEY: sb_publishable_STAGING_TEST_FIXTURE_XYZ001
        run: |
          node scripts/build-restricted-staging.mjs
          node scripts/verify-restricted-staging-bundle.mjs
          node scripts/test-staging-sw-cache.mjs
      - name: Install pinned Chromium browser harness
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise actual installed staging worker on local Chromium
        run: node scripts/test-staging-installed-pwa-chromium.mjs
      - name: No cloud service or production deployment authorized
        run: |
          echo 'REAL LOOPBACK CHROMIUM PWA QA ONLY. NO HOSTED ENVIRONMENT, CUSTOMER DATA OR DEPLOYMENT.'
