name: SCENE-CLASS-32 fail-closed actual mobile review UI NO DEPLOY
on:
  push:
    branches:
      - research/scene-class-trust-32-main-20261104-HOLD
  pull_request:
    paths:
      - 'research/multi-garment-capture-01/scene-class-guard-32.mjs'
      - 'research/multi-garment-capture-01/review-ui.mjs'
      - 'research/scene-class-guard-32/**'
      - 'scripts/verify-scene-class-guard-32.mjs'
      - 'tests/scene-class-guard-32.test.mjs'
      - '.github/workflows/scene-class-guard-32-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-only-no-actual-customer-data:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact research ancestry and only permitted UI and test changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 27e7f583a2a63f99f5e59e110ec7df84bf0cd214 HEAD
          git diff --name-only 27e7f583a2a63f99f5e59e110ec7df84bf0cd214 HEAD > /tmp/scene32-paths
          while IFS= read -r p; do
            case "$p" in
              research/multi-garment-capture-01/scene-class-guard-32.mjs|research/multi-garment-capture-01/review-ui.mjs|research/scene-class-guard-32/*|scripts/verify-scene-class-guard-32.mjs|tests/scene-class-guard-32.test.mjs|.github/workflows/scene-class-guard-32-no-deploy.yml) ;;
              *) echo "BLOCKED unexpected production/staging/model/photo/privacy change: $p"; exit 1 ;;
            esac
          done < /tmp/scene32-paths
      - name: Install pinned no-deploy test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Check research source, build actual app and run ALL inherited and new Node tests
        run: |
          node --check research/multi-garment-capture-01/scene-class-guard-32.mjs
          node --check research/multi-garment-capture-01/review-ui.mjs
          node --check scripts/verify-scene-class-guard-32.mjs
          node --check tests/scene-class-guard-32.test.mjs
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Verify actual local multi-garment review interface in real Chromium and WebKit
        run: node scripts/verify-scene-class-guard-32.mjs
      - name: Independently hash every screenshot and audit scope against synthetic evidence report
        run: |
          node --input-type=module <<'EONODE'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import sharp from 'sharp';
          const base='benchmark/scene-class-guard-32/';
          const r=JSON.parse(await readFile(base+'browser.json','utf8'));
          assert.equal(r.priority,'SCENE-CLASS-TRUST-32');
          assert.equal(r.actualUiCases,6);
          assert.equal(r.realBrowsers,2);
          assert.equal(r.segmentationModelActuallyRun,false);
          assert.equal(r.noPersonModelClassAndColorNeverPrefilled,true);
          assert.equal(r.explicitHumanCategoryTypeColorEnabledConfirmation,true);
          assert.equal(r.originalUnchanged,true);
          assert.equal(r.accountSwitchClears,true);
          assert.equal(r.noAutoSave,true);
          assert.deepEqual(r.unexpectedRequests,[]);
          assert.deepEqual(r.browserErrors,[]);
          for(const engine of ['chromium','webkit'])for(const width of [320,390,430]){
            const row=r.cases.find(x=>x.engine===engine&&x.width===width);
            assert.ok(row&&row.initialSceneDefaultsVerified&&row.explicitCategoryTypeColorRequired);
            const buf=await readFile(base+row.filename);
            assert.equal(createHash('sha256').update(buf).digest('hex'),row.sha256);
            const info=await sharp(buf).metadata();
            assert.equal(info.format,'png');assert.equal(info.width,width);
          }
          console.log('SCENE-32 six browser original-JPEG UI screenshot SHA and fail-closed assertions independently PASS — Family Alpha HOLD');
          EONODE
      - name: Attach ONLY synthetic-source UI screenshots and SHA receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SCENE-CLASS-32-synthetic-review-no-deploy-FamilyAlpha-HOLD
          path: |
            benchmark/scene-class-guard-32/browser.json
            benchmark/scene-class-guard-32/*.png
          if-no-files-found: warn
          retention-days: 21
