name: Mission1 P771 mixed-outfit independently signed per-garment human evidence NO DEPLOY
on:
  push:
    branches:
      - research/mission1-mixed-outfit-human-labels-771-HOLD
    paths:
      - research/mission1-mixed-outfit-771/garment-instance-contract.mjs
      - research/mission1-mixed-outfit-771/REPORT.md
      - research/mission1-sealed-human-holdout-768/prospective-gate.mjs
      - tests/mission1-prospective-holdout-768.test.mjs
      - .github/workflows/mission1-mixed-outfit-771-no-deploy.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mission1-P771-HOLD-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-signed-multi-garment-instance-labels:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact verified P770 parent and five research/test-only paths
        run: |
          set -euo pipefail
          BASE=65023b1dfcdf7e46a0aa38b92dd5f90b8303acd0
          git fetch --depth=1 origin "$BASE"
          test "$(git rev-parse "$BASE")" = "$BASE"
          git diff --name-only "$BASE" "$GITHUB_SHA" > /tmp/p771-paths
          cat /tmp/p771-paths
          test "$(wc -l </tmp/p771-paths)" -eq 5
          while read -r f; do
            case "$f" in
              research/mission1-mixed-outfit-771/garment-instance-contract.mjs|research/mission1-mixed-outfit-771/REPORT.md|research/mission1-sealed-human-holdout-768/prospective-gate.mjs|tests/mission1-prospective-holdout-768.test.mjs|.github/workflows/mission1-mixed-outfit-771-no-deploy.yml) ;;
              *) echo "P771 research only, refuses unapproved file: $f"; exit 1 ;;
            esac
          done </tmp/p771-paths
          test -z "$(git diff --name-only "$BASE" "$GITHUB_SHA" -- public supabase)"
          echo P771_FIVE_RESEARCH_ONLY_PATHS_FAMILY_ALPHA_HOLD_255
      - name: Ephemeral original test dependencies, zero persistent changes
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Strict syntax checks, reproducible build, and all independent label human signature tests
        run: |
          set -euo pipefail
          node --check research/mission1-mixed-outfit-771/garment-instance-contract.mjs
          node --check research/mission1-sealed-human-holdout-768/prospective-gate.mjs
          node --check tests/mission1-prospective-holdout-768.test.mjs
          node scripts/build.mjs
          node --test tests/mission1-prospective-holdout-768.test.mjs
      - name: Complete application source recognition privacy and 3D Node regressions
        run: node --test tests/*.test.cjs tests/*.test.mjs
      - name: Zero fabricated actual independent-human annotations or release authorization
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {P66_EXPOSED_DIGESTS} from './research/mission1-sealed-human-holdout-768/prospective-gate.mjs';
          const old=JSON.parse(readFileSync('benchmark/locked-photo-sources.json','utf8'));
          assert.equal(old.length,59);
          assert.equal(P66_EXPOSED_DIGESTS.length,6);
          assert.equal(new Set([...old.map(x=>x.sha256),...P66_EXPOSED_DIGESTS]).size,65);
          console.log('P771_65_EXPOSED_GENUINE_PUBLIC_SOURCE_SHA_EXCLUDED');
          console.log('P771_ZERO_NEW_ACTUAL_HUMAN_SIGNED_OUTFIT_PHOTO_GROUND_TRUTH');
          console.log('P771_NO_DEPLOY_NO_MISSION2_FAMILY_ALPHA_HOLD');
          NODE
