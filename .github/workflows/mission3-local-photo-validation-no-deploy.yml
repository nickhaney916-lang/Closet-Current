name: Mission 3 durable owner-local invalid JPEG cloud pause — NO DEPLOY
on:
  push:
    branches: [research/mission3-durable-local-photo-validation-20261110-HOLD]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-photo-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard exact verified owner private Storage parent, zero deployment and other missions
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=a6798941b0d47cd3cb5e4c3c297e8b5c86377282
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --exit-code "$BASE" HEAD -- public/auth.js public/app.js public/photo-import.js public/cloud-backup-engine.js supabase public/local-worker.mjs public/recognition-engine.mjs
          git diff --name-only "$BASE" HEAD | while read -r p; do
            case "$p" in
              public/cloud-backup.js|tests/mission3-durable-local-photo-validation.test.cjs|scripts/test-mission3-local-photo-validation-browser.mjs|research/mission3-local-photo-validation/REPORT.md|.github/workflows/mission3-local-photo-validation-no-deploy.yml) ;;
              *) echo "Unexpected Mission 3 local photo validation change: $p"; exit 1 ;;
            esac
          done
      - name: Install pinned genuine Chromium WebKit and fake IndexedDB test dependencies
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Reproduce verified parent endless retry of invalid and overlimit owner JPEGs
        run: |
          git worktree add --detach /tmp/closet-mission3-photo-validation-parent a6798941b0d47cd3cb5e4c3c297e8b5c86377282
          CLOUD_SOURCE_ROOT=/tmp/closet-mission3-photo-validation-parent EXPECT_BASELINE=1 node --test tests/mission3-durable-local-photo-validation.test.cjs
      - name: Verify durable blocked invalid oversized source, manual recovery and second owner
        run: node --test tests/mission3-durable-local-photo-validation.test.cjs
      - name: Build full app and execute all Node tests serially
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Real Chromium WebKit 320 390 430 invalid JPEG reload and revised photo backup
        run: node scripts/test-mission3-local-photo-validation-browser.mjs benchmark/mission3-local-photo-validation-browser
      - name: Real Chromium WebKit 320 390 430 correct owner private storage reference guards
        run: node scripts/test-mission3-owner-photo-ref-browser.mjs benchmark/mission3-photo-validation-ref-browser
      - name: Real Chromium WebKit 320 390 430 owner garment and draft guards
        run: node scripts/test-mission3-signed-owner-document-browser.mjs benchmark/mission3-photo-validation-owner-browser
      - name: Real Chromium WebKit 320 390 430 1000 original photos revision-first cloud
        run: node scripts/test-mission3-revision-first-browser.mjs benchmark/mission3-photo-validation-revision-browser
      - name: Real Chromium WebKit 320 390 430 durable 413 507 cloud recovery
        run: node scripts/test-mission3-durable-capacity-browser.mjs benchmark/mission3-photo-validation-capacity-browser
      - name: Real Chromium WebKit 320 390 430 atomic IndexedDB quota owner restore
        run: node scripts/test-mission3-device-quota-restore-browser.mjs benchmark/mission3-photo-validation-quota-browser
      - name: Real Chromium synthetic owner original and reviewed cutout backup restore
        run: |
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos commons-0002
          node scripts/test-outfit-backup-compatibility-browser.mjs benchmark/mission3-photo-validation-compat-browser
      - name: Real Chromium WebKit native photographed clothing to private closet and styling
        run: node scripts/test-native-canonical-original-167-browser.mjs
      - name: Real Chromium WebKit mobile storage recovery and accessibility
        run: node scripts/test-family-reliability-mobile.mjs
      - name: Preserve synthetic-only browser image and axe receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission3-durable-local-photo-validation-HOLD
          path: |
            benchmark/mission3-local-photo-validation-browser/
            benchmark/mission3-photo-validation-ref-browser/
            benchmark/mission3-photo-validation-owner-browser/
            benchmark/mission3-photo-validation-revision-browser/
            benchmark/mission3-photo-validation-capacity-browser/
            benchmark/mission3-photo-validation-quota-browser/
            benchmark/mission3-photo-validation-compat-browser/
            benchmark/native-canonical-closet-style-167/
            benchmark/family-reliability-mobile/
          retention-days: 14
