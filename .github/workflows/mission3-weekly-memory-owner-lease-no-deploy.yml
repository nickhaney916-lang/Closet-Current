          node --check tests/mission3-owner-visible-private-draft-retry.test.cjs
          node --check scripts/test-mission3-review-draft-retry-browser.mjs
          node --check tests/mission3-late-owner-session-capture.test.cjs
          node --check scripts/test-mission3-video-owner-switch-browser.mjs
          node --check tests/mission3-capture-operation-epoch.test.cjs
