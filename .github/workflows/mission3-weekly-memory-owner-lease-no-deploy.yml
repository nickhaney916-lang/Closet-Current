          CAMERA_SOURCE_ROOT=/tmp/closet-mission3-recognition-owner-parent EXPECT_BASELINE=1 node --test tests/mission3-recognition-session-epoch.test.cjs
          node --test tests/mission3-recognition-session-epoch.test.cjs
          mkdir -p /tmp/closet-mission3-weekly-memory-parent/public
          git show 52a45375528e18050333ece2e4936d6f7f5f6c20:public/app.js > /tmp/closet-mission3-weekly-memory-parent/public/app.js
          CAMERA_SOURCE_ROOT=/tmp/closet-mission3-weekly-memory-parent EXPECT_BASELINE=1 node --test tests/mission3-weekly-memory-owner-lease.test.cjs
