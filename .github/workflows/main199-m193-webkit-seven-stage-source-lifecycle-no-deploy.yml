name: MAIN199 M193 sustained P88 WASM real WebKit lifecycle NO DEPLOY HOLD
on:
  push:
    branches: [research/main199-m193-seven-stage-webkit-lifecycle-HOLD]
  pull_request:
    branches: [research/main193-protected-m58-m192-source-guard-HOLD]
    paths:
      - .github/workflows/main199-m193-webkit-seven-stage-source-lifecycle-no-deploy.yml
permissions:
  contents: read
jobs:
  sustained-original-model:
    name: original native P88 source no-retry ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: webkit-six-P94
            engine: webkit
          - mode: webkit-protected-M58-P96
            engine: webkit
          - mode: chromium-four-P94-control
            engine: chromium
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: ${{ matrix.engine }}
      M185_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict exact M193 cross-mission source, model and original licensed photo only
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          PARENT=902bfe31e840a4e0dca69acf98ce85eea6a4d088
          git merge-base --is-ancestor "$PARENT" HEAD
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse HEAD:scripts/test-main58-actual-p88-wasm-browser.mjs)" = 96ba2f5ee2420de52f45911881fdcc139455c353
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          test "$(git rev-parse HEAD:scripts/test-parallel96-native-highres-browser.mjs)" = 58194c1bbcfca7b46f1c71b1ee0cc00c3dbc88c7
          test "$(git rev-parse HEAD:scripts/test-main172-24mp-private-state-invariance.mjs)" = ad4cb6bfee719b6083b9abc6d11ade2551e77c58
          test "$(git rev-parse HEAD:research/parallel96-highres/source-derivative-intake96.mjs)" = 1840c4496aefc28941f4c3de24a29bac1cb5e792
          test "$(git rev-parse HEAD:public/outfit-capture.js)" = 8d55715ef09e34086d3c401ec38340bfc25f5fe8
          test "$(git rev-parse HEAD:public/native-owner-wardrobe-index-167.mjs)" = 674797958366cc976a1a4abc8073087148d22975
          test "$(git rev-parse HEAD:tests/main190-retired-duplicate-owner-index.test.mjs)" = cf9fd805e3a257378ac658b23d50a9a9339daa0c
          test "$(git rev-parse HEAD:public/native-outfit-source-plan-p99.mjs)" = 0d4972a7fddfcfae0dd811765e4a94b962f4b578
          test "$(git rev-parse HEAD:public/native-2d-preview-p99.mjs)" = 62bad171a97030846b0f1bb3bab740dec20ac5e7
          test "$(git rev-parse HEAD:public/outfit-board.js)" = b8ed5ebe18e81ec3f8f5659257289b8217a6877b
          git diff --exit-code "$PARENT" HEAD -- public/ scripts/ tests/ supabase/ benchmark/ research/parallel96-highres/
          git diff --name-only "$PARENT" HEAD | while IFS= read -r path; do
            case "$path" in
              .github/workflows/main199-m193-webkit-seven-stage-source-lifecycle-no-deploy.yml) ;;
              *) echo "M185 unreviewed source $path"; exit 1 ;;
            esac
          done
          node --check scripts/test-main58-actual-p88-wasm-browser.mjs
          node --check scripts/test-parallel94-native-p88-browser.mjs
          node --check scripts/test-parallel96-native-highres-browser.mjs
          node --check scripts/test-main172-24mp-private-state-invariance.mjs
      - name: Extract original immutable P88 donor that M58 genuinely requires (NO public app change)
        shell: bash
        run: |
          set -euo pipefail
          P88=cc4554ef0104506a72bf0a28423fee52b6e4fff2
          git cat-file -e "$P88^{commit}"
          test "$(git rev-parse "$P88:public/outfit-worker.mjs")" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse "$P88:public/outfit-segmentation.mjs")" = d357955dd8fdab7c0cb727ea597c270edd9309ac
          test "$(git rev-parse "$P88:public/outfit-instance-review-840.mjs")" = 6324d8eda33024f166311f424392ed83363e4942
          mkdir -p .m57-exact-p88-donor/public
          for file in outfit-worker.mjs outfit-segmentation.mjs outfit-instance-review-840.mjs photo-color.js; do
            git show "$P88:public/$file" > ".m57-exact-p88-donor/public/$file"
            test "$(git hash-object ".m57-exact-p88-donor/public/$file")" = "$(git rev-parse "$P88:public/$file")"
          done
          test "$(git hash-object .m57-exact-p88-donor/public/outfit-worker.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          echo 'M185_EXACT_P88_DONOR_PREPARED sourceOnly=true publicAppUnchanged=true'
      - name: Install exact same native browser and runtime as protected M58
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Six fresh real WASM WebKit processes and Chromium control; stop on FIRST red
        shell: bash
        run: |
          set -euo pipefail
          # Each child starts a fresh real browser, loads original licensed
          # public JPEG, runs unchanged model in the native signed-local app,
          # verifies owner/source, and must produce 1..12 genuine proposals.
          # Never retry, skip, forge proposals or turn a negative into success.
          case "$M185_MODE" in
            webkit-six-P94) total=6 ;;
            webkit-protected-M58-P96) total=7 ;;
            chromium-four-P94-control) total=4 ;;
            *) echo 'Invalid M185 matrix'; exit 2 ;;
          esac
          echo "M185_SOURCE_PINNED_BEGIN engine=$M58_ENGINE mode=$M185_MODE total=$total"
          for i in $(seq 1 "$total"); do
            # M185 exact-source protected M58 regression order:
            # exact protected failing job: M58, P94 320/390/430, then
            # P96 upscaled 4K, P96 actual original 24MP, THEN unchanged
            # M172 independently protects all private items/state at 24MP.
            # The historical genuine zero-proposal worker error happened
            # INSIDE M172 (the seventh source-model run), not in P96 #5/#6.
            unset P96_NATIVE_4K || true
            if [ "$M185_MODE" = webkit-protected-M58-P96 ]; then
              case "$i" in
                1) harness=scripts/test-main58-actual-p88-wasm-browser.mjs ;;
                2) harness=scripts/test-parallel94-native-p88-browser.mjs; export P94_WIDTH=320 ;;
                3) harness=scripts/test-parallel94-native-p88-browser.mjs; export P94_WIDTH=390 ;;
                4) harness=scripts/test-parallel94-native-p88-browser.mjs; export P94_WIDTH=430 ;;
                5) harness=scripts/test-parallel96-native-highres-browser.mjs; export P94_WIDTH=390 ;;
                6) harness=scripts/test-parallel96-native-highres-browser.mjs; export P94_WIDTH=390; export P96_NATIVE_4K=true ;;
                7) harness=scripts/test-main172-24mp-private-state-invariance.mjs; export P94_WIDTH=390; export P96_NATIVE_4K=true ;;
              esac
            else
              harness=scripts/test-parallel94-native-p88-browser.mjs
            fi
            echo "M185_REAL_MODEL_ATTEMPT_BEGIN engine=$M58_ENGINE mode=$M185_MODE step=$i of=$total harness=$harness"
            # IMPORTANT: unmodified original harness failure immediately RED
            node "$harness"
            mem=unavailable
            if [ -r /sys/fs/cgroup/memory.current ]; then mem="$(cat /sys/fs/cgroup/memory.current)"; fi
            peak=unavailable
            if [ -r /sys/fs/cgroup/memory.peak ]; then peak="$(cat /sys/fs/cgroup/memory.peak)"; fi
            echo "M185_REAL_MODEL_ATTEMPT_PASS engine=$M58_ENGINE mode=$M185_MODE step=$i cgroup_current_bytes=$mem cgroup_peak_bytes=$peak"
          done
          echo "M185_ALL_ACTUAL_MODEL_ATTEMPTS_PASSED engine=$M58_ENGINE mode=$M185_MODE total=$total noRetries=true noFakeMasks=true familyAlpha=HOLD"
