name: MAIN244 original pinned SegFormer native WASM growth attribution HOLD
on:
  push:
    branches: [research/main244-original-wasm-grow-attribution-HOLD]
  pull_request:
    branches: [research/main243-original-segformer-native-heap-witness-HOLD]
permissions:
  contents: read
jobs:
  original-source-security:
    name: M244 immutable original source and full inherited security
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Four added research-only paths and original consumer Worker immutable
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=28f2d823d40b5fb27236b8a10330cb96d9e65614
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE" HEAD)" = "$(printf '%s\n' \
            '.github/workflows/main244-original-wasm-grow-attribution-HOLD.yml' \
            'scripts/main244-native-wasm-growth-attribution.mjs' \
            'scripts/test-main244-original-wasm-grow-attribution-browser.mjs' \
            'tests/main244-original-wasm-growth-accounting.test.mjs')"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-main243-original-segformer-native-session-browser.mjs)" = fdfb979ca3783cb362cb5eb909612902af0c3b70
          node --check scripts/main244-native-wasm-growth-attribution.mjs
          node --check scripts/test-main244-original-wasm-grow-attribution-browser.mjs
          node --test tests/main244-original-wasm-growth-accounting.test.mjs
          M244_SOURCE_ONLY=1 node scripts/test-main244-original-wasm-grow-attribution-browser.mjs
      - name: Install exact pinned ORT, original model and app test dependencies
        run: npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Original offline application build and entire inherited Node regression
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  native-original:
    name: M244 original SegFormer actual native growth ${{ matrix.engine }} ${{ matrix.arm }}
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, chromium]
        arm: [baseline, pattern_off]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M243_${{ matrix.engine }}: ${{ matrix.engine }}
      M243_PATTERN_${{ matrix.arm }}: ${{ matrix.arm }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact original graph/source/Worker and M244 focused safety tests
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 28f2d823d40b5fb27236b8a10330cb96d9e65614 HEAD
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          node --test tests/main244-original-wasm-growth-accounting.test.mjs
      - name: Install exact pinned original ONNX model runtime and browser dependencies
        run: npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Original pinned native model A/B and no fabricated success
        shell: bash
        run: |
          set -euo pipefail
          M244_SOURCE_ONLY=1 node scripts/test-main244-original-wasm-grow-attribution-browser.mjs
          node scripts/test-main244-original-wasm-grow-attribution-browser.mjs
