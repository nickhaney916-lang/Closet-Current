name: Main1054 pending photo removal acceptance HOLD
on:
  pull_request:
    branches: [research/main1054-photo-review-pending-HOLD]
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'research/main1054-photo-review-remove-pending-HOLD' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lane: [chromium, webkit, regression]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact correction source, accepted base and isolated acceptance scope
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          base=25863e9c0b5189fa7eebc629cbe736b123c81b52
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$PR_BASE" = "$base"
          test "$(git rev-parse HEAD^)" = efa5cd124fa6b60631bb2423e6010e2b063d070c
          test "$(git rev-parse HEAD^^)" = d8a5fdd5f73536ebc9abd8f8d0b0ba600c06d03f
          test "$(git rev-parse HEAD^^^)" = "$base"
          printf '%s\n' '.github/workflows/main1054-photo-review-remove-pending-HOLD.yml' 'public/app.js' 'scripts/main1054-photo-review-remove-pending-browser.mjs' > "$RUNNER_TEMP/expected-paths"
          git diff --name-only "$base" HEAD > "$RUNNER_TEMP/actual-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
          git log -1 --format='tested commit %H tree %T'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: node scripts/build.mjs
      - if: matrix.lane == 'regression'
        run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
      - if: matrix.lane != 'regression'
        env:
          BROWSER_ENGINE: ${{ matrix.lane }}
        run: |
          npx playwright install --with-deps "$BROWSER_ENGINE"
          git show 25863e9c0b5189fa7eebc629cbe736b123c81b52:public/app.js > "$RUNNER_TEMP/base-app.js"
          node scripts/main1054-photo-review-remove-pending-browser.mjs "$BROWSER_ENGINE" "$RUNNER_TEMP/base-app.js" baseline
          node scripts/main1054-photo-review-remove-pending-browser.mjs "$BROWSER_ENGINE"
          node scripts/main1054-photo-review-pending-browser.mjs "$BROWSER_ENGINE"
          node scripts/main1054-saved-editor-pending-browser.mjs "$BROWSER_ENGINE"
