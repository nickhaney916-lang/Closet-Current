name: Main1054 cumulative native owner recovery HOLD
on:
  pull_request:
    branches:
      - '**'
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'research/main1054-1736-cumulative-runtime-HOLD'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        lane: [chromium, webkit, regression]
    env:
      CANDIDATE: bd1df1b2a5dfaf4563e0b945a1601161e3abd341
      ENGINE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate and workflow-only scope
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD^)" = "$CANDIDATE"
          test "$(git rev-parse "$CANDIDATE^{tree}")" = 1e65da2cf0fc93f2a7453e2259a92eaebeabcb8e
          test "$(git diff --name-only "$CANDIDATE" HEAD)" = ".github/workflows/main1054-1736-cumulative-runtime-HOLD.yml"
          git log -1 --format='commit %H tree %T'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: node scripts/build.mjs
      - if: matrix.lane == 'regression'
        run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
      - if: matrix.lane != 'regression'
        run: npx playwright install --with-deps "$ENGINE"
      - name: Normal capture, review, original-photo outfit, restore and owner isolation
        if: matrix.lane != 'regression'
        run: |
          for width in 320 390 430; do
            P1607_AUDIT=1 P99_ENGINE="$ENGINE" P99_WIDTH="$width" node scripts/test-parallel99-normal-app-browser.mjs
            if [ "$ENGINE" = webkit ]; then
              P1607_AUDIT=1 P1607_CACHE_ONLY=1 P99_ENGINE="$ENGINE" P99_WIDTH="$width" node scripts/test-parallel99-normal-app-browser.mjs
            fi
          done
      - name: Retain journey evidence
        if: always() && matrix.lane != 'regression'
        uses: actions/upload-artifact@v4
        with:
          name: cumulative-runtime-${{ matrix.lane }}
          path: benchmark/parallel99-normal-journey/*/*/P99-NORMAL-APP*.json
          if-no-files-found: ignore
