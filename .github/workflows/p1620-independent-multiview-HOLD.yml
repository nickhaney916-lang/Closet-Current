name: P1620 independent multiview HOLD
on:
  push:
    branches: [research/p1620-independent-multiview-HOLD]
  pull_request:
    branches: [research/m2-category-volume-profile-20261123-HOLD]
    paths: [.github/workflows/p1620-independent-multiview-HOLD.yml]
permissions:
  contents: read
env:
  BASELINE: 6f20d8d0bff7ed0d7e2fd24622033310271c46c0
jobs:
  verify:
    if: github.event_name == 'push' || (github.head_ref == 'research/p1620-independent-multiview-HOLD' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [regression, custody, browser]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact generator, dependency and photo fixture scope
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASELINE" HEAD
          git diff --exit-code "$BASELINE" HEAD -- . \
            ':(exclude)research/p1620-multiview/**' \
            ':(exclude)scripts/run-p1620-held-out.mjs' \
            ':(exclude)scripts/test-p1620-multiview-browser.mjs' \
            ':(exclude)tests/p1620-multiview.test.mjs' \
            ':(exclude).github/workflows/p1620-independent-multiview-HOLD.yml'
          git log -1 --format='commit %H tree %T'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 playwright@1.56.1 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - if: matrix.check == 'regression'
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - if: matrix.check == 'custody'
        run: node scripts/run-p1620-held-out.mjs "${RUNNER_TEMP}/p1620-media" "${RUNNER_TEMP}/p1620-held-out.json" --download
      - if: matrix.check == 'browser'
        run: npx playwright install --with-deps chromium webkit
      - if: matrix.check == 'browser'
        run: node scripts/test-p1620-multiview-browser.mjs "${RUNNER_TEMP}/p1620-projections.json"
