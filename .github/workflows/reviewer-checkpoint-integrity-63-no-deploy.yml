name: REVIEW63 source-bound human reviewer checkpoint resume NO DEPLOY
on:
  push:
    branches:
      - research/reviewer-checkpoint-integrity-63-main-20261105-HOLD
  pull_request:
    paths:
      - 'research/reviewer-checkpoint-integrity-63/**'
      - 'research/independent-annotation-61/review.html'
      - 'scripts/test-blinded-human-review-61-browser.mjs'
      - 'scripts/audit-blinded-human-review-61-browser.mjs'
      - 'tests/reviewer-checkpoint-integrity-63.test.mjs'
      - '.github/workflows/reviewer-checkpoint-integrity-63-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-photo-local-checkpoint-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce exact verified BLIND61 parent and strict no production/staging changed-files scope
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor aa45e0df890bdd405e4a494bed8941bb1731d761 HEAD
          git diff --name-only aa45e0df890bdd405e4a494bed8941bb1731d761 HEAD > /tmp/review63-file-scope
          while IFS= read -r path; do
            case "$path" in
              research/reviewer-checkpoint-integrity-63/*|research/independent-annotation-61/review.html|scripts/test-blinded-human-review-61-browser.mjs|scripts/audit-blinded-human-review-61-browser.mjs|tests/reviewer-checkpoint-integrity-63.test.mjs|.github/workflows/reviewer-checkpoint-integrity-63-no-deploy.yml) ;;
              *) echo "BLOCKED production/staging/other-project edit: $path"; exit 1 ;;
            esac
          done < /tmp/review63-file-scope
      - name: Install exact test runtime dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Build app and pass entire inherited Node plus adversarial source-SHA resume policy tests
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Reverify 59 actual licensed JPEGs, no invented independent human labels
        run: |
          node scripts/audit-recognition-ground-truth-60.mjs
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const a=JSON.parse(readFileSync("benchmark/recognition-ground-truth-gate-60/acceptance-report.json","utf8"));
            if(a.scientificVerdict!=="NEEDS_REWORK"||a.releaseAuthorized!==false||
               a.photoEvidence.sha256Verified!==59||a.counts.independentlyAdjudicated!==0)
             throw Error("REVIEW63 cannot claim independent real human accuracy");
          '
      - name: Build two genuine original source SHA-blinded reviewer packets without predictions
        run: node scripts/build-blinded-human-review-61.mjs
      - name: Six original BLIND61 real offline reviewer UI Chromium/WebKit 320/390/430 regressions
        run: node scripts/test-blinded-human-review-61-browser.mjs
      - name: SHA audit inherited 18 actual blind reviewer photos/screenshots
        run: node scripts/audit-blinded-human-review-61-browser.mjs
      - name: Six new real offline source-photo export → reload → resume → tamper rejection → A/B isolation cases
        run: REVIEW63=1 node scripts/test-blinded-human-review-61-browser.mjs
      - name: Audit 30 real mobile JPEG reviewer checkpoint screenshots dimensions and SHA
        run: REVIEW63=1 node scripts/audit-blinded-human-review-61-browser.mjs
      - name: Six owner-private original-JPEG camera→closet→outfit→duplicate→backup/restore browser regressions
        run: node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Archive sanitized no-human-label evidence and 48 real UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: REVIEW63-local-resume-identity-SHA-real-mobile-HOLD
          path: |
            benchmark/independent-annotation-61/packet-A.json
            benchmark/independent-annotation-61/packet-B.json
            benchmark/independent-annotation-61/packet-audit.json
            benchmark/independent-annotation-61/browser-evidence/acceptance.json
            benchmark/reviewer-checkpoint-integrity-63/browser-evidence/acceptance.json
            benchmark/reviewer-checkpoint-integrity-63/browser-evidence/*.png
            benchmark/recognition-ground-truth-gate-60/acceptance-report.json
            benchmark/multi-garment-capture-01/acceptance.json
          if-no-files-found: warn
          retention-days: 14
