name: SOURCE72 exact same original JPEG owner review protection NO DEPLOY
on:
  push:
    branches:
      - research/same-original-photo-review-72-main-20261105-HOLD
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repeat-original-photo-preserves-reviewed-private-clothing:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Lock exact RACE71 parent and block every unrelated production or staging file
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 01685cac09a1cc3776f0d2018b92594b4887c84c HEAD
          git diff --name-only 01685cac09a1cc3776f0d2018b92594b4887c84c HEAD >/tmp/source72-files
          while IFS= read -r path; do
            case "$path" in
              research/same-original-photo-review-72/repeat-source-guard.mjs|research/multi-garment-capture-01/review-ui.mjs|scripts/test-multi-garment-capture-01-browser.mjs|scripts/audit-same-original-photo-review-72-browser.mjs|tests/same-original-photo-review-72.test.mjs|.github/workflows/same-original-photo-review-72-no-deploy.yml) ;;
              *) echo "BLOCKED unrelated production/staging modification: $path"; exit 1 ;;
            esac
          done </tmp/source72-files
      - name: Install pinned research-only testing dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Build and test complete inherited Node suite plus SOURCE72 regression
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Six inherited real licensed-original mobile-browser workflows
        run: node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Six real original licensed-JPEG same-photo review protection mobile browsers
        run: SOURCE72=1 node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Verify six source-preservation private E2E receipts and 90 real screenshots
        run: node scripts/audit-same-original-photo-review-72-browser.mjs
      - name: Archive sanitized screenshot and acceptance proof only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SOURCE72-same-exact-JPEG-cannot-clear-human-review-HOLD
          path: |
            benchmark/same-original-photo-review-72/acceptance.json
            benchmark/same-original-photo-review-72/*.png
          if-no-files-found: warn
          retention-days: 14
