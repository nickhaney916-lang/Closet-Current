name: P181 restored original JPEG source receipt integrity NO DEPLOY
on:
  push:
    branches:
      - research/cloud-3d-source-receipt-integrity-181-main-20261108-HOLD
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-parent-scope-and-full-node:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify independent P180 exact parent and strict P181 no-deploy allowlist
        run: |
          set -eu
          BASE=00bea4ea25baa057471336b59a50eea6707997b3
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          FIRST="$(git rev-list --reverse "$BASE..HEAD" | head -n1)"
          test "$(git rev-parse "$FIRST^")" = "$BASE"
          git diff --name-only "$BASE" HEAD >/tmp/p181-changes
          while IFS= read -r p; do
            case "$p" in
              research/cloud-to-native-3d-180/owner-restore-3d-barrier.mjs|tests/atomic-cloud-to-native-3d-180.test.mjs|tests/cloud-3d-source-receipt-integrity-181.test.mjs|research/cloud-3d-source-receipt-integrity-181/REPORT.md|.github/workflows/cloud-3d-source-receipt-integrity-181-no-deploy.yml) ;;
              *) echo "P181 refused out-of-scope modification $p"; exit 1 ;;
            esac
          done </tmp/p181-changes
          test "$(wc -l </tmp/p181-changes)" -eq 5
          git diff --exit-code "$BASE" HEAD -- public supabase migrations package.json package-lock.json research/native-consumer-board-04 research/native-3d-05 research/hosted-two-owner-original-cutout-179 research/native-owner-reviewed-cloud-ui-146 scripts
          node --check research/cloud-to-native-3d-180/owner-restore-3d-barrier.mjs
          node --check tests/atomic-cloud-to-native-3d-180.test.mjs
          node --check tests/cloud-3d-source-receipt-integrity-181.test.mjs
      - name: Install pinned CI-only dependencies without modifying lockfile
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: P181 targeted adversarial source SHA owner and epoch race checks
        run: node --test tests/cloud-3d-source-receipt-integrity-181.test.mjs tests/atomic-cloud-to-native-3d-180.test.mjs
      - name: Whole existing Closet Current inherited Node regression and build
        run: |
          node scripts/build.mjs
          node --test tests/*.cjs tests/*.mjs
  genuine-browser-regression-after-restored-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      ARTIFACT_DIR: benchmark/atomic-cloud-to-native-3d-180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned isolated browser dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Build current unchanged consumer and pinned actual 163-bone donor
        run: |
          set -eu
          node scripts/build.mjs
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          git worktree add --detach .native05-donor-541 df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          git config --global --add safe.directory "$GITHUB_WORKSPACE/.native05-donor-541"
          ln -s ../node_modules .native05-donor-541/node_modules
          cd .native05-donor-541
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
          test -f benchmark/work47/manifest.json
      - name: Real Chromium/WebKit owner original+cutout atomic restore and 163-bone native viewer
        run: node scripts/test-atomic-cloud-to-native-3d-180-browser.mjs
      - name: Independently check 42 real SHA images and full six-case mobile record
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const root='benchmark/atomic-cloud-to-native-3d-180/';
          const r=JSON.parse(readFileSync(root+'results.json','utf8'));
          assert.equal(r.priority,180);
          assert.equal(r.actualRestoredCloudOriginal163BoneWebGL,true);
          assert.equal(r.realCloudTouched,false);
          assert.equal(r.liveSignedJWTVerified,false);
          assert.equal(r.cases.length,6);
          assert.equal(r.screenshots.length,42);
          assert.deepEqual(r.chromium3DWidths,[320,390,430]);
          assert.ok(r.cases.every(x=>x.actualAtomicRestore&&x.p178OwnerSHAAndAtomicCloudVerified&&x.syntheticOtherOwnerDenied&&x.familyAlpha==='HOLD'));
          for(const shot of r.screenshots){
            const raw=readFileSync(root+shot.name);
            assert.equal(createHash('sha256').update(raw).digest('hex'),shot.sha256);
            assert.equal(raw.readUInt32BE(16),shot.width);
          }
          console.log('P181_RECOVERED_OWNER_JPEG_SOURCE_RECEIPT_INTEGRITY_42_REAL_MOBILE_SCREENSHOTS_PASS');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P181-original-owner-double-JPEG-163bone-42-actual-browser-screens-HOLD
          path: benchmark/atomic-cloud-to-native-3d-180/
          retention-days: 14
          if-no-files-found: warn
