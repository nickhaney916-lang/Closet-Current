name: P154 original-head sampled facial nose lips and eyelids genuine WebGL NO DEPLOY
on:
  push:
    branches: [research/dual-humanoid-facial-contours-154-main-20261107-HOLD]
  pull_request:
    branches: [research/dual-humanoid-head-hair-153-main-20261107-HOLD]
    paths:
      - research/dual-humanoid-facial-contours-154/**
      - scripts/install-dual-humanoid-facial-contours-154.mjs
      - scripts/audit-dual-humanoid-facial-contours-154.mjs
      - tests/dual-humanoid-facial-contours-154.test.mjs
      - .github/workflows/dual-humanoid-facial-contours-154-no-deploy.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-original-P153-source-and-complete-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact verified parent P153 and precisely six research files only
        run: |
          BASE=d9b554207b0cc082d74b4c4741549cc495405553
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          FIRST="$(git rev-list --reverse "$BASE..HEAD" | head -n1)"
          test "$(git rev-parse "$FIRST^")" = "$BASE"
          git diff --name-only "$BASE" HEAD >/tmp/p154-files
          while IFS= read -r p; do
            case "$p" in
              research/dual-humanoid-facial-contours-154/face-contours.mjs|research/dual-humanoid-facial-contours-154/REPORT.md|scripts/install-dual-humanoid-facial-contours-154.mjs|scripts/audit-dual-humanoid-facial-contours-154.mjs|tests/dual-humanoid-facial-contours-154.test.mjs|.github/workflows/dual-humanoid-facial-contours-154-no-deploy.yml) ;;
              *) echo "P154 REFUSE unintended app/other research or production change: $p"; exit 1 ;;
            esac
          done </tmp/p154-files
          test "$(wc -l </tmp/p154-files)" -eq 6
          git diff --exit-code "$BASE" HEAD -- public supabase package.json package-lock.json research/dual-humanoid-head-hair-153 research/dual-humanoid-visible-skin-152 research/dual-humanoid-photorealistic-integration-150 research/dual-humanoid-face-definition-131
      - name: Pinned temporary test dependencies; app dependency lockfile untouched
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Syntax plus source face negative tests at exact SHA
        run: |
          node --check research/dual-humanoid-facial-contours-154/face-contours.mjs
          node --check scripts/install-dual-humanoid-facial-contours-154.mjs
          node --check scripts/audit-dual-humanoid-facial-contours-154.mjs
          node --test tests/dual-humanoid-facial-contours-154.test.mjs
      - name: No shipping app change, full inherited tests and original native build
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
  true-original-P153-source-face-36-matched-3d-mobile-views:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned browser and original source 3D geometry research dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Rebuild exact P150 source, P152 body-skin fix and P153 actual source-scalp hair in isolated 163-bone donor
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          P150=6e576da9d7ff6a0a439a7762cf333670d20f0131
          P118=672247f7121e92bba32b81cec74efddb2b69c817
          P541=df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          git fetch --no-tags origin "$P150" "$P118" "$P541"
          git worktree add --detach .p150-donor-541 "$P541"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/.p150-donor-541"
          test "$(git -C .p150-donor-541 rev-parse HEAD)" = "$P541"
          ln -s ../node_modules .p150-donor-541/node_modules
          cd .p150-donor-541
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
          mkdir -p research/dual-humanoid-photorealism-118
          git -C .. show "$P118":scripts/install-dual-humanoid-realism-118.mjs > scripts/install-dual-humanoid-realism-118.mjs
          cd ..
          for path in research/dual-humanoid-photorealism-118/realism.mjs research/dual-humanoid-face-definition-131/face-definition.mjs research/dual-humanoid-photorealistic-integration-150/apply-humanoid.mjs scripts/install-dual-humanoid-face-131.mjs scripts/install-dual-humanoid-photorealistic-integration-150.mjs; do
            test ! -e "$path"
            mkdir -p "$(dirname "$path")"
            git show "$P150:$path" > "$path"
          done
          git show "$P150:scripts/test-native-3d-05-browser.mjs" > scripts/test-native-3d-05-p150-154.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const file='scripts/test-native-3d-05-p150-154.mjs';
          let s=readFileSync(file,'utf8');
          const anchor='prunedHairStrands:overlay.skinHair.prunedHairStrands,';
          assert.equal(s.split(anchor).length,2,'P154 pinned native WebGL snapshot evidence anchor mismatch');
          s=s.replace(anchor,anchor+
           'headHairMeshCount153:overlay.headHair153?.hairMeshes||0,'+
           'faceContourMeshCount154:overlay.faceContours154?.contourMeshes||0,'+
           'originalSourceBodyUnmodified154:overlay.faceContours154?.changedOriginalHead===false,');
          writeFileSync(file,s);
          NODE
          node .p150-donor-541/scripts/install-dual-humanoid-realism-118.mjs .p150-donor-541
          node scripts/install-dual-humanoid-face-131.mjs .p150-donor-541
          node scripts/install-dual-humanoid-photorealistic-integration-150.mjs .p150-donor-541
          node scripts/install-dual-humanoid-visible-skin-152.mjs .p150-donor-541
          node scripts/install-dual-humanoid-head-hair-153.mjs .p150-donor-541
          node --check scripts/test-native-3d-05-p150-154.mjs
          test "$(git -C .p150-donor-541 rev-parse HEAD)" = "$P541"
          ln -s .p150-donor-541 .native05-donor-541
      - name: BEFORE - genuine original-owner saved photo dress and P153 source-hair face in real Chromium at 320 390 and 430
        run: |
          P150=1 node scripts/test-native-3d-05-p150-154.mjs
          mkdir -p benchmark/dual-humanoid-facial-contours-154/before
          cp benchmark/dual-humanoid-photorealistic-integration-150/*.png benchmark/dual-humanoid-facial-contours-154/before/
          cp benchmark/dual-humanoid-photorealistic-integration-150/screens-*.json benchmark/dual-humanoid-facial-contours-154/before/
          cp benchmark/native-3d-05/results.json benchmark/dual-humanoid-facial-contours-154/before/native-result.json
          test "$(find benchmark/dual-humanoid-facial-contours-154/before -name '*.png' | wc -l)" -eq 18
      - name: Apply only original source-skin local sampled nose/lip/under-eye facets to isolated donor
        run: |
          node scripts/install-dual-humanoid-facial-contours-154.mjs .p150-donor-541
          node --check .p150-donor-541/research/dual-humanoid-facial-contours-154/face-contours.mjs
          node --check .p150-donor-541/research/dual-humanoid-photorealistic-integration-150/apply-humanoid.mjs
          test "$(git -C .p150-donor-541 rev-parse HEAD)" = df6885d6011cb33fb22dceb81a08f35a0ac4dd61
      - name: AFTER - same source photo outfit, both male/female heads and unchanged P131 eyes P153 hair
        run: |
          P150=1 node scripts/test-native-3d-05-p150-154.mjs
          mkdir -p benchmark/dual-humanoid-facial-contours-154/after
          cp benchmark/dual-humanoid-photorealistic-integration-150/*.png benchmark/dual-humanoid-facial-contours-154/after/
          cp benchmark/dual-humanoid-photorealistic-integration-150/screens-*.json benchmark/dual-humanoid-facial-contours-154/after/
          cp benchmark/native-3d-05/results.json benchmark/dual-humanoid-facial-contours-154/after/native-result.json
          test "$(find benchmark/dual-humanoid-facial-contours-154/after -name '*.png' | wc -l)" -eq 18
      - name: Ensure face still renders genuine CC0 163-bone WebGL under WebKit across all mobile widths
        run: |
          P150=1 P150_BROWSER=webkit node scripts/test-native-3d-05-p150-154.mjs
          cp benchmark/native-3d-05/results.json benchmark/dual-humanoid-facial-contours-154/after/native-webkit-result.json
      - name: Independently inspect 36 exact photographed-outfit mobile screenshots and reject missing source face
        run: node scripts/audit-dual-humanoid-facial-contours-154.mjs
      - name: Preserve human photorealism unverified, strict owner/photo hold and 36 actual screenshot attestation
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const x=JSON.parse(readFileSync('benchmark/dual-humanoid-facial-contours-154/audit/acceptance.json','utf8'));
          assert.equal(x.actualChromiumMatchedBeforeAfterPairs,18);
          assert.equal(x.SHA256VerifiedOriginalScreenshots,36);
          assert.equal(x.actualWebKitModelCases,3);
          assert.equal(x.savedOutfitSourceAndGarmentMeshCountsUnchanged,true);
          assert.equal(x.independentHumanRealismApproved,false);
          assert.equal(x.releaseAuthorized,false);
          assert.equal(x.familyAlpha,'HOLD');
          console.log('P154 original source face overlay rendered and audited; NO independent human photorealism approval, Family Alpha HOLD');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P154-source-face-nose-lips-36-genuine-WebGL-mobile-views-HOLD-NO-DEPLOY
          path: |
            research/dual-humanoid-facial-contours-154/REPORT.md
            benchmark/dual-humanoid-facial-contours-154/before/*.png
            benchmark/dual-humanoid-facial-contours-154/before/screens-*.json
            benchmark/dual-humanoid-facial-contours-154/after/*.png
            benchmark/dual-humanoid-facial-contours-154/after/screens-*.json
            benchmark/dual-humanoid-facial-contours-154/audit/acceptance.json
            benchmark/dual-humanoid-facial-contours-154/after/native-*.json
          if-no-files-found: warn
          retention-days: 14
