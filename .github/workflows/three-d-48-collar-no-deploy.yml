name: 3D-48 original-photo sewn neckline and mobile WebGL QA (DRAFT HOLD NO DEPLOY)
on:
  pull_request:
    paths:
      - 'research/three-d-48/**'
      - 'research/three-d-15/outfit-controller.mjs'
      - 'research/three-d-15/showroom.mjs'
      - 'research/three-d-31/photo-jeans-demo.mjs'
      - 'research/three-d-37/second-jeans-demo.mjs'
      - 'scripts/test-three-d-48-collar-browser.mjs'
      - 'tests/three-d-48-collar-roll.test.mjs'
      - '.github/workflows/three-d-48-collar-no-deploy.yml'
permissions:
  contents: read
jobs:
  source-true-independent-neckline:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Exact tested PR455 parent and no deployment or production paths
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 95f59cd0b3383f20e34e39cf54457791d701938d HEAD
          git diff --name-only 95f59cd0b3383f20e34e39cf54457791d701938d HEAD | while IFS= read -r f; do
            case "$f" in
              research/three-d-48/*|research/three-d-15/outfit-controller.mjs|research/three-d-15/showroom.mjs|research/three-d-31/photo-jeans-demo.mjs|research/three-d-37/second-jeans-demo.mjs|scripts/test-three-d-48-collar-browser.mjs|tests/three-d-48-collar-roll.test.mjs|.github/workflows/three-d-48-collar-no-deploy.yml) ;;
              *) echo "OUT OF SCOPE: $f"; exit 1 ;;
            esac
          done
      - name: Install pinned no-billed-token local original-photo tooling
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 three@0.180.0 playwright@1.56.1 three-mesh-bvh@0.9.2
      - name: Recreate exact original photo proposals, original anatomies and licensed clothing
        run: |
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node --test tests/three-d-31-jeans-source.test.mjs tests/three-d-37-source-true.test.mjs
          git fetch --no-tags origin 53f2ad344dc56a1477e343531c423aed0e66c17d dd6bac3fa9ff640d4f562cf925337440bdb5cf8f 3a572193987cb29389727426136c6eb3ac326783 dfb40889c4c1221fb1833b859e8a11ef38aeb76e
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
      - name: Existing actual independent original-cloth torso/caps test
        run: |
          node --test tests/three-d-45-independent-caps.test.mjs
          node --test tests/three-d-46-shoulder-contour.test.mjs
          node --test tests/three-d-47-upper-arm-volume.test.mjs
      - name: Real original photo collar: unchanged outer seam / protected source fields / male female / posed triangles
        run: |
          node --test tests/three-d-22-neckline.test.mjs tests/three-d-48-collar-roll.test.mjs
      - name: Existing source-photo/jeans/caps and intermediate poses actual triangle audit
        run: node scripts/audit-three-d-47-upper-arm-volume.mjs
      - name: Original photo WebGL source-neutral collar A B at 320 390 430 and male female
        run: node scripts/test-three-d-48-collar-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: THREE-D-48-SOURCE-COLLAR-FOLD-REAL-WEBGL-DRAFT-HOLD
          path: |
            benchmark/three-d-48/
            benchmark/three-d-47/intermediate-triangle-audit.json
            benchmark/three-d-37/metrics.json
            benchmark/three-d-31/metrics.json
          if-no-files-found: warn
