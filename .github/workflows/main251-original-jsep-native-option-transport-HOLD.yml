name: MAIN251 exact original JSEP native option ABI transport HOLD
on:
  push:
    branches: [research/main251-original-jsep-native-option-transport-HOLD]
permissions:
  contents: read
jobs:
  original-source-and-all-node:
    name: M251 original app/source/privacy + true pinned JSEP ABI refusal tests
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen original base, protected files and exactly FOUR added research paths
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=f85aa3eda38c5be2eb3762c296504f9f45e3c11a
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE" HEAD)" = "$(printf '%s\n' \
            '.github/workflows/main251-original-jsep-native-option-transport-HOLD.yml' \
            'scripts/main251-original-jsep-abi-probe.mjs' \
            'scripts/test-main251-original-jsep-native-option-browser.mjs' \
            'tests/main251-original-jsep-native-option-abi.test.mjs')"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-main247-real-p94-jsep-model-heap-browser.mjs)" = 92670c115a42f6408577de4d08d8dea24c263cd2
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          node --check scripts/main251-original-jsep-abi-probe.mjs
          node --check scripts/test-main251-original-jsep-native-option-browser.mjs
          node --check tests/main251-original-jsep-native-option-abi.test.mjs
      - name: Install exact original Transformers and ORT public JSEP model dependencies
        run: npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Inspect exact pinned JSEP public native export and run adversarial source-only tests
        shell: bash
        run: |
          set -euo pipefail
          node scripts/main251-original-jsep-abi-probe.mjs
          node --test tests/main251-original-jsep-native-option-abi.test.mjs
      - name: Full original offline application build and inherited private-owner photo/security/backup Node regression
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  native-original-jsep-real-browser:
    name: M251 real ${{ matrix.engine }} original P94 native JSEP ABI ${{ matrix.arm }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - {engine: webkit, arm: baseline}
          - {engine: webkit, arm: pattern_off}
          - {engine: chromium, arm: baseline}
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M247_ENGINE: ${{ matrix.engine }}
      M251_ARM: ${{ matrix.arm }}
      M247_SOURCE_ONLY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original consumer and genuine source/owner browser immutable
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-main247-real-p94-jsep-model-heap-browser.mjs)" = 92670c115a42f6408577de4d08d8dea24c263cd2
          node --check scripts/test-main251-original-jsep-native-option-browser.mjs
      - name: Pinned genuine native browser runtime and model dependencies
        run: npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Native original JSEP WASM options, original SegFormer and private source-photo 2D/v4 owner
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-main251-original-jsep-native-option-browser.mjs
