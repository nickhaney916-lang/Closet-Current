name: PHOTO-CLOTH-FIT-REALISM-90 real photographed garment visual acceptance NO DEPLOY
on:
  push:
    branches:
      - research/photo-cloth-fit-realism-90-work-HOLD
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-bound-clothing-fit-webgl-mobile-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact #89 ancestry and research-only file scope
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=e6c2ef87499b354bc8440bfdc9ab3a92980f92f0
          git merge-base --is-ancestor "$BASE" HEAD
          FIRST=$(git rev-list --reverse "$BASE..HEAD" | head -n1)
          test "$(git rev-parse "$FIRST^")" = "$BASE"
          git diff --name-only "$BASE" HEAD > /tmp/photo90-paths
          while IFS= read -r p; do
            case "$p" in
              .github/workflows/photo-cloth-fit-realism-90-no-deploy.yml|research/photo-cloth-fit-realism-90/REPORT.md|research/photo-cloth-fit-realism-90/source-manifest.json|research/photo-cloth-fit-realism-90/add-45-degree-knee-acceptance.patch|scripts/audit-photo-cloth-fit-realism-90.mjs|tests/photo-cloth-fit-realism-90.test.mjs) ;;
              *) echo "BLOCKED non-research change: $p"; exit 1 ;;
            esac
          done </tmp/photo90-paths
          test -s /tmp/photo90-paths
          test "$(cat /tmp/photo90-paths | wc -l)" -eq 6
      - name: Install pinned test-only WebGL and image auditor dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Build and run all inherited #89 Node regressions
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Fetch and pin exact unchanged 163-bone renderer donor and build licensed sources
        run: |
          git fetch --no-tags origin df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          git worktree add --detach .native05-donor-541 df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          git config --global --add safe.directory "$GITHUB_WORKSPACE/.native05-donor-541"
          test "$(git -C .native05-donor-541 rev-parse HEAD)" = df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          ln -s ../node_modules .native05-donor-541/node_modules
          cd .native05-donor-541
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
          git apply ../research/photo-cloth-fit-realism-90/add-45-degree-knee-acceptance.patch
          node --check scripts/test-three-d-78-genuine-knee-pose-browser.mjs
          node --test tests/outfit-3d-01.test.mjs tests/three-d-56-pose-sleeves.test.mjs tests/three-d-73-real-denim-drape.test.mjs tests/three-d-76-source-denim-fold-continuity.test.mjs tests/three-d-77-true-skinned-denim-contact.test.mjs tests/three-d-78-original-anatomical-knee-poses.test.mjs
      - name: Render actual original-photograph skinned denim across 45 degree and posed views
        run: |
          cd .native05-donor-541
          node scripts/test-three-d-78-genuine-knee-pose-browser.mjs
          node ../scripts/audit-photo-cloth-fit-realism-90.mjs
      - name: Run existing real consumer shirt denim dress 163-bone viewer at 320 390 430 widths
        run: |
          cd .native05-donor-541
          node scripts/test-outfit-3d-01-browser.mjs
      - name: Run inherited actual consumer source-photo WebGL and owner isolation gates
        run: node scripts/test-native-3d-05-browser.mjs
      - name: Verify screenshot integrity, provenance and research HOLD
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const x=JSON.parse(readFileSync('.native05-donor-541/benchmark/three-d-90/acceptance.json','utf8'));
          assert.equal(x.sourceRendererSHA,'df6885d6011cb33fb22dceb81a08f35a0ac4dd61');
          assert.equal(x.sourceParentSHA,'e6c2ef87499b354bc8440bfdc9ab3a92980f92f0');
          assert.equal(x.actualWebGL,true);assert.equal(x.real163BoneRig,true);
          assert.equal(x.screenshots,64);assert.equal(x.comparisons,8);
          assert.equal(x.humanAcceptance,'PENDING');assert.equal(x.familyAlpha,'HOLD');
          assert.equal(x.releaseAuthorized,false);assert.equal(x.physicalPhoneTested,false);
          const source=JSON.parse(readFileSync('.native05-donor-541/benchmark/three-d-78/browser-results.json','utf8'));
          assert.deepEqual(source.angles,[0,45,90,180]);assert.equal(source.screenshots,64);
          assert.equal(source.backPhotoInvented,false);assert.equal(source.humanPhotorealismApproved,false);
          const native=JSON.parse(readFileSync('benchmark/native-3d-05/results.json','utf8'));
          assert.equal(native.realWebGL,true);assert.equal(native.cases,3);assert.equal(native.screenshots,15);
          assert.deepEqual(native.errors,[]);assert.deepEqual(native.crashes,[]);
          for(const width of [320,390,430])assert.ok(native.evidence.some(x=>x.width===width));
          console.log('PHOTO90 screenshot integrity/provenance PASS; realism acceptance remains pending; Family Alpha HOLD.');
          NODE
      - name: Preserve sanitized screenshots and exact-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PHOTO90-original-photograph-fit-evidence-HOLD-NO-DEPLOY
          path: |
            research/photo-cloth-fit-realism-90/REPORT.md
            research/photo-cloth-fit-realism-90/source-manifest.json
            .native05-donor-541/benchmark/three-d-90/
            .native05-donor-541/benchmark/three-d-78/browser-results.json
            .native05-donor-541/benchmark/three-d-78/*.png
            .native05-donor-541/benchmark/outfit-3d-01/results.json
            .native05-donor-541/benchmark/outfit-3d-01/*.png
            benchmark/native-3d-05/results.json
            benchmark/native-3d-05/*.png
          if-no-files-found: warn
          retention-days: 14
