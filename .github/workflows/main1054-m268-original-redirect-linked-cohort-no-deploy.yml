name: MAIN1054 M268 original redirect-linked first browser cohort NO DEPLOY HOLD
on:
  push:
    branches: [research/main1054-m268-redirect-linked-original-fresh-cohort-HOLD]
  pull_request:
    branches: [research/main1054-m267-original-redirect-chain-HOLD]
permissions:
  contents: read
jobs:
  source-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source SHA, immutable original Worker and no production-scope changes
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          PARENT=608b06731b4748ae709bee6357c286baba32368c
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$GITHUB_RUN_ATTEMPT" = 1
          git merge-base --is-ancestor "$PARENT" HEAD
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          test "$(git rev-parse HEAD:research/main1054/m267-original-network-redirect-chain.mjs)" = 2beddd8b4161a8e1d2c8eb6ec052185aa7602e1c
          git diff --name-only "$PARENT" HEAD | while IFS= read -r path; do
            case "$path" in
              research/main1054/m268-redirect-linked-original-fresh-cohort.mjs|tests/main1054-m268-original-redirect-linked-fresh-cohort.test.mjs|.github/workflows/main1054-m268-original-redirect-linked-cohort-no-deploy.yml) ;;
              *) echo "M268 unexpected scope: $path"; exit 1 ;;
            esac
          done
          git diff --exit-code "$PARENT" HEAD -- public/ scripts/ supabase/ benchmark/ research/parallel106/ research/mission3-release-evidence-gate/
          node --check research/main1054/m268-redirect-linked-original-fresh-cohort.mjs
          node --test tests/main1054-m268-original-redirect-linked-fresh-cohort.test.mjs
          node research/main1054/m268-redirect-linked-original-fresh-cohort.mjs pin
      - name: Install fixed original research-only browser dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Full offline app build and privacy/security/backup/photo Node regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          test -s dist/index.html
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  original-browser-fresh:
    needs: source-node
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: webkit
            width: 320
            count: 4
          - engine: webkit
            width: 390
            count: 4
          - engine: webkit
            width: 430
            count: 4
          - engine: chromium
            width: 320
            count: 2
          - engine: chromium
            width: 390
            count: 2
          - engine: chromium
            width: 430
            count: 2
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: ${{ matrix.engine }}
      P94_WIDTH: ${{ matrix.width }}
      M268_COUNT: ${{ matrix.count }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Genuine first-attempt browser P94, root-linked original ONNX/JSEP and private owner journey
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
          node research/main1054/m268-redirect-linked-original-fresh-cohort.mjs pin
          node research/main1054/m267-original-network-redirect-chain.mjs prepare
          node --check scripts/.m267-original-network-chain.mjs
          mkdir -p m268-receipts
          for ordinal in $(seq 1 "$M268_COUNT"); do
            echo "M268 precommitted fresh browser $ordinal original $M58_ENGINE width $P94_WIDTH"
            set +e
            timeout -s TERM 180s node scripts/.m267-original-network-chain.mjs > m268-original.log 2>&1
            child_exit=$?
            set -e
            M268_ORDINAL="$ordinal" node research/main1054/m268-redirect-linked-original-fresh-cohort.mjs verify m268-original.log "m268-receipts/receipt-$ordinal.json" "$child_exit"
            rm -f m268-original.log
          done
          node research/main1054/m268-redirect-linked-original-fresh-cohort.mjs aggregate m268-receipts m268-receipts/summary.json
      - name: Upload ONLY bounded original SHA/redirect evidence, never raw browser or private data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m268-original-linked-${{ matrix.engine }}-${{ matrix.width }}-HOLD
          path: m268-receipts/
          if-no-files-found: warn
          retention-days: 7
