name: MAIN247 original Worker JSEP session lifecycle HOLD
on:
  push:
    branches: [research/main247-original-jsep-worker-session-event-timeline-HOLD]
permissions:
  contents: read
jobs:
  security-source:
    name: M247 pinned source, exact change gate and inherited full owner/security
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require three only new research paths plus this workflow
        shell: bash
        run: |
          set -euo pipefail
          BASE=a4d4fd8b86db5b496d21d8649cb6b951cd6f0bce
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE" HEAD)" = "$(printf '%s\n' '.github/workflows/main247-original-jsep-worker-session-HOLD.yml' 'scripts/main247-original-jsep-lifecycle.mjs' 'scripts/test-main247-original-jsep-worker-events-browser.mjs' 'tests/main247-original-jsep-lifecycle.test.mjs')"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          test "$(git rev-parse HEAD:scripts/test-main245-real-p94-runtime-identity-browser.mjs)" = 814fdae7a4e0ffd28c82746ec40a356b2836e463
          node --check scripts/main247-original-jsep-lifecycle.mjs
          node --check scripts/test-main247-original-jsep-worker-events-browser.mjs
          node --test tests/main247-original-jsep-lifecycle.test.mjs
          M247_SOURCE_ONLY=1 node scripts/test-main247-original-jsep-worker-events-browser.mjs
      - name: Install only original pinned no-deploy dependencies
        run: npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Original pinned npm integrity, offline build and full owner/photo privacy tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm view onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 dist.integrity)" = "sha512-0uS76OPgH0hWCPrFKlL8kYVV7ckM7t/36HfbgoFw6Nd0CZVVbQC4PkrR8mBX8LtNUFZO25IQBqV2Hx2ho3FlbQ=="
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  browser:
    name: M247 genuine original JSEP model plus private owner Chromium/WebKit ${{ matrix.engine }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, chromium]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M247_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original fixed Worker and source-only diagnostic reject fakes
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor a4d4fd8b86db5b496d21d8649cb6b951cd6f0bce HEAD
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          node --test tests/main247-original-jsep-lifecycle.test.mjs
          M247_SOURCE_ONLY=1 node scripts/test-main247-original-jsep-worker-events-browser.mjs
      - name: Install exact old runtime and original browser tools
        run: npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Unmodified original SegFormer JSEP actual Worker through private original 2D and backup
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-main247-original-jsep-worker-events-browser.mjs
