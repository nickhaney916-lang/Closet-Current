name: Mission 1 P851 independent real-photo evidence gate — NO DEPLOY
on:
  push:
    branches: [research/mission1-independent-evidence-gate-851-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mission1-p851-independent-evidence-HOLD
  cancel-in-progress: true
jobs:
  strict-parent-and-independent-signed-custody-HOLD:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable P850 parent, exact 11 research-only paths, no app/deploy change
        shell: bash
        run: |
          set -euo pipefail
          BASE=9ee284f501aff50c810a05caf69fc103bc0393b4
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD >/tmp/m1-p851-changed
          cat /tmp/m1-p851-changed
          test "$(wc -l </tmp/m1-p851-changed)" -eq 11
          while IFS= read -r path; do
            case "$path" in
              scripts/p75-dataset-core.mjs|scripts/p75-review-offline.mjs|scripts/p75-verify-pinned.mjs|tests/parallel75-independent-ground-truth.test.mjs|research/parallel75/CODEBOOK.md|research/parallel75/annotation-template.json|research/parallel75/pinned-public-training-development-candidates.json|scripts/m1-release-evidence-851.mjs|tests/mission1-release-evidence-851.test.mjs|research/mission1-independent-evidence-gate-851/REPORT.md|.github/workflows/mission1-independent-evidence-gate-851-no-deploy.yml) ;;
              *) echo "OUT OF SCOPE / APP MUTATION: $path"; exit 1 ;;
            esac
          done </tmp/m1-p851-changed
          test -z "$(git diff --name-only "$BASE" HEAD -- public supabase benchmark .github/workflows/production* .github/workflows/deploy*)"
          grep -Fqx 'const reviewFirst836=true;' <(grep '^const reviewFirst836=' public/app.js)
          grep -Fq 'let saveInFlight=false;' public/app.js
          grep -Fq 'P849_CHANGED_CANDIDATE_OR_OWNER' public/app.js
          grep -Fq 'reviewQueue850.keepForLater(batch,window.closetAuth.user)' public/app.js
          grep -Fq 'FAMILY ALPHA HOLD #255 OPEN' research/mission1-independent-evidence-gate-851/REPORT.md
          echo M1_P851_EXACT_P850_PARENT_11_PATH_NO_DEPLOY_PASS
      - name: Install temporary offline-only test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Independent source, human signer, synthetic invalid-attestation, age and split checks
        run: |
          set -euo pipefail
          node --check scripts/p75-dataset-core.mjs
          node --check scripts/p75-review-offline.mjs
          node --check scripts/p75-verify-pinned.mjs
          node --check scripts/m1-release-evidence-851.mjs
          node --test tests/parallel75-independent-ground-truth.test.mjs tests/mission1-release-evidence-851.test.mjs
          node scripts/p75-verify-pinned.mjs
          node scripts/m1-release-evidence-851.mjs | tee /tmp/m1-p851-evidence
          grep -Fq '"status":"BLOCKED"' /tmp/m1-p851-evidence
          grep -Fq '"shouldLiftFamilyAlphaHold":false' /tmp/m1-p851-evidence
          echo M1_P851_NO_HUMAN_OR_PHONE_PROOF_RELEASE_REMAINS_BLOCKED_PASS
      - name: Both builds and every existing native Node regression
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
          echo M1_P851_FULL_NATIVE_AND_BUILDS_PASS
  chromium-webkit-unchanged-photo-review-HOLD:
    needs: [strict-parent-and-independent-signed-custody-HOLD]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop browser engines only (NOT physical devices)
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: P850 one-photo review and P849 cross-original account comparison
        run: |
          set -euo pipefail
          node scripts/test-m1-batch-review-850.mjs
          node scripts/test-parallel77-cross-capture-browser.mjs
      - name: Preserve P848 color, P847 consent, P846 footwear, P844/P843 owner approval
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node scripts/test-parallel76-color-browser.mjs
          node scripts/test-m1-owner-learning-integration-847.mjs
          node scripts/test-m1-owner-pair-admission-846.mjs
          node scripts/test-m1-review-save-lifecycle-844.mjs parent
          node scripts/test-m1-review-save-lifecycle-844.mjs candidate
          node scripts/test-m1-review-first-default-843.mjs
          node scripts/test-m1-owner-review-editor-839.mjs
          echo M1_P851_INHERITED_BROWSER_NO_DEPLOY_PASS
  licensed-jpeg-provenance-not-model-accuracy-HOLD:
    needs: [strict-parent-and-independent-signed-custody-HOLD]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      P73_PHOTO_IDS: commons-0003,commons-0014,commons-0021,commons-0033,commons-0049,commons-0060,commons-0077,commons-0082,commons-0094,validation-0001,validation-0019
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Temporary JPEG original decoder
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3
      - name: Verify source bytes/hash receipts only; do not claim blind model correctness
        run: |
          set -euo pipefail
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos "$P73_PHOTO_IDS"
          node scripts/evaluate-parallel73-real-photo.mjs
          echo M1_P851_PUBLIC_ORIGINAL_SOURCE_ONLY_HUMAN_BLIND_ACCURACY_UNKNOWN
