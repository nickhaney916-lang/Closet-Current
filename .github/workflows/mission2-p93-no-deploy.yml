name: Mission 2 P93 actual licensed source-mask cleanup proposal NO DEPLOY
on:
  push:
    branches: [research/mission2-p93-licensed-mask-decontamination-HOLD]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Verify immutable original parent research lineage and no consumer source edits
        run: |
          git merge-base --is-ancestor e8170c9ebce19a189dd03ea2027f87717c821a76 HEAD
          git diff --exit-code e8170c9ebce19a189dd03ea2027f87717c821a76 HEAD -- public/ supabase/ benchmark/locked-photo-sources.json benchmark/fixtures/
      - run: node --check research/mission2-p93/alpha-only-source-warm-edge.mjs
      - run: node --check scripts/build-mission2-p93-real-source-mask.mjs
      - run: node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - run: node scripts/build.mjs
  original-licensed-mask-research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Prepare separate historical licensed source worktree
        run: |
          git worktree add --detach .native05-donor-541 df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          ln -s ../node_modules .native05-donor-541/node_modules
      - name: Rebuild genuine pinned original Commons photographs and provisional Work47 alpha
        working-directory: .native05-donor-541
        run: |
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node scripts/build-work47-benchmark.mjs
      - name: Check true original JPEG RGB/source SHA, generate alpha-only review PROPOSAL
        run: node scripts/build-mission2-p93-real-source-mask.mjs
      - name: Verify original/product/owner/cloud files never changed
        run: |
          git diff --exit-code e8170c9ebce19a189dd03ea2027f87717c821a76 HEAD -- public/ supabase/ benchmark/locked-photo-sources.json benchmark/fixtures/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P93-ORIGINAL-licensed-alpha-only-proposal-human-review-needed-HOLD
          path: benchmark/mission2-p93/real-licensed-commons-0053/
          retention-days: 14
