name: Authenticated licensed-image AI pilot request guard
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/garment-normalize/licensed-pilot-handler.mjs'
      - 'supabase/functions/garment-normalize/index.ts'
      - 'tests/licensed-pilot-handler.test.mjs'
      - '.github/workflows/licensed-normalization-pilot.yml'
permissions:
  contents: read
jobs:
  pilot-request-mocks:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate disabled origin and account locked photo handling
        run: |
          node --check supabase/functions/garment-normalize/licensed-pilot-handler.mjs
          node --test tests/licensed-pilot-handler.test.mjs tests/guarded-preview-submission.test.mjs
      - name: Prevent inadvertently enabled pilot and customer-photo admission
        run: |
          node -e "const fs=require('fs');const a=fs.readFileSync('supabase/functions/garment-normalize/licensed-pilot-handler.mjs','utf8');const b=fs.readFileSync('supabase/functions/garment-normalize/index.ts','utf8');if(!a.includes('PILOT_ENABLED_BY_DEFAULT=false')||!b.includes(\"GARMENT_NORMALIZE_PILOT_ENABLED\")||!a.includes('Only licensed benchmark photos allowed'))throw Error('Pilot not safely gated')"
