name: Assignment 14 wardrobe edit and removal HOLD
on:
  pull_request:
    branches: [research/main1054-saved-outfit-search-HOLD]
    paths:
      - .github/workflows/assignment-14-wardrobe-mutation-HOLD.yml
      - scripts/test-assignment-14-browser.mjs
      - public/app.js
      - public/closet-stylist.js
permissions:
  contents: read
jobs:
  browser-and-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: node scripts/build.mjs
      - if: matrix.engine == 'chromium'
        run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
      - run: npx playwright install --with-deps "${{ matrix.engine }}"
      - run: node scripts/test-assignment-14-browser.mjs
        env:
          A14_ENGINE: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assignment-14-${{ matrix.engine }}
          path: benchmark/assignment-14/
          if-no-files-found: ignore
