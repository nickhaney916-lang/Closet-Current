name: P192 local mask continuity full regression + genuine WebGL NO DEPLOY
on:
  push:
    branches:
      - research/owner-local-mask-continuity-192-main-20261109-HOLD
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  reviewed-owner-proof-and-full-node:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact pinned P191 parent and 5 scoped research-only paths, NO DEPLOY
        run: |
          set -eu
          BASE=e8fb5e2abbe0c015c1cd9316afedd69bc4d13682
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git rev-parse "$(git rev-list --reverse "$BASE..HEAD" | head -n1)^")" = "$BASE"
          git diff --name-only "$BASE" HEAD > /tmp/p192-paths
          while IFS= read -r p; do
            case "$p" in
              research/owner-source-mask-topology-191/source-contour-integrity.mjs|research/owner-local-mask-continuity-192/source-local-continuity.mjs|tests/owner-local-mask-continuity-192.test.mjs|research/owner-local-mask-continuity-192/REPORT.md|.github/workflows/owner-local-mask-continuity-192-no-deploy.yml) ;;
              *) echo "P191 rejects unrelated source $p"; exit 1 ;;
            esac
          done </tmp/p192-paths
          test "$(wc -l </tmp/p192-paths)" -eq 5
          git diff --exit-code "$BASE" HEAD -- public supabase migrations package.json package-lock.json research/cloud-to-native-3d-180
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: P192 local continuity and full regression tests
        run: |
          node --check research/owner-local-mask-continuity-192/source-local-continuity.mjs
          node --check tests/owner-local-mask-continuity-192.test.mjs
          node --check research/owner-source-mask-topology-191/source-contour-integrity.mjs
          node --check scripts/install-owner-source-topology-191.mjs
          node --check tests/owner-source-mask-topology-191.test.mjs
          node --check research/owner-mask-geometry-190/owner-alpha-contour.mjs
          node --check scripts/install-owner-alpha-geometry-190.mjs
          node --check tests/owner-mask-geometry-190.test.mjs
          node --check research/owner-mask-fabric-189/mask-contract.mjs
          node --check tests/owner-mask-fabric-189.test.mjs
          node --check research/pre-webgl-owner-cutout-187/cutout-lease.mjs
          node --check research/owner-reviewed-cutout-texture-188/private-cutout-texture.mjs
          node --check scripts/install-owner-reviewed-cutout-texture-188.mjs
          node --check research/owner-cutout-photo-fit-186/review-contract.mjs
          node --check research/native-consumer-board-04/consumer-board-controller.mjs
          node --check research/native-3d-05/native-preview-bridge.mjs
          node --check scripts/test-native-3d-05-browser.mjs
          node --test tests/owner-cutout-photo-fit-186.test.mjs tests/pre-webgl-owner-cutout-187.test.mjs tests/owner-reviewed-cutout-texture-188.test.mjs tests/owner-mask-fabric-189.test.mjs tests/owner-mask-geometry-190.test.mjs tests/owner-source-mask-topology-191.test.mjs tests/owner-local-mask-continuity-192.test.mjs
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  mobile-owner-review-fail-closed-chromium-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PHOTO_FIT171: '1'
      PHOTO_SILHOUETTE62: '1'
      PHOTO_SHOULDER185: '1'
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Install genuine P541/P60/P172 source photo rig into disposable donor only
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git worktree add --detach .donor541 df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          git worktree add --detach .p60 6fe5e46b91533a96f3c0d86950ea077cb355c459
          git worktree add --detach .p172 88d2fdb412f84b0498c86bfa17f4b391425e1958
          for name in .donor541 .p60 .p172; do
            git config --global --add safe.directory "$GITHUB_WORKSPACE/$name"
            ln -s ../node_modules "$name/node_modules"
          done
          cd .donor541
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
          cd ..
          cd .p60 && node scripts/install-photo-cloth-realism-164.mjs ../.donor541 && cd ..
          node scripts/install-native-photo-anatomical-fit-171.mjs .donor541
          node scripts/install-native-photo-torso-173.mjs .donor541 .p172
          node scripts/install-source-shoulder-seam-174.mjs .donor541
          node scripts/install-native-original-dress-drape-175.mjs .donor541
          node scripts/install-user-photo-to-anatomical-3d-62.mjs .donor541
          node scripts/install-photographed-garment-shoulder-185.mjs .donor541
          node scripts/install-owner-reviewed-cutout-texture-188.mjs .donor541
          node scripts/install-owner-alpha-geometry-190.mjs .donor541
      - name: Preserve genuine P185 provisional blouse female/male 163-bone acceptance
        env:
          PHOTO_SILHOUETTE62_BROWSER: ${{ matrix.engine }}
        run: |
          node scripts/build.mjs
          node scripts/test-native-3d-05-browser.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {verifyGarmentShoulderEvidence185} from './research/garment-shoulder-source-honesty-185/evidence.mjs';
          const engine=process.env.PHOTO_SILHOUETTE62_BROWSER;
          const root='benchmark/user-photo-to-anatomical-3d-62/'+engine+'/';
          const data=JSON.parse(readFileSync(root+'results.json','utf8'));
          assert.equal(data.screens.length,21);
          assert.equal(verifyGarmentShoulderEvidence185(data,{root,engine}).verified,true);
          NODE
          mkdir -p benchmark/owner-reviewed-cutout-texture-188
          cp -a benchmark/user-photo-to-anatomical-3d-62/${{ matrix.engine }} benchmark/owner-reviewed-cutout-texture-188/p185-${{ matrix.engine }}
          rm -rf benchmark/user-photo-to-anatomical-3d-62/${{ matrix.engine }}
      - name: Prove unreviewed owner cutout never reaches 3D import in Chromium/WebKit 320/390/430
        env:
          PHOTO_OWNER_CUTOUT186: '1'
          PHOTO_CUTOUT_PREFLIGHT187: '1'
          PHOTO_SILHOUETTE62_BROWSER: ${{ matrix.engine }}
        run: |
          node scripts/test-native-3d-05-browser.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const engine=process.env.PHOTO_SILHOUETTE62_BROWSER;
          const root='benchmark/user-photo-to-anatomical-3d-62/'+engine+'/';
          const data=JSON.parse(readFileSync(root+'results.json','utf8'));
          assert.equal(data.priority,'PRE-WEBGL-CUTOUT-187');
          assert.deepEqual(data.widths,[320,390,430]);
          assert.equal(data.cases,3);
          assert.equal(data.screenshots,6);
          assert.equal(data.screens.length,6);
          assert.equal(data.errors.length,0);
          assert.ok(data.evidence.every(row=>row.provisionalBlouseOwnerCutoutReviewRejected186===true&&
           row.originalPhotoFallbackPreserved===true&&
           row.preWebGLReviewDenial187===true&&row.actualDonorImports187===0&&
           row.unreviewed3DSceneNeverCreated187===true&&
           row.source3DVisibilityRevoked===true&&row.ownerWardrobeUntouched===true&&
           row.releaseAuthorized===false&&row.familyAlpha==='HOLD'));
          const hashes=new Set();
          for(const frame of data.screens){
           const raw=readFileSync(root+frame.name);
           assert.equal(createHash('sha256').update(raw).digest('hex'),frame.sha256);
           assert.equal(raw.readUInt32BE(16),frame.width);
           hashes.add(frame.sha256);
          }
          assert.equal(hashes.size,6);
          console.log('P187_'+engine.toUpperCase()+'_SIX_REAL_SHA_PRE_WEBGL_FALLBACK_IMAGES_PASS');
          NODE
      - name: Preserve P187 unreviewed JPEG fail-closed screenshots before P188 positive
        env:
          PHOTO_OWNER_CUTOUT186: '1'
          PHOTO_CUTOUT_PREFLIGHT187: '1'
          PHOTO_SILHOUETTE62_BROWSER: ${{ matrix.engine }}
        run: |
          node scripts/test-native-3d-05-browser.mjs
          mkdir -p benchmark/owner-reviewed-cutout-texture-188
          cp -a benchmark/user-photo-to-anatomical-3d-62/${{ matrix.engine }} benchmark/owner-reviewed-cutout-texture-188/p187-denial-${{ matrix.engine }}
          rm -rf benchmark/user-photo-to-anatomical-3d-62/${{ matrix.engine }}
      - name: Actual private owner PNG contour to 163-bone source blouse shell + both caps, retain fallback
        env:
          PHOTO_OWNER_CUTOUT186: '1'
          PHOTO_CUTOUT_PREFLIGHT187: '1'
          PHOTO_OWNER_POSITIVE188: '1'
          PHOTO_OWNER_ALPHA189: '1'
          PHOTO_OWNER_GEOMETRY190: '1'
          PHOTO_OWNER_TOPOLOGY191: '1'
          PHOTO_SILHOUETTE62_BROWSER: ${{ matrix.engine }}
        run: |
          node scripts/test-native-3d-05-browser.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const engine=process.env.PHOTO_SILHOUETTE62_BROWSER;
          const root='benchmark/user-photo-to-anatomical-3d-62/'+engine+'/';
          const data=JSON.parse(readFileSync(root+'results.json','utf8'));
          assert.equal(data.priority,'OWNER-SOURCE-ALPHA-TOPOLOGY-191');
          assert.deepEqual(data.widths,[320,390,430]);
          assert.equal(data.cases,3);
          assert.equal(data.screenshots,22);
          assert.equal(data.screens.length,22);
          assert.equal(data.errors.length,0);
          assert.ok(data.evidence.every(r=>r.syntheticPersistedOwnerReview188===true&&
           r.originalAndOwnerCutoutJPEGIndependentlyWebCryptoVerified188===true&&
           r.ownerCutoutPrivateJPEGTexelsOnTrueSkinnedMesh188===true&&
           r.actualOwnerAlphaPNGAppliedToFabric189===true&&
           r.ownerMaskWebCryptoVerifiedBeforeAndAfterDonor189===true&&
           r.ownerMaskSourceGeometryStillPinned189===true&&
           r.realOriginalSourceAndOwnerAlphaTopology191===true&&
           r.actualOwnerContourOverlapIoU191>=.80&&
           r.actualOwnerContourConnected191>=.87&&
           r.actualOwnerContourInsideSource191>=.965&&
           r.originalAndOwnerMaskSourceShaRetained191===true&&
           r.humanReviewIndependentlyWitnessed191===false&&
           r.arbitraryPhotoSegmentationCertified191===false&&
           r.sourceOwnerAlphaPhysicalMeshFitted190===true&&
           r.ownerMaskMeasuredActuallyFromPrivateRaster190===true&&
           r.sourceOwnerAlphaActualMovedVertices190>=20&&
           r.sourceOwnerAlphaMaxMovement190>=.0005&&
           r.sourceOwnerAlphaMaxMovement190<=.00901&&
           r.actualMaleAndFemaleSewnCapJoins190===true&&
           r.sourceOwnerMaskGeometryOnlyLicensedBlouse190===true&&
           r.ownerPhotoBackStillInferred190===true&&
           r.independentlyWitnessedOwnerReview190===false&&
           r.generalOwnerGarmentFitting190===false&&
           r.syntheticOwnerMaskNotIndependentReview189===true&&
           r.ownerMaskRealHumanApproved===false&&
           r.ownerMaskSegmentationAccuracyMeasured===false&&
           r.licensePinnedPNGMaskNotOwnerSegmentation188===false&&
           r.femaleAndMaleRendered===true&&r.outfitUnmodified===true&&
           r.independentHumanReviewWitnessed188===false&&
           r.physicalPhoneAccepted188===false&&r.familyAlpha==='HOLD'));
          assert.equal(data.evidence.find(r=>r.width===390).reviewRevocationClosesGenuineWebGL188,true);
          assert.equal(data.evidence.find(r=>r.width===390).ownerAlphaMutationRevokedReal3D189,true);
          const hashes=new Set();
          for(const frame of data.screens){
           const raw=readFileSync(root+frame.name);
           assert.equal(createHash('sha256').update(raw).digest('hex'),frame.sha256);
           assert.equal(raw.readUInt32BE(16),frame.width);
           hashes.add(frame.sha256);
          }
          assert.equal(hashes.size,22);
          console.log('P190_'+engine.toUpperCase()+'_REAL_OWNER_ALPHA_SHELL_PLUS_SEWN_CAPS_22_ACTUAL_PNG_PASS');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P192-${{ matrix.engine }}-source-local-continuity-49-sha-screens-HOLD
          path: |
            benchmark/owner-reviewed-cutout-texture-188/
            benchmark/user-photo-to-anatomical-3d-62/
          retention-days: 14
          if-no-files-found: warn
