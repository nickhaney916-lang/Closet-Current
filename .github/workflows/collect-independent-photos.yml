name: Collect independent clothing photos
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve original images and calculate checksums
        run: node scripts/collect-independent-photo-bytes.mjs
      - name: Save review images and evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-photo-collection
          path: benchmark/photo-collection/
          retention-days: 14
