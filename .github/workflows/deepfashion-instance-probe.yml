name: Experimental DeepFashion instance ONNX
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'benchmark/deepfashion-instance-onnx-reference.json'
      - 'benchmark/deepfashion-real-photo-suite.json'
      - 'benchmark/deepfashion_review_risks.py'
      - 'benchmark/deepfashion_mask_seed.py'
      - 'tests/test_deepfashion_mask_seed.py'
      - 'tests/test_deepfashion_review_risks.py'
      - 'benchmark/manifest-fresh-11.json'
      - 'benchmark/locked-photo-sources.json'
      - 'benchmark/manifest-visible-legwear-2.json'
      - 'scripts/run-deepfashion-instance-probe.py'
      - 'benchmark/deepfashion_instance_decode.py'
      - 'tests/test_deepfashion_instance_decode.py'
      - '.github/workflows/deepfashion-instance-probe.yml'
permissions:
  contents: read
jobs:
  pinned-model-review:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only existing dependencies
        run: pip install numpy==1.26.4 Pillow==11.2.1 onnxruntime==1.21.0
      - name: Compile model audit
        run: |
          python -m py_compile scripts/run-deepfashion-instance-probe.py
          PYTHONPATH=benchmark python -m unittest discover -s tests -p 'test_deepfashion_instance_decode.py' -v
          PYTHONPATH=benchmark python -m unittest discover -s tests -p 'test_deepfashion_review_risks.py' -v
          PYTHONPATH=benchmark python -m unittest discover -s tests -p 'test_deepfashion_mask_seed.py' -v
      - name: Download SHA-verified source photographs
        run: |
          node scripts/download-reviewed-photos.mjs benchmark/manifest-visible-legwear-2.json benchmark/photos validation-0031
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos commons-0059,commons-0035,commons-0049,commons-0065,commons-0079
          node scripts/download-reviewed-photos.mjs benchmark/manifest-fresh-11.json benchmark/photos validation-0017,validation-0001,validation-0010,validation-0019
      - name: Profile pinned ONNX garment instances on ten licensed reference photos
        run: python scripts/run-deepfashion-instance-probe.py benchmark/deepfashion-instance-review
      - name: Block invented clothes and unverified instance accuracy
        run: |
          python - <<'PY'
          import json
          x=json.load(open('benchmark/deepfashion-instance-review/summary.json'))
          assert x['status']=='complete' and x['modelHashVerified'] and x['sourceHashesVerified']
          assert len(x['cases'])==10 and x['parsedInstanceMasks']>=0
          assert len(set(c['id'] for c in x['cases']))==10
          kinds={c['categoryCoverageReview']['expectedBroadCategoryContextOnly'] for c in x['cases']}
          assert kinds=={'Layered','Bottoms','Dresses','Outerwear','Shoes'}
          shoes=[c for c in x['cases'] if c['categoryCoverageReview']['negativeFootwearControl']]
          assert len(shoes)==2 and all(not c['categoryCoverageReview']['categorySupportedByThisModel'] for c in shoes)
          assert all(c['categoryCoverageReview']['contextCategoryIsNotGroundTruth']
                     and not c['categoryCoverageReview']['instancePrecisionRecallMeasured']
                     and not c['manualReviewRisk']['allowAutomaticSaving']
                     and c['manualReviewRisk']['confirmedSeparateGarments']==0
                     for c in x['cases'])
          by={c['id']:c for c in x['cases']}
          assert 'no-expected-specific-garment-proposal' in by['commons-0035']['manualReviewRisk']['manualReviewFlags']
          assert 'possible-single-garment-fragmentation' in by['commons-0065']['manualReviewRisk']['manualReviewFlags']
          assert 'possible-single-garment-fragmentation' in by['commons-0049']['manualReviewRisk']['manualReviewFlags']
          assert len([c for c in x['cases'] if
                      'unsupported-footwear-taxonomy' in c['manualReviewRisk']['manualReviewFlags']])==2
          assert x['automaticItemsCreated']==0 and not x['customerModelChanged'] and not x['paidServicesUsed']
          root=Path('benchmark/deepfashion-instance-review')
          review=json.loads((root/'independent-outline-review'/'reference-review-index.json').read_text())
          assert review['approvedReferences']==0 and not review['predictionMasksAreGroundTruth']
          assert review['imageCount']==10 and not review['automaticCustomerMaskPromotion']
          assert review['pendingIndividualPredictions']==x['parsedInstanceMasks']
          assert sum(c['exactOriginalIncludedForReview'] for c in review['cases'])==5
          for c in review['cases']:
              assert c['allMasksUnapproved'] and c['userPhotoModified'] is False
              for item in c['candidateSeeds']:
                  seed=json.loads((root/item['prediction']).read_text())
                  assert seed['reviewStatus']=='prediction-unreviewed'
                  assert seed['approvedBy'] is None and not seed['independentReference']
                  assert seed['sourceSha256']==c['sourceSha256'] and seed['image']==c['image']
                  assert seed['width']>0 and seed['height']>0
                  assert sum(seed['runs'])==seed['width']*seed['height']
                  assert not seed['canSaveToCustomerCloset']
          assert all(c['independentHumanReferenceCount']==0 for c in x['cases'])
          assert all(not c['masksNotDecoded'] and c['automaticItemsSaved']==0 and
                     c['overlapReview']['canAutoSaveAnyProposal'] is False and
                     all(not u['certifiedSingleArticle'] and not u['autoSaveAllowed']
                         and u['sourcePhotoUnchanged'] for u in c['unverifiedCategoryUnions'])
                     for c in x['cases'])
          from pathlib import Path
          assert all((Path('benchmark/deepfashion-instance-review')/(c['id']+'-instance-overlays.png')).is_file() for c in x['cases'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinned-deepfashion-instance-feasibility
          path: |
            benchmark/deepfashion-instance-review/summary.json
            benchmark/deepfashion-instance-review/*-instance-overlays.png
            benchmark/deepfashion-instance-review/*-union-review.png
            benchmark/deepfashion-instance-review/independent-outline-review/reference-review-index.json
            benchmark/deepfashion-instance-review/independent-outline-review/model-seeds/*.json
            benchmark/deepfashion-instance-review/independent-outline-review/original-photos/*
          retention-days: 14
