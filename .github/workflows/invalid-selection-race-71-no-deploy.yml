name: RACE71 invalid last-photo selection cannot revive stale JPEG NO DEPLOY
on:
  push:
    branches:
      - research/invalid-selection-race-71-main-20261105-HOLD
  pull_request:
    paths:
      - 'research/multi-garment-capture-01/review-ui.mjs'
      - 'scripts/test-multi-garment-capture-01-browser.mjs'
      - 'scripts/audit-invalid-selection-race-71-browser.mjs'
      - 'tests/invalid-selection-race-71.test.mjs'
      - '.github/workflows/invalid-selection-race-71-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invalid-later-pick-owner-review-reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin verified SOURCE70 parent and reject any unrelated changed files
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor cf65ad8a38096f394f86f3ba884abc8ffcc6a891 HEAD
          git diff --name-only cf65ad8a38096f394f86f3ba884abc8ffcc6a891 HEAD >/tmp/race71-files
          while IFS= read -r path; do
            case "$path" in
              research/multi-garment-capture-01/review-ui.mjs|scripts/test-multi-garment-capture-01-browser.mjs|scripts/audit-invalid-selection-race-71-browser.mjs|tests/invalid-selection-race-71.test.mjs|.github/workflows/invalid-selection-race-71-no-deploy.yml) ;;
              *) echo "BLOCKED staging, production, or unrelated modification: $path"; exit 1 ;;
            esac
          done </tmp/race71-files
      - name: Install pinned browser and Node testing dependencies, not deploy dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Build and run all inherited + invalid later selection source-race tests
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Six inherited unchanged licensed JPEG Chromium and WebKit full private workflow tests
        run: node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Six licensed JPEG invalid-selection delayed-valid-hash race original review browser tests
        run: SOURCE71=1 node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Independently verify original photo owner safety and 90 screenshot SHA/dimensions
        run: node scripts/audit-invalid-selection-race-71-browser.mjs
      - name: Archive only sanitized browser evidence and screenshot hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RACE71-last-invalid-selection-preserves-original-three-reviewed-garments-HOLD
          path: |
            benchmark/invalid-selection-race-71/acceptance.json
            benchmark/invalid-selection-race-71/*.png
          if-no-files-found: warn
          retention-days: 14
