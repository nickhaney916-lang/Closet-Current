    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      P99_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: M205 exact M203 inherited M199 owner receipt and both immutable protected historical gate pins
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          M203=24571ba087e4bc21bac5a07a18769a945aaaa096
          git merge-base --is-ancestor "$M203" HEAD
          changed="$(git diff --name-only "$M203" HEAD)"
          test "$changed" = ".github/workflows/main205-m203-protected-m183-m187-owner-lease-no-deploy.yml"
          test "$(git rev-parse HEAD:public/native-owner-wardrobe-index-167.mjs)" = d872c582a9d8e6f319cae4c99f84dbc81ea7f7d3
          test "$(git rev-parse HEAD:research/wardrobe-index-01/owner-wardrobe-index.mjs)" = 60581e3b00f6877bbb424d0c090d9ab294890277
          test "$(git rev-parse HEAD:research/index-04/verified-saved-recognition.mjs)" = b84a47731e8775ac8a8b8d520fcdefc56ea46ba9
          test "$(git rev-parse HEAD:tests/wardrobe-index-01.test.mjs)" = dd8e412f6f20ef540f6b7340e23f86ec919ce3a9
          test "$(git rev-parse HEAD:tests/index-04-saved-recognition.test.mjs)" = 5580cd8bac5d0ddc810644e50269805c45034b42
          test "$(git rev-parse HEAD:tests/main199-source-cutout-owner-proof.test.mjs)" = 526f627375112ed261bd7651613eb76ed2131814
          test "$(git rev-parse HEAD:tests/multigarment-cutout-byte-116.test.mjs)" = 47efa493b8f442c26487b2e1b6ddc25923ceac38
          test "$(git rev-parse HEAD:tests/p87-catalog-crosswalk.test.mjs)" = 5bef21fc5898bdf7ab4fda6097e2cbc2cf298993
          test "$(git rev-parse HEAD:.github/workflows/main199-source-cutout-owner-proof-no-deploy.yml)" = 6479230f776614f487b673228180a1a25083f8d9
          test "$(git rev-parse HEAD:.github/workflows/main201-m199-protected-m58-no-deploy.yml)" = 22985375e1ceee3d347ac5f3405f8411f4873b1c
          test "$(git rev-parse HEAD:.github/workflows/main203-m201-protected-m173-unflagged-24mp-no-deploy.yml)" = a401b7488bfdcde685e11c9f7ef66269fb902536
          test "$(git rev-parse HEAD:.github/workflows/main183-outfit-session-epoch-no-deploy.yml)" = e1abe452c39eef25387ec0f1f16d4138aa696872
          test "$(git rev-parse HEAD:.github/workflows/main187-required-owner-lease-no-deploy.yml)" = ed2d2e61b913e01f12c11506d90627c5629bd187
          test "$(git rev-parse HEAD:public/app.js)" = 835b4ad1f4a4a7f520aad5afd225134e5ea56e2d
          test "$(git rev-parse HEAD:public/outfit-capture.js)" = 8d55715ef09e34086d3c401ec38340bfc25f5fe8
          test "$(git rev-parse HEAD:public/native-outfit-source-plan-p99.mjs)" = 0d4972a7fddfcfae0dd811765e4a94b962f4b578
          test "$(git rev-parse HEAD:public/native-2d-preview-p99.mjs)" = 62bad171a97030846b0f1bb3bab740dec20ac5e7
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          node --check public/native-owner-wardrobe-index-167.mjs
          node --check research/index-04/verified-saved-recognition.mjs
      - name: Pin exact M187 source and original two-engine P99 test code
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # M200 source-bound inheritance: exact independently proven M190 original
          # retire/revoke index and original nine-case signed-owner photo regression.
          test "$(git rev-parse HEAD:public/native-owner-wardrobe-index-167.mjs)" = d872c582a9d8e6f319cae4c99f84dbc81ea7f7d3
          test "$(git rev-parse HEAD:tests/main190-retired-duplicate-owner-index.test.mjs)" = cf9fd805e3a257378ac658b23d50a9a9339daa0c
          test "$(git rev-parse HEAD:public/native-outfit-source-plan-p99.mjs)" = 0d4972a7fddfcfae0dd811765e4a94b962f4b578
          test "$(git rev-parse HEAD:scripts/test-parallel99-normal-app-browser.mjs)" = 9b8c3b37d1d8116e4bf9bc6dbf7ea82e2752433d
          test "$(git rev-parse HEAD:public/native-2d-preview-p99.mjs)" = 62bad171a97030846b0f1bb3bab740dec20ac5e7
      - name: Install pinned app dependencies; no network during PWA acceptance
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Build unflagged native app without deploy
        run: node scripts/build.mjs
      - name: Chromium or WebKit phone-width original photo to outfit and v3 restore
        shell: bash
        run: |
          set -euo pipefail
          for width in 320 390 430; do
            P99_WIDTH="$width" node scripts/test-parallel99-normal-app-browser.mjs
          done
