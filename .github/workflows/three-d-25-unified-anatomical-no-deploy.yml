name: 3D-25 unified shirt plus anatomical sleeveless dress (HOLD NO DEPLOY)
on:
  pull_request:
    paths:
      - 'research/three-d-15/demo.mjs'
      - 'research/three-d-15/showroom.mjs'
      - 'research/three-d-15/outfit-controller.mjs'
      - 'research/three-d-24/anatomical-dress.mjs'
      - 'research/three-d-24/test-fixtures.mjs'
      - 'research/three-d-25/**'
      - 'tests/three-d-24-dress-fit.test.mjs'
      - 'tests/three-d-25-integrated-anatomy.test.mjs'
      - 'scripts/test-three-d-24-browser.mjs'
      - 'scripts/audit-three-d-24-contact.mjs'
      - 'scripts/build-three-d-24-visual-qa.mjs'
      - '.github/workflows/three-d-25-unified-anatomical-no-deploy.yml'
permissions:
  contents: read
env:
  PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
jobs:
  integrated-source-geometry-and-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Fail closed on any changes outside exact-source integration work
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin 839300de731b9429080141ffd8972949f1ec7176
          git diff --name-only 839300de731b9429080141ffd8972949f1ec7176 HEAD | while IFS= read -r f; do
            case "$f" in
              research/three-d-15/demo.mjs|research/three-d-15/showroom.mjs|research/three-d-15/outfit-controller.mjs|research/three-d-24/anatomical-dress.mjs|research/three-d-24/test-fixtures.mjs|research/three-d-25/*|tests/three-d-24-dress-fit.test.mjs|tests/three-d-25-integrated-anatomy.test.mjs|scripts/test-three-d-24-browser.mjs|scripts/audit-three-d-24-contact.mjs|scripts/build-three-d-24-visual-qa.mjs|.github/workflows/three-d-25-unified-anatomical-no-deploy.yml) ;;
              *) echo "Unexpected staging, production, recognition, privacy, models, original photos or unrelated code: $f"; exit 1;;
            esac
          done
          test "$(git diff --name-only 839300de731b9429080141ffd8972949f1ec7176 HEAD | wc -l)" -le 12
          git diff --quiet 839300de731b9429080141ffd8972949f1ec7176 HEAD -- research/three-d-22/neckline-seams.mjs research/three-d-23/dress-neckline.mjs benchmark/locked-photo-sources.json
      - name: Install pinned source-only geometry and mobile browser dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 three@0.180.0 playwright@1.56.1
      - name: Recover original source-licensed photographs and exact immutable anatomical models
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin 53f2ad344dc56a1477e343531c423aed0e66c17d dd6bac3fa9ff640d4f562cf925337440bdb5cf8f 3a572193987cb29389727426136c6eb3ac326783 dfb40889c4c1221fb1833b859e8a11ef38aeb76e
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
      - name: Verify combined shirt neck, dress V-neck, anatomical armholes and safe rollbacks
        run: |
          node --test tests/three-d-25-integrated-anatomy.test.mjs tests/three-d-24-combined-research.test.mjs tests/three-d-24-dress-fit.test.mjs tests/three-d-23-dress-neckline.test.mjs tests/three-d-22-fit.test.mjs tests/three-d-20-fit.test.mjs
          node --test --test-name-pattern='Stock-only|Both garment cutouts' tests/three-d-15-outfits.test.mjs
      - name: Exact real body triangle contact diagnostics, not generalized collision certificate
        run: node scripts/audit-three-d-24-contact.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: THREE-D-25-GEOMETRY-AND-CONTACT-HOLD
          path: |
            benchmark/three-d-24/*contact*
            research/three-d-06/models/verified-assets.json
          if-no-files-found: warn
  original-shirt-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      QUICK: "1"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 three@0.180.0 playwright@1.56.1
      - name: Source-pinned model and verified original licensed photos only
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin 53f2ad344dc56a1477e343531c423aed0e66c17d dd6bac3fa9ff640d4f562cf925337440bdb5cf8f 3a572193987cb29389727426136c6eb3ac326783 dfb40889c4c1221fb1833b859e8a11ef38aeb76e
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
      - name: Real original PR426 430px Chromium shirt neckline and unaffected dress control
        run: node scripts/test-three-d-22-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: THREE-D-25-SHIRT-NO-ANATOMICAL-DRESS-REGRESSION-HOLD
          path: benchmark/three-d-22/
          if-no-files-found: warn
  source-photo-sleeveless-dress-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 three@0.180.0 playwright@1.56.1
      - name: Recreate the 15 licensed originals, 9 provisional cutouts and original hash-locked anatomical pair
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin 53f2ad344dc56a1477e343531c423aed0e66c17d dd6bac3fa9ff640d4f562cf925337440bdb5cf8f 3a572193987cb29389727426136c6eb3ac326783 dfb40889c4c1221fb1833b859e8a11ef38aeb76e
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
      - name: Original PR429 real Chromium 320 390 430 both rig armholes and unchanged shirt-pants
        run: node scripts/test-three-d-24-browser.mjs
      - name: Produce real photo/cutout/before-after, shoulder/armhole comparison sheets
        run: node scripts/build-three-d-24-visual-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: THREE-D-25-DRESS-REAL-CHROMIUM-ANATOMICAL-PHOTO-HOLD
          path: benchmark/three-d-24/
          if-no-files-found: warn
