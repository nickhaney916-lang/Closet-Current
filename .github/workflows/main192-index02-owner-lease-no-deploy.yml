name: MAIN192 same-owner signed index lease genuine browsers NO DEPLOY HOLD
on:
  push:
    branches: [research/main192-index02-same-owner-lease-HOLD]
  pull_request:
    branches: [research/main191-adopt-m190-retired-index-HOLD]
    paths:
      - public/app.js
      - research/wardrobe-index-02/mobile-index-app.mjs
      - tests/main192-index02-same-owner-lease.test.mjs
      - scripts/test-wardrobe-index-02-browser.mjs
      - .github/workflows/main192-index02-owner-lease-no-deploy.yml
permissions:
  contents: read
jobs:
  original-owner-private-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact M191 original + scoped optional native source allowlist
        shell: bash
        run: |
          set -euo pipefail
          BASE=b8910f6b63ff77ba754542b931c82f29f3ff186c
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse HEAD:public/app.js)" = 883660e4743015743ea2e42f0ed9ba23ed978679
          test "$(git rev-parse HEAD:research/wardrobe-index-02/mobile-index-app.mjs)" = 79aa3399dcf9b4f667e4f911cf2fd0c08f9ffd8c
          test "$(git rev-parse HEAD:tests/main192-index02-same-owner-lease.test.mjs)" = 156cbd17fd19f1d1571f20d18214d4e28497afc1
          test "$(git rev-parse HEAD:scripts/test-wardrobe-index-02-browser.mjs)" = dad2eb15eba23331fca94884012bd82fa091b4f1
          test "$(git rev-parse HEAD:public/native-owner-wardrobe-index-167.mjs)" = 674797958366cc976a1a4abc8073087148d22975
          test "$(git rev-parse HEAD:public/native-outfit-source-plan-p99.mjs)" = 0d4972a7fddfcfae0dd811765e4a94b962f4b578
          test "$(git rev-parse HEAD:public/native-2d-preview-p99.mjs)" = 62bad171a97030846b0f1bb3bab740dec20ac5e7
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse HEAD:public/native-default-atomic-import-m3.mjs)" = d41c1aeec7fac7c95dbf02d9ed12fcee0c46ed3e
          test "$(git rev-parse HEAD:public/native-default-verified-backup-export-m3.mjs)" = 741e736ca107169c9e9861d803a49c2e6166e20b
          git diff --name-only "$BASE" HEAD | while IFS= read -r file; do
            case "$file" in
              public/app.js|research/wardrobe-index-02/mobile-index-app.mjs|tests/main192-index02-same-owner-lease.test.mjs|scripts/test-wardrobe-index-02-browser.mjs|.github/workflows/main192-index02-owner-lease-no-deploy.yml) ;;
              *) echo "MAIN192 denied unrelated change: $file"; exit 1 ;;
            esac
          done
          git diff --exit-code "$BASE" HEAD -- public/ ':(exclude)public/app.js' supabase/ benchmark/ research/ ':(exclude)research/wardrobe-index-02/mobile-index-app.mjs' tests/ ':(exclude)tests/main192-index02-same-owner-lease.test.mjs' scripts/ ':(exclude)scripts/test-wardrobe-index-02-browser.mjs'
          node --check public/app.js
          node --check research/wardrobe-index-02/mobile-index-app.mjs
          node --check tests/main192-index02-same-owner-lease.test.mjs
          node --check scripts/test-wardrobe-index-02-browser.mjs
      - name: Live lease same-owner/DB/epoch/cancel regression and old INDEX02 compatibility
        run: node --test tests/main192-index02-same-owner-lease.test.mjs tests/wardrobe-index-02.test.mjs
      - name: Pinned complete private/source Node and build prerequisites
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Full inherited test suite and unchanged offline app build
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  native-index-and-p99:
    name: actual My Closet index and P99 original 2D (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      INDEX02_ENGINE: ${{ matrix.engine }}
      P99_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact optional index + original unflagged browser provenance
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD:public/app.js)" = 883660e4743015743ea2e42f0ed9ba23ed978679
          test "$(git rev-parse HEAD:research/wardrobe-index-02/mobile-index-app.mjs)" = 79aa3399dcf9b4f667e4f911cf2fd0c08f9ffd8c
          test "$(git rev-parse HEAD:scripts/test-wardrobe-index-02-browser.mjs)" = dad2eb15eba23331fca94884012bd82fa091b4f1
          test "$(git rev-parse HEAD:scripts/test-parallel99-normal-app-browser.mjs)" = 9b8c3b37d1d8116e4bf9bc6dbf7ea82e2752433d
          test "$(git rev-parse HEAD:public/native-outfit-source-plan-p99.mjs)" = 0d4972a7fddfcfae0dd811765e4a94b962f4b578
      - name: Install actual original Playwright and offline build
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
          node scripts/build.mjs
      - name: Actual mobile My Closet index signed local original app at 320 390 430
        run: node scripts/test-wardrobe-index-02-browser.mjs
      - name: Original unflagged owner garment photo review outfit 2D and private v3 restore
        shell: bash
        run: |
          set -euo pipefail
          for width in 320 390 430; do
            P99_WIDTH="$width" node scripts/test-parallel99-normal-app-browser.mjs
          done
