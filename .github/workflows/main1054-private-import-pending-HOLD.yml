name: Main1054 private import pending HOLD
on:
  pull_request:
    branches: [research/main1054-crop-opening-single-flight-HOLD]
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'research/main1054-private-import-pending-HOLD' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lane: [chromium, webkit, regression]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact parent and isolated retry scope
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          base=517d73afe21ac93a27b63db43a5b26e5c8dc57c1
          test "$PR_BASE" = "$base"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$(git rev-parse HEAD^)" = b85dc6592cdc3a9741dedd40e14c628e2de416d4
          test "$(git rev-parse HEAD^^)" = 6041fc6af8b09b9a8b69b3849b93c2d1fb8a632f
          test "$(git rev-parse HEAD^^^)" = "$base"
          test "$(git rev-parse HEAD:public/app.js)" = d890db47b631a145b2ac43960a06589f70c5c417
          test "$(git rev-parse HEAD:public/photo-crop-editor.js)" = 16aed30dfa46552f6c4e721e46b0a90bcc0d5a65
          test "$(git rev-parse HEAD:scripts/build.mjs)" = d2349622d1ea3977ba1f0710d247bd047a21785c
          printf '%s\n' '.github/workflows/main1054-private-import-pending-HOLD.yml' 'public/app.js' 'scripts/main1054-private-import-pending-browser.mjs' > "$RUNNER_TEMP/expected-paths"
          git diff --name-only "$base" HEAD > "$RUNNER_TEMP/actual-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Build twice and compare every output byte
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          cp -a dist "$RUNNER_TEMP/first-build"
          node scripts/build.mjs
          diff -qr "$RUNNER_TEMP/first-build" dist
      - name: Reject unapproved remote and missing local script sources
        if: matrix.lane == 'regression'
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/unapproved-script"
          mkdir -p "$fixture"
          cp -a public "$fixture/public"
          cp scripts/build.mjs "$fixture/build.mjs"
          cd "$fixture"
          for source in 'https://unapproved.invalid/script.js' 'missing.js'; do
            cp "$GITHUB_WORKSPACE/public/index.html" public/index.html
            printf '\n<script src="%s"></script>\n' "$source" >> public/index.html
            if node build.mjs > build.log 2>&1; then
              printf 'Unexpected build success for %s\n' "$source"
              exit 1
            fi
            grep -F 'Unapproved script entry in index.html' build.log
            test ! -e dist
          done
      - if: matrix.lane == 'regression'
        run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
      - name: Native retry reproduction and correction on built application
        if: matrix.lane != 'regression'
        shell: bash
        env:
          BROWSER_ENGINE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          git show 517d73afe21ac93a27b63db43a5b26e5c8dc57c1:public/app.js > "$RUNNER_TEMP/base-app.js"
          node scripts/main1054-private-import-pending-browser.mjs "$BROWSER_ENGINE" "$RUNNER_TEMP/base-app.js" baseline
          node scripts/main1054-private-import-pending-browser.mjs "$BROWSER_ENGINE" dist/app.js
          node scripts/main1054-crop-opening-browser.mjs "$BROWSER_ENGINE" dist/photo-crop-editor.js
          node scripts/main1054-style-card-single-flight-browser.mjs "$BROWSER_ENGINE" dist/app.js
          node scripts/main1054-private-export-pending-browser.mjs "$BROWSER_ENGINE" dist/app.js
          node scripts/main1054-bulk-category-pending-browser.mjs "$BROWSER_ENGINE" dist/app.js
          node scripts/main1054-refresh-session-control-browser.mjs "$BROWSER_ENGINE" dist/app.js
          node scripts/main1054-bulk-discard-pending-browser.mjs "$BROWSER_ENGINE" dist/app.js
          node scripts/main1054-private-photo-retry-single-flight-browser.mjs "$BROWSER_ENGINE" dist/app.js
          node scripts/main1054-photo-review-discard-browser.mjs "$BROWSER_ENGINE" dist/app.js
          node scripts/main1054-photo-review-operation-feedback-browser.mjs "$BROWSER_ENGINE" dist/app.js
          baseline="$RUNNER_TEMP/baseline"
          mkdir -p "$baseline"
          cp -a public "$baseline/public"
          git show 25863e9c0b5189fa7eebc629cbe736b123c81b52:scripts/build.mjs > "$baseline/build.mjs"
          (cd "$baseline" && node build.mjs)
          node scripts/test-built-script-integrity-browser.mjs "$BROWSER_ENGINE" "$baseline/dist" dist
