name: MAIN1054 M53 exact consumer merge-tree feasibility READ ONLY NO DEPLOY
on:
  push:
    branches: [research/main1054-m53-actual-consumer-merge-feasibility-HOLD]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  m53-actual-consumer-source-conflicts:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin M52 verified parent and research-only additive files without a source merge
        shell: bash
        run: |
          set -euo pipefail
          BASE=c4d425076fe853e876cf7d0a34b1b83623f90b85
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --exit-code "$BASE" HEAD -- public/ supabase/ benchmark/ research/native-3d-05/ research/parallel89/ research/mission1-parallel88/ research/main-thread-integration-1054/
          git diff --name-only "$BASE" HEAD | while IFS= read -r p; do
            case "$p" in
              scripts/audit-main53-consumer-merge-tree.mjs|research/master-consolidation-1054/MILESTONE53.md|research/master-consolidation-1054/reviewed-photo-only-handoff59.mjs|research/master-consolidation-1054/reviewed-photo-only-gallery59.mjs|tests/main59-reviewed-photo-only-handoff.test.mjs|scripts/test-main59-actual-native-photo-only-gallery-browser.mjs|.github/workflows/main1054-m53-consumer-merge-tree-no-deploy.yml) ;;
              *) echo "BLOCKED M53 unexpected changed source $p";exit 1;;
            esac
          done
          node --check scripts/audit-main53-consumer-merge-tree.mjs
          node --check research/master-consolidation-1054/reviewed-photo-only-handoff59.mjs
          node --check tests/main59-reviewed-photo-only-handoff.test.mjs
          node --check research/master-consolidation-1054/reviewed-photo-only-gallery59.mjs
          node --check scripts/test-main59-actual-native-photo-only-gallery-browser.mjs
      - name: Actual independent Git three-way merger conflict calculation, do NOT commit/merge
        run: node scripts/audit-main53-consumer-merge-tree.mjs
      - name: Preserve unchanged main M51 application original owner/2D source
        run: |
          git diff --exit-code 22f3db9f9d5dd34ff2d1323e59d3848935e65f4f HEAD -- public/ supabase/ benchmark/ research/native-3d-05/ research/parallel89/ research/mission1-parallel88/ research/main-thread-integration-1054/
          test -s benchmark/main53-source-merge-audit/M53-READONLY-CONSUMER-CONFLICT-REPORT-NOT-RELEASE.json
      - name: Build unchanged native consumer source, no deployment
        run: node scripts/build.mjs
      - name: Install exact source-only regression dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 playwright@1.56.1 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: M59 actual native source-to-photo-only private owner/board adapter positive and adversarial tests
        run: node --test tests/main59-reviewed-photo-only-handoff.test.mjs
      - name: Genuine licensed source private saved original 2D invariant
        run: node --test tests/main49-licensed-original-photo-private-outfit-2d.test.mjs
      - name: Full original M51 application regression, not full multi-branch merged app
        run: node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Upload exact current donor Git conflict assessment without source data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main1054-m53-real-merge-conflicts-NO-MERGE-NOT-RELEASE
          path: benchmark/main53-source-merge-audit/
          retention-days: 14
          if-no-files-found: ignore

  m59-actual-native-photo-only-gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M59_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact original M53 parent, unchanged original JPEG, consumer and cloud scope
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=f33e6e328ca8e6c98e036b57defa847efd0213ba
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --exit-code "$BASE" HEAD -- public/ supabase/ benchmark/ research/multi-garment-capture-01/ research/mission1-parallel88/ research/parallel89/ research/native-3d-05/
          node --check research/master-consolidation-1054/reviewed-photo-only-handoff59.mjs
          node --check research/master-consolidation-1054/reviewed-photo-only-gallery59.mjs
          node --check scripts/test-main59-actual-native-photo-only-gallery-browser.mjs
      - name: Install pinned no-deploy Playwright owner-only browser prerequisites
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Actual native app owner reviewed private original JPEG gallery, board revocation, A to B isolation
        run: node scripts/test-main59-actual-native-photo-only-gallery-browser.mjs
      - name: Assert source-safe result is real browser 320,390,430 and not 3D/hosted release
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const e=process.env.M59_ENGINE;
          const path='benchmark/main59-native-photo-only/'+e+'/M59-REAL-NATIVE-PHOTO-ONLY-GALLERY-NOT-RELEASE.json';
          const r=JSON.parse(fs.readFileSync(path,'utf8'));
          if(r.engine!==e||r.realNativeApp!==true||r.humanTruthSynthetic!==true||
             r.actualPrivateBrowserIndexedDB!==true||r.releaseAuthorized!==false||
             r.familyAlpha!=='HOLD'||r.cases.length!==3||
             r.cases.map(x=>x.width).join(',')!=='320,390,430'||
             r.cases.some(x=>x.ownerAAtomicSavedRow!==1||x.ownerBPrivateRows!==0||
              x.exactOriginalRendered!==true||x.threeDAdmitted!==false||
              x.logoutPhotoRevoked!==true||x.ownerBOriginalLeak!==false||
              x.realV4BackupDownload!==true||x.tamperedV4SourceRejected!==true||
              x.foreignV4OwnerRejected!==true||x.nativeOwnerCanceledV4Unchanged!==true||
              x.atomicV4OwnerRestore!==true||x.originalJPEGAndFlagsRestored!==true||
              x.restoredNativeGallery!==true||x.cloudRevisionDirtyAfterRestore!==true))
           throw Error('M59 actual native browser photo-only owner privacy receipt invalid');
          console.log('M60 native owner photo-only source + actual v4 atomic restore evidence PASS',e);
          JS
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code f33e6e328ca8e6c98e036b57defa847efd0213ba HEAD -- public/ supabase/ benchmark/ research/multi-garment-capture-01/ research/native-3d-05/ research/parallel89/ research/mission1-parallel88/
      - name: Archive counts only, never private photos or owner credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main1054-m59-native-${{ matrix.engine }}-photo-only-not-release
          path: benchmark/main59-native-photo-only/${{ matrix.engine }}/M59-REAL-NATIVE-PHOTO-ONLY-GALLERY-NOT-RELEASE.json
          retention-days: 14
          if-no-files-found: ignore
