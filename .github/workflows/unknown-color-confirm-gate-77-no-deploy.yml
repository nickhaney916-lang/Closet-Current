name: COLOR77 block case-variant Unknown clothing color native confirmation NO DEPLOY
on:
  push:
    branches:
      - research/unknown-color-confirm-gate-77-main-20261105-HOLD
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-color-review-must-match-owner-private-atomic-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Lock exact verified REMOVE76 ancestor and six allowed research paths
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 7d6bc7a04159763d3450733f185a65a8db8af802 HEAD
          git diff --name-only 7d6bc7a04159763d3450733f185a65a8db8af802 HEAD >/tmp/color77-files
          while IFS= read -r path; do
            case "$path" in
              research/multi-garment-capture-01/scene-class-guard-32.mjs|scripts/test-multi-garment-capture-01-browser.mjs|scripts/audit-unknown-color-confirm-gate-77-browser.mjs|tests/unknown-color-confirm-gate-77.test.mjs|.github/workflows/unknown-color-confirm-gate-77-no-deploy.yml) ;;
              *) echo "BLOCKED unrelated change, production/staging mutation: $path"; exit 1 ;;
            esac
          done </tmp/color77-files
      - name: Install pinned research browser and Node dependencies only
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Complete app build and all inherited plus new actual color consistency Node tests
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Six inherited original licensed JPEG native private mobile browser scenarios
        run: node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Six new native original-JPEG unknown color and corrected human confirm scenarios
        run: COLOR77=1 node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Independent six browser proof and 72 real screenshot cryptographic audit
        run: node scripts/audit-unknown-color-confirm-gate-77-browser.mjs
      - name: Archive sanitized original-JPEG mobile native browser evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLOR77-unknown-color-native-review-protection-HOLD
          path: |
            benchmark/unknown-color-confirm-gate-77/acceptance.json
            benchmark/unknown-color-confirm-gate-77/*.png
          if-no-files-found: warn
          retention-days: 14
