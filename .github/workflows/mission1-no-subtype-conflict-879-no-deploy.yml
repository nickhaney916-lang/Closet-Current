name: Mission 1 P879 no subtype disagreement AI shortcut — NO DEPLOY
on:
  push:
    branches: [research/mission1-no-subtype-disagreement-shortcut-879-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m1-p879-no-subtype-conflict-HOLD
  cancel-in-progress: true
jobs:
  owner-review-subtype-abstention-NO-DEPLOY:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable P878 and exact six-file scope; Family Alpha HOLD
        shell: bash
        run: |
          set -euo pipefail
          BASE=1962449bfe4010fbd8fdc35a4c2723fd9cf34c7a
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | tee /tmp/p879-paths
          test "$(wc -l </tmp/p879-paths)" -eq 6
          while IFS= read -r p; do
            case "$p" in
              public/dual-panel-82.mjs|scripts/test-p82-review-browser.mjs|tests/mission1-disagreement-879.test.mjs|scripts/p879-dual-disagreement-audit.mjs|research/mission1-no-subtype-disagreement-879/REPORT.md|.github/workflows/mission1-no-subtype-conflict-879-no-deploy.yml) ;;
              *) echo "P879_UNAUTHORIZED_PATH $p"; exit 1;;
            esac
          done </tmp/p879-paths
          test -z "$(git diff --name-only "$BASE" HEAD -- public/app.js public/dual-core-82.mjs public/recognition-engine.mjs public/model-arbitration-81.mjs public/dual-worker-82.mjs public/local-worker.mjs public/recognition-confusion-guard.mjs public/cloud-backup.js benchmark supabase)"
          grep -Fq 'const reviewFirst836=true;' public/app.js
          grep -Fq 'Family Alpha HOLD #255 OPEN' research/mission1-no-subtype-disagreement-879/REPORT.md
          echo P879_SCOPE_NO_DEPLOY_PASS
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium webkit
      - name: Offline local builds and full native test suite
        run: |
          set -euo pipefail
          node --check public/dual-panel-82.mjs
          node --check scripts/test-p82-review-browser.mjs
          node --check scripts/p879-dual-disagreement-audit.mjs
          node --check tests/mission1-disagreement-879.test.mjs
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          P79_REQUIRE_DECODER=1 node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
          node scripts/m1-release-evidence-851.mjs | tee /tmp/p879-release
          grep -Fq '"status":"BLOCKED"' /tmp/p879-release
          grep -Fq '"shouldLiftFamilyAlphaHold":false' /tmp/p879-release
      - name: Desktop Chromium/WebKit original photo, owner-safe agreement and disagreements
        run: |
          set -euo pipefail
          node scripts/test-m1-original-photo-browser-865.mjs
          node scripts/test-p82-review-browser.mjs | tee /tmp/p879-desktop
          test "$(grep -c '^P879_SUBTYPE_CONFLICT_MANUAL_ONLY ' /tmp/p879-desktop)" -eq 6
          test "$(grep -c '^P876_EMPIRICAL_CONFUSION_GUARD_DUAL ' /tmp/p879-desktop)" -eq 6
          test "$(grep -c '^P875_SHARED_CATEGORY_RANK_ONLY ' /tmp/p879-desktop)" -eq 6
          test "$(grep -c '^P82_DESKTOP_POLICY_PASS ' /tmp/p879-desktop)" -eq 6
          node scripts/test-m1-owner-pair-admission-846.mjs
          node scripts/test-parallel80-subtype-browser.mjs
  actual-48-public-model-conflict-coverage-NO-DEPLOY:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original photo and pinned model revisions frozen
        shell: bash
        run: |
          set -euo pipefail
          BASE=1962449bfe4010fbd8fdc35a4c2723fd9cf34c7a
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE" HEAD | wc -l)" -eq 6
          test -z "$(git diff --name-only "$BASE" HEAD -- benchmark public/dual-worker-82.mjs public/dual-core-82.mjs public/model-arbitration-81.mjs public/dual-model-lock-82.mjs)"
      - run: npm install --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 playwright@1.56.1 sharp@0.34.3
      - run: npx playwright install --with-deps chromium
      - name: Verify frozen 48 public original source bytes and q8 weights
        run: |
          set -euo pipefail
          IDS=$(node -e "const fs=require('fs');console.log(['benchmark/manifest-reviewed-32.json','benchmark/manifest-holdout-16.json'].flatMap(p=>JSON.parse(fs.readFileSync(p)).map(x=>x.id)).join(','))")
          test "$(printf '%s\n' "$IDS" | tr ',' '\n' | wc -l)" -eq 48
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos "$IDS"
          node scripts/p82-prepare-models.mjs --check
      - name: Genuine model 48-photo inference and source-locked no-new-AI-shortcuts audit
        env:
          P877_FULL_FRAME: '1'
        run: |
          set -euo pipefail
          node scripts/p82-real-browser.mjs chromium benchmark/p879-real-chromium | tee /tmp/p879-originals
          test "$(grep -c '^P82_REAL_BROWSER_ROW chromium ' /tmp/p879-originals)" -eq 48
          node scripts/p878-public-photo-custody.mjs benchmark/p879-real-chromium/results.json benchmark/locked-photo-sources.json benchmark/p879-real-chromium/custody-audit.json | tee /tmp/p879-custody
          grep -Fq '"distinctPhotoDigests":48' /tmp/p879-custody
          node scripts/p879-dual-disagreement-audit.mjs benchmark/p879-real-chromium/results.json benchmark/p879-real-chromium/conflict-audit.json | tee /tmp/p879-audit
          grep -Fq '"photos":48' /tmp/p879-audit
          grep -Fq '"noNewShortcuts":true' /tmp/p879-audit
          grep -Fq '"recognitionAccuracy":null' /tmp/p879-audit
          grep -Fq '"releaseReady":false' /tmp/p879-audit
      - uses: actions/upload-artifact@v4
        with:
          name: p879-public-development-only-dual-conflict-numeric-risk-coverage
          path: benchmark/p879-real-chromium/conflict-audit.json
          if-no-files-found: error
