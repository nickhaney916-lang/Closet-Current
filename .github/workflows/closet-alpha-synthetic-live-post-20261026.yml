name: Staging browser-to-Auth synthetic live POST (NO REAL USER, NO DEPLOY)
on:
  push:
    branches: [audit/closet-alpha-real-post-synthetic-cors-20261026]
    paths: [.github/workflows/closet-alpha-synthetic-live-post-20261026.yml]
permissions:
  contents: read
jobs:
  synthetic-post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGE_PUBLIC_KEY: 'sb_publishable_Tc9eXwg8XTY6rJ0uZBD2VQ_NTGeIUNG'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ephemeral Chromium browser tool
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Synthetic non-account POST test, never emails or credential resets
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const origin='https://closet-current-staging.pages.dev';
          const target='https://fbnplztkbsteuzrmbgib.supabase.co/auth/v1/token?grant_type=password';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          try{
            const page=await browser.newPage();
            await page.route(origin+'/',route=>route.fulfill({status:200,contentType:'text/html',body:'<!doctype html><title>staging synthetic live CORS</title>'}));
            await page.goto(origin+'/',{waitUntil:'load'});
            const diagnostic=await page.evaluate(async ({target,key})=>{
              try{
                const res=await fetch(target,{
                  method:'POST',
                  headers:{apikey:key,'Content-Type':'application/json'},
                  body:JSON.stringify({
                    email:'nonexistent-staging-cors-probe-20261026@example.invalid',
                    password:'nonexistent-synthetic-password-only'
                  }),
                  signal:AbortSignal.timeout(12000)
                });
                const data=await res.json().catch(()=>({}));
                return {resolved:true,httpStatus:res.status,errorCode:String(data.error_code||data.code||'').slice(0,60),mimeType:res.headers.get('content-type')?.split(';')[0]||''};
              }catch(e){return {resolved:false,errorName:String(e?.name||'Error'),messageType:e instanceof TypeError?'type_error':'other'}}
            },{target,key:process.env.STAGE_PUBLIC_KEY});
            console.log('STAGING_CHROMIUM_REAL_AUTH_POST_SYNTHETIC '+JSON.stringify(diagnostic));
            if(!diagnostic.resolved||diagnostic.httpStatus!==400)
              throw Error('Real browser cross-origin POST did not return expected non-user invalid credentials');
            console.log('STAGING_CORS_REAL_POST_SYNTHETIC_PASS_NO_REAL_ACCOUNT_NO_EMAIL');
          }finally{await browser.close()}
          NODE
