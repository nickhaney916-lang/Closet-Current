name: MAIN249 original WebKit JSEP failed attempt same-browser evidence HOLD
on:
  push:
    branches: [research/main249-same-attempt-jsep-failure-identity-HOLD]
permissions:
  contents: read
jobs:
  original-source-security:
    name: M249 original pinned source and entire owner privacy security
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable base and exactly four research-only additions
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=184aec36e43b63097a6e6f563638414cea6b6bec
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE" HEAD)" = "$(printf '%s\n' \
            '.github/workflows/main249-original-failed-jsep-evidence-HOLD.yml' \
            'scripts/main249-original-failed-jsep-source-witness.mjs' \
            'scripts/test-main249-original-failed-jsep-browser.mjs' \
            'tests/main249-original-failed-jsep-evidence.test.mjs')"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          test "$(git rev-parse HEAD:scripts/test-main247-real-p94-jsep-model-heap-browser.mjs)" = 92670c115a42f6408577de4d08d8dea24c263cd2
          node --check scripts/main249-original-failed-jsep-source-witness.mjs
          node --check scripts/test-main249-original-failed-jsep-browser.mjs
          node --check tests/main249-original-failed-jsep-evidence.test.mjs
          node --test tests/main249-original-failed-jsep-evidence.test.mjs
      - name: Pinned original research dependencies
        run: npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Original app build and entire inherited privacy/backup/source test suite
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  genuine-original-webkit-and-controlled-negative:
    name: M249 genuine original JSEP source native
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - {engine: webkit, control: none, width: 390}
          - {engine: webkit, control: model_abort, width: 390}
          - {engine: chromium, control: none, width: 390}
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check original P94 Worker/source unchanged
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-main247-real-p94-jsep-model-heap-browser.mjs)" = 92670c115a42f6408577de4d08d8dea24c263cd2
          node --test tests/main249-original-failed-jsep-evidence.test.mjs
      - name: Install original genuine browser/model dependencies
        run: npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Original pinned SegFormer JSEP, source owner privacy and controlled negative fail closed
        shell: bash
        env:
          M249_ENGINE: ${{ matrix.engine }}
          M249_WIDTH: ${{ matrix.width }}
          M249_CONTROL: ${{ matrix.control }}
        run: |
          set -euo pipefail
          node scripts/test-main249-original-failed-jsep-browser.mjs
