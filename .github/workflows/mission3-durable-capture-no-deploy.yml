name: Mission 3 durable native original capture and import — NO DEPLOY
on:
  push:
    branches: [research/mission3-durable-capture-review-20261110-HOLD]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  durable-camera-import-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact verified Mission 3 cloud parent and camera-only scope
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=288e517bc7dc2b43417a82a6caed427b257eb811
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --exit-code "$BASE" HEAD -- public/auth.js public/cloud-backup.js public/cloud-backup-engine.js supabase public/local-worker.mjs public/recognition-engine.mjs
          git diff --name-only "$BASE" HEAD | while read -r p; do
            case "$p" in
              public/app.js|public/photo-import.js|tests/mission3-capture-commit.test.cjs|research/mission3-durable-capture/REPORT.md|.github/workflows/mission3-durable-capture-no-deploy.yml) ;;
              *) echo "Unexpected Mission 3 capture path: $p"; exit 1 ;;
            esac
          done
      - name: Install pinned browser and IndexedDB test tools
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Reproduce baseline false capture acknowledgement, quota and owner race
        run: |
          git worktree add --detach /tmp/closet-mission3-capture-parent 288e517bc7dc2b43417a82a6caed427b257eb811
          CAPTURE_SOURCE_ROOT=/tmp/closet-mission3-capture-parent EXPECT_BASELINE=1 node --test tests/mission3-capture-commit.test.cjs
      - name: Verify durable owner-pinned capture and native import failure honesty
        run: node --test tests/mission3-capture-commit.test.cjs
      - name: Build and complete serial Node regression
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Genuine Chromium/WebKit photo capture manual review private closet and styling
        run: node scripts/test-native-canonical-original-167-browser.mjs
      - name: Genuine Chromium/WebKit mobile edit quota recovery and accessibility
        run: node scripts/test-family-reliability-mobile.mjs
      - name: Genuine Chromium owner-private reviewed cutout cloud restore
        run: |
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos commons-0002
          node scripts/test-outfit-backup-compatibility-browser.mjs benchmark/mission3-durable-capture-backup
      - name: Keep synthetic test receipts, no hosted data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission3-durable-capture-evidence-HOLD
          path: |
            benchmark/native-canonical-closet-style-167/
            benchmark/family-reliability-mobile/
            benchmark/mission3-durable-capture-backup/
          retention-days: 14
