name: MAIN225 M224 actual M58 protected seven-job compatibility NO DEPLOY HOLD
on:
  push:
    branches: [research/main225-m224-seven-job-protected-compatibility-HOLD]
  pull_request:
    branches: [research/main224-m223-source-crop-and-v3-retired-outfit-joined-HOLD]
permissions:
  contents: read
jobs:
  source-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable exact-source M224 and no other product changes
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=4f3b0002e1f02b9dee9e72817c730ad8af2a3fc1
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE" HEAD)" = ".github/workflows/main225-m224-protected-seven-job-no-deploy.yml"
          test "$(git rev-parse HEAD:public/native-default-atomic-import-m3.mjs)" = 1a4cf649a3656f604c4f3e1d2b1efd7910179edc
          test "$(git rev-parse HEAD:public/native-default-verified-backup-export-m3.mjs)" = af15a9c08a81aa4064d1e5d1c4f0af0d855582c9
          test "$(git rev-parse HEAD:research/multi-garment-capture-01/review-ui.mjs)" = 1bd97b80b51fab1cb269ae565acb73a274b6e6d0
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:public/native-reviewed-private-save-167.mjs)" = fa01c862444c05f8e307f4e7447a75a9ede1ab5e
          test "$(git rev-parse HEAD:tests/main220-retired-outfit-backup-lifecycle.test.mjs)" = 2ec604dbfe5b92ba205d78ca7b572c70af0043d6
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
      - name: Install pinned offline native test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Execute original M58 protected acceptance assertions, unchanged
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node --test tests/main220-retired-outfit-backup-lifecycle.test.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
