name: P1219 pre-fix red and full-process WebKit Chromium preview soak NO DEPLOY
on:
  push:
    branches: [fix/webkit-native-photo-preview-reentry-HOLD]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  p1219-repro-before-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M51_ENGINE: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned local only Chromium source test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 playwright@1.56.1 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Deterministic original app red at exact M4 source WITHOUT touching branches
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD:public/outfit-board.js)" = 8d16533036794735a4bcf675719d2dd5b63700ab
          test "$(git rev-parse HEAD:research/main-thread-integration-1054/native-2d-preview.mjs)" = 0af20d49d87436683630d587ec0284c611cd3414
          BASE=c4e45aa684f7120d216ae4eec192d4085823b073
          git show "$BASE:public/outfit-board.js" > public/outfit-board.js
          test "$(git hash-object public/outfit-board.js)" = 22e76c92dc31d8a10d8186e259a4e3784e4b3c84
          status=0
          node scripts/test-p1219-webkit-native-preview-reentry.mjs >/tmp/p1219-controlled-red.log 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then
            echo "P1219 BLOCKED: pre-fix original app unexpectedly passed strict stale-completion test"
            exit 1
          fi
          if ! grep -Fq 'stale async click erased newer verified owner photo' /tmp/p1219-controlled-red.log || ! grep -Fq 'P1219_NATIVE_STALE_COMPLETION' /tmp/p1219-controlled-red.log; then
            echo "P1219 BLOCKED: pre-fix failed for unrelated reason, not accepted as causal red"
            grep -E 'P1219_NATIVE_|MAIN51_APP_SOURCE_FAIL|AssertionError|Error:|SyntaxError' /tmp/p1219-controlled-red.log | tail -12 || true
            exit 1
          fi
          grep -F 'P1219_NATIVE_STALE_COMPLETION' /tmp/p1219-controlled-red.log | head -1
          echo "P1219_CAUSAL_PRE_PATCH_RED verified on pinned original app; newer photo removed by old click, no unrelated error"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD -- public/app.js public/auth.js public/native-canonical-photo-source-167.mjs supabase/
  p1219-webkit-fresh-process-soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M51_ENGINE: webkit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned browser dependencies without deployment
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 playwright@1.56.1 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Twelve wholly fresh strict native WebKit processes x 320 390 430, NO RETRY
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:public/outfit-board.js)" = 8d16533036794735a4bcf675719d2dd5b63700ab
          for trial in $(seq 1 12); do
            echo "P1219_WEBKIT_PROCESS_BEGIN trial=$trial exactHead=$(git rev-parse HEAD)"
            node scripts/test-p1219-webkit-native-preview-reentry.mjs
            echo "P1219_WEBKIT_PROCESS_STRICT_PASS trial=$trial widths=320,390,430"
          done
          echo "P1219_WEBKIT_SOAK_12_OF_12_FULL_PROCESSES_PASS"
  p1219-webkit-reconcile-source-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
