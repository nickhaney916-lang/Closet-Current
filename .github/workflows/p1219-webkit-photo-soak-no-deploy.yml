      - name: Twelve diagnostic WebKit fresh processes with source-equality-only classification
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:public/outfit-board.js)" = 8d16533036794735a4bcf675719d2dd5b63700ab
          for trial in $(seq 1 12); do
            echo "P1219_WEBKIT_TRACE_PROCESS_BEGIN trial=$trial exactHead=$(git rev-parse HEAD)"
            node scripts/test-p1219-webkit-native-preview-reentry.mjs
            echo "P1219_WEBKIT_TRACE_PROCESS_STRICT_PASS trial=$trial widths=320,390,430"
          done
          echo "P1219_WEBKIT_TRACE_SOAK_12_OF_12_PASS"
  p1219-webkit-viewer-revoke-trace:
