name: Collect licensed benchmark candidates
on:
  push:
    paths:
      - '.github/workflows/collect-photo-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download candidate Commons photos and record attribution
        run: node scripts/collect-commons-photos.mjs 10
      - name: Summarize candidates
        run: |
          node -e "const fs=require('fs');const p='benchmark/candidates.json';const a=JSON.parse(fs.readFileSync(p));console.log('Candidate photos:',a.length);if(a.length===0)process.exitCode=1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commons-clothing-photo-candidates
          path: |
            benchmark/photos/
            benchmark/candidates.json
            benchmark/attributions.json
          if-no-files-found: warn
          retention-days: 7
