name: Assignment 35 wardrobe quality review HOLD
on:
  pull_request:
    branches: [research/main1054-jpeg-exif-fill-byte-HOLD]
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'research/assignment-35-wardrobe-quality-HOLD' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lane: [chromium, webkit, regression]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate and assignment paths
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          base=bba97ce9b6535ed3fd5882501464806560585cdb
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-list --parents -n 1 HEAD)" = "$EXPECTED_HEAD $base"
          test "$(git rev-parse "$base^{tree}")" = 95a36849ed10cde535096c7a300999d7dbe32f4c
          git merge-base --is-ancestor "$base" HEAD
          printf '%s\n' '.github/workflows/assignment-35-wardrobe-quality-HOLD.yml' 'public/app-theme.css' 'public/app.js' 'public/index.html' 'public/wardrobe-quality-review.js' 'scripts/assignment-35/browser.mjs' > "$RUNNER_TEMP/expected-paths"
          git diff --name-only "$base" HEAD > "$RUNNER_TEMP/actual-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: node scripts/build.mjs
      - if: matrix.lane == 'regression'
        run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
      - if: matrix.lane != 'regression'
        env:
          A35_ENGINE: ${{ matrix.lane }}
        run: |
          npx playwright install --with-deps "$A35_ENGINE"
          node scripts/assignment-35/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always() && matrix.lane != 'regression'
        with:
          name: assignment-35-${{ matrix.lane }}-HOLD
          path: benchmark/assignment-35/quality-*.json
          if-no-files-found: warn
