name: MAIN244 real source owner vs original graph HOLD
on:
  push:
    branches: [research/main244-original-owner-vs-native-graph-parity-HOLD]
  pull_request:
    branches: [research/main243-original-segformer-native-heap-witness-HOLD]
permissions:
  contents: read
jobs:
  safety:
    name: M244 exact source, offline build and full privacy regression
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exactly three new paths, original P94 worker immutable
        shell: bash
        run: |
          set -euo pipefail
          BASE=28f2d823d40b5fb27236b8a10330cb96d9e65614
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE" HEAD)" = "$(printf '%s\n' '.github/workflows/main244-original-owner-vs-native-graph-HOLD.yml' 'scripts/test-main244-real-owner-vs-native-graph.mjs' 'tests/main244-dual-original-path-gate.test.mjs')"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-main239-original-ort-grow-target-browser.mjs)" = 47e24a0a8973465ed6207e5465042d13ed3e988e
          test "$(git rev-parse HEAD:scripts/test-main243-original-segformer-native-session-browser.mjs)" = fdfb979ca3783cb362cb5eb909612902af0c3b70
          node --check scripts/test-main244-real-owner-vs-native-graph.mjs
          node --test tests/main244-dual-original-path-gate.test.mjs
          M244_SOURCE_ONLY=1 node scripts/test-main244-real-owner-vs-native-graph.mjs
      - name: Install original pinned runtime and inherited tests
        run: npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Exact pinned npm and full offline regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm view onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 dist.integrity)" = "sha512-0uS76OPgH0hWCPrFKlL8kYVV7ckM7t/36HfbgoFw6Nd0CZVVbQC4PkrR8mBX8LtNUFZO25IQBqV2Hx2ho3FlbQ=="
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  browser:
    name: M244 genuine original owner and graph ${{ matrix.engine }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, chromium]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M244_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact native source and adversarial cross-path tests
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 28f2d823d40b5fb27236b8a10330cb96d9e65614 HEAD
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          node --test tests/main244-dual-original-path-gate.test.mjs
          M244_SOURCE_ONLY=1 node scripts/test-main244-real-owner-vs-native-graph.mjs
      - name: Pinned original SegFormer native and private owner dependencies
        run: npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Two genuine original model source journeys with no retries
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node scripts/test-main244-real-owner-vs-native-graph.mjs
