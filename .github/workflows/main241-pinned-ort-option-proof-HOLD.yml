name: MAIN241 pinned ORT session-option source path audit NO DEPLOY HOLD
on:
  push:
    branches: [research/main241-pinned-ort-option-path-audit-HOLD]
  pull_request:
    branches: [research/main239-grow-target-memory-snapshot-HOLD]
permissions:
  contents: read
jobs:
  pinned-ort-option-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Only three new test or CI paths and immutable original Worker
        shell: bash
        run: |
          set -euo pipefail
          BASE=c107f72863cdff0e6c831dc7ea950ed3749390ca
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE" HEAD)" = "$(printf '%s\n' '.github/workflows/main241-pinned-ort-option-proof-HOLD.yml' 'scripts/main241-pinned-ort-option-path-audit.mjs' 'tests/main241-pinned-ort-option-proof-boundary.test.mjs')"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-parallel101-real-p94-model-init-stage-browser.mjs)" = ad8ab0eb33322a34f8cc3f45a1fe26feff87b2ab
          test "$(git rev-parse HEAD:scripts/main239-grow-target-memory-fixture.mjs)" = 3afb59500cdf7e51b2baf828abe6c5590bccd899
          node --check scripts/main241-pinned-ort-option-path-audit.mjs
          node --test tests/main241-pinned-ort-option-proof-boundary.test.mjs
      - name: Original pinned packages plus inherited offline test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Pinned published package integrity and precise static/native evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          ORT_INTEGRITY="$(npm view onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 dist.integrity)"
          test "$ORT_INTEGRITY" = "sha512-0uS76OPgH0hWCPrFKlL8kYVV7ckM7t/36HfbgoFw6Nd0CZVVbQC4PkrR8mBX8LtNUFZO25IQBqV2Hx2ho3FlbQ=="
          node scripts/main241-pinned-ort-option-path-audit.mjs
      - name: Original offline app build and complete inherited no-deploy owner privacy/security regression
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
