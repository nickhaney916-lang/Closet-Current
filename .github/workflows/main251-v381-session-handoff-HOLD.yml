name: MAIN251 exact Transformers 3.8.1 ONNX JavaScript session-option handoff HOLD
on:
  push:
    branches: [research/main251-actual-v381-session-handoff-source-proof-HOLD]
permissions:
  contents: read
jobs:
  original-session-javascript-handoff:
    name: M251 exact pinned source / original entire no-deploy owner-security tests
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact M250 predecessor, research-only diff and untouched original P94
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=f85aa3eda38c5be2eb3762c296504f9f45e3c11a
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE" HEAD)" = "$(printf '%s\n' \
            '.github/workflows/main251-v381-session-handoff-HOLD.yml' \
            'tests/main251-source-pinned-jsep-session-handoff.test.mjs')"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/main250-original-jsep-mempattern-study.mjs)" = 55325ef58db3e6f5df55499948e708e2e40766f9
          test "$(git rev-parse HEAD:scripts/test-main249-original-failed-jsep-browser.mjs)" = c6f4d42e9e0b26c7adb727b1d1ff1c5999565def
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          node --check tests/main251-source-pinned-jsep-session-handoff.test.mjs
      - name: Install exactly pinned original Transformers 3.8.1 and genuine ORT dependency
        run: npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Verify upstream package integrity and real Git-blob-locked JS option propagation
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm view onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 dist.integrity)" = "sha512-0uS76OPgH0hWCPrFKlL8kYVV7ckM7t/36HfbgoFw6Nd0CZVVbQC4PkrR8mBX8LtNUFZO25IQBqV2Hx2ho3FlbQ=="
          node --test tests/main251-source-pinned-jsep-session-handoff.test.mjs
      - name: Original offline app build and entire inherited source/owner/privacy/backup/security tests
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
