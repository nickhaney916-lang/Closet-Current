name: MAIN250 actual original JSEP post-load synthetic failure evidence HOLD NO DEPLOY
on:
  push:
    branches: [research/main250-post-jsep-synthetic-grow-failure-proof-HOLD]
permissions:
  contents: read
jobs:
  full-original-node:
    name: M250 immutable original P94 Worker and full owner/privacy Node
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact parent and strictly four research-only files
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=c1edc0d53df7c003678f566d10cb40230b5836d8
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE" HEAD)" = "$(printf '%s\n' \
            '.github/workflows/main250-post-jsep-synthetic-fault-HOLD.yml' \
            'scripts/main250-synthetic-after-jsep-grow-witness.mjs' \
            'scripts/test-main250-original-post-jsep-browser.mjs' \
            'tests/main250-post-jsep-synthetic-error.test.mjs')"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          test "$(git rev-parse HEAD:scripts/test-main247-real-p94-jsep-model-heap-browser.mjs)" = 92670c115a42f6408577de4d08d8dea24c263cd2
          test "$(git rev-parse HEAD:scripts/test-main249-original-failed-jsep-browser.mjs)" = c6f4d42e9e0b26c7adb727b1d1ff1c5999565def
          node --check scripts/main250-synthetic-after-jsep-grow-witness.mjs
          node --check scripts/test-main250-original-post-jsep-browser.mjs
          node --check tests/main250-post-jsep-synthetic-error.test.mjs
          node --test tests/main250-post-jsep-synthetic-error.test.mjs
      - name: Install original runtime and full source/privacy dependencies
        run: npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Original offline app build and every inherited source/owner/privacy/security Node test
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  true-original-browsers:
    name: M250 genuine ${{ matrix.engine }} original JSEP / ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - {engine: webkit, mode: none, width: 390}
          - {engine: webkit, mode: after_jsep_grow_throw, width: 390}
          - {engine: chromium, mode: none, width: 390}
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M249_ENGINE: ${{ matrix.engine }}
      M249_WIDTH: ${{ matrix.width }}
      M249_CONTROL: none
      M250_CONTROL: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin unmodified production Worker and actual original model/owner browser source
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          test "$(git rev-parse HEAD:scripts/test-main249-original-failed-jsep-browser.mjs)" = c6f4d42e9e0b26c7adb727b1d1ff1c5999565def
          node --test tests/main250-post-jsep-synthetic-error.test.mjs
      - name: Pinned real native WebKit/Chromium model and owner dependencies
        run: npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Genuine original JSEP binary same-run with synthetic post-JSEP fail-closed check
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-main250-original-post-jsep-browser.mjs
