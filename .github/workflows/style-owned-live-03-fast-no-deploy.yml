name: PHOTO128 two-owner real Postgres RLS and double-JPEG cloud recovery NO DEPLOY
on:
  push:
    branches:
      - research/two-owner-cloud-rls-recovery-128-main-20261106-HOLD
  pull_request:
    branches:
      - research/owner-confirmation-mobile-restore-127-main-20261106-HOLD
    paths:
      - 'research/two-owner-cloud-rls-recovery-128/owner-cloud-cutout-proof.mjs'
      - 'research/two-owner-cloud-rls-recovery-128/local-postgres-bootstrap.sql'
      - 'tests/two-owner-cloud-rls-recovery-128.test.mjs'
      - 'scripts/test-two-owner-postgres-rls-128.mjs'
      - 'research/two-owner-cloud-rls-recovery-128/REPORT.md'
      - '.github/workflows/style-owned-live-03-fast-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reopened-reviewed-original-to-owner-style-node:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Strict independently green P127 parent and exactly SIX P128 research-only paths
        run: |
          BASE=f330db062e4383937571d73ef3d31038c6159709
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          FIRST="$(git rev-list --reverse "$BASE..HEAD" | head -n1)"
          test "$(git rev-parse "$FIRST^")" = "$BASE"
          git diff --name-only "$BASE" HEAD >/tmp/photo128-paths
          while IFS= read -r path; do
            case "$path" in
              research/two-owner-cloud-rls-recovery-128/owner-cloud-cutout-proof.mjs|research/two-owner-cloud-rls-recovery-128/local-postgres-bootstrap.sql|tests/two-owner-cloud-rls-recovery-128.test.mjs|scripts/test-two-owner-postgres-rls-128.mjs|research/two-owner-cloud-rls-recovery-128/REPORT.md|.github/workflows/style-owned-live-03-fast-no-deploy.yml) ;;
              *) echo "REFUSE unauthorized production, staging, authentication, cloud, source fixture, WebGL, humanoid or other project edit: $path"; exit 1 ;;
            esac
          done </tmp/photo128-paths
          test "$(wc -l </tmp/photo128-paths)" -eq 6
          git diff --exit-code "$BASE" HEAD -- public/app.js public/auth.js public/index.html public/cloud-backup.js public/outfit-board.js research/style-owned-live-03 research/restore-atomic-01 research/native-consumer-board-04 public/cloud-backup.js public/cloud-backup-engine.js supabase benchmark/fixtures package.json package-lock.json supabase
      - name: Reuse pinned inherited research dependencies, without lockfile edits
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Real original-byte reviewed-save plus pinned three owned outfits unit acceptance
        run: |
          node --check public/app.js
          node --check scripts/test-reviewed-cutout-owned-style-124-browser.mjs
          node --check tests/reviewed-cutout-owned-style-124.test.mjs
          node --check tests/owner-review-lease-125.test.mjs
          node --check tests/reviewed-cutout-atomic-restore-126.test.mjs
          node --check tests/owner-confirmation-restore-127.test.mjs
          node --check tests/two-owner-cloud-rls-recovery-128.test.mjs
          node --check scripts/test-two-owner-postgres-rls-128.mjs
          node --check research/two-owner-cloud-rls-recovery-128/owner-cloud-cutout-proof.mjs
          node --check scripts/test-owner-confirmation-mobile-restore-127-browser.mjs
          node --check research/restore-atomic-01/native-restore-bridge.mjs
          node --check research/restore-atomic-01/atomic-restore.mjs
          node --check research/style-owned-live-03/native-style-panel.mjs
          node scripts/build.mjs
          node --test tests/reviewed-cutout-owned-style-124.test.mjs tests/owner-review-lease-125.test.mjs tests/reviewed-cutout-atomic-restore-126.test.mjs tests/owner-confirmation-restore-127.test.mjs tests/two-owner-cloud-rls-recovery-128.test.mjs tests/restore-atomic-01.test.mjs
          node --test tests/manual-reviewed-private-save-119.test.mjs tests/reviewed-app-capture-closet-120.test.mjs tests/reviewed-photo-to-three-owned-looks-122.test.mjs tests/reopened-reviewed-closet-style-123.test.mjs tests/style-owned-live-03.test.mjs tests/restore-atomic-01.test.mjs tests/owner-confirmation-restore-127.test.mjs tests/two-owner-cloud-rls-recovery-128.test.mjs
      - name: FULL inherited camera, source, review, styling, saved looks, backup, 3D and privacy Node regressions
        run: node --test tests/*.test.cjs tests/*.test.mjs
      - name: Source audit explicit review, no imaginary outfits or substitute save databases, Family Alpha HOLD
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const app=readFileSync('public/app.js','utf8');
          const r=readFileSync('research/reviewed-cutout-owned-style-124/REPORT.md','utf8');
          for(const term of [
            "get('reviewedStyle122')==='research'&&",
            "get('reviewedCloset123')==='research';",
            "get('reviewedCutout124')==='research';",
            'Owner-reviewed visible cutout · 2D photo only',
            "const reviewedCloset123Active=reviewedStyle122Active&&",
            "persisted.sourcePhotoOriginal!==true",
            "item.reviewProvenance==='explicit-owner-claim-not-independent-review-evidence'",
            'reviewed-closet123',
            "const reviewedStyle122Active=reviewedSave120Active&&",
            'styleJustReviewedPhoto122(item.id,item.sourceSHA256)',
            'persisted.originalPhoto?.sha256!==expectedSHA',
            'persisted.originalPhoto?.image!==persisted.image',
            'await nativeIndex07Refresh()',
            'await panel.selectGarment(itemId)',
            'await panel.generate()',
            'Get 3 outfits with this piece',
            "familyAlpha:'HOLD',releaseAuthorized:false"
          ])assert.ok(app.includes(term),term);
          assert.ok(r.includes('Family Alpha'));
          assert.ok(r.includes('42325786356'));
          assert.ok(r.includes('byte identity'));
          const style=readFileSync('research/style-owned-live-03/native-style-panel.mjs','utf8');
          assert.ok(style.includes('strictJPEGBytes01(row.segmentHint.cutoutImage)'));
          assert.ok(style.includes('cutoutSHA256Verified=true'));
          assert.ok(style.includes('threeDReady:cropped||cutoutSHA256Verified?false:row.threeDReady'));
          const p125=readFileSync('research/owner-review-lease-125/REPORT.md','utf8');
          const p126=readFileSync('research/reviewed-cutout-atomic-restore-126/REPORT.md','utf8');
          const p127=readFileSync('research/owner-confirmation-mobile-restore-127/REPORT.md','utf8');
          const bridge=readFileSync('research/restore-atomic-01/native-restore-bridge.mjs','utf8');
          const p128=readFileSync('research/two-owner-cloud-rls-recovery-128/REPORT.md','utf8');
          const cloudProof=readFileSync('research/two-owner-cloud-rls-recovery-128/owner-cloud-cutout-proof.mjs','utf8');
          const restore=readFileSync('research/restore-atomic-01/atomic-restore.mjs','utf8');
          assert.ok(p125.includes('Family Alpha')&&p125.includes('sourceReviewUnchanged125'));
          assert.ok(p126.includes('Family Alpha')&&p126.includes('verifyReviewedCutouts126'));
          assert.ok(p127.includes('Family Alpha')&&p127.includes('confirm')&&p127.includes('Promise'));
          assert.ok(p128.includes('Family Alpha')&&p128.includes('PostgreSQL')&&p128.includes('signed'));
          for(const part of [
            "const imageKey=k=>k==='image'||k==='cutoutImage'",
            'await validateRestore01(snapshot,{ownerId,mode:\'file\'})',
            'await validateRestore01(restored,{ownerId,mode:\'cloud\'})',
            'realSignedJWTVerified:false',
            "familyAlpha:'HOLD'"
          ])assert.ok(cloudProof.includes(part),part);
          for(const fragment of [
            'const approved=await confirm(',
            'if(approved!==true)return {cancelled:true,originalUntouched:true};',
            'await onRestored();',
            'win.closetCloud?.changed?.();'
          ])assert.ok(bridge.includes(fragment),fragment);
          const callbackAt=bridge.indexOf('await onRestored();');
          const leaseAt=bridge.indexOf('assertLease();',callbackAt);
          const cloudAt=bridge.indexOf('win.closetCloud?.changed?.();',callbackAt);
          assert.ok(callbackAt>=0&&leaseAt>callbackAt&&cloudAt>leaseAt,
            'PHOTO127 post-refresh auth lease must precede cloud dirty notification');
          for(const part of [
            'export async function verifyReviewedCutouts126(value,{ownerId}={})',
            'await photoProof(hint.cutoutImage,{hash:row.cutoutSHA256})',
            'const reviewedCutoutJPEGsVerified=await verifyReviewedCutouts126(value,{ownerId})',
            'assertLease();const target=clone(backup);',
            'await validateRestore01(target,{ownerId});'
          ])assert.ok(restore.includes(part),part);
          assert.ok(style.includes('sourceReviewUnchanged125(initialById.get(item.id),fresh)'));
          assert.ok(style.includes('const finalLease=board.sessionLease()'));
          assert.ok(r.includes('Real signed JWT/cloud RLS')&&
            r.includes('physical Android/iPhone sensors'));
          NODE
      - name: Upload only no-private-photo technical report and test definition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PHOTO128-no-deploy-double-JPEG-owner-cloud-node
          path: |
            research/two-owner-cloud-rls-recovery-128/REPORT.md
            tests/two-owner-cloud-rls-recovery-128.test.mjs
            scripts/test-two-owner-postgres-rls-128.mjs
            research/two-owner-cloud-rls-recovery-128/local-postgres-bootstrap.sql
          retention-days: 14

  genuine-source-photo-to-saved-three-outfits-browser:
    needs: reopened-reviewed-original-to-owner-style-node
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install no-lockfile research browser dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Real app original photo to owner-review to one-tap 3 pinned owned outfit results and V4 source backup
        run: node scripts/test-owner-confirmation-mobile-restore-127-browser.mjs
      - name: Independent browser evidence, original licensed JPEG, swap/save/reopen, owner isolation and no false 3D claims
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,readdirSync,statSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const dir='benchmark/owner-confirmation-mobile-restore-127';
          const res=JSON.parse(readFileSync(dir+'/results.json','utf8'));
          assert.equal(res.priority,'PHOTO127-OWNER-CONFIRMED-MOBILE-CUTOUT-RESTORE');
          assert.equal(res.cases.length,6);
          assert.deepEqual(res.cases.map(x=>[x.engine,x.width]),[
            ['chromium',320],['chromium',390],['chromium',430],
            ['webkit',320],['webkit',390],['webkit',430]
          ]);
          for(const c of res.cases){
            assert.equal(c.threeRealOriginalOwnedLooks,true);
            assert.equal(c.actualPhotoReviewToStyleShortcut,true);
            assert.equal(c.reopenedOwnerClosetShortcut,true);
            assert.equal(c.P119RealCutoutSHAAndOriginalSHA,true);
            assert.equal(c.photoOnlyCutout124,true);
            assert.equal(c.ownerA.reviewedCutout124.independentlyHashedTwice,true);
            assert.equal(c.ownerA.reviewedCutout124.visiblePhotoOnly,true);
            assert.equal(c.ownerA.reviewedCutout124.threeRealOwnedLooks,true);
            assert.equal(c.ownerA.reviewedCutout124.noOutfitAutoSaved,true);
            assert.equal(c.ownerA.reviewedCutout124.realModelSegmentationMeasured,false);
            assert.equal(c.reloadSessionNotRequired,true);
            assert.equal(c.P120OwnerReviewAlreadyComplete,true);
            assert.equal(c.photoDoesNotRequireSecondReview,true);
            assert.equal(c.undoPinCAS,true);
            assert.equal(c.ownerBPrivate,true);
            assert.equal(c.photosUnchanged,true);
            assert.equal(c.restore127?.ownerApprovalDeclineNoWrite,true);
            assert.equal(c.restore127?.nonBooleanApprovalNoWrite,true);
            assert.equal(c.restore127?.tamperedValidJPEGRejected,true);
            assert.equal(c.restore127?.realV4AtomicRestore,true);
            assert.equal(c.restore127?.fullBrowserReload,true);
            assert.equal(c.restore127?.savedOutfitsUnchanged,true);
            assert.equal(c.restore127?.threePinnedOwned2DLooks,true);
            assert.equal(c.restore127?.signedJWTOrCloudRLS,false);
          }
          assert.equal(res.realSignedServerRLS,false);
          assert.equal(res.realPhysicalAndroidOrIphone,false);
          assert.equal(res.arbitraryFitted3D,false);
          assert.equal(res.familyAlpha,'HOLD');
          assert.equal(res.releaseAuthorized,false);
          assert.deepEqual(res.errors,[]);
          assert.deepEqual(res.crashes,[]);
          assert.deepEqual(res.external,[]);
          const screenshots=readdirSync(dir).filter(x=>x.endsWith('.png'));
          assert.equal(screenshots.length,93);
          for(const f of screenshots)assert.ok(statSync(dir+'/'+f).size>6000);
          NODE
      - name: Archive only public-license camera/photo and six browser scenario screenshots NO DEPLOY
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PHOTO128-inherited-mobile-restored-2D-Chromium-WebKit-320-390-430-HOLD
          path: benchmark/owner-confirmation-mobile-restore-127/
          retention-days: 14

  real-postgres-two-owner-rls-128:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: p128-ephemeral-only
          POSTGRES_DB: p128_ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d p128_ephemeral"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      P128_POSTGRES_URL: postgresql://postgres:p128-ephemeral-only@127.0.0.1:5432/p128_ephemeral
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: p128-ephemeral-only
      PGDATABASE: p128_ephemeral
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact independent green P127 ancestor and research-only scope
        run: |
          BASE=f330db062e4383937571d73ef3d31038c6159709
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git diff --name-only "$BASE" HEAD | wc -l)" -eq 6
          git diff --name-only "$BASE" HEAD | while IFS= read -r path; do
            case "$path" in
              research/two-owner-cloud-rls-recovery-128/owner-cloud-cutout-proof.mjs|research/two-owner-cloud-rls-recovery-128/local-postgres-bootstrap.sql|tests/two-owner-cloud-rls-recovery-128.test.mjs|scripts/test-two-owner-postgres-rls-128.mjs|research/two-owner-cloud-rls-recovery-128/REPORT.md|.github/workflows/style-owned-live-03-fast-no-deploy.yml) ;;
              *) echo "REFUSE out-of-scope edit $path"; exit 1;;
            esac
          done
      - name: Install disposable Postgres client and pinned test-only driver
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          npm install --no-save --no-package-lock --no-audit --no-fund pg@8.16.3
      - name: Bootstrap unmodified actual repository RLS SQL into disposable postgres17
        run: |
          psql -v ON_ERROR_STOP=1 -f research/two-owner-cloud-rls-recovery-128/local-postgres-bootstrap.sql
      - name: Execute real Postgres owner A/B RLS, storage, RPC CAS and anon-denial proofs
        run: node scripts/test-two-owner-postgres-rls-128.mjs
      - name: Export only no-user-data technical RLS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PHOTO128-disposable-real-Postgres-RLS-NO-DEPLOY
          path: |
            research/two-owner-cloud-rls-recovery-128/REPORT.md
            research/two-owner-cloud-rls-recovery-128/local-postgres-bootstrap.sql
            scripts/test-two-owner-postgres-rls-128.mjs
          retention-days: 14
