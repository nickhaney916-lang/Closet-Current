name: Main1054 restored session credential acceptance HOLD
on:
  pull_request:
    branches: [research/main1054-unified-controlled-quality-HOLD]
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'research/main1054-restored-session-credential-HOLD' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lane: [chromium, webkit, regression]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact correction source, accepted base and isolated acceptance scope
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          base=dacd2b806a50575265d89df577fd8d522706696c
          candidate=46e3dd50d6d813f3f05396b48774ab3e52a4fbae
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$PR_BASE" = "$base"
          test "$(git rev-parse "$base^{tree}")" = a61f40b0cb3397fd2ba570598910312dcb573641
          git merge-base --is-ancestor "$base" "$candidate"
          git merge-base --is-ancestor "$candidate" HEAD
          printf '%s\n' '.github/workflows/main1054-restored-session-credential-HOLD.yml' 'public/auth.js' 'scripts/main1054-restored-session-browser.mjs' 'tests/auth.test.cjs' > "$RUNNER_TEMP/expected-paths"
          git diff --name-only "$base" HEAD > "$RUNNER_TEMP/actual-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
          test "$(git rev-parse 'HEAD:public/auth.js')" = 'f5b16967b5e38498bb67b78a22646be57f270155'
          test "$(git rev-parse 'HEAD:tests/auth.test.cjs')" = 'ae12d1ccce67ffeb4e71b0728a968253c680f71e'
          test "$(git rev-parse 'HEAD:scripts/main1054-restored-session-browser.mjs')" = '9e9d389b8b2aa03f8b11dd4d10112b8930e8fc3f'
          git log -1 --format='tested commit %H tree %T'
          echo "Application correction source pinned to $candidate"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: node scripts/build.mjs
      - if: matrix.lane == 'regression'
        run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
      - if: matrix.lane != 'regression'
        env:
          A35_ENGINE: ${{ matrix.lane }}
          CC34_ENGINE: ${{ matrix.lane }}
          CC_AUTH_ENGINE: ${{ matrix.lane }}
        run: |
          npx playwright install --with-deps "$A35_ENGINE"
          node scripts/main1054-restored-session-browser.mjs
          node scripts/assignment-34/browser.mjs
          node scripts/assignment-35/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always() && matrix.lane != 'regression'
        with:
          name: assignment-35-${{ matrix.lane }}-HOLD
          path: benchmark/assignment-35/quality-*.json
          if-no-files-found: warn
