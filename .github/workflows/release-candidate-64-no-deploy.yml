name: P64 integrated release candidate build and package NO DEPLOY

on:
  push:
    branches:
      - research/full-application-release-candidate-64-HOLD
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Build static application
        run: node scripts/build.mjs
      - name: Run complete repository Node suite
        run: node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Create package checksum manifest
        run: cd dist && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Upload non-deployable static candidate
        uses: actions/upload-artifact@v4
        with:
          name: Closet-Current-P64-static-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  integrated-owned-style-browser:
    needs: build-test-package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      STYLE_FOCUSED_ENGINE: ${{ matrix.engine }}
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser-test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Verify current camera-attestation to private closet to owned looks flow at 320/390/430
        run: node scripts/test-style-focused-item-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P64-${{ matrix.engine }}-integrated-style-mobile-evidence-HOLD
          path: benchmark/style-focused-item-01/
          if-no-files-found: warn
          retention-days: 14
