name: MAIN199 source-proved shared-photo garment admission NO DEPLOY HOLD
on:
  push:
    branches: [research/main199-verified-cutout-owner-source-gate-HOLD]
  pull_request:
    branches: [research/main193-protected-m58-m192-source-guard-HOLD]
permissions:
  contents: read
jobs:
  strict-native-original-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact M193 donor scope and SHA admission
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=902bfe31e840a4e0dca69acf98ce85eea6a4d088
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse "$BASE:public/native-owner-wardrobe-index-167.mjs")" = 674797958366cc976a1a4abc8073087148d22975
          test "$(git rev-parse "$BASE:research/wardrobe-index-01/owner-wardrobe-index.mjs")" = 5719f83828c119f5210687640cd760ef468f9930
          test "$(git rev-parse HEAD:public/native-owner-wardrobe-index-167.mjs)" = d872c582a9d8e6f319cae4c99f84dbc81ea7f7d3
          test "$(git rev-parse HEAD:research/wardrobe-index-01/owner-wardrobe-index.mjs)" = 60581e3b00f6877bbb424d0c090d9ab294890277
          test "$(git rev-parse HEAD:research/index-04/verified-saved-recognition.mjs)" = b84a47731e8775ac8a8b8d520fcdefc56ea46ba9
          test "$(git rev-parse HEAD:public/native-outfit-source-plan-p99.mjs)" = 0d4972a7fddfcfae0dd811765e4a94b962f4b578
          test "$(git rev-parse HEAD:public/native-2d-preview-p99.mjs)" = 62bad171a97030846b0f1bb3bab740dec20ac5e7
          test "$(git rev-parse HEAD:public/app.js)" = 835b4ad1f4a4a7f520aad5afd225134e5ea56e2d
          test "$(git rev-parse HEAD:scripts/test-parallel99-normal-app-browser.mjs)" = 9b8c3b37d1d8116e4bf9bc6dbf7ea82e2752433d
          git diff --name-only "$BASE" HEAD | while IFS= read -r path; do
            case "$path" in
              public/native-owner-wardrobe-index-167.mjs|research/wardrobe-index-01/owner-wardrobe-index.mjs|tests/main199-source-cutout-owner-proof.test.mjs|tests/wardrobe-index-01.test.mjs|tests/index-04-saved-recognition.test.mjs|tests/multigarment-cutout-byte-116.test.mjs|tests/p87-catalog-crosswalk.test.mjs|research/index-04/verified-saved-recognition.mjs|.github/workflows/main199-source-cutout-owner-proof-no-deploy.yml) ;;
              *) echo "M199 refuses unrelated modification: $path"; exit 1 ;;
            esac
          done
          node --check public/native-owner-wardrobe-index-167.mjs
          node --check research/wardrobe-index-01/owner-wardrobe-index.mjs
          node --check tests/main199-source-cutout-owner-proof.test.mjs
      - name: Install exact native Node and real browser dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Prove missing crop source receipts fail closed and old live receipts survive
        run: node --test tests/main199-source-cutout-owner-proof.test.mjs tests/main190-retired-duplicate-owner-index.test.mjs tests/main188-owner-revoked-outfit-preview.test.mjs
      - name: Real app build and full inherited strict Node regression
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Genuine unmodified Chromium and WebKit normal owner photo journeys
        shell: bash
        run: |
          set -euo pipefail
          for engine in chromium webkit; do
            for width in 320 390 430; do
              echo "M199_NORMAL_NATIVE_BEGIN engine=$engine width=$width"
              P99_ENGINE="$engine" P99_WIDTH="$width" node scripts/test-parallel99-normal-app-browser.mjs
              echo "M199_NORMAL_NATIVE_PASS engine=$engine width=$width"
            done
          done
