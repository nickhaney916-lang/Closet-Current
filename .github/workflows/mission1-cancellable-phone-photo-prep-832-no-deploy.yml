name: M1 P832 cancel-safe original JPEG phone preview — NO DEPLOY
on:
  push:
    branches: [research/mission1-cancellable-phone-photo-prep-832-HOLD]
  pull_request:
    branches: [research/mission1-no-account-trial-package-831-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m1-p832-cancellable-decode-HOLD-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-P831-native-and-no-account-archive-HOLD:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact green P831 parent and ONLY nine original-phone-trial paths
        run: |
          set -euo pipefail
          BASE=90ae1517658be393c41c62f7b57cdad87522344e
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD > /tmp/m1-p832-paths
          cat /tmp/m1-p832-paths
          test "$(wc -l </tmp/m1-p832-paths)" -eq 9
          while IFS= read -r f; do
            case "$f" in
              public/phone-photo-prep-832.mjs|public/phone-photo-check.mjs|public/phone-photo-check.html|scripts/build-m1-no-account-trial-831.mjs|scripts/test-m1-no-account-trial-831.mjs|scripts/run-phone-photo-check.mjs|tests/mission1-cancellable-phone-photo-prep-832.test.mjs|research/mission1-cancellable-phone-photo-prep-832/REPORT.md|.github/workflows/mission1-cancellable-phone-photo-prep-832-no-deploy.yml) ;;
              *) echo "UNAUTHORIZED MAIN, PHOTO MODEL, RLS OR RELEASE EDIT: $f"; exit 1 ;;
            esac
          done </tmp/m1-p832-paths
          test -z "$(git diff --name-only "$BASE" HEAD -- supabase benchmark public/local-worker.mjs public/photo-import.js public/recognition-engine.mjs)"
          grep -Fq 'FAMILY ALPHA HOLD #255' research/mission1-cancellable-phone-photo-prep-832/REPORT.md
          echo M1_P832_EXACT_P831_PARENT_NINE_PATHS_NO_DEPLOY
      - name: Install isolated full Node dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Actual native build, cancellation adversarial and whole Node app
        run: |
          set -euo pipefail
          node --check public/phone-photo-prep-832.mjs
          node --check public/phone-photo-check.mjs
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          node --test scripts/test-m1-no-account-trial-831.mjs
          node --test tests/mission1-cancellable-phone-photo-prep-832.test.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Retain static trial-only non-hosted artifact with SHA manifest (no photos)
        uses: actions/upload-artifact@v4
        with:
          name: mission1-P832-CANCEL-SAFE-OWNER-RECOGNITION-PREVIEW-NOT-HOSTED
          path: benchmark/m1-no-account-trial-831/
          retention-days: 14
          if-no-files-found: error
  genuine-original-worker-mid-decode-cancel-HOLD:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real browser and exact original reviewed positive/negative JPEG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps ${{ matrix.browser }}
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos commons-0001,commons-0090
      - name: No-account trial and REAL pinned original-worker; abort stalled decode without late canvas encoding
        env:
          M1_TRIAL_ROOT: benchmark/m1-no-account-trial-831
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          node --test scripts/test-m1-no-account-trial-831.mjs
          node --test tests/mission1-cancellable-phone-photo-prep-832.test.mjs
          node scripts/run-phone-photo-check.mjs benchmark/phone-photo-flow-${{ matrix.browser }} ${{ matrix.browser }}
      - name: Upload original-model sanitized numeric receipts only, NO photos/screenshots
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mission1-P832-${{ matrix.browser }}-NO-LATE-JPEG-NUMERIC-ONLY-HOLD
          path: |
            benchmark/phone-photo-flow-${{ matrix.browser }}/results.json
            benchmark/phone-photo-flow-${{ matrix.browser }}/summary.json
          retention-days: 14
          if-no-files-found: error
