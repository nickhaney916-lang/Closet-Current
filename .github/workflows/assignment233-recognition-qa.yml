name: Assignment 233 independent recognition safety
on:
  push:
    branches: [work/assignment233-original-recognition-20261023]
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos
      - run: node scripts/build.mjs
      - name: Full regression twice, including avatar and all recognition tests
        run: |
          node --test tests/*.test.cjs tests/*.test.mjs tests/avatar/*.test.mjs
          node --test tests/*.test.cjs tests/*.test.mjs tests/avatar/*.test.mjs
      - name: Preserve application integration, model, ground truth and cloud source
        run: git diff --exit-code b06f606b0cbd4ecf9e10875a8b6188111a069011 HEAD -- public/app.js public/auth.js public/recognition-photo.mjs public/recognition-vectors.json public/recognition-vectors.bin supabase benchmark/fixtures benchmark/locked-photo-sources.json benchmark/manifest-reviewed-32.json benchmark/manifest-holdout-16.json benchmark/manifest-fresh-11.json
  native-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/fixtures
      - run: node scripts/build.mjs
      - name: Native original photos, repeated baseline and candidate inference
        run: |
          node scripts/run-source-locked-recognition.mjs artifacts/assignment233/run1
          node scripts/check-assignment233-recognition.mjs artifacts/assignment233/run1
          node scripts/run-source-locked-recognition.mjs artifacts/assignment233/run2
          node scripts/check-assignment233-recognition.mjs artifacts/assignment233/run2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assignment233-native-photo-evidence
          path: artifacts/assignment233
          retention-days: 14
  mobile-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos
      - run: node scripts/build.mjs
      - name: Original-source crop, duplicate indexing, offline triage and owned outfit controls
        run: |
          node scripts/test-original-crop-source-mobile.mjs
          node scripts/test-original-source-duplicate-mobile.mjs
          node scripts/test-phone-recognition-triage-browsers.mjs
          node scripts/test-issue201-outfit-browsers.mjs
          node scripts/test-saved-figure-originals-browsers.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assignment233-mobile-browser-evidence
          path: artifacts/
          retention-days: 14
