name: Mission 3 owner-private photo Storage reference and SHA integrity — NO DEPLOY
on:
  push:
    branches: [research/mission3-owner-storage-ref-integrity-20261110-HOLD]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-storage-reference-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect exact verified Mission 3 parent, other missions, hosted projects and no deployments
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=2ef3202ee60a13ef0d61c6493a1da02dd2ad7224
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --exit-code "$BASE" HEAD -- public/auth.js public/app.js public/photo-import.js public/cloud-backup-engine.js supabase public/local-worker.mjs public/recognition-engine.mjs
          git diff --name-only "$BASE" HEAD | while read -r p; do
            case "$p" in
              public/cloud-backup.js|tests/mission3-owner-photo-reference-guard.test.cjs|scripts/test-mission3-owner-photo-ref-browser.mjs|research/mission3-owner-storage-references/REPORT.md|.github/workflows/mission3-owner-storage-ref-no-deploy.yml) ;;
              *) echo "Unexpected Mission 3 owner-photo-reference file: $p"; exit 1 ;;
            esac
          done
      - name: Install pinned Node browser and synthetic IndexedDB test dependencies
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Reproduce exact parent unsafe foreign photo refs published into current owner cloud
        run: |
          git worktree add --detach /tmp/closet-mission3-storage-ref-parent 2ef3202ee60a13ef0d61c6493a1da02dd2ad7224
          CLOUD_SOURCE_ROOT=/tmp/closet-mission3-storage-ref-parent EXPECT_BASELINE=1 node --test tests/mission3-owner-photo-reference-guard.test.cjs
      - name: Validate repaired private Storage SHA paths, inline cutouts, and legacy compatibility
        run: node --test tests/mission3-owner-photo-reference-guard.test.cjs
      - name: Build and execute entire serial application Node regression
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Actual Chromium/WebKit 320 390 430 owner private photo reference rejection and recovery
        run: node scripts/test-mission3-owner-photo-ref-browser.mjs benchmark/mission3-owner-storage-ref-browser
      - name: Actual Chromium/WebKit 320 390 430 owner tags and private cloud draft rejection
        run: node scripts/test-mission3-signed-owner-document-browser.mjs benchmark/mission3-storage-ref-owner-browser
      - name: Actual Chromium/WebKit 320 390 430 revision-first 1000-piece cloud checks
        run: node scripts/test-mission3-revision-first-browser.mjs benchmark/mission3-storage-ref-revision-browser
      - name: Actual Chromium/WebKit 320 390 430 durable 413 507 owner recovery
        run: node scripts/test-mission3-durable-capacity-browser.mjs benchmark/mission3-storage-ref-capacity-browser
      - name: Actual Chromium/WebKit 320 390 430 atomic device quota rollback
        run: node scripts/test-mission3-device-quota-restore-browser.mjs benchmark/mission3-storage-ref-quota-browser
      - name: Actual Chromium private original and reviewed cutout cross-browser backup restore
        run: |
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos commons-0002
          node scripts/test-outfit-backup-compatibility-browser.mjs benchmark/mission3-storage-ref-cloud-browser
      - name: Actual Chromium and WebKit native photo to private closet styling
        run: node scripts/test-native-canonical-original-167-browser.mjs
      - name: Actual Chromium and WebKit mobile quota recovery and accessibility
        run: node scripts/test-family-reliability-mobile.mjs
      - name: Retain synthetic fixture acceptance receipts and screenshots only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission3-owner-storage-refs-evidence-HOLD
          path: |
            benchmark/mission3-owner-storage-ref-browser/
            benchmark/mission3-storage-ref-owner-browser/
            benchmark/mission3-storage-ref-revision-browser/
            benchmark/mission3-storage-ref-capacity-browser/
            benchmark/mission3-storage-ref-quota-browser/
            benchmark/mission3-storage-ref-cloud-browser/
            benchmark/native-canonical-closet-style-167/
            benchmark/family-reliability-mobile/
          retention-days: 14
