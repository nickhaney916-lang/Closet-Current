name: MAIN1054 owner outfit wear history HOLD
on:
  pull_request:
    branches: [research/main1054-personal-wardrobe-paging-HOLD]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/main1054-outfit-wear-history-HOLD'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        check: [regression, chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: node scripts/build.mjs
      - run: node --test tests/p1656-outfit-wear.test.cjs
      - if: matrix.check == 'regression'
        run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
      - if: matrix.check != 'regression'
        env:
          P99_ENGINE: ${{ matrix.check }}
        run: |
          set -euo pipefail
          npx playwright install --with-deps "$P99_ENGINE"
          for width in 320 390 430; do
            P99_WIDTH="$width" node scripts/p1656-native-wear.cjs
          done
