name: CC-PAR-03 source-true dress tailoring and 108 genuine WebGL frames (HOLD NO DEPLOY)
on:
  pull_request:
    paths:
      - 'research/three-d-74/**'
      - 'research/three-d-15/outfit-controller.mjs'
      - 'research/three-d-15/showroom.mjs'
      - 'research/three-d-15/demo.mjs'
      - 'tests/three-d-74-source-dress.test.mjs'
      - 'scripts/test-three-d-74-dress-webgl.mjs'
      - '.github/workflows/three-d-74-dress-source-no-deploy.yml'
permissions:
  contents: read
jobs:
  source-true-dress:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Enforce exact PR480 origin and dress-only research paths
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor d37a68faec58614f46896b50933bc6769a5977d7 HEAD
          git diff --name-only d37a68faec58614f46896b50933bc6769a5977d7 HEAD | while IFS= read -r file; do
            case "$file" in
              research/three-d-74/*|research/three-d-15/outfit-controller.mjs|research/three-d-15/showroom.mjs|research/three-d-15/demo.mjs|tests/three-d-74-source-dress.test.mjs|scripts/test-three-d-74-dress-webgl.mjs|.github/workflows/three-d-74-dress-source-no-deploy.yml|docs/three-d-74-dress-handoff.md) ;;
              *) echo "BLOCKED unrelated source/app/account/photo/denim work: $file"; exit 1 ;;
            esac
          done
      - name: Install pinned offline research dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 three@0.180.0 playwright@1.56.1 three-mesh-bvh@0.9.2
      - name: Prepare exact original licensed Work47 source, byte hashes and original source 163-bone male/female
        run: |
          git fetch --no-tags origin 53f2ad344dc56a1477e343531c423aed0e66c17d dd6bac3fa9ff640d4f562cf925337440bdb5cf8f 3a572193987cb29389727426136c6eb3ac326783 dfb40889c4c1221fb1833b859e8a11ef38aeb76e
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
      - name: Test source-true 3D dress finite geometry, upper-body invariants, and both exact licensed humanoids
        run: |
          node --check research/three-d-74/source-true-dress-tailoring.mjs
          node --check scripts/test-three-d-74-dress-webgl.mjs
          node --test tests/three-d-74-source-dress.test.mjs
          node --test tests/three-d-27-skirt-drape.test.mjs tests/three-d-24-dress-fit.test.mjs
      - name: Capture actual source original dress before/after in 108 headless WebGL screenshots, all 9 positions and 3 widths
        run: node scripts/test-three-d-74-dress-webgl.mjs
      - name: Assert honest source acceptance and 108 real frames
        run: |
          node --input-type=module <<'VERIFY'
          import assert from 'node:assert/strict';
          import {readdirSync,readFileSync} from 'node:fs';
          const path='benchmark/three-d-74',r=JSON.parse(readFileSync(path+'/results.json','utf8'));
          assert.equal(r.actualScreenshotCount,108);
          assert.equal(r.frames.length,108);
          assert.equal(new Set(r.frames.map(x=>x.file)).size,108);
          assert.equal(readdirSync(path).filter(x=>x.endsWith('.png')).length,108);
          assert.equal(r.results.length,6);
          assert.equal(r.dressSourceIdentity,'PASS');
          assert.equal(r.sourceNeutralRearRealism,'FAIL');
          assert.equal(r.humanPhotorealism,'REVIEW');
          assert.equal(r.physicalAndroid,'NOT TESTED');
          assert.equal(r.physicalIPhone,'NOT TESTED');
          assert.equal(r.releaseAuthorized,false);
          assert.equal(r.familyAlpha,'HOLD');
          for(const v of r.results) {
            assert.ok(v.changedVertices>=100);
            assert.ok(v.changedPixelsByAngle['90']>15);
            assert.ok(v.changedPixelsByAngle['180']>15);
          }
          VERIFY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CC-PAR-03-3D74-GENUINE-PHOTO-DRESS-108-WEBGL-HOLD
          path: benchmark/three-d-74/
          if-no-files-found: warn
