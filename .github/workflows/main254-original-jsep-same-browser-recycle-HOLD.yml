name: MAIN254 original JSEP same-process browser context recycle HOLD
on:
  push:
    branches: [research/main254-original-jsep-same-browser-recycle-HOLD]
permissions:
  contents: read
jobs:
  original-sources-and-security:
    name: M254 original immutable P94 / complete Node photo-owner-private security
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fixed original native M251 source and exactly FOUR new research-only paths
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=2ee136d3ee78f5a57554a022efb8ce943b8edf5c
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE" HEAD)" = "$(printf '%s\n' \
            '.github/workflows/main254-original-jsep-same-browser-recycle-HOLD.yml' \
            'scripts/main254-original-jsep-same-browser-recycle.mjs' \
            'scripts/run-main254-original-jsep-same-browser-recycle.mjs' \
            'tests/main254-original-jsep-same-browser-recycle.test.mjs')"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-main251-original-jsep-native-option-browser.mjs)" = 887e1e8fa6cc24919450f53612dc6b35b3a1aefe
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          node --check scripts/main254-original-jsep-same-browser-recycle.mjs
          node --check scripts/run-main254-original-jsep-same-browser-recycle.mjs
          node --check tests/main254-original-jsep-same-browser-recycle.test.mjs
          node --test tests/main254-original-jsep-same-browser-recycle.test.mjs
      - name: Install exact original pinned public JSEP libraries
        run: npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Original pinned public JSEP export and owner-context source-only checks
        shell: bash
        run: |
          set -euo pipefail
          node scripts/main251-original-jsep-abi-probe.mjs
          M254_SOURCE_ONLY=1 M254_ENGINE=webkit M254_WIDTH=390 node scripts/run-main254-original-jsep-same-browser-recycle.mjs
      - name: Entire original offline app build plus all inherited owner/privacy/photo/security Node tests
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs

  original-same-process-real-browser:
    name: M254 genuine ${{ matrix.engine }} ${{ matrix.width }} x2 contexts ONE browser
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        include:
          - {engine: webkit, width: 320}
          - {engine: webkit, width: 390}
          - {engine: chromium, width: 390}
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M254_ENGINE: ${{ matrix.engine }}
      M254_WIDTH: ${{ matrix.width }}
      M254_SOURCE_ONLY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original consumer Worker/owner source immutable
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-main251-original-jsep-native-option-browser.mjs)" = 887e1e8fa6cc24919450f53612dc6b35b3a1aefe
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          node --check scripts/run-main254-original-jsep-same-browser-recycle.mjs
      - name: Exact pinned original native WebKit/Chromium model runtime and owner fixture
        run: npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Two original pinned JSEP native model+owner journeys in ONE browser; preserve real failure
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          M254_SOURCE_ONLY=1 node scripts/run-main254-original-jsep-same-browser-recycle.mjs
          node scripts/run-main254-original-jsep-same-browser-recycle.mjs
