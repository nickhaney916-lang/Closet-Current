name: Family Alpha complete avatar with STAGING-ONLY Auth/backup route fence (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'scripts/build-family-alpha-full-stage-routing-hold.mjs'
      - 'tests/integration/family-alpha-full-stage-routing-hold.test.mjs'
      - 'docs/FAMILY-ALPHA-FULL-STAGE-ROUTE-HOLD-20261027.md'
      - '.github/workflows/family-alpha-full-stage-route-fence-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pin-and-refuse-production-network:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch exact immutable safe photo/atomic-save/style/face sources
        run: |
          git fetch --no-tags origin 0fb6ab04ab79c36d449acee21aaaf4318871d647 879f1b92fb15f9bc9a7f0429c7ee178f7bbf1373 795ad6637f8d4f782bc99751211b25e8e72a3a7d 08ed6ac4a3fc921eae5d5d3df3bd3966429559d2 1ecac1079e75f1f25dc70a4c712b2448eb87dca8 d0ff131a4e5617e1a3f4fcfb40d00602fdce9833 68bed0c0f0f25538d0d5a00fbaf9aa34d80b8663 97397e80a7cf66e5e656c5b74c924a51e50f0f6f 44f288dfdcfa02ec5b2cf89a7c79c08cfcaa3584 e75cd4689356ae468a88504ddb25df4b4ff6cb70 c86f48f0119329e4001002304e2dfe480815b099 100ffc194793470c871f2b0c6092bc59f1c583b8 77d9f5b83eae475cd8d5d35593c1dc9c2e6bf02f
      - name: Rebuild approved development ancestors (never stage deploy)
        run: |
          node scripts/build-family-alpha-staging-auth-hold.mjs
          node scripts/build-family-alpha-recognition-integrated-hold.mjs
          node scripts/build-family-alpha-protected-preview-hold.mjs
          node scripts/build-family-alpha-29-hold.mjs
          node scripts/build-family-alpha-31-hold.mjs
          node scripts/build-family-alpha-refined-avatar-integration-hold.mjs
          node scripts/build-family-alpha-34-storage-hold.mjs
          node scripts/build-family-alpha-35-visual-repair-hold.mjs
          node scripts/build-family-alpha-36-rigid-fit-hold.mjs
      - name: Build full Family Alpha with all stage network Auth/cloud gates CLOSED
        run: node scripts/build-family-alpha-full-stage-routing-hold.mjs
      - name: Prove original owner app assets intact and runtime cannot fetch or fall back to production
        run: node --test tests/integration/family-alpha-full-stage-routing-hold.test.mjs
      - name: Verify Auth/Cloud disabled despite passing source tests
        run: |
          node --input-type=module -e "import {assertFullStagingRoutingHOLD} from './scripts/build-family-alpha-full-stage-routing-hold.mjs';const x=await assertFullStagingRoutingHOLD();if(x.releaseGate!=='HOLD'||x.authEnabled||x.cloudEnabled||x.releaseAuthorized||x.liveJwtIsolationProved)process.exit(1);console.log('FULL INTEGRATION HELD: STAGING-ONLY ROUTES, NO PUBLISHABLE KEY, NO AUTH, NO PROD NETWORK');"
