name: Real garment segmentation benchmark
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run-real-segmentation-benchmark.mjs'
      - 'benchmark/mask-components.mjs'
      - 'tests/mask-components.test.mjs'
      - '.github/workflows/real-segmentation-benchmark.yml'
      - 'benchmark/segmentation-review-manifest.json'
      - 'benchmark/garment-mask-metrics.mjs'
      - 'tests/garment-mask-metrics.test.mjs'
      - 'benchmark/approve-garment-mask.html'
      - 'scripts/test-independent-mask-approval.mjs'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install benchmark browser
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Check segmentation fragments and approved-reference metrics
        run: node --test tests/mask-components.test.mjs tests/garment-mask-metrics.test.mjs
      - name: Download verified real photos
        run: node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos commons-0035,commons-0049,commons-0053,commons-0065,commons-0079,commons-0094
      - name: Generate model masks and score only independently approved outlines
        run: node scripts/run-real-segmentation-benchmark.mjs benchmark/segmentation-predictions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-segmentation-benchmark
          path: benchmark/segmentation-predictions/
          retention-days: 14
