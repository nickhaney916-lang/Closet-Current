name: Assignment 10 owned outfit diversity - NO DEPLOY
on:
  push:
    branches: [work/assignment10-owned-outfit-diversity-20261023]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/build.mjs
      - run: node --test tests/*.test.cjs tests/*.test.mjs
      - run: node scripts/issue201-outfit-benchmark.mjs artifacts/assignment10/locked-outfit-gate.json
      - name: Independent pinned before/after diversity comparison
        run: |
          node --input-type=module - <<'JS'
          import {run} from './benchmark/assignment10-owned-diversity.mjs';
          import {writeFileSync} from 'node:fs';
          const result=run(); console.log(JSON.stringify(result));
          writeFileSync('artifacts/assignment10/diversity-report.json',JSON.stringify(result,null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assignment10-SYNTHETIC-REGRESSION-NO-DEPLOY
          path: artifacts/assignment10/
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - run: node scripts/build.mjs
      - run: node scripts/test-issue201-outfit-browsers.mjs
      - run: node scripts/test-assignment10-owned-diversity-browsers.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assignment10-SYNTHETIC-BROWSERS-NO-DEPLOY
          path: artifacts/
