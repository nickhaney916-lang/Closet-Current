name: Mission1 real-photo original-source cross-frame subtype safety NO DEPLOY
on:
  push:
    branches:
      - research/mission1-crossframe-type-safety-20261109-HOLD
    paths:
      - public/recognition-confusion-guard.mjs
      - public/local-worker.mjs
      - scripts/compare-mission1-guard.mjs
      - tests/mission1-crossframe-guard.test.mjs
      - tests/mission1-confusion-comparison.test.mjs
      - research/mission1-crossframe-review/REPORT.md
      - .github/workflows/mission1-crossframe-subtype-no-deploy.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mission1-crossframe-research-HOLD-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-source-and-full-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exactly pinned verified P764 parent and 7 scoped research changes ONLY
        run: |
          set -euo pipefail
          BASE=b6679364edbe89cef37d51c01d9b0931fb0602e9
          git fetch --depth=1 origin "$BASE"
          test "$(git rev-parse "$BASE")" = "$BASE"
          git diff --name-only "$BASE" "$GITHUB_SHA" > /tmp/mission1-safety-scoped
          cat /tmp/mission1-safety-scoped
          test "$(wc -l </tmp/mission1-safety-scoped)" -eq 7
          while read -r p; do
            case "$p" in
              public/recognition-confusion-guard.mjs|public/local-worker.mjs|scripts/compare-mission1-guard.mjs|tests/mission1-crossframe-guard.test.mjs|tests/mission1-confusion-comparison.test.mjs|research/mission1-crossframe-review/REPORT.md|.github/workflows/mission1-crossframe-subtype-no-deploy.yml) ;;
              *) echo "Research isolation refuses unexpected edit: $p"; exit 1 ;;
            esac
          done </tmp/mission1-safety-scoped
          test -z "$(git diff --name-only "$BASE" "$GITHUB_SHA" -- supabase)"
          echo MISSION1_7_SAFETY_RESEARCH_PATHS_ONLY_NO_DEPLOY
      - name: Install existing test libraries (ephemeral runner only)
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Build and exact source proof before PWA tests
        run: |
          set -euo pipefail
          node --check public/local-worker.mjs
          node --check public/recognition-confusion-guard.mjs
          node --check scripts/compare-mission1-guard.mjs
          node scripts/build.mjs
      - name: Focused real-subtype safety and adversarial before-after tests
        run: |
          node --test tests/mission1-crossframe-guard.test.mjs tests/mission1-confusion-comparison.test.mjs tests/mission1-real-photo-evidence.test.mjs
      - name: Complete original application regressions without changing test expectations
        run: node --test tests/*.test.cjs tests/*.test.mjs
  real-chromium-before-after:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install actual SHA-locked 59 licensed image inputs and Chromium
        run: |
          set -euo pipefail
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json
          test "$(find benchmark/photos -maxdepth 1 -name '*.jpg' | wc -l)" -eq 59
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Disposable built application and pinned original unchanged worker baseline
        run: |
          set -euo pipefail
          node scripts/build.mjs
          mkdir -p benchmark/mission1-crossframe/before benchmark/mission1-crossframe/after
          cp dist/local-worker.mjs /tmp/mission1-guarded-worker.mjs
          git show b6679364edbe89cef37d51c01d9b0931fb0602e9:public/local-worker.mjs > dist/local-worker.mjs
          sha256sum dist/local-worker.mjs /tmp/mission1-guarded-worker.mjs | tee benchmark/mission1-crossframe/worker-identity.txt
      - name: Baseline genuine FashionCLIP model on 32 curated photos
        run: node scripts/run-browser-photo-benchmark.mjs benchmark/manifest-reviewed-32.json benchmark/mission1-crossframe/before/curated
      - name: Baseline same model on 16 disjoint holdout (including 3 negatives)
        run: node scripts/run-browser-photo-benchmark.mjs benchmark/manifest-holdout-16.json benchmark/mission1-crossframe/before/holdout
      - name: Baseline same model on 11 fresh licensed photographs
        run: node scripts/run-browser-photo-benchmark.mjs benchmark/manifest-fresh-11.json benchmark/mission1-crossframe/before/fresh
      - name: Restore exact guarded research worker in ephemeral build only
        run: |
          cp /tmp/mission1-guarded-worker.mjs dist/local-worker.mjs
          sha256sum dist/local-worker.mjs
      - name: Guarded real model on the EXACT SAME 32 curated JPEGs
        run: node scripts/run-browser-photo-benchmark.mjs benchmark/manifest-reviewed-32.json benchmark/mission1-crossframe/after/curated
      - name: Guarded real model on the EXACT SAME 16 heldout JPEGs
        run: node scripts/run-browser-photo-benchmark.mjs benchmark/manifest-holdout-16.json benchmark/mission1-crossframe/after/holdout
      - name: Guarded real model on the EXACT SAME 11 fresh JPEGs
        run: node scripts/run-browser-photo-benchmark.mjs benchmark/manifest-fresh-11.json benchmark/mission1-crossframe/after/fresh
      - name: Independent byte-SHA photo scoring of BOTH real inference runs
        run: |
          set -euo pipefail
          node scripts/audit-mission1-real-photos.mjs live-browser-ci benchmark/mission1-crossframe/before/curated/results.json benchmark/mission1-crossframe/before/holdout/results.json benchmark/mission1-crossframe/before/fresh/results.json > benchmark/mission1-crossframe/before/evidence.json
          node scripts/audit-mission1-real-photos.mjs live-browser-ci benchmark/mission1-crossframe/after/curated/results.json benchmark/mission1-crossframe/after/holdout/results.json benchmark/mission1-crossframe/after/fresh/results.json > benchmark/mission1-crossframe/after/evidence.json
      - name: Prove wrong automatic indexing decreases without changing other garment types
        run: |
          set -euo pipefail
          node scripts/compare-mission1-guard.mjs benchmark/manifest-reviewed-32.json benchmark/manifest-holdout-16.json benchmark/manifest-fresh-11.json benchmark/mission1-crossframe/before/curated/results.json benchmark/mission1-crossframe/before/holdout/results.json benchmark/mission1-crossframe/before/fresh/results.json benchmark/mission1-crossframe/after/curated/results.json benchmark/mission1-crossframe/after/holdout/results.json benchmark/mission1-crossframe/after/fresh/results.json > benchmark/mission1-crossframe/comparison.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const c=JSON.parse(readFileSync('benchmark/mission1-crossframe/comparison.json'));
          console.log('MISSION1_REAL_MODEL_SOURCE_FRAME_BEFORE_AFTER',JSON.stringify(c.summary));
          console.log('MISSION1_BREAKDOWN',JSON.stringify(c.breakdown));
          assert.equal(c.summary.totalPhotos,59);
          assert.equal(c.summary.garmentPhotos,56);
          assert.equal(c.summary.negativesRejected,3);
          assert.ok(c.summary.after.unsafeAutomatic<c.summary.before.unsafeAutomatic);
          assert.equal(c.independentlyUnseenHoldout,false);
          assert.equal(c.humanGroundTruthIndependentlyAdjudicated,false);
          assert.equal(c.familyAlpha,'HOLD');
          console.log('MISSION1_59_GENUINE_CHROMIUM_DIAGNOSTIC_SAFETY_IMPROVED_NOT_RELEASE_PASS');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission1-original-source-two-view-59-real-inference-A-B-HOLD
          path: benchmark/mission1-crossframe/
          retention-days: 14
          if-no-files-found: warn
