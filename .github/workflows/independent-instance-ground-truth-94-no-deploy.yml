name: INSTANCE94 genuine licensed photo individual garment masks NO DEPLOY
on:
  push:
    branches:
      - research/independent-instance-ground-truth-94-main-20261105-HOLD
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-locked-independent-human-mask-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Strict exact verified Priority 93 parent and research-only path gate
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=1a6a67919f3b4a90c5c18d6a1bdc7ea92c07e42c
          git merge-base --is-ancestor "$BASE" HEAD
          FIRST=$(git rev-list --reverse "$BASE..HEAD" | head -n1)
          test "$(git rev-parse "$FIRST^")" = "$BASE"
          git diff --name-only "$BASE" HEAD > /tmp/instance94-changed
          while IFS= read -r path; do
            case "$path" in
              research/independent-instance-ground-truth-94/instance-evidence.mjs|research/independent-instance-ground-truth-94/annotate.html|research/independent-instance-ground-truth-94/REPORT.md|scripts/build-independent-instance-packets-94.mjs|scripts/test-independent-instance-94-browser.mjs|scripts/audit-independent-instance-94-browser.mjs|tests/independent-instance-ground-truth-94.test.mjs|.github/workflows/independent-instance-ground-truth-94-no-deploy.yml) ;;
              *) echo "BLOCKED app/production/staging/other parallel source: $path"; exit 1 ;;
            esac
          done </tmp/instance94-changed
          test "$(wc -l </tmp/instance94-changed)" -eq 8
      - name: Pinned test-only Chromium WebKit Sharp and existing app dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Full app build and all inherited and INSTANCE94 scientific integrity tests
        run: |
          node --check research/independent-instance-ground-truth-94/instance-evidence.mjs
          node --check scripts/build-independent-instance-packets-94.mjs
          node --check scripts/test-independent-instance-94-browser.mjs
          node --check scripts/audit-independent-instance-94-browser.mjs
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: SHA verify all 59 original licensed JPEGs and generate A B C BLANK mask packets
        run: node scripts/build-independent-instance-packets-94.mjs
      - name: Actual original photo annotation UI Chromium and WebKit widths 320 390 430
        run: node scripts/test-independent-instance-94-browser.mjs
      - name: Independently audit screenshot hashes and 59 original blind packet source receipts
        run: node scripts/audit-independent-instance-94-browser.mjs
      - name: Never invent human scientific accuracy or change Family Alpha HOLD
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const build=JSON.parse(readFileSync('benchmark/independent-instance-ground-truth-94/build-audit.json','utf8'));
          const browser=JSON.parse(readFileSync('benchmark/independent-instance-ground-truth-94/browser-evidence/results.json','utf8'));
          assert.equal(build.verifiedLicensedRealJPEGs,59);
          assert.equal(build.independentHumanMaskReviews,0);
          assert.equal(build.independentlyAcceptedInstanceMasks,0);
          assert.equal(build.actualModelInstanceIoUMeasured,false);
          assert.equal(build.scientificVerdict,'NEEDS_REAL_INDEPENDENT_MASK_ANNOTATION');
          assert.equal(browser.actualIndependentHumanReviewers,0);
          assert.equal(browser.modelInstanceAccuracyMeasured,false);
          assert.equal(browser.caseCount,6);
          assert.equal(browser.screenshots.length,20);
          assert.equal(browser.releaseAuthorized,false);
          assert.equal(browser.familyAlpha,'HOLD');
          console.log('INSTANCE94 ENGINEERING QA: licensed JPEG source-bound per-instance human annotation UI PASS; SCIENTIFIC accuracy NEEDS REAL HUMAN TRUTH. NO DEPLOY.');
          NODE
      - name: Archive source rights and sanitized mobile original-photo annotation screenshot QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: INSTANCE94-59-verified-originals-20-mobile-screenshots-HOLD-NO-DEPLOY
          path: |
            research/independent-instance-ground-truth-94/REPORT.md
            benchmark/locked-photo-sources.json
            benchmark/independent-instance-ground-truth-94/build-audit.json
            benchmark/independent-instance-ground-truth-94/browser-evidence/results.json
            benchmark/independent-instance-ground-truth-94/browser-evidence/*.png
          if-no-files-found: warn
          retention-days: 14
