name: MAIN178 WebKit P88 genuine model diagnosis NO DEPLOY HOLD
on:
  push:
    branches: [research/main178-webkit-p88-rootcause-HOLD]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  native-webkit-real-segformer-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M178_PROBE_COUNT: '2'
      M178_ORIGINAL_P94_PRELUDE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source honesty original M177 and P88 owner and model SHA pins
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 50bdd6c29be52e477bfdf8344ca9e8ffad85372e HEAD
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse HEAD:research/multi-garment-capture-01/review-ui.mjs)" = d478fcf6e4e8889a23b1620b444667ac949da7a9
          test "$(git rev-parse HEAD:public/outfit-segmentation.mjs)" = d357955dd8fdab7c0cb727ea597c270edd9309ac
          test "$(git rev-parse HEAD:scripts/test-main58-actual-p88-wasm-browser.mjs)" = 96ba2f5ee2420de52f45911881fdcc139455c353
          git diff --exit-code 50bdd6c29be52e477bfdf8344ca9e8ffad85372e HEAD -- public/ supabase/ research/multi-garment-capture-01/ benchmark/ tests/ scripts/test-parallel94-native-p88-browser.mjs scripts/test-main58-actual-p88-wasm-browser.mjs
          test "$(git rev-parse HEAD:public/native-reviewed-private-save-167.mjs)" = 8a4c5f1ba513792c8cacbf898d9263ce76a78963
      - name: Install same pinned Playwright and genuine WASM worker dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Exact-source diagnostic copy syntax without image leaks
        run: M178_SELF_CHECK=true node scripts/test-main178-webkit-p88-diagnosis.mjs
      - name: First run unmodified native P94 then instrumented WebKit twice with all assertions intact
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-main178-webkit-p88-diagnosis.mjs
