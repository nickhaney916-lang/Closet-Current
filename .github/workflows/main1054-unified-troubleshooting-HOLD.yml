name: MAIN1054 unified troubleshooting and source-to-3D HOLD
on:
  pull_request:
    branches: [research/main1054-unified-autonomous-maintenance-HOLD]
permissions:
  contents: read
jobs:
  native:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/main1054-unified-troubleshooting-HOLD'
    strategy:
      fail-fast: false
      matrix:
        lane: [regression, restore-both-engines, chromium-source-mobile, webkit-native, stylist-chromium, stylist-webkit, ordinary-chromium, ordinary-webkit, auth, mutation-chromium, mutation-webkit, management-chromium, management-webkit, maintenance-chromium, maintenance-webkit, capture-both-engines, consumer-board-both-engines, troubleshooting-chromium, troubleshooting-webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 110
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Immutable expanded parent and exact Assignment 19 donor
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.base.sha }}" = 5f9eb92dc45185889c5bf8f7f7ad770a15f78656
          git merge-base --is-ancestor 5f9eb92dc45185889c5bf8f7f7ad770a15f78656 HEAD
          git merge-base --is-ancestor fefe69cd04c57515433985e6141f7f9f0951f6ab HEAD
          test "$(git rev-parse HEAD^)" = 5f9eb92dc45185889c5bf8f7f7ad770a15f78656
          printf '%s\n' 'public/index.html' 'public/app-theme.css' 'public/troubleshooting-report.js' 'public/troubleshooting.js' 'scripts/test-assignment-19-browser.mjs' 'tests/troubleshooting-report.test.cjs' '.github/workflows/assignment-19-troubleshooting-HOLD.yml' '.github/workflows/main1054-unified-troubleshooting-HOLD.yml' | LC_ALL=C sort > /tmp/cc-expected-paths
          git diff --name-only 5f9eb92dc45185889c5bf8f7f7ad770a15f78656 HEAD | LC_ALL=C sort > /tmp/cc-actual-paths
          diff -u /tmp/cc-expected-paths /tmp/cc-actual-paths
          test "$(git rev-parse HEAD:.github/workflows/main1054-unified-autonomous-maintenance-HOLD.yml)" = 82e465f2ecb437674bf4dd2fe56dfe8df76c60d5
          test "$(git rev-parse HEAD:public/index.html)" = a4784165d3220615a6fe5e464715cb5db8bb276b
          test "$(git rev-parse HEAD:public/app-theme.css)" = 2dec4be7dfad4e75fcc0cb327202708c5b8b4d9d
          test "$(git rev-parse HEAD:public/troubleshooting-report.js)" = 192d1ff46e411bbdcf5ec43dc2ab5feaec90cadf
          test "$(git rev-parse HEAD:public/troubleshooting.js)" = 5e296519a35a3fe8a21680c1263b52313cb273f7
          test "$(git rev-parse HEAD:scripts/test-assignment-19-browser.mjs)" = 7bd09a5c20ecd0223a11e812939672042bd98ca8
          test "$(git rev-parse HEAD:tests/troubleshooting-report.test.cjs)" = 2162f6349a1a262920b36606ff5ff133d147f590
          test "$(git rev-parse HEAD:.github/workflows/assignment-19-troubleshooting-HOLD.yml)" = 8a36f8cd17426c3a43c4ee72faa9d3fb1e0d3995
          git log -1 --format='commit %H tree %T'
      - name: Install pinned dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Preflight syntax of all changed acceptance harnesses
        run: |
          node --check scripts/test-capture-proof-01-browser.mjs
          node --check scripts/test-native-consumer-board-04-browser.mjs
          node --check scripts/p1671-native-outfit-search.cjs
          node --check scripts/test-style-owned-live-03-browser.mjs
          node --check scripts/p1669-native-connectivity.cjs
          node --check scripts/test-mission3-offline-auth-recovery-browser.mjs
          node --check scripts/test-assignment-19-browser.mjs
          node --check public/troubleshooting.js
          node --check public/troubleshooting-report.js
      - run: node scripts/build.mjs
      - if: matrix.lane == 'troubleshooting-chromium' || matrix.lane == 'troubleshooting-webkit'
        name: Actual owner troubleshooting preview and export privacy
        run: |
          set -eu
          case "${{ matrix.lane }}" in
            troubleshooting-chromium) export A19_ENGINE=chromium ;;
            troubleshooting-webkit) export A19_ENGINE=webkit ;;
            *) exit 1 ;;
          esac
          node scripts/test-assignment-19-browser.mjs
      - if: matrix.lane == 'stylist-chromium' || matrix.lane == 'stylist-webkit'
        name: Ordinary Stylist-to-wear journey with trusted click diagnostics
        run: |
          set -eu
          case "${{ matrix.lane }}" in
            stylist-chromium) export P99_ENGINE=chromium ;;
            stylist-webkit) export P99_ENGINE=webkit ;;
            *) exit 1 ;;
          esac
          for width in 320 390 430; do
            P99_WIDTH="$width" node scripts/main1054-stylist-wear-journey.cjs
          done
      - if: matrix.lane == 'ordinary-chromium' || matrix.lane == 'ordinary-webkit'
        name: Preserve native connectivity and saved outfit search at all mobile widths
        run: |
          set -eu
          case "${{ matrix.lane }}" in
            ordinary-chromium) export P99_ENGINE=chromium ;;
            ordinary-webkit) export P99_ENGINE=webkit ;;
            *) exit 1 ;;
          esac
          git worktree add --detach "$RUNNER_TEMP/p1669-baseline" eebfd74f5e99cf2d7a5430b4a16d0687f4971a0e
          git worktree add --detach "$RUNNER_TEMP/p1671-baseline" 9d39062d90a593f8cc5e236bdd783a3051df8896
          for lane in p1669 p1671; do
            git config --global --add safe.directory "$RUNNER_TEMP/$lane-baseline"
            ln -s "$PWD/node_modules" "$RUNNER_TEMP/$lane-baseline/node_modules"
          done
          cp scripts/p1669-native-connectivity.cjs "$RUNNER_TEMP/p1669-baseline/scripts/"
          # Same instrumented review harness on both immutable comparison baselines and candidate.
          for lane in p1669 p1671; do
            test "$(git -C "$RUNNER_TEMP/$lane-baseline" rev-parse HEAD:scripts/test-parallel99-normal-app-browser.mjs)" = 261f2ebb6f0d94033f4cbaffdf6f9534411dba3a
            cp scripts/test-parallel99-normal-app-browser.mjs "$RUNNER_TEMP/$lane-baseline/scripts/"
            test "$(git hash-object "$RUNNER_TEMP/$lane-baseline/scripts/test-parallel99-normal-app-browser.mjs")" = 3a4c15101e3450db626478852c4b722fa3e9905b
          done
          cp scripts/p1671-native-outfit-search.cjs "$RUNNER_TEMP/p1671-baseline/scripts/"
          (cd "$RUNNER_TEMP/p1669-baseline" && node scripts/build.mjs)
          (cd "$RUNNER_TEMP/p1671-baseline" && node scripts/build.mjs)
          for width in 320 390 430; do
            export P99_WIDTH="$width"
            (cd "$RUNNER_TEMP/p1669-baseline" && P1669_EXPECT_RED=1 node scripts/p1669-native-connectivity.cjs)
            node scripts/p1669-native-connectivity.cjs
            (cd "$RUNNER_TEMP/p1671-baseline" && P1671_BASELINE=1 node scripts/p1671-native-outfit-search.cjs)
            node scripts/p1671-native-outfit-search.cjs
          done
          P99_WIDTH=390 P1607_AUDIT=1 node scripts/test-parallel99-normal-app-browser.mjs
          P99_WIDTH=390 node scripts/p1656-native-wear.cjs
      - if: matrix.lane == 'mutation-chromium' || matrix.lane == 'mutation-webkit'
        name: Exact accepted garment mutation journey on integrated application
        run: |
          set -eu
          case "${{ matrix.lane }}" in
            mutation-chromium) export A14_ENGINE=chromium ;;
            mutation-webkit) export A14_ENGINE=webkit ;;
            *) exit 1 ;;
          esac
          node scripts/test-assignment-14-browser.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('benchmark/assignment-14/results.json','utf8'));
          assert.equal(r.syntheticAuth,true);
          assert.deepEqual(r.cases.map(x=>x.width),[320,390,430]);
          assert.ok(r.cases.every(x=>x.engine===process.env.A14_ENGINE&&x.sourceSHA256.length===6&&new Set(x.sourceSHA256).size===6));
          NODE
      - if: matrix.lane == 'management-chromium' || matrix.lane == 'management-webkit'
        name: Exact accepted saved outfit management on integrated application
        run: |
          set -eu
          case "${{ matrix.lane }}" in
            management-chromium) export A15_ENGINE=chromium ;;
            management-webkit) export A15_ENGINE=webkit ;;
            *) exit 1 ;;
          esac
          node scripts/test-assignment-15-browser.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('benchmark/assignment-15/results.json','utf8'));
          assert.equal(r.syntheticAuth,true);
          assert.deepEqual(r.cases.map(x=>x.width),[320,390,430]);
          assert.ok(r.cases.every(x=>x.engine===process.env.A15_ENGINE&&x.sourceSHA256.length===6&&new Set(x.sourceSHA256).size===6));
          NODE
      - if: matrix.lane == 'maintenance-chromium' || matrix.lane == 'maintenance-webkit'
        name: Managed catalog activation, outage, rollback and preserved owner records
        run: |
          set -eu
          case "${{ matrix.lane }}" in
            maintenance-chromium) export P99_ENGINE=chromium ;;
            maintenance-webkit) export P99_ENGINE=webkit ;;
            *) exit 1 ;;
          esac
          for width in 320 390 430; do
            P99_WIDTH="$width" node scripts/maintenance/browser-test.mjs
          done
      - if: matrix.lane == 'capture-both-engines'
        name: Original camera and import source acceptance in both browsers
        run: |
          node --check public/app.js
          node --check public/outfit-capture.js
          node --check public/photo-crop-editor.js
          node --check research/capture-proof-01/source-proof.mjs
          node --check tests/capture-proof-01.test.mjs
          node --check scripts/test-capture-proof-01-browser.mjs
          node scripts/test-capture-proof-01-browser.mjs
      - if: matrix.lane == 'capture-both-engines'
        name: Strict evidence manifest and no-deploy acceptance
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('benchmark/capture-proof-01/results.json','utf8'));
          assert.equal(r.verdict,'PASS');
          assert.deepEqual(r.results.map(x=>x.engine+':'+x.width),
           ['chromium:320','chromium:390','chromium:430','webkit:320','webkit:390','webkit:430']);
          assert.equal(r.errors.length,0);assert.equal(r.outbound.length,0);
          assert.ok(r.results.every(x=>x.realPage&&x.realCanvasJPEG&&x.genuineWebCrypto&&
           x.realIndexedDB&&x.simulatedCamera&&x.mockedWorkers&&
           x.permissionDeniedAndRecovered&&x.frontFacingFallback&&
           x.originalFullResolution&&x.unverifiedNeedsReview&&
           x.originalImportConversionHonest&&x.manualCorrectionSaved&&x.tamperedSourceRefused&&
           x.failedPlaybackStopped&&x.visibilityInterruptStopped&&
           x.logoutDuringPendingHashDiscarded&&x.outfitOriginalHandoff&&
           x.logoutClearsPrivateIndex&&!x.actualPhysicalPhone));
          assert.equal(r.physicalAndroidTested,false);
          assert.equal(r.physicalIphoneTested,false);
          assert.equal(r.freshNeuralInference,false);
          assert.equal(r.productionDeployed,false);
          assert.equal(r.familyAlpha,'HOLD');
          console.log('CAPTURE-PROOF 6 genuine browser viewport scenarios and no-deploy PASS');
          NODE
      - if: matrix.lane == 'consumer-board-both-engines'
        name: Native consumer original photo and private CAS acceptance in both browsers
        run: |
          node scripts/test-native-consumer-board-04-browser.mjs
          node scripts/audit-native-consumer-board-04.mjs
      - if: matrix.lane == 'consumer-board-both-engines'
        name: Strict native consumer data preservation, RLS false and Family Alpha HOLD
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('benchmark/native-consumer-board-04/results.json'));
          const a=JSON.parse(readFileSync('benchmark/native-consumer-board-04-audit/acceptance.json'));
          assert.equal(r.realNativeUI,true);
          assert.equal(r.cases,6);assert.equal(r.screenshots,30);
          assert.equal(r.realOwnerIndexedDB,true);
          assert.equal(r.originalPhotosUnchanged,true);
          assert.equal(r.originalCleanerUnchanged,true);
          assert.deepEqual(r.errors,[]);
          assert.deepEqual(r.blocked.filter(x=>x.method!=='GET'),[]);
          assert.ok(r.evidence.every(x=>x.actualNativeOutfitBuilder&&x.actualNativeAuthSource&&
            x.onlyAuthHTTPMocked&&x.actualPrivateIndexedDB&&
            x.originalJPEGSourceSHA&&x.sourceTrueDressWithTwoOuterwear&&
            x.savedAnd3DIDsPreserved&&x.explicitCASWrite&&
            x.readRenderCancelNoWrite&&x.cloudRestorePausedDuringEdit&&
            x.cloudRevisionConflictDetected&&x.backupImportBlockedBeforeMutation&&
            x.accountAtoBIsolation&&x.missingItemIDPreserved&&
            x.releaseAuthorized===false));
          assert.equal(a.status,'PASS_NATIVE_BROWSER_RESEARCH_ONLY');
          assert.equal(a.realNativeScreensVerified,30);
          assert.equal(a.comparisonGalleries,6);
          assert.equal(a.liveSignedAccounts,false);
          assert.equal(a.crossDeviceCloudRestoreVerified,false);
          assert.equal(a.nativeDefaultModeUnchanged,true);
          assert.equal(a.releaseAuthorized,false);assert.equal(a.familyAlpha,'HOLD');
          console.log('Native consumer research PASS; unsigned auth fixtures, production migration and RLS remain HOLD');
          NODE
      - if: matrix.lane == 'auth'
        name: Verified owner offline and revocation boundary
        run: node scripts/test-mission3-offline-auth-recovery-browser.mjs benchmark/p1669-auth
      - if: matrix.lane == 'regression'
        name: Full unified regression
        run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
      - if: matrix.lane == 'restore-both-engines'
        name: Original atomic recovery in both native engines
        run: |
          set -eu
          node scripts/test-restore-atomic-01-browser.mjs
          node scripts/audit-restore-atomic-01.mjs
      - if: matrix.lane == 'chromium-source-mobile' || matrix.lane == 'webkit-native'
        id: donor
        name: Pin exact untouched 163-bone human + original photo donor PR541
        run: |
          set -eu
          git fetch --no-tags origin df6885d6011cb33fb22dceb81a08f35a0ac4dd61 53f2ad344dc56a1477e343531c423aed0e66c17d dd6bac3fa9ff640d4f562cf925337440bdb5cf8f 3a572193987cb29389727426136c6eb3ac326783 dfb40889c4c1221fb1833b859e8a11ef38aeb76e
          git worktree add --detach .native05-donor-541 df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          git config --global --add safe.directory "$GITHUB_WORKSPACE/.native05-donor-541"
          test "$(git -C .native05-donor-541 rev-parse HEAD)" = df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          ln -s ../node_modules .native05-donor-541/node_modules
          cd .native05-donor-541
          # Acquire only the two pinned public originals; respect transient HTTP backoff.
          # Never replace with a thumbnail or accept a changed publisher response.
          fetch_original() {
            url="$1"; output="$2"; expected="$3"
            mkdir -p "$(dirname "$output")"
            if [ ! -f "$output" ]; then
              curl --fail --silent --show-error --location --retry 3 --retry-max-time 180 --max-time 40 \
                --user-agent 'ClosetCurrent-SourceTrue-IndependentGarmentQA/1.0' \
                --header 'Accept: image/jpeg' --output "$output.tmp" "$url"
              printf '%s  %s\n' "$expected" "$output.tmp" | sha256sum -c -
              mv "$output.tmp" "$output"
            fi
            printf '%s  %s\n' "$expected" "$output" | sha256sum -c -
          }
          fetch_original 'https://upload.wikimedia.org/wikipedia/commons/5/5a/Jeans.jpg' benchmark/three-d-31/original-jeans.jpg b316902ad85e8ff46b164ceb7f2c38d3c1424c9d789703e0267e3dfce68fbe1c
          fetch_original 'https://upload.wikimedia.org/wikipedia/commons/9/92/Denimjeans2.JPG' benchmark/three-d-37/original-denimjeans2.jpg aa7f288055874773b87cd38b5b4e473b532920f61c2d17cb0ccd7872466c444a
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
          test -f benchmark/work47/manifest.json
          node --test tests/outfit-3d-01.test.mjs
      - if: ${{ !cancelled() && steps.donor.outcome == 'success' && matrix.lane == 'chromium-source-mobile' }}
        name: Actual 320/390/430 owner-native touch, safe area, source panel, and WebGL camera controls
        run: |
          node scripts/test-native-mobile-09-browser.mjs
          node scripts/audit-native-mobile-09.mjs
      - if: ${{ !cancelled() && steps.donor.outcome == 'success' && matrix.lane == 'chromium-source-mobile' }}
        name: Actual native source readiness + no fake 3D + original source photos + owner logout
        run: |
          node scripts/test-native-photo-readiness-08-browser.mjs
          node scripts/audit-native-photo-readiness-08.mjs
      - if: ${{ !cancelled() && steps.donor.outcome == 'success' && matrix.lane == 'chromium-source-mobile' }}
        name: Regression actual native consumer original 3D (no restore switch)
        run: |
          node scripts/test-native-3d-05-browser.mjs
          node scripts/audit-native-3d-05.mjs
      - if: ${{ !cancelled() && steps.donor.outcome == 'success' && matrix.lane == 'chromium-source-mobile' }}
        name: Real atomic-loss-recovery-then-WebGL with owner A to B and active 3D fail-closed tests
        run: |
          node scripts/test-native-restore-3d-06-browser.mjs
          node scripts/audit-native-restore-3d-06.mjs
      - if: ${{ !cancelled() && steps.donor.outcome == 'success' && matrix.lane == 'chromium-source-mobile' }}
        name: Real licensed original JPEG import, manual category, owner index, saved draft, CAS, V4 recovery and authentic 3D
        run: |
          node scripts/test-native-index-live-07-browser.mjs
          node scripts/audit-native-index-live-07.mjs
      - if: ${{ !cancelled() && steps.donor.outcome == 'success' && matrix.lane == 'chromium-source-mobile' }}
        name: Original fifteen source photos, real owner IndexedDB and conservative readiness benchmark
        run: |
          node scripts/test-user-photo-3d-01-browser.mjs
          node scripts/audit-user-photo-3d-01.mjs
      - if: ${{ !cancelled() && steps.donor.outcome == 'success' && matrix.lane == 'chromium-source-mobile' }}
        name: Enforce factual recovery-plus-3D acceptance and immutable Family Alpha hold
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('benchmark/native-restore-3d-06/results.json','utf8'));
          const a=JSON.parse(readFileSync('benchmark/native-restore-3d-06-audit/acceptance.json','utf8'));
