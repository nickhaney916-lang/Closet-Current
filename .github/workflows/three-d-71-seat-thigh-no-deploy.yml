name: 3D-71 real anatomical seat-to-thigh neutral fabric 360 (DRAFT HOLD NO DEPLOY)
on:
  pull_request:
    paths:
      - 'research/three-d-71/**'
      - 'research/three-d-15/outfit-controller.mjs'
      - 'research/three-d-15/showroom.mjs'
      - 'research/three-d-67/premium-demo.mjs'
      - 'tests/three-d-71-seat-thigh.test.mjs'
      - 'scripts/test-three-d-71-seat-thigh-360-browser.mjs'
      - '.github/workflows/three-d-71-seat-thigh-no-deploy.yml'
permissions:
  contents: read
jobs:
  real-humanoid-360:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Strict exact verified 3D70 ancestor and isolated 3D71 research paths
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 92518a453fe828cc29b8942077fa87c9351846a7 HEAD
          git diff --name-only 92518a453fe828cc29b8942077fa87c9351846a7 HEAD | while IFS= read -r file; do
            case "$file" in
              research/three-d-71/*|research/three-d-15/outfit-controller.mjs|research/three-d-15/showroom.mjs|research/three-d-67/premium-demo.mjs|tests/three-d-71-seat-thigh.test.mjs|scripts/test-three-d-71-seat-thigh-360-browser.mjs|.github/workflows/three-d-71-seat-thigh-no-deploy.yml) ;;
              *) echo "UNAUTHORIZED 3D67 outside research: $file"; exit 1 ;;
            esac
          done
      - name: Install pinned source-only original WebGL dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 three@0.180.0 playwright@1.56.1 three-mesh-bvh@0.9.2
      - name: Restore original locked CC0 163 bone male and female from exact approved source
        run: |
          git fetch --no-tags origin 53f2ad344dc56a1477e343531c423aed0e66c17d dd6bac3fa9ff640d4f562cf925337440bdb5cf8f 3a572193987cb29389727426136c6eb3ac326783 dfb40889c4c1221fb1833b859e8a11ef38aeb76e
          node research/three-d-20/restore-approved-models.mjs
      - name: Validate 3D71 real hip-knee measured fabric, immutable body, skin and 360
        run: |
          node --check research/three-d-71/seat-thigh-fabric-fall.mjs
          node --check research/three-d-70/neutral-anatomical-leg-fairing.mjs
          node --check research/three-d-67/premium-demo.mjs
          node --check scripts/test-three-d-71-seat-thigh-360-browser.mjs
          node --test tests/three-d-71-seat-thigh.test.mjs
      - name: Genuine male/female 163-bone WebGL 360 baseline versus seat-to-thigh fall at 320 and 390
        run: node scripts/test-three-d-71-seat-thigh-360-browser.mjs
      - name: Verify original male/female 72 WebGL before/after screenshots and all release HOLD labels
        run: |
          node --input-type=module <<'CHECK'
          import {readFileSync,readdirSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const p='benchmark/three-d-71',m=JSON.parse(readFileSync(p+'/browser-results.json','utf8'));
          assert.equal(m.results.length,4);
          assert.equal(m.genuineWebGLImages,72);
          assert.equal(m.originalCC0MaleFemale,true);
          assert.equal(m.real163JointSkinnedHumanoids,true);
          assert.equal(m.originalBodySourceUnchanged,true);
          assert.equal(m.photosNotGenerated,true);
          assert.equal(m.trueCamera360,true);
          assert.equal(m.humanVisualAcceptance,false);
          assert.equal(m.phoneAndroidTested,false);
          assert.equal(m.phoneIphoneTested,false);
          assert.equal(m.releaseAuthorized,false);
          assert.equal(m.familyAlpha,'HOLD');
          assert.equal(readdirSync(p).filter(x=>x.endsWith('.png')).length,72);
          CHECK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: THREE-D-71-ACTUAL-163-JOINT-PREMIUM-NEUTRAL-SILHOUETTE-HOLD
          path: benchmark/three-d-71/
          if-no-files-found: warn
