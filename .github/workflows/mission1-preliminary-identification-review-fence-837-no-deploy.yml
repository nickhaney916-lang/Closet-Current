name: M1 P837 preliminary identified owner-review fence — NO DEPLOY
on:
  push:
    branches: [research/mission1-preliminary-identification-review-fence-837-HOLD]
  pull_request:
    branches: [research/mission1-review-first-no-auto-admission-836-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m1-p837-review-identified-HOLD-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-p837-native-and-mockworker-HOLD:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact green P836 parent and review-only four-file scope
        run: |
          set -euo pipefail
          BASE=5bf247a50f8bd074e3accc39c7cef3fcd57c12d1
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD >/tmp/p837-diff
          cat /tmp/p837-diff
          test "$(wc -l </tmp/p837-diff)" -eq 4
          while IFS= read -r p; do
            case "$p" in
              public/app.js|tests/mission1-preliminary-identification-review-fence-837.test.cjs|research/mission1-preliminary-identification-review-fence-837/REPORT.md|.github/workflows/mission1-preliminary-identification-review-fence-837-no-deploy.yml) ;;
              *) echo "UNAUTHORIZED P837 CHANGE: $p"; exit 1 ;;
            esac
          done </tmp/p837-diff
          test -z "$(git diff --name-only "$BASE" HEAD -- public/local-worker.mjs public/recognition-engine.mjs public/recognition-vectors.bin public/recognition-vectors.json supabase benchmark)"
          grep -Fq 'FAMILY ALPHA HOLD #255' research/mission1-preliminary-identification-review-fence-837/REPORT.md
          echo M1_P837_REVIEW_ONLY_NO_DEPLOY
      - name: Install temporary test requirements
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Test genuine worker event handler and original native integration
        run: |
          set -euo pipefail
          node --check public/app.js
          node --test tests/mission1-preliminary-identification-review-fence-837.test.cjs
          node --test tests/automatic-indexing.test.cjs
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
