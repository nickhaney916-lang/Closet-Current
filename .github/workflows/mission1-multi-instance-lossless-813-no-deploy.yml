name: Mission 1 P813 multi-garment lossless source-region review — NO DEPLOY
on:
  push:
    branches: [research/mission1-multi-instance-lossless-review-813-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mission1-P813-lossless-source-HOLD
  cancel-in-progress: true
jobs:
  native-full-node-and-strict-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact verified P812 research parent; six source/QA/report/CI paths only
        run: |
          set -euo pipefail
          BASE=c62324f348475f1f99c4ee021aa2764c62e0a3a6
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD >/tmp/m1-p813-files
          cat /tmp/m1-p813-files
          test "$(wc -l </tmp/m1-p813-files)" -eq 6
          while read -r p; do
            case "$p" in
              research/multi-garment-capture-01/visible-groups.mjs|public/outfit-worker.mjs|tests/multi-garment-capture-01.test.mjs|tests/outfit-worker.test.mjs|research/mission1-multi-instance-lossless-review-813/REPORT.md|.github/workflows/mission1-multi-instance-lossless-813-no-deploy.yml) ;;
              *) echo "UNAUTHORIZED PRODUCTION/CLOUD/MODEL/PRIVATE PHOTO CHANGE: $p"; exit 1 ;;
            esac
          done </tmp/m1-p813-files
          test -z "$(git diff --name-only "$BASE" HEAD -- supabase benchmark)"
          grep -Fq 'FAMILY ALPHA HOLD #255' research/mission1-multi-instance-lossless-review-813/REPORT.md
          echo M1_P813_ONLY_SOURCE_RESEARCH_DRAFT_NEVER_DEPLOY
      - name: Install ephemeral full suite dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Test new lossless multi-garment worker then full native app regression/build
        run: |
          set -euo pipefail
          node --check public/outfit-worker.mjs
          node --check research/multi-garment-capture-01/visible-groups.mjs
          node --test tests/multi-garment-capture-01.test.mjs tests/outfit-worker.test.mjs
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  independent-worker-overflow-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install only unit test engine dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund fake-indexeddb@6.2.4 sharp@0.34.3 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Independent worker response audit for 13/25 source regions and existing three-piece workflow
        run: |
          set -euo pipefail
          node --test tests/multi-garment-capture-01.test.mjs tests/outfit-worker.test.mjs tests/outfit-segmentation.test.mjs
          grep -Fq "MULTI24_REVIEW_OVERFLOW" research/multi-garment-capture-01/visible-groups.mjs
          grep -Fq "more clothing regions than can be reviewed safely" public/outfit-worker.mjs
          echo M1_P813_WORKER_LOSSLESS_BATCH_AND_EXISTING_SHOE_PAIR_NO_DEPLOY
