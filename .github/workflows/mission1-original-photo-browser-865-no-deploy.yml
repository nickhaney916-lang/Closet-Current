name: Mission 1 P865 native owner-original browser reload — NO DEPLOY
on:
  push:
    branches: [research/mission1-original-photo-browser-865-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m1-p865-owner-original-HOLD
  cancel-in-progress: true
jobs:
  pinned-source-native-NO-DEPLOY:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verified exact P864 parent, strict three-file no-deploy scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=bdb1b535fba9ec8b0177b9020b9dc657c2f945a8
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE" HEAD >/tmp/p865-files
          cat /tmp/p865-files
          test "$(wc -l </tmp/p865-files)" -eq 3
          while IFS= read -r f; do
            case "$f" in
              scripts/test-m1-original-photo-browser-865.mjs|research/mission1-original-photo-browser-865/REPORT.md|.github/workflows/mission1-original-photo-browser-865-no-deploy.yml) ;;
              *) echo "P865 UNAUTHORIZED PATH $f"; exit 1;;
            esac
          done </tmp/p865-files
          test -z "$(git diff --name-only "$BASE" HEAD -- public tests supabase benchmark)"
          grep -Fq 'Family Alpha HOLD #255 OPEN' research/mission1-original-photo-browser-865/REPORT.md
          grep -Fq 'const reviewFirst836=true;' public/app.js
          grep -Fq 'if(quality.blank){' public/app.js
          echo P865_NO_DEPLOY_SCOPE_PASS
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Preserve all inherited Mission 1 gates
        run: |
          set -euo pipefail
          node --check scripts/test-m1-original-photo-browser-865.mjs
          node --check public/app.js
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          P79_REQUIRE_DECODER=1 node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
          node scripts/m1-release-evidence-851.mjs | tee /tmp/p865-release
          grep -Fq '"status":"BLOCKED"' /tmp/p865-release
          grep -Fq '"shouldLiftFamilyAlphaHold":false' /tmp/p865-release
  native-Chromium-WebKit-JPEG-IDB-and-owner-remove:
    needs: pinned-source-native-NO-DEPLOY
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium webkit
      - name: Real browser app state/IndexedDB/JPEG SHA across reload and explicit owner UI
        run: |
          set -euo pipefail
          node scripts/test-m1-original-photo-browser-865.mjs
          node scripts/test-m1-review-first-default-843.mjs
          node scripts/test-m1-owner-pair-admission-846.mjs
