name: MAIN204 v3 same-ID source revocation no-deploy gate HOLD
on:
  push:
    branches: [research/main204-m199-v3-restore-revocation-fence-HOLD]
  pull_request:
    branches: [research/main199-verified-cutout-owner-source-gate-HOLD]
    paths:
      - public/native-default-atomic-import-m3.mjs
      - tests/main204-restore-source-revocation.test.mjs
      - .github/workflows/main204-owner-restore-tombstone-no-deploy.yml
permissions:
  contents: read
jobs:
  signed-owner-restore-source-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-pin M199 and require only isolated M204 test paths
        shell: bash
        run: |
          set -euo pipefail
          PARENT=8993da21fd5d103f25dbcb5eab36ed9498047cd7
          git merge-base --is-ancestor "$PARENT" HEAD
          git diff --name-only "$PARENT" HEAD | while IFS= read -r path; do
            case "$path" in
              public/native-default-atomic-import-m3.mjs|tests/main204-restore-source-revocation.test.mjs|.github/workflows/main204-owner-restore-tombstone-no-deploy.yml) ;;
              *) echo "M204 unexpected path $path"; exit 1 ;;
            esac
          done
          # M204 EXACT post-repro repair, strict and independently source-pinned.
          test "$(git rev-parse 8993da21fd5d103f25dbcb5eab36ed9498047cd7:public/native-default-atomic-import-m3.mjs)" = d41c1aeec7fac7c95dbf02d9ed12fcee0c46ed3e
          test "$(git rev-parse HEAD:public/native-default-atomic-import-m3.mjs)" = 5a4b2f2e98a9c30a5fd0787ffbb8c9546aacc408
          test "$(git rev-parse HEAD:public/native-owner-wardrobe-index-167.mjs)" = d872c582a9d8e6f319cae4c99f84dbc81ea7f7d3
          test "$(git rev-parse HEAD:public/native-outfit-source-plan-p99.mjs)" = 0d4972a7fddfcfae0dd811765e4a94b962f4b578
          node --check tests/main204-restore-source-revocation.test.mjs
      - name: Install isolated test dependencies; no hosted owner access
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: M204 original true source flags must never silently be removed by v3
        run: node --test tests/main204-restore-source-revocation.test.mjs
      - name: Build genuine app and run all inherited exact-head tests
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  genuine-normal-private-restoration:
    name: M204 no-deploy signed owner original and v3 restore (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      P99_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict native import source, no unrelated app, owner or hosted edits
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=8993da21fd5d103f25dbcb5eab36ed9498047cd7
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | while IFS= read -r path; do
            case "$path" in
              public/native-default-atomic-import-m3.mjs|tests/main204-restore-source-revocation.test.mjs|.github/workflows/main204-owner-restore-tombstone-no-deploy.yml) ;;
              *) echo "Unexpected M204 changed path: $path"; exit 1 ;;
            esac
          done
          test "$(git rev-parse HEAD:public/native-default-atomic-import-m3.mjs)" = 5a4b2f2e98a9c30a5fd0787ffbb8c9546aacc408
          test "$(git rev-parse HEAD:public/native-owner-wardrobe-index-167.mjs)" = d872c582a9d8e6f319cae4c99f84dbc81ea7f7d3
          test "$(git rev-parse HEAD:public/native-outfit-source-plan-p99.mjs)" = 0d4972a7fddfcfae0dd811765e4a94b962f4b578
          test "$(git rev-parse HEAD:public/native-2d-preview-p99.mjs)" = 62bad171a97030846b0f1bb3bab740dec20ac5e7
          test "$(git rev-parse HEAD:scripts/test-parallel99-normal-app-browser.mjs)" = 9b8c3b37d1d8116e4bf9bc6dbf7ea82e2752433d
      - name: Install pinned browser/app dependencies without deployment
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Build actual normal-user application
        run: node scripts/build.mjs
      - name: Native actual Chromium or WebKit 320 390 430 private owner reviewed original and v3 restore
        shell: bash
        run: |
          set -euo pipefail
          for width in 320 390 430; do
            P99_WIDTH="$width" node scripts/test-parallel99-normal-app-browser.mjs
          done
