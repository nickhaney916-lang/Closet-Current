name: Verify real LIP hosiery review safety
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'benchmark/LIP-SOCKS-REAL-REVIEW-20261017.json'
      - 'tests/lip-real-review-regressions.test.mjs'
      - '.github/workflows/lip-real-review-regressions.yml'
permissions:
  contents: read
jobs:
  review-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check real-photo no-autosave regression cases
        run: node --test tests/lip-real-review-regressions.test.mjs tests/visible-garment-pairs.test.mjs
