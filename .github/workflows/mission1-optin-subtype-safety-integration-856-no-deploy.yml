name: Mission 1 P856 opt-in subtype safety integration — NO DEPLOY
on:
  push:
    branches: [research/mission1-optin-subtype-safety-integration-856-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m1-p856-optin-subtype-safety-HOLD
  cancel-in-progress: true
jobs:
  exact-parent-native-HOLD:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: P855 exact verified parent and fourteen-path scope; never deploy
        shell: bash
        run: |
          set -euo pipefail
          BASE=c82b45a21b7fa522f34b403ad37e1d1fdd9ce3d6
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE" HEAD > /tmp/p856-files
          cat /tmp/p856-files
          test "$(wc -l </tmp/p856-files)" -eq 14
          while IFS= read -r path; do
            case "$path" in
              public/app.js|public/local-worker.mjs|public/subtype-panel-80.mjs|public/subtype-review-80.mjs|public/subtype-worker-80.mjs|scripts/p80-challenge.mjs|scripts/p80-synthetic-evaluation.mjs|scripts/test-parallel80-subtype-browser.mjs|tests/parallel80-subtype.test.mjs|research/parallel80/OPERATOR.md|research/parallel80/REPORT.md|tests/mission1-optin-subtype-integration-856.test.mjs|research/mission1-optin-subtype-safety-integration-856/REPORT.md|.github/workflows/mission1-optin-subtype-safety-integration-856-no-deploy.yml) ;;
              *) echo "P856 UNAUTHORIZED PATH: $path"; exit 1 ;;
            esac
          done </tmp/p856-files
          test -z "$(git diff --name-only "$BASE" HEAD -- public/recognition-engine.mjs public/taxonomy.js public/clothing-memory.js public/recognition-confusion-guard.mjs public/garment-color-76.mjs public/photo-color.js public/review-queue-850.js public/outfit-capture.js scripts/p75-dataset-core.mjs scripts/p75-review-offline.mjs scripts/p79-workstation-core.mjs scripts/m1-release-evidence-851.mjs supabase benchmark)"
          test "$(git hash-object public/local-worker.mjs)" = 92adfe537d2b1fe0abb5d13a707a57d8d0e0ae04
          test "$(git hash-object public/subtype-panel-80.mjs)" = 9146933125dfa4fabb9dce91ab49df84393f09af
          test "$(git hash-object public/subtype-review-80.mjs)" = a28e8b65ef6b2413da7f4a43f8dadc44f9b48eed
          test "$(git hash-object public/subtype-worker-80.mjs)" = a47ab2334e55610e0820664995b6923aa96d3f8c
          test "$(git hash-object scripts/p80-challenge.mjs)" = de8832d04484eb426e7c2111772e03ba46b4a280
          test "$(git hash-object scripts/p80-synthetic-evaluation.mjs)" = b4924fdafbdac26b183d3cc1c2bcfc0457a48441
          test "$(git hash-object scripts/test-parallel80-subtype-browser.mjs)" = 544c5030511956553222142c946e814956cf81cf
          test "$(git hash-object tests/parallel80-subtype.test.mjs)" = ebd4c887f6875e8bb15bba48b66ec0e42f281b42
          test "$(git hash-object research/parallel80/OPERATOR.md)" = cf1ebbd056830148367728c91a9671dd5d55baad
          test "$(git hash-object research/parallel80/REPORT.md)" = d594417e86dedc4561cba7250361af1ab08f5770
          grep -Fqx 'const reviewFirst836=true;' <(grep '^const reviewFirst836=' public/app.js)
          grep -Fq 'const live854=()=>sameOwner854()' public/app.js
          grep -Fq "subtype80Enabled=Boolean(pendingDraft&&new URLSearchParams(location.search).get('subtype80')==='1'&&subtype80Owner?.id)" public/app.js
          grep -Fq 'completeSignedLabel' scripts/p75-dataset-core.mjs
          grep -Fq 'FAMILY ALPHA HOLD #255 OPEN' research/mission1-optin-subtype-safety-integration-856/REPORT.md
          echo M1_P856_PINNED_PARENT_14_PATH_SOURCE_INTEGRITY_PASS
      - name: Install only temporary no-lockfile test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: P856 subtype abstention + P855 owner-photo lease + full signed label consensus synthetic integration
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check public/local-worker.mjs
          node --test tests/mission1-optin-subtype-integration-856.test.mjs tests/parallel80-subtype.test.mjs tests/mission1-stale-photo-recognition-lease-854.test.cjs tests/mission1-full-label-consensus-854.test.mjs tests/mission1-source-lease-consensus-integration-855.test.mjs tests/parallel75-independent-ground-truth.test.mjs
          node scripts/p80-synthetic-evaluation.mjs
          node scripts/p80-challenge.mjs
          node scripts/m1-release-evidence-851.mjs | tee /tmp/p856-release
          grep -Fq '"status":"BLOCKED"' /tmp/p856-release
          grep -Fq '"shouldLiftFamilyAlphaHold":false' /tmp/p856-release
      - name: Unchanged local app builds and complete inherited native tests
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          P79_REQUIRE_DECODER=1 node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  actual-desktop-browsers-NOT-physical-phones:
    needs: exact-parent-native-HOLD
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium webkit
      - name: P80 optional original-photo subtype owner review on actual DESKTOP Chromium and WebKit
        run: node scripts/test-parallel80-subtype-browser.mjs
      - name: P79 private offline independent annotation station browser smoke
        run: node scripts/test-p79-workstation-browser.mjs
      - name: P78 physical QA recorder DESKTOP simulation only
        run: node scripts/test-parallel78-device-browser.mjs
      - name: Inherited P855 owner-safe camera-to-closet photo, pairs, color, duplicate, learning and save
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node scripts/test-m1-batch-review-850.mjs
          node scripts/test-parallel77-cross-capture-browser.mjs
          node scripts/test-parallel76-color-browser.mjs
          node scripts/test-m1-owner-learning-integration-847.mjs
          node scripts/test-m1-owner-pair-admission-846.mjs
          node scripts/test-m1-review-save-lifecycle-844.mjs parent
          node scripts/test-m1-review-save-lifecycle-844.mjs candidate
          node scripts/test-m1-review-first-default-843.mjs
          node scripts/test-m1-owner-review-editor-839.mjs
  lawful-public-original-hashes-NOT-blind-accuracy:
    needs: exact-parent-native-HOLD
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      P73_PHOTO_IDS: commons-0003,commons-0014,commons-0021,commons-0033,commons-0049,commons-0060,commons-0077,commons-0082,commons-0094,validation-0001,validation-0019
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3
      - name: Verify 11 original public photo SHA provenance/metadata only
        run: |
          set -euo pipefail
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos "$P73_PHOTO_IDS"
          node scripts/evaluate-parallel73-real-photo.mjs
          echo P856_PUBLIC_ORIGINAL_HASHES_VERIFIED_NOT_GARMENT_TRUTH
