name: MAIN1054 M45 genuine original V-neck mannequin region alpha proposal NO DEPLOY
on:
  push:
    branches: [research/main1054-m45-vneck-source-region-candidate-HOLD]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  genuine-original-photo-vneck-conservative-region-proposal:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned M44 original source guide and unchanged consumer/private model code
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 4f2d2de112349e4aed4b5ec4e4eaa43a9d667607 HEAD
          for path in research/main1054-mask41/original-rgb-alpha-audit.mjs research/main1054-mask42/conservative-fringe-trial.mjs research/main1054-mask43/source-annotation-contract.mjs research/main1054-mask43/manual-contour-editor.js research/main1054-mask44/priority-source-review.mjs scripts/build-main41-real-source-review.mjs scripts/build-main42-source-fringe-comparison.mjs scripts/build-main43-offline-annotator.mjs scripts/build-main44-guided-source-review.mjs research/main1054-handoff40/p89-quality-admission.mjs research/native-3d-05/native-preview-bridge.mjs public/outfit-board.js; do
            test "$(git rev-parse HEAD:$path)" = "$(git rev-parse 4f2d2de112349e4aed4b5ec4e4eaa43a9d667607:$path)"
          done
          git diff --exit-code 4f2d2de112349e4aed4b5ec4e4eaa43a9d667607 HEAD -- public/ supabase/ benchmark/ research/main1054-handoff40/ research/native-3d-05/
          git diff --name-only 4f2d2de112349e4aed4b5ec4e4eaa43a9d667607 HEAD | while IFS= read -r path; do
            case "$path" in
              research/main1054-mask45/vneck-source-region-trial.mjs|research/main1054-mask45/offline-actual-original-vneck-review.html|tests/main45-original-vneck-region.test.mjs|scripts/build-main45-real-original-vneck.mjs|scripts/test-main45-source-vneck-browser.mjs|research/master-consolidation-1054/MILESTONE45.md|.github/workflows/main1054-m45-vneck-photo-matte-no-deploy.yml) ;;
              *) echo "BLOCKED unexpected M45 changed path $path"; exit 1;;
            esac
          done
          node --check research/main1054-mask45/vneck-source-region-trial.mjs
          node --check tests/main45-original-vneck-region.test.mjs
          node --check scripts/build-main45-real-original-vneck.mjs
          node --check scripts/test-main45-source-vneck-browser.mjs
      - name: Pinned no-deploy local developer dependencies
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 playwright@1.56.1 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Unchanged default consumer application build
        run: node scripts/build.mjs
      - name: M45 source region is bounded, original RGB-safe and cannot grant consumer 3D
        run: node --test tests/main45-original-vneck-region.test.mjs
      - name: Entire inherited no-deploy Node regression
        run: node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Pin immutable true licensed P541 source and original P93 algorithm
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach .native05-donor-541 df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          git worktree add --detach .m41-p93-donor 690eaeec9ebe911714d6f45fb0d9a59b2ee918d8
          ln -s ../node_modules .native05-donor-541/node_modules
          ln -s ../node_modules .m41-p93-donor/node_modules
          test "$(git rev-parse HEAD:research/main1054-mask42/conservative-fringe-trial.mjs)" = "$(git rev-parse 4f2d2de112349e4aed4b5ec4e4eaa43a9d667607:research/main1054-mask42/conservative-fringe-trial.mjs)"
      - name: Rebuild genuine Commons original, exact RGB Work47 and P93 original source
        working-directory: .native05-donor-541
        run: |
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node scripts/build-work47-benchmark.mjs
      - name: Rebuild exact unchanged P93 and M41 source photo visual evidence
        run: |
          node .m41-p93-donor/scripts/build-mission2-p93-real-source-mask.mjs
          node scripts/build-main41-real-source-review.mjs
      - name: Build original M42 unchanged hypothesis comparison and source licenses
        run: node scripts/build-main42-source-fringe-comparison.mjs
      - name: Build genuine source-JPEG-locked independent OFFLINE annotation viewer
        run: node scripts/build-main43-offline-annotator.mjs
      - name: Build exact public source 301-sample M44 review navigation (NO alpha mutation)
        run: node scripts/build-main44-guided-source-review.mjs
      - name: Rebuild actual licensed V-neck original versus P93 versus local-tone M45 candidate, source RGB unchanged
        run: node scripts/build-main45-real-original-vneck.mjs
      - name: Install pinned Chromium and WebKit for real original photograph interactions
        run: npx playwright install --with-deps chromium webkit
      - name: Actual Chromium original JPEG canvas pointer drawing, undo and export (SYNTHETIC TEST ONLY)
        run: M43_ENGINE=chromium node scripts/test-main43-real-source-annotator.mjs
      - name: Actual WebKit original JPEG canvas pointer drawing, undo and export (SYNTHETIC TEST ONLY)
        run: M43_ENGINE=webkit node scripts/test-main43-real-source-annotator.mjs
      - name: Actual Chromium guided 14-region source-only review and zero-mask-navigation
        run: M44_ENGINE=chromium node scripts/test-main44-guided-source-review.mjs
      - name: Actual WebKit guided 14-region source-only review and zero-mask-navigation
        run: M44_ENGINE=webkit node scripts/test-main44-guided-source-review.mjs
      - name: Actual Chromium original V-neck unapproved photo A/B visual review and source-safe export
        run: M45_ENGINE=chromium node scripts/test-main45-source-vneck-browser.mjs
      - name: Actual WebKit original V-neck unapproved photo A/B visual review and source-safe export
        run: M45_ENGINE=webkit node scripts/test-main45-source-vneck-browser.mjs
      - name: Independently reconstitute synthetic annotation with exact original source RGB, NO 3D
        run: node scripts/apply-main43-unverified-patch.mjs benchmark/main43-contour-editor/SYNTHETIC-TEST-NOT-HUMAN-annotations-chromium.json
      - name: Assert immutable original public JPEG, consumer, cloud, model, native 3D scope
        run: |
          git diff --exit-code 4f2d2de112349e4aed4b5ec4e4eaa43a9d667607 HEAD -- public/ supabase/ benchmark/ research/native-3d-05/
          test -f benchmark/main43-contour-editor/original-source.jpg
          test -f benchmark/main43-contour-editor/offline-human-contour-editor.html
          test -f benchmark/main43-contour-editor/M43-LOCAL-ANNOTATION-CANDIDATE-NOT-APPROVED.png
          test -f benchmark/main44-guided-source-review/guided-original-photo-review.html
          test -f benchmark/main44-guided-source-review/licensed-review-targets.json
          test -f benchmark/main44-guided-source-review/priority-original-and-p93-crops.jpg
          test -f benchmark/main45-licensed-vneck-photo-candidate/M45-vneck-local-tone-proposal-UNAPPROVED.png
          test -f benchmark/main45-licensed-vneck-photo-candidate/offline-actual-original-vneck-review.html
      - name: Keep genuine licensed original, local annotation workstation, UNAPPROVED synthetic patch evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main1054-m45-genuine-photo-vneck-local-tone-matte-UNAPPROVED-HOLD
          path: |
            benchmark/main45-licensed-vneck-photo-candidate/
          if-no-files-found: ignore
          retention-days: 14
