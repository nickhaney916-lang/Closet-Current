name: P186 real owner-reviewed original and cutout SHA 3D admission NO DEPLOY
on:
  push:
    branches:
      - research/owner-cutout-photo-fit-proof-186-main-20261109-HOLD
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reviewed-owner-proof-and-full-node:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact verified P185 ancestry, seven research-only paths, no shipping files
        run: |
          set -eu
          BASE=4be1ba4d9f5c808154e940ef1302a3255fed87be
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git rev-parse "$(git rev-list --reverse "$BASE..HEAD" | head -n1)^")" = "$BASE"
          git diff --name-only "$BASE" HEAD >/tmp/p186-paths
          while IFS= read -r p; do
            case "$p" in
              research/owner-cutout-photo-fit-186/review-contract.mjs|research/owner-cutout-photo-fit-186/REPORT.md|research/native-consumer-board-04/consumer-board-controller.mjs|research/native-3d-05/native-preview-bridge.mjs|scripts/test-native-3d-05-browser.mjs|tests/owner-cutout-photo-fit-186.test.mjs|.github/workflows/owner-cutout-photo-fit-186-no-deploy.yml) ;;
              *) echo "P186 forbidden change $p"; exit 1 ;;
            esac
          done </tmp/p186-paths
          test "$(wc -l </tmp/p186-paths)" -eq 7
          git diff --exit-code "$BASE" HEAD -- public supabase migrations package.json package-lock.json
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Syntax, real JPEG review receipt adversarial checks, full Node and production build
        run: |
          node --check research/owner-cutout-photo-fit-186/review-contract.mjs
          node --check research/native-consumer-board-04/consumer-board-controller.mjs
          node --check research/native-3d-05/native-preview-bridge.mjs
          node --check scripts/test-native-3d-05-browser.mjs
          node --test tests/owner-cutout-photo-fit-186.test.mjs
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  mobile-owner-review-fail-closed-chromium-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PHOTO_FIT171: '1'
      PHOTO_SILHOUETTE62: '1'
      PHOTO_SHOULDER185: '1'
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Install genuine P541/P60/P172 source photo rig into disposable donor only
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git worktree add --detach .donor541 df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          git worktree add --detach .p60 6fe5e46b91533a96f3c0d86950ea077cb355c459
          git worktree add --detach .p172 88d2fdb412f84b0498c86bfa17f4b391425e1958
          for name in .donor541 .p60 .p172; do
            git config --global --add safe.directory "$GITHUB_WORKSPACE/$name"
            ln -s ../node_modules "$name/node_modules"
          done
          cd .donor541
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
          cd ..
          cd .p60 && node scripts/install-photo-cloth-realism-164.mjs ../.donor541 && cd ..
          node scripts/install-native-photo-anatomical-fit-171.mjs .donor541
          node scripts/install-native-photo-torso-173.mjs .donor541 .p172
          node scripts/install-source-shoulder-seam-174.mjs .donor541
          node scripts/install-native-original-dress-drape-175.mjs .donor541
          node scripts/install-user-photo-to-anatomical-3d-62.mjs .donor541
          node scripts/install-photographed-garment-shoulder-185.mjs .donor541
      - name: Preserve genuine P185 provisional blouse female/male 163-bone acceptance
        env:
          PHOTO_SILHOUETTE62_BROWSER: ${{ matrix.engine }}
        run: |
          node scripts/build.mjs
          node scripts/test-native-3d-05-browser.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {verifyGarmentShoulderEvidence185} from './research/garment-shoulder-source-honesty-185/evidence.mjs';
          const engine=process.env.PHOTO_SILHOUETTE62_BROWSER;
          const root='benchmark/user-photo-to-anatomical-3d-62/'+engine+'/';
          const data=JSON.parse(readFileSync(root+'results.json','utf8'));
          assert.equal(data.screens.length,21);
          assert.equal(verifyGarmentShoulderEvidence185(data,{root,engine}).verified,true);
          NODE
          mkdir -p benchmark/owner-cutout-photo-fit-186
          cp -a benchmark/user-photo-to-anatomical-3d-62/${{ matrix.engine }} benchmark/owner-cutout-photo-fit-186/p185-${{ matrix.engine }}
          rm -rf benchmark/user-photo-to-anatomical-3d-62/${{ matrix.engine }}
      - name: Prove unreviewed owner cutout refuses visible native 3D at 320/390/430
        env:
          PHOTO_OWNER_CUTOUT186: '1'
          PHOTO_SILHOUETTE62_BROWSER: ${{ matrix.engine }}
        run: |
          node scripts/test-native-3d-05-browser.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const engine=process.env.PHOTO_SILHOUETTE62_BROWSER;
          const root='benchmark/user-photo-to-anatomical-3d-62/'+engine+'/';
          const data=JSON.parse(readFileSync(root+'results.json','utf8'));
          assert.equal(data.priority,'OWNER-CUTOUT-186');
          assert.deepEqual(data.widths,[320,390,430]);
          assert.equal(data.cases,3);
          assert.equal(data.screenshots,6);
          assert.equal(data.screens.length,6);
          assert.equal(data.errors.length,0);
          assert.ok(data.evidence.every(row=>row.provisionalBlouseOwnerCutoutReviewRejected186===true&&
           row.originalPhotoFallbackPreserved===true&&
           row.source3DVisibilityRevoked===true&&row.ownerWardrobeUntouched===true&&
           row.releaseAuthorized===false&&row.familyAlpha==='HOLD'));
          const hashes=new Set();
          for(const frame of data.screens){
           const raw=readFileSync(root+frame.name);
           assert.equal(createHash('sha256').update(raw).digest('hex'),frame.sha256);
           assert.equal(raw.readUInt32BE(16),frame.width);
           hashes.add(frame.sha256);
          }
          assert.equal(hashes.size,6);
          console.log('P186_'+engine.toUpperCase()+'_SIX_REAL_SHA_MOBILE_FALLBACK_IMAGES_PASS');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P186-${{ matrix.engine }}-original-provisional-plus-owner-review-denial-HOLD
          path: |
            benchmark/owner-cutout-photo-fit-186/
            benchmark/user-photo-to-anatomical-3d-62/
          retention-days: 14
          if-no-files-found: warn
