name: Independent LIP garment class previews
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'benchmark/lip_garment_instance_candidates.py'
      - 'benchmark/lip_boundary_review.py'
      - 'tests/test_lip_boundary_review.py'
      - 'scripts/run-lip-garment-candidates.py'
      - 'tests/test_lip_garment_instances.py'
      - 'benchmark/schp-lip-20-reference.json'
      - 'benchmark/manifest-visible-legwear-2.json'
      - 'benchmark/manifest-fresh-11.json'
      - 'benchmark/locked-photo-sources.json'
      - '.github/workflows/lip-garment-instance-candidates.yml'
permissions:
  contents: read
jobs:
  real-lip-garment-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install already pinned CPU segmentation dependencies
        run: pip install numpy==1.26.4 Pillow==11.2.1 onnxruntime==1.21.0
      - name: Validate garment classes and source boundaries
        run: |
          python -m py_compile scripts/run-lip-garment-candidates.py
          PYTHONPATH=benchmark python -m unittest discover -s tests -p 'test_lip_garment_instances.py' -v
          PYTHONPATH=benchmark python -m unittest discover -s tests -p 'test_lip_boundary_review.py' -v
      - name: Load four SHA-verified licensed comparison photographs
        run: |
          node scripts/download-reviewed-photos.mjs benchmark/manifest-visible-legwear-2.json benchmark/photos validation-0031,validation-0030
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos commons-0059
          node scripts/download-reviewed-photos.mjs benchmark/manifest-fresh-11.json benchmark/photos validation-0017
      - name: Compare independent human parsing coat, skirt, dress and shoe pixels
        run: PYTHONPATH=benchmark python scripts/run-lip-garment-candidates.py benchmark/lip-garment-instance-review
      - name: Prohibit invented garment items or production promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('benchmark/lip-garment-instance-review')
          s=json.loads((p/'summary.json').read_text())
          assert s['status']=='complete' and len(s['cases'])==4 and s['sourceHashesVerified']
          assert s['automaticItemsCreated']==0 and s['productionAuthorized'] is False
          assert s['independentGarmentInstanceMasks'] is False
          by={case['id']:case for case in s['cases']}
          assert by['validation-0031']['reviewDisposition']=='distinct-classes-needing-outline-review'
          assert by['commons-0059']['reviewDisposition']=='no-garment-parsing-evidence'
          for case in s['cases']:
              assert case['automaticItemsCreated']==0
              assert case['stockingsOrTightsSeparateClass'] is False
              assert case['socksPixelsVerifyTights'] is False
              assert {'socks','pants','jumpsuit'}.issubset(case['exportedRoles'])
              by_role={r['role']:r for r in case['classCandidates']}
              for role,label in [('socks',8),('pants',9),('jumpsuit',10)]:
                  pixels=case['modelLabelPixelCounts'][str(label)]
                  assert (role in by_role)==(pixels>0)
                  if pixels:
                      assert by_role[role]['pixels']==pixels
                      assert (p/(case['id']+'-'+role+'-unverified-mask.png')).is_file()
              assert case['physicalInstancesConfirmed']==0
              assert case['independentMaskAccuracyVerified'] is False
              assert (p/(case['id']+'-separate-classes.png')).is_file()
              assert (p/(case['id']+'-skirt-boundary-review.png')).is_file()
              assert case['skirtBoundaryReview']['verifiedRecoveredFabricPixels']==0
              assert case['skirtBoundaryReview']['productionAuthorized'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-lip-separate-clothing-preview
          path: |
            benchmark/lip-garment-instance-review/summary.json
            benchmark/lip-garment-instance-review/*-separate-classes.png
            benchmark/lip-garment-instance-review/*-skirt-boundary-review.png
            benchmark/lip-garment-instance-review/*-unverified-mask.png
          retention-days: 14
