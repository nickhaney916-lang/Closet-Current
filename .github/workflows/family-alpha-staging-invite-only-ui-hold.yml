name: Family Alpha invite-only staging UI + server-policy HOLD - NO DEPLOY
on:
  pull_request:
    paths:
      - 'scripts/family-alpha-stage-invite-only-ui.mjs'
      - 'scripts/build-family-alpha-staging-auth-hold.mjs'
      - 'tests/family-alpha-staging-invite-ui.test.mjs'
      - 'docs/FAMILY-ALPHA-STAGING-INVITE-ONLY-RELEASE-HOLD-20261025.md'
      - '.github/workflows/family-alpha-staging-invite-only-ui-hold.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  STAGE_PIN: '879f1b92fb15f9bc9a7f0429c7ee178f7bbf1373'
  RECOGNITION_PIN: '795ad6637f8d4f782bc99751211b25e8e72a3a7d'
  RECOVERY_PIN: '08ed6ac4a3fc921eae5d5d3df3bd3966429559d2'
  REVIEW_PIN: '1ecac1079e75f1f25dc70a4c712b2448eb87dca8'
jobs:
  staging-client-invite-only-no-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch exact pinned source commits (not mutable branch heads)
        run: git fetch --no-tags origin "$STAGE_PIN" "$RECOGNITION_PIN" "$RECOVERY_PIN" "$REVIEW_PIN"
      - name: Build unchanged production plus offline disabled stage Auth
        run: node scripts/build-family-alpha-staging-auth-hold.mjs
      - name: Acceptance tests for invitation-only UI and synthetic allowed-account login
        run: node --test tests/family-alpha-staging-invite-ui.test.mjs
      - name: Build full disabled recognition and reviewed-JPEG photo-avatar
        run: node scripts/build-family-alpha-recognition-integrated-hold.mjs
      - name: Build separate disabled protected-root avatar
        run: node scripts/build-family-alpha-protected-preview-hold.mjs
      - name: Full offline staging and original-photo regressions
        run: node --test tests/*.test.cjs tests/*.test.mjs
      - name: Explicitly refuse public signup claims and all release activation
        run: |
          node --input-type=module -e "import{readFileSync}from'node:fs';import{assertProtectedPreviewHold}from'./scripts/build-family-alpha-protected-preview-hold.mjs';const auth=readFileSync('dist-family-alpha-staging-auth-hold/auth.js','utf8');const c=readFileSync('dist-family-alpha-staging-auth-hold/alpha-stage-config.js','utf8');const m=await assertProtectedPreviewHold();if(auth.includes(\"request('signup'+EMAIL_REDIRECT\")||!auth.includes('Family Alpha accounts require a private invitation')||!auth.includes(\"$('authMode').hidden=true\")||!c.includes('HOLD-NO-CALLBACK-OR-KEY')||!c.includes('\"key\":\"\"')||m.deployAllowed||m.ownerApproved||m.photoAvatarEnabled||m.stagingAuthReady)process.exit(1);console.log('Invitation UI only; direct Supabase signup SERVER enforcement still UNVERIFIED. Family Alpha HOLD.');"
