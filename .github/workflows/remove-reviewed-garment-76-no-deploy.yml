name: REMOVE76 protect individual reviewed clothes from accidental Remove NO DEPLOY
on:
  push:
    branches:
      - research/remove-reviewed-garment-76-main-20261105-HOLD
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preserve-uncommitted-human-reviewed-garment-until-owner-consents:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact verified CANCEL74 parent and reject unrelated changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor f51d4f82c456a2e1442417a8330f024b14d6c344 HEAD
          git diff --name-only f51d4f82c456a2e1442417a8330f024b14d6c344 HEAD >/tmp/remove76-files
          while IFS= read -r path; do
            case "$path" in
              research/remove-reviewed-garment-76/remove-review-guard.mjs|research/multi-garment-capture-01/review-ui.mjs|scripts/test-multi-garment-capture-01-browser.mjs|scripts/audit-remove-reviewed-garment-76-browser.mjs|tests/remove-reviewed-garment-76.test.mjs|.github/workflows/remove-reviewed-garment-76-no-deploy.yml) ;;
              *) echo "BLOCKED unrelated production/staging change: $path"; exit 1 ;;
            esac
          done </tmp/remove76-files
      - name: Install exact research test dependencies only
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Build and all inherited plus new remove-review Node tests
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Six inherited full original-JPEG owner-private real-browser workflows
        run: node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Six new real original-JPEG mobile-width one-garment removal protection tests
        run: REMOVE76=1 node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Independent 72 screenshot and strict private wardrobe audit
        run: node scripts/audit-remove-reviewed-garment-76-browser.mjs
      - name: Archive only source-pinned sanitized real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: REMOVE76-retain-reviewed-piece-on-dismiss-HOLD
          path: |
            benchmark/remove-reviewed-garment-76/acceptance.json
            benchmark/remove-reviewed-garment-76/*.png
          if-no-files-found: warn
          retention-days: 14
