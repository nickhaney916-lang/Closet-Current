name: MAIN1054 M56 pinned actual P88 source mask to owner review NO DEPLOY
on:
  push:
    branches: [research/main1054-m56-real-p88-mask-inference-HOLD]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  m56-source-receipt-and-inherited:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Freeze exact M55 parent, P88 worker and source path allowlist
        shell: bash
        run: |
          set -euo pipefail
          BASE=c22b0f8f654a15d37415cbbdaaef7cb0d0ea2657
          P88=cc4554ef0104506a72bf0a28423fee52b6e4fff2
          git merge-base --is-ancestor "$BASE" HEAD
          git cat-file -e "$P88^{commit}"
          test "$(git rev-parse "$P88:public/outfit-worker.mjs")" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse "$P88:public/outfit-segmentation.mjs")" = d357955dd8fdab7c0cb727ea597c270edd9309ac
          test "$(git rev-parse "$P88:public/outfit-instance-review-840.mjs")" = 6324d8eda33024f166311f424392ed83363e4942
          git diff --exit-code "$BASE" HEAD -- public/ supabase/ benchmark/ research/mission1-parallel88/ research/multi-garment-capture-01/ research/parallel89/ research/native-3d-05/
          git diff --name-only "$BASE" HEAD | while IFS= read -r path; do
            case "$path" in
              research/master-consolidation-1054/p88-source-mask-ledger-56.mjs|research/master-consolidation-1054/MILESTONE56.md|scripts/run-main56-p88-licensed-inference.mjs|tests/main56-source-mask-to-owner-intake.test.mjs|.github/workflows/main1054-m56-p88-real-mask-no-deploy.yml) ;;
              *) echo "M56 unexpected changed path $path"; exit 1;;
            esac
          done
          node --check research/master-consolidation-1054/p88-source-mask-ledger-56.mjs
          node --check scripts/run-main56-p88-licensed-inference.mjs
          node --check tests/main56-source-mask-to-owner-intake.test.mjs
      - name: Install source-only regression dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 playwright@1.56.1 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Synthetic source-mask integrity plus M55/M54 owner negative evidence
        run: node --test tests/main56-source-mask-to-owner-intake.test.mjs tests/main55-p88-source-key-lease.test.mjs tests/main54-unresolved-multi-mask-owner-veto.test.mjs
      - name: Build unchanged consumer assets for PWA tests
        run: node scripts/build.mjs
      - name: Run full inherited Node suite, without deployment
        run: node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Re-assert no consumer, hosted cloud, original JPEG or donor changes
        run: git diff --exit-code c22b0f8f654a15d37415cbbdaaef7cb0d0ea2657 HEAD -- public/ supabase/ benchmark/ research/mission1-parallel88/ research/multi-garment-capture-01/ research/parallel89/ research/native-3d-05/

  m56-genuine-pinned-segformer-mask-owner-trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Copy EXACT P88 segmentation source into disposable scratch, NOT a merge
        shell: bash
        run: |
          set -euo pipefail
          P88=cc4554ef0104506a72bf0a28423fee52b6e4fff2
          mkdir -p .m56-exact-p88-donor/public
          for file in outfit-worker.mjs outfit-segmentation.mjs outfit-instance-review-840.mjs; do
            git show "$P88:public/$file" > ".m56-exact-p88-donor/public/$file"
            test -s ".m56-exact-p88-donor/public/$file"
            test "$(git hash-object ".m56-exact-p88-donor/public/$file")" = "$(git rev-parse "$P88:public/$file")"
          done
          test "$(git hash-object .m56-exact-p88-donor/public/outfit-worker.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git hash-object .m56-exact-p88-donor/public/outfit-segmentation.mjs)" = d357955dd8fdab7c0cb727ea597c270edd9309ac
          test "$(git hash-object .m56-exact-p88-donor/public/outfit-instance-review-840.mjs)" = 6324d8eda33024f166311f424392ed83363e4942
          # Exact donor grouping imports './outfit-segmentation.mjs'.
          # Never place donor into default public/ or the deployed app.
      - name: Install real pinned fp32 ONNX source-model runtime without paid AI
        run: |
          set -euo pipefail
          ONNXRUNTIME_NODE_INSTALL=skip npm install --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 sharp@0.34.3 onnxruntime-node@1.22.0 fake-indexeddb@6.2.4
      - name: Run real source JPG bytes through model and P88 grouping then bounded review
        run: node --expose-gc scripts/run-main56-p88-licensed-inference.mjs
      - name: Verify source-safe explicit no-release evidence receipt, not a green-by-vacuity test
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const x=JSON.parse(fs.readFileSync('benchmark/main56-p88-real-original-owner-bridge/M56-GENUINE-MODEL-MASK-TO-MANUAL-REVIEW.json','utf8'));
          if(x.sourcePhotos.length!==2||x.syntheticLogitsUsed!==false||x.exactP88SegmentationAndReviewModulesExecuted!==true||
             x.sourceBrowserWorkerExecuted!==false||x.familyAlpha!=='HOLD'||x.automaticClosetSave!==false||
             x.sourcePhotos.some(p=>p.originalPreserved!==true||p.ownerPrivateSaved!==false||
               p.sourcePhoto3DClothApproved!==false||p.realSourceGroupCount!==p.reviewAdmittedCount+p.reviewRefusedCount))
            throw Error('M56 genuine model/source receipt invalid');
          const proposed=x.sourcePhotos.reduce((n,p)=>n+p.realSourceGroupCount,0);
          if(proposed===0)throw Error('M56 real source inference ran but generated zero proposals; no real adapter compatibility evidence');
          console.log('M56 real mask proposals and protected manual-review admissions',proposed);
          JS
          git diff --exit-code c22b0f8f654a15d37415cbbdaaef7cb0d0ea2657 HEAD -- public/ supabase/ research/mission1-parallel88/ research/multi-garment-capture-01/ research/parallel89/
      - name: Archive source-safe metrics ONLY — no original photos or mask blobs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main1054-m56-genuine-licensed-model-mask-manual-owner-HOLD
          path: benchmark/main56-p88-real-original-owner-bridge/M56-GENUINE-MODEL-MASK-TO-MANUAL-REVIEW.json
          retention-days: 14
          if-no-files-found: ignore
