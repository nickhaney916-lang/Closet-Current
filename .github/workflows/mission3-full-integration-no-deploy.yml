name: Mission 3 combined mobile, private cloud and performance acceptance — NO DEPLOY
on:
  push:
    branches: [research/mission3-complete-mobile-integration-20261110-HOLD]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated-mobile-cloud:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce immutable combined Mission 3 source and zero hosted changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=d9ba6e0c96589232c26afc0ef59ca1e963fd0aee
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --exit-code "$BASE" HEAD -- public supabase
          git diff --name-only "$BASE" HEAD | while read -r p; do
            case "$p" in
              .github/workflows/mission3-full-integration-no-deploy.yml|research/mission3-full-integration/REPORT.md) ;;
              *) echo "Unexpected integration branch mutation: $p"; exit 1 ;;
            esac
          done
      - name: Install pinned browser and regression dependencies
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Complete production build and all inherited and Mission 3 tests
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Licensed original JPEG fixture with independent source SHA
        run: node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos commons-0002
      - name: Full mobile camera import, source preservation and owner review
        run: |
          node scripts/test-camera-to-closet-79-browser.mjs
          node scripts/test-native-canonical-original-167-browser.mjs
      - name: Full mobile owned styling, wardrobe resilience, and accessibility
        run: |
          REQUIRE_WEBKIT=1 node scripts/test-family-alpha-mobile-ux-132.mjs
          node scripts/test-family-reliability-mobile.mjs
          node scripts/test-outfit-wardrobe-consistency-browser.mjs
          node scripts/test-outfit-draft-conflicts-browser.mjs
          node scripts/test-outfit-draft-resilience-browser.mjs
          node scripts/test-outfit-save-recovery-browser.mjs
      - name: Real browser research transport with synthetic signed-owner fixtures, no hosted JWT claims
        run: |
          node scripts/test-cloud-restore-browser-138.mjs
          node scripts/test-cross-browser-cloud-recovery-142.mjs
          node scripts/test-outfit-backup-compatibility-browser.mjs benchmark/mission3-integrated-backup
      - name: Verify result manifests from the integrated browser paths
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync,mkdirSync} from 'node:fs';
          const paths=[
            'benchmark/native-canonical-closet-style-167/results.json',
            'benchmark/family-reliability-mobile/results.json',
            'benchmark/outfit-wardrobe-consistency/results.json',
            'benchmark/outfit-draft-conflicts/results.json',
            'benchmark/outfit-draft-resilience/results.json',
            'benchmark/outfit-save-recovery/results.json',
            'benchmark/cloud-restore-browser-138/results.json',
            'benchmark/cross-browser-cloud-recovery-142/results.json',
            'benchmark/mission3-integrated-backup/results.json'
          ];
          const checked=[];
          for(const path of paths){
           const o=JSON.parse(readFileSync(path,'utf8'));
           const count=Array.isArray(o.cases)?o.cases.length:
            Array.isArray(o.engines)?o.engines.length:null;
           checked.push({path,cases:count,verdict:o.verdict||null});
          }
          mkdirSync('benchmark/mission3-integration-summary',{recursive:true});
          writeFileSync('benchmark/mission3-integration-summary/results.json',JSON.stringify({
           immutableCommit:process.env.GITHUB_SHA,noDeploy:true,
           exactMobileEngines:['chromium','webkit'],viewportsCSS:[320,390,430],
           backend:'synthetic owner / local research HTTP only',
           hostedJWT:false,physicalDevices:false,familyAlpha:'HOLD',
           checked
          },null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission3-integrated-mobile-cloud-HOLD
          path: |
            benchmark/camera-to-closet-75/
            benchmark/native-canonical-closet-style-167/
            benchmark/family-reliability-mobile/
            benchmark/outfit-wardrobe-consistency/
            benchmark/outfit-draft-conflicts/
            benchmark/outfit-draft-resilience/
            benchmark/outfit-save-recovery/
            benchmark/cloud-restore-browser-138/
            benchmark/cross-browser-cloud-recovery-142/
            benchmark/mission3-integrated-backup/
            benchmark/mission3-integration-summary/
            artifacts/family-alpha-mobile-ux-132/
          retention-days: 14
  bounded-large-wardrobe-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      P136_REPEATS: '2'
      P136_ENGINES: chromium,webkit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Chromium/WebKit, sharp and benchmark dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Bounded 25 to 1000 synthetic garment stress and screenshot audit
        run: node scripts/test-storage-resilience-136-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission3-large-wardrobe-performance-HOLD
          path: benchmark/storage-resilience-136/
          retention-days: 14
