name: P95 WebKit 36 fresh gesture-delivery witness NO DEPLOY
on:
  push:
    branches: [fix/parallel95-webkit-source-restore-reentry-HOLD]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  p95-webkit-gesture-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M51_ENGINE: webkit
      P95_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source and security ledger, no deployment
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor bddcc4da68bee90fb2aad545cffc2aaa620c959e HEAD
          test "$(git rev-parse HEAD:public/outfit-board.js)" = 5668a4bc6da2e94fc13d23392cd7fb4981d0bc2d
          test "$(git rev-parse HEAD:scripts/test-main51-real-app-owner-original-2d.mjs)" = 63cc9da00eaecbeb2576482dcae1528b44ea8189
          test "$(git rev-parse HEAD:research/main-thread-integration-1054/native-2d-preview.mjs)" = 0af20d49d87436683630d587ec0284c611cd3414
          git diff --exit-code bddcc4da68bee90fb2aad545cffc2aaa620c959e HEAD -- public/ ':(exclude)public/outfit-board.js' supabase/ research/main-thread-integration-1054/
          node --check scripts/test-parallel95-native-source-restore-reentry.mjs
      - name: Install isolated original pinned browser dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Twelve clean WebKit processes per shard; click/tap and forced/stable view
        shell: bash
        run: |
          set -euo pipefail
          for trial in $(seq 1 12); do
            echo "P95_GESTURE_PROCESS_BEGIN shard=$P95_SHARD trial=$trial exactHead=$(git rev-parse HEAD)"
            node scripts/test-parallel95-native-source-restore-reentry.mjs
            echo "P95_GESTURE_STRICT_PASS shard=$P95_SHARD trial=$trial widths=320,390,430"
          done
          echo "P95_GESTURE_SHARD_PASS shard=$P95_SHARD processes=12 noRetries=true"
