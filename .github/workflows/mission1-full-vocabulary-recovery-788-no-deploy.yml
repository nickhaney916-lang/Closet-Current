name: M1 P788 full-vocabulary recovery verification — NO DEPLOY
on:
  push:
    branches: [research/mission1-full-vocabulary-recovery-788-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m1-p788-full-vocabulary-HOLD-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-parent-node-all:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict P786 parent and native recognition only four paths, no shipping deployment
        run: |
          set -euo pipefail
          BASE=8de4c954e54e2ab2015a5b7a3d8c2af3ff226bdd
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD > /tmp/m1-p788-paths
          test "$(wc -l < /tmp/m1-p788-paths)" -eq 4
          while read -r path; do
            case "$path" in
              public/recognition-engine.mjs|tests/mission1-full-vocabulary-recovery-788.test.mjs|research/mission1-full-vocabulary-recovery-788/REPORT.md|.github/workflows/mission1-full-vocabulary-recovery-788-no-deploy.yml) ;;
              *) echo "UNAPPROVED CHANGE: $path"; exit 1 ;;
            esac
          done < /tmp/m1-p788-paths
          test -z "$(git diff --name-only "$BASE" HEAD -- public/app.js public/auth.js public/local-worker.mjs public/cloud-backup.js public/local-catalog.mjs public/native-reviewed-private-save-167.mjs supabase)"
          echo M1_P788_EXACT_PINNED_PARENT_FOUR_PATH_NO_DEPLOY
      - name: Install temporary build and full-regression dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Six adversarial recognition-oracle tests, production bundle build, all full Node regressions
        run: |
          set -euo pipefail
          node --check public/recognition-engine.mjs
          node --test tests/mission1-full-vocabulary-recovery-788.test.mjs
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  genuine-original-to-native-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      MULTI16_RELAY_MODEL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser-side ephemeral tools
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3
      - name: Regress real immutable B0 source on genuine original through actual native owner-local closet
        run: node scripts/test-mission1-real-segformer-to-closet-782-browser.mjs
      - name: Assert both real engines and abstaining human-reviewed result
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const x=JSON.parse(readFileSync('benchmark/mission1-real-model-native-closet-782/browser-results.json','utf8'));
          assert.equal(x.researchOnly,true);
          assert.equal(x.releaseAuthorized,false);
          assert.equal(x.familyAlpha,'HOLD');
          assert.equal(x.realAuthenticatedCloudUsers,false);
          assert.equal(x.actualModelSubtypeOrColorVerified,false);
          assert.deepEqual(new Set(x.scenarios.map(r=>r.browser)),new Set(['chromium','webkit']));
          for(const row of x.scenarios){
            assert.equal(row.allSemanticCategoriesSurfacedWithoutTopOnlyPromotion,true);
            assert.equal(row.observedDressRegionPreserved,true);
            assert.equal(row.modelTopSemanticDidNotSetItemType,true);
            assert.equal(row.actualMyClosetSaved,true);
            assert.equal(row.actualHumanGroundTruthIndependentlyVerified,false);
            assert.equal(row.nativeReviewedOtherOptionNotOffered,true);
            assert.equal(row.simulatedManualUnknownSubtypeRefusedBeforeSave,true);
            assert.equal(row.familyAlpha,'HOLD');
          }
          console.log('M1_P788_REAL_ORIGINAL_B0_CHROMIUM_WEBKIT_REVIEW_STILL_SAFELY_ABSTAINS');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission1-P788-original-CCBY-B0-native-review-two-browser-NO-RELEASE
          path: benchmark/mission1-real-model-native-closet-782/
          retention-days: 14
          if-no-files-found: warn
