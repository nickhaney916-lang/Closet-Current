name: M1 P806 verified REAL P804 SAM2 artifact native Adjust preview — NO DEPLOY
on:
  push:
    branches: [research/mission1-real-sam2-native-preview-806-HOLD]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: m1-p806-real-sam2-public-preview-HOLD-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-parent-full-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact green P805 head, seven allowlisted UI/QA source paths only
        run: |
          set -euo pipefail
          BASE=09ce05aceb8a8d6ff24f3699aefd47e9b83875f8
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD >/tmp/p806-paths
          test "$(wc -l </tmp/p806-paths)" -eq 7
          while read -r path; do
            case "$path" in
              public/mission1-public-sam2-mask-preview-806.mjs|public/owner-original-photo-point-798.mjs|public/app.js|scripts/test-mission1-real-segformer-to-closet-782-browser.mjs|tests/mission1-public-sam2-mask-preview-806.test.mjs|research/mission1-real-sam2-native-preview-806/REPORT.md|.github/workflows/mission1-real-sam2-native-preview-806-no-deploy.yml) ;;
              *) echo "UNAUTHORIZED MODEL/AUTH/OWNER/CLOUD/RELEASE CHANGE: $path"; exit 1 ;;
            esac
          done </tmp/p806-paths
          test -z "$(git diff --name-only "$BASE" HEAD -- supabase public/local-worker.mjs public/auth.js public/cloud-backup.js public/native-reviewed-private-save-167.mjs public/local-catalog.mjs public/photo-color.js benchmark)"
          grep -Fq 'FAMILY ALPHA HOLD #255' research/mission1-real-sam2-native-preview-806/REPORT.md
          echo M1_P806_EXACT_GREEN_P805_SEVEN_PATHS_ONLY_NO_DEPLOY
      - name: Ephemeral complete app regression dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Original photo SHA-bound public model replay negative tests plus build and complete Node
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check public/owner-original-photo-point-798.mjs
          node --check public/mission1-public-sam2-mask-preview-806.mjs
          node --check scripts/test-mission1-real-segformer-to-closet-782-browser.mjs
          node --test tests/mission1-public-sam2-mask-preview-806.test.mjs
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  true-P804-model-public-mask-in-native-browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      MULTI16_RELAY_MODEL: '1'
      M1_P806_PUBLIC_SAM2_ARTIFACT_DIR: /tmp/m1-p804-real-onnx-masks
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch IMMUTABLE genuine P804 SAM2 ONNX mask artifact from verified exact CI run
        uses: actions/download-artifact@v4
        with:
          name: mission1-P804-actual-non-oracle-native-browser-SAM2-source-mask-unverified-NO-DEPLOY
          run-id: 42936152260
          repository: nickhaney916-lang/Closet-Current
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/m1-p804-real-onnx-masks
      - name: Verify original P804 source/mask SHA-256, immutable non-oracle source geometry and no human approval
        run: |
          set -euo pipefail
          for spec in 'mask-chromium-pointBox-UNVERIFIED.png f8c50688b5932ae8c879b24ea638ade7994b3c1563b501c93d576c7236cb1bf9' 'mask-webkit-pointBox-UNVERIFIED.png d76ab0fb867270eafc8d76f5a6dc5fa693d342cca049fc226aa8dc661cad7f7e'; do
            set -- $spec
            echo "$2  /tmp/m1-p804-real-onnx-masks/$1" | sha256sum --check --status
          done
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('/tmp/m1-p804-real-onnx-masks/real-native-browser-box-sam2-results.json','utf8'));
          assert.equal(r.sourceSHA256,'e7a617cd23a159864f619e8397d5f37d48b684e47dddc4ad6b46b14481042019');
          assert.equal(r.familyAlpha,'HOLD');
          assert.equal(r.releaseAuthorized,false);
          assert.equal(r.actualIndependentHumanGesturePrompts,0);
          assert.equal(r.ownerMaskApproved,false);
          assert.equal(r.modelRunInHostedLinuxRunnerNotPhysicalPhone,true);
          for(const [browser,box,point] of [
            ['chromium',[360,426,1589,2530],[955,1434]],
            ['webkit',[360,432,1589,2535],[955,1440]]
          ]){
            const row=r.arms.find(x=>x.browser===browser&&x.promptArm==='pointBox');
            assert.ok(row&&row.actualPinnedONNXDecoderExecuted);
            assert.deepEqual(row.actualOriginalSourcePixelBox,box);
            assert.deepEqual(row.actualOriginalSourcePixelPositivePoint,point);
            assert.equal(row.oraclePolygonDerivedPrompt,false);
            assert.equal(row.independentHumanMaskIoU,null);
            assert.equal(row.autoSaveAllowed,false);
          }
          console.log('M1_P806_PINNED_REAL_SAM2_ONNX_P804_PUBLIC_JPEG_ARTIFACT_SHA_GENUINE_MASK_NOT_HUMAN_NOT_RELEASE');
          NODE
      - name: Run immutable REAL model mask positive tests and full original JPEG native Adjust Chromium/WebKit
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3
          node --test tests/mission1-public-sam2-mask-preview-806.test.mjs
          node scripts/test-mission1-real-segformer-to-closet-782-browser.mjs
      - name: Demand genuine original-gesture SAM2 overlay and no owner approval or private mask persistence
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const x=JSON.parse(readFileSync('benchmark/mission1-real-model-native-closet-782/browser-results.json'));
          assert.equal(x.familyAlpha,'HOLD');assert.equal(x.releaseAuthorized,false);
          assert.equal(x.realAuthenticatedCloudUsers,false);
          assert.deepEqual(new Set(x.scenarios.map(s=>s.browser)),new Set(['chromium','webkit']));
          for(const r of x.scenarios){
            assert.equal(r.P806ActualP804LinuxSAM2PublicArtifactRenderedNativeUnverified,true);
            assert.equal(r.P806OriginalJPEGSHAAndMaskPNGVerifiedBeforeOverlay,true);
            assert.equal(r.actualOriginalSourceOwnerMask803ManualCorrectionPointerAndKeyboard,true);
            assert.equal(r.actualOriginalSourceOwnerMask803NoApprovalOrPrivatePersistence,true);
            assert.equal(r.actualOriginalSourceOwnerBox800NotPersisted,true);
            assert.equal(r.actualMyClosetSaved,true);
            assert.equal(r.actualHumanGroundTruthIndependentlyVerified,false);
            assert.equal(r.actualSignedCloudRLS,false);
            assert.equal(r.physicalPhoneTested,false);
            assert.equal(r.familyAlpha,'HOLD');
          }
          console.log('M1_P806_REAL_P804_SAM2_PUBLIC_SOURCE_PNG_NATIVE_CHROMIUM_WEBKIT_ONLY_REPLAY_UNVERIFIED_NO_SAVE_NO_RELEASE');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission1-P806-P804-REAL-SAM2-original-native-Adjust-replay-masks-unverified-HOLD
          path: benchmark/mission1-real-model-native-closet-782/
          retention-days: 14
          if-no-files-found: warn
