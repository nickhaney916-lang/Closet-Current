name: SNAPSHOT78 allowlisted human-confirmed original-photo review snapshot NO DEPLOY
on:
  push:
    branches:
      - research/allowlisted-review-snapshot-78-main-20261105-HOLD
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sanitize-review-before-clone-without-losing-private-clothes:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact verified COLOR77 ancestor and research-only eight-file allowlist
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor e865c0b0f9e663c6d6da2bcd9d14122e2b3dd13a HEAD
          git diff --name-only e865c0b0f9e663c6d6da2bcd9d14122e2b3dd13a HEAD >/tmp/snapshot78-files
          while IFS= read -r path; do
            case "$path" in
              research/multi-garment-capture-01/review-save-finality-34.mjs|research/multi-garment-capture-01/review-ui.mjs|research/multi-garment-capture-01/atomic-group.mjs|tests/review-save-finality-34.test.mjs|tests/allowlisted-review-snapshot-78.test.mjs|tests/auth-review-session-36.test.mjs|tests/detector-manual-recovery-65.test.mjs|tests/review-source-epoch-34.test.mjs|tests/review-worker-finality-38.test.mjs|scripts/test-multi-garment-capture-01-browser.mjs|scripts/audit-allowlisted-review-snapshot-78-browser.mjs|.github/workflows/allowlisted-review-snapshot-78-no-deploy.yml) ;;
              *) echo "BLOCKED unrelated production/staging modification: $path"; exit 1 ;;
            esac
          done </tmp/snapshot78-files
      - name: Install pinned research-only test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: App build and full inherited plus seven new clone-safety Node tests
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Six inherited unchanged true original JPEG owner-private browser workflows
        run: node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Six real native browser original JPEG uncloneable meta and safe AI model receipt proofs
        run: SNAPSHOT78=1 node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Independently audit six native browser cases and 72 actual screenshot artifacts
        run: node scripts/audit-allowlisted-review-snapshot-78-browser.mjs
      - name: Archive source-authenticated, sanitized screenshots and diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SNAPSHOT78-allowlisted-owner-garment-review-HOLD
          path: |
            benchmark/allowlisted-review-snapshot-78/acceptance.json
            benchmark/allowlisted-review-snapshot-78/*.png
          if-no-files-found: warn
          retention-days: 14
