name: Mission 1 P850 private owner batch-review integration — NO DEPLOY
on:
  push:
    branches: [research/mission1-safe-batch-review-850-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mission1-p850-batch-review-HOLD
  cancel-in-progress: true
jobs:
  exact-P849-owner-queue-native-HOLD:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable verified P849 parent, strict eight-path scope, consent and no-deploy guards
        shell: bash
        run: |
          set -euo pipefail
          BASE=d6d339c30eecf9de867c5a266fb75f2f0720078d
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD >/tmp/p850-paths
          cat /tmp/p850-paths
          test "$(wc -l </tmp/p850-paths)" -eq 8
          while IFS= read -r path; do
            case "$path" in
              public/review-queue-850.js|public/app.js|public/index.html|public/app-theme.css|tests/mission1-review-queue-850.test.cjs|scripts/test-m1-batch-review-850.mjs|research/mission1-safe-batch-review-850/REPORT.md|.github/workflows/mission1-safe-batch-review-850-no-deploy.yml) ;;
              *) echo "M1 P850 UNSCOPED FILE $path"; exit 1 ;;
            esac
          done </tmp/p850-paths
          test -z "$(git diff --name-only "$BASE" HEAD -- supabase public/auth.js public/cloud-backup.js public/cloud-backup-engine.js public/local-worker.mjs public/outfit-worker.mjs public/outfit-capture.js public/garment-color-76.mjs public/clothing-memory.js public/photo-check.js public/photo-color.js benchmark)"
          grep -Fqx 'const reviewFirst836=true;' <(grep '^const reviewFirst836=' public/app.js)
          grep -Fq 'let saveInFlight=false;' public/app.js
          grep -Fq 'P849_CHANGED_CANDIDATE_OR_OWNER' public/app.js
          grep -Fq 'function learningScope72()' public/app.js
          grep -Fq "const outfitColor76=outfitUnits70" public/outfit-capture.js
          grep -Fq 'purgePhotoQualityHints845' public/app.js
          grep -Fq 'ReviewQueue850.create()' public/app.js
          grep -Fq 'id="reviewQueue850" type="checkbox"' public/index.html
          grep -Fq 'FAMILY ALPHA HOLD #255 OPEN' research/mission1-safe-batch-review-850/REPORT.md
          echo M1_P850_PINNED_PARENT_8_PATH_OWNER_REVIEW_NO_DEPLOY_PASS
      - name: Install temporary exact fixture/browser test dependencies only
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Source-bound P850, builds and full application Node suite
        run: |
          set -euo pipefail
          node --check public/review-queue-850.js
          node --check public/app.js
          node --check scripts/test-m1-batch-review-850.mjs
          node --test tests/mission1-review-queue-850.test.cjs
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
          echo M1_P850_NATIVE_BUILDS_ALL_PASS
  physical-engine-emulation-HOLD:
    needs: [exact-P849-owner-queue-native-HOLD]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install actual desktop Chromium and WebKit engines, not physical phones
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: P850 actual HTML+JS browser queue, owner switch, 25-photo skip and no-save proof
        run: |
          set -euo pipefail
          node scripts/test-m1-batch-review-850.mjs
      - name: Retain P849–P843 owner/source/physical-unit/privacy transaction behavior
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node scripts/test-parallel77-cross-capture-browser.mjs
          node scripts/test-parallel76-color-browser.mjs
          node scripts/test-m1-owner-learning-integration-847.mjs
          node scripts/test-m1-owner-pair-admission-846.mjs
          node scripts/test-m1-review-save-lifecycle-844.mjs parent
          node scripts/test-m1-review-save-lifecycle-844.mjs candidate
          node scripts/test-m1-review-first-default-843.mjs
          node scripts/test-m1-owner-review-editor-839.mjs
          node scripts/test-parallel73-photo-quality-browser.mjs
          echo M1_P850_BROWSER_320_390_430_ALL_OWNER_GATES_PASS
  original-source-nonaccuracy-proof-HOLD:
    needs: [exact-P849-owner-queue-native-HOLD]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      P73_PHOTO_IDS: commons-0003,commons-0014,commons-0021,commons-0033,commons-0049,commons-0060,commons-0077,commons-0082,commons-0094,validation-0001,validation-0019
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decoder for lawful original photo provenance only
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3
      - name: SHA verify original images, not human recognition acceptance
        run: |
          set -euo pipefail
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos "$P73_PHOTO_IDS"
          node scripts/evaluate-parallel73-real-photo.mjs
          echo M1_P850_11_PUBLIC_ORIGINAL_BYTES_PASS_NO_BLIND_ACCURACY
