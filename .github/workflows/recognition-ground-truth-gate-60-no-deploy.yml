name: RECOG60 independent category subtype color acceptance evidence NO DEPLOY
on:
  push:
    branches:
      - research/recognition-ground-truth-gate-60-main-20261105-HOLD
  pull_request:
    paths:
      - 'research/recognition-ground-truth-gate-60/**'
      - 'scripts/audit-recognition-ground-truth-60.mjs'
      - 'tests/recognition-ground-truth-gate-60.test.mjs'
      - '.github/workflows/recognition-ground-truth-gate-60-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-source-photo-and-scientific-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce exact verified LABEL59 parent, research-only file scope, never deploy
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 7c752116545c7a6a58075b8b174833d39a39f5b7 HEAD
          git diff --name-only 7c752116545c7a6a58075b8b174833d39a39f5b7 HEAD > /tmp/recognition60-file-scope
          while IFS= read -r path; do
            case "$path" in
              research/recognition-ground-truth-gate-60/*|scripts/audit-recognition-ground-truth-60.mjs|tests/recognition-ground-truth-gate-60.test.mjs|.github/workflows/recognition-ground-truth-gate-60-no-deploy.yml) ;;
              *) echo "BLOCKED production, existing staging or unrelated edit: $path"; exit 1 ;;
            esac
          done < /tmp/recognition60-file-scope
      - name: Install pinned offline test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Build app and pass full inherited and new exact-source scientific QA Node tests
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Verify genuine 59 licensed JPEG source SHA256 and output honest scientific HOLD
        run: |
          node scripts/audit-recognition-ground-truth-60.mjs
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const r=JSON.parse(readFileSync("benchmark/recognition-ground-truth-gate-60/acceptance-report.json","utf8"));
            if(r.scientificVerdict!=="NEEDS_REWORK"||r.releaseAuthorized!==false)throw Error("False scientific or release approval");
            if(r.counts.sourceRows!==59||r.counts.uniqueSHA256!==59||r.counts.lockedGarments!==13||
               r.counts.lockedNegatives!==3||r.counts.independentlyAdjudicated!==0||
               r.counts.preliminaryHistoricalColorLabels!==0||r.measuredIndependentMetrics!==null)
             throw Error("Expected provisional benchmark + absent color adjudication misrepresented");
            if(r.photoEvidence.sha256Verified!==59||r.photoEvidence.decodableJPEG!==59||
               r.photoEvidence.rightsMapped!==59)throw Error("Original JPEG provenance proof incomplete");
            if(r.recordedPriorPilot.kind!=="HISTORICAL_PROVISIONAL_EVIDENCE_NOT_REMEASURED")
             throw Error("Provisional old results wrongly treated as new inference");
            console.log("RECOG60 ALL 59 EXACT ORIGINAL PHOTOS AND SCIENTIFIC HOLD HONESTLY VERIFIED");
          '
      - name: Run six real licensed-original JPEG mobile-width owner-private browser regressions
        run: node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Archive ONLY source hashes, clear scientific HOLD and blank human annotation templates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RECOG60-independent-color-groundtruth-not-yet-verified-HOLD
          path: |
            benchmark/recognition-ground-truth-gate-60/acceptance-report.json
            benchmark/recognition-ground-truth-gate-60/*-UNSIGNED-template.json
            benchmark/multi-garment-capture-01/acceptance.json
          if-no-files-found: warn
          retention-days: 14
