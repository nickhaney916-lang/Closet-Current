name: Mission 1 P847 explicit owner-confirmed learning integration — NO DEPLOY
on:
  push:
    branches: [research/mission1-owner-confirmed-learning-integration-847-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mission1-p847-owner-learning-HOLD
  cancel-in-progress: true
jobs:
  exact-parent-native-HOLD:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable P846 parent, eight-path scope, owner-reviewed no-deploy controls
        shell: bash
        run: |
          set -euo pipefail
          BASE=cadc619c29db4e0447dbef0638c6f6e1a91311a6
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD > /tmp/p847-paths
          cat /tmp/p847-paths
          test "$(wc -l < /tmp/p847-paths)" -eq 8
          while IFS= read -r path; do
            case "$path" in
              public/app.js|public/clothing-memory.js|tests/parallel72-confirmed-learning.test.cjs|tests/mission1-owner-confirmed-learning-integration-847.test.cjs|scripts/parallel72-historical-control.mjs|scripts/test-m1-owner-learning-integration-847.mjs|research/mission1-owner-confirmed-learning-847/REPORT.md|.github/workflows/mission1-owner-confirmed-learning-847-no-deploy.yml) ;;
              *) echo "M1 P847 UNSCOPED $path"; exit 1 ;;
            esac
          done </tmp/p847-paths
          test -z "$(git diff --name-only "$BASE" HEAD -- supabase public/auth.js public/local-worker.mjs public/outfit-worker.mjs public/outfit-capture.js public/outfit-segmentation.mjs public/photo-color.js public/recognition-engine.mjs benchmark)"
          grep -Fqx 'const reviewFirst836=true;' <(grep '^const reviewFirst836=' public/app.js)
          grep -Fq 'let saveInFlight=false;' public/app.js
          grep -Fq 'purgePhotoQualityHints845' public/app.js
          grep -Fq 'const outfitUnits70=outfitInstances840' public/outfit-capture.js
          grep -Fq 'function learningScope72()' public/app.js
          grep -Fq 'scope.ownerId===owner' public/app.js
          grep -Fq 'FAMILY ALPHA HOLD #255' research/mission1-owner-confirmed-learning-847/REPORT.md
          echo M1_P847_EXACT_SOURCE_OWNER_8_PATH_NO_DEPLOY_PASS
      - name: Install temporary regression dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Actual source consent, privacy, revocation and full Node tests/builds
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check public/clothing-memory.js
          node --check scripts/test-m1-owner-learning-integration-847.mjs
          node --check tests/mission1-owner-confirmed-learning-integration-847.test.cjs
          node --test tests/parallel72-confirmed-learning.test.cjs tests/mission1-owner-confirmed-learning-integration-847.test.cjs
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
          echo M1_P847_NATIVE_REGRESSION_BUILDS_PASS
  real-browser-owner-learning-HOLD:
    needs: [exact-parent-native-HOLD]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop Chromium and WebKit, not physical phone browsers
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Actual P847 owner consent and owner correction flow
        run: |
          set -euo pipefail
          node scripts/test-m1-owner-learning-integration-847.mjs
      - name: Inherited P846 unit review, P844 save lifecycle, P843 default and P845 photo advice
        run: |
          set -euo pipefail
          node scripts/test-m1-owner-pair-admission-846.mjs
          node scripts/test-m1-review-save-lifecycle-844.mjs parent
          node scripts/test-m1-review-save-lifecycle-844.mjs candidate
          node scripts/test-m1-review-first-default-843.mjs
          node scripts/test-m1-owner-review-editor-839.mjs
          node scripts/test-parallel73-photo-quality-browser.mjs
          echo M1_P847_ALL_REAL_BROWSER_RESEARCH_ACCEPTANCE_PASS
  legal-original-image-source-hash-HOLD:
    needs: [exact-parent-native-HOLD]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      P73_PHOTO_IDS: commons-0003,commons-0014,commons-0021,commons-0033,commons-0049,commons-0060,commons-0077,commons-0082,commons-0094,validation-0001,validation-0019
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install no-save original-photo decoder
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3
      - name: Verify licensed original JPEG SHA only, NOT human blind accuracy
        run: |
          set -euo pipefail
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos "$P73_PHOTO_IDS"
          node scripts/evaluate-parallel73-real-photo.mjs
          echo M1_P847_REAL_ORIGINAL_SOURCE_HASH_DIAGNOSTIC_ONLY_PASS
