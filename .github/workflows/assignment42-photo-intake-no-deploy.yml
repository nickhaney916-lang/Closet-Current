name: Assignment 42 private photo intake HOLD
on:
  pull_request:
    branches: [research/main1054-cumulative-style-executable-HOLD]
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'research/assignment42-multi-photo-HOLD' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        lane: [chromium, webkit, regression]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact parent and changed paths
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          base=3b1a9df581dcd79ae6f3c9f53b1c38412cf677a1
          test "$PR_BASE" = "$base"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$(git rev-parse HEAD^)" = "$base"
          cat > "$RUNNER_TEMP/expected-paths" <<'PATHS'
          .github/workflows/assignment42-photo-intake-no-deploy.yml
          public/app.js
          public/index.html
          public/style.css
          scripts/assignment42-photo-intake-browser.mjs
          scripts/test-native-canonical-original-167-browser.mjs
          PATHS
          git diff --name-only "$base" HEAD > "$RUNNER_TEMP/actual-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Reproducible no-deploy build
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          cp -a dist "$RUNNER_TEMP/first-build"
          node scripts/build.mjs
          diff -qr "$RUNNER_TEMP/first-build" dist
      - if: matrix.lane == 'regression'
        run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
      - name: Native before and after
        if: matrix.lane != 'regression'
        shell: bash
        env:
          ENGINE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/baseline"
          mkdir -p "$baseline"
          git archive HEAD^ public scripts/build.mjs | tar -x -C "$baseline"
          (cd "$baseline" && node scripts/build.mjs)
          node scripts/assignment42-photo-intake-browser.mjs "$ENGINE" "$baseline/dist" baseline
          node scripts/assignment42-photo-intake-browser.mjs "$ENGINE" dist
