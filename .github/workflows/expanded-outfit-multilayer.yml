name: Experimental eight-photo outfit segmentation
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'benchmark/clothing-only-comparison.mjs'
      - 'benchmark/multilayer-outfit-evaluation.mjs'
      - 'tests/multilayer-outfit-evaluation.test.mjs'
      - 'benchmark/multilayer-review-safety.mjs'
      - 'tests/multilayer-review-safety.test.mjs'
      - 'benchmark/expanded-outfit-review-manifest.json'
      - 'scripts/run-expanded-outfit-multilayer.mjs'
      - '.github/workflows/expanded-outfit-multilayer.yml'
permissions:
  contents: read
jobs:
  experimental-outfits:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned experimental models and image library
        run: npm install --no-save --no-package-lock @huggingface/transformers@3.8.1 sharp@0.34.4
      - name: Validate category separation and original-preserving guards
        run: |
          node --check scripts/run-expanded-outfit-multilayer.mjs
          node --test tests/multilayer-outfit-evaluation.test.mjs tests/clothing-only-comparison.test.mjs tests/hybrid-garment-mask.test.mjs tests/multilayer-review-safety.test.mjs
      - name: Download eight hash-locked and licensed photos
        run: node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos commons-0001,commons-0003,commons-0041,commons-0043,commons-0060,commons-0062,commons-0059,validation-0008
      - name: Checksum verify portrait photo from independent validation set
        run: node scripts/download-reviewed-photos.mjs benchmark/manifest-fresh-11.json benchmark/photos validation-0008
      - name: Generate multi-layer garment cutout comparison evidence
        run: node scripts/run-expanded-outfit-multilayer.mjs benchmark/expanded-outfit-review
      - name: Fail closed without real image results or with unjustified accuracy claims
        run: |
          node -e "const s=require('./benchmark/expanded-outfit-review/summary.json');if(s.status!=='complete'||s.cases.length!==8||!s.allCasesProcessed||s.productionAuthorized!==false||s.independentlyApprovedMasks!==false||s.measuredPixelAccuracy!==false||s.cases.some(x=>!x.originalPreserved||x.automaticCatalogApproved||x.review?.automaticCatalogApproved!==false||x.review?.productionAuthorized!==false))throw Error('Expanded outfit gate failed')"
          for id in commons-0001 commons-0003 commons-0041 commons-0043 commons-0060 commons-0062 commons-0059 validation-0008; do
            test -n "$(ls benchmark/expanded-outfit-review/$id-*.png 2>/dev/null)"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-eight-photo-outfit-layer-reviews
          path: benchmark/expanded-outfit-review/
          retention-days: 14
