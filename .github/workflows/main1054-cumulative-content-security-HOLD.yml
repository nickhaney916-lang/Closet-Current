name: Main1054 cumulative content security HOLD
on:
  pull_request:
    branches: [research/assignment-33-weather-context-HOLD]
permissions:
  contents: read
jobs:
  mobile-browser:
    if: github.head_ref == 'research/main1054-jpeg-exif-fill-byte-HOLD' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: node scripts/build.mjs
      - run: node scripts/assignment-30-content.mjs
        env:
          A30_ENGINE: ${{ matrix.engine }}
          APP_SOURCE_ROOT: dist
