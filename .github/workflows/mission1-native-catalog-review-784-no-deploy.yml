name: Mission 1 P784 native reviewed subtype agreement — NO DEPLOY
on:
  push:
    branches:
      - research/mission1-native-catalog-review-784-HOLD
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mission1-784-native-review-HOLD-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-catalog-and-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact pinned integration parent and strict research-only change scope
        run: |
          set -euo pipefail
          BASE=bba0c0ced654230f9555cf264c7c332fc5fdc590
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD > /tmp/m1-784-diff
          while read -r path; do
            case "$path" in
              public/app.js|scripts/test-mission1-real-segformer-to-closet-782-browser.mjs|tests/mission1-reviewed-catalog-type-784.test.mjs|research/mission1-native-catalog-review-784/REPORT.md|.github/workflows/mission1-native-catalog-review-784-no-deploy.yml) ;;
              *) echo "Unapproved research change: $path"; exit 1 ;;
            esac
          done < /tmp/m1-784-diff
          test -z "$(git diff --name-only "$BASE" HEAD -- public/auth.js public/cloud-backup.js public/local-worker.mjs public/recognition-engine.mjs public/native-reviewed-private-save-167.mjs supabase)"
          test "$(wc -l < /tmp/m1-784-diff)" -eq 5
          echo M1_784_NO_DEPLOY_PROTECTED_NATIVE_PRIVACY_AND_MODEL_CODE_UNCHANGED
      - name: Install pinned ephemeral Node dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Syntax, subtype consistency, and complete native regression
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check scripts/test-mission1-real-segformer-to-closet-782-browser.mjs
          node --test tests/mission1-reviewed-catalog-type-784.test.mjs
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  real-original-model-to-private-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      MULTI16_RELAY_MODEL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact browser/model tools temporarily
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3
      - name: Real SHA-verified CC BY dress, genuine B0 model, unsaved Unknown refusal and reviewed simulated catalog save
        run: node scripts/test-mission1-real-segformer-to-closet-782-browser.mjs
      - name: Enforce real-model receipts without fabricating human correctness or release
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('benchmark/mission1-real-model-native-closet-782/browser-results.json'));
          assert.equal(r.researchOnly,true);
          assert.equal(r.originalRealB0CategoryOnly,true);
          assert.equal(r.releaseAuthorized,false);
          assert.equal(r.familyAlpha,'HOLD');
          assert.equal(r.actualModelSubtypeOrColorVerified,false);
          assert.equal(r.realAuthenticatedCloudUsers,false);
          assert.equal(r.scenarios.length,2);
          assert.deepEqual(new Set(r.scenarios.map(s=>s.browser)),new Set(['chromium','webkit']));
          for(const row of r.scenarios){
           assert.equal(row.nativeReviewedOtherOptionNotOffered,true);
           assert.equal(row.simulatedManualUnknownSubtypeRefusedBeforeSave,true);
           assert.equal(row.simulatedManualSubtypeSelectedFromNativeCatalog,true);
           assert.equal(row.actualMyClosetSaved,true);
           assert.equal(row.actualHumanGroundTruthIndependentlyVerified,false);
           assert.equal(row.familyAlpha,'HOLD');
          }
          console.log('M1_784_REAL_ORIGINAL_B0_CHROMIUM_WEBKIT_VALID_SUBTYPE_GUARD_HOLD');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission1-784-real-original-model-reviewed-catalog-simulated-human-HOLD
          path: benchmark/mission1-real-model-native-closet-782/
          retention-days: 14
          if-no-files-found: warn
