name: MAIN232 test-only post-WASM memory trap native owner recovery HOLD NO DEPLOY
on:
  push:
    branches: [research/main232-webkit-postwasm-memorytrap-owner-recovery-HOLD]
  pull_request:
    branches: [research/main228-repeatable-source-owner-native-HOLD]
permissions:
  contents: read
jobs:
  full-original-node-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable original source and ONLY two test-only paths
        shell: bash
        run: |
          set -euo pipefail
          BASE=c492a65207605f49887fa72756cd55ef65b6eb69
          git merge-base --is-ancestor "$BASE" HEAD
          changed="$(git diff --name-only "$BASE" HEAD)"
          test "$changed" = "$(printf '%s\n' '.github/workflows/main232-webkit-postwasm-memory-no-deploy.yml' 'scripts/test-main232-post-wasm-memory-error-native-owner-browser.mjs')"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          test "$(git rev-parse HEAD:research/multi-garment-capture-01/review-ui.mjs)" = 1bd97b80b51fab1cb269ae565acb73a274b6e6d0
          test "$(git rev-parse HEAD:scripts/test-main232-post-wasm-memory-error-native-owner-browser.mjs)" = 793a6336365be943f84e6444833025ee671babff
          node --check scripts/test-main232-post-wasm-memory-error-native-owner-browser.mjs
      - name: Install pinned original app/test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Offline build and unchanged complete source/owner/security Node suite
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  genuine-browser-with-distinct-controlled-error:
    name: M232 native browser real source and synthetic wasm trap (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, chromium]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source and test-only blob locks before native acceptance
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor c492a65207605f49887fa72756cd55ef65b6eb69 HEAD
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          test "$(git rev-parse HEAD:scripts/test-main232-post-wasm-memory-error-native-owner-browser.mjs)" = 793a6336365be943f84e6444833025ee671babff
          node --check scripts/test-main232-post-wasm-memory-error-native-owner-browser.mjs
      - name: Install real native pinned browser and original model dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Synthetic post-WASM RuntimeError native 320/430 owner source manual recovery (NEGATIVE only)
        shell: bash
        run: |
          set -euo pipefail
          for width in 320 430; do
            P94_WIDTH="$width" node scripts/test-main232-post-wasm-memory-error-native-owner-browser.mjs
          done
      - name: Separate UNMODIFIED worker real SegFormer true positive owner 430 source 2D/v4
        shell: bash
        run: |
          set -euo pipefail
          P94_WIDTH=430 node scripts/test-parallel94-native-p88-browser.mjs
