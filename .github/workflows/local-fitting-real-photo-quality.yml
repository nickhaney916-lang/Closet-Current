name: Offline real-photo fidelity and two-figure readiness
on:
  push:
    branches: [benchmark/real-photo-figure-readiness-20261019]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-real-photo-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned local image decoder
        run: python -m pip install Pillow==11.3.0
      - name: Build and run all Node tests
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Produce licensed real-photo diagnostics and asset-readiness evidence
        run: |
          python scripts/benchmark-local-fitting-quality.py
          node scripts/score-local-fitting-reviews.mjs artifacts/real-photo-quality/results.json artifacts/real-photo-quality/review-template.json artifacts/real-photo-quality/review-results.json
          node scripts/assert-local-fitting-baseline.mjs
          node scripts/test-local-fitting-packet.mjs
      - name: Check reproducible pixel and review output
        run: |
          cp artifacts/real-photo-quality/results.json /tmp/first-real-photo-results.json
          python scripts/benchmark-local-fitting-quality.py
          cmp /tmp/first-real-photo-results.json artifacts/real-photo-quality/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-photo-fidelity-and-figure-readiness
          path: artifacts/real-photo-quality/
