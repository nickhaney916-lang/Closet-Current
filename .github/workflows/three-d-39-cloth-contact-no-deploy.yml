name: 3D-39 actual photographed material-to-material cloth waist contact (DRAFT HOLD NO DEPLOY)
on:
  pull_request:
    paths:
      - 'research/three-d-39/**'
      - 'research/three-d-15/outfit-controller.mjs'
      - 'research/three-d-15/showroom.mjs'
      - 'research/three-d-31/photo-jeans-demo.mjs'
      - 'research/three-d-37/second-jeans-demo.mjs'
      - 'tests/three-d-39-original-cloth-contact.test.mjs'
      - 'scripts/test-three-d-39-real-cloth-contact-browser.mjs'
      - '.github/workflows/three-d-39-cloth-contact-no-deploy.yml'
permissions:
  contents: read
jobs:
  original-photo-full-outfit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Exact successful second-source PR443 parent and only allowed research files
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor a329134d451baa7ef7fbaeb30cfadf712542a1c6 HEAD
          git diff --name-only a329134d451baa7ef7fbaeb30cfadf712542a1c6 HEAD | while IFS= read -r f; do
            case "$f" in
              research/three-d-39/*|research/three-d-15/outfit-controller.mjs|research/three-d-15/showroom.mjs|research/three-d-31/photo-jeans-demo.mjs|research/three-d-37/second-jeans-demo.mjs|tests/three-d-39-original-cloth-contact.test.mjs|scripts/test-three-d-39-real-cloth-contact-browser.mjs|.github/workflows/three-d-39-cloth-contact-no-deploy.yml) ;;
              *) echo "OUT OF SCOPE: $f"; exit 1 ;;
            esac
          done
      - name: Install pinned no-token original photo development tools
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 three@0.180.0 playwright@1.56.1
      - name: Reproduce byte-exact two different original photos and source-only alpha proposals
        run: |
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node --test tests/three-d-31-jeans-source.test.mjs tests/three-d-37-source-true.test.mjs
      - name: Restore original CC0 male/female 163-bone models and genuine photographed AJ shirt
        run: |
          git fetch --no-tags origin 53f2ad344dc56a1477e343531c423aed0e66c17d dd6bac3fa9ff640d4f562cf925337440bdb5cf8f 3a572193987cb29389727426136c6eb3ac326783 dfb40889c4c1221fb1833b859e8a11ef38aeb76e
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
      - name: Four original model+photo combinations tested physically in real skinned source-pose geometry
        run: |
          node --test tests/three-d-39-original-cloth-contact.test.mjs
          node --test tests/three-d-38-full-outfit-waist.test.mjs tests/three-d-37-second-models.test.mjs tests/three-d-29-neckline.test.mjs
      - name: Render 96 genuine full-outfit real mobile WebGL source/relaxed angles and neutrals
        run: node scripts/test-three-d-39-real-cloth-contact-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: THREE-D-39-PHOTO-SHIRT-JEANS-CLOTH-CONTACT-WEBGL-HOLD
          path: |
            benchmark/three-d-39/
            benchmark/three-d-37/metrics.json
            benchmark/three-d-37/matte-review.png
            benchmark/three-d-31/metrics.json
          if-no-files-found: warn
