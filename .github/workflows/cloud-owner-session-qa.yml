name: Private cloud account session and stale-response QA
on:
  push:
    branches: [fix/cloud-sync-owner-generation-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud-owner-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build app and run complete customer regression suite
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Check no real-device or paid-service deployment is authorized
        run: |
          node scripts/check-customer-pilot-release-gates.mjs
          node scripts/check-dual-parent-review-integration.mjs
      - name: Install browser emulators
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium webkit
      - name: Verify cross-account stalled cloud response in real browser IndexedDB
        run: node scripts/test-cloud-session-generation-browsers.mjs
      - name: Prepare approved licensed photo used by existing private cloud recovery simulation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos commons-0002
          mkdir -p benchmark/cloud-backup
          cp benchmark/locked-photo-sources.json benchmark/cloud-backup/
      - name: Run full multi-device private closet migration, conflict and image-integrity flow
        run: node scripts/run-cloud-backup-flow.mjs benchmark/cloud-backup
      - name: Recheck private auth and owned-outfit customer flow
        run: |
          node scripts/test-auth-pilot-mobile.mjs
          node scripts/test-style-my-new-item-mobile.mjs
          STYLE_BROWSER=webkit node scripts/test-style-my-new-item-mobile.mjs
