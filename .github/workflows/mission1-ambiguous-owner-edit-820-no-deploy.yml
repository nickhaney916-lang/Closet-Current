name: Mission 1 P820 ambiguous source through owner editing, original confirmation and safe save — NO DEPLOY
on:
  push:
    branches: [research/mission1-ambiguous-owner-edit-gate-820-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mission1-P820-owner-ambiguous-review-HOLD
  cancel-in-progress: true
jobs:
  full-native-app-original-edit-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact green P819 parent and only five narrowly scoped source/test/report/CI files
        run: |
          set -euo pipefail
          BASE=4ac4849bc9f5d7ade1bf5bc66b2486074b6faf1c
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD > /tmp/m1-P820-paths
          cat /tmp/m1-P820-paths
          test "$(wc -l </tmp/m1-P820-paths)" -eq 5
          while read -r p; do
            case "$p" in
              public/app.js|tests/mission1-native-disconnected-review-818.test.mjs|tests/mission1-ambiguous-owner-edit-820.test.mjs|research/mission1-ambiguous-owner-edit-820/REPORT.md|.github/workflows/mission1-ambiguous-owner-edit-820-no-deploy.yml) ;;
              *) echo "UNAPPROVED PRIVATE CLOUD MODEL RELEASE OR ORIGINAL PHOTO MUTATION: $p"; exit 1 ;;
            esac
          done </tmp/m1-P820-paths
          test -z "$(git diff --name-only "$BASE" HEAD -- supabase benchmark)"
          grep -Fq 'FAMILY ALPHA HOLD #255' research/mission1-ambiguous-owner-edit-820/REPORT.md
          grep -Fq 'MISSION 1 NOT COMPLETE' research/mission1-ambiguous-owner-edit-820/REPORT.md
          echo M1_P820_EXACT_VERIFIED_P819_FIVE_OWNER_EDIT_FILES_ONLY_NO_DEPLOY
      - name: Install ephemeral complete app dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Actual native handlers then complete bundle and all application regression tests
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check tests/mission1-ambiguous-owner-edit-820.test.mjs
          node --test tests/mission1-ambiguous-owner-edit-820.test.mjs tests/mission1-native-disconnected-review-818.test.mjs tests/outfit-capture.test.cjs tests/outfit-worker.test.mjs
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  independent-ambiguous-photo-save-admission-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Direct isolated real native Adjust + clothingFields + candidate handler tests
        run: |
          set -euo pipefail
          node --test tests/mission1-ambiguous-owner-edit-820.test.mjs tests/mission1-native-disconnected-review-818.test.mjs
          grep -Fq 'confirmedSingleGarment820' public/app.js
          grep -Fq "sourceAmbiguityReviewProvenance820='explicit-owner-checkbox-not-independent-human-ground-truth'" public/app.js
          grep -Fq "if(!ambiguousSource820&&item.image" public/app.js
          echo M1_P820_ORIGINAL_OWNER_REVIEW_EXPLICIT_BEFORE_SAVE_NO_AI_MIXED_COLOR_NO_DEPLOY
