name: 3D-28 combined source-bound contact and skirt QA (DRAFT HOLD NO DEPLOY)
on:
  pull_request:
    paths:
      - 'research/three-d-15/demo.mjs'
      - 'research/three-d-15/outfit-controller.mjs'
      - 'research/three-d-15/showroom.mjs'
      - 'research/three-d-27/skirt-drape.mjs'
      - 'tests/three-d-27-skirt-drape.test.mjs'
      - 'scripts/test-three-d-27-skirt-browser.mjs'
      - '.github/workflows/three-d-28-contact-skirt-no-deploy.yml'
permissions:
  contents: read
jobs:
  combined-geometry-photo-and-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify exact 3D26 contact parent and seven-file nonproduction change limit
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin 0b6a33d0a8ce6089e1ec62c918e1ece79d8fd2e2
          git diff --name-only 0b6a33d0a8ce6089e1ec62c918e1ece79d8fd2e2 HEAD | while IFS= read -r f; do
            case "$f" in
              research/three-d-15/demo.mjs|research/three-d-15/outfit-controller.mjs|research/three-d-15/showroom.mjs|research/three-d-27/skirt-drape.mjs|tests/three-d-27-skirt-drape.test.mjs|scripts/test-three-d-27-skirt-browser.mjs|.github/workflows/three-d-28-contact-skirt-no-deploy.yml) ;;
              *) echo "Prohibited original media, body, auth, staging, prod, or Drive Duel change: $f"; exit 1 ;;
            esac
          done
          test "$(git diff --name-only 0b6a33d0a8ce6089e1ec62c918e1ece79d8fd2e2 HEAD | wc -l)" -le 7
          git diff --quiet 0b6a33d0a8ce6089e1ec62c918e1ece79d8fd2e2 HEAD -- research/three-d-24/anatomical-dress.mjs research/three-d-26/contact-presentation.mjs research/three-d-23/dress-neckline.mjs research/three-d-22/neckline-seams.mjs benchmark/locked-photo-sources.json
      - name: Install pinned local research dependencies (no deploy)
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 three@0.180.0 playwright@1.56.1
      - name: Recreate licensed original photos and original checksum-locked anatomical rigs
        run: |
          git fetch --no-tags origin 53f2ad344dc56a1477e343531c423aed0e66c17d dd6bac3fa9ff640d4f562cf925337440bdb5cf8f 3a572193987cb29389727426136c6eb3ac326783 dfb40889c4c1221fb1833b859e8a11ef38aeb76e
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
      - name: Both source-bound mesh passes and safe garment transitions
        run: |
          node --test tests/three-d-26-contact.test.mjs tests/three-d-27-skirt-drape.test.mjs tests/three-d-24-dress-fit.test.mjs
          node --test --test-name-pattern='genuine original anatomy|source module|Family Alpha' tests/three-d-25-integrated-anatomy.test.mjs
          node --test --test-name-pattern='Stock-only|Both garment cutouts' tests/three-d-15-outfits.test.mjs
      - name: Real source-and-pose 3D26 neck/body presentation browser regression
        run: node scripts/test-three-d-26-browser.mjs
      - name: Actual original dress source versus combined soft skirt; zero-difference shirt control
        run: node scripts/test-three-d-27-skirt-browser.mjs
      - name: Paired original body-triangle contact report, not full collision proof
        run: node scripts/audit-three-d-26-contact.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: THREE-D-28-COMBINED-NECK-AND-SKIRT-SOURCE-HOLD
          path: |
            benchmark/three-d-26/
            benchmark/three-d-27/
            research/three-d-06/models/verified-assets.json
          if-no-files-found: warn
