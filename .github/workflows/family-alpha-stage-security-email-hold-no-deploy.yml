name: Family Alpha live-metadata security + Resend email HOLD - NO DEPLOY
on:
  pull_request:
    paths:
      - 'research/family-alpha-security/staging-live-readonly-20261024.json'
      - 'scripts/family-alpha-stage-security-email-gate.mjs'
      - 'tests/family-alpha-stage-security-email-gate.test.mjs'
      - 'docs/FAMILY-ALPHA-STAGING-SECURITY-EMAIL-HANDOFF-HOLD-20261024.md'
      - '.github/workflows/family-alpha-stage-security-email-hold-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-and-staged-auth-no-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build disabled staging AUTH artefact — NO key, NO callback
        run: node scripts/build-family-alpha-staging-auth-hold.mjs
      - name: Evaluate current live-metadata evidence, owner-screen Verified DNS and strict SMTP/RLS release HOLD
        run: node scripts/family-alpha-stage-security-email-gate.mjs
      - name: Twelve positive and negative account/email security evidence gates
        run: node --test tests/family-alpha-stage-security-email-gate.test.mjs
      - name: Check static credentials and production routing are absent
        run: |
          node --input-type=module -e "import {runStagingSecurityAndEmail} from './scripts/family-alpha-stage-security-email-gate.mjs';const r=await runStagingSecurityAndEmail();if(r.releaseGate!=='HOLD'||r.invitationReady||r.readyForFamilyAlpha||r.liveMailSent||r.customSmtpLiveConfigurationVerified||r.genuineJWTAuthorizationTested||!r.productionUnchanged)process.exit(1);console.log('FAMILY ALPHA HOLD: Resend domain screenshot Verified, no SMTP, production untouched, synthetic SQL RLS is not real JWT validation');"
      - name: Fetch immutable isolated Family Alpha recognition / avatar source for inherited read-only tests
        run: |
          git fetch --no-tags origin 879f1b92fb15f9bc9a7f0429c7ee178f7bbf1373 795ad6637f8d4f782bc99751211b25e8e72a3a7d 08ed6ac4a3fc921eae5d5d3df3bd3966429559d2 1ecac1079e75f1f25dc70a4c712b2448eb87dca8
      - name: Assemble isolated original JPEG avatar / recognition artifact with disabled Auth — NO deploy
        run: node scripts/build-family-alpha-recognition-integrated-hold.mjs
      - name: Full current normal app node regression suite (no Supabase or email calls)
        run: node --test tests/*.test.cjs tests/*.test.mjs
