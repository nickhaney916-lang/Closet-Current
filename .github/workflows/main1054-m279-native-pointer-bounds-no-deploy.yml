name: MAIN1054 M279 original WebKit JSEP native pointer bounds HOLD
on:
  push:
    branches: [research/main1054-m279-native-pointer-bounds-HOLD]
permissions:
  contents: read
jobs:
  m279-source-security-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original JSEP Worker source, immutable test-only instrumentation and ancestry
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD:research/main1054/m279-native-pointer-bounds.mjs)" = 7b241c1dd08516a8a8a4459b3ffb209424347bff
          node research/main1054/m279-native-pointer-bounds.mjs prepare
          node --check scripts/.cc-m279-native-bounds.mjs
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse HEAD:research/main1054/m278-native-session-memory-class.mjs)" = 8c8ac5a2eae233778a805063eba57dce22e1c386
      - name: Adversarial pointer/length, memory-bounds, missing-offset and source-falsification tests
        run: node --test tests/main1054-m279-native-pointer-bounds.test.mjs tests/main1054-m278-native-session-memory-class.test.mjs
      - name: Inherited original-native and graph A/B negative test suite
        run: node --test tests/main1054-m269-webkit-original-graph-optimization-ab.test.mjs
      - name: Install pinned local no-deploy source test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Original offline build and inherited privacy/security/owner photo and backup tests
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          test -s dist/index.html
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  m279-original-native-first-attempt-cohort:
    needs: m279-source-security-node
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        include:
          - {engine: webkit, width: 320, count: 16}
          - {engine: webkit, width: 390, count: 16}
          - {engine: webkit, width: 430, count: 16}
          - {engine: chromium, width: 390, count: 2}
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: ${{ matrix.engine }}
      P94_WIDTH: ${{ matrix.width }}
      M279_COUNT: ${{ matrix.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin exact original model Worker; prepare additive disposable native ABI observer
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD:research/main1054/m279-native-pointer-bounds.mjs)" = 7b241c1dd08516a8a8a4459b3ffb209424347bff
          node research/main1054/m279-native-pointer-bounds.mjs prepare
          node --check scripts/.cc-m279-native-bounds.mjs
      - name: Install true original WebKit Chromium model and owner-private journey dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Capture every first-attempt original model native result; NEVER retry or hide RED
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m279-sanitized
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          failed=0
          for i in $(seq 1 "$M279_COUNT"); do
            child=0
            timeout -k 5s 170s node scripts/.cc-m279-native-bounds.mjs > "$log" 2>&1 || child=$?
            export M279_ORDINAL="$i"
            receipt=0
            node research/main1054/m279-native-pointer-bounds.mjs receipt "$log" "$child" > "m279-sanitized/$i.txt" || receipt=$?
            cat "m279-sanitized/$i.txt"
            if [ "$child" != 0 ] || [ "$receipt" != 0 ] || ! grep -q '^P91_FULL_JOURNEY_PASS ' "$log"; then
              failed=1
              echo "M279_ORIGINAL_MODEL_RED_OR_BLOCKED_PRESERVED ordinal=$i"
            fi
          done
          exit "$failed"
      - name: Archive only sanitized native pointer/length, memory bounds, numeric frame and original verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m279-original-native-${{ matrix.engine }}-${{ matrix.width }}-HOLD
          path: m279-sanitized/*.txt
          retention-days: 7
          if-no-files-found: ignore
