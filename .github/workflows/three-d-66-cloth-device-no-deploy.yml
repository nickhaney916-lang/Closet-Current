name: 3D-66 original-source gravity cloth and handset QA (DRAFT HOLD NO DEPLOY)
on:
  pull_request:
    paths:
      - 'research/three-d-66/**'
      - 'research/three-d-15/outfit-controller.mjs'
      - 'research/three-d-15/showroom.mjs'
      - 'research/three-d-31/photo-jeans-demo.mjs'
      - 'research/three-d-37/second-jeans-demo.mjs'
      - 'tests/three-d-66-source-fabric-drape.test.mjs'
      - 'scripts/test-three-d-66-original-sleeve-browser.mjs'
      - 'scripts/serve-three-d-66-device.mjs'
      - 'tests/three-d-66-physical-phone-gate.test.mjs'
      - 'scripts/capture-three-d-66-android-hardware.mjs'
      - 'tests/three-d-66-usb-hardware-evidence.test.mjs'
      - 'tests/three-d-66-ios-research-origin.test.mjs'
      - '.github/workflows/three-d-66-cloth-device-no-deploy.yml'
permissions:
  contents: read
jobs:
  actual-source-shoulder-top:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Exact fully green 3D61 photograph source parent, strict 3D64 research only
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor ce9ae8d555938549e7e9c1ee8c455b598297c7af HEAD
          git diff --name-only ce9ae8d555938549e7e9c1ee8c455b598297c7af HEAD | while IFS= read -r file; do
            case "$file" in
              research/three-d-66/*|research/three-d-15/outfit-controller.mjs|research/three-d-15/showroom.mjs|research/three-d-31/photo-jeans-demo.mjs|research/three-d-37/second-jeans-demo.mjs|tests/three-d-66-source-fabric-drape.test.mjs|scripts/test-three-d-66-original-sleeve-browser.mjs|scripts/serve-three-d-66-device.mjs|tests/three-d-66-physical-phone-gate.test.mjs|scripts/capture-three-d-66-android-hardware.mjs|tests/three-d-66-usb-hardware-evidence.test.mjs|tests/three-d-66-ios-research-origin.test.mjs|.github/workflows/three-d-66-cloth-device-no-deploy.yml) ;;
              *) echo "3D66 DISALLOWED production/staging or unrelated path $file"; exit 1 ;;
            esac
          done
      - name: Install pinned local original-photo research only; no external AI inference
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 three@0.180.0 playwright@1.56.1 three-mesh-bvh@0.9.2
      - name: Generate both original licensed photographic denim sources and validate original SHA
        run: |
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node --test tests/three-d-31-jeans-source.test.mjs tests/three-d-37-source-true.test.mjs
      - name: Restore original CC0 163 bone male female and licensed shirt, never generated stand-ins
        run: |
          git fetch --no-tags origin 53f2ad344dc56a1477e343531c423aed0e66c17d dd6bac3fa9ff640d4f562cf925337440bdb5cf8f 3a572193987cb29389727426136c6eb3ac326783 dfb40889c4c1221fb1833b859e8a11ef38aeb76e
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
      - name: Real original skinned upper sleeve gravity folds with source UV, 163 bone and bilateral sewn cap seams
        run: |
          node --check research/three-d-66/original-sleeve-gravity-drape.mjs
          node --test tests/three-d-66-source-fabric-drape.test.mjs
      - name: Ensure physical phone acceptance requires human signoff and local-only real source hardware preview
        run: |
          node --check research/three-d-66/phone-acceptance.mjs
          node --check scripts/serve-three-d-66-device.mjs
          node --test tests/three-d-66-physical-phone-gate.test.mjs
          node --check scripts/capture-three-d-66-android-hardware.mjs
          node --test tests/three-d-66-usb-hardware-evidence.test.mjs
          node --test tests/three-d-66-ios-research-origin.test.mjs
      - name: Real Chromium source photographed 390 mobile original UPPER SLEEVE pixel gate both figures and denims
        run: node scripts/test-three-d-66-original-sleeve-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: THREE-D-66-ACTUAL-UPPER-SLEEVE-ORIGINAL-SOURCE-QA-HOLD
          path: |
            benchmark/three-d-66/
          if-no-files-found: warn
