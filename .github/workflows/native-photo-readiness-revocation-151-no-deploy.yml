name: P151 native owner-photo readiness revocation mobile WebGL privacy NO DEPLOY
on:
  push:
    branches: [research/native-photo-readiness-revocation-151-main-20261107-HOLD]
  pull_request:
    branches: [research/dual-humanoid-visual-evidence-149-main-20261107-HOLD]
    paths:
      - research/native-photo-readiness-revocation-151/**
      - research/native-photo-readiness-08/native-readiness-panel.mjs
      - tests/native-photo-readiness-revocation-151.test.mjs
      - scripts/test-native-photo-readiness-08-browser.mjs
      - scripts/audit-native-photo-readiness-151.mjs
      - .github/workflows/native-photo-readiness-revocation-151-no-deploy.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-source-owner-integrity-and-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact verified P149 parent, seven allowed research paths; no staging production auth/cloud/other project edits
        run: |
          BASE=240a9762720373607fb5c573d87e7cdbb86fc1b2
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          FIRST="$(git rev-list --reverse "$BASE..HEAD" | head -n 1)"
          test "$(git rev-parse "$FIRST^")" = "$BASE"
          git diff --name-only "$BASE" HEAD >/tmp/p151-scope
          while IFS= read -r path; do
            case "$path" in
              research/native-photo-readiness-revocation-151/photo-readiness-lease.mjs|research/native-photo-readiness-revocation-151/REPORT.md|research/native-photo-readiness-08/native-readiness-panel.mjs|tests/native-photo-readiness-revocation-151.test.mjs|scripts/test-native-photo-readiness-08-browser.mjs|scripts/audit-native-photo-readiness-151.mjs|.github/workflows/native-photo-readiness-revocation-151-no-deploy.yml) ;;
              *) echo "P151 refuse unexpected file: $path"; exit 1 ;;
            esac
          done </tmp/p151-scope
          test "$(wc -l </tmp/p151-scope)" -eq 7
          git diff --exit-code "$BASE" HEAD -- public supabase research/native-3d-05 research/native-consumer-board-04 research/native-owner-reviewed-cloud-ui-146 research/dual-humanoid-visual-evidence-149 research/isolated-hosted-supabase-acceptance-148 package.json package-lock.json
      - name: Install temporary pinned test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund fake-indexeddb@6.2.4 sharp@0.34.3 playwright@1.56.1 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Check source and focused owner/photo/source-revision tests
        run: |
          node --check research/native-photo-readiness-revocation-151/photo-readiness-lease.mjs
          node --check research/native-photo-readiness-08/native-readiness-panel.mjs
          node --check tests/native-photo-readiness-revocation-151.test.mjs
          node --check scripts/test-native-photo-readiness-08-browser.mjs
          node --check scripts/audit-native-photo-readiness-151.mjs
          node --test tests/native-photo-readiness-revocation-151.test.mjs
      - name: Build unchanged native Closet Current app
        run: node scripts/build.mjs
      - name: Full inherited Node suite at exact commit
        run: node --test tests/*.test.cjs tests/*.test.mjs
  genuine-native-two-owner-mobile-photo-and-3d-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned real-browser fixtures and exact donor dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Assemble byte-identical independent PR541 163-bone original photographic research donor
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin df6885d6011cb33fb22dceb81a08f35a0ac4dd61 53f2ad344dc56a1477e343531c423aed0e66c17d dd6bac3fa9ff640d4f562cf925337440bdb5cf8f 3a572193987cb29389727426136c6eb3ac326783 dfb40889c4c1221fb1833b859e8a11ef38aeb76e
          git worktree add --detach .native05-donor-541 df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          git config --global --add safe.directory "$GITHUB_WORKSPACE/.native05-donor-541"
          test "$(git -C .native05-donor-541 rev-parse HEAD)" = df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          ln -s ../node_modules .native05-donor-541/node_modules
          cd .native05-donor-541
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
          test -f benchmark/work47/manifest.json
          node --test tests/outfit-3d-01.test.mjs
      - name: Real native camera + photo + outfit + restored 163-bone 3D at 320 390 430 with background and source-revision eviction
        run: P151=1 node scripts/test-native-photo-readiness-08-browser.mjs
      - name: Independently SHA verify 24 original native/screens and 9 genuine donor WebGL mobile 3D frames
        run: node scripts/audit-native-photo-readiness-08.mjs
      - name: Independently verify six additional cleared/rechecked P151 photo-readiness source screenshots
        run: node scripts/audit-native-photo-readiness-151.mjs
      - name: Verify result evidence never authorizes family release or misrepresents signed cloud accounts
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const native=JSON.parse(readFileSync('benchmark/native-photo-readiness-08-audit/acceptance.json','utf8'));
          const lease=JSON.parse(readFileSync('benchmark/native-photo-readiness-151/audit/acceptance.json','utf8'));
          assert.equal(native.verifiedBrowserScreenshots,24);
          assert.equal(native.verifiedGenuine3DFrames,9);
          assert.equal(lease.screenshots,6);
          assert.equal(lease.backgroundClearsPrivateJPEGCardSource,true);
          assert.equal(lease.revision93InvalidatesSource,true);
          assert.equal(lease.freezeClearsPrivateJPEGCardSource,true);
          assert.equal(lease.noAutomaticRedisplay,true);
          assert.equal(lease.realSignedRLSOrCustomerPhotos,false);
          assert.equal(lease.familyAlpha,'HOLD');
          assert.equal(lease.releaseAuthorized,false);
          console.log('P151: actual native phone-sized source image cards revoked on owner/background/source refresh; no automatic new 3D or alpha release.');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P151-owner-photo-readiness-revocation-mobile-3D-HOLD-NO-DEPLOY
          path: |
            research/native-photo-readiness-revocation-151/REPORT.md
            benchmark/native-photo-readiness-08/results.json
            benchmark/native-photo-readiness-08/*.png
            benchmark/native-photo-readiness-08-audit/acceptance.json
            benchmark/native-photo-readiness-151/acceptance.json
            benchmark/native-photo-readiness-151/*.png
            benchmark/native-photo-readiness-151/audit/acceptance.json
          if-no-files-found: warn
          retention-days: 14
