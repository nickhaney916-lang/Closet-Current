name: Mission 2 original photographed dress moving cloth self-contact P2-C57 NO DEPLOY
'on':
  push:
    branches:
      - research/mission2-real-photo-pixel-proof57-20261113-HOLD
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  strict-original-photo-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lock exact immutable original C56 and exactly 4 photographic pixel-source/test/CI paths
        shell: bash
        run: |
          set -eu
          BASE=dcfc12969438a4fce8211888268634359cf54b89
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE" HEAD >/tmp/p2-c57-files
          while IFS= read -r path; do
            case "$path" in
              research/mission2-source-length/photo-phase-pixel-diff57.mjs|tests/mission2-real-photo-phase-pixels57.test.mjs|scripts/audit-mission2-real-photo-phase-pixels57.mjs|.github/workflows/mission2-actual-photo-pixel57-no-deploy.yml)
                ;;
              *)
                echo "C57 prohibited file: $path"
                exit 1
                ;;
            esac
          done </tmp/p2-c57-files
          test "$(wc -l </tmp/p2-c57-files)" -eq 4
          git diff --exit-code "$BASE" HEAD -- public supabase benchmark/fixtures benchmark/locked-photo-sources.json package.json package-lock.json
          node --check scripts/install-mission2-source-dress-motion.mjs
          node --check research/mission2-source-length/source-dress-motion.mjs
          node --check research/mission2-source-length/source-dress-moving-surface.mjs
          node --check research/mission2-source-length/source-dress-receipt-lock.mjs
          node --check tests/mission2-moving-dress-body-surfaces.test.mjs
          node --check scripts/test-native-3d-05-browser.mjs
          node --check scripts/audit-mission2-source-dress-motion.mjs
          node --check research/mission2-source-length/actual-photo-contact-52.mjs
          node --check tests/mission2-original-licensed-contact52.test.mjs
          node --check scripts/install-mission2-actual-photo-contact52.mjs
          node --check scripts/audit-mission2-actual-dress-contact52.mjs
          node --check scripts/audit-mission2-real-photo-phases56.mjs
          node --check research/mission2-source-length/real-photo-contact-phases56.mjs
          node --check tests/mission2-real-photo-phases56.test.mjs
          node --check research/mission2-source-length/photo-phase-pixel-diff57.mjs
          node --check scripts/audit-mission2-real-photo-phase-pixels57.mjs
          node --check tests/mission2-real-photo-phase-pixels57.test.mjs
      - name: Install pinned verification dependencies only
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Verify original source guardrails, 5 phases and real pixel image digest tests, no source waiver
        run: node --test tests/mission2-real-photo-phase-pixels57.test.mjs tests/mission2-real-photo-phases56.test.mjs tests/mission2-original-licensed-contact52.test.mjs tests/mission2-moving-dress-body-surfaces.test.mjs tests/mission2-source-dress-swept-body.test.mjs tests/mission2-source-dress-local-continuity.test.mjs tests/mission2-source-dress-motion.test.mjs tests/native-original-dress-drape-175.test.mjs
      - name: Full inherited repository regression and unchanged consumer build
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  real-source-dress-moving-vertex-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PHOTO_FIT171: '1'
      PHOTO_TORSO173: '1'
      PHOTO_SLEEVE174: '1'
      PHOTO_DRESS175: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real original source 3D photo screenshot dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Set up exact original licensed 163-bone P541+P60+P172 donor snapshots
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          P541=df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          P60=6fe5e46b91533a96f3c0d86950ea077cb355c459
          P172=88d2fdb412f84b0498c86bfa17f4b391425e1958
          git fetch --no-tags origin "$P541" "$P60" "$P172"
          git worktree add --detach .native05-donor-541 "$P541"
          git worktree add --detach .p173-p60 "$P60"
          git worktree add --detach .p173-p172 "$P172"
          for name in .native05-donor-541 .p173-p60 .p173-p172; do
            git config --global --add safe.directory "$GITHUB_WORKSPACE/$name"
            ln -s ../node_modules "$name/node_modules"
          done
          test "$(git -C .native05-donor-541 rev-parse HEAD)" = "$P541"
      - name: Build immutable source humanoid models and licensed cloth
        run: |
          set -eu
          cd .native05-donor-541
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
      - name: Integrate audited original dress P61 and source-only C36 motion in detached donor
        run: |
          set -eu
          cd .p173-p60
          node scripts/install-photo-cloth-realism-164.mjs ../.native05-donor-541
          cd ..
          node scripts/install-native-photo-anatomical-fit-171.mjs .native05-donor-541
          node scripts/install-native-photo-torso-173.mjs .native05-donor-541 .p173-p172
          node scripts/install-source-shoulder-seam-174.mjs .native05-donor-541
          node scripts/install-native-original-dress-drape-175.mjs .native05-donor-541
          node scripts/install-mission2-source-dress-motion.mjs .native05-donor-541
          node scripts/install-mission2-actual-photo-contact52.mjs .native05-donor-541
          grep -Fq 'sampleSourceDressMotion36(fitted,root' .native05-donor-541/research/dress-mobile-01/dress-outfit-controller.mjs
          grep -Fq 'refinePhotographedDress61(fitted,root)' .native05-donor-541/research/dress-mobile-01/dress-outfit-controller.mjs
          node --check .native05-donor-541/research/dress-mobile-01/dress-outfit-controller.mjs
          node --check .native05-donor-541/research/mission2-source-length/source-dress-motion.mjs
      - name: Real licensed source dress 163-bone 5-phase full contact and source half-edge audit
        shell: bash
        run: |
          set -eu
          for phase in 0 0.25 0.5 0.75 1; do
            echo "C56 genuine original photographed dress phase ${phase}"
            PHOTO_DRESS_MOTION36=1 PHOTO_DRESS_CONTACT52=1 PHOTO_DRESS_DISTANCE53=1 PHOTO_DRESS_TOPOLOGY54=1 PHOTO_DRESS_HALF_EDGE55=1 PHOTO_DRESS_MOTION_PHASE36="$phase" node scripts/test-native-3d-05-browser.mjs
            PHOTO_DRESS_DISTANCE53=1 PHOTO_DRESS_TOPOLOGY54=1 PHOTO_DRESS_HALF_EDGE55=1 node scripts/audit-mission2-actual-dress-contact52.mjs
            PHOTO_DRESS_MOTION_PHASE36="$phase" node scripts/audit-mission2-real-photo-phases56.mjs snapshot
            mkdir -p "benchmark/mission2-real-photo-phases56/screens/phase-${phase}"
            cp benchmark/native-3d-05/*.png "benchmark/mission2-real-photo-phases56/screens/phase-${phase}/"
          done
          node scripts/audit-mission2-real-photo-phases56.mjs finalize
          node scripts/audit-mission2-real-photo-phase-pixels57.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M2-P2-C57-real-photo-pixel-proof-HOLD
          path: |
            benchmark/mission2-real-photo-phases56/
            benchmark/native-3d-05/
          retention-days: 14
          if-no-files-found: warn
