name: SOURCE70 prove new original JPEG before replacing manual review NO DEPLOY
on:
  push:
    branches:
      - research/verified-photo-switch-70-main-20261105-HOLD
  pull_request:
    paths:
      - 'research/verified-photo-switch-70/**'
      - 'research/multi-garment-capture-01/review-ui.mjs'
      - 'scripts/test-multi-garment-capture-01-browser.mjs'
      - 'scripts/audit-verified-photo-switch-70-browser.mjs'
      - 'tests/verified-photo-switch-70.test.mjs'
      - '.github/workflows/verified-photo-switch-70-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-photo-source-precommit-and-private-closet:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Lock exact independently verified SWITCH68 parent and strictly scoped research files
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 143ff1294cabd531b8eb6ad23b5a2c9f62b3dc9a HEAD
          git diff --name-only 143ff1294cabd531b8eb6ad23b5a2c9f62b3dc9a HEAD >/tmp/source70-files
          while IFS= read -r path; do
            case "$path" in
              research/verified-photo-switch-70/*|research/multi-garment-capture-01/review-ui.mjs|scripts/test-multi-garment-capture-01-browser.mjs|scripts/audit-verified-photo-switch-70-browser.mjs|tests/verified-photo-switch-70.test.mjs|.github/workflows/verified-photo-switch-70-no-deploy.yml) ;;
              *) echo "BLOCKED production/staging or unrelated source change: $path"; exit 1 ;;
            esac
          done </tmp/source70-files
      - name: Install pinned native browser and full Node regression dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Build and run all inherited and SOURCE70 ownership/epoch/staged-photo tests
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Six unmodified genuine original licensed JPEG manual/private native workflow regressions
        run: node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Six new real Chromium WebKit original JPEG invalid/undecodable preserved-review and valid swap private flows
        run: SOURCE70=1 node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Independently SHA/dimension/nonblank audit 84 true mobile browser screenshots
        run: node scripts/audit-verified-photo-switch-70-browser.mjs
      - name: Archive only sanitized original source identity, browser acceptance and 84 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SOURCE70-bad-JPEG-keeps-original-verified-human-review-HOLD
          path: |
            benchmark/multi-garment-capture-01/acceptance.json
            benchmark/verified-photo-switch-70/acceptance.json
            benchmark/verified-photo-switch-70/*.png
          if-no-files-found: warn
          retention-days: 14
