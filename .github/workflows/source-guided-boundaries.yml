name: Verified real-photo mask evidence
on:
  push:
    branches: [feature/source-guided-mask-boundaries-20261019, benchmark/verified-mask-evidence-20261019, benchmark/twelve-photo-independent-outline-packet-20261020, benchmark/native-pixel-mask-review-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-photo-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Build and run all automated tests
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Measure real-photo boundary changes and reproduce the report
        run: |
          python scripts/benchmark-source-guided-boundaries.py
          node scripts/assert-source-guided-boundaries.cjs
          node scripts/report-verified-mask-evidence.mjs
          node scripts/assert-verified-mask-evidence.mjs
          cp artifacts/verified-mask-evidence/results.json /tmp/first-mask-results.json
          cp artifacts/source-guided-boundaries/results.json /tmp/first-boundary-results.json
          python scripts/benchmark-source-guided-boundaries.py
          node scripts/report-verified-mask-evidence.mjs
          cmp /tmp/first-mask-results.json artifacts/verified-mask-evidence/results.json
          cmp /tmp/first-boundary-results.json artifacts/source-guided-boundaries/results.json
      - name: Stage human model-blind twelve-photo review materials (no approvals)
        run: |
          python scripts/stage-independent-twelve-mask-review.py
          python -m unittest discover -s tests -p 'test_independent_twelve_review_packet.py' -v
          cp artifacts/independent-mask-review/REVIEW-STATUS.json /tmp/mask-review-packet-first.json
          python scripts/stage-independent-twelve-mask-review.py
          cmp /tmp/mask-review-packet-first.json artifacts/independent-mask-review/REVIEW-STATUS.json
          node --input-type=module -e "
            import fs from 'node:fs';
            const p='artifacts/independent-mask-review/';
            const report=JSON.parse(fs.readFileSync(p+'REVIEW-STATUS.json','utf8'));
            const blind=JSON.parse(fs.readFileSync(p+'BLIND-FIRST-SOURCES.json','utf8'));
            if(report.actualLicensedOriginalHashesVerified!==12 ||
               report.independentlyReviewedFullSizeReferenceMasks!==0 ||
               report.humanReviewerOneCompleted!==0 ||
               report.humanReviewerTwoApproved!==0 ||
               report.productionAuthorized!==false ||
               report.currentEditorOutputsExactOriginalGrid!==true ||
               blind.sourceOriginals.length!==12 ||
               blind.modelPredictionsIncluded!==0 ||
               blind.manifestCategoryLabelsIncluded!==0)
              throw Error('Offline review packet is not genuinely blind or incorrectly approved');
            console.log('Verified 12 original-source human review work items, 0 independent approvals');
          "
      - name: Install local browser for native-grid independent annotation quality gate
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Verify native source-grid drawing and separate independent review in Chromium
        run: node scripts/test-native-garment-annotation-browsers.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: twelve-source-original-mask-human-review-packet
          path: artifacts/independent-mask-review/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-guided-boundary-diagnostics
          path: |
            artifacts/source-guided-boundaries/
            artifacts/verified-mask-evidence/
