name: Source-guided real-photo boundary evidence
on:
  push:
    branches: [integration/source-guided-mask-and-held-photo-ux-20261019]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-photo-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Build and run all automated tests
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Measure real-photo boundary changes and reproduce the report
        run: |
          python scripts/benchmark-source-guided-boundaries.py
          node scripts/assert-source-guided-boundaries.cjs
          cp artifacts/source-guided-boundaries/results.json /tmp/first-boundary-results.json
          python scripts/benchmark-source-guided-boundaries.py
          cmp /tmp/first-boundary-results.json artifacts/source-guided-boundaries/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-guided-boundary-diagnostics
          path: artifacts/source-guided-boundaries/
