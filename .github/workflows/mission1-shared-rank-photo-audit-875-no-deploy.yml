name: Mission 1 P875 shared-rank source-locked public photo audit — NO DEPLOY
on:
  push:
    branches: [research/mission1-shared-rank-photo-audit-875-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m1-p875-shared-ranked-HOLD
  cancel-in-progress: true
jobs:
  owner-review-and-native-NO-DEPLOY:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: P874 immutable base and EXACT five-file source isolation
        shell: bash
        run: |
          set -euo pipefail
          BASE=ad60fa300146f0ed469c1367180e75c4fc55b20c
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | tee /tmp/p875-paths
          test "$(wc -l </tmp/p875-paths)" -eq 5
          while IFS= read -r p; do
            case "$p" in
              public/dual-panel-82.mjs|scripts/test-p82-review-browser.mjs|scripts/p875-public-shared-rank-audit.mjs|research/mission1-shared-rank-photo-audit-875/REPORT.md|.github/workflows/mission1-shared-rank-photo-audit-875-no-deploy.yml) ;;
              *) echo "UNAUTHORIZED_PATH $p"; exit 1;;
            esac
          done </tmp/p875-paths
          test -z "$(git diff --name-only "$BASE" HEAD -- public/app.js public/dual-core-82.mjs public/dual-worker-82.mjs public/model-arbitration-81.mjs public/local-worker.mjs public/recognition-engine.mjs public/cloud-backup.js supabase)"
          grep -Fq 'const reviewFirst836=true;' public/app.js
          grep -Fq 'Family Alpha HOLD #255 OPEN' research/mission1-shared-rank-photo-audit-875/REPORT.md
          echo P875_SCOPE_NO_DEPLOY_PASS
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium webkit
      - name: Both builds full native suite, explicit BLOCKED release gate
        run: |
          set -euo pipefail
          node --check public/dual-panel-82.mjs
          node --check scripts/test-p82-review-browser.mjs
          node --check scripts/p875-public-shared-rank-audit.mjs
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          P79_REQUIRE_DECODER=1 node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
          node scripts/m1-release-evidence-851.mjs | tee /tmp/p875-release
          grep -Fq '"status":"BLOCKED"' /tmp/p875-release
          grep -Fq '"shouldLiftFamilyAlphaHold":false' /tmp/p875-release
      - name: Original photo, actual Adjust source, six cross-family rank evidence browser policies
        run: |
          set -euo pipefail
          node scripts/test-m1-original-photo-browser-865.mjs
          node scripts/test-p82-review-browser.mjs | tee /tmp/p875-browser
          test "$(grep -c '^P875_SHARED_CATEGORY_RANK_ONLY ' /tmp/p875-browser)" -eq 6
          test "$(grep -c '^P875_UNILATERAL_TOP_RANK_HIDDEN ' /tmp/p875-browser)" -eq 6
          test "$(grep -c '^P874_CROSS_CATEGORY_CONFLICT_MANUAL_ONLY ' /tmp/p875-browser)" -eq 6
          test "$(grep -c '^P873_TIED_TOP_LABELS_MANUAL_ONLY ' /tmp/p875-browser)" -eq 6
          test "$(grep -c '^P872_REJECTED_SUGGESTION_NO_FALSE_SUCCESS ' /tmp/p875-browser)" -eq 6
          node scripts/test-parallel80-subtype-browser.mjs
          node scripts/test-m1-owner-pair-admission-846.mjs
  genuine-public-photo-two-models-DEVELOPMENT-NOT-BLIND-NO-DEPLOY:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict five-file pinned immutable source
        shell: bash
        run: |
          set -euo pipefail
          BASE=ad60fa300146f0ed469c1367180e75c4fc55b20c
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE" HEAD | wc -l)" -eq 5
          test -z "$(git diff --name-only "$BASE" HEAD -- public/dual-worker-82.mjs public/model-arbitration-81.mjs benchmark/locked-photo-sources.json benchmark/manifest-reviewed-32.json benchmark/manifest-holdout-16.json)"
      - run: npm install --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 playwright@1.56.1 sharp@0.34.3
      - run: npx playwright install --with-deps chromium
      - name: Recover exactly eight licensed source-SHA locked public originals, pinned q8 runtime/model
        run: |
          set -euo pipefail
          IDS=commons-0035,commons-0045,commons-0062,commons-0088,commons-0001,commons-0094,commons-0078,commons-0059
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos "$IDS"
          node scripts/p82-prepare-models.mjs --check
      - name: Eight genuine-model desktop Chromium inferences and prospective-vs-old rank coverage (NOT accuracy)
        env:
          P82_IDS: commons-0035,commons-0045,commons-0062,commons-0088,commons-0001,commons-0094,commons-0078,commons-0059
        run: |
          set -euo pipefail
          node scripts/p82-real-browser.mjs chromium benchmark/p875-real-chromium | tee /tmp/p875-models
          test "$(grep -c '^P82_REAL_BROWSER_ROW chromium ' /tmp/p875-models)" -eq 8
          node scripts/p875-public-shared-rank-audit.mjs benchmark/p875-real-chromium/results.json benchmark/p875-real-chromium/shared-rank-audit.json | tee /tmp/p875-audit
          grep -Fq '"photos":8' /tmp/p875-audit
          grep -Fq '"recognitionAccuracy":null' /tmp/p875-audit
          grep -Fq '"releaseReady":false' /tmp/p875-audit
      - uses: actions/upload-artifact@v4
        with:
          name: p875-public-development-numeric-rank-coverage-only
          path: benchmark/p875-real-chromium/shared-rank-audit.json
          if-no-files-found: error
