name: SAFETY55 unreviewed SegFormer proposals never auto-save NO DEPLOY
on:
  push:
    branches:
      - research/auto-detection-confirmed-crop-55-main-20261105-HOLD
  pull_request:
    paths:
      - 'research/multi-garment-capture-01/review-ui.mjs'
      - 'research/multi-garment-capture-01/scene-class-guard-32.mjs'
      - 'tests/auto-detection-confirmed-crop-55.test.mjs'
      - 'research/auto-detection-confirmed-crop-55/**'
      - '.github/workflows/auto-detection-confirmed-crop-55-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guarded-original-photo-review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Strict exact verified MODEL52 parent and no production or staging edits
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 05107691cee5bbf7429b824aa0b1444fcb70ae5b HEAD
          git diff --name-only 05107691cee5bbf7429b824aa0b1444fcb70ae5b HEAD > /tmp/safety55-files
          while IFS= read -r path; do
            case "$path" in
              research/multi-garment-capture-01/review-ui.mjs|research/multi-garment-capture-01/scene-class-guard-32.mjs|tests/auto-detection-confirmed-crop-55.test.mjs|research/auto-detection-confirmed-crop-55/*|.github/workflows/auto-detection-confirmed-crop-55-no-deploy.yml) ;;
              *) echo "BLOCKED production/staging or unrelated change: $path"; exit 1 ;;
            esac
          done < /tmp/safety55-files
      - name: Install pinned test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Build app and run all inherited and new SAFETY55 Node tests
        run: |
          node scripts/build.mjs
          node --test tests/*.test.cjs tests/*.test.mjs
      - name: Six actual private mobile original-photo capture review save and restore flows
        run: node scripts/test-multi-garment-capture-01-browser.mjs
      - name: Archive screenshot and private flow evidence without originals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SAFETY55-real-browser-owner-private-evidence-HOLD
          path: |
            benchmark/multi-garment-capture-01/acceptance.json
            benchmark/multi-garment-capture-01/*.png
          if-no-files-found: warn
          retention-days: 14
