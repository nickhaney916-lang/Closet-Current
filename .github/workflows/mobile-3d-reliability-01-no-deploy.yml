name: PAR-08 Mobile 3D Original Photo Reliability (DRAFT HOLD NO DEPLOY)
on:
  pull_request:
    paths:
      - 'research/mobile-3d-reliability-01/**'
      - 'tests/mobile-3d-reliability-01.test.mjs'
      - 'scripts/test-mobile-3d-reliability-01-browser.mjs'
      - '.github/workflows/mobile-3d-reliability-01-no-deploy.yml'
permissions:
  contents: read
jobs:
  real-webgl-mobile-reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Strict isolated research-only paths on exact fully verified 3D76 ancestor
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 61eb0b2a7d5bfa3300aad220ce394ab0cceda711 HEAD
          git diff --name-only 61eb0b2a7d5bfa3300aad220ce394ab0cceda711 HEAD | while IFS= read -r file; do
            case "$file" in
              research/mobile-3d-reliability-01/*|tests/mobile-3d-reliability-01.test.mjs|scripts/test-mobile-3d-reliability-01-browser.mjs|.github/workflows/mobile-3d-reliability-01-no-deploy.yml) ;;
              *) echo "BLOCKED: PAR-08 touches forbidden production, main denim/contact, parallel or private path $file"; exit 1 ;;
            esac
          done
      - name: Install locked local research WebGL and photographic fixtures
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 three@0.180.0 playwright@1.56.1 three-mesh-bvh@0.9.2
      - name: Source, privacy, state, and relevant rendering unit/integration tests
        run: |
          node --check research/mobile-3d-reliability-01/mobile-showroom.mjs
          node --check research/mobile-3d-reliability-01/mobile-demo.mjs
          node --check scripts/test-mobile-3d-reliability-01-browser.mjs
          node --test tests/mobile-3d-reliability-01.test.mjs tests/three-d-67-humanoid-index-contract.test.mjs tests/three-d-69-indexed-photo-real-3d.test.mjs tests/three-d-15-outfits.test.mjs tests/three-d-76-source-denim-fold-continuity.test.mjs
      - name: Generate licensed original photos, alpha cutouts and manifests with known SHA-256
        run: |
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node scripts/build-work47-benchmark.mjs
          node --test tests/three-d-31-jeans-source.test.mjs tests/three-d-37-source-true.test.mjs
      - name: Restore exact approved original 163-bone CC0 female and male GLBs
        run: |
          git fetch --no-tags origin 53f2ad344dc56a1477e343531c423aed0e66c17d dd6bac3fa9ff640d4f562cf925337440bdb5cf8f 3a572193987cb29389727426136c6eb3ac326783 dfb40889c4c1221fb1833b859e8a11ef38aeb76e
          node research/three-d-20/restore-approved-models.mjs
      - name: Real Chromium WebGL mobile 72 source frames, memory, swaps and failure recovery
        run: node scripts/test-mobile-3d-reliability-01-browser.mjs
      - name: Verify exact genuine screenshot count, source identity, and honest device/release gates
        run: |
          node --input-type=module <<'CHECK'
          import {readFileSync,readdirSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const path='benchmark/mobile-3d-reliability-01';
          const d=JSON.parse(readFileSync(path+'/browser-results.json','utf8'));
          assert.equal(d.rigBones,163);
          assert.equal(d.realWebGLScreenshots,72);
          assert.equal(d.screenShotsBefore,36);
          assert.equal(d.screenShotsAfter,36);
          assert.equal(d.checkedGarments,24);
          assert.equal(d.swapsAtLeast,10);
          assert.equal(d.figureSwitchesAtLeast,5);
          assert.equal(d.negativeCases.length,4);
          assert.equal(d.webGLMemoryMeasurements>=25,true);
          assert.equal(d.offsiteRequests,0);
          assert.equal(d.originalPhotoAnd2DFallbackUnchanged,true);
          assert.equal(d.physicalAndroidTested,false);
          assert.equal(d.physicalIphoneTested,false);
          assert.equal(d.familyAlpha,'HOLD');
          assert.equal(d.humanGarmentPhotorealism,'REVIEW');
          assert.equal(d.productionModified,false);
          assert.equal(d.releaseAuthorized,false);
          assert.equal(readdirSync(path).filter(f=>f.endsWith('.png')).length,72);
          assert.ok(d.images.every(i=>i.genuineWebGL2&&i.drawFrames>1&&
            i.horizontalOverflow===false&&i.pixelRange>23));
          CHECK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PAR-08-MOBILE-3D-REAL-WEBGL-72-FRAMES-MEMORY-NEGATIVE-HOLD
          path: benchmark/mobile-3d-reliability-01/
          if-no-files-found: warn
