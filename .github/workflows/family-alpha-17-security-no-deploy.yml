name: Family Alpha 17 Four-Account Security (NO DEPLOY)
on:
  push:
    branches: [qa/family-alpha-17-four-account-security-20261023]
  pull_request:
    paths:
      - 'public/auth.js'
      - 'public/cloud-backup.js'
      - 'tests/family-alpha-17-security.test.cjs'
      - 'scripts/test-family-alpha-17-four-account-browser.mjs'
      - 'scripts/run-cloud-backup-flow.mjs'
      - 'docs/FAMILY-ALPHA-17-FOUR-ACCOUNT-SECURITY.md'
      - '.github/workflows/family-alpha-17-security-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build offline test candidate (no deploy)
        run: node scripts/build.mjs
      - name: Run entire application security and regression suite
        run: node --test tests/*.test.cjs tests/*.test.mjs
      - name: Enforce isolated Assignment 17 changes only
        run: |
          git fetch origin integration/family-alpha-reviewed-photo-provider-20261023 --depth=1
          git diff --name-only "origin/integration/family-alpha-reviewed-photo-provider-20261023...HEAD" | tee /tmp/alpha17-changed.txt
          if grep -Ev '^(public/auth.js$|public/cloud-backup.js$|tests/family-alpha-17-security.test.cjs$|scripts/test-family-alpha-17-four-account-browser.mjs$|scripts/run-cloud-backup-flow.mjs$|docs/FAMILY-ALPHA-17-FOUR-ACCOUNT-SECURITY.md$|\.github/workflows/family-alpha-17-security-no-deploy.yml$)' /tmp/alpha17-changed.txt; then exit 1; fi
  four-account-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install test-only pinned browser automation
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - name: Build isolated app assets
        run: node scripts/build.mjs
      - name: Four account privacy and browser revoke on Chromium and WebKit
        run: node scripts/test-family-alpha-17-four-account-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-alpha-17-four-owner-synthetic-evidence
          path: benchmark/family-alpha-17/four-owner-browser.json
          retention-days: 14
