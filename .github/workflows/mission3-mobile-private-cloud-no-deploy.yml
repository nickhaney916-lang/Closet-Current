name: Mission 3 private cloud/session and mobile integration — NO DEPLOY
on:
  push:
    branches: [research/mission3-mobile-private-cloud-integration-20261110-HOLD]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-regression-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce verified parent, Mission 3-only scope and no deployment
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=fbce0b66d7acf5b1ea0dffcb20f793abda06b793
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --exit-code "$BASE" HEAD -- public/auth.js supabase public/local-worker.mjs public/recognition-engine.mjs
          git diff --name-only "$BASE" HEAD | while read -r p; do
            case "$p" in
              public/cloud-backup.js|tests/mission3-owner-session-cloud.test.cjs|research/mission3-mobile-private-cloud/REPORT.md|.github/workflows/mission3-mobile-private-cloud-no-deploy.yml) ;;
              *) echo "Mission 3 unexpected changed path: $p"; exit 1 ;;
            esac
          done
      - name: Install pinned verification tools
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Reproduce exact-parent cross-account restore and session-lock defects
        run: |
          git worktree add --detach /tmp/closet-mission3-parent fbce0b66d7acf5b1ea0dffcb20f793abda06b793
          CLOUD_SOURCE_ROOT=/tmp/closet-mission3-parent EXPECT_BASELINE=1 node --test tests/mission3-owner-session-cloud.test.cjs
      - name: Verify repaired owner/DB/restore session leases
        run: node --test tests/mission3-owner-session-cloud.test.cjs
      - name: Build app and run complete Node regression, serial for stable WebCrypto
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Genuine mobile Chromium/WebKit source capture, manual review and owned looks
        run: node scripts/test-native-canonical-original-167-browser.mjs
      - name: Genuine mobile outfit consistency, cross-tab conflicts and accessibility
        run: |
          node scripts/test-outfit-wardrobe-consistency-browser.mjs
          node scripts/test-outfit-draft-conflicts-browser.mjs
          node scripts/test-outfit-draft-resilience-browser.mjs
          node scripts/test-outfit-save-recovery-browser.mjs
          node scripts/test-family-reliability-mobile.mjs
      - name: Bounded synthetic-owner private wardrobe and saved outfit backup compatibility
        run: |
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos commons-0002
          node scripts/test-outfit-backup-compatibility-browser.mjs benchmark/mission3-mock-cloud-backup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission3-private-cloud-mobile-HOLD
          path: |
            benchmark/native-canonical-closet-style-167/
            benchmark/outfit-wardrobe-consistency/
            benchmark/outfit-draft-conflicts/
            benchmark/outfit-draft-resilience/
            benchmark/outfit-save-recovery/
            benchmark/family-reliability-mobile/
            benchmark/mission3-mock-cloud-backup/
          retention-days: 14
