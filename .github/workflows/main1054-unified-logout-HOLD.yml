      - name: Verify database policy and function grants
        run: |
          docker exec -i supabase_db_closet-a21 psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if not (select relrowsecurity from pg_class where oid='public.closet_backups'::regclass)
               or not (select relrowsecurity from pg_class where oid='storage.objects'::regclass)
               or (select public from storage.buckets where id='closet-private')
               or has_table_privilege('anon','public.closet_backups','SELECT, INSERT, UPDATE, DELETE')
               or has_table_privilege('authenticated','public.closet_backups','DELETE, TRUNCATE, REFERENCES, TRIGGER')
               or has_function_privilege('anon','public.save_closet_backup(bigint,jsonb)','EXECUTE')
               or not has_function_privilege('authenticated','public.save_closet_backup(bigint,jsonb)','EXECUTE')
               or (select prosecdef from pg_proc where oid='public.save_closet_backup(bigint,jsonb)'::regprocedure)
            then raise exception 'Unexpected grant, RLS, private bucket, or RPC scope';
            end if;
          end $$;
          SQL
      - if: matrix.engine == 'chromium'
        name: Verify four-owner real Auth lifecycle and session removal
        run: SUPABASE_TEST_ENV="$RUNNER_TEMP/closet-a21.env" node scripts/assignment-22/auth-lifecycle.mjs
      - name: Exercise large wardrobes, fault recovery and actual PostgreSQL size boundary
        env:
          A21_ENGINE: ${{ matrix.engine }}
        run: SUPABASE_TEST_ENV="$RUNNER_TEMP/closet-a21.env" node scripts/assignment-21/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assignment-21-${{ matrix.engine }}-receipt
          path: benchmark/assignment-21/${{ matrix.engine }}.json
          if-no-files-found: ignore
      - name: Destroy local backend and remove credentials
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/closet-a21/supabase/config.toml"; then
            (cd "$RUNNER_TEMP/closet-a21" && supabase stop --no-backup >/dev/null 2>&1)
          fi
          rm -f "$RUNNER_TEMP/closet-a21.env" "$RUNNER_TEMP/closet-a21-start.log" "$RUNNER_TEMP/closet-a21-stop.log"
  acceptance:
    if: always()
    needs: [native, local-backend, large-backup]
    runs-on: ubuntu-24.04
    env:
      RESULT: ${{ needs.native.result }}
      BACKEND: ${{ needs.local-backend.result }}
      SCALE: ${{ needs.large-backup.result }}
    steps:
      - run: test "$RESULT" = success && test "$BACKEND" = success && test "$SCALE" = success
