          import {readFileSync} from "node:fs";
          const r=JSON.parse(readFileSync("benchmark/auth-review-session-36/signed.json","utf8"));
          assert.equal(r.activeSessionPolicyRequired,true);
          assert.equal(r.logoutAccessTokenRemainsUsable,false);
          assert.equal(r.sessionRevocationReceipts.length,4);
          assert.ok(r.sessionRevocationReceipts.every(x=>x.unexpiredThroughout===true&&x.activeStorageControlsPassed===true&&Number.isFinite(x.confirmedLogoutToFirstDeniedResponseMs)&&Number.isFinite(x.confirmedLogoutToLastDeniedResponseMs)&&x.confirmedLogoutToFirstDeniedResponseMs>=0&&x.confirmedLogoutToLastDeniedResponseMs>=x.confirmedLogoutToFirstDeniedResponseMs));
          NODE
      - name: Verify ordinary app backup, clean-context restore and account switching in both browsers
        if: success()
        run: |
          test -f "$RUNNER_TEMP/closet-a20.env"
          SUPABASE_TEST_ENV="$RUNNER_TEMP/closet-a20.env" node scripts/test-assignment-20-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assignment-20-sanitized-http-receipt
          path: benchmark/auth-review-session-36/signed.json
          if-no-files-found: ignore
      - name: Destroy local backend and remove credentials
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/closet-a20/supabase/config.toml"; then
            (cd "$RUNNER_TEMP/closet-a20" && supabase stop --no-backup >/dev/null 2>&1)
          fi
          rm -f "$RUNNER_TEMP/closet-a20.env" "$RUNNER_TEMP/closet-a20-start.log"
