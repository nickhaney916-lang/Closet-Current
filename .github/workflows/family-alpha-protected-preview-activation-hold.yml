name: Family Alpha protected staging preview activation HOLD - NO DEPLOY
on:
  pull_request:
    paths:
      - 'scripts/build-family-alpha-protected-preview-hold.mjs'
      - 'tests/family-alpha-protected-preview-hold.test.mjs'
      - 'scripts/audit-family-alpha-stage-assets-hold.mjs'
      - 'tests/family-alpha-stage-assets-hold.test.mjs'
      - 'tests/family-alpha-stage-two-account-cloud-mock.test.mjs'
      - 'scripts/family-alpha-live-jwt-readonly-gate.mjs'
      - 'tests/family-alpha-live-jwt-readonly-gate.test.mjs'
      - 'scripts/audit-family-alpha-staging-activation-checklist-hold.mjs'
      - 'scripts/test-family-alpha-final-protected-hold-browser.mjs'
      - 'tests/family-alpha-staging-activation-checklist-hold.test.mjs'
      - 'tests/family-alpha-post-site-url-owner-login-hold.test.mjs'
      - 'scripts/build-family-alpha-owner-login-rehearsal-hold.mjs'
      - 'tests/family-alpha-owner-login-rehearsal-hold.test.mjs'
      - 'docs/FAMILY-ALPHA-STAGING-SITEURL-OWNER-LOGIN-PLAN-20261025.md'
      - 'docs/FAMILY-ALPHA-STAGING-ACTIVATION-CHECKLIST-HOLD-20261025.md'
      - 'docs/FAMILY-ALPHA-PROTECTED-PREVIEW-ACTIVATION-HOLD-20261025.md'
      - '.github/workflows/family-alpha-protected-preview-activation-hold.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  STAGE_PIN: '879f1b92fb15f9bc9a7f0429c7ee178f7bbf1373'
  RECOGNITION_PIN: '795ad6637f8d4f782bc99751211b25e8e72a3a7d'
  RECOVERY_PIN: '08ed6ac4a3fc921eae5d5d3df3bd3966429559d2'
  REVIEW_PIN: '1ecac1079e75f1f25dc70a4c712b2448eb87dca8'
jobs:
  offline-preview-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch known source-pinned staging, recognition, recovery and mobile review commits
        run: git fetch --no-tags origin "$STAGE_PIN" "$RECOGNITION_PIN" "$RECOVERY_PIN" "$REVIEW_PIN"
      - name: Build unchanged ordinary app and default-blocked staged Auth artifact
        run: node scripts/build-family-alpha-staging-auth-hold.mjs
      - name: Build existing disabled full-recognition/2D artifact
        run: node scripts/build-family-alpha-recognition-integrated-hold.mjs
      - name: Build separate, still disabled protected staging photo-avatar artifact
        run: node scripts/build-family-alpha-protected-preview-hold.mjs
      - name: Verify every packaged full-app HTML CSS manifest and literal module asset exists (NO DEPLOY)
        run: node scripts/audit-family-alpha-stage-assets-hold.mjs
      - name: Test missing-assets, external URLs and traversal fail closed
        run: node --test tests/family-alpha-stage-assets-hold.test.mjs
      - name: Prove staging cloud mock owner A/B client checks, foreign photo refusal and session race HOLD
        run: node --test tests/family-alpha-stage-two-account-cloud-mock.test.mjs
      - name: Test future JWT A/B read-only staging probe (MOCK ONLY; no network)
        run: node --test tests/family-alpha-live-jwt-readonly-gate.test.mjs
      - name: Audit staged Site URL mismatch, producer workflow target and complete-app activation HOLD
        run: node scripts/audit-family-alpha-staging-activation-checklist-hold.mjs
      - name: Fail closed for unapproved staging redirects, client activation and false GO states
        run: node --test tests/family-alpha-staging-activation-checklist-hold.test.mjs
      - name: Verify owner-confirmed Site URL, mock owner-only Auth host, still-disabled live release
        run: node --test tests/family-alpha-post-site-url-owner-login-hold.test.mjs
      - name: Build synthetic owner-login rehearsal in a distinct never-deploy folder
        run: node scripts/build-family-alpha-owner-login-rehearsal-hold.mjs
      - name: Test review artifact protects staging login, owner routing and avatar hold
        run: node --test tests/family-alpha-owner-login-rehearsal-hold.test.mjs
      - name: Check exact staging host, independent flags and no bypass paths
        run: node --test tests/family-alpha-protected-preview-hold.test.mjs
      - name: Check existing staging placeholder/full-app evidence remains gated
        run: node scripts/audit-family-alpha-staging-root-handoff.mjs
      - name: Run all offline Node regressions
        run: node --test tests/*.test.cjs tests/*.test.mjs
      - name: Insist the staged visual boot is NOT activated
        run: |
          node --input-type=module -e "import {assertProtectedPreviewHold} from './scripts/build-family-alpha-protected-preview-hold.mjs';const x=await assertProtectedPreviewHold();if(x.releaseGate!=='HOLD'||x.deployAllowed||x.ownerApproved||x.photoAvatarEnabled||x.stagingAuthReady||x.stagingAuthKeyPresent||x.stagingCallbackRegistered||x.signedInJwtRlsProof)process.exit(1);console.log('Protected stage photo-avatar offline activation remains HOLD, no deploy.');"

  held-bundle-browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Trust GitHub Actions checked-out workspace in pinned browser container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Fetch reviewed source commits (no stage or production changes)
        run: git fetch --no-tags origin "$STAGE_PIN" "$RECOGNITION_PIN" "$RECOVERY_PIN" "$REVIEW_PIN"
      - name: Install pinned Playwright for offline local asset browser checks
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - name: Assemble fully held staging Auth and recognition photo candidate
        run: |
          node scripts/build-family-alpha-staging-auth-hold.mjs
          node scripts/build-family-alpha-recognition-integrated-hold.mjs
          node scripts/build-family-alpha-protected-preview-hold.mjs
      - name: Chromium and WebKit final held-bundle startup, fail-closed security (NO PROVIDER CALLS)
        run: node scripts/test-family-alpha-final-protected-hold-browser.mjs
      - name: Retain NO DEPLOY and NO ACCOUNT permissions
        run: |
          node --input-type=module -e "import {assertProtectedPreviewHold} from './scripts/build-family-alpha-protected-preview-hold.mjs'; const x=await assertProtectedPreviewHold(); if(x.releaseGate!=='HOLD'||x.deployAllowed!==false||x.ownerApproved!==false||x.stagingAuthReady!==false||x.photoAvatarEnabled!==false) process.exit(1); console.log('Final browser staging source remains HOLD. No uploads performed.');"
