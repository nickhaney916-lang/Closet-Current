name: Parallel 90 interactive native viewer NO DEPLOY
on:
  push:
    branches: [research/parallel90-interactive-viewer-HOLD, research/parallel90-m15-drag-revoke-HOLD, research/parallel90-m16-chromium-touch-swipe-HOLD, research/parallel90-m17-source-honest-360-HOLD , research/parallel90-m18-original-photo-shortcut-HOLD]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  native-viewer:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable M34 parent and protected code
        run: |
          git merge-base --is-ancestor 050a39b8fa1e6ee8084bed23855d90e2879609d7 HEAD
          git diff --exit-code 050a39b8fa1e6ee8084bed23855d90e2879609d7 HEAD -- public/ supabase/ benchmark/
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/build.mjs
      - if: matrix.engine == 'chromium'
        run: node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - name: Prepare pinned original photographic renderer
        run: |
          git worktree add --detach .native05-donor-541 df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          ln -s ../node_modules .native05-donor-541/node_modules
          cd .native05-donor-541
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
      - run: node scripts/install-parallel90-viewer.mjs
      - name: Actual native owner-photo viewer and repeated saved-outfit switches
        env:
          P90_ENGINE: ${{ matrix.engine }}
          P90SWAPS: '1'
          P90: '1'
          NATIVE102: '1'
        run: |
          if [ "$P90_ENGINE" = chromium ]; then
            export NATIVE88=1 NATIVE89=1 NATIVE91=1 NATIVE92=1 NATIVE93=1
          fi
          node scripts/test-native-3d-05-browser.mjs
      - name: Same-host baseline candidate restored startup and final-source-frame comparison
        env:
          P90_ENGINE: ${{ matrix.engine }}
        run: node scripts/benchmark-parallel90-startup.mjs
      - name: Same-source BVH-only control vs optimized contact measurement
        env:
          P90_ENGINE: ${{ matrix.engine }}
        run: node scripts/benchmark-parallel90-bvh-ab.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parallel90-real-browser-evidence-${{ matrix.engine }}-HOLD
          path: |
            benchmark/parallel90/
            benchmark/parallel90-profile/
            benchmark/native-3d-05/
            benchmark/native-3d-05-webkit/
            benchmark/native-3d-102/
            benchmark/native-3d-102-webkit/
