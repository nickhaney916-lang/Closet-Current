name: MAIN226 V4 retired-original outfit boundary with genuine owner WebKit and Chromium NO DEPLOY HOLD
on:
  push:
    branches: [research/main226-m225-v4-retired-original-outfit-lifecycle-HOLD]
  pull_request:
    branches: [research/main225-m224-full-original-seven-job-acceptance-HOLD]
permissions:
  contents: read
jobs:
  source-and-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restrict diff and require byte-identical proven donor fix and existing owner model
        shell: bash
        run: |
          set -euo pipefail
          BASE=9b243ee584d6f16f553e2365e373e6e8be85cc36
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | while IFS= read -r file; do
            case "$file" in
              research/restore-atomic-01/atomic-restore.mjs|tests/main226-v4-retired-original-outfit-lifecycle.test.mjs|.github/workflows/main226-m225-v4-retired-outfit-genuine-webkit-no-deploy.yml) ;;
              *) echo "M226 unauthorized source change $file"; exit 1 ;;
            esac
          done
          test "$(git rev-parse "$BASE":research/multi-garment-capture-01/review-ui.mjs)" = 1bd97b80b51fab1cb269ae565acb73a274b6e6d0
          test "$(git rev-parse HEAD:research/multi-garment-capture-01/review-ui.mjs)" = 1bd97b80b51fab1cb269ae565acb73a274b6e6d0
          test "$(git rev-parse HEAD:scripts/test-main220-p94-honest-zero-native-owner-recovery.mjs)" = e5f334e660692a94eb8b04bee8094d8218f207b6
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:public/native-default-atomic-import-m3.mjs)" = 1a4cf649a3656f604c4f3e1d2b1efd7910179edc
          test "$(git rev-parse HEAD:public/native-default-verified-backup-export-m3.mjs)" = af15a9c08a81aa4064d1e5d1c4f0af0d855582c9
          test "$(git rev-parse HEAD:tests/main220-retired-outfit-backup-lifecycle.test.mjs)" = 2ec604dbfe5b92ba205d78ca7b572c70af0043d6
          node --check tests/main220-retired-outfit-backup-lifecycle.test.mjs
          test "$(git rev-parse HEAD:scripts/test-parallel94-native-p88-browser.mjs)" = 4f75a40cf153fa4b4d139d782b202dbe7bc55e41
          test "$(git rev-parse HEAD:scripts/test-main214-p94-worker-outcome.mjs)" = 8cc2977f1932b3012c44bdd401081cc542b94c57
          test "$(git rev-parse HEAD:public/native-reviewed-private-save-167.mjs)" = fa01c862444c05f8e307f4e7447a75a9ede1ab5e
          test "$(git rev-parse HEAD:public/native-default-atomic-import-m3.mjs)" = 1a4cf649a3656f604c4f3e1d2b1efd7910179edc
          node --check research/multi-garment-capture-01/review-ui.mjs
          node --check scripts/test-main220-p94-honest-zero-native-owner-recovery.mjs
          node --check scripts/test-main223-genuine-p94-crop-prepare-rejection-browser.mjs
          test "$(git rev-parse HEAD:tests/bounded-detection-review-58.test.mjs)" = 2f90d83b2b162a11e68d08e4d0ad3c38d470671a
          test "$(git rev-parse "$BASE":research/restore-atomic-01/atomic-restore.mjs)" = 50bb781239d68d09e353a773240b2dc9630a8b67
          test "$(git rev-parse HEAD:research/restore-atomic-01/atomic-restore.mjs)" = 6bcc29508b2818dc3e60f4ca93cdcbf7d15f0a14
          test "$(git rev-parse HEAD:tests/main226-v4-retired-original-outfit-lifecycle.test.mjs)" = 9166cfa7e6923cc773e6b38291a97d3d5cb227f3
          test "$(git rev-parse HEAD:public/native-lossless-v4-owner-acceptance-m3.mjs)" = e20f2b4926671e6ede769c4598894881d4318de8
          node --check tests/main226-v4-retired-original-outfit-lifecycle.test.mjs
      - name: Install pinned runtime
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Full owner privacy and source suite plus retired v3 backup tests and offline app build
        run: |
          node scripts/build.mjs
          node --test tests/main226-v4-retired-original-outfit-lifecycle.test.mjs
          node --test tests/main220-retired-outfit-backup-lifecycle.test.mjs
          node --test tests/mission3-default-atomic-backup-source-guard.test.mjs
          node --test tests/main217-photo119-postcommit-session-revoke.test.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  native-browser:
    name: Actual original P94 model and no-card owner manual fallback (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: ${{ matrix.engine }}
      M221_ENGINE: ${{ matrix.engine }}
      P99_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict immutable source guard
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=9b243ee584d6f16f553e2365e373e6e8be85cc36
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | while IFS= read -r file; do
            case "$file" in
              research/restore-atomic-01/atomic-restore.mjs|tests/main226-v4-retired-original-outfit-lifecycle.test.mjs|.github/workflows/main226-m225-v4-retired-outfit-genuine-webkit-no-deploy.yml) ;;
              *) echo "M226 unauthorized source change $file"; exit 1 ;;
            esac
          done
          test "$(git rev-parse HEAD:research/multi-garment-capture-01/review-ui.mjs)" = 1bd97b80b51fab1cb269ae565acb73a274b6e6d0
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:public/native-default-atomic-import-m3.mjs)" = 1a4cf649a3656f604c4f3e1d2b1efd7910179edc
          test "$(git rev-parse HEAD:public/native-default-verified-backup-export-m3.mjs)" = af15a9c08a81aa4064d1e5d1c4f0af0d855582c9
          test "$(git rev-parse HEAD:tests/main220-retired-outfit-backup-lifecycle.test.mjs)" = 2ec604dbfe5b92ba205d78ca7b572c70af0043d6
          node --check tests/main220-retired-outfit-backup-lifecycle.test.mjs
          test "$(git rev-parse HEAD:tests/bounded-detection-review-58.test.mjs)" = 2f90d83b2b162a11e68d08e4d0ad3c38d470671a
          node --check scripts/test-main223-genuine-p94-crop-prepare-rejection-browser.mjs
          test "$(git rev-parse "$BASE":research/restore-atomic-01/atomic-restore.mjs)" = 50bb781239d68d09e353a773240b2dc9630a8b67
          test "$(git rev-parse HEAD:research/restore-atomic-01/atomic-restore.mjs)" = 6bcc29508b2818dc3e60f4ca93cdcbf7d15f0a14
          test "$(git rev-parse HEAD:tests/main226-v4-retired-original-outfit-lifecycle.test.mjs)" = 9166cfa7e6923cc773e6b38291a97d3d5cb227f3
          test "$(git rev-parse HEAD:public/native-lossless-v4-owner-acceptance-m3.mjs)" = e20f2b4926671e6ede769c4598894881d4318de8
          node --check tests/main226-v4-retired-original-outfit-lifecycle.test.mjs
      - name: Install pinned real engines and model dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Build real local app
        run: node scripts/build.mjs
      - name: Real signed-owner native v3 original restore unchanged M221
        run: node scripts/test-main221-native-atomic-restore-terminal-lease-browser.mjs
      - name: Actual unflagged photo review closet 2D and private backup
        run: P99_WIDTH=390 node scripts/test-parallel99-normal-app-browser.mjs
      - name: Actual real pinned SegFormer WebKit or Chromium model with positive review and 2D/v4
        shell: bash
        run: |
          set -euo pipefail
          for width in 390 430; do
            M214_ATTEMPT="main222-$width" P94_WIDTH="$width" node scripts/test-main214-p94-worker-outcome.mjs
          done
      - name: Genuine P94 detection with one deliberately failed crop, keep other source-reviewed proposal
        shell: bash
        run: |
          set -euo pipefail
          for width in 390 430; do
            P94_WIDTH="$width" node scripts/test-main223-genuine-p94-crop-prepare-rejection-browser.mjs
          done
      - name: Zero output, dishonest count, error - explicit manual owner original recovery
        shell: bash
        run: |
          set -euo pipefail
          for width in 320 390 430; do
            M220_CASE=done-zero P94_WIDTH="$width" node scripts/test-main220-p94-honest-zero-native-owner-recovery.mjs
          done
          for mode in done-claimed-two worker-error; do
            M220_CASE="$mode" P94_WIDTH=430 node scripts/test-main220-p94-honest-zero-native-owner-recovery.mjs
          done
