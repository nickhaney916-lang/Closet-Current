name: Mission 1 P878 private-blind SigLIP paired-score handoff — NO DEPLOY
on:
  push:
    branches: [research/mission1-private-siglip-framing-878-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mission1-p878-private-siglip-HOLD
  cancel-in-progress: true
jobs:
  native-and-owner-safeguards-NO-DEPLOY:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: P877 immutable parent and exact six-file no-deploy research scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=c3558227017c0e3aa337afbb29cf4827dec0ff68
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | tee /tmp/p878-paths
          test "$(wc -l </tmp/p878-paths)" -eq 6
          while IFS= read -r p; do
            case "$p" in
              scripts/p878-private-siglip-framing.mjs|scripts/p878-sign-private-pairs.mjs|tests/mission1-private-siglip-framing-878.test.mjs|research/mission1-private-siglip-framing-878/OPERATOR.md|research/mission1-private-siglip-framing-878/REPORT.md|.github/workflows/mission1-private-siglip-framing-878-no-deploy.yml) ;;
              *) echo "P878_UNAUTHORIZED_PATH $p"; exit 1;;
            esac
          done </tmp/p878-paths
          test -z "$(git diff --name-only "$BASE" HEAD -- public/app.js public/dual-core-82.mjs public/dual-worker-82.mjs public/dual-panel-82.mjs public/recognition-engine.mjs public/recognition-confusion-guard.mjs public/model-arbitration-81.mjs public/local-worker.mjs scripts/p75-dataset-core.mjs scripts/p79-workstation-core.mjs scripts/p80-private-blind-evaluator.mjs supabase)"
          grep -Fq 'const reviewFirst836=true;' public/app.js
          grep -Fq 'Family Alpha HOLD #255 OPEN' research/mission1-private-siglip-framing-878/REPORT.md
          echo P878_SCOPE_NO_DEPLOY_PASS
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium webkit
      - name: Native source syntax, default builds, complete native suite and blocked family release
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/p878-private-siglip-framing.mjs
          node --check scripts/p878-sign-private-pairs.mjs
          node --check tests/mission1-private-siglip-framing-878.test.mjs
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          P79_REQUIRE_DECODER=1 node --test --test-concurrency=1 tests/*.cjs tests/*.mjs | tee /tmp/p878-native
          grep -Eq '^# fail 0$' /tmp/p878-native
          node scripts/m1-release-evidence-851.mjs | tee /tmp/p878-release
          grep -Fq '"status":"BLOCKED"' /tmp/p878-release
          grep -Fq '"shouldLiftFamilyAlphaHold":false' /tmp/p878-release
      - name: Original photo ownership, normal explicit save, Chromium/WebKit and footwear policies
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-m1-original-photo-browser-865.mjs
          node scripts/test-p82-review-browser.mjs | tee /tmp/p878-browser
          test "$(grep -c '^P876_EMPIRICAL_CONFUSION_GUARD_DUAL ' /tmp/p878-browser)" -eq 6
          test "$(grep -c '^P875_SHARED_CATEGORY_RANK_ONLY ' /tmp/p878-browser)" -eq 6
          test "$(grep -c '^P82_DESKTOP_POLICY_PASS ' /tmp/p878-browser)" -eq 6
          node scripts/test-parallel80-subtype-browser.mjs
          node scripts/test-m1-owner-pair-admission-846.mjs
  negative-private-evidence-and-custody-NO-DEPLOY:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact P877 ancestry, secret/data exclusion and private CI deny
        shell: bash
        run: |
          set -euo pipefail
          BASE=c3558227017c0e3aa337afbb29cf4827dec0ff68
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE" HEAD | wc -l)" -eq 6
          test -z "$(git diff --name-only "$BASE" HEAD -- benchmark public models supabase)"
          if git diff --name-only "$BASE" HEAD | grep -Ei '(\.pem$|private-keys|human-labels|blind-results\.json|blind-originals)' ; then echo P878_PRIVATE_ARTIFACT_SCOPE_DENIED; exit 1; fi
          node --check scripts/p878-private-siglip-framing.mjs
          node --check scripts/p878-sign-private-pairs.mjs
          CI=1 node scripts/p878-private-siglip-framing.mjs | tee /tmp/p878-block
          grep -Fq '"status":"BLOCKED"' /tmp/p878-block
          grep -Fq '"scoredSources":0' /tmp/p878-block
          grep -Fq '"shouldLiftFamilyAlphaHold":false' /tmp/p878-block
          if CI=1 node scripts/p878-sign-private-pairs.mjs >/tmp/p878-sign-output 2>&1; then echo P878_SIGNER_UNEXPECTED_CI_ACCESS; exit 1; fi
          grep -Fq 'P878_NO_PRIVATE_SCORER_OR_KEYS_IN_CI' /tmp/p878-sign-output
          node --input-type=module -e "import {policy878} from './scripts/p878-private-siglip-framing.mjs'; import {sha256,canonical} from './scripts/p75-dataset-core.mjs'; const p=policy878('c3558227017c0e3aa337afbb29cf4827dec0ff68');if(p.pairedFamilyIndependent!==false)process.exit(2);console.log('P878_FROZEN_POLICY_SHA',sha256(canonical(p)));"
          echo P878_PRIVATE_CI_BLOCKED_AS_DESIGNED
