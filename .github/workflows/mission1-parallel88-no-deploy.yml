            ["commons-0094","auckland-museum","Boots","ff3d49e30be2d1141179b7ad2d08d9edff2384926cd5a6f5a8f6818c97fa57ae","File:Boots, pair woman's (AM 1992.157-4).jpg"],
            ["commons-0095","auckland-museum","Boots","4905ac445855b950a116ac4074e87f6c3c5b7159d1e923089e17a2bdd26d8f3d","File:Boots, pair woman's (AM 1992.157-15).jpg"],
            ["validation-0019","spera-retailer","Sneakers","16c806adf3d3e39d0cfa260901da9de6c87f2eab7eafa6e0e56593d7782a5140","File:DKNY Marie Sneaker 23142034 schwarz - orange (1) (15798649564).jpg"],
            ["validation-0021","spera-retailer","Sneakers","a80a0c707c7aa99e4ee4df7a766109121f8b6baafe51ba9dd764e382f9094f61","File:DKNY Marie Sneaker 23142034 rot-orange - weiß (1) (16235746307).jpg"],
            ["validation-0023","spera-retailer","Sneakers","4fa7836d0275c1d393b6e71db0044674d04e4fc2c09e6c8946ca8ad8eed5276b","File:DKNY Brave Logo Varsity High-Top Sneaker 23340363 schwarz - tigerlook (1) (16415389490).jpg"],
            ["validation-0024","spera-retailer","Sneakers","2183cbbb8af17dee3bab0ea0b9657b61ccbb6be953ae047f7119be0f0e7067a0","File:DKNY Barbara Hardware Sneaker 23340609 silber (1) (16417111589).jpg"]
          ];
          const validate=(entries,manifest,sources)=>{
           if(entries.length!==20||new Set(entries.map(x=>x[0])).size!==20)throw Error('ledger coverage');
           const positive=manifest.filter(x=>x.expectedCategory==='Shoes');
           if(positive.length!==20||new Set(positive.map(x=>x.id)).size!==20)throw Error('manifest coverage');
           for(const [id,group,kind,sha,title] of entries){
           const s=sources.find(x=>x.id===id),m=positive.find(x=>x.id===id);
           if(!s?.verified||!s.attribution?.license||s.sha256!==sha||s.attribution.title!==title||!m||!group||!['Sneakers','Boots','EXCLUDE'].includes(kind)||m.expectedType!==(kind==='EXCLUDE'?'Boots':kind))throw Error('source ledger drift: '+id);
           }
           const retained=entries.filter(x=>x[2]!=='EXCLUDE');
           const classes=['Sneakers','Boots'];
           const counts=Object.fromEntries(classes.map(k=>[k,retained.filter(x=>x[2]===k).length]));
           const sourceGroups=Object.fromEntries(classes.map(k=>[k,[...new Set(retained.filter(x=>x[2]===k).map(x=>x[1]))].sort()]));
           const holdouts=[...new Set(retained.map(x=>x[1]))].sort().map(group=>({group,remainingClasses:classes.filter(k=>retained.some(x=>x[1]!==group&&x[2]===k))}));
           return {counts,sourceGroups,holdouts,excluded:entries.filter(x=>x[2]==='EXCLUDE').map(x=>x[0]),sourceDisjointFeasible:holdouts.every(x=>x.remainingClasses.length===2),independentBlind:false,productionPromotion:false};
          };
          const result=validate(ledger,manifest,sources);
          assert.deepEqual(result.counts,{Sneakers:13,Boots:4});
          assert.deepEqual(result.sourceGroups.Boots,['auckland-museum']);
          assert.equal(result.sourceDisjointFeasible,false);
          assert.deepEqual(result.holdouts.find(x=>x.group==='auckland-museum').remainingClasses,['Sneakers']);
          assert.equal(result.excluded.length,3);
          assert.throws(()=>validate(ledger.slice(1),manifest,sources));
          assert.throws(()=>validate([...ledger.slice(0,-1),ledger[0]],manifest,sources));
          assert.throws(()=>validate(ledger.map((x,i)=>i===0?[...x.slice(0,3),'0'.repeat(64),x[4]]:x),manifest,sources));
          assert.throws(()=>validate(ledger.map((x,i)=>i===0?[...x.slice(0,4),'different title']:x),manifest,sources));
          await mkdir('benchmark/output-footwear-source-audit',{recursive:true});
          await writeFile('benchmark/output-footwear-source-audit/audit.json',JSON.stringify({schema:'p88-footwear-source-audit-v1',status:'BLOCKED_BOOT_SOURCE_DIVERSITY',result,ledger},null,2));
          console.log('P88_FOOTWEAR_SOURCE_AUDIT '+JSON.stringify({status:'BLOCKED_BOOT_SOURCE_DIVERSITY',...result}));
          JS
      - name: Upload source eligibility ledger only
        uses: actions/upload-artifact@v4
        with:
          name: p88-footwear-source-audit
          path: benchmark/output-footwear-source-audit/audit.json
          retention-days: 14
