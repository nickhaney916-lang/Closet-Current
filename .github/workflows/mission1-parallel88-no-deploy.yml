name: "Mission 1 Parallel 88 multigarment source-preserving review — NO DEPLOY"
'on':
  push:
    branches:
      - research/mission1-parallel88-instance-conservation-HOLD
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: m1-parallel88-${{ github.sha }}
  cancel-in-progress: true
jobs:
  source-and-targeted-tests-NO-DEPLOY:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable green Mission 1 donor; deny any unrelated consumer/cloud edits
        shell: bash
        run: |
          set -euo pipefail
          BASE=ab68cbbbd54376bbc9c099fc3504d1cc00ba632c
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | tee /tmp/m1-88-paths
          test "$(wc -l < /tmp/m1-88-paths)" -eq 11
          while IFS= read -r p; do
            case "$p" in
              public/outfit-instance-review-840.mjs|public/outfit-capture.js|public/app.js|tests/mission1-parallel88-instance-conservation.test.mjs|tests/mission1-parallel88-owner-mask-lease.test.mjs|research/mission1-parallel88/REPORT.md|research/mission1-parallel88/frozen-public-validation-68.json|research/mission1-parallel88/recover-public-validation-88.py|research/mission1-parallel88/run-public-validation-88.mjs|research/mission1-parallel88/score-public-validation-88.py|.github/workflows/mission1-parallel88-no-deploy.yml) ;;
              *) echo "P88_UNAUTHORIZED_PATH $p"; exit 1 ;;
            esac
          done < /tmp/m1-88-paths
          test -z "$(git diff --name-only "$BASE" HEAD -- public/auth.js public/outfit-worker.mjs public/dual-worker-82.mjs public/dual-core-82.mjs public/local-worker.mjs public/recognition-engine.mjs benchmark supabase)"
          grep -Fq 'const reviewFirst836=true;' public/app.js
          grep -Fq 'FAMILY ALPHA HOLD #255 OPEN' research/mission1-parallel88/REPORT.md
          node --check public/outfit-instance-review-840.mjs
          node --check public/outfit-capture.js
          node --check public/app.js
          node --check tests/mission1-parallel88-instance-conservation.test.mjs
          node --check tests/mission1-parallel88-owner-mask-lease.test.mjs
          node --check research/mission1-parallel88/run-public-validation-88.mjs
          python -m py_compile research/mission1-parallel88/recover-public-validation-88.py research/mission1-parallel88/score-public-validation-88.py
          python research/mission1-parallel88/recover-public-validation-88.py --verify-manifest-only
      - name: Synthetic source-conservation and inherited instance/pair regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/mission1-parallel88-instance-conservation.test.mjs tests/mission1-parallel88-owner-mask-lease.test.mjs tests/outfit-instance-review-840.test.mjs tests/outfit-segmentation.test.mjs tests/outfit-unit-reconciliation-70.test.mjs | tee /tmp/m1-88-targeted
          grep -Eq '^# fail 0$' /tmp/m1-88-targeted
      - name: Auth/photo policies and physical validation remain blocked
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/mission1-release-evidence-851.test.mjs | tee /tmp/m1-88-policy
          grep -Eq '^# fail 0$' /tmp/m1-88-policy
          node scripts/m1-release-evidence-851.mjs | tee /tmp/m1-88-gate
          grep -Fq '"status":"BLOCKED"' /tmp/m1-88-gate
          grep -Fq '"shouldLiftFamilyAlphaHold":false' /tmp/m1-88-gate
  full-native-and-desktop-policy-NO-DEPLOY:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium webkit
      - name: Full inherited Node and original-JPEG no-account builds
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          P79_REQUIRE_DECODER=1 node --test --test-concurrency=1 tests/*.cjs tests/*.mjs | tee /tmp/m1-88-full
          grep -Eq '^# fail 0$' /tmp/m1-88-full
      - name: Desktop Chromium WebKit native original photo and owner review
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-m1-original-photo-browser-865.mjs
          node scripts/test-p82-review-browser.mjs
          node scripts/test-m1-owner-pair-admission-846.mjs

  # Expensive, genuine licensed-source model benchmark. The deliberate commit
  # prefix triggers a single validation research run; later docs-only pushes
  # do not repeatedly download public photos/model assets. NO deployment.
  real-public-human-validation-NO-DEPLOY:
    if: "${{ startsWith(github.event.head_commit.message, 'research(m1 #88): run real') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover frozen P68 public-original JPEGs without sharing images
        shell: bash
        run: |
          set -euo pipefail
          python research/mission1-parallel88/recover-public-validation-88.py --verify-manifest-only
          python research/mission1-parallel88/recover-public-validation-88.py
      - name: Install pinned SegFormer native inference and human COCO IoU dependencies
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 sharp@0.34.3
          python -m pip install --disable-pip-version-check numpy==2.2.6 pycocotools==2.0.10
      - name: Actual fp32 SegFormer on original validation JPEGs — no owner save
        shell: bash
        run: |
          set -euo pipefail
          node --expose-gc research/mission1-parallel88/run-public-validation-88.mjs
          python research/mission1-parallel88/score-public-validation-88.py
          grep -Fq '"shoeOnly68": {' benchmark/p88-real-validation-masks/real-validation-measured-88.json
          grep -Fq '"deltaP88VsShoeOnlyRecall"' benchmark/p88-real-validation-masks/real-validation-measured-88.json
          test -s benchmark/p88-real-validation-masks/real-validation-measured-88.json
          grep -Fq '"newSealedAcceptance": false' benchmark/p88-real-validation-masks/real-validation-measured-88.json
      - name: Evidence only, no original photos or masks uploaded
        uses: actions/upload-artifact@v4
        with:
          name: p88-exposed-validation-human-instance-metrics
          path: |
            benchmark/p88-real-validation-masks/real-validation-measured-88.json
            benchmark/p88-real-validation-masks/real-validation-predictions-88.json
          if-no-files-found: error
          retention-days: 14
