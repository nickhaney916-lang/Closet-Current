name: "Mission 1 Parallel 88 multigarment source-preserving review — NO DEPLOY"
'on':
  push:
    branches:
      - research/mission1-parallel88-instance-conservation-HOLD
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: m1-parallel88-${{ github.sha }}
  cancel-in-progress: true
jobs:
  source-and-targeted-tests-NO-DEPLOY:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable green Mission 1 donor; deny any unrelated consumer/cloud edits
        shell: bash
        run: |
          set -euo pipefail
          BASE=ab68cbbbd54376bbc9c099fc3504d1cc00ba632c
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | tee /tmp/m1-88-paths
          test "$(wc -l < /tmp/m1-88-paths)" -eq 18
          while IFS= read -r p; do
            case "$p" in
              public/outfit-instance-review-840.mjs|public/outfit-capture.js|public/app.js|tests/mission1-parallel88-instance-conservation.test.mjs|tests/mission1-parallel88-owner-mask-lease.test.mjs|scripts/test-m1-owner-pair-admission-846.mjs|scripts/test-p82-review-browser.mjs|research/mission1-parallel88/REPORT.md|research/mission1-parallel88/frozen-public-validation-68.json|research/mission1-parallel88/recover-public-validation-88.py|research/mission1-parallel88/run-public-validation-88.mjs|research/mission1-parallel88/exposed-threshold-probes-88.mjs|research/mission1-parallel88/run-coco-accessory-88.mjs|research/mission1-parallel88/run-fashion-onnx-88.mjs|research/mission1-parallel88/fashion-onnx-probes-88.mjs|research/mission1-parallel88/blind-evaluator-handoff-88.mjs|research/mission1-parallel88/score-public-validation-88.py|.github/workflows/mission1-parallel88-no-deploy.yml) ;;
              *) echo "P88_UNAUTHORIZED_PATH $p"; exit 1 ;;
            esac
          done < /tmp/m1-88-paths
          test -z "$(git diff --name-only "$BASE" HEAD -- public/auth.js public/outfit-worker.mjs public/dual-worker-82.mjs public/dual-core-82.mjs public/local-worker.mjs public/recognition-engine.mjs benchmark supabase)"
          grep -Fq 'const reviewFirst836=true;' public/app.js
          grep -Fq 'FAMILY ALPHA HOLD #255 OPEN' research/mission1-parallel88/REPORT.md
          node --check public/outfit-instance-review-840.mjs
          node --check public/outfit-capture.js
          node --check public/app.js
          node --check tests/mission1-parallel88-instance-conservation.test.mjs
          node --check tests/mission1-parallel88-owner-mask-lease.test.mjs
          node --check scripts/test-m1-owner-pair-admission-846.mjs
          node --check scripts/test-p82-review-browser.mjs
          node --check research/mission1-parallel88/run-public-validation-88.mjs
          node --check research/mission1-parallel88/exposed-threshold-probes-88.mjs
          node --check research/mission1-parallel88/run-coco-accessory-88.mjs
          node --check research/mission1-parallel88/run-fashion-onnx-88.mjs
          node --check research/mission1-parallel88/fashion-onnx-probes-88.mjs
          node --check research/mission1-parallel88/blind-evaluator-handoff-88.mjs
          python -m py_compile research/mission1-parallel88/recover-public-validation-88.py research/mission1-parallel88/score-public-validation-88.py
          # Source-execute the actual stdlib-only confidence-retention
          # research function without requiring a model, private photos or COCO.
          python - <<'PY'
          import ast, math
          from pathlib import Path
          p=Path("research/mission1-parallel88/score-public-validation-88.py")
          tree=ast.parse(p.read_text())
          f=next(n for n in tree.body if isinstance(n,ast.FunctionDef)
                 and n.name=="retained_fixed_match_diagnostic")
          scope={"math":math}
          exec(compile(ast.Module(body=[f],type_ignores=[]),str(p),"exec"),scope)
          calc=scope["retained_fixed_match_diagnostic"]
          row={"truth":2,"predicted":3,
               "predictedRegions":[{"confidence":.83},{"confidence":.96},{"confidence":.93}],
               "classAgnosticMatches":[{"predictionIndex":0},{"predictionIndex":2}],
               "categoryCompatibleMatches":[{"predictionIndex":0}]}
          out=calc([row],(.8,.9,.95))
          assert [x["retainedProposals"] for x in out]==[3,2,1]
          assert [x["retainedPriorClassAgnosticMatches"] for x in out]==[2,1,0]
          assert [x["retainedPriorCategoryCompatibleMatches"] for x in out]==[1,0,0]
          assert all(x["notRematchedIoU"] and x["notNovelCalibration"] and
                     x["noAutoSaveAuthority"] for x in out)
          for changed in ({**row,"predicted":2},
                          {**row,"predictedRegions":[{"confidence":float("nan")},
                              *row["predictedRegions"][1:]]},
                          {**row,"classAgnosticMatches":[{"predictionIndex":0},
                              {"predictionIndex":0}]}):
              try: calc([changed])
              except ValueError: continue
              raise AssertionError("Invalid original public-score receipt accepted")
          print("P88_FIXED_MATCH_DIAGNOSTIC_SELFTEST PASS; research only, no model promotion")
          # Source-execute the true category-confusion atlas on *declared*
          # one-to-one human/model matches; reject fabricated or reused pairs.
          from collections import Counter
          fn=next(n for n in tree.body if isinstance(n,ast.FunctionDef)
                  and n.name=="source_category_failure_diagnostic")
          scope["Counter"]=Counter
          exec(compile(ast.Module(body=[fn],type_ignores=[]),str(p),"exec"),scope)
          diagnose=scope["source_category_failure_diagnostic"]
          atlas={"id":"synthetic-only","truth":2,"predicted":3,
                 "perHumanCategory":["Bottoms","Dresses"],
                 "predictedRegions":[{"categories":["Dresses"]},
                                     {"categories":["Tops","Outerwear"]},
                                     {"categories":["Shoes"]}],
                 "classAgnosticMatches":[{"truthIndex":0,"predictionIndex":0,"iou":.67},
                                         {"truthIndex":1,"predictionIndex":1,"iou":.65}],
                 "categoryCompatibleMatches":[]}
          report=diagnose([atlas])
          assert [report[k] for k in ("originalClassAgnosticMatches",
                 "wrongCategoryWithinAgnostic","humanWithoutIoUMatch",
                 "proposalWithoutIoUMatch")]==[2,2,0,1]
          assert report["separatelyOptimizedCategoryCompatibleMatches"]==0
          assert report["doesNotAuthorizeModelChangesOrAutoSave"] is True
          for malformed in (
              {**atlas,"truth":1},
              {**atlas,"classAgnosticMatches":[atlas["classAgnosticMatches"][0]]*2},
              {**atlas,"classAgnosticMatches":[{"truthIndex":0,"predictionIndex":0,"iou":.3}]},
              {**atlas,"predictedRegions":[{"categories":[]},*atlas["predictedRegions"][1:]]}
          ):
              try: diagnose([malformed])
              except ValueError: continue
              raise AssertionError("Untrusted original class-confusion receipt accepted")
          print("P88_SOURCE_CLASS_ERROR_ATLAS_SELFTEST PASS; no model/threshold promotion")
          fn=next(n for n in tree.body if isinstance(n,ast.FunctionDef)
                  and n.name=="confidence_failure_atlas88")
          exec(compile(ast.Module(body=[fn],type_ignores=[]),str(p),"exec"),scope)
          conf=scope["confidence_failure_atlas88"]
          row={**atlas, "predictedRegions":[
              {"categories":["Dresses"],"confidence":.83},
              {"categories":["Tops","Outerwear"],"confidence":.96},
              {"categories":["Shoes"],"confidence":.93}]}
          actual=conf([row])
          assert actual["notReoptimizedIoU"] is True
          assert actual["notIndependentBlindSubtypeOrColorTruth"] is True
          assert actual["notRealOwnerSaveErrorCount"] is True
          observed=actual["thresholds"]
          assert [(x["retainedProposals"],x["fixedAgnosticCategoryIncompatible"],
                   x["originalIoUUnmatchedProposals"],x["fixedAssignmentHighRiskProposals"])
                  for x in observed]==[(3,2,1,3),(2,1,1,2),(2,1,1,2),(1,1,0,1)]
          assert all(x["noAutoSaveOrReleaseAuthority"] and x["noRetuningFromExposedCohort"]
                     for x in observed)
          good={**row,"predictedRegions":[
              {"categories":["Bottoms"],"confidence":.83},
              {"categories":["Dresses"],"confidence":.96},
              {"categories":["Shoes"],"confidence":.93}],
              "categoryCompatibleMatches":row["classAgnosticMatches"]}
          assert conf([good])["thresholds"][0]["fixedAgnosticCategorySupported"]==2
          for bad in (
              {**row,"predictedRegions":[{"categories":["Shoes"],"confidence":float("nan")},
                                         *row["predictedRegions"][1:]]},
              {**row,"predicted":2},
              {**row,"classAgnosticMatches":[row["classAgnosticMatches"][0]]*2},
              {**row,"categoryCompatibleMatches":[{"truthIndex":0,"predictionIndex":0,"iou":.67}]}
          ):
              try: conf([bad])
              except ValueError: continue
              raise AssertionError("Untrusted high-confidence mask receipt accepted")
          print("P88_FIXED_MASK_CONFIDENCE_RISK_SELFTEST PASS; exposed-only no save/threshold")
          PY
          python research/mission1-parallel88/recover-public-validation-88.py --verify-manifest-only
          python research/mission1-parallel88/recover-public-validation-88.py --audit-accessory-ontology | tee /tmp/p88-human-accessory-ontology
          grep -Fq '"humanAccessoryInstances":13' /tmp/p88-human-accessory-ontology
          grep -Fq '"noDirectSegformerClassInstances":5' /tmp/p88-human-accessory-ontology
          grep -Fq '"modelInference":false' /tmp/p88-human-accessory-ontology
      - name: Synthetic source-conservation and inherited instance/pair regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/mission1-parallel88-instance-conservation.test.mjs tests/mission1-parallel88-owner-mask-lease.test.mjs tests/outfit-instance-review-840.test.mjs tests/outfit-segmentation.test.mjs tests/outfit-unit-reconciliation-70.test.mjs | tee /tmp/m1-88-targeted
          grep -Eq '^# fail 0$' /tmp/m1-88-targeted
      - name: Auth/photo policies and physical validation remain blocked
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/mission1-release-evidence-851.test.mjs | tee /tmp/m1-88-policy
          grep -Eq '^# fail 0$' /tmp/m1-88-policy
          node scripts/m1-release-evidence-851.mjs | tee /tmp/m1-88-gate
          grep -Fq '"status":"BLOCKED"' /tmp/m1-88-gate
          grep -Fq '"shouldLiftFamilyAlphaHold":false' /tmp/m1-88-gate
  full-native-and-desktop-policy-NO-DEPLOY:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium webkit
      - name: Full inherited Node and original-JPEG no-account builds
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          P79_REQUIRE_DECODER=1 node --test --test-concurrency=1 tests/*.cjs tests/*.mjs | tee /tmp/m1-88-full
          grep -Eq '^# fail 0$' /tmp/m1-88-full
      - name: Desktop Chromium WebKit native original photo and owner review
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-m1-original-photo-browser-865.mjs
          node scripts/test-p82-review-browser.mjs
          node scripts/test-m1-owner-pair-admission-846.mjs

  # Expensive, genuine licensed-source model benchmark. The deliberate commit
  # prefix triggers a single validation research run; later docs-only pushes
  # do not repeatedly download public photos/model assets. NO deployment.
  real-public-human-validation-NO-DEPLOY:
    if: "${{ startsWith(github.event.head_commit.message, 'research(m1 #88): run real') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover frozen P68 public-original JPEGs without sharing images
        shell: bash
        run: |
          set -euo pipefail
          python research/mission1-parallel88/recover-public-validation-88.py --verify-manifest-only
          python research/mission1-parallel88/recover-public-validation-88.py
      - name: Install pinned SegFormer native inference and human COCO IoU dependencies
        run: |
          set -euo pipefail
          ONNXRUNTIME_NODE_INSTALL=skip npm install --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 sharp@0.34.3 onnxruntime-node@1.22.0
          python -m pip install --disable-pip-version-check numpy==2.2.6 pycocotools==2.0.10
      - name: Actual fp32 SegFormer on original validation JPEGs — no owner save
        shell: bash
        run: |
          set -euo pipefail
          node --expose-gc research/mission1-parallel88/run-public-validation-88.mjs
          python research/mission1-parallel88/score-public-validation-88.py
          # Independent COCO-trained secondary detector ONLY for bags/ties/umbrellas.
          # Unsupported watch/belt/hat/glasses are not guessed; no product integration.
          node research/mission1-parallel88/run-coco-accessory-88.mjs
          python - <<'PY'
          import json
          p='benchmark/p88-real-validation-masks/real-public-coco-accessory-88.json'
          d=json.load(open(p))
          assert d['model']=='Xenova/yolos-tiny' and d['dtype']=='q4'
          assert d['photoManifestSha256']=='b76e9890bda49c58c6adbbafb6f7dd738f4dcf604357fc56aa0b6e770ebe35bd'
          assert d['aggregate']['humanAccessoryInstances']==13
          assert d['aggregate']['supportedHumanAccessoryInstances']==2
          assert d['aggregate']['unsupportedHumanAccessoryInstances']==11
          assert d['aggregate']['supportedAccessoryMatches']<=2
          assert d['noProductModelPromotion'] is True
          assert d['noAutomaticSaveAuthority'] is True
          assert d['newBlindHoldout'] is False and d['physicalPhoneAcceptance'] is False
          print('P88_GENUINE_COCO_ACCESSORY_EVIDENCE',d['aggregate'],'research-only bounding boxes')
          PY
          # 46-class licensed Fashionpedia YOLOv8n ONNX: pinned SHA, no PyTorch pickle.
          # Same exposed historical public sources, all accessories represented.
          node research/mission1-parallel88/run-fashion-onnx-88.mjs
          python - <<'PY'
          import json
          d=json.load(open('benchmark/p88-real-validation-masks/real-fashion-onnx-88.json'))
          assert d['model']=='louisJLN/yolo8-fashionpedia'
          assert d['verifiedModelSha256']=='6b581af3abe2b4ae97a84cbe9aef5ae37207a68ee966d22b0b8d7969d79e6920'
          a=d['aggregate']
          assert a['photos']==16 and a['humanAccessoryInstances']==13
          assert 0<=a['matchedAccessoryBoxes']<=13
          assert a['unmatchedProposals']>=0 and a['missedAccessories']>=0
          assert d['sameExposedP68Photos'] is True
          assert d['consumerAutomaticSaveNotAuthorized'] is True
          assert d['modelTrainingOverlapNotIndependentlyCleared'] is True
          print('P88_GENUINE_FASHION_46CLASS_EVIDENCE',a,'bbox only, cannot promote to closet')
          PY
          grep -Fq '"shoeOnly68": {' benchmark/p88-real-validation-masks/real-validation-measured-88.json
          grep -Fq '"p88Safe": {' benchmark/p88-real-validation-masks/real-validation-measured-88.json
          python - <<'PY'
          import json
          d=json.load(open('benchmark/p88-real-validation-masks/real-validation-measured-88.json'))
          safe=d['p88Safe']['classAgnostic']
          old=d['shoeOnly68']['classAgnostic']
          assert safe['matched']>=old['matched'] and safe['falsePositives']<=old['falsePositives']
          assert d['newSealedAcceptance'] is False and d['autoSaveAcceptance']=='BLOCKED_NOT_CALIBRATED'
          diag=d['confidenceRetentionResearchOnly']
          assert [row['threshold'] for row in diag]==[.8,.85,.9,.95]
          assert all(row['originalHumanInstances']==53 and row['notRematchedIoU'] is True
                     and row['notNovelCalibration'] is True and row['noAutoSaveAuthority'] is True
                     for row in diag)
          assert d['confidenceCutoffPromotionAllowed'] is False
          risk=d['confidenceFailureAtlasResearchOnly']
          assert risk['photos']==16 and risk['humanInstances']==53
          assert risk['notReoptimizedIoU'] is True
          assert risk['notIndependentBlindSubtypeOrColorTruth'] is True
          assert risk['notRealOwnerSaveErrorCount'] is True
          assert [x['threshold'] for x in risk['thresholds']]==[.8,.85,.9,.95]
          assert all(x['noAutoSaveOrReleaseAuthority'] and x['noRetuningFromExposedCohort']
                     and x['fixedAssignmentHighRiskProposals']<=x['retainedProposals']
                     and x['originalClassAgnosticIoUMatched']<=x['retainedProposals']
                     for x in risk['thresholds'])
          print('P88_REAL_HIGH_CONFIDENCE_FIXED_MASK_RISK',risk,'exposed research only')
          assert d['exposedResearchPixelGateControlParity'] is True
          assert d['exposedResearchReusesSameHumanSource'] is True
          assert d['exposedResearchNoModelOrAutoSavePromotion'] is True
          assert d['exposedResearchPixelGateParameters']=={
            'researchLoose65':{'pixelConfidence':0.65,'pixelMargin':0.12},
            'researchLoose55':{'pixelConfidence':0.55,'pixelMargin':0.08},
            'researchLoose65ShoeSplit':{'pixelConfidence':0.65,'pixelMargin':0.12,
                                        'conservativeShoeComponentReview':True}}
          for name in ('researchLoose65','researchLoose55','researchLoose65ShoeSplit'):
            candidate=d[name]
            assert candidate['classAgnostic']['human']==53
            assert candidate['categoryCompatible']['human']==53
            assert candidate['classAgnostic']['matched']<=candidate['classAgnostic']['predicted']
            assert candidate['categoryCompatible']['matched']<=candidate['classAgnostic']['matched']
            delta=d['researchOnlyPixelGateDiffVsSafe'][name]
            assert delta['addedProposals']==candidate['classAgnostic']['predicted']-safe['predicted']
            assert delta['newClassAgnosticMatches']==candidate['classAgnostic']['matched']-safe['matched']
            assert delta['notSealedAccuracy'] is True and delta['notProductionPromotion'] is True
          split=d['researchShoeComponentRescueVsLoose65']
          assert split['extraProposals']==d['researchLoose65ShoeSplit']['classAgnostic']['predicted']-d['researchLoose65']['classAgnostic']['predicted']
          assert split['extraCategoryMatches']==d['researchLoose65ShoeSplit']['categoryCompatible']['matched']-d['researchLoose65']['categoryCompatible']['matched']
          assert split['notBlindGeneralization'] is True
          assert split['notDeploymentPermission'] is True
          print('P88_EXPOSED_PIXEL_GATE_RESEARCH_ONLY',d['researchOnlyPixelGateDiffVsSafe'],
                'shoeRescue',split,'no threshold promotion; not blind')
          assert diag[0]['retainedProposals']==safe['predicted']
          assert diag[0]['retainedPriorCategoryCompatibleMatches']==d['p88Safe']['categoryCompatible']['matched']
          print('P88_EXPOSED_SAFE_MASK_COUNTS_ONLY',safe, 'not human subtype/color or release acceptance')
          print('P88_REAL_CONFIDENCE_RETENTION_DIAGNOSTIC',diag, 'not a recalibrated precision or authorized threshold')
          PY
          grep -Fq '"deltaP88VsShoeOnlyRecall"' benchmark/p88-real-validation-masks/real-validation-measured-88.json
          test -s benchmark/p88-real-validation-masks/real-validation-measured-88.json
          grep -Fq '"newSealedAcceptance": false' benchmark/p88-real-validation-masks/real-validation-measured-88.json
      - name: Evidence only, no original photos or masks uploaded
        uses: actions/upload-artifact@v4
        with:
          name: p88-exposed-validation-human-instance-metrics
          path: |
            benchmark/p88-real-validation-masks/real-validation-measured-88.json
            benchmark/p88-real-validation-masks/real-validation-predictions-88.json
            benchmark/p88-real-validation-masks/real-public-coco-accessory-88.json
            benchmark/p88-real-validation-masks/real-fashion-onnx-88.json
          if-no-files-found: error
          retention-days: 14

  # P0 isolated prompt-scoring experiment. No product or admission changes.
  footwear-prompt-ensemble-NO-DEPLOY:
    if: "${{ startsWith(github.event.head_commit.message, 'research(m1 #88): footwear') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover locked licensed public originals and run genuine current FashionCLIP browser inference
        shell: bash
        run: |
          set -euo pipefail
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/build.mjs
          mkdir -p benchmark/output-footwear-p0
          node --input-type=module -e "import fs from 'node:fs';const rows=['benchmark/manifest-reviewed-32.json','benchmark/manifest-holdout-16.json'].flatMap(p=>JSON.parse(fs.readFileSync(p)));if(rows.length!==48||new Set(rows.map(x=>x.id)).size!==48||!rows.some(x=>x.id==='commons-0078'&&x.expectedType==='Sneakers'))throw Error('P0 required exposed sources missing');fs.writeFileSync('benchmark/output-footwear-p0/manifest.json',JSON.stringify(rows));"
          node scripts/run-browser-photo-benchmark.mjs benchmark/output-footwear-p0/manifest.json benchmark/output-footwear-p0
      - name: Compare neutral versus balanced pinned color-prompt logits on the SAME real image embeddings
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          import {localCandidates} from './public/local-catalog.mjs';
          import {makeVectorScorer} from './public/vector-scorer.mjs';
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const readJson=async p=>JSON.parse(await readFile(p,'utf8'));
          const meta=await readJson('public/recognition-vectors.json');
          const bytes=await readFile('public/recognition-vectors.bin');
          assert.equal(meta.revision,'0f99955d944c39bfd9d035a02ac273c7a44a406b');
          assert.equal(meta.sha256,'e1e0415f2272e81c0f3ce2f08fd5fd5c2a9eb6481437d696936c723e8e1abb2f');
          assert.equal(hash(bytes),meta.sha256);
          const vectors=new Float32Array(bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength));
          const manifest=await readJson('benchmark/output-footwear-p0/manifest.json');
          const locked=await readJson('benchmark/locked-photo-sources.json');
          const rows=await readJson('benchmark/output-footwear-p0/results.json');
          assert.equal(rows.length,48);assert.equal(manifest.length,48);
          assert.equal(new Set(rows.map(r=>r.id)).size,48);
          const shoes=localCandidates.filter(c=>c.category==='Shoes');
          const colors=['black','white','gray','beige','brown','blue','green','red','pink','purple','yellow','orange','multicolor'];
          const prompts=shoes.map(c=>({type:c.itemType,neutral:c.label,labels:[c.label,...colors.map(color=>'a '+color+' '+c.itemType.toLowerCase())]}));
          const all=prompts.flatMap(p=>p.labels);
          assert.equal(shoes.length,7);assert.equal(new Set(all).size,98);
          assert.ok(all.every(l=>meta.labels.includes(l)));
          const aggregate=(p,scores)=>p.labels.reduce((n,l)=>n+Math.log(Math.max(Number.MIN_VALUE,scores.get(l))),0)/p.labels.length;
          const normalize=rows=>{const max=Math.max(...rows.map(r=>r.logit));const total=rows.reduce((n,r)=>n+Math.exp(r.logit-max),0);return rows.map(r=>({...r,score:Math.exp(r.logit-max)/total})).sort((a,b)=>b.score-a.score);};
          assert.deepEqual(normalize([{type:'a',logit:1},{type:'b',logit:2}]).map(r=>r.type),['b','a']);
          assert.ok(Math.abs(normalize([{type:'a',logit:0},{type:'b',logit:0}])[0].score-.5)<1e-12);
          const scorer=makeVectorScorer(async image=>image.features,meta,vectors);
          const family=t=>['Ankle boots','Tall boots','Boots'].includes(t)?'Boots':t;
          const cases=[];
          for(const truth of manifest){
            const row=rows.find(x=>x.id===truth.id), source=locked.find(x=>x.id===truth.id);
            assert.ok(row&&!row.error&&source?.verified&&source.attribution?.license);
            assert.equal(hash(await readFile('benchmark/photos/'+source.image)),source.sha256);
            // Eligibility comes only from the actual current classifier, not the answer key.
            const eligible=row.prediction?.category==='Shoes';
            if(truth.expectedCategory!=='Shoes'&&!eligible){
              cases.push({id:truth.id,expectedCategory:truth.expectedCategory,sourceSha256:source.sha256,existingPrediction:row.prediction,candidateApplied:false});
              continue;
            }
            assert.equal(row.recognitionMemory?.modelKey,'fashion-clip/whole-v1/'+meta.revision);
            assert.equal(row.recognitionMemory.features.length,512);
            assert.ok(row.recognitionMemory.features.every(Number.isFinite));
            const image={features:row.recognitionMemory.features};
            const raw=await scorer(image,all);
            const scores=new Map(raw.map(x=>[x.label,x.score]));
            assert.ok(raw.every(x=>Number.isFinite(x.score)&&x.score>0));
            const neutral=normalize(prompts.map(p=>({type:p.type,logit:Math.log(scores.get(p.neutral))})));
            const candidate=normalize(prompts.map(p=>({type:p.type,logit:aggregate(p,scores)})));
            const expected=truth.expectedCategory==='Shoes'?family(truth.expectedType):null;
            cases.push({id:truth.id,sourceSha256:source.sha256,expectedCategory:truth.expectedCategory,expectedFamily:expected,expectedType:truth.expectedType,existingPrediction:row.prediction,existingStrong:row.strong,existingReason:row.reason,neutral,candidate,candidateApplied:eligible,neutralFamilyCorrect:expected!==null&&eligible&&family(neutral[0].type)===expected,candidateFamilyCorrect:expected!==null&&eligible&&family(candidate[0].type)===expected,rawPromptScores:raw});
          }
          const footwear=cases.filter(x=>x.expectedCategory==='Shoes');
          assert.equal(footwear.length,16);
          const knownFailure=footwear.find(x=>x.id==='commons-0078');
          assert.equal(knownFailure?.sourceSha256,'ba080a9a5d4aa68c193738e728e83c45b6a833a9bf80c45de4d2b35ece38154e');
          assert.equal(knownFailure.expectedFamily,'Sneakers');
          const count=(xs,key)=>xs.filter(x=>x[key]).length;
          const summary={photos:cases.length,footwear:footwear.length,controls:cases.length-footwear.length,
            neutralFamilyCorrect:count(footwear,'neutralFamilyCorrect'),candidateFamilyCorrect:count(footwear,'candidateFamilyCorrect'),
            knownFailure:{id:knownFailure.id,existing:knownFailure.existingPrediction,neutral:knownFailure.neutral.slice(0,3),candidate:knownFailure.candidate.slice(0,3),candidateFamilyCorrect:knownFailure.candidateFamilyCorrect},
            changed:footwear.filter(x=>x.neutral[0].type!==x.candidate[0].type).map(x=>x.id),
            improved:footwear.filter(x=>!x.neutralFamilyCorrect&&x.candidateFamilyCorrect).map(x=>x.id),
            regressed:footwear.filter(x=>x.neutralFamilyCorrect&&!x.candidateFamilyCorrect).map(x=>x.id),
            nonFootwearEligible:cases.filter(x=>x.expectedCategory!=='Shoes'&&x.candidateApplied).length,
            existingFamilyCorrect:footwear.filter(x=>family(x.existingPrediction?.type)===x.expectedFamily).length,
            byFamily:Object.fromEntries(['Sneakers','Boots'].map(f=>{const xs=footwear.filter(x=>x.expectedFamily===f);return [f,{n:xs.length,existingCorrect:xs.filter(x=>family(x.existingPrediction?.type)===f).length,neutralCorrect:count(xs,'neutralFamilyCorrect'),candidateCorrect:count(xs,'candidateFamilyCorrect')}];}))};
          const output={schema:'p88-footwear-balanced-color-prompt-replay-v1',model:meta.model,revision:meta.revision,vectorSha256:meta.sha256,method:'equal average of neutral and 13 existing matched color prompt logits; no fitted threshold',summary,cases,exposedHistoricalCohort:true,independentAnkleVsTallBootTruth:false,oneGenuineImageInferenceSharedByBothPromptArms:true,automaticSaveAuthority:false,productPromotion:false};
          await writeFile('benchmark/output-footwear-p0/footwear-score-comparison.json',JSON.stringify(output,null,2));
          console.log('P88_FOOTWEAR_REAL_PROMPT_COMPARISON '+JSON.stringify(summary));
          assert.equal(summary.nonFootwearEligible,0,'Current model has a non-footwear category false positive; no promotion.');
          // Report negative outcomes honestly; successful execution is not accuracy acceptance.
          JS
      - name: Upload numeric comparison only (not photos or raw embeddings)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p88-footwear-prompt-comparison
          path: benchmark/output-footwear-p0/footwear-score-comparison.json
          if-no-files-found: warn
          retention-days: 14

      - name: Encode distinct high-top sneaker and boot-shaft descriptions with pinned text encoder
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r scripts/recognition-requirements.txt
          mkdir -p benchmark/output-footwear-p0/shape-candidate
          cat > benchmark/output-footwear-p0/shape-candidate/prompts.json <<'JSON'
          {
            "sneakers": ["sneakers", "low top athletic shoes with a flexible flat rubber outsole", "high top canvas basketball sneakers with laces and a flat rubber cupsole", "high top athletic trainers with a padded ankle collar and a sports shoe sole"],
            "ankle boots": ["ankle boots", "short structured boots with an upright ankle shaft and a distinct boot heel", "ankle height leather boots with a firm boot sole and a shaft enclosing the ankle", "short Chelsea or lace up boots with a structured shaft above the instep"]
          }
          JSON
          python scripts/rebuild-recognition-vectors.py --prompt-overrides benchmark/output-footwear-p0/shape-candidate/prompts.json --blend 0.5 --output-dir benchmark/output-footwear-p0/shape-candidate
          git diff --exit-code -- public/recognition-vectors.json public/recognition-vectors.bin
      - name: Compare high-top construction versus boot-shaft candidate on identical genuine image features
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {localCandidates} from './public/local-catalog.mjs';
          import {makeVectorScorer} from './public/vector-scorer.mjs';
          const root='benchmark/output-footwear-p0';
          const read=async p=>JSON.parse(await readFile(p,'utf8'));
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const base=await read('public/recognition-vectors.json');
          const candidate=await read(root+'/shape-candidate/recognition-vectors.json');
          const original=await readFile('public/recognition-vectors.bin');
          const trial=await readFile(root+'/shape-candidate/recognition-vectors.bin');
          assert.equal(base.revision,'0f99955d944c39bfd9d035a02ac273c7a44a406b');
          assert.equal(base.sha256,'e1e0415f2272e81c0f3ce2f08fd5fd5c2a9eb6481437d696936c723e8e1abb2f');
          assert.equal(hash(original),base.sha256);
          assert.equal(hash(trial),candidate.sha256);
          assert.equal(candidate.revision,base.revision);
          assert.equal(candidate.model,base.model);
          assert.equal(candidate.scale,base.scale);
          assert.equal(candidate.promptBlend,0.5);
          assert.deepEqual(candidate.labels,base.labels);
          assert.equal(trial.length,original.length);
          const changed=base.labels.filter((label,i)=>!original.subarray(i*2048,(i+1)*2048).equals(trial.subarray(i*2048,(i+1)*2048)));
          assert.deepEqual(changed.sort(),['ankle boots','sneakers']);
          const asFloats=b=>new Float32Array(b.buffer.slice(b.byteOffset,b.byteOffset+b.byteLength));
          const baselineScore=makeVectorScorer(async x=>x.features,base,asFloats(original));
          const trialScore=makeVectorScorer(async x=>x.features,candidate,asFloats(trial));
          const shoes=localCandidates.filter(x=>x.category==='Shoes');
          const labels=shoes.map(x=>x.label),types=new Map(shoes.map(x=>[x.label,x.itemType]));
          assert.equal(labels.length,7);
          const family=t=>['Boots','Ankle boots','Tall boots'].includes(t)?'Boots':t;
          const prior=await read(root+'/footwear-score-comparison.json');
          const actual=await read(root+'/results.json');
          assert.equal(actual.length,48);
          assert.equal(prior.cases.length,48);
          assert.equal(new Set(prior.cases.map(x=>x.sourceSha256)).size,48);
          const cases=[];
          for(const p of prior.cases){
            const r=actual.find(x=>x.id===p.id);
            assert.ok(r&&!r.error);
            const eligible=r.prediction?.category==='Shoes';
            assert.equal(eligible,p.candidateApplied);
            if(!eligible){cases.push({id:p.id,sourceSha256:p.sourceSha256,eligible:false,expectedCategory:p.expectedCategory,expectedFamily:p.expectedFamily??null});continue;}
            assert.equal(r.recognitionMemory?.modelKey,'fashion-clip/whole-v1/'+base.revision);
            assert.equal(r.recognitionMemory.features.length,512);
            const input={features:r.recognitionMemory.features};
            const rank=async scorer=>(await scorer(input,labels)).map(x=>({type:types.get(x.label),score:x.score}));
            const before=await rank(baselineScore),after=await rank(trialScore);
            assert.equal(before[0].type,p.neutral[0].type);
            assert.ok(Math.abs(before[0].score-p.neutral[0].score)<1e-9);
            cases.push({id:p.id,sourceSha256:p.sourceSha256,eligible:true,expectedCategory:p.expectedCategory,expectedFamily:p.expectedFamily??null,before,after});
          }
          const footwear=cases.filter(x=>x.expectedCategory==='Shoes');
          const correct=(x,arm)=>x.eligible&&family(x[arm][0].type)===x.expectedFamily;
          const improved=footwear.filter(x=>!correct(x,'before')&&correct(x,'after')).map(x=>x.id);
          const regressed=footwear.filter(x=>correct(x,'before')&&!correct(x,'after')).map(x=>x.id);
          const known=footwear.find(x=>x.id==='commons-0078');
          assert.equal(known.sourceSha256,'ba080a9a5d4aa68c193738e728e83c45b6a833a9bf80c45de4d2b35ece38154e');
          assert.equal(known.expectedFamily,'Sneakers');
          const summary={photos:cases.length,footwear:footwear.length,controls:cases.length-footwear.length,baselineCorrect:footwear.filter(x=>correct(x,'before')).length,candidateCorrect:footwear.filter(x=>correct(x,'after')).length,improved,regressed,knownHighTop:{before:known.before,after:known.after,correct:correct(known,'after')},nonFootwearEligible:cases.filter(x=>x.expectedCategory!=='Shoes'&&x.eligible).length,coveredFamilies:[...new Set(footwear.map(x=>x.expectedFamily))],independentBlind:false,productionPromotion:false};
          assert.equal(summary.baselineCorrect,prior.summary.neutralFamilyCorrect);
          await writeFile(root+'/high-top-shape-comparison.json',JSON.stringify({schema:'p88-high-top-shape-replay-v1',baseVectorSha256:base.sha256,candidateVectorSha256:candidate.sha256,modelRevision:base.revision,changedRows:changed,summary,cases},null,2));
          console.log('P88_HIGH_TOP_SHAPE_COMPARISON '+JSON.stringify(summary));
          assert.equal(summary.nonFootwearEligible,0);
          JS
      - name: Upload high-top shape numeric evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p88-high-top-shape-comparison
          path: benchmark/output-footwear-p0/high-top-shape-comparison.json
          if-no-files-found: warn
          retention-days: 14

  footwear-framing-NO-DEPLOY:
