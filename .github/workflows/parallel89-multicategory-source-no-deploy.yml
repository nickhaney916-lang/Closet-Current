name: Mission 2 parallel #89 real multi-category source contract plus inherited P92 genuine WebGL NO DEPLOY
on:
  push:
    branches: [research/parallel89-multicategory-source-contract-20261114-HOLD]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - run: git merge-base --is-ancestor 5a27618d31facb8c98065c9d32b7d2f3671cc0e0 HEAD
      - run: node scripts/build.mjs
      - run: node --check research/mission2-source-length/actual-photo-contact-52.mjs
      - run: node --check research/mission2-p88/sample-contact-gate.mjs
      - run: node --check research/mission2-p89/source-topology-gate.mjs
      - run: node --check research/mission2-p90/five-pose-contact-gate.mjs
      - run: node --check research/mission2-p91/photographed-skirt-relief.mjs
      - run: node --check research/mission2-p91/drape-source-gate.mjs
      - run: node --check research/mission2-p92/blind-photo-review.mjs
      - run: node --check scripts/build-mission2-p92-review-pack.mjs
      - run: node --check scripts/test-mission2-p92-offline-page.mjs
      - run: node --check scripts/install-mission2-p91-preview.mjs
      - run: node --check scripts/test-mission2-p91-native-browser.mjs
      - run: node --check research/mission2-p87/skinned-pose-preview.mjs
      - run: node --check scripts/install-mission2-p87-preview.mjs
      - run: node --check scripts/test-mission2-p87-native-browser.mjs
      - run: node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
      - run: node scripts/audit-parallel89-public-source.mjs benchmark/parallel89/source-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: P89-real-original-JPEG-six-category-source-inventory-HOLD
          path: benchmark/parallel89/source-receipt.json
          retention-days: 14
      - run: git diff --exit-code 5a27618d31facb8c98065c9d32b7d2f3671cc0e0 HEAD -- public/ supabase/ benchmark/locked-photo-sources.json
  actual-source-pose-linked-skinned-AB:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      P87_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Prepare immutable detached research donors
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git worktree add --detach .native05-donor-541 df6885d6011cb33fb22dceb81a08f35a0ac4dd61
          git worktree add --detach .p173-p60 6fe5e46b91533a96f3c0d86950ea077cb355c459
          git worktree add --detach .p173-p172 88d2fdb412f84b0498c86bfa17f4b391425e1958
          for name in .native05-donor-541 .p173-p60 .p173-p172; do
            git config --global --add safe.directory "$GITHUB_WORKSPACE/$name"
            ln -s ../node_modules "$name/node_modules"
          done
      - name: Reproduce genuine licensed source photos and original rigs
        working-directory: .native05-donor-541
        run: |
          node scripts/build-three-d-31-jeans-proposal.mjs
          node scripts/build-three-d-37-second-jeans.mjs
          node scripts/build-work47-benchmark.mjs
          node research/three-d-20/restore-approved-models.mjs
      - name: Install research source chain and reversible static preview
        run: |
          cd .p173-p60
          node scripts/install-photo-cloth-realism-164.mjs ../.native05-donor-541
          cd ..
          node scripts/install-native-photo-anatomical-fit-171.mjs .native05-donor-541
          node scripts/install-native-photo-torso-173.mjs .native05-donor-541 .p173-p172
          node scripts/install-source-shoulder-seam-174.mjs .native05-donor-541
          node scripts/install-native-original-dress-drape-175.mjs .native05-donor-541
          node scripts/install-mission2-source-dress-motion.mjs .native05-donor-541
          node scripts/install-mission2-actual-photo-contact52.mjs .native05-donor-541
          node scripts/install-mission2-p86-preview.mjs .native05-donor-541
          node scripts/install-mission2-p87-preview.mjs .native05-donor-541
          node scripts/install-mission2-p91-preview.mjs .native05-donor-541
      - run: node scripts/test-mission2-p91-native-browser.mjs
      - name: Build original-JPEG-SHA-locked blind human review packet from actual WebGL
        run: node scripts/build-mission2-p92-review-pack.mjs
      - name: Smoke the actual offline A/B page, local images and synthetic export (NOT human evidence)
        run: node scripts/test-mission2-p92-offline-page.mjs
      - run: git diff --exit-code 5a27618d31facb8c98065c9d32b7d2f3671cc0e0 HEAD -- public/ supabase/ benchmark/locked-photo-sources.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P89-inherited-P92-authentic-photograph-drape-A-B-renderer-${{ matrix.engine }}-HOLD
          path: benchmark/mission2-p91/native-${{ matrix.engine }}/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P89-inherited-P92-source-true-human-review-offline-${{ matrix.engine }}-HOLD
          path: benchmark/mission2-p92/review-${{ matrix.engine }}/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P89-inherited-P92-research-only-blind-allocation-key-${{ matrix.engine }}-HOLD
          path: benchmark/mission2-p92/secret-allocations-${{ matrix.engine }}.json
          retention-days: 14

