name: MAIN243 original pinned SegFormer native WASM memory boundary HOLD
on:
  push:
    branches: [research/main243-original-segformer-native-heap-witness-HOLD]
  pull_request:
    branches: [research/main242-real-ort-abi-option-call-HOLD]
permissions:
  contents: read
jobs:
  original-source-security:
    name: M243 exact original source and full privacy security
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exactly four research paths and immutable shipped Worker
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=8b88a5c60393151eebc336f6d56124a09bfb4e2c
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE" HEAD)" = "$(printf '%s\n' \
            '.github/workflows/main243-original-segformer-native-heap-HOLD.yml' \
            'scripts/main243-original-segformer-native-abi.mjs' \
            'scripts/test-main243-original-segformer-native-session-browser.mjs' \
            'tests/main243-original-segformer-heap-boundary.test.mjs')"
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          test "$(git rev-parse HEAD:scripts/test-parallel101-real-p94-model-init-stage-browser.mjs)" = ad8ab0eb33322a34f8cc3f45a1fe26feff87b2ab
          node --check scripts/main243-original-segformer-native-abi.mjs
          node --check scripts/test-main243-original-segformer-native-session-browser.mjs
          node --test tests/main243-original-segformer-heap-boundary.test.mjs
      - name: Exact pinned ORT native model and original inherited dependencies
        run: npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Published package integrity and native graph model-call source locks
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm view onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 dist.integrity)" = "sha512-0uS76OPgH0hWCPrFKlL8kYVV7ckM7t/36HfbgoFw6Nd0CZVVbQC4PkrR8mBX8LtNUFZO25IQBqV2Hx2ho3FlbQ=="
          M243_SOURCE_ONLY=1 node scripts/test-main243-original-segformer-native-session-browser.mjs
      - name: Original offline application build and ALL inherited Node regression
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  original-native-model:
    name: M243 genuine original SegFormer native ${{ matrix.engine }} ${{ matrix.arm }}
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, chromium]
        arm: [baseline, pattern_off]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M243_ENGINE: ${{ matrix.engine }}
      M243_PATTERN_ARM: ${{ matrix.arm }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original Worker immutable and strict M243 adversarial negatives
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor 8b88a5c60393151eebc336f6d56124a09bfb4e2c HEAD
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = d66651b616de54c51eb7ef986324b30f1580888f
          node --test tests/main243-original-segformer-heap-boundary.test.mjs
      - name: Install pinned original-graph runtime without deployment
        run: npm install --onnxruntime-node-install-cuda=skip --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@3.8.1 onnxruntime-web@1.22.0-dev.20250409-89f8206ba4 playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Genuine original public pinned SegFormer graph native session memory witness
        shell: bash
        run: |
          set -euo pipefail
          M243_SOURCE_ONLY=1 node scripts/test-main243-original-segformer-native-session-browser.mjs
          node scripts/test-main243-original-segformer-native-session-browser.mjs
