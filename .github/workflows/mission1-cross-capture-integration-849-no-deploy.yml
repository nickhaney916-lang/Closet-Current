name: Mission 1 P849 owner-reviewed cross-capture duplicates — NO DEPLOY
on:
  push:
    branches: [research/mission1-cross-capture-duplicate-integration-849-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mission1-p849-cross-capture-HOLD
  cancel-in-progress: true
jobs:
  exact-P848-native-HOLD:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable P848 ancestor, exact nine-path research scope and first-owner review
        shell: bash
        run: |
          set -euo pipefail
          BASE=90e5753190cd2782e7df5da18dc8075a73fd3f32
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD >/tmp/p849-paths
          cat /tmp/p849-paths
          test "$(wc -l </tmp/p849-paths)" -eq 9
          while IFS= read -r p; do
            case "$p" in
              public/app.js|public/index.html|public/cross-capture-duplicate-77.js|tests/parallel77-cross-capture.test.cjs|tests/mission1-cross-capture-integration-849.test.cjs|scripts/test-parallel77-cross-capture-browser.mjs|scripts/benchmark-parallel77-cross-capture.mjs|research/mission1-cross-capture-integration-849/REPORT.md|.github/workflows/mission1-cross-capture-integration-849-no-deploy.yml) ;;
              *) echo "P849 OUT-OF-SCOPE $p"; exit 1 ;;
            esac
          done </tmp/p849-paths
          test -z "$(git diff --name-only "$BASE" HEAD -- public/auth.js public/photo-color.js public/outfit-worker.mjs public/outfit-capture.js public/garment-color-76.mjs public/clothing-memory.js public/recognition-engine.mjs public/cloud-backup-engine.js benchmark supabase)"
          grep -Fqx 'const reviewFirst836=true;' <(grep '^const reviewFirst836=' public/app.js)
          grep -Fq 'let saveInFlight=false;' public/app.js
          grep -Fq 'function learningScope72()' public/app.js
          grep -Fq "const outfitColor76=outfitUnits70" public/outfit-capture.js
          grep -Fq 'Promise.resolve().then(()=>CrossCaptureDuplicate77.propose(' public/app.js
          grep -Fq 'P849_CHANGED_CANDIDATE_OR_OWNER' public/app.js
          grep -Fq 'needsAtomicAdapter' public/cross-capture-duplicate-77.js
          grep -Fq 'FAMILY ALPHA HOLD #255 OPEN' research/mission1-cross-capture-integration-849/REPORT.md
          echo M1_P849_PINNED_P848_NINE_PATH_NO_DEPLOY_PASS
      - name: Install ephemeral test-only dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Actual-source owner/cross-photo, numeric-only benchmark, all native tests and research builds
        run: |
          set -euo pipefail
          node --check public/cross-capture-duplicate-77.js
          node --check public/app.js
          node --check scripts/test-parallel77-cross-capture-browser.mjs
          node --test tests/parallel77-cross-capture.test.cjs tests/mission1-cross-capture-integration-849.test.cjs
          node scripts/benchmark-parallel77-cross-capture.mjs
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
          echo M1_P849_FULL_NATIVE_AND_BUILDS_PASS
  genuine-desktop-browser-HOLD:
    needs: [exact-P848-native-HOLD]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real desktop Chromium and WebKit only, not physical phones
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Cross-photo side-by-side, actual owner decision, stale edits, no-merge acceptance (320/390/430)
        run: |
          set -euo pipefail
          node scripts/test-parallel77-cross-capture-browser.mjs
      - name: Inherited P848 masked color, P847 learning, P846 shoes, P844/P843 first-photo and save safety
        run: |
          set -euo pipefail
          node scripts/build.mjs
          node scripts/test-parallel76-color-browser.mjs
          node scripts/test-m1-owner-learning-integration-847.mjs
          node scripts/test-m1-owner-pair-admission-846.mjs
          node scripts/test-m1-review-save-lifecycle-844.mjs parent
          node scripts/test-m1-review-save-lifecycle-844.mjs candidate
          node scripts/test-m1-review-first-default-843.mjs
          node scripts/test-m1-owner-review-editor-839.mjs
          echo M1_P849_CHROMIUM_WEBKIT_ALL_REVIEW_GATES_PASS
  licensed-public-photo-source-HOLD:
    needs: [exact-P848-native-HOLD]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      P73_PHOTO_IDS: commons-0003,commons-0014,commons-0021,commons-0033,commons-0049,commons-0060,commons-0077,commons-0082,commons-0094,validation-0001,validation-0019
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install source JPEG decoder only
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3
      - name: Verify original bytes and licensing, NOT independently known duplicate garments
        run: |
          set -euo pipefail
          node scripts/download-reviewed-photos.mjs benchmark/locked-photo-sources.json benchmark/photos "$P73_PHOTO_IDS"
          node scripts/evaluate-parallel73-real-photo.mjs
          echo M1_P849_ORIGINAL_JPEG_HASHES_ONLY_PHYSICAL_DUPLICATE_TRUTH_UNKNOWN
