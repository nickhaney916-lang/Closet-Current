name: Mission 1 P843 default owner review — NO DEPLOY
on:
  push:
    branches: [research/mission1-review-first-default-843-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mission1-p843-review-first-HOLD
  cancel-in-progress: true
jobs:
  exact-parent-native-research-HOLD:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: P842 verified parent and strict five-path research allowlist
        run: |
          set -euo pipefail
          BASE=0de0b712f5c02feb5fc173194eec775f068f499b
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD > /tmp/p843-files
          cat /tmp/p843-files
          test "$(wc -l < /tmp/p843-files)" -eq 5
          while IFS= read -r path; do
            case "$path" in
              public/app.js|tests/mission1-review-first-default-843.test.cjs|scripts/test-m1-review-first-default-843.mjs|research/mission1-review-first-default-843/REPORT.md|.github/workflows/mission1-review-first-default-843-no-deploy.yml) ;;
              *) echo "P843 OUT-OF-SCOPE CHANGE: $path"; exit 1 ;;
            esac
          done < /tmp/p843-files
          test -z "$(git diff --name-only "$BASE" HEAD -- public/local-worker.mjs public/recognition-engine.mjs public/outfit-worker.mjs public/outfit-instance-review-840.mjs supabase public/recognition-vectors.bin public/recognition-vectors.json benchmark)"
          grep -Fq 'FAMILY ALPHA HOLD #255' research/mission1-review-first-default-843/REPORT.md
          grep -Fqx 'const reviewFirst836=true;' <(grep '^const reviewFirst836=' public/app.js)
          echo M1_P843_EXACT_PARENT_AND_REVIEW_DEFAULT_NO_DEPLOY
      - name: Install only temporary test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: P843 true-default source admission and full native regressions
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check scripts/test-m1-review-first-default-843.mjs
          node --check tests/mission1-review-first-default-843.test.cjs
          node --test tests/mission1-review-first-default-843.test.cjs
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  real-engine-owner-review-HOLD:
    needs: [exact-parent-native-research-HOLD]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop browser engines, not physical iOS/Android devices
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Actual scanner default hold plus actual owner Adjust success
        run: |
          set -euo pipefail
          node scripts/test-m1-review-first-default-843.mjs
          node scripts/test-m1-owner-review-editor-839.mjs
          echo M1_P843_BROWSER_NO_AUTO_SAVE_AND_EXPLICIT_OWNER_APPROVAL_PASS
