name: Main1054 editor and script integrity compatibility HOLD
on:
  pull_request:
    branches: [research/main1054-photo-review-discard-HOLD]
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'research/main1054-editor-script-integrity-HOLD' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lane: [chromium, webkit, regression]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact application baseline and patch scope
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          base=365a7a4519f8fa9952fbaf47b70cb3c7c0c38456
          test "$PR_BASE" = "$base"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$(git rev-parse HEAD^)" = 9f2e4882f44310242e84997f1a077c940ac05ed1
          test "$(git rev-parse HEAD^^)" = cfb83c11937e2f2463562acbe27e8cd4dc5c4e0c
          test "$(git rev-parse HEAD^^^)" = "$base"
          test "$(git rev-parse HEAD:public/app.js)" = d5dec3d6f3e2ed3f0efcf5c4a457e31b27584be7
          test "$(git rev-parse HEAD:scripts/build.mjs)" = d2349622d1ea3977ba1f0710d247bd047a21785c
          test "$(git rev-parse HEAD:scripts/test-built-script-integrity-browser.mjs)" = 14e755c9186cec711f885e05cf5012b02c995166
          printf '%s\n' '.github/workflows/main1054-editor-script-integrity-HOLD.yml' 'scripts/build.mjs' 'scripts/test-built-script-integrity-browser.mjs' > "$RUNNER_TEMP/expected-paths"
          git diff --name-only "$base" HEAD > "$RUNNER_TEMP/actual-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
          git log -1 --format='tested commit %H tree %T'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Build twice and compare every output byte
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          cp -a dist "$RUNNER_TEMP/first-build"
          node scripts/build.mjs
          diff -qr "$RUNNER_TEMP/first-build" dist
      - name: Reject unapproved remote and missing local script sources
        if: matrix.lane == 'regression'
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/unapproved-script"
          mkdir -p "$fixture"
          cp -a public "$fixture/public"
          cp scripts/build.mjs "$fixture/build.mjs"
          cd "$fixture"
          for source in 'https://unapproved.invalid/script.js' 'missing.js'; do
            cp "$GITHUB_WORKSPACE/public/index.html" public/index.html
            printf '\n<script src="%s"></script>\n' "$source" >> public/index.html
            if node build.mjs > build.log 2>&1; then
              printf 'Unexpected build success for %s\n' "$source"
              exit 1
            fi
            grep -F 'Unapproved script entry in index.html' build.log
            test ! -e dist
          done
      - if: matrix.lane == 'regression'
        run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
      - name: Run native browser baseline, substitution, recovery and offline checks
        if: matrix.lane != 'regression'
        shell: bash
        env:
          BROWSER_ENGINE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/baseline"
          mkdir -p "$baseline"
          cp -a public "$baseline/public"
          git show 365a7a4519f8fa9952fbaf47b70cb3c7c0c38456:scripts/build.mjs > "$baseline/build.mjs"
          (cd "$baseline" && node build.mjs)
          node scripts/test-built-script-integrity-browser.mjs "$BROWSER_ENGINE" "$baseline/dist" dist
          node scripts/main1054-photo-review-discard-browser.mjs "$BROWSER_ENGINE" dist/app.js
          node scripts/main1054-photo-review-operation-feedback-browser.mjs "$BROWSER_ENGINE" dist/app.js
          node scripts/main1054-photo-review-remove-pending-browser.mjs "$BROWSER_ENGINE" dist/app.js
