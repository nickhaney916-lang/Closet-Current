name: Mission 1 P862 segmented subtype safe review — NO DEPLOY
on:
  push:
    branches: [research/mission1-segmented-subtype-review-862-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m1-p862-segmented-subtype-HOLD
  cancel-in-progress: true
jobs:
  native-owner-review-NO-DEPLOY:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin exact P861 parent and seven-file owner-safe delta
        shell: bash
        run: |
          set -euo pipefail
          BASE=bb7dfc69c6d11ef0daaa2c72a8ca90ab2cf78c34
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE" HEAD >/tmp/p862-paths
          cat /tmp/p862-paths
          test "$(wc -l </tmp/p862-paths)" -eq 7
          while IFS= read -r p; do
            case "$p" in
              public/local-worker.mjs|public/recognition-engine.mjs|tests/isolated-recognition.test.mjs|tests/mission1-empirical-confusion-modern-port-838.test.mjs|tests/mission1-segmented-subtype-review-862.test.mjs|research/mission1-segmented-subtype-review-862/REPORT.md|.github/workflows/mission1-segmented-subtype-review-862-no-deploy.yml) ;;
              *) echo "P862 UNAUTHORIZED PATH $p"; exit 1;;
            esac
          done </tmp/p862-paths
          test -z "$(git diff --name-only "$BASE" HEAD -- public/app.js public/recognition-confusion-guard.mjs public/local-catalog.mjs public/subtype-review-80.mjs public/clothing-memory.js scripts/ benchmark supabase)"
          grep -Fq 'Family Alpha HOLD #255 OPEN' research/mission1-segmented-subtype-review-862/REPORT.md
          grep -Fq "if(result.strong){" public/local-worker.mjs
          grep -Fq "reason:'mask_category_type_review'" public/recognition-engine.mjs
          grep -Fq 'const reviewFirst836=true;' public/app.js
          echo P862_SOURCE_SAFETY_SCOPE_PASS
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Actual source tests, full inherited native, safe builds and release BLOCKED
        run: |
          set -euo pipefail
          node --check public/local-worker.mjs
          node --check public/recognition-engine.mjs
          node --test tests/isolated-recognition.test.mjs tests/mission1-empirical-confusion-modern-port-838.test.mjs tests/mission1-segmented-subtype-review-862.test.mjs tests/mission1-real-worker-legacy-audit-857.test.mjs
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          P79_REQUIRE_DECODER=1 node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
          node scripts/m1-release-evidence-851.mjs | tee /tmp/p862-release
          grep -Fq '"status":"BLOCKED"' /tmp/p862-release
          grep -Fq '"shouldLiftFamilyAlphaHold":false' /tmp/p862-release
  desktop-review-NOT-real-phones:
    needs: native-owner-review-NO-DEPLOY
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium webkit
      - name: Desktop real UI safety, source and owner review, NOT physical devices
        run: |
          set -euo pipefail
          node scripts/test-m1-review-first-default-843.mjs
          node scripts/test-parallel80-subtype-browser.mjs
          node scripts/test-m1-owner-pair-admission-846.mjs
