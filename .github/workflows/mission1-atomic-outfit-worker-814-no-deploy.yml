name: Mission 1 P814 atomic generated outfit photo review worker — NO DEPLOY
on:
  push:
    branches: [research/mission1-atomic-outfit-worker-814-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mission1-P814-atomic-photo-HOLD
  cancel-in-progress: true
jobs:
  full-application-node-native-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact verified P813 parent and only 4 worker/test/research paths
        run: |
          set -euo pipefail
          BASE=621f2b78b077bdfa638cad3510b2a7c8ae926ac6
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD >/tmp/m1-P814-allowlist
          test "$(wc -l </tmp/m1-P814-allowlist)" -eq 4
          while read -r p; do
            case "$p" in
              public/outfit-worker.mjs|tests/outfit-worker.test.mjs|research/mission1-atomic-outfit-worker-814/REPORT.md|.github/workflows/mission1-atomic-outfit-worker-814-no-deploy.yml) ;;
              *) echo "UNAUTHORIZED SOURCE OR RELEASE CHANGE: $p"; exit 1 ;;
            esac
          done </tmp/m1-P814-allowlist
          test -z "$(git diff --name-only "$BASE" HEAD -- supabase benchmark)"
          grep -Fq 'FAMILY ALPHA HOLD #255' research/mission1-atomic-outfit-worker-814/REPORT.md
          echo M1_P814_EXACT_GREEN_P813_ONLY_FOUR_WORKER_PATHS_NO_DEPLOY
      - name: Install ephemeral app build/test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Full worker, original photo and application native regression
        run: |
          set -euo pipefail
          node --check public/outfit-worker.mjs
          node --test tests/outfit-worker.test.mjs tests/multi-garment-capture-01.test.mjs
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  independent-transactional-source-batch-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated worker dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2
      - name: Failure cannot produce partial user review even after first JPEG was generated
        run: |
          set -euo pipefail
          node --test tests/outfit-worker.test.mjs tests/multi-garment-capture-01.test.mjs tests/outfit-segmentation.test.mjs
          grep -Fq 'for(const piece of pieces)self.postMessage' public/outfit-worker.mjs
          grep -Fq 'OUTFIT_SOURCE_BATCH_MEMORY_CAP' public/outfit-worker.mjs
          echo M1_P814_SOURCE_JPEG_CROP_ATOMIC_NO_PARTIAL_OWNER_QUEUE_HOLD
