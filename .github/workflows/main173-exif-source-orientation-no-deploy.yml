name: MAIN173 original-JPEG EXIF coordinate integrity NO DEPLOY HOLD
on:
  push:
    branches:
      - research/main1054-m173-exif-source-orientation-HOLD
  pull_request:
    branches:
      - research/main1054-m58-real-p88-browser-worker-HOLD
permissions:
  contents: read
jobs:
  exif-source-and-full-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact isolated M171 ancestry, sources and three-path scope
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=70979e63a317c90403e4a53c375360f7096b7603
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse HEAD:research/capture-proof-01/source-proof.mjs)" = 74e0a82b3d0e7ec88c5c2c21ce88b3faf6c7ba88
          test "$(git rev-parse HEAD:research/parallel96-highres/source-derivative-intake96.mjs)" = 1840c4496aefc28941f4c3de24a29bac1cb5e792
          test "$(git rev-parse HEAD:tests/parallel96-highres-source-derivative.test.mjs)" = 2d913221968d4c09d9be33068efa80ef45b9de9b
          test "$(git rev-parse HEAD:public/outfit-board.js)" = 5668a4bc6da2e94fc13d23392cd7fb4981d0bc2d
          git diff --name-only "$BASE" HEAD | while IFS= read -r file; do
            case "$file" in
              research/parallel96-highres/source-derivative-intake96.mjs|tests/parallel96-highres-source-derivative.test.mjs|.github/workflows/main173-exif-source-orientation-no-deploy.yml) ;;
              *) echo "M173 out-of-scope change: $file"; exit 1 ;;
            esac
          done
          node --check research/parallel96-highres/source-derivative-intake96.mjs
          node --check tests/parallel96-highres-source-derivative.test.mjs
      - name: Exercise EXIF forged-upright and mirrored-source rejection
        run: node --test tests/parallel96-highres-source-derivative.test.mjs
      - name: Install isolated no-deploy application test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Build native PWA locally without deployment
        run: node scripts/build.mjs
      - name: Full inherited original-owner and privacy Node regression
        run: node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  genuine-source-model-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M58_ENGINE: ${{ matrix.engine }}
      P94_WIDTH: '390'
      P96_NATIVE_4K: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure exact original fixtures and source-lease/mask guards unchanged
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD:research/parallel96-highres/source-derivative-intake96.mjs)" = 1840c4496aefc28941f4c3de24a29bac1cb5e792
          test "$(git rev-parse HEAD:scripts/test-parallel96-native-highres-browser.mjs)" = 58194c1bbcfca7b46f1c71b1ee0cc00c3dbc88c7
          test "$(git rev-parse HEAD:benchmark/fixtures/commons-artist-cowrie-original-4000x6000-cc-by-sa-4.0.jpg)" = 27864552c036f9bf089be147531c4da8ccdcb7d7
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
      - name: Install isolated actual-browser model toolchain
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Build native offline test PWA
        run: node scripts/build.mjs
      - name: Actual P88 WASM on unmodified licensed 4000x6000 original with source-safe review and 2D
        run: node scripts/test-parallel96-native-highres-browser.mjs
