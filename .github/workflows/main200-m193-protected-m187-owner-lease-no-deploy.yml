name: MAIN200 M193 protected M187 owner original photo preflight lease NO DEPLOY HOLD
on:
  push:
    branches: [research/main200-m193-protected-m187-owner-lease-HOLD]
  pull_request:
    branches: [research/main193-protected-m58-m192-source-guard-HOLD]
    paths:
      - .github/workflows/main200-m193-protected-m187-owner-lease-no-deploy.yml
permissions:
  contents: read
jobs:
  private-lease-and-inherited-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source pin baseline, require exact native lease fix, deny unrelated changes
        shell: bash
        run: |
          set -euo pipefail
          BASE=f2befed4c776786dc11843b98fafec72f2d9c202
          git merge-base --is-ancestor "$BASE" HEAD
          # M200 source-bound inheritance: exact independently proven M190 original
          # retire/revoke index and original nine-case signed-owner photo regression.
          test "$(git rev-parse HEAD:public/native-owner-wardrobe-index-167.mjs)" = 674797958366cc976a1a4abc8073087148d22975
          test "$(git rev-parse HEAD:tests/main190-retired-duplicate-owner-index.test.mjs)" = cf9fd805e3a257378ac658b23d50a9a9339daa0c
          test "$(git rev-parse HEAD:public/native-outfit-source-plan-p99.mjs)" = 0d4972a7fddfcfae0dd811765e4a94b962f4b578
          test "$(git rev-parse HEAD:public/native-2d-preview-p99.mjs)" = 62bad171a97030846b0f1bb3bab740dec20ac5e7
          test "$(git rev-parse HEAD:public/outfit-board.js)" = b8ed5ebe18e81ec3f8f5659257289b8217a6877b
          test "$(git rev-parse HEAD:public/outfit-capture.js)" = 8d55715ef09e34086d3c401ec38340bfc25f5fe8
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          git diff --name-only "$BASE" HEAD | while IFS= read -r file; do
            case "$file" in
              public/native-outfit-source-plan-p99.mjs|tests/main187-required-owner-assert-current.test.mjs|.github/workflows/main187-required-owner-lease-no-deploy.yml|public/native-2d-preview-p99.mjs|tests/main188-owner-revoked-outfit-preview.test.mjs|.github/workflows/main188-owner-revoked-original-preview-no-deploy.yml|.github/workflows/main189-lease-revocation-crossmission-no-deploy.yml|research/master-consolidation-1054/M189-OWNER-REVOCATION-ADMISSION-HOLD.md|.github/workflows/main1054-m58-real-p88-worker-no-deploy.yml|.github/workflows/main173-unflagged-owner-24mp-no-deploy.yml|.github/workflows/main181-zero-proposal-native-no-deploy.yml|.github/workflows/main180-unmodified-webkit-firstload-no-deploy.yml|.github/workflows/main183-outfit-session-epoch-no-deploy.yml|public/native-owner-wardrobe-index-167.mjs|tests/main190-retired-duplicate-owner-index.test.mjs|.github/workflows/main192-m189-m190-source-convergence-no-deploy.yml|.github/workflows/main193-m192-protected-m58-candidate-no-deploy.yml|.github/workflows/main200-m193-protected-m187-owner-lease-no-deploy.yml) ;;
              *) echo "M187 unexpected modified path: $file"; exit 1 ;;
            esac
          done
          git diff --exit-code "$BASE" HEAD -- public/app.js public/auth.js public/native-default-atomic-import-m3.mjs public/native-default-verified-backup-export-m3.mjs public/outfit-worker-p94.mjs supabase/ benchmark/
          node --check public/native-outfit-source-plan-p99.mjs
          node --check tests/main187-required-owner-assert-current.test.mjs
      - name: Five negative and positive current-session owner lease cases
        run: node --test tests/main187-required-owner-assert-current.test.mjs
      - name: Pinned test dependency installation; no deploy or hosted writes
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Full inherited Node security and original-photo source suite
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  genuine-built-normal-app:
    name: genuine unflagged original-photo outfit (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      P99_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin exact M187 source and original two-engine P99 test code
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # M200 source-bound inheritance: exact independently proven M190 original
          # retire/revoke index and original nine-case signed-owner photo regression.
          test "$(git rev-parse HEAD:public/native-owner-wardrobe-index-167.mjs)" = 674797958366cc976a1a4abc8073087148d22975
          test "$(git rev-parse HEAD:tests/main190-retired-duplicate-owner-index.test.mjs)" = cf9fd805e3a257378ac658b23d50a9a9339daa0c
          test "$(git rev-parse HEAD:public/native-outfit-source-plan-p99.mjs)" = 0d4972a7fddfcfae0dd811765e4a94b962f4b578
          test "$(git rev-parse HEAD:scripts/test-parallel99-normal-app-browser.mjs)" = 9b8c3b37d1d8116e4bf9bc6dbf7ea82e2752433d
          test "$(git rev-parse HEAD:public/native-2d-preview-p99.mjs)" = 62bad171a97030846b0f1bb3bab740dec20ac5e7
      - name: Install pinned app dependencies; no network during PWA acceptance
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Build unflagged native app without deploy
        run: node scripts/build.mjs
      - name: Chromium or WebKit phone-width original photo to outfit and v3 restore
        shell: bash
        run: |
          set -euo pipefail
          for width in 320 390 430; do
            P99_WIDTH="$width" node scripts/test-parallel99-normal-app-browser.mjs
          done
