name: Main1054 Assignment 39 private import transaction HOLD
on:
  pull_request:
    branches: [research/main1054-private-import-pending-HOLD]
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'research/main1054-assignment39-import-transaction-HOLD' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact application baseline and acceptance-only scope
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          baseline=8c1f2a4030e55279093717edd1486d9d620ecc8f
          test "$PR_BASE" = "$baseline"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          git merge-base --is-ancestor "$baseline" HEAD
          printf '%s\n' '.github/workflows/main1054-assignment39-import-transaction-HOLD.yml' 'scripts/test-mission3-default-atomic-import-browser.mjs' > "$RUNNER_TEMP/expected-paths"
          git diff --name-only "$baseline" HEAD > "$RUNNER_TEMP/actual-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Build twice and compare every output byte
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          cp -a dist "$RUNNER_TEMP/first-build"
          node scripts/build.mjs
          diff -qr "$RUNNER_TEMP/first-build" dist
      - name: Native IndexedDB import at 320, 390 and 430 pixels in Chromium and WebKit
        env:
          CLOSET_IMPORT_BUILD_DIR: dist
        run: node scripts/test-mission3-default-atomic-import-browser.mjs assignment39-receipt
      - name: Full regression
        if: success() || failure()
        run: node --test --test-concurrency=1 --test-timeout=60000 tests/*.cjs tests/*.mjs
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: assignment39-private-import-receipt
          path: assignment39-receipt/
          if-no-files-found: error
          retention-days: 14
