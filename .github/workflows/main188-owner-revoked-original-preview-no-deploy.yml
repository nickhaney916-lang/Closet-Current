name: MAIN188 deleted and source-revoked owner original 2D NO DEPLOY HOLD
on:
  push:
    branches: [research/main188-owner-revoked-outfit-preview-HOLD]
  pull_request:
    branches: [research/main187-private-assert-current-contract-HOLD]
    paths:
      - public/native-outfit-source-plan-p99.mjs
      - public/native-2d-preview-p99.mjs
      - tests/main188-owner-revoked-outfit-preview.test.mjs
      - .github/workflows/main188-owner-revoked-original-preview-no-deploy.yml
permissions:
  contents: read
jobs:
  source-revocation-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin M187 parent and deny all unrelated source, host or privacy edits
        shell: bash
        run: |
          set -euo pipefail
          BASE=0704de7694a4a8668094f2e705833a4132e51fc6
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | while IFS= read -r f; do
            case "$f" in
              public/native-outfit-source-plan-p99.mjs|public/native-2d-preview-p99.mjs|tests/main188-owner-revoked-outfit-preview.test.mjs|.github/workflows/main188-owner-revoked-original-preview-no-deploy.yml) ;;
              *) echo "M188 unexpected source change: $f"; exit 1 ;;
            esac
          done
          test "$(git rev-parse HEAD:public/outfit-board.js)" = b8ed5ebe18e81ec3f8f5659257289b8217a6877b
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
          test "$(git rev-parse HEAD:public/app.js)" = 835b4ad1f4a4a7f520aad5afd225134e5ea56e2d
          git diff --exit-code "$BASE" HEAD -- public/auth.js public/native-default-atomic-import-m3.mjs public/native-default-verified-backup-export-m3.mjs supabase/ benchmark/
          node --check public/native-outfit-source-plan-p99.mjs
          node --check public/native-2d-preview-p99.mjs
          node --check tests/main188-owner-revoked-outfit-preview.test.mjs
      - name: Genuine licensed original-photo source revocation safety cases
        run: node --test tests/main188-owner-revoked-outfit-preview.test.mjs
      - name: Install pinned offline build and inherited test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Inherited full private/owner regression and unchanged app build
        run: |
          node scripts/build.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
  true-normal-app:
    name: original photo outfit native (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --shm-size=1gb
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      P99_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protected genuine original-photo WebKit and Chromium acceptance source pins
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD:scripts/test-parallel99-normal-app-browser.mjs)" = 9b8c3b37d1d8116e4bf9bc6dbf7ea82e2752433d
          test "$(git rev-parse HEAD:public/outfit-board.js)" = b8ed5ebe18e81ec3f8f5659257289b8217a6877b
          test "$(git rev-parse HEAD:public/outfit-worker-p94.mjs)" = ab7d3837139c5b7d693383f9d6617e199ec8de4f
      - name: Install original browser test and build dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3 pg@8.16.3
      - name: Offline build normal unflagged closet PWA
        run: node scripts/build.mjs
      - name: Original licensed JPEG synthetic-reviewed owner outfit at three widths
        shell: bash
        run: |
          set -euo pipefail
          for width in 320 390 430; do
            P99_WIDTH="$width" node scripts/test-parallel99-normal-app-browser.mjs
          done
