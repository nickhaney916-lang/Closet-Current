name: M1 P836 opt-in review-first recognition — NO DEPLOY
on:
  push:
    branches: [research/mission1-review-first-no-auto-admission-836-HOLD]
  pull_request:
    branches: [research/mission1-real-16-original-recognition-audit-834-HOLD]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m1-p836-review-first-HOLD-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-review-first-native-HOLD:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact green P834 parent, four allowed files and unmodified model/cloud/source
        run: |
          set -euo pipefail
          BASE=beb7f27b18f70faa32c94ca2ac5d4260e83f0f0f
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD >/tmp/p836-paths
          cat /tmp/p836-paths
          test "$(wc -l </tmp/p836-paths)" -eq 4
          while IFS= read -r p; do
            case "$p" in
              public/app.js|tests/automatic-indexing.test.cjs|research/mission1-review-first-no-auto-admission-836/REPORT.md|.github/workflows/mission1-review-first-no-auto-admission-836-no-deploy.yml) ;;
              *) echo "UNAUTHORIZED FILE IN P836: $p"; exit 1 ;;
            esac
          done </tmp/p836-paths
          test -z "$(git diff --name-only "$BASE" HEAD -- public/local-worker.mjs public/recognition-engine.mjs public/local-catalog.mjs public/recognition-vectors.bin public/recognition-vectors.json supabase benchmark)"
          grep -Fq 'FAMILY ALPHA HOLD #255' research/mission1-review-first-no-auto-admission-836/REPORT.md
          echo NO_DEPLOY_ONLY_MANUAL_REVIEW_TRIAL
      - name: Install ephemeral native test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 sharp@0.34.3 fake-indexeddb@6.2.4 three@0.180.0 three-mesh-bvh@0.9.2 axe-core@4.10.3
      - name: Verify application, trial build and all native regressions (no hosted services)
        run: |
          set -euo pipefail
          node --check public/app.js
          node --test tests/automatic-indexing.test.cjs
          node scripts/build.mjs
          node scripts/build-m1-no-account-trial-831.mjs
          node --test --test-concurrency=1 tests/*.cjs tests/*.mjs
