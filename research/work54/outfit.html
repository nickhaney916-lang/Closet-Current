<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reviewed source layering comparison</title><style>body{font:16px system-ui;background:#edf2f1;color:#203b36;margin:12px}h1{font-size:22px}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}figure{margin:0;background:white;border-radius:12px;padding:8px;min-width:0}figcaption{min-height:4em}#before,#after{position:relative;width:100%;aspect-ratio:3/5;background:#f3f4f6}#before>.family-alpha-avatar{width:100%!important}canvas{position:absolute;inset:0;width:100%;height:100%}img{max-width:100%}a{overflow-wrap:anywhere}</style><h1>Licensed shirt + skirt: waist and layer placement</h1><p>Same source cutouts, existing humanoid and layer order. Proposals require review; no styling or fit approval.</p><div class="pair"><figure><figcaption>Previous automatic containment</figcaption><div id="before"></div></figure><figure><figcaption>New source-based starting fits</figcaption><div id="after"></div></figure></div><p id="credits"></p><script type="module">
import {createAlphaHumanoidFigure,renderPhotoLayers} from '../../public/family-alpha-2d-photo-renderer.mjs';import {planPhotoLayers} from '../../public/family-alpha-2d-layer-plan.mjs';import {paintGarmentFit} from '../work47/fit.mjs';import {createHumanoidForegroundOverlay} from '../work47/occlusion.mjs';import {protectCollarPixels} from '../work48/collar-occlusion.mjs';
const m=await(await fetch('/benchmark/work54/manifest.json')).json(),rows=['commons-0003','commons-0043'].map(id=>m.rows.find(r=>r.id===id)),images={};for(const row of rows){const blob=new Blob([await(await fetch('/benchmark/work54/assets/'+row.id+'.png')).arrayBuffer()],{type:'image/png'}),url=await new Promise(resolve=>{const f=new FileReader();f.onload=()=>resolve(f.result);f.readAsDataURL(blob);}),im=new Image();im.src=url;await im.decode();images[row.id]=im;const a=document.createElement('a');a.textContent=row.id+' · '+row.attribution.author+' · '+row.attribution.license;a.href=row.attribution.source;document.querySelector('#credits').append(a,document.createElement('br'));}
const selections=rows.map(row=>({slot:row.profile.slot,itemId:row.id,sourceIdentity:row.id,sourceVersion:row.sourceSHA256}));renderPhotoLayers(document.querySelector('#before'),selections,images);const host=document.querySelector('#after');host.append(createAlphaHumanoidFigure(document));const canvases=[];for(const layer of planPhotoLayers(selections)){const row=rows.find(r=>r.id===layer.itemId);if(row.startingFit.status!=='suggested')throw Error('No starting fit');const c=document.createElement('canvas');c.dataset.slot=layer.slot;paintGarmentFit(c,images[row.id],row.startingFit.profile,row.startingFit.adjust);host.append(c);canvases.push(c);}const fg=createHumanoidForegroundOverlay(document);protectCollarPixels(fg,canvases);host.append(fg);document.body.dataset.ready='true';
</script></html>
