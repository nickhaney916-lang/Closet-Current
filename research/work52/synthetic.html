<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pale isolation reference benchmark</title><style>body{font:16px system-ui;margin:16px;background:#edf1f2;color:#183138}figure{margin:12px 0;padding:12px;background:white;border-radius:12px}img{max-width:100%;width:256px;image-rendering:pixelated;background:repeating-conic-gradient(#ddd 0% 25%,white 0% 50%) 0/16px 16px}h1{font-size:24px}select{min-height:44px;max-width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere}#fit{max-width:300px}</style><h1>Pale fabric: measured reference masks</h1><p>Unapproved reversible proposals · Family Alpha HOLD</p><select id="sample"></select><figure>Original source<br><img id="original"></figure><figure>Previous automatic proposal<br><img id="before"></figure><figure>Improved proposal — review required<br><img id="after"></figure><figure>Existing humanoid, unchanged rigid fit<div id="fit"></div></figure><pre id="metrics"></pre><script type="module">
import {renderFit} from '../work48/render.mjs';
const rows=await(await fetch('/benchmark/work52/synthetic/metrics.json')).json(),$=id=>document.getElementById(id);for(const r of rows){const o=document.createElement('option');o.value=r.id;o.textContent=r.id;$('sample').append(o);}
async function show(id){document.body.dataset.ready='false';const r=rows.find(r=>r.id===id);for(const kind of ['original','before','after']){$(kind).src='/benchmark/work52/synthetic/'+id+'-'+kind+'.png';await $(kind).decode();}renderFit($('fit'),$('after'),{slot:'top',anchors:[[30/128,50/160],[98/128,50/160]],target:[[113,151],[247,151]]});$('metrics').textContent=JSON.stringify(r,null,2);document.body.dataset.ready=id;}
$('sample').onchange=()=>show($('sample').value);await show(rows[0].id);
</script></html>
