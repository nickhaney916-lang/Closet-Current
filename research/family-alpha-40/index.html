<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Still capture research</title><style>body{font:16px/1.4 system-ui;background:#f7f5fa;color:#272331;margin:0}main{max-width:430px;margin:auto;padding:16px}h1{font-size:1.3rem}button,input,select{font:inherit}button,select{min-height:48px;padding:8px;border:1px solid #594376;border-radius:9px;background:white;color:#272331}button:disabled{opacity:.5}.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}img,video{display:block;width:100%;max-height:42vh;object-fit:contain;background:#e5e1e8}label{display:block;margin-top:12px}input{max-width:100%}[hidden]{display:none!important}</style></head><body><main><h1>Clothing photos</h1><p>Include the whole item. Research preview only: nothing is saved to your closet.</p>
<div class="row"><button id="open">Open camera</button><button id="stop" hidden>Stop camera</button></div><video id="video" playsinline muted hidden></video>
<div class="row"><button id="shot" hidden>Take photo</button><label for="seconds">Timed photos</label><select id="seconds"><option value="3">Every 3 seconds</option><option value="5" selected>Every 5 seconds</option><option value="10">Every 10 seconds</option></select><button id="auto" hidden>Start timed</button></div>
<label for="native">Phone camera photo</label><input id="native" type="file" accept="image/*" capture="environment"><label for="import">Choose existing photo</label><input id="import" type="file" accept="image/*">
<h2>Latest photo</h2><img id="preview" alt="Latest safe photo" hidden><p id="status" role="status">No photo yet.</p><p id="details"></p></main>
<script src="../../public/photo-import.js"></script><script type="module" src="./ui.mjs"></script></body></html>
